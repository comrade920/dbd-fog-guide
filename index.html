액이 새어나오는 것을 방지하는 용도로의 흡수력이 높은 패드.<br><br>치료 속도가 <b>15%<\/b> <b>빨라진다<\/b>.","r":3,"c":"sa","it":"medkit"},{"id":"Addon_Medkit_BlightedSyringe","ko":"정제된 점액","en":"Refined Serum","d":"썩은 점액의 정제된 버전으로 식용이 가능할 만큼 거의 안전하다. \"거의.\"<br><br>구급상자로 치료 중일 경우, <i>추가 상호작용 버튼<\/i>을 눌러 정제된 점액을 사용할 수 있다.<b>20초<\/b> 동안 생존자에게 <b>5%의 이동 속도 증가<\/b> 효과를 부여하며 시야각은 <b>10도<\/b> <b>증가한다<\/b>.생존자가 지나간 자리에 황폐한 입자가 남는다.사용 즉시 구급상자를 소모한다.","r":0,"c":"sa","it":"medkit"},{"id":"ADDON_medkit_gauzeroll","ko":"거즈 두루마리","en":"Gauze Roll","d":"다양한 상처에 활용할 수 있는 멸균 거즈. 종합 치료 용품의 구성품.<br><br>구급상자에 <b>내구도 10<\/b>을 추가한다.","r":2,"c":"sa","it":"medkit"},{"id":"ADDON_medkit_needleandthread","ko":"실과 바늘","en":"Needle & Thread","d":"공식적인 의료 도구는 아니다. 다소 고통스러운 방법이지만 빠르게 상처를 봉합할 수 있다.<br><br>스킬 체크의발생 빈도가 <b>10%<\/b> <b>증가한다<\/b>.스킬 체크 대성공 시 진척도 보너스가 <b>5%<\/b> <b>증가한다<\/b>.","r":1,"c":"sa","it":"medkit"},{"id":"ADDON_medkit_selfadherentwrap","ko":"자기 접착 붕대","en":"Self Adherent Wrap","d":"클립이 필요 없이 스스로 고정되어 상처 부위를 빠르게 지혈이 가능한 붕대.<br><br>구급상자에 내구도를 <b>8<\/b> 추가한다.치료 속도가 <b>5%<\/b> <b>빨라진다<\/b>.","r":1,"c":"sa","it":"medkit"},{"id":"ADDON_medkit_surgicalsuture","ko":"수술용 봉합선","en":"Surgical Suture","d":"절개된 부위를 봉합하는데 사용하는 의료용 도구. 매우 효과적이지만 사용하기 어렵다.<br><br>스킬 체크의 발생 빈도가 <b>15%<\/b> <b>증가한다<\/b>.스킬 체크 대성공 시 진척도 보너스가 <b>10%<\/b> <b>증가한다<\/b>.","r":2,"c":"sa","it":"medkit"},{"id":"Addon_PhantomTrap_BloodiedMud","ko":"피투성이 진흙","en":"Bloodied Mud","d":"깊은 진홍색의 혈관이 있는 소량의 진흙. 피의 막이 진흙의 힘을 강화한다.<br><br><b>환영 덫<\/b>의 발동 범위가 <b>30% 감소한다<\/b>.","r":2,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_BloodiedWater","ko":"피섞인 물","en":"Bloodied Water","d":"접혀진 수련 잎 안에 오래되어 썩은 물이 고여있다.<br><br><b>환영 덫<\/b>의 발동 범위가 <b>20% 감소한다<\/b>.","r":1,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_BogWater","ko":"늪지대 물","en":"Bog Water","d":"탁한 물이 들어 있는 유리 약병. 지금과는 다른 시대에서 떠내려온 것 같다.<br><br><b>환영 덫<\/b>의 발동 범위가 <b>10% 감소한다<\/b>.","r":0,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_CrackedTurtleEgg","ko":"깨진 거북알","en":"Cracked Turtle Egg","d":"깨지고 비어 있는 옅은 오렌지색 거북이 알.<br><br><b>환영 덫<\/b>이 발동되는 지속 시간이 <b>30%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_CypressNecklet","ko":"사이프러스 목걸이","en":"Cypress Necklet","d":"삼나무 껍질과 늪지 이끼로 죽은 식물의 줄기를 조잡하게 장식한 목걸이.<br><br><b>환영 덫<\/b>의 설치 속도가 <b>15% 빨라진다<\/b>.","r":1,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_DeadFlyMud","ko":"죽은 파리 진흙","en":"Dead Fly Mud","d":"파리의 시체들로 검어진 작은 진흙 덩어리. 먹어치우면 스태미나가 보충된다.<br><br>순간 이동 사거리가 <b>10%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_DisfiguredEar","ko":"심하게 훼손된 귀","en":"Disfigured Ear","d":"머리를 자주 맞아서 변형된 식인종 마을 귀머거리 소년의 귀. 갇혀있는 생명력의 정수가 엄청난 잠재력을 일깨운다.<br><br><b>환영 덫<\/b>을 발동시킨 생존자의 청력이 <b>6초<\/b> 동안 마비된다.","r":3,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_DragonflyWings","ko":"잠자리 날개","en":"Dragonfly Wings","d":"한 줌의 누런 날개들. 마르고 바삭한 촉감이다. 먹어치우면 스태미나가 보충된다.<br><br>환영 덫으로 순간 이동할 수 있는 거리가 <b>12.5%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_DriedCicada","ko":"말린 매미","en":"Dried Cicada","d":"얇은 재로 덮인 큰 늪지대의 매미 시체. 바삭한 촉감이다. 먹어치우면 스태미나가 보충된다.<br><br>환영 덫으로 순간이동할 수 있는 거리가 <b>15%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_GranmasHeart","ko":"노파의 심장","en":"Grandma's Heart","d":"식인종 마을 장로의 차가운 심장. 갇혀있는 생명력의 정수가 엄청난 잠재력을 일깨운다.<br><br>생존자가 <b>환영 덫<\/b>을 발동시키면 공포 범위가 <b>0미터<\/b>로 <b>감소한다<\/b>.환영의 공포 범위가 <b>16미터<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_HalfEggshell","ko":"달걀 껍질 반쪽","en":"Half Eggshell","d":"완전히 둥글고 비어있는 반쪽 짜리 알 껍질.<br><br><b>환영 덫<\/b>이 발동되는 지속 시간이 <b>25%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_MintRag","ko":"민트색 누더기","en":"Mint Rag","d":"리사 셔우드가 실종된 날에 입고 있었던 드레스에서 찢어진 작은 조각. 갇혀 있는 생명력의 정수가 엄청난 잠재력을 일깨운다.<br><br><b>해그<\/b>가 자신의 <b>환영 덫<\/b>으로 순간 이동할 수 있는 사거리가 무제한이 된다.생존자가 발동시키지 않은 <b>환영 덫<\/b>으로 순간 이동 할 수 있다. 이 능력은 <b>10초<\/b>의 재사용 대기 시간을 가진다.","r":4,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_PowderedEggshell","ko":"달걀 껍질 가루","en":"Powdered Eggshell","d":"옅은 금색으로 빛나는 미세한 알 조각.<br><br><b>환영 덫<\/b>이 발동되는 지속 시간이 <b>20%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_PussyWillowCatkins","ko":"갯버들꽃","en":"Pussy Willow Catkins","d":"질 좋은 회색털로 덮여있는 소량의 작고 깨끗한 꽃송이.<br><br><b>환영 덫<\/b>을 발동시킨 생존자의 오라를 <b>3초<\/b> 동안 볼 수 있다.","r":1,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_RopeNecklet","ko":"줄기 목걸이","en":"Rope Necklet","d":"죽은 식물 줄기로 만든 단단한 목걸이.<br><br><b>환영 덫<\/b>의 설치 속도가 <b>10% 빨라진다<\/b>.","r":0,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_RustyShackles","ko":"녹슨 족쇄","en":"Rusty Shackles","d":"식인종 마을의 지하감옥에서 납치된 사람과 시체를 묶어두던 족쇄. 갇혀있는 생명력의 정수가 엄청난 잠재력을 일깨운다.<br><br>발동된 <b>환영 덫<\/b>은 발동할 때 생존자에게 알람을 주지 않으며, 환영을 생성하지 않는다.","r":3,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_ScarredHand","ko":"흉터난 손","en":"Scarred Hand","d":"식인종 마을 도살자의 잘려진 손. 갇혀 있는 생명력의 정수가 해그의 엄청난 잠재력을 일깨운다.<br><br>환영이 점차 선명해지고 생존자를 막는다.환영 덫으로 순간 이동할 수 있는 능력이 사라진다.<b>300%<\/b>의 기만 블러드포인트를 보너스로 획득한다.","r":3,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_SwampOrchidNecklet","ko":"늪지 난초 목걸이","en":"Swamp Orchid Necklet","d":"시든 난초의 꽃과 나뭇잎으로 죽은 식물의 줄기를 조잡하게 장식한 목걸이.<br><br><b>환영 덫<\/b>의 설치 속도가 <b>20% 빨라진다<\/b>.","r":2,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_WaterloggedShoe","ko":"축축한 신발","en":"Waterlogged Shoe","d":"오랫동안 늪지대를 떠돈 어린아이의 신발. 갇혀있는 생명력의 정수가 엄청난 잠재력을 일깨운다.<br><br>발동된 <b>환영 덫<\/b>의 구간 안에 생존자는 <b>9%<\/b>의 <b>근육 손상<\/b> 상태에 걸린다.이동 속도가 <b>7.5%<\/b> <b>빨라진다<\/b>.덫으로 순간 이동하는 능력을 제거한다.<br><br><b>근육 손상<\/b>은 생존자의 이동 속도를 감소시킨다.","r":4,"c":"ka","o":"Witch"},{"id":"Addon_PhantomTrap_WillowWreath","ko":"버드나무 화환","en":"Willow Wreath","d":"3개의 버드나무 가지를 붙여 만든 삼각형의 화환.<br><br><b>환영 덫<\/b>을 발동시킨 생존자의 오라를 <b>5초<\/b> 동안 볼 수 있다.","r":2,"c":"ka","o":"Witch"},{"id":"Addon_PhaseWalker_BloodyHairBrooch","ko":"어머니의 안경","en":"Mother's Glasses","d":"지병을 앓고 있는 자애로운 어머니의 안경.<br><br>껍질에서부터 <b>2미터<\/b> 이내에 생존자가 들어설 경우, 생존자는 살인마의 본능을 발동시킨다.","r":2,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_DirtyUwabaki","ko":"둥근 부채","en":"Uchiwa","d":"한 여름날에 시원한 바람을 만들어주는 비단잉어가 그려진 손풍기.<br><br>판자에 의해 기절했을 때, <b>야마오카의 원혼<\/b>이 즉시 재충전된다.","r":2,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_DriedCherryBlossom","ko":"마른 벚꽃","en":"Dried Cherry Blossom","d":"말라서 바스러진 벚꽃잎. 한때 삶의 덧없음의 상징이었다.<br><br>야마오카의 원혼 능력을 사용하는 중에 <b>스피릿<\/b>이 있는 곳 <b>3미터<\/b> 이내에 생존자가 들어설 경우, 생존자는 살인마의 본능을 발동시킨다.<b>영적 세계<\/b>에서 생존자의 긁힌 자국이 보이지 않게 된다.","r":3,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_FathersGlasses","ko":"킨츠키 찻잔","en":"Kintsugi Teacup","d":"금가루로 옻칠한 컵. 금이 간 부분과 수리한 부분 모두 컵의 일부이다.<br><br>판자 또는 부서지기 쉬운 문에 기본 파괴를 수행할 때마다, <b>야마오카의 원혼<\/b>이 즉시 재충전된다.","r":4,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_GiftedBambooComb","ko":"선물 받은 대나무 빗","en":"Gifted Bamboo Comb","d":"촘촘한 빗살을 가진 대나무 빗. 헝클어진 머리카락을 부드럽게 풀어준다.<br><br><b>야마오카의 원혼<\/b> 충전 속도가 <b>15% 빨라진다<\/b>.","r":0,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_JuniperBonsai","ko":"향나무 분재","en":"Juniper Bonsai","d":"어두운 청록색의 잎을 가진 분재 나무. 한때 야마오카 가문을 대표하던 상징이었다.<br><br>잔상의 빈도가 <b>20%<\/b> <b>증가한다<\/b>.잔상의 흔적 지속 시간이 <b>50%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_KaiunTalisman","ko":"행운의 부적","en":"Kaiun Talisman","d":"행운이 항상 당신의 편이길 염원하는 부적.<br><br><b>야마오카의 원혼<\/b> 지속 시간이 <b>25% 증가한다<\/b>.","r":1,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_KatanaTsuba","ko":"카타나 츠바","en":"Katana Tsuba","d":"조상 대대로 전해내려오는 검의 보호대. 야마오카 가문에서 직접 만들었다.<br><br><b>영적 세계에서 돌아와<\/b> 다시 모습을 드러내는 데 걸리는 시간이 <b>20% 증가한다<\/b>.<b>영적 세계에서 돌아와<\/b> 다시 모습을 드러낼 때 이동속도가 <b>5% 빨라진다<\/b>.","r":2,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_KatsumoriTalisman","ko":"선향불꽃","en":"Senko Hanabi","d":"여름밤을 밝히고 인생의 덧없는 순간들의 아름다움을 보여주는 작은 폭죽.<br><br><b>야마오카의 원혼<\/b>이 끝나면, <b>스피릿<\/b>의 껍질이 폭발하며 <b>4미터<\/b> 내 모든 창틀 위치가 <b>5초<\/b> 간 막힌다.","r":2,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_MotherDaughterRing","ko":"모녀 반지","en":"Mother-Daughter Ring","d":"\"소중한 나의 딸\"이라는 글씨가 새겨져 있는 은반지.<br><br><b>야마오카의 원혼<\/b> 이동 속도가 <b>25% 증가한다<\/b>.<b>야마오카의 원혼<\/b>을 사용할 경우, 생존자의 긁힌 자국이 보이지 않게 된다.","r":4,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_MuddySportsDayCap","ko":"진흙투성이 스포츠 모자","en":"Muddy Sports Day Cap","d":"고등학교 로고가 박힌 진흙투성이의 스포츠 모자. \"린\"의 이름이 바느질되어있다.<br><br><b>야마오카의 원혼<\/b> 이동 속도가 <b>10% 빨라진다<\/b>.","r":1,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_OrigamiCrane","ko":"종이학","en":"Origami Crane","d":"한 마리의 종이학. 천 마리의 학을 접으면 소원이 이루어진다고 한다.<br><br><b>야마오카의 원혼<\/b> 재충전율이 <b>20% 증가한다<\/b>.","r":0,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_PrayerBeadsBracelet","ko":"풍경","en":"Furin","d":"발코니 천장에 매달려 따뜻한 여름 바람에 흔들리는 작은 종.<br><br>영적 세계 이동이 모든 생존자들에게 들린다.","r":3,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_RinsBrokenWatch","ko":"린의 고장난 시계","en":"Rin's Broken Watch","d":"유리가 깨진 손목시계. 손목밴드 부분에 \"린\"이라는 이름이 적혀있다.<br><br><b>야마오카의 원혼<\/b> 회복 속도가 <b>30% 증가한다<\/b>.","r":1,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_RustyFlute","ko":"녹슨 플루트","en":"Rusty Flute","d":"소름끼치는 소리를 내는 녹슨 플루트.<br><br><b>야마오카의 원혼<\/b> 재충전율이 <b>40% 증가한다<\/b>.","r":2,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_ShiawaseAmulet","ko":"행복의 부적","en":"Shiawase Amulet","d":"지닌 이가 진심으로 행복하길 염원하기 위해 만든 부적.<br><br><b>야마오카의 원혼<\/b> 지속 시간이 <b>15% 증가한다<\/b>.","r":0,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_WakizashiSaya","ko":"와키자시 칼집","en":"Wakizashi Saya","d":"조상 대대로 전해내려오는 칼집. 야마오카 가문에서 직접 만들었다.<br><br><b>야마오카의 원혼 동안<\/b>, <i>능력 활성화 버튼<\/i>을 사용하여 껍질로 돌아가며 원혼을 끝낸다.","r":3,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_WhiteHairRibbon","ko":"하얀 리본","en":"White Hair Ribbon","d":"흐트러진 머리를 다듬어주는 비단 재질의 리본.<br><br><b>야마오카의 원혼<\/b> 충전 속도가 <b>20% 빨라진다<\/b>.","r":1,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_YakuyokeAmulet","ko":"액막이 부적","en":"Yakuyoke Amulet","d":"지닌 이를 뜻밖의 재앙으로부터 보호해주는 영험한 힘을 가진 부적.<br><br><b>야마오카의 원혼<\/b>의 지속 시간이 <b>70% 증가한다<\/b>.<b>야마오카의 원혼<\/b>의 이동 속도가 <b>15% 감소한다<\/b>.","r":3,"c":"ka","o":"Spirit"},{"id":"Addon_PhaseWalker_Zori","ko":"조리","en":"Zōri","d":"간편하게 신고 다닐 수 있는 평평한 일본식 샌들.<br><br><b>야마오카의 원혼<\/b> 이동 속도가 <b>5% 빨라진다<\/b>.","r":0,"c":"ka","o":"Spirit"},{"id":"Addon_Plague_AshenApple","ko":"잿빛 사과","en":"Ashen Apple","d":"신성화된 유해 위로 굴린 껍질 깎은 사과. 이 사과를 먹으면 망자들의 질투 많은 사악한 유령들을 내쫓을 수 있다.<br><br>이미 헌신의 웅덩이 <b>1<\/b>개를 추가로 부패시킨 상태로 희생제를 시작한다.희생제에서 헌신의 웅덩이 개수가 <b>1<\/b>개 <b>증가한다<\/b>.","r":2,"c":"ka","o":"Plague"},{"id":"Addon_Plague_BlackIncense","ko":"검은 향","en":"Black Incense","d":"날카로운 뼈 부스러기로 만든 검은 반죽. 그 끔찍한 향기를 맡으면 심상의 눈이 밝아진다.<br><br>생존자가 구토를 하면 그들의 오라가 <b>3초<\/b> 동안 드러난다.","r":4,"c":"ka","o":"Plague"},{"id":"Addon_Plague_DevoteesAmulet","ko":"헌신자의 아뮬렛","en":"Devotee's Amulet","d":"바빌로니아의 대혼란과 질병의 신의 조각상을 이용해 복잡한 모양으로 깎은 혈석 아뮬렛. 착용자를 끝없는 헌신으로 가득 채운다.<br><br><b>부정한 숙청<\/b>의 지속 시간이 <b>20초<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Plague"},{"id":"Addon_Plague_EmeticPotion","ko":"구토 물약","en":"Emetic potion","d":"겨자 물을 베이스로 한 시럽으로 구토를 유발한다. 신체에 깃든 악을 내쫓는 데 사용한다.<br><br><b>끔찍한 숙청<\/b>의 효과가 <b>30%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Plague"},{"id":"Addon_Plague_ExorcismAmulet","ko":"악령 쫓기용 아뮬렛","en":"Exorcism Amulet","d":"유령 쫓기 의식을 하는 동안 질병을 내쫓는 데 쓰는 흑요석으로 만든 아뮬렛. 대혼란과 질병의 신에게 드리는 기도가 새겨져 있다. 착용자는 격렬한 헌신의 감정으로 가득 찬다.<br><br><b>부정한 숙청<\/b>의 지속 시간이 <b>10초<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Plague"},{"id":"Addon_Plague_HealingSalve","ko":"치료용 연고","en":"Healing Salve","d":"강렬하게 톡 쏘는 향이 나는, 으깬 뿌리로 만든 반죽이다. 생선 젓갈에 사흘 동안 재우고 와인에 다시 이틀을 재워서 만든다. 발진이 생긴 피부에 바른다.<br><br><b>끔찍한 숙청<\/b> 및 <b>부정한 숙청<\/b>의 재사용 대기 시간이 <b>0.25초<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"Plague"},{"id":"Addon_Plague_HematiteSeal","ko":"적철석 인장","en":"Hematite Seal","d":"금속성의 경질석으로 만든 원통형의 인장으로, 이상한 기계 옆에 서 있던 새 머리 형태의 물체로 새겼다. 신성한 유해의 보관함으로 사용된다.<br><br>대상의 감염 지속 시간이 <b>30초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Plague"},{"id":"Addon_Plague_IncensedOintment","ko":"향을 첨가한 연고","en":"Incensed Ointment","d":"검은 밀랍 반죽에 삼나무 수액을 더해 달콤하면서 흙냄새가 섞인 향이 난다. 감염된 피부에 직접 바른다.<br><br>헌신의 웅덩이에서 오염을 삼키면 <b>역병의<\/b> 공포 범위 내 모든 생존자는 비명을 지르며 그들의 위치가 드러난다.","r":2,"c":"ka","o":"Plague"},{"id":"Addon_Plague_InfectedEmetic","ko":"감염된 구토제","en":"Infected Emetic","d":"역한 맛의 알 수 없는 시럽. 노랑빛의 진한 액체를 마시면 구토가 올라온다. 신체에 깃든 악을 내쫓는 데 사용한다.<br><br><b>끔찍한 숙청<\/b>의 효과가 <b>40%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Plague"},{"id":"Addon_Plague_IridescentSeal","ko":"핏빛 인장","en":"Iridescent Seal","d":"역병의 조각상을 이용해 안개가 만들어낸 반투명한 원통형 인장. 그 표면은 따뜻하며 엔티티의 힘으로 진동한다.<br><br>발전기 수리가 완료될 때마다 <b>부정한 숙청<\/b>이 활성화된다.<b>부청한 숙청<\/b>의 지속 시간이 <b>20초<\/b> <b>감소한다<\/b>.","r":4,"c":"ka","o":"Plague"},{"id":"Addon_Plague_LimestoneSeal","ko":"석회석 인장","en":"Limestone Seal","d":"다공석으로 만든 원통형 인장으로 날개 달린 신에게 제사를 올리는 장면이 묘사되어 있다.<br><br>대상의 감염 시간을 <b>20초<\/b> <b>증가시킨다<\/b>.","r":0,"c":"ka","o":"Plague"},{"id":"Addon_Plague_OlibanumIncense","ko":"유향","en":"Olibanum Incense","d":"유향 나무에서 추출한 귀한 수액으로 의식 중에 달콤한 귤 향을 내기 위해 사용한다.<br><br>분수대에서 정화하는 모든 생존자는 <b>4초<\/b> 동안 오라가 드러난다.","r":0,"c":"ka","o":"Plague"},{"id":"Addon_Plague_PotentTincture","ko":"강력한 팅크","en":"Potent Tincture","d":"거품이 나는 탁한 액체로 대기 중을 톡 쏘는 약초와 알코올 향으로 채운다. 물집이 생긴 자리에 직접 바른다.<br><br><b>끔찍한 숙청<\/b> 및 <b>부정한 숙청<\/b>의 재사용 대기 시간이 <b>0.4초<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"Plague"},{"id":"Addon_Plague_PrayerApple","ko":"축복받은 사과","en":"Blessed Apple","d":"정화 의식을 끝낸 뒤 아침으로 먹는 딱 맞게 익은 사과로 맛이 훌륭하다.<br><br>이미 헌신의 웅덩이 <b>1개를 추가로<\/b> 부패시킨 상태로 희생제를 시작한다.","r":1,"c":"ka","o":"Plague"},{"id":"Addon_Plague_PrayerTabletFragment","ko":"기도 석판 조각","en":"Prayer Tablet Fragment","d":"원래는 전신 권태와 병을 내쫓기 위해 사용했으나 지금은 타락한 주문이 적힌 깨진 석판.<br><br><b>끔찍한 숙청<\/b>은 생존자에게 영향을 주지 않는다.대상의 감염 지속 시간이 <b>40초<\/b> <b>증가한다<\/b>.감염된 물체로 인한 감염이 <b>100%<\/b><b>증가한다<\/b>.기만 항목에서 블러드포인트가 <b>100%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Plague"},{"id":"Addon_Plague_ProphylacticAmulet","ko":"질병 예방용 부적","en":"Prophylactic Amulet","d":"질병을 쫓아내는 날개 달린 신이 어설프게 묘사된 동석 아뮬렛. 착용자를 헌신의 감정으로 가득 채운다.<br><br>희생제 중 헌신의 웅덩이 갯수가 <b>2<\/b>개로 <b>감소한다<\/b>.","r":1,"c":"ka","o":"Plague"},{"id":"Addon_Plague_RubbingOil","ko":"마사지 오일","en":"Rubbing Oil","d":"품질이 괜찮은 마사지 오일을 담은 비커. 월계수와 로즈메리의 푸른 향기가 물씬 풍긴다.<br><br><b>끔찍한 숙청<\/b> 및 <b>부정한 숙청<\/b>의 충전율이 <b>50%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Plague"},{"id":"Addon_Plague_SeveredToe","ko":"잘린 발가락","en":"Severed Toe","d":"썩어가는 아디리스의 잘린 발가락을 실로 엮어 목에 걸 수 있도록 만든 아뮬렛. 사악한 힘을 내뿜는다.<br><br>상호작용 중인 생존자의 감염률이 <b>50%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Plague"},{"id":"Addon_Plague_VileEmetic","ko":"끔찍한 구토제","en":"Vile Emetic","d":"정체불명의 재료로 만들었으며 구역질 나는 냄새에 반쯤 엉겨 붙은 물약. 마시는 즉시유발하며, 신체에 스며든 악을 내쫓는 데 사용한다.<br><br>토사물 발사 속도가 <b>10%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Plague"},{"id":"Addon_Plague_WorshipTablet","ko":"숭배 석판","en":"Worship Tablet","d":"잊혀진 신들을 숭배하기 위해 사용했으나 현재는 타락해버린 주문의 그림과 글귀가 적힌, 금으로 장식된 석판.<br><br>헌신의 웅덩이에서 오염을 삼키는 속도가 <b>100%<\/b> <b>증가한다<\/b>.<b>부정한 숙청<\/b>이 최대 충전 상태일 때 이동 속도가 <b>4.5%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Plague"},{"id":"Addon_ReverseBearTrap_AmandasLetter","ko":"아만다의 편지","en":"Amanda's Letter","d":"아만다의 주의를 끌기 위해 쓰인 협박 편지. 읽는 이를 분노에 타오르게 한다.<br><br>앉아 있는 동안 <b>16미터<\/b> 내에 있는 생존자들의 오라를 볼 수 있다.사용 가능한 역방향 곰덫의 개수가 <b>2<\/b>개 <b>감소한다<\/b>.","r":4,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_AmandasSecret","ko":"아만다의 비밀","en":"Amanda's Secret","d":"쇠로 만들어진 검은색 상자. 안에는 나이프와 압박 붕대 같은 다양한 의료 용품들이 들어있다. 깊은 상처는 스트레스를 줄이고 감각을 깨운다.<br><br>생존자가 역방향 곰덫을 해제하는 데 성공했을 시 알람을 받는다.역방향 곰덫을 해제한 생존자의 오라를 <b>6초<\/b> 동안 볼 수 있다.","r":3,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_BagofGears","ko":"기계부품 가방","en":"Bag of Gears","d":"역방향 곰덫과 직쏘 상자를 설치할 때 사용하는 기계부품.<br><br>역방향 곰덫 설치 속도가 <b>50%<\/b> <b>증가한다<\/b>.직쏘 상자를 수색하는 데 걸리는 시간이 <b>17%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_CombatStraps","ko":"전투용 끈","en":"Combat Straps","d":"옷을 단단히 고정시켜 민첩하게 움직일 수 있게 해주는 가죽 끈.<br><br>웅크리고 웅크림을 해제하는 속도가 <b>10%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_CrateofGears","ko":"부품 상자","en":"Crate of Gears","d":"설계가 매우 복잡한 역방향 곰덫과 직쏘 상자를 손쉽게 설치할 때 사용하는 기계부품.<br><br>역방향 곰덫 설치 속도가 <b>50%<\/b> <b>증가한다<\/b>.직쏘 상자를 수색하는 데 걸리는 시간이 <b>33%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_FaceMask","ko":"마스크","en":"Face Mask","d":"진정제를 묻힌 무거운 마스크, 목표물을 질식시켜 정신을 흐트러지게 만든다. 역방향 곰덫이 씌인 생존자에게 아래와 같은 효과를 부여한다.<br><br>생존자는 역방향 곰덫이 해제될 때까지 <b>실명<\/b> 상태 이상에 걸린다.생존자들이 역방향 곰덫 착용 후 직쏘 상자의 오라를 볼 수 있는 능력에는 영향을 끼치지 않는다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.","r":1,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_InterlockingRazor","ko":"맞물리는 면도날","en":"Interlocking Razor","d":"직쏘 상자속에 날카로운 면도칼을 더해 갑자기 움직이면 결과를 치르지 않고 넘어갈 수 없게 된다. 직쏘 상자에 아래와 같은 효과를 부여한다.<br><br>부상 상태의 생존자가 직쏘 상자 스킬 체크에 실패하면 생존자는 <b>심각한 부상<\/b> 상태에 빠진다.<br><br>제한 시간 안에 심각한 부상을 치료하지 않으면 생존자는 빈사 상태에 빠진다.","r":0,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_JigsawsAnnotatedPlan","ko":"직쏘의 주석이 달린 도면","en":"Jigsaw's Annotated Plan","d":"충격적으로 끔찍하지만 설계자의 기발함이 돋보이는 설계 도면.<br><br>맵 상의 곰덫의 개수가 <b>1<\/b>개 <b>증가한다<\/b>.역방향 곰덫 타이머의 시간이 <b>10초<\/b> <b>증가한다<\/b>.발전기가 완료될 때마다, 활성화된 모든 역방향 곰덫의 타이머 시간이 <b>10초<\/b>씩 줄어든다.","r":2,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_JigsawsSketch","ko":"직쏘의 스케치","en":"Jigsaw's Sketch","d":"충격적으로 끔찍하지만 영리함이 돋보이는 설계도, 직쏘가 직접 주석을 달았다.<br><br>맵 상의 곰덫의 개수가 <b>1<\/b>개 <b>증가한다<\/b>.역방향 곰덫에 잡힌 생존자가 발전기를 수리하면 해당 발전기의 오라가 드러난다.","r":3,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_JohnMedicalFile","ko":"존의 진료 기록","en":"John's Medical File","d":"암 환자의 진료 기록. 읽는 이를 굉장히 두렵고 무모하게 만든다.<br><br>앉아서 이동하는 속도가 <b>5%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_LastWill","ko":"유언장","en":"Last Will","d":"광택이 나는 걸쇠형 나무상자, 유언장에는 상속에 대한 내용이 적혀있다.<br><br><b>매복<\/b> 공격의 이동 속도가 <b>5% 증가한다<\/b>.<b>매복<\/b> 공격을 충전하는 데 걸리는 시간이 <b>10%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_RazorWires","ko":"가시 철사줄","en":"Razor Wires","d":"상자 속에 날카로운 가시가 달린 철사줄을 더해 상자 수색을 어렵게 만든다. 직쏘 상자에 아래와 같은 효과를 부여한다.<br><br>직쏘 상자 스킬 체크 성공 구간이 좁아진다.건강한 상태에서 직쏘 상자 스킬 체크에 실패하면 생존자는 부상을 입게 된다.","r":1,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_RuleSetN2","ko":"두 번째 규칙","en":"Rule Set No.2","d":"\"모든 게임이 같은 규칙을 가질 필요는 없잖아.\"<br><br>역방향 곰덫의 타이머가 작동하기 전까지, 생존자들은 <b>직쏘 상자의 오라를 볼 수 없다<\/b>.","r":2,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_RustyAttachments","ko":"녹슨 부속품","en":"Rusty Attachments","d":"녹슬고 더러운 나사못이 부상의 치료를 더디게 한다. 역방향 곰덫에 아래의 효과를 부여한다.<br><br>역방향 곰덫으로 생존자는 <b>70초<\/b> 동안 <b>깊은 상흔<\/b>에 걸린다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_ShatteredSyringe","ko":"조각난 주사기","en":"Shattered Syringe","d":"망가진 삶의 상징. 예전의 삶을 돌아보는 것은 그녀가 다시금 헛된 마음을 먹지 않게 만든다.<br><br>빗나간 매복 공격의 재사용 대기 시간이 <b>10%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_SlowReleasingToxin","ko":"서서히 퍼지는 독","en":"Slow-Release Toxin","d":"치명적이진 않지만 힘을 약하게 만드는 독. 역방향 곰덫이 아래의 효과를 부여한다.<br><br>생존자는 역방향 곰덫이 해제될 때까지 <b>탈진<\/b>에 걸린다.<br><br>생존자는 탈진으로 탈진에 영향받는 기술을 발동할 수 없다.","r":2,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_TamperedTimer","ko":"조작된 타이머","en":"Tampered Timer","d":"시간이 더 빨리 가도록 용수철을 넣은 조작된 타이머.<br><br>역방향 곰덫 타이머의 시간이 <b>20초<\/b> <b>감소한다<\/b>.","r":3,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_UtilityBlades","ko":"다용도 칼날","en":"Utility Blades","d":"피해자가 움직일 때마다 덫 안쪽에 설치된 날카로운 면도날이 살갖을 벤다. 역방향 곰덫에 아래의 효과를 부여한다.<br><br>역방향 곰덫은 생존자가 어떤 방식으로든 부상을 입을 때마다 <b>출혈<\/b> 효과를 부여한다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":1,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_VideoTape","ko":"비디오 테이프","en":"Video Tape","d":"직쏘가 제작한 테이프. 아만다에게 알려줄 게임 규칙이 기록되어 있다. 예전의 삶을 돌아보는 것은 그녀가 다시금 헛된 마음을 먹지 않게 만든다.<br><br>생존자들은 역방향 곰덫이 설치된 채 희생제를 시작한다.","r":4,"c":"ka","o":"Pig"},{"id":"Addon_ReverseBearTrap_WorkshopGrease","ko":"작업장 기름","en":"Workshop Grease","d":"숨겨진 칼을 윤활하는 데 사용되는 간단한 기름 튜브.<br><br><b>매복<\/b> 공격 차지 속도가 <b>50% 증가한다<\/b>.","r":1,"c":"ka","o":"Pig"},{"id":"Addon_Rush_AdrenalineVial","ko":"아드레날린 유리병","en":"Adrenaline Vial","d":"원치 않는 피험자의 부신에서 제거된 호르몬. 가슴 철렁일 만큼의 에너지가 제공되지만, 사용자는 피로감을 느낄 수 있다.<br><br>최대 <b>질주<\/b> 토큰 개수가 <b>2개<\/b> <b>증가한다<\/b>.질주 발동 중 질주의 최대 주사 각이 <b>20도<\/b> <b>증가한다<\/b>.질주 선회율이 <b>55%<\/b> <b>감소한다<\/b>.질주 속도가 <b>5%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K21"},{"id":"Addon_Rush_AlchemistsRing","ko":"연금술사의 반지","en":"Alchemist’s Ring","d":"런던 의과대학을 졸업하는 화학자들에게 주어지는 반지. 억제되지 않은 야심을 일깨워 준다.<br><br>연속 <b>질주<\/b>마다 질주 지속 시간이 20% <b>증가한다<\/b>.","r":3,"c":"ka","o":"K21"},{"id":"Addon_Rush_BlightedCrow","ko":"황폐화된 까마귀","en":"Blighted Crow","d":"황폐화된 혈청으로 괴괴하게 변이된 죽은 까마귀.<br><br>질주 발동 중 질주마다 각 연속 <b>질주<\/b> 속도가 <b>3%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K21"},{"id":"Addon_Rush_BlightedRat","ko":"황폐화된 쥐","en":"Blighted Rat","d":"혈청 주사를 맞아 잠시 생기를 되찾은 쥐, 공격적이고 걷잡을 수 없게 된다.<br><br>질주 발동 중 질주마다 각 연속 <b>질주<\/b> 속도가 <b>2%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K21"},{"id":"Addon_Rush_CankerThorn","ko":"돌기 가시나무","en":"Canker Thorn","d":"동고병 돌기에서 잘라낸 상당한 크기의 가시나무. 가벼운 독소를 분비한다.<br><br>질주 후, 회복 시간이 <b>0.5초<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K21"},{"id":"Addon_Rush_ChippedMonocle","ko":"닳아버린 단안경","en":"Chipped Monocle","d":"말년에 나빠진 시력에도 불구하고 잘 사용하지 않았던 탤벗의 단안경.<br><br>충돌 표적의 위치를 표시한다.","r":0,"c":"ka","o":"K21"},{"id":"Addon_Rush_CompoundSeven","ko":"화합물 7","en":"Compound Seven","d":"원하는 결과를 얻는 데는 실패한 초기 샘플이지만, 그럼에도 불구하고 놀라운 효과를 보여주었다.<br><br>충돌 후 <b>16미터<\/b> 내 생존자를 자동적으로 바라보게 된다.","r":0,"c":"ka","o":"K21"},{"id":"Addon_Rush_CompoundThirtyThree","ko":"화합물 33","en":"Compound Thirty-Three","d":"탤벗의 두 번째 시도. 탈출에는 도움이 안됐지만, 부작용이 심하다.<br><br><b>질주<\/b>는 최대 <b>5<\/b>회 수행 가능하다.질주 선회율이 <b>11%<\/b> <b>증가한다<\/b>.질주 지속 시간이 <b>11%<\/b> <b>증가한다<\/b>.","r":4,"c":"ka","o":"K21"},{"id":"Addon_Rush_CompoundTwentyOne","ko":"화합물 21","en":"Compound Twenty-One","d":"인간에게 치명적인 세럼. 더 특별한... 자들에게만 유익한 효과가 있다.<br><br>충돌 후 <b>8미터<\/b> 이내에 있는 모든 생존자의 오라가 <b>3초<\/b> 동안 드러난다.","r":2,"c":"ka","o":"K21"},{"id":"Addon_Rush_Foxglove","ko":"디기탈리스","en":"Foxglove","d":"화학에 대한 탤벗의 흥미를 일깨워준 독초. 깊은 곳에 묻혀 있는 기억을 불러일으킨다.<br><br><b>질주<\/b> 회복 시간이 <b>0.25초<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K21"},{"id":"Addon_Rush_IridescentBlightTag","ko":"핏빛 블라이트 태그","en":"Iridescent Blight Tag","d":"유리 소재의 실험실 라벨로, 안개에서 만들어졌다. 엔티티의 선물인지, 블라이트가 한때 사람들을 괴롭혔던 것처럼 그를 따라다니는 지독한 농담 같기도 하다.<br><br><b>질주<\/b>는 최대 <b>3<\/b>회 수행 가능하다.<b>질주<\/b>의 최대 주사 각이 <b>20도<\/b> <b>증가한다<\/b>.질주 속도가 <b>10%<\/b> <b>증가한다<\/b>.","r":4,"c":"ka","o":"K21"},{"id":"Addon_Rush_PlaceboTablet","ko":"플라시보 약","en":"Placebo Tablet","d":"전혀 효과가 없는 약... 아, 효과가 없는 건 아닌가?<br><br>질주 발동 중 이동 속도가 <b>15%<\/b> <b>감소한다<\/b>.<b>질주<\/b>를 사용하면 <b>100%의 보너스 블러드포인트<\/b>를 획득한다.","r":0,"c":"ka","o":"K21"},{"id":"Addon_Rush_PlagueBile","ko":"역병 증오","en":"Plague Bile","d":"증오의 역병 샘플, 증류 후 화학 물질과 혼합하여 처리한다.<br><br>질주 발동 중 선회율이 <b>10%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K21"},{"id":"Addon_Rush_PustulaDust","ko":"고름집 가루","en":"Pustula Dust","d":"말린 고름집 꽃잎을 갈아 미세한 가루로 만들었다.<br><br>충돌의 최대 지속 시간이 <b>0.75초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K21"},{"id":"Addon_Rush_RoseTonic","ko":"장미 강장제","en":"Rose Tonic","d":"희귀한 초승달 꽃다발의 말린 장미와 함께 섞은 혼합물.<br><br>충돌의 최대 지속 시간이 <b>1초<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K21"},{"id":"Addon_Rush_ShreddedNotes","ko":"뜯겨나간 노트","en":"Shredded Notes","d":"탤벗의 노트에서 남은 부분. 귀중한 정보가 여전히 포함되어 있다.<br><br><b>질주<\/b> 토큰을 재충전하는 시간이 <b>0.33초<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K21"},{"id":"Addon_Rush_SoulChemical","ko":"영혼의 화학 물질","en":"Soul Chemical","d":"죽은 지 얼마 안 된 생존자의 송과샘에서 쥐어짜낸 화학 물질.<br><br>초기 <b>질주<\/b> 속도가 <b>5%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"K21"},{"id":"Addon_Rush_SummoningStone","ko":"소환석","en":"Summoning Stone","d":"탤벗이 사용한 돌로, 아편굴의 벽에 자신의 연구라고 믿었던 것을 새겼다.<br><br>초기 <b>질주<\/b> 기간이 <b>0.5초<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"K21"},{"id":"Addon_Rush_UmbraSalts","ko":"본영 소금","en":"Umbra Salts","d":"순간적으로 영적 세계를 통과한 일반적인 바다 소금, 그 과정에서 성질을 바뀌었다.<br><br>질주 발동 중 선회율이 <b>15%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K21"},{"id":"Addon_Rush_VigosJournal","ko":"비고의 일지","en":"Vigo's Journal","d":"공허에서 돌아왔다고 주장하는 한 남자의 일지. 일지에 적힌 지식은 매우 실용적이다.<br><br>질주 발동 중 <b>감지 불가능<\/b> 능력을 사용할 수 있다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":3,"c":"ka","o":"K21"},{"id":"Addon_Spark_CalmClassI","ko":"\"침착\" - 등급 I","en":"\"Calm\" - Class I","d":"파장을 이용해 다양한 정신병을 치료하는 전기 충격 요법. 카터의 전류를 에너지원으로 사용하는 이 요법은 환자에게 가벼운 불안감을 유발한다.<br><br><b>정전기 폭발<\/b>이 준비되면 <b>공포 범위<\/b>가 <b>4미터 증가한다<\/b>.<b>정전기 폭발<\/b>이 재사용 대기 시간 모드일 때 <b>공포 범위<\/b>가 <b>4미터 감소한다<\/b>.<br><br><b>광기<\/b>로 고통받는 생존자들은 <i>침착함의 고통<\/i>을 받는다:<br><br><b>광기 II단계<\/b>: 생존자들은 간헐적으로 멀리서 들리는 듯한 <i>환영 같은 심장 박동<\/i>을 듣는다.<b>광기 III단계<\/b>: 생존자들은 끊임없이 멀리서 들리는 듯한 <i>환영 같은 심장 박동<\/i>을 듣는다.","r":0,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_CalmClassII","ko":"\"침착\" - 등급 II","en":"\"Calm\" - Class II","d":"파장을 이용해 다양한 정신병을 치료하는 위험한 전기 충격 요법. 카터의 전류를 에너지원으로 사용하는 이 요법은 환자에게 적당한 불안감을 유발한다.<br><br><b>정전기 폭발<\/b>이 준비되면 <b>공포 범위<\/b>가 <b>6미터 증가한다<\/b>.<b>정전기 폭발<\/b>이 재사용 대기 시간 모드일 때 <b>공포 범위가 6미터<\/b> <b>감소한다<\/b>.<br><br><b>광기<\/b>로 고통받는 생존자들은 <i>침착함의 고통<\/i>을 받는다:<br><br><b>광기 II단계<\/b>: 생존자들은 간헐적으로 멀리서 들리는 듯한 <i>환영 같은 심장 박동<\/i>을 듣는다.<b>광기 III단계<\/b>: 생존자들은 끊임없이 멀리서 들리는 듯한 <i>환영 같은 심장 박동<\/i>을 듣는다.","r":1,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_CalmMuYisNotes","ko":"\"침착\" - 카터의 공책","en":"\"Calm\" - Carter's Notes","d":"전기 충격 요법에 대한 여러 실험 방법을 적어 놓은 노트. 의사 헤르만 카터가 직접 주석을 달았다. 파장을 이용해 다양한 정신병을 치료하는 위험한 전기 충격 요법. 카터의 전류를 에너지원으로 사용하는 이 요법은 환자에게 견딜 수 없는 공포와 불안감을 유발한다.<br><br><b>정전기 폭발<\/b>이 준비되면 <b>공포 범위<\/b>가 <b>8미터 증가한다<\/b>.<b>정전기 폭발<\/b>이 재사용 대기 시간 모드일 때 <b>공포 범위<\/b>가 <b>8미터 감소한다<\/b>.<br><br><b>광기<\/b>로 고통받는 생존자들은 <i>침착함의 고통<\/i>을 받는다:<br><br><b>광기 II단계<\/b>: 생존자들은 간헐적으로 멀리서 들리는 듯한 <i>환영 같은 심장 박동<\/i>을 듣는다.<b>광기 III단계<\/b>: 생존자들은 끊임없이 멀리서 들리는 듯한 <i>환영 같은 심장 박동<\/i>을 듣는다.","r":3,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_DisciplineClassII","ko":"\"징벌\" - 등급 II","en":"\"Discipline\" - Class II","d":"환자를 징벌할 때 쓰이는, 높은 전류를 이용한 전기 충격 요법. 환자에게 적당한 피해망상을 안겨 준다.<br><br><b>전기장 방출<\/b>의 폭발 지연이 <b>0.06초<\/b> <b>감소한다<\/b>.<br><br><b>광기<\/b> 상태의 생존자들은 <i>징계의 고통<\/i>을 받는다:<br><br><b>광기 II단계<\/b>: 추격 중에 생존자들은 마치 <b>닥터<\/b>가 바로 뒤에 있었던 듯한 <i>환영 같은 붉은 불빛<\/i>과 <i>공포 범위<\/i> 효과를 받는다. 이 효과는 추적이 끝난 후 <b>6초<\/b> 동안 지속된다.<b>광기 III단계<\/b>: <i>환영 같은 붉은 불빛<\/i>과 <i>공포 범위<\/i> 효과는 계속해서 지속된다.<b>닥터<\/b>는 또한 <i>붉은 불빛의 환영<\/i>을 볼 수 있다.","r":1,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_DisciplineClassIII","ko":"\"징벌\" - 등급 III","en":"\"Discipline\" - Class III","d":"환자를 징벌할 때 쓰이는, 매우 높은 전류를 이용한 전기 충격 요법. 환자에게 심각한 피해망상을 안겨 준다.<br><br><b>전기장 방출<\/b>의 폭발 지연이 <b>0.08초<\/b> <b>감소한다<\/b>.<br><br><b>광기<\/b>로 고통받는 생존자들은 <i>징계의 고통<\/i>을 받는다:<br><br><b>광기 II단계<\/b>: 추격 중에 생존자들은 마치 <b>닥터<\/b>가 바로 뒤에 있었던 듯한 <i>환영 같은 붉은 불빛<\/i>과 <i>공포 범위<\/i> 효과를 받는다. 이 효과는 추적이 끝난 후 <b>6초<\/b> 동안 지속된다.<b>광기 III단계<\/b>: <i>환영 같은 붉은 불빛<\/i>과 <i>공포 범위<\/i> 효과는 계속해서 지속된다.<b>닥터<\/b>는 또한 <i>붉은 불빛의 환영<\/i>을 볼 수 있다.","r":2,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_DisciplineMuYisNotes","ko":"\"징벌\" - 카터의 공책","en":"\"Discipline\" - Carter's Notes","d":"환자를 징벌할 때 쓰이는, 높은 전류를 이용하는 전기 충격 요법. 의사 헤르만 카터가 직접 주석을 달았다. 엄청나게 높은 전압은 환자에게 극심한 피해망상을 안겨 준다.<br><br><b>전기장 방출<\/b>의 폭발 지연이 <b>0.1초<\/b> <b>감소한다<\/b>.<br><br><b>광기<\/b>로 고통받는 생존자들은 <i>질서의 고통<\/i>을 받는다:<br><br><b>광기 II단계<\/b>: 추격 중에 생존자들은 마치 <b>닥터<\/b>가 바로 뒤에 있었던 듯한 <i>환영 같은 붉은 불빛<\/i>과 <i>공포 범위<\/i> 효과를 받는다. 이 효과는 추적이 끝난 후 <b>6초<\/b> 동안 지속된다.<b>광기 III단계<\/b>: <i>환영 같은 붉은 불빛<\/i>과 <i>공포 범위<\/i> 효과는 계속해서 지속된다.<b>닥터<\/b>는 또한 <i>붉은 불빛의 환영<\/i>을 볼 수 있다.","r":3,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_HighStimulusElectrode","ko":"큰 자극을 주는 전극","en":"High Stimulus Electrode","d":"오랫동안 매우 높은 전류를 견딜 수 있는 전극.<br><br><b>전기장 방출<\/b>의 사거리가 <b>4미터<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_IridescentGeneral","ko":"핏빛 체스 킹","en":"Iridescent King","d":"안개 자체에서 만들어진, 유리로 된 체스 말 킹. 그 안에 잠재되어 있는 엔티티의 힘으로 어떠한 굳건한 정신도 망가뜨릴 수 있다.<br><br><b>광기<\/b> 상태의 생존자들은 다음과 같은 <i>고통을 받는다: 침착함, 징계, 질서,<\/i> <i>통제<\/i>.멀리서 들리는 듯한 <i>환영 같은 심장 박동<\/i>을 듣는다. <b>광기 II단계<\/b>는 간헐적으로 <b>광기 III단계<\/b>는 지속적으로 발동된다.추격 중에 생존자들은 마치 <b>닥터<\/b>가 바로 뒤에 있었던 듯한 <i>환영 같은 붉은 불빛<\/i>과 <i>공포 범위<\/i> 효과를 받는다. 이 효과는 <b>광기 II단계<\/b>에서 추적이 끝난 후 <b>6초<\/b> 동안 지속되며 <b>광기 III단계<\/b>에서도 효과는 계속해서 지속된다.이미 부서진 판자가 <i>환영 판자<\/i>로 바뀌며, 생존자가 가까이 다가가기 전까지 환영이 지속된다. 새로운 <i>환영 판자<\/i>는 <b>20초<\/b>마다 이미 부서진 판자의 위치에 무작위로 생성된다.<i>닥터의 환영 환각<\/i> 지속시간이 <b>6초<\/b> <b>증가한다<\/b>.<b>닥터<\/b>는 <i>환영 같은 붉은 불빛<\/i>을 보며 <i>닥터의 환영 및 환영 판자<\/i>의 오라 역시 볼 수 있다.","r":4,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_JadeCharm","ko":"핏빛 체스 퀸","en":"Iridescent Queen","d":"안개 자체에서 만들어진, 유리로 된 체스 말 퀸. 상당한 전기 충격을 받지 않으면 만질 수 없다.<br><br><b>전기장 방출<\/b> 또는 <b>정전기 폭발<\/b>에 감전되는 모든 생존자들은 장시간 이어지는 정전기 충전을 얻는다. 정전기 충전은 <i>방전<\/i>될 때까지 지속된다.반경 <b>4미터<\/b> 내에 <b>전기장 방출<\/b> 또는 <b>정전기 폭발<\/b>에 감전되는 다수의 생존자가 있으면 정전기 충전을 얻지 않는다.<b>정전기 충전<\/b>을 가진 다른 생존자가 반경 4미터 내에 들어오면 해당 생존자는 전기장 방출과 동일한 효과를 얻으며 정전기 충전은 즉시 방전된다.","r":4,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_MoldyElectrode","ko":"곰팡이 핀 전극","en":"Moldy Electrode","d":"곰팡이가 피었지만 아직 전류가 통하는 전극.<br><br><b>전기장 방출<\/b>의 사거리가 <b>2미터<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_NanmuCatapult","ko":"단풍나무 나이트","en":"Maple Knight","d":"단풍 나무로 만들어진 하얀색 체스 나이트. 노인에게서 받은 이 선물은 오래된 기억을 불러일으키며, 닥터가 집중할 수 있게 도와준다.<br><br><b>전기장 방출<\/b>의 범위를 시각적으로 보여준다.","r":0,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_Obedience_MuYisNotes","ko":"버려진 테이프","en":"Scrapped Tape","d":"백색 소음이 섞인 카세트 테이프. 닥터의 치료 모드에 변화를 준다.<br><br><b>전기장 방출<\/b>의 모양을 범위 <b>8미터<\/b>, 반지름 <b>4미터<\/b>, 두께 <b>1미터<\/b>의 링으로 바꾼다.","r":2,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_OrderClassI","ko":"\"질서\" - 등급 I","en":"\"Order\" - Class I","d":"래리 기념 연구소의 환자들이 매일 처방받는 전기 충격 요법. 환자에게 가벼운 정신적 혼란을 안겨 준다.<br><br><b>정전기 폭발<\/b>의 재사용 대기 시간이 <b>2초 감소한다<\/b>.<br><br><b>광기<\/b>로 고통받는 생존자들은 <i>질서의 고통<\/i>을 받는다:<br><br>이미 부서진 판자가 환영 판자로 바뀌며, 생존자가 가까이 다가가기 전까지 환영이 지속된다.새로운 환영 판자는 <b>20초<\/b>마다 이미 부서진 판자의 위치에 무작위로 생성된다.<b>닥터<\/b>는 환영 판자의 오라를 본다.","r":0,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_OrderClassII","ko":"\"질서\" - 등급 II","en":"\"Order\" - Class II","d":"래리 기념 연구소의 환자들이 매일 처방받는 매우 자극적인 전기 충격 요법. 환자에게 적당한 정신적 혼란을 안겨 준다.<br><br><b>정전기 폭발<\/b>의 재사용 대기 시간이 <b>2.5초 감소한다<\/b>.<br><br><b>광기<\/b>로 고통받는 생존자들은 <i>질서의 고통<\/i>을 받는다:<br><br>이미 부서진 판자가 환영 판자로 바뀌며, 생존자가 가까이 다가가기 전까지 환영이 지속된다.새로운 환영 판자는 <b>20초<\/b>마다 이미 부서진 판자의 위치에 무작위로 생성된다.<b>닥터<\/b>는 환영 판자의 오라를 본다.","r":1,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_OrderMuYisNotes","ko":"\"질서\" - 카터의 공책","en":"\"Order\" - Carter's Notes","d":"실험적인 전기 충격 요법. 의사 헤르만 카터가 직접 주석을 달았다. 긴 시간 동안 계속되는 자극은 환자에게 극심한 혼란을 안겨 준다.<br><br><b>정전기 폭발<\/b>의 재사용 대기 시간이 <b>3초 감소한다<\/b>.<br><br><b>광기<\/b>로 고통받는 생존자들은 <i>질서의 고통<\/i>을 받는다:<br><br>이미 부서진 판자가 환영 판자로 바뀌며, 생존자가 가까이 다가가기 전까지 환영이 지속된다.새로운 환영 판자는 <b>20초<\/b>마다 이미 부서진 판자의 위치에 무작위로 생성된다.<b>닥터<\/b>는 환영 판자의 오라를 본다.","r":3,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_PolishedElectrode","ko":"광이 나는 전극","en":"Polished Electrode","d":"전기 충격 요법에 사용되는 평범한 전극. 생산된지 얼마 안되서 광이 난다.<br><br><b>전기장 방출<\/b>의 사거리가 <b>3미터<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_RestraintClassII","ko":"\"통제\" - 등급 II","en":"\"Restraint\" - Class II","d":"안갯속에서 개발한 실험적인 전기 충격 요법. 파장을 이용해 환자와 닥터의 정신을 연결한다. 이 요법은 환자에게 가벼운 환각 증세를 유발한다.<br><br>생존자들의 <b>광기<\/b> 단계가 상승할 때마다 <b>1초<\/b> 동안 그들의 오라가 드러난다.<br><br><b>광기<\/b>로 고통받는 생존자들은 <i>침착함의 고통<\/i>을 받는다:<br><br><i>닥터의 환영 환각<\/i> 지속시간이 <b>6초<\/b> <b>증가한다<\/b>.<b>닥터<\/b>는 모든 단계의 <b>광기<\/b> 상태에서 환각의 오라를 볼 수 있다.","r":1,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_RestraintClassIII","ko":"\"통제\" - 등급 III","en":"\"Restraint\" - Class III","d":"안갯속에서 개발한 실험적인 전기 충격 요법. 강한 자극의 파장을 이용해 환자와 닥터의 정신을 연결한다. 이 요법은 환자에게 심한 환각 증세를 유발한다.<br><br>생존자들의 <b>광기<\/b> 단계가 상승할 때마다 <b>2초<\/b> 동안 그들의 오라가 드러난다.<br><br><b>광기<\/b>로 고통받는 생존자들은 <i>침착함의 고통<\/i>을 받는다:<br><br><i>닥터의 환영 환각<\/i> 지속시간이 <b>6초<\/b> <b>증가한다<\/b>.<b>닥터<\/b>는 모든 단계의 <b>광기<\/b> 상태에서 환각의 오라를 볼 수 있다.","r":2,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_RestraintMuYisNotes","ko":"\"통제\" - 카터의 공책","en":"\"Restraint\" - Carter's Notes","d":"안갯속에서 개발한 실험적인 전기 충격 요법. 투박한 글씨체로 주석이 달려 있다. 견디기 힘들 만큼 강한 자극의 파장을 이용해 환자와 닥터의 정신을 연결한다. 이 요법은 환자에게 극심한 환각 증세를 유발한다.<br><br>생존자들의 <b>광기<\/b> 단계가 상승할 때마다 <b>3초<\/b> 동안 그들의 오라가 드러난다.<br><br><b>광기<\/b>로 고통받는 생존자들은 <i>침착함의 고통<\/i>을 받는다:<br><br><i>닥터의 환영 환각<\/i> 지속시간이 <b>6초<\/b> <b>증가한다<\/b>.<b>닥터<\/b>는 모든 단계의 <b>광기<\/b> 상태에서 환각의 오라를 볼 수 있다.","r":3,"c":"ka","o":"Killer07"},{"id":"Addon_Spark_TigerFangCharm","ko":"인터뷰 테이프","en":"Interview Tape","d":"각성 프로젝트에 희생된 자들의 인터뷰가 담겨 있는 무편집본 카세트테이프. 닥터의 마음을 움직여 치료 방법에 큰 변화를 준다.<br><br><i>특수 능력<\/i>인 <b>전기장 방출<\/b>의 범위가 원뿔 모양에서 길이는 <b>24미터<\/b>, 폭은 <b>2미터<\/b>인 기둥 모양으로 바뀐다.","r":2,"c":"ka","o":"Killer07"},{"id":"Addon_Stalker_BlondHair","ko":"금발 머리카락","en":"Blonde Hair","d":"약간 웨이브진 금발 머리카락.<br><br>발자국과 핏자국이 <b>스토커 모드<\/b>에서 <b>100%<\/b> 더 지속된다.","r":0,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_BoyfriendsMemo","ko":"남자친구의 메모","en":"Boyfriend's Memo","d":"여성의 관심을 끌기 위해 다소 천박하게 쓴 \"낭만적인\" 메모.<br><br>미행 범위가 <b>8미터<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_DeadRabbit","ko":"토끼 시체","en":"Dead Rabbit","d":"목부터 꼬리까지 절개된 회색 토끼의 시체.<br><br><b>추적자 모드<\/b>에서 공포 범위가 <b>25%<\/b> <b>감소한다<\/b>.<b>인간의 모습을 한 악<\/b> 모드에서 공포 범위가 <b>25%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_FragrantTuftOfHair","ko":"향기로운 머리카락 다발","en":"Fragrant Tuft of Hair","d":"누군가의 두피에서 강하게 뜯겨진 머리카락 묶음. 여성스러운 꽃 향기가 난다.<br><br><b>인간의 모습을 한 악 모드<\/b>:<br><br>생존자들은 <b>약점 노출<\/b>이 된다.돌진 범위가 <b>50%<\/b> 증가한다.<b>살육 공격<\/b>은 사용할 수 없다.<br><br>부상 당한 생존자가 약점 노출 상태에 걸릴 경우, 기본 공격으로도 빈사 상태에 빠진다.","r":1,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_GlassFragment","ko":"유리 파편","en":"Glass Fragment","d":"아마도 어떤 물건이 깨지면서 생겨났을 작고 착색된 유리 조각.<br><br><b>살육 공격<\/b>의 이동 속도가 <b>5%<\/b> <b>증가한다<\/b>.<b>살육 공격<\/b> 차지 속도가 <b>10%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_HairBow","ko":"리본 머리핀","en":"Hair Bow","d":"머리를 묶는 데 사용했던 파란색 리본 머리핀.<br><br><b>인간의 모습을 한 악<\/b>의 지속 시간이 <b>20초<\/b> <b>증가한다<\/b>.<b>미행 미터기<\/b>가 차오르는 속도가 <b>20%<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_HairBrush","ko":"머리빗","en":"Hair Brush","d":"머리카락을 볼륨감있고 부드럽게 만들어주는 큰 머리빗.<br><br><b>인간의 모습을 한 악<\/b>이 활성화되면, 다음에 부서지는 판자는 <b>50%<\/b> 더 빠르게 부서진다.","r":1,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_Jewelry","ko":"보석 장식","en":"Jewelry","d":"주디스가 좋아했던 구슬과 싸구려 금속으로 만들어진 목걸이.<br><br>가만히 서있는 생존자들을 미행할 때, <b>미행 미터기<\/b>가 차오르는 속도가 <b>10%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_JewelryBox","ko":"보석 상자","en":"Jewelry Box","d":"한 때는 사치스러운 물건들이 담겼던 텅 빈 나무 상자.<br><br><b>미행 미터기<\/b>가 차오르는 속도가 <b>30%<\/b> <b>증가한다<\/b>.미행 범위가 <b>16미터<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_JMyersMemorial","ko":"J.마이어스를 위한 추도사","en":"J.Myers Memorial","d":"65년 해든필드 고등학교 연감에서 찢어낸 광택지. 주디스 마이어스를 추모하는 내용이다.<br><br><b>인간의 모습을 한 악 모드<\/b>에서 생존자를 들어올리고 갈고리에 거는 속도가 <b>40%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_JudithsJournal","ko":"주디스의 일기","en":"Judith's Journal","d":"주디스 M. 마이어스의 일기장. 대부분의 페이지는 무섭고 불길한 그림으로 훼손됐다.<br><br>집착 대상을 미행할 때 <b>미행 미터기<\/b>가 차오르는 속도가 <b>40%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_JudithsTombstone","ko":"주디스의 묘비","en":"Judith's Tombstone","d":"싱클레어산 공동묘지에서 도난당한 주디스 마이어스의 크고 무거운 화강암 묘비.<br><br><b>인간의 모습을 한 악<\/b> 동안 생존자를 갈고리에 걸면 모드의 지속 시간이 초기화된다.단, <b>인간의 모습을 한 악<\/b>의 지속 시간은 최대 <b>40초<\/b>다.","r":4,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_LockOfHair","ko":"머리카락 다발","en":"Lock of Hair","d":"검은색 밴드로 묶인 잘려 나간 금발의 머리카락.<br><br><b>인간의 모습을 한 악<\/b>이 활성화되면, <i>능력 활성화 버튼<\/i>을 길게 눌러 예정 시간 보다 일찍 능력을 종료할 수 있으며, 남은 지속 시간의 <b>50%<\/b>가 <b>미행<\/b> 진행도로 전환된다.","r":3,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_MemorialFlower","ko":"추모화","en":"Memorial Flower","d":"묘지에서 주운 마르고 색이 변한 제비꽃.<br><br><b>스토커 모드<\/b>에서 이동 속도가 <b>4.4 m/s<\/b>로 <b>증가한다<\/b>.","r":0,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_MirrorShard","ko":"거울 조각","en":"Mirror Shard","d":"크고 날카로운 거울 조각.<br><br><b>살육 공격<\/b> 기본 지속 시간이 <b>0.25초<\/b> <b>증가한다<\/b>.<b>살육 공격<\/b> 차지 속도가 <b>25%<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_ReflectiveFragment","ko":"반사되는 파편","en":"Reflective Fragment","d":"반사율이 매우 높은 작은 조각. 깨진 거울의 파편인 것 같다.<br><br><b>살육 공격<\/b>으로 생존자를 타격하면 <b>인간의 모습을 한 악<\/b> 지속 시간이 <b>20초<\/b> 늘어난다.<b>살육 공격<\/b>은 단 하나의 건강 상태만 해친다.","r":3,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_ScratchedMirror","ko":"난도질된 거울","en":"Scratched Mirror","d":"휴대용으로 지니고 다닐 수 있는 화장 거울. 어떤 날카로운 금속 물체에 의해 심하게 난도질되어 있다.<br><br>미행 중 <b>32미터<\/b> 내에 생존자의 오라가 드러난다.<b>스토커 모드<\/b>를 벗어날 수 없다.타격 점수 이벤트는 <b>100%<\/b> 더 많은 잔혹함을 부여하고 기만 항목에서 <b>200%<\/b>의 추가 블러드포인트를 부여한다.","r":4,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_TackyEarrings","ko":"싸구려 귀걸이","en":"Tacky Earrings","d":"플라스틱제 싸구려 귀걸이. 귀금속과 비슷하게 꾸며져있다.<br><br>미행 중 이동 속도가 <b>20%<\/b> <b>빨라진다<\/b>.","r":0,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_TombstonePiece","ko":"묘비 조각","en":"Tombstone Piece","d":"깨진 비석에서 가져온 주먹 크기의 화강암 조각.<br><br><b>인간의 모습을 한 악<\/b>이 활성화되면, <b>20초<\/b> 동안 <b>감지 불가능<\/b>에 걸린다.","r":3,"c":"ka","o":"Shape"},{"id":"Addon_Stalker_VanityMirror","ko":"화장 거울","en":"Vanity Mirror","d":"휴대용으로 지니고 다닐 수 있는 화장 거울. 뿌연 먼지와 분이 묻어있는 것 빼곤 완벽한 상태이다.<br><br><b>인간의 모습을 한 악<\/b>이 종료되면, <b>4초<\/b> 동안 모든 생존자들의 오라를 볼 수 있다.","r":3,"c":"ka","o":"Shape"},{"id":"Addon_TheOnryo_01","ko":"비디오테이프 사본","en":"Videotape Copy","d":"사다코에 의해 각인된 죽음의 비디오테이프 사본. 복수의 욕망을 한풀 꺾이게 한다.<br><br>생존자가 <b>투영<\/b>으로 <b>죽음의 선고를 받은<\/b> 범위가 <b>2미터<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_02","ko":"오래된 신문","en":"Old Newspaper","d":"이것은 화산 폭발을 예견한 현지 여성에 대한 이야기인데, 사다코를 처음 발견하는 데 사용된 증거이다.<br><br><b>실체화<\/b> 후, 은신 기간이 <b>33%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_03","ko":"통나무집 표지판","en":"Cabin Sign","d":"토모코와 레이코가 비디오테이프를 봤던 통나무집. 첫 번째 저주들의 기억을 간직하고 있다.<br><br><b>투영<\/b> 후, TV 전원을 켜는 데 걸리는 시간이 <b>4.5초<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_04","ko":"어머니의 거울","en":"Mother's Mirror","d":"사다코의 어머니 집에 있던 거울. 사다코가 잃어버린 것을 상기시켜준다.<br><br><b>실체화<\/b> 후, 간헐적으로 보이는 기간이 <b>2초<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_05","ko":"레이코의 시계","en":"Reiko's Watch","d":"레이코가 아들 요이치에게 남겨준 시계. 그 사람의 운명이 임박했음을 끊임없이 정신없게 상기시켜준다.<br><br><b>실체화 해체<\/b> 동안 은신 지속시간이 <b>25%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_06","ko":"바닷물에 젖은 옷","en":"Sea-Soaked Cloth","d":"테이프에 나온 미스터리한 존재가 입었던 후드. 후드 주변에 있던 사람들로 하여금 자신이 지금 무엇을 보고 있는지 믿을 수 없게 만든다.<br><br>전원이 켜진 TV에서 <b>8미터<\/b> 내에 있는 생존자는 <b>실명<\/b> 상태 이상에 걸린다. 해당 효과는 TV가 꺼진 후 <b>7초<\/b> 동안 지속된다.<br><br><b>실명<\/b>된 생존자는 오라를 볼 수 없게 된다.","r":1,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_07","ko":"한줌의 머리카락","en":"Clump of Hair","d":"한때 아름답고 길었던 사다코의 머리카락, 이제는 다 들쑥날쑥하고 축축하게 엉겨붙은 머리카락 뒤로 자신을 숨겼다.<br><br><b>실체화 해제<\/b>된 동안 원령을 볼 수 있는 범위가 <b>6미터<\/b> <b>감소한다.<\/b>","r":1,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_08","ko":"우물의 돌","en":"Well Stone","d":"사다코가 빠졌던 우물의 한 조각으로, 비디오테이프를 시청한 모든 이의 마음 속에 깊이 새겨졌다.<br><br>생존자에 의해 TV가 꺼지면, TV 전원을 다시 켜는 데 걸리는 시간이 <b>7초<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_09","ko":"요이치의 낚시 그물","en":"Yoichi's Fishing Net","d":"요이치가 할아버지와 낚시할 때 사용했던 그물. 죽음은 모두에게 다가오고 있다는 것을 상기시켜준다.<br><br>최소 <b>4<\/b>의 <b>죽음의 선고<\/b>를 받은 생존자는 <b>실명<\/b>에 걸린다.<br><br><b>실명<\/b>된 생존자는 오라를 볼 수 없게 된다.","r":1,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_10","ko":"부서질 듯한 바람개비","en":"Rickety Pinwheel","d":"이즈오섬 동굴에서 발견된 바람개비. 바람이 불지 않을 때도 빙글빙글 돌기 때문에, 이것을 보거나 듣는 자는 방향 감각을 잃는다.<br><br>생존자는 전원이 켜진 TV에서 <b>8미터<\/b> 내에 있을 때 <b>인지 불가능<\/b> 상태 효과에 걸린다. 해당 효과는 TV가 꺼진 후 <b>7초<\/b> 동안 지속된다.<br><br><b>인지 불가능<\/b>은 생존자가 살인마의 공포 반경에 영향을 받거나 듣지 못하게 한다.","r":2,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_11","ko":"우물의 물","en":"Well Water","d":"사다코가 버려져 죽음을 당한 우물의 물. 까맣고 칙칙한 물이 주변의 모든 것을 가려버린다.<br><br>어떤 식으로든 <b>실체화<\/b>가 발동될 때 <b>감지 불가능<\/b> 상태 이상의 지속 시간이 <b>2초<\/b> <b>증가한다<\/b>.<br><br><b>감지 불가능<\/b>은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":2,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_12","ko":"링 그림","en":"Ring Drawing","d":"어린 요이치가 그린 우물 안의 모습. 테이프로 저주받은 사람들을 돕는 것은 불행을 가져올 뿐이다.<br><br>테이프를 보유한 생존자를 갈고리에 걸면, 다른 생존자들은 중첩으로 <b>죽음의 선고<\/b> <b>1<\/b>을 얻는다.","r":2,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_13","ko":"피투성이 손톱","en":"Bloody Fingernails","d":"사다코의 피투성이 손톱으로, 우물을 빠져나오려고 안간힘을 쓰는 도중 떨어져나왔다. 오직 죽여야 한다는 외골수적 욕구의 증거.<br><br><b>투영<\/b> 보너스 이동 속도의 지속 시간이 <b>50%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_14","ko":"어머니의 빗","en":"Mother's Comb","d":"비디오테이프에서 사다코의 어머니가 사용했던 빗. 사다코가 빗에 집중하면 그녀의 심령 능력이 향상된다.<br><br>TV를 끄면 큰 소리가 난다.어떤 식으로든 전원이 꺼진 TV가 있다면 오라를 드러낸다.","r":2,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_15","ko":"비디오카세트 레코더","en":"VCR","d":"사다코의 테이프를 재생했던 원래의 비디오카세트 레코더. 만지면 여전히 따뜻하다.<br><br>원령이 TV에 <b>투영<\/b>하면, 모든 TV가 <b>투영<\/b> 효과를 발동한다.","r":3,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_16","ko":"왜곡된 사진","en":"Distorted Photo","d":"테이프를 본 사람들은 그들의 사진이 모두 왜곡된 것을 발견하며, 자신들의 운명이 임박했음을 상기한다.<br><br><b>16미터<\/b> 내에서 실체화를 목격한 생존자는 소리를 지르며, 생존자의 오라가 <b>4초<\/b>간 드러난다.","r":3,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_17","ko":"전화기","en":"Telephone","d":"비디오를 본 후, 희생자들은 한 통의 전화를 받는다. 그들은 자신들이 7일 후 죽게 된다는 것을 깨닫고, 공포에 얼어붙는다.<br><br><b>실체화<\/b> <b>7미터<\/b> 내 생존자들은 <b>3%의 근육 손상<\/b> 상태 효과를 <b>3초<\/b> 동안 입는다.<br><br><b>근육 손상<\/b>은 생존자의 이동 속도를 감소시킨다.","r":3,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_18","ko":"테이프 편집 컨트롤러","en":"Tape Editing Deck","d":"레이코와 류지가 테이프를 분석하고 복사하는 데 사용했던 편집 컨트롤러. 테이프를 복사하고 공유하는 길만이 이 저주에서 살아남는 유일한 방법이다.<br><br>각 생존자는 테이프를 소지한 채 희생제를 시작하며, 목표 TV는 자신들의 위치에서 가장 먼 TV다.목표한 TV에 테이프를 넣을 때마다, 생존자의 오라가 <b>6초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_19","ko":"리모컨","en":"Remote Control","d":"통나무집에 있던 비디오테이프의 리모컨. 리모컨은 사다코가 멀리 있는 적에게 집중할 수 있도록 해준다.<br><br><b>투영<\/b>을 사용한 후, 전원이 켜진 TV로부터 <b>12미터<\/b> 내에 있는 생존자의 오라가 <b>7초<\/b> 동안 드러난다.","r":4,"c":"ka","o":"K27"},{"id":"Addon_TheOnryo_20","ko":"핏빛 비디오테이프","en":"Iridescent Videotape","d":"사다코의 저주가 담긴 오리지널 테이프.<br><br><b>투영<\/b>으로 TV의 전원을 끌 수 없으며, <b>죽음의 선고<\/b>를 적용하지 않는다.생존자가 TV를 끈 후 TV에 다시 전원이 들어오는 데 걸리는 시간을 <b>20%<\/b> <b>증가한다<\/b>.","r":4,"c":"ka","o":"K27"},{"id":"Addon_Toolbox_001","ko":"잡동사니","en":"Scraps","d":"스프링, 나사, 톱니 등의 잡다한 부품.<br><br>공구상자에 <b>내구도를 8<\/b> 추가한다.","r":0,"c":"sa","it":"toolbox"},{"id":"Addon_Toolbox_002","ko":"와이어 스풀","en":"Wire Spool","d":"휴대용으로 가지고 다닐 수 있지만 매우 무거운 무게를 자랑하는 철선.<br><br>공구상자에 <b>내구도를 12<\/b> 추가한다.","r":1,"c":"sa","it":"toolbox"},{"id":"Addon_Toolbox_003","ko":"깨끗한 천","en":"Clean Rag","d":"평범한 천 조각. 수상할 정도로 깨끗하다.<br><br>공구상자의 수리 속도가 <b>20%<\/b> <b>빨라진다<\/b>.","r":0,"c":"sa","it":"toolbox"},{"id":"Addon_Toolbox_004","ko":"그립 렌치","en":"Grip Wrench","d":"손잡이가 거친 조정용 렌치. 공구상자의 기본 구성품.<br><br>공구상자로 파괴된 갈고리는 재생성까지 <b>20초<\/b>가 걸린다.","r":2,"c":"sa","it":"toolbox"},{"id":"Addon_Toolbox_005","ko":"쇠톱","en":"Hacksaw","d":"한 손으로 들어 사용할 수 있는 작은 쇠톱.<br><br>공구상자를 이용한 파괴 공작 속도가 <b>30%<\/b> <b>증가한다<\/b>.","r":2,"c":"sa","it":"toolbox"},{"id":"Addon_Toolbox_006","ko":"보호 장갑","en":"Protective Gloves","d":"손재주를 부릴 수 없게 되지만 부상으로부터 손을 보호해주는 두꺼운 장갑.<br><br>공구상자를 이용하여 갈고리를 파괴하는 동안 살인마에게 발각되지 않는다.","r":1,"c":"sa","it":"toolbox"},{"id":"Addon_Toolbox_007","ko":"새로운 부품","en":"Brand New Part","d":"매우 정교하게 설계된 새로운 부품. 발전기와 호환되지 않을 것만 같다. 생산공정을 갓 마치고 출품된 것처럼 깨끗하게 빛난다.<br><br><b>공구상자 수리<\/b> 상호작용이 <b>새로운 부품 설치<\/b>로 대체된다.설치가 수행되는 동안, 어려운 스킬 체크가 발동한다.스킬 체크에 성공하면, 발전기의 필요 내구도가 <b>10<\/b> 감소한다.<i>이 애드온은 사용 후 소모된다.<\/i>","r":4,"c":"sa","it":"toolbox"},{"id":"Addon_Toolbox_008","ko":"설명서","en":"Instructions","d":"누군가가 다급하게 수리 방법을 기록해둔 나무 껍질.<br><br>공구상자로 수리하는 동안 스킬 체크가 제거된다.","r":0,"c":"sa","it":"toolbox"},{"id":"ADDON_toolbox_cuttingwire","ko":"커팅용 와이어","en":"Cutting Wire","d":"금속제 와이어의 양 끝에 나무 손잡이를 달아 만든 기본적인 절삭 도구.<br><br>공구상자를 이용한 파괴 공작 속도가 <b>20%<\/b> <b>빨라진다<\/b>.","r":1,"c":"sa","it":"toolbox"},{"id":"ADDON_toolbox_socketswivels","ko":"회전고리 소켓","en":"Socket Swivels","d":"기계 장치 내부 깊숙한 곳의 볼트를 조정할 수 있는 도구.<br><br>공구상자의 수리 속도가 <b>30%<\/b> <b>빨라진다<\/b>.","r":1,"c":"sa","it":"toolbox"},{"id":"ADDON_toolbox_springclamp","ko":"스프링 클램프","en":"Spring Clamp","d":"호스를 조정하거나 전선을 고정하는데 유용한 도구. 피해이나 부상을 방지한다.<br><br>수리 소음을 들을 수 있는 거리가 <b>8미터<\/b> 감소한다.","r":1,"c":"sa","it":"toolbox"},{"id":"ADDON_TormentMode_BlackStrap","ko":"검은 끈","en":"Black Strap","d":"금속 프레임에 피해자를 구속하는 데 사용됐던 나일론 끈. 색깔 때문에 피가 스며드는 것을 보기 어렵다.<b>지옥의 처벌<\/b>범위가 <b>25%<\/b> <b>감소한다<\/b>.<b>지옥의 처벌<\/b> 폭이 <b>25%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_BurningManPainting","ko":"버닝 맨 페인트","en":"Burning Man Painting","d":"레이크뷰 호텔의 도해. 죄책감의 장소 위에 붉은 불길이 그려져 있다. <b>지옥의 처벌<\/b>을 놓치면, <b>6초<\/b> 동안 <b>3미터<\/b> 내 생존자의 오라를 볼 수 있다.","r":2,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_CinderellaMusicBox","ko":"신데렐라의 오르골","en":"Cinderella Music Box","d":"신데렐라 동화에서 나온 오르골. 여러 지역을 다닌 듯한 수화물 스티커로 꾸며진 여행 가방에서 발견되었다.<b>지옥의 처벌의<\/b> 재사용 대기 시간이 <b>10% 감소한다<\/b>.","r":1,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_CopperRing","ko":"구리 반지","en":"Copper Ring","d":"브룩헤이븐 병원 지하실에서 발견되었다. 거미 그림이 새겨져있다.<b>판결 의식<\/b>의 최대 지속 시간이 <b>5초<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_CrimsonCeremoneyBook","ko":"크림슨 세레모니 책","en":"Crimson Ceremony Book","d":"고대 신에 관한 책. 작가는 미상이다.<b>지옥의 처벌<\/b>에 의해 부상을 당한 생존자는 <b>80초<\/b> 동안 <b>출혈<\/b>과 <b>깊은 상흔<\/b> 상태 이상에 빠진다.<br><br>출혈은 부상당한 생존자가 핏자국을 남길 확률을 증가시킨 출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":3,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_DeadButterfly","ko":"죽은 나비","en":"Dead Butterfly","d":"우드 사이드 아파트의 한 침대에서 발견된 나비. 나비는 만지면 부스러질 듯 약해 보인다.<b>판결 의식의<\/b> 재충전율이 <b>10% 증가한다<\/b>.","r":0,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_ForgottenVideotape","ko":"잊혀진 비디오테이프","en":"Forgotten Videotape","d":"사일런트 힐에서 휴식을 취하고 있는 연인이 찍힌 비디오테이프. 비디오테이프가 가진 감상적 가치에도 불구하고, 레이크뷰 호텔에 버려졌다.<b>지옥의 처벌<\/b>의 이동 속도가 <b>10%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_IridescentSealofMetatron","ko":"핏빛 메타트론 큐브","en":"Iridescent Seal of Metatron","d":"기묘한 디자인이 새겨진 부적. 엔티티의 영향력이 변화시킨 것 같다.<b>지옥의 처벌<\/b> 범위가 <b>50%<\/b> <b>감소한다<\/b>.<b>판결 의식<\/b> 흔적을 만들어, <b>지옥의 처벌<\/b> 범위가 최대 <b>200%<\/b> 증가한다.<b>지옥의 처벌<\/b>이 생존자를 타격하면 해당 효과는 초기화된다.","r":4,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_LeadRing","ko":"납 반지","en":"Lead Ring","d":"냉장고에서 발견됐다. 역겹고 비대한 얼굴이 새겨져있다.<b>지옥의 처벌<\/b> 범위가 <b>25%<\/b> <b>증가한다<\/b>.<b>지옥의 처벌<\/b> 폭이 <b>25%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_LeopardPrintFabric","ko":"표범 프린트 천","en":"Leopard-Print Fabric","d":"분홍색 표범 프린트 천 조각. 어디에 썼는지 구별하기 어렵다.<b>판결 의식<\/b>을 사용하는 동안 기절의 지속 시간이 <b>15%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_LostMemoriesBook","ko":"잃어버리 기억의 책","en":"Lost Memories Book","d":"사일런트 힐과 주변 지역의 역사와 전설에 대한 책이다.<b>지옥의 처벌<\/b>로 부상을 입은 생존자는 <b>80초<\/b> 동안 <b>인지 불가능<\/b> 상태에 빠진다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":3,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_MannequinFoot","ko":"마네킹 발","en":"Mannequin Foot","d":"마네킹의 부드러운 회색빛 발. 다리에서 잔인하게 뜯겨져 나왔다.<b>판결 의식<\/b> 흔적이 <b>10초<\/b> 동안 <b>탈진<\/b>을 발동한다.","r":2,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_MistyDayRemainsofJudgment","ko":"안개 낀 날, 판결 후 남은 것","en":"Misty Day, Remains of Judgment","d":"머리 위에 철제 피라미드를 두른 당당한 모습의 그림. 희생자들은 뒤에 갇혀 있다.<b>지옥의 처벌<\/b>으로 생존자에게 부상을 입히면 <b>8초<\/b> 동안 생존자의 오라가 드러난다.","r":2,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_ObsidianGoblet","ko":"흑요석 고블릿","en":"Obsidian Goblet","d":"순수 흑요석으로 조각된 고블릿, 오랜 고대의 것으로 보인다.<b>지옥의 처벌<\/b>로 판자와 부서지기 쉬운 문에 특수 파괴를 수행할 수 있다.<b>지옥의 처벌<\/b> 재사용 대기 시간이 <b>20%<\/b> 증가한다.","r":4,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_RustcoloredEgg","ko":"녹슨색 알","en":"Rust-colored Egg","d":"오래되어 보이는 주홍색 알. 메추리알 크기 정도다.<b>지옥의 처벌<\/b>로 생존자에게 부상을 입히면 <b>판결 의식<\/b> 내구도가 <b>30%<\/b> 증가한다.","r":3,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_ScarletEgg","ko":"다홍색 알","en":"Scarlet Egg","d":"신선한 알로 눈에 띄게 빨갛다. 메추리알 크기 정도다.<i>고통<\/i>에 걸린 생존자들은 질주할 때, <b>판결 의식<\/b> 흔적을 생성한다.이 흔적은 <b>5초<\/b> 동안 지속된다.<b>판결 의식<\/b> 흔적의 오라를 더 이상 볼 수 없다.","r":3,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_Spearhead","ko":"창 머리","en":"Spearhead","d":"날카롭고 녹슨 창끝. 마지막 희생자의 피로 물들었다.생존자가 <b>속죄의 우리<\/b>에서 구출되면, <b>8초<\/b> 동안 구출자의 오라를 볼 수 있다.","r":1,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_TabletoftheOppressor","ko":"압박자의 판","en":"Tablet of the Oppressor","d":"아즈텍 형상이 새겨진 금속판.<b>판결 의식<\/b>을 사용하는 동안, <b>감지 불가능<\/b> 상태 효과를 얻는다.","r":2,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_ValtielSectPhotograph","ko":"발티엘 종파 사진","en":"Valtiel Sect Photograph","d":"빨간 후드를 입은 두 사람의 사진. 신들을 위한 크림슨과 화이트 연회라는 제목이 붙여져있다.<i>고통<\/i>에 걸린 생존자 한 명마다 공포 범위가 <b>2미터<\/b>씩 <b>감소한다<\/b>.","r":2,"c":"ka","o":"K20"},{"id":"ADDON_TormentMode_WaxDoll","ko":"밀랍 인형","en":"Wax Doll","d":"밀랍으로 조각한 인형, 곧 자신에게 내려질 판결을 직면하게 될 죄수가 손수 만든 인형.<b>지옥의 처벌<\/b> 범위가 <b>5%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K20"},{"id":"ADDON_trap_BloodyCoil","ko":"피투성이 코일","en":"Bloody Coil","d":"끈적하기도 하고, 미끄럽기도 한 이 끔찍한 액체는 곰덫의 스프링을 다루는 것을 더욱 위험하게 만든다.<br><br>건강한 상태의 생존자가 <b>곰덫<\/b>을 무력화시키면, 피투성이 코일이 대가를 요구하여 그 생존자를 부상한 상태로 만든다.","r":4,"c":"ka","o":"Chuckles"},{"id":"ADDON_trap_DiamondStone","ko":"핏빛 연마석","en":"Iridescent Stone","d":"이 무서울 정도로 빛나는 돌로 날카로워진 덫들은 각자 자아를 가지고 있는 것처럼 보인다.<br><br><b>30초<\/b>마다, 무력화되어 있던 <b>곰덫<\/b> 중 하나가 자동으로 설치된다.","r":4,"c":"ka","o":"Chuckles"},{"id":"ADDON_trap_OilyCoil","ko":"매끄러운 코일","en":"Oily Coil","d":"곰덫을 건드리는 자를 찾아내기 위해 기름을 바른 스프링.<br><br><b>곰덫<\/b>을 초기화할 때, <b>5초<\/b> 동안 곰덫을 무력화하려는 생존자의 오라가 드러난다.","r":3,"c":"ka","o":"Chuckles"},{"id":"ADDON_trap_RustedJaw","ko":"녹슨 턱","en":"Rusted Jaws","d":"단단하고 불안정한 녹슨 곰덫은 사냥감에게 치료하기 힘든 상처를 입힌다.<br><br><b>곰덫<\/b>은 곰덫을 밟은 생존자를 <b>70초<\/b> 동안 <b>깊은 상흔<\/b>에 빠지게 한다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"Chuckles"},{"id":"ADDON_trap_StitchedBag","ko":"고탄력 스프링","en":"Tension Spring","d":"늘어난 후 제자리로 돌아가는 고탄력 스프링.<br><br><b>곰덫<\/b>은 생존자가 탈출한 후 <b>2초<\/b> 후 재설정된다.","r":3,"c":"ka","o":"Chuckles"},{"id":"ADDON_trap_TrapSetters","ko":"커피 찌꺼기","en":"Coffee Grounds","d":"버려진 커피 찌꺼기가 담긴 오래되고 녹슨 깡통.<br><br><b>곰덫<\/b> 설치 후, <b>5%<\/b>의 <b>이동 속도 증가 효과<\/b>를 가진다.<br><br>이동 속도 증가 효과는 살인마의 이동 속도를 증가시킨다.","r":1,"c":"ka","o":"Chuckles"},{"id":"Addon_Trickster_01","ko":"메멘토 칼","en":"Memento Blades","d":"피 묻은 칼로 오랫동안 사용한 듯 많이 닳아있다. 지운의 첫 살인부터 사용했던 것으로 그에겐 상징적인 칼이다.<br><br>블레이드로 조준할 때, 십자선이 <b>표시된다<\/b>.","r":0,"c":"ka","o":"K23"},{"id":"Addon_Trickster_02","ko":"트릭 주머니","en":"Trick Pouch","d":"숨은 주머니가 많은 작은 가방. 숨길 것과 야심이 가득한 마술사가 사용했던 것.<br><br>최대로 소지할 수 있는 칼의 수가 <b>8개<\/b> <b>증가한다<\/b>.<b>칼 8개를 추가로<\/b> 소지한 채 희생제를 시작한다.","r":0,"c":"ka","o":"K23"},{"id":"Addon_Trickster_03","ko":"킬링 파트 선율","en":"Killing Part Chords","d":"지운은 절대 찾지 못한 코드. 하지만 여전히 그 소리는 명백히 외기 쉬운 파트였다.<br><br>스타일 랭크가 D에서 A로 서서히 감소하기 전 시간이 <b>50%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K23"},{"id":"Addon_Trickster_04","ko":"지옥의 전선","en":"Inferno Wires","d":"5명의 NO SPIN 멤버를 죽음으로 몰아간 스튜디오 화재에서 나온 타버린 전선. 그들의 죽음은 트릭스터를 세상에 알리는 계기가 되었다.<br><br>S랭크의 스타일 랭크 타이머가 <b>20%<\/b> <b>증간한다<\/b>.","r":0,"c":"ka","o":"K23"},{"id":"Addon_Trickster_05","ko":"지운의 사인","en":"Ji-woon's Autograph","d":"트릭스터로 알려진 연예인의 서명. 수 백 명에게 서명을 해준 그의 팔목은 아파졌지만 그를 찾는 사람이 많다는 사실에 그는 더욱 힘이 났다.<br><br>메인 이벤트의 지속 시간이 <b>44%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K23"},{"id":"Addon_Trickster_06","ko":"On Target 싱글","en":"On Target Single","d":"지운이 인기를 얻기 전 직접 제작한 언더그라운드 싱글 음반. NO SPIN의 진정한 열성팬들 만이 이 숨겨진 보석을 수집했다.<br><br>S랭크 동안 칼로 타격할 때마다 메인 이벤트의 지속 시간이 <b>0.5초<\/b> <b>증가하며<\/b> 최대 <b>20초<\/b>까지 증가한다.","r":2,"c":"ka","o":"K23"},{"id":"Addon_Trickster_07","ko":"행운의 칼","en":"Lucky Blade","d":"지운이 처음으로 투척한 칼. 패밀리 레스토랑에 자주 오는 손님들을 위한 쇼를 위해 지운의 아버지가 구입한 칼이다.<br><br><br>8번째 블레이드 타격마다, 추가 보너스가 무작위로 할당된다:<br><br><b>5초<\/b> 동안 투척 속도가 <b>5%<\/b> <b>증가한다<\/b>.<b>6초<\/b> 동안 <b>3%<\/b>의 이동 속도 증가 효과를 얻는다.추가 스타일 포인트를 <b>획득한다<\/b>.","r":1,"c":"ka","o":"K23"},{"id":"Addon_Trickster_08","ko":"Caged Heart 신발","en":"Caged Heart Shoes","d":"One Caged Heart의 뮤직비디오 촬영 때 신었던 신발. 포인트가 되는 춤을 출 때 더욱 부드럽고 우아하게 움직일 수 있도록 도와준다.<br><br>판자 또는 부서지기 쉬운 문에 기본 파괴를 수행하거나 발전기를 폭발시키거나 손상을 입히면, 다음 투척 상태에 들어서면, 투척 상태에서 <b>10초<\/b> 동안 이동 속도가 <b>5%<\/b> 증가한다.","r":1,"c":"ka","o":"K23"},{"id":"Addon_Trickster_09","ko":"테킬라 문락","en":"Tequila Moonrock","d":"창원의 어느 바에서 만든 술. 지운이 가장 좋아하는 술이 되었다.<br><br>스타일 랭크를 얻은 후 <b>10초<\/b> 동안 투척 속도가 <b>8%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K23"},{"id":"Addon_Trickster_10","ko":"피투성이 보아","en":"Bloody Boa","d":"지운이 베여버린 희생자의 목에 두른 보아. 많은 주머니가 숨겨져있다.<br><br>열상 미터기가 부식하는 속도가 <b>75%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K23"},{"id":"Addon_Trickster_11","ko":"피즈-스핀 탄산음료","en":"Fizz-Spin Soda","d":"NO SPIN 홍보를 위해 제작된 한정판 탄산음료 캔. 당과 카페인 함량이 높다.<br><br>투척 속도를 올리는 데 필요한 칼 투척 수가 <b>2<\/b>개 <b>감소한다<\/b>.","r":2,"c":"ka","o":"K23"},{"id":"Addon_Trickster_12","ko":"Waiting for You 시계","en":"Waiting for You Watch","d":"지운이 I’ll Be Waiting for You 라이브 공연 당시 착용했던 회중시계. 그저 무대용 장식으로 사용되므로 시침이 움직이는 일은 없다.<br><br>열상 미터기가 완전히 부식된 생존자들의 위치가 <b>10초<\/b> 동안 완전히 드러난다.","r":2,"c":"ka","o":"K23"},{"id":"Addon_Trickster_13","ko":"Ripper 보호대","en":"Ripper Brace","d":"지운의 뮤직비디오 Ripper를 촬영하던 당시 착용했던 손목 보호대. 의도하지 않았지만, 디자인은 다른 많은 의학 교정기보다 손목을 더 안정시켰다.<br><br>각 스타일 랭크마다, 창문 기본 뛰어넘기, 판자 또는 부서지기 쉬운 문에 기본 파괴 공격, 발전기 손상을 <b>6%<\/b> 더 빠르게 수행한다.","r":2,"c":"ka","o":"K23"},{"id":"Addon_Trickster_14","ko":"아름다운 선율의 살인","en":"Melodious Murder","d":"희생자들의 입 밖으로 흘러나온 날카롭고 또렷한 비명을 녹음한 음성 파일. 지운은 그 비명소리를 좀 더 그의 인기 있는 노래에 삽입하였다.<br><br>캐비닛 안에서 <b>칼<\/b>을 재장전하는 속도가 <b>25% 증가한다<\/b>.","r":2,"c":"ka","o":"K23"},{"id":"Addon_Trickster_15","ko":"다이아몬드 커프링크","en":"Diamond Cufflinks","d":"지운을 미행하는 실수를 범한 사생팬의 눈에 박힌 커프링크. 흐르는 피를 닦아내면 반짝이는 것들이 보일 것이다.<br><br>생존자의 열상 미터기가 가득 채워지기까지 딱 한발의 칼 타격이 남았을 때, <b>6초<\/b> 동안 생존자의 오라가 드러난다.","r":3,"c":"ka","o":"K23"},{"id":"Addon_Trickster_16","ko":"Edge of Revival 앨범","en":"Edge of Revival Album","d":"트릭스터의 데뷔 앨범. 거칠고 공격적인 말투는 비평가들의 호평에도 불구하고 팬들 사이에서는 엇갈린 반응들이 존재했다<br><br><b>20미터<\/b> 이상 거리에서 투척한 칼은 <b>100%<\/b> 더 열상을 발행시킨다.","r":3,"c":"ka","o":"K23"},{"id":"Addon_Trickster_17","ko":"트릭 칼","en":"Trick Blades","d":"상상력이 부족한 이들에게는 그저 결점 있는 칼로 보일지 모르지만 지운에게는 특수한 칼이다. 어린 지운은 그가 연기한 트릭으로 관중들을 현혹시켰다.<br><br>칼은 1회에 한해 주변 환경에 맞고 <b>튕길 수도 있다<\/b>.칼이 튕겨진 후, 8번째 칼의 타격마다, 추가 보너스가 무작위로 할당된다:열상이 <b>100%<\/b> 증가한다.<b>4.4초<\/b> 동안 <b>12미터<\/b> 내에 생존자의 오라가 드러난다.추가 <b>스타일 포인트<\/b>를 획득한다.","r":3,"c":"ka","o":"K23"},{"id":"Addon_Trickster_18","ko":"Cut Thru U 싱글","en":"Cut Thru U Single","d":"지운이 NO SPIN에 멤버로 합류한 후 처음으로 발매된 싱글. 한국 음악 차트를 휩쓸었다.<br><br><b>A-랭크<\/b>에 도달 시, 살인마의 본능으로 <b>32미터<\/b> 내 생존자의 위치가 <b>4.4초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K23"},{"id":"Addon_Trickster_19","ko":"최후의 발악 컬렉션","en":"Death Throes Compilation","d":"지운이 살해한 희생자들의 마지막 소리를 모은 컬렉션. 레코드판에 녹음되었다. 그들이 느끼는 공포와 감정이 날것 그대로 느껴진다.<br><br>메인 이벤트가 종료되면 최대 용량의 <b>75%<\/b>만큼 칼날을 <b>리필된다<\/b>.","r":4,"c":"ka","o":"K23"},{"id":"Addon_Trickster_20","ko":"핏빛 포토 카드","en":"Iridescent Photocard","d":"안개 자체에서 만들어진 유리 같은 사진. 지운의 눈이 웃는 얼굴에 홀로그래픽처럼 희미하게 비친다.<br><br><b>메인 이벤트 도중 100%<\/b> <b>증가한다<\/b>.메인 이벤트가 활성화되면: 모든 생존자에게 당신의 오라가 드러나고, 모든 생존자의 오라 역시 드러난다. 또한, 모든 발전기가 <b>6초<\/b> 동안 차단된다.","r":4,"c":"ka","o":"K23"},{"c":"it","id":"Item_Camper_AlexsToolbox","ko":"알렉스의 공구상자","en":"Alex's Toolbox","d":"다양한 크기의 톱과 바이스 외에도 많은 공구가 들어간 철제 상자. 공구상자에 들어있는 공구들은 파괴가 목적인 공구들이지만, 다양한 기계 장치를 수리할 때도 쓸 수 있다.<br><br><b>내구도 18<\/b>.수리 속도가 <b>10%<\/b> <b>빨라진다<\/b>.<b>파괴 공작<\/b> 능력이 활성화된다.파괴 공작 속도가 <b>100%<\/b> <b>빨라진다<\/b>.<br><br>발전기 한 대를 수리하는 데 내구도 <b>90<\/b>이 필요하다.<br><br>갈고리 파괴 공작은 내구도 <b>6<\/b>이 필요하다.","r":3,"it":"toolbox"},{"c":"it","id":"Item_Camper_AnniversaryToolbox","ko":"기념일 공구상자","en":"Anniversary Toolbox","d":"폭발하는 공구상자.<br><br><b>내구도 32<\/b>.수리 속도가 <b>50%<\/b> <b>증가한다<\/b>.파괴 공작 능력이 활성화된다.파괴 공작 속도가 <b>50%<\/b> <b>증가한다<\/b>.일단 고갈되면 불꽃을 터뜨린다. 야호!<br><br>발전기 한 대를 수리하는 데 내구도 <b>90<\/b>이 필요하다.<br><br>갈고리 파괴 공작은 내구도 <b>6<\/b>이 필요하다.","r":0,"it":"toolbox"},{"c":"it","id":"Item_Camper_BeigeMap","ko":"휘갈겨 쓴 지도","en":"Scribbled Map","d":"양피지를 들여다보던 당신의 마음속에 길이 나타난다. 그러나 그것도 잠시, 당신은 다시 길을 잃은 듯한 느낌을 받는다.<br><br>아이템 사용 버튼을 눌러 <b>32미터<\/b> 반경에 있는 모든 판자와 뛰어넘기 장소의 오라가 <b>12초<\/b> 동안 드러난다.2차 상호 작용을 사용하면 생존자의 위치에 빛줄기가 생성된다. 빛줄기의 <b>32미터<\/b> 반경에 있는 발전기들의 오라가 빨간색으로 드러난다.내구도 5.","r" const norm=s=>(s||'').toLowerCase().replace(/[\s'’"“”.,:!?\-·&()]/g,'');
const cho=s=>[...s].map(c=>{const k=c.charCodeAt(0)-0xAC00;return k>=0&&k<11172?CHO[Math.floor(k/588)]:c}).join('');
const strip=h=>(h||'').replace(/<[^>]+>/g,' ');
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ALIAS={deadhard:'dh',borrowedtime:'bt',decisivestrike:'ds',sprintburst:'sb',barbecuechili:'bbq',hexnooneescapesdeath:'noed',popgoestheweasel:'pop',hexruin:'ruin',corruptintervention:'ci',selfcare:'sc',unbreakable:'ub',offtherecord:'otr',windowsofopportunity:'wglf wo',balancedlanding:'bl',hexdevourhope:'devour',scourgehookpainresonance:'pr',scourgehookgiftofpain:'gop',callofbrine:'cob',grimembrace:'ge',hexpentimento:'penti',anursescalling:'nc',spinechill:'sc',imallears:'iae',lethalpursuer:'lp',madeforthis:'mft',deadlock:'dl',noway:'nw',eruption:'erupt',hexundying:'undying',hexplaything:'plaything',nowheretohide:'nth'};
const chars={};
D.killers.forEach(c=>chars[c.id]={...c,c:'k'});
D.survivors.forEach(c=>chars[c.id]={...c,c:'s'});
const all=[...D.entries, ...Object.values(chars).map(c=>({c:c.c,id:c.id,ko:c.ko,en:c.en,d:c.d,o:c.id}))];
all.forEach((e,i)=>{e.i=i;e.key=e.c+':'+e.id;e.kn=norm(e.ko);e.ch=cho(e.kn);e.enn=norm(e.en);e.al=(ALIAS[e.enn]||'').split(' ').filter(Boolean);if(chars[e.id]&&chars[e.id].c==='k'){e.pn=norm(chars[e.id].power.ko);e.pen=norm(chars[e.id].power.en)}e.dn=norm(strip(e.d));
  const o=chars[e.o]; if(o){e.okn=norm(o.ko);e.oen=norm(o.en)}});
const byKey=Object.fromEntries(all.map(e=>[e.key,e]));
const perkKey=id=>byKey['sp:'+id]||byKey['kp:'+id];

let state={q:'',cat:'all',who:'',sel:null,limit:60};
try{const s=JSON.parse(localStorage.getItem('fog-state')||'{}');if(s.cat)state.cat=s.cat;}catch(e){}

/* character select */
const who=document.getElementById('who');
who.innerHTML='<option value="">캐릭터 전체</option>'+
 '<optgroup label="살인마">'+D.killers.map(c=>`<option value="${c.id}">${esc(c.ko)}</option>`).join('')+'</optgroup>'+
 '<optgroup label="생존자">'+D.survivors.map(c=>`<option value="${c.id}">${esc(c.ko)}</option>`).join('')+'</optgroup>';

function color(e){
  if(e.r!=null)return `var(--r${e.r})`;
  if(e.c==='sp'||e.c==='s')return 'var(--sv)';
  return 'var(--kl)';
}
function glyph(e,big){
  const shape=(e.c==='sp'||e.c==='kp')?'perk':(e.c==='k'||e.c==='s')?'char':'addon';
  return `<span class="g ${shape}${big?' big':''}" style="--c:${color(e)}"><span>${esc([...e.ko][0]||'')}</span></span>`;
}
function ownerLabel(e){
  if(e.c==='sa'||e.c==='it')return ITEM[e.it]||'아이템';
  if(e.c==='of')return ROLE[e.role]||'';
  if(e.c==='k'||e.c==='s')return chars[e.id].c==='k'?(chars[e.id].power.ko||''):'';
  const o=chars[e.o];return o?o.ko:'공용';
}

/* scoring: name exact > prefix > contains > initials > owner name > description */
function score(e,q,qc,isCho){
  if(isCho){
    if(e.ch.startsWith(qc))return 70; if(e.ch.includes(qc))return 55; return 0;
  }
  if(e.kn===q||e.enn===q)return 100;
  if(e.al&&e.al.includes(q))return 95;
  if(e.kn.startsWith(q)||e.enn.startsWith(q))return 85;
  if(e.pn&&(e.pn.includes(q)||e.pen.includes(q)))return 75;
  if(e.kn.includes(q)||e.enn.includes(q))return 70;
  if(e.okn&&(e.okn.includes(q)||e.oen.includes(q)))return 30;
  if(q.length>=2&&e.dn.includes(q))return 10;
  return 0;
}
function results(){
  const q=norm(state.q); const isCho=q&&/^[ㄱ-ㅎ]+$/.test(q);
  let pool=all;
  if(state.who){const c=chars[state.who];
    pool=all.filter(e=>e.o===state.who||(c&&c.perks.includes(e.id)&&(e.c==='sp'||e.c==='kp')));}
  if(state.cat!=='all')pool=pool.filter(e=>state.cat==='char'?(e.c==='k'||e.c==='s'):e.c===state.cat);
  if(!q){
    const ord={k:0,s:0,sp:1,kp:1,ka:2,sa:2,it:2,of:3};
    return pool.slice().sort((a,b)=>state.who?(ord[a.c]-ord[b.c])||((a.r??0)-(b.r??0)):a.ko.localeCompare(b.ko,'ko')).map(e=>[e,0]);
  }
  return pool.map(e=>[e,score(e,q,q,isCho)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||a[0].ko.localeCompare(b[0].ko,'ko'));
}
function hi(text,q){
  if(!q)return esc(text);
  const n=norm(q); if(/^[ㄱ-ㅎ]+$/.test(n))return esc(text);
  const i=text.toLowerCase().indexOf(q.trim().toLowerCase());
  if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.trim().length))+'</mark>'+esc(text.slice(i+q.trim().length));
}
function renderChips(){
  const counts={all:all.length,char:0};all.forEach(e=>{if(e.c==='k'||e.c==='s')counts.char++;else counts[e.c]=(counts[e.c]||0)+1});
  const list=[['all','전체'],['sp','생존자 기술'],['kp','살인마 기술'],['ka','살인마 애드온'],['sa','아이템 애드온'],['it','아이템'],['of','공물'],['char','캐릭터']];
  document.getElementById('chips').innerHTML=list.map(([k,l])=>`<button class="chip" data-cat="${k}" aria-pressed="${state.cat===k}">${l}<span class="n">${counts[k]}</span></button>`).join('');
}
function renderList(){
  const r=results(); const list=document.getElementById('list');
  document.getElementById('count').textContent=`${r.length.toLocaleString()}개`;
  const isCho=/^[ㄱ-ㅎ]+$/.test(norm(state.q));
  document.getElementById('mode').textContent=state.q?(isCho?'초성 검색':''):(state.who?chars[state.who].ko+' 관련 항목':'가나다순');
  if(!r.length){list.innerHTML=`<div class="empty">‘${esc(state.q)}’와 맞는 항목이 없습니다. ${state.who?`지금 ‘${esc(chars[state.who].ko)}’ 캐릭터 필터가 켜져 있어요. 위 선택 상자에서 ‘캐릭터 전체’로 바꿔 보세요.`:'초성(예: ㅈㄱㅅㄱ)이나 영문명으로도 찾아보세요.'}</div>`;return}
  const shown=r.slice(0,state.limit);
  list.innerHTML=shown.map(([e,s])=>{
    const tag=e.r!=null?`<b>${RAR[e.r][1]}</b>${esc(ownerLabel(e))}`:`<b>${CAT[e.c]}</b>${esc(ownerLabel(e))}`;
    return `<button class="row" role="option" data-key="${e.key}" aria-selected="${state.sel===e.key}">${glyph(e)}<span style="min-width:0"><span class="nm">${hi(e.ko,state.q)}</span><span class="en">${hi(e.en||'',state.q)}${s===10?' · 설명에서 찾음':''}</span></span><span class="tag">${tag}</span></button>`}).join('')+
    (r.length>state.limit?`<button class="more" id="more">${(r.length-state.limit).toLocaleString()}개 더 보기</button>`:'');
}
/* 설명 속 숫자 강조: 단계별 수치(10/12.5/15)는 기술 등급 색, 고정 수치는 강조색 */
const NUM_RE=/(\d+(?:\.\d+)?(?:\/\d+(?:\.\d+)?)*)(\s?(?:%|초|미터|m|개|회|단계|번|명|배|칸))?/g;
function fmtNums(html){
  let tiered=false;
  const out=(html||'').split(/(<[^>]+>)/).map(part=>{
    if(part.startsWith('<'))return part;
    return part.replace(NUM_RE,(m,n,u)=>{
      const unit=u||'';
      const vals=n.split('/');
      if(vals.length>=2&&vals.length<=3){
        tiered=true;
        const cls=vals.length===3?['t1','t2','t3']:['t1','t3'];
        return `<span class="tier" title="기술 등급별 수치">${vals.map((v,i)=>`<i class="${cls[i]}">${v}</i>`).join('<i class="sl">/</i>')}${unit}</span>`;
      }
      return `<span class="num">${n}${unit}</span>`;
    });
  }).join('');
  return {html:out,tiered};
}
function descBlock(html){
  const r=fmtNums(html);
  return `<div class="desc">${r.html}</div>`+(r.tiered?`<div class="legend"><span><b style="background:var(--t1)"></b>1단계</span><span><b style="background:var(--t2)"></b>2단계</span><span><b style="background:var(--t3)"></b>3단계</span></div>`:'');
}
function mini(e){return e?`<button class="mini" data-key="${e.key}">${glyph(e)}<span class="t">${esc(e.ko)}</span></button>`:''}
function namu(e){return 'https://namu.wiki/Search?q='+encodeURIComponent(e.ko)}
function renderDetail(){
  const box=document.getElementById('detail'); const e=byKey[state.sel];
  if(!e){
    box.innerHTML=`<div class="note">게임 데이터 v${esc(D.version)} 기준 · 살인마 ${D.killers.length}명, 생존자 ${D.survivors.length}명. 상태 효과 이름은 게임 한국어 표기를 따르며, ‘회피’처럼 일부 신규 용어는 추정 번역입니다.</div>
    <p class="hint">게임에서 본 이름을 그대로 쳐 보세요. 초성 <kbd>ㅈㄱㅅㄱ</kbd>, 줄임말 <kbd>noed</kbd>, 영문 <kbd>dead hard</kbd>, 캐릭터 이름 <kbd>너스</kbd> 모두 됩니다.</p>
    <div class="sec"><h3>자주 찾는 기술</h3><div class="minis">${['deadhard','borrowedtime','decisivestrike','sprintburst','adrenaline','barbecuechili','hexruin','popgoestheweasel','hexnooneescapesdeath','unbreakable','lethalpursuer','deadlock','madeforthis'].map(n=>mini(all.find(x=>(x.c==='sp'||x.c==='kp')&&x.enn===n))).join('')}</div></div>`;
    return;
  }
  let h=`<button class="back" id="back">← 목록으로</button><div class="dhead">${glyph(e,true)}<div style="min-width:0"><h2>${esc(e.ko)}</h2><div class="en">${esc(e.en||'')}</div></div></div><div class="pills">`;
  h+=`<span class="pill">${CAT[e.c]}</span>`;
  if(e.r!=null)h+=`<span class="pill r" style="--c:var(--r${e.r})">${RAR[e.r][1]} · ${RAR[e.r][0]}</span>`;
  if(e.c==='sa')h+=`<span class="pill">${ITEM[e.it]||''} 애드온</span>`;
  if(e.c==='it'&&ITEM[e.it])h+=`<span class="pill">${ITEM[e.it]}</span>`;
  if(e.c==='of')h+=`<span class="pill">${ROLE[e.role]||''}</span>`;
  const o=chars[e.o];
  if(o&&e.c!=='k'&&e.c!=='s')h+=`<button class="pill" data-who="${o.id}">${esc(o.ko)}의 ${e.c==='ka'?'애드온 전체':'기술'}</button>`;
  else if((e.c==='sp'||e.c==='kp'))h+=`<span class="pill">공용 기술</span>`;
  h+='</div>';
  if(e.c==='k'||e.c==='s'){
    const c=chars[e.id];
    if(c.c==='k'){h+=`<div class="sec"><h3>능력 · ${esc(c.power.ko)}</h3>${descBlock(c.power.d||c.d)}</div>`}
    else h+=descBlock(c.d);
    h+=`<div class="sec"><h3>고유 기술</h3><div class="minis">${c.perks.map(id=>mini(perkKey(id))).join('')}</div></div>`;
    if(c.c==='k'){const ads=all.filter(a=>a.c==='ka'&&a.o===c.id).sort((a,b)=>a.r-b.r);
      h+=`<div class="sec"><h3>애드온 ${ads.length}개</h3><div class="minis">${ads.map(mini).join('')}</div></div>`}
    if(c.story)h+=`<div class="sec"><h3>배경 이야기</h3><div class="desc">${c.story}</div></div>`;
  } else {
    h+=descBlock(e.d);
    if(e.f)h+=`<div class="flavor">${e.f}</div>`;
    if(o&&(e.c==='sp'||e.c==='kp')){const others=o.perks.filter(id=>id!==e.id).map(perkKey);
      h+=`<div class="sec"><h3>${esc(o.ko)}의 다른 고유 기술</h3><div class="minis">${others.map(mini).join('')}${mini(byKey[o.c+':'+o.id])}</div></div>`}
  }
  h+=`<div class="links"><a href="${namu(e)}" target="_blank" rel="noopener">나무위키에서 ‘${esc(e.ko)}’ 검색 ↗</a></div>`;
  box.innerHTML=h;
}
function render(){renderChips();renderList();renderDetail()}
function select(key){
  state.sel=key;renderList();renderDetail();
  const d=document.getElementById('detail');d.scrollTop=0;
  if(matchMedia('(max-width:820px)').matches&&key)d.classList.add('open');
}
const q=document.getElementById('q'),clr=document.getElementById('clr');
q.addEventListener('input',()=>{state.q=q.value;state.limit=60;clr.hidden=!q.value;renderList()});
q.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const f=document.querySelector('.row');if(f){select(f.dataset.key);q.blur()}}});
clr.onclick=()=>{q.value='';state.q='';clr.hidden=true;renderList();q.focus()};
who.onchange=()=>{state.who=who.value;state.limit=60;if(state.who)state.sel=state.who&&(chars[state.who].c+':'+state.who);render()};
document.addEventListener('click',ev=>{
  const c=ev.target.closest('[data-cat]');if(c){state.cat=c.dataset.cat;state.limit=60;try{localStorage.setItem('fog-state',JSON.stringify({cat:state.cat}))}catch(e){};renderChips();renderList();return}
  const k=ev.target.closest('[data-key]');if(k){select(k.dataset.key);return}
  const w=ev.target.closest('[data-who]');if(w){who.value=w.dataset.who;who.onchange();return}
  if(ev.target.id==='more'){state.limit+=100;renderList();return}
  if(ev.target.id==='back'){document.getElementById('detail').classList.remove('open')}
});
document.addEventListener('keydown',ev=>{if(ev.key==='/'&&document.activeElement!==q){ev.preventDefault();q.focus()}});
document.getElementById('ver').textContent=D.version;
render();
</script>

</body>
