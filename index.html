결실","en":"Fruits of Your Labor","d":"발전기가 완료될 때마다, 토큰 1개를 획득한다.<br><br>발전기 수리가 완료될 때마다, 각 토큰은:<ul><li>2초 동안 5%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>10/15/20%의 치료 진행도를 얻는다.<\/li><\/ul>","o":"S54"},{"c":"sp","id":"S54P02","ko":"구원의 울음소리","en":"Salvation's Cry","d":"살인마가 당신을 추격할 때마다:<ul><li>1/2/3초 동안 다른 생존자의 오라를 볼 수 있다.<\/li><li>추격당하지 않는 생존자는 당신의 오라를 5초 동안 볼 수 있다.<\/li><li>추격당하지 않는 생존자는 살인마의 오라를 5초 동안 볼 수 있다.<\/li><\/ul>","o":"S54"},{"c":"sp","id":"S54P03","ko":"호재: 확고부동","en":"Boon: Steadfast","d":"토템 옆에 있을 때, <b>능력 활성화<\/b> 버튼을 사용해 토템을 축복하여, 모든 호재를 결합하는 호재 토템을 생성할 수 있다.<br><br>호재 범위 내에 발전기는:<ul><li>50% 더 느리게 퇴보한다.<\/li><li>생존자는 8/9/10% 더 빠르게 발전기를 수리한다.<\/li><\/ul><br><br>호재 범위 내 생존자는 영향을 받는 발전기의 오라를 볼 수 있다.","o":"S54"},{"c":"sp","id":"Saboteur","ko":"공작원","en":"Saboteur","d":"살인마가 다른 생존자를 옮기는 동안 56미터 범위 내에 있으면, 당신은 갈고리와 재앙의 갈고리 오라를 볼 수 있게 된다.<br><br>갈고리에 파괴 공작을 수행할 수 있다. 재사용 대기 시간: 70/65/60초.","o":"Jake"},{"c":"kp","id":"Save_The_Best_For_Last","ko":"가장 좋은 것은 마지막에","en":"Save the best for last","d":"집착 대상이 아닌 생존자에게 기본 공격으로 피해를 입힐 때마다, 토큰 1개를 획득하고, 최대 6/7/8개를 획득할 수 있다.<br><br>각 토큰마다, 당신의 기본 공격 재사용 대기 시간이 5% 더 짧아진다.<br><br>집착 대상이 피해를 입을 때마다, 토큰 2개를 잃는다.<br><br>집착 대상이 죽으면, 토큰을 획득할 수 없다.","o":"Shape"},{"c":"sp","id":"SecondWind","ko":"새로운 활력","en":"Second Wind","d":"<b>치료 불능<\/b> 상태가 아닌, 1 생존자를 치료하면, 당신은 갈고리에서 탈출했을 때, <b>치료 불능<\/b>에 걸린다.<br><br>빈사 상태가 아니라면, 28/24/20초 후 즉시 치료된다.","o":"Steve"},{"c":"sp","id":"Self_Care","ko":"자가 치료","en":"Self-Care","d":"스스로 자가 치료할 수 있으나, 75/70/65% 더 느리게 치료한다.","o":"Claudette"},{"c":"sp","id":"SelfSufficient","ko":"불굴","en":"Unbreakable","d":"살인마에 의해 빈사 상태가 되면, 희생제당 단 한번만 완전히 회복할 수 있다.<br><br>빈사 상태에서 당신은 25/30/35% 더 빠르게 회복한다.","o":"Bill"},{"c":"kp","id":"Shadowborn","ko":"그림자의 피조물","en":"Shadowborn","d":"실명이 될 때마다, 10초 동안 6/8/10%의 <b>이동 속도 증가<\/b> 효과를 얻는다.","o":"Bob"},{"c":"sp","id":"Slippery_Meat","ko":"미끈한 고기","en":"Slippery Meat","d":"스스로 갈고리에서 탈출 시도를 최대 6회 수행할 수 있으며, 성공 확률이 2/3/4% 더 많다."},{"c":"kp","id":"Sloppy_Butcher","ko":"악독한 도살자","en":"Sloppy Butcher","d":"기본 공격으로 생존자에게 피해를 입혔을 때마다:<ul><li>생존자는 70/80/90초 동안 <b>출혈<\/b> 효과를 얻는다.<\/li><li>생존자는 70/80/90초 동안 <b>근육 손상<\/b> 효과를 얻는다.<\/li><\/ul><br><br><b>출혈<\/b>에 걸린 생존자들은 25% 더 빠르게 치료 진행도를 잃는다."},{"c":"sp","id":"Small_Game","ko":"작은 사냥감","en":"Small Game","d":"당신이 바라보는 전방 45도, 8/10/12미터의 원뿔형 범위 안에 토템이 있다면 알림을 받게 된다. 재사용 대기 시간: 14/12/10초.<br><br>토템을 정화할 때마다, 토큰 1개를 획득하고, 최대 5개를 획득할 수 있다.<br><br>각 토큰마다, 원뿔형 범위는 5도 작아진다."},{"c":"sp","id":"SoleSurvivor","ko":"유일한 생존자","en":"Sole Survivor","d":"생존자가 죽을 때마다, 토큰 1개를 획득한다.<br><br>각 토큰마다, 살인마는 20/22/24미터 내에서 당신의 오라를 볼 수 없게 된다.<br><br>다른 모든 생존자가 죽으면:<ul><li>75% 더 빠르게 수리한다.<\/li><li>출구와 비상탈출구를 50% 더 빠르게 연다.<\/li><\/ul><br><br>희생제가 시작되면, 집착 대상이 될 가능성이 높다.","o":"Laurie"},{"c":"sp","id":"Solidarity","ko":"연대","en":"Solidarity","d":"부상 상태에 있거나 구급상자 없이 다른 생존자를 치료하는 동안, 치료 진행도가 50/60/70% 속도가 된다.","o":"Jane"},{"c":"sp","id":"SoulGuard","ko":"소울 가드","en":"Soul Guard","d":"주술에 걸린 동안, 완전히 회복할 수 있다.<br><br>완전히 회복할 때마다, 당신은 4/6/8초 동안 <b>인내<\/b>에 걸린다. 재사용 대기 시간: 30초.","o":"S22"},{"c":"kp","id":"Spies_From_The_Shadows","ko":"어둠 속의 첩자","en":"Spies from the Shadows","d":"살인마로부터 20/28/36미터 내에서 생존자가 까마귀를 내쫓을 때마다, 알림을 받게 된다. 재사용 대기 시간: 5초."},{"c":"sp","id":"Spine_Chill","ko":"등골이 오싹해","en":"Spine Chill","d":"36미터 내에서 살인마가 당신을 바라볼 때마다, 소리 신호가 들린다.<br><br>36미터 내에서 살인마가 당신을 바라보면:<ul><li>토템을 2/4/6% 더 빠르게 축복 및 정화한다.<\/li><li>2/4/6% 더 빠르게 치료한다.<\/li><li>2/4/6% 더 빠르게 출구를 연다.<\/li><li>2/4/6% 더 빠르게 발전기를 수리한다.<\/li><li>2/4/6% 더 빠르게 파괴 공작을 수행한다.<\/li><li>2/4/6% 더 빠르게 생존자들을 갈고리에서 구출한다.<\/li><li>2/4/6% 더 빠르게 상자를 잠금 해제한다.<\/li><\/ul>"},{"c":"kp","id":"SpiritFury","ko":"분노의 영혼","en":"Spirit Fury","d":"판자 4/3/2개를 부순 후, 판자에 기절 당하면, 판자는 파괴된다.","o":"Spirit"},{"c":"sp","id":"Sprint_Burst","ko":"전력 질주","en":"Sprint Burst","d":"달리기를 시작할 때마다:<ul><li>당신은 2초 동안 50%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>당신은 60/50/40초 동안 <b>탈진<\/b> 효과를 얻는다.<\/li><\/ul>","o":"Meg"},{"c":"sp","id":"StakeOut","ko":"잠복 근무","en":"Stake Out","d":"살인마의 공포 범위에서 15초 동안 숨으면, 토큰 1개를 획득하고, 최대 2/3/4개를 획득할 수 있다.<br><br>스킬 체크에서 성공하면, 토큰 1개를 소비한다:<ul><li>일반 스킬 체크 성공은 스킬 체크 대성공으로 전환된다.<\/li><li>1%의 진행도 를 추가로 얻는다.<\/li><\/ul>","o":"Eric"},{"c":"sp","id":"Streetwise","ko":"노련함","en":"Streetwise","d":"아이템의 내구도가 처음으로 고갈되면, 살인마의 오라가 8초 동안 드러난다.<br><br>상자에서 아이템을 약탈하면, 60/70/80% 더 많은 내구도를 획득한다.","o":"Nea"},{"c":"kp","id":"Stridor","ko":"천식","en":"Stridor","d":"생존자들의 숨소리가 15/20/25% 더 크게 들리며, 그들의 고통으로 인한 신음 소리가 30/40/50 더 크게 들린다.","o":"Nurse"},{"c":"kp","id":"Surge","ko":"서지","en":"Surge","d":"기본 공격으로 생존자를 빈사 상태로 만들 때마다, 32미터 범위 내 발전기:<ul><li>폭발하며, 6/7/8%의 진행도를 잃고 퇴보하기 시작한다.<\/li><li>해당 발전기를 수리하던 생존자들은 비명을 지른다.<\/li><\/ul>","o":"Demogorgon"},{"c":"kp","id":"Surveillance","ko":"감시","en":"Surveillance","d":"퇴보하는 발전기의 오라가 드러난다.<br><br>발전기가 퇴보를 멈추면, 8/12/16초 동안 오라가 드러난다.<br><br>발전기를 수리하는 소음이 8미터 멀리서도 들릴 수 있다.","o":"Pig"},{"c":"sp","id":"Technician","ko":"기술자","en":"Technician","d":"발전기를 수리하는 동안:<ul><li>발전기의 수리 소음이 전달되는 거리가 16미터 짧아진다.<\/li><li>기본 스킬 체크에 실패할 때마다, 발전기는 폭발하지 않지만, 진행도를 4/3/2% 더 잃는다.<\/li><\/ul>","o":"Feng"},{"c":"sp","id":"Tenacity","ko":"집념","en":"Tenacity","d":"빈사 상태 동안:<ul><li>30/40/50% <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>기어가기와 회복을 동시에 수행할 수 있다.<\/li><li>고통으로 인한 당신의 신음 소리가 75% 더 작아진다.<\/li><\/ul>","o":"Eric"},{"c":"kp","id":"TerritorialImperative","ko":"텃세","en":"Territorial Imperative","d":"당신이 지하실로부터 24미터 떨어져 있을 때, 생존자가 지하실에 들어가면, 4/5/6초 동안 생존자의 오라가 드러난다. 재사용 대기 시간: 45초.","o":"Bear"},{"c":"kp","id":"Thanatophobia","ko":"사망 공포증","en":"Thanatophobia","d":"부상, 빈사 상태, 또는 갈고리에 걸린 생존자마다, 모든 생존자들은:<ul><li>토템을 1/1.5/2% 더 느리게 정화한다.<\/li><li>1/1.5/2% 더 느리게 수리한다.<\/li><li>갈고리에 1/1.5/2% 더 느리게 파괴 공작을 수행한다.<\/li><\/ul><br><br>생존자 4명이 부상, 빈사 상태, 또는 갈고리에 걸리면, 위에 모든 행동이 12% 추가로 더 느리게 진행된다.","o":"Nurse"},{"c":"sp","id":"TheMettleOfMan","ko":"남자의 패기","en":"Mettle of Man","d":"3 보호 공격을 맞은 후, 부상 상태에서 당신이 빈사 상태가 될 때까지, 살인마로 인해 빈사 상태가 될 수 있는 다음 상황에서 피해를 입지 않는다.<br><br>건강한 상태가 됐을 때, 살인마로부터 최소 12/14/16미터 내에 있으면, 살인마의 오라를 볼 수 있다.<br><br>희생제 시작 시, 집착 대상이 될 가능성이 높다.","o":"Ash"},{"c":"sp","id":"This_Is_Not_Happening","ko":"이런 일이 일어나다니","en":"This Is Not Happening","d":"부상 상태 동안, 기본 스킬 체크 대성공 구역이 10/20/30% 더 커진다."},{"c":"kp","id":"ThrillingTremors","ko":"전율의 기쁨","en":"Thrilling Tremors","d":"생존자를 들어올릴 때마다, 수리되지 않은 모든 발전기가 16초 동안 차단된다. 재사용 대기 시간: 40/35/30초.","o":"Ghostface"},{"c":"kp","id":"Tinkerer","ko":"땜장이","en":"Tinkerer","d":"각 발전기가 최초로 70% 진행도에 도달하면:<ul><li>12/14/16초 동안 <b>감지 불가능<\/b> 효과를 얻는다.<\/li><li>당신은 알림을 받는다.<\/li><\/ul>","o":"HillBilly"},{"c":"kp","id":"TrailofTorment","ko":"고통의 흔적","en":"Trail of Torment","d":"발전기에 손상을 입힐 때마다, 퇴보가 멈출 때까지:<ul><li>당신은 <b>감지 불가능<\/b> 효과를 얻는다.<\/li><li>생존자는 해당 발전기의 오라를 볼 수 있다.<\/li><\/ul><br><br>재사용 대기 시간: 60/45/30초.","o":"K20"},{"c":"kp","id":"Unnerving_Presence","ko":"불안한 존재","en":"Unnerving Presence","d":"공포 범위 내 생존자는 10% 확률로 더 많은 기본 스킬 체크를 수행한다.<br><br>기본 스킬 체크의 구역이 40/50/60% 더 작아진다.","o":"Chuckles"},{"c":"kp","id":"Unrelenting","ko":"가차없는 공격","en":"Unrelenting","d":"기본 공격에 실패하면, 재사용 대기 시간이 20/25/30% 짧아진다."},{"c":"sp","id":"Up_The_Ante","ko":"판돈 올리기","en":"Up the Ante","d":"살아 있는 생존자의 수마다, 모든 생존자의 행운이 1/2/3% 더 증가한다.<br><br>모든 생존자들은 스스로 갈고리를 탈출하는 시도를 수행할 수 있다.","o":"Ace"},{"c":"sp","id":"Urban_Evasion","ko":"세련된 회피","en":"Urban Evasion","d":"웅크린 동안, 90/95/100%의 <b>이동 속도 증가<\/b> 효과를 가진다.","o":"Nea"},{"c":"sp","id":"Vigil","ko":"불침번","en":"Vigil","d":"당신으로부터 16미터 범위 내에 모든 생존자들은 <b>탈진<\/b>에서 20/25/30% 더 빠르게 회복한다.<br><br>해당 효과는 당신이 범위를 벗어난 뒤 15초 후 종료된다.","o":"Quentin"},{"c":"sp","id":"Visionary","ko":"선견지명","en":"Visionary","d":"당신으로부터 32미터 범위 내에서 당신은 발전기의 오라를 볼 수 있다.<br><br>발전기 수리가 완료될 때마다, 20/18/16초의 재사용 대기 시간을 가진다.","o":"S23"},{"c":"sp","id":"WakeUp","ko":"정신 차려!","en":"Wake Up!","d":"모든 발전기 수리가 완료되면:<ul><li>당신은 출구 전원의 오라를 볼 수 있다.<\/li><li>출구를 여는 동안, 다른 생존자들은 당신의 오라를 볼 수 있다.<\/li><li>살아있는 생존자 한 명당, 출구를 8/10/12.5% 더 빠르게 열 수 있다.<\/li><\/ul>","o":"Quentin"},{"c":"sp","id":"WellMakeIt","ko":"우린 해낼거야","en":"We'll make it","d":"생존자를 갈고리에서 구출할 때마다, 30/60/90초 동안 다른 생존자들을 100% 더 빠르게 치료한다."},{"c":"sp","id":"WereGonnaLiveForever","ko":"우리는 영원히 살거야","en":"We're Gonna Live Forever","d":"빈사 상태의 생존자를 100% 더 빠르게 치료한다.<br><br>빈사 상태의 생존자 치료가 완료될 때마다, 6/8/10초 동안 <b>인내<\/b>를 얻는다. 재사용 대기 시간: 30초.","o":"Smoke"},{"c":"kp","id":"Whispers","ko":"속삭임","en":"Whispers","d":"생존자로부터 48/40/32미터 범위 내에서 당신은 무작위로 속삭임이 들린다."},{"c":"sp","id":"WindowsOfOpportunity","ko":"기회의 창","en":"Windows of Opportunity","d":"당신으로부터 24/28/32미터 범위에서:<ul><li>당신은 판자의 오라를 볼 수 있다.<\/li><li>당신은 부서지기 쉬운 문의 오라를 볼 수 있다.<\/li><li>당신은 창문의 오라를 볼 수 있다.<\/li><\/ul>","o":"Kate"},{"c":"kp","id":"ZanshinTactics","ko":"잔심 전술","en":"Zanshin Tactics","d":"32미터 범위 내에서 판자와 뛰어 넘을 수 있는 창문의 오라를 볼 수 있다.<br><br>생존자가 판자를 떨어뜨릴 때마다, 3/4/5초 동안 생존자의 오라가 드러난다.","o":"Oni"},{"id":"Addon_Beartrap_001","ko":"연마석","en":"Honing Stone","d":"곰덫을 만들 때 연마석을 사용하면 날이 더욱더 날카로워진다. 면도날처럼 날카로운 날들은 사냥감들에게 깊은 상처를 남겨 그들이 최대한 빠르게 피를 흘리게 한다.<br><br>곰덫을 밟은 생존자들이 스스로 탈출을 시도하면 부상 상태 대신 빈사 상태로 남겨진다.","r":3,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_002","ko":"톱니 모양 턱","en":"Serrated Jaws","d":"곰덫에 달 수 있는 이 턱은 톱과 같은 날을 가지고 있어서 사냥감을 물면 엄청나게 큰 상처를 남긴다.<br><br><b>곰덫<\/b>은 곰덫을 밟은 생존자가 치유될 때까지 <b>출혈<\/b> 상태에 빠뜨린다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":1,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_003","ko":"덫 운반용 가방","en":"Trapper Bag","d":"가죽으로 만들어진 짐 운반용 가방. 사냥에 필요한 도구들을 나르기에 적합할 만큼 크고 튼튼하다.<br><br><b>추가로 1개의 곰덫<\/b>을 가지고 시작한다. <b>추가로 1개의 곰덫<\/b>을 더 소지할 수 있다.","r":2,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_004","ko":"왁스 블럭","en":"Wax Brick","d":"기계의 연결 부분에서 마찰을 적게 하고 움직임을 용이하게 하는 데 사용되는 왁스 블럭.<br><br><b>곰덫<\/b>으로부터 생존자를 구출하거나 탈출하는 데 걸리는 시간이 <b>33%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_005","ko":"길어진 턱","en":"Lengthened Jaws","d":"평범한 곰덫보다 더 깊이 살점에 파고들 수 있도록 제작된 날이 긴 덫.<br><br>생존자가 <b>곰덫<\/b>을 탈출할 때, <b>심각한 부상<\/b>을 입는다.<br><br>제한 시간 안에 심각한 부상을 치료하지 않으면 생존자는 빈사 상태에 빠진다.","r":1,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_006","ko":"타르 병","en":"Tar Bottle","d":"타르와 같이 무광의 검은색을 띄는 끈적한 물질. 곰덫에 이 물질을 바르면, 사냥감의 눈에 잘 띄지 않는다.<br><br><b>곰덫<\/b>이 <b>어두워진다.<\/b>","r":2,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_007","ko":"임시방편 붕대","en":"Makeshift Wrap","d":"두껍고 치료된 동물 가죽으로 만든 긁히고 닳은 보호대.<br><br><b>트래퍼<\/b>는 자신이 놓은 <b>곰덫<\/b>에 잡히지 않는다.<b>트래퍼<\/b>가 <b>곰덫<\/b>을 밟으면 장치가 해제된다.","r":0,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_008","ko":"4코일 스프링 키트","en":"4-Coil Spring Kit","d":"곰덫의 코일 스프링을 이중 구조에서 사중 구조로 바꾸어 사냥감을 조이는 힘을 엄청나게 상승시킨다.<br><br>생존자가 <b>곰덫<\/b>을 무력화하는 데 걸리는 시간이 <b>33%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_009","ko":"덫 운반용 자루","en":"Trapper Sack","d":"가죽으로 투박하게 만들어진, 수렵 채집용으로 알맞은 자루.<br><br>모든 <b>곰덫<\/b>은 지도에 생성되는 대신 곰덫을 보유한 채 희생제가 시작된다.<b>곰덫<\/b>은 집어들 수 없다.","r":3,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_010","ko":"덫 설치용 장갑","en":"Trapper Gloves","d":"보호용 패드가 있는 가죽 장갑.<br><br><b>곰덫<\/b>의 설치 속도가 <b>30% 빨라진다<\/b>.","r":0,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_011","ko":"보조 코일","en":"Secondary Coil","d":"주로 사용하는 코일이 망가졌을 때도 곰덫을 효과적으로 유지해주는 보조 코일.<br><br>생존자가 <b>곰덫<\/b>을 무력화하는 데 걸리는 시간이 <b>50%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_012","ko":"고정용 공구","en":"Fastening Tools","d":"곰덫을 튼튼하게 고정할 목적으로 사용하는 특수 공구 세트.<br><br><b>곰덫<\/b>의 설치 속도가 <b>50%<\/b> <b>빨라진다<\/b>.<b>곰덫<\/b>으로부터 생존자를 구출하거나 탈출하는 데 걸리는 시간이 <b>25%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_PaddedJaws","ko":"보강된 턱","en":"Padded Jaws","d":"이 보강된 덫은 오직 사냥감을 억누르기 위해서 제작되었다.<br><br><b>곰덫<\/b>은 곰덫을 밟은 건강한 상태의 생존자를 <b>부상한 상태로 만들지 않는다<\/b>. 해당 애드온 장착 시, <b>녹슨 턱<\/b> 및 <b>톱니 모양 턱<\/b>의 효과를 무효화시킵니다.생존자가 덫을 밟을 때 얻는 블러드포인트가 <b>100%<\/b> 증가한다.","r":0,"c":"ka","o":"Chuckles"},{"id":"Addon_Beartrap_TrapperSack","ko":"곰 기름","en":"Bear Oil","d":"삐걱거리는 곰덫의 접합 부분을 기름칠하도록 만든 녹인 동물 지방.<br><br><b>곰덫<\/b> 설치 시, 소리가 나지 않는다.","r":0,"c":"ka","o":"Chuckles"},{"id":"Addon_Bell_001","ko":"뼈로 만든 종망치","en":"Bone Clapper","d":"매우 매끄러운 뼛조각으로 만든 종망치. 이 뼛조각은 통곡의 종이 불규칙하고 무질서한 음향을 발산하게 만든다.생존자들은 <b>통곡의 종<\/b>이 울리는 <b>거리<\/b>와 <b>방향<\/b>을 가늠할 수 없게 된다.","r":1,"c":"ka","o":"Bob"},{"id":"Addon_Bell_002","ko":"\"유령\" - 그을음","en":"\"The Ghost\" - Soot","d":"영적 세계를 상징하는 ‘Khugwemuu’의 문양을 종몸 부분에 재로 그려 넣었다.<br><br>은신을 해제한 후에도 <b>6초<\/b> 동안 공포 범위가 사라지고 붉은 불빛이 보이지 않는다.","r":0,"c":"ka","o":"Bob"},{"id":"Addon_Bell_003","ko":"\"사냥개\" - 그을음","en":"\"The Hound\" - Soot","d":"노련한 추적자를 상징하는 ‘Wonnug’의 문양을 종의 몸통 부분에 재로 그려 넣었다.<br><br>은신 상태일 때, 신선한 핏자국이 평소보다 <b>더 선명하게<\/b> 나타난다.","r":0,"c":"ka","o":"Bob"},{"id":"Addon_Bell_004","ko":"\"눈 먼 투사\" - 진흙","en":"\"Blind Warrior\" - Mud","d":"흉포함을 상징하는 'Baikra-Kaeug' 의 문양을 종몸 부분에 진흙으로 그려 넣었다.<br><br>은닉 해제 <b>기습 공격<\/b>을 당한 생존자는 <b>60초<\/b> 동안 <b>실명<\/b> 상태 이상에 걸리게 된다. 실명된 생존자는 오라를 볼 수 없게 된다.","r":1,"c":"ka","o":"Bob"},{"id":"Addon_Bell_005","ko":"\"신속한 사냥\" - 진흙","en":"\"Swift Hunt\" - Mud","d":"사냥감을 향한 기습을 상징하는 ‘Kuntin-Takkho’의 문양을 종몸 부분에 진흙으로 그려 넣었다.<br><br>은신을 해제하는 속도가 <b>8%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Bob"},{"id":"Addon_Bell_006","ko":"\"신속한 사냥\" - 붉은 피","en":"\"Swift Hunt\" - Blood","d":"사냥감을 향한 기습을 상징하는 ‘Kuntin-Takkho’의 문양을 종머리 부분에 피로 새겨 넣었다.<br><br>은신을 해제하는 속도가 <b>12%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Bob"},{"id":"Addon_Bell_007","ko":"\"야수\" - 그을음","en":"\"The Beast\" - Soot","d":"야수의 영역을 상징하는 ‘Kunwulju’의 문양을 종몸 부분에 재로 그려 넣었다.<br><br>은신 상태에서 레이스의 <b>공포 범위가 사라지지 않는다<\/b>.미행 및 기습 공격 항목에서 <b>100%<\/b>의 추가 블러드포인트를 획득한다.","r":0,"c":"ka","o":"Bob"},{"id":"Addon_Bell_008","ko":"\"만물을 보는 눈\" - 붉은 피","en":"\"All Seeing\" - Blood","d":"만물을 주시하는 엔티티를 상징하는 'Kra-Frabai'의 문양을 종머리 부분에 피로 새겨 넣었다.<br><br>은신 상태에서 생존자의 오라를 볼 수 있는 능력을 얻는다. 은신 상태일 때, <b>8미터<\/b> 내에 있는 생존자의 오라를 볼 수 있다.","r":3,"c":"ka","o":"Bob"},{"id":"Addon_Bell_009","ko":"\"폭풍\" - 진흙","en":"\"Windstorm\"- Mud","d":"파괴적인 폭풍을 상징하는 ‘Ohuwe-Onmnea’ 문양을 종몸 부분에 진흙으로 그려 넣었다.은신 상태에서 레이스의 이동속도가 <b>5%<\/b> <b>빨라진다<\/b>.","r":1,"c":"ka","o":"Bob"},{"id":"Addon_Bell_010","ko":"\"폭풍\" - 순백","en":"\"Windstorm\" - White","d":"파괴적인 폭풍을 상징하는 ‘Ohuwe- 의식용 끈으로 감싼 종망치. 종소리를 한층 부드럽게 만들어주고 불길한 오라를 발산한다.<br><br><b>통곡의 종소리<\/b>가 <b>완전히 사라진다<\/b>.","r":4,"c":"ka","o":"Bob"},{"id":"ADDON_Bell_SwiftMud","ko":"\"신속한 사냥\" - 순백","en":"\"Swift Hunt\" - White","d":"사냥감을 향한 기습을 상징하는 ‘Kuntin-Takkho’의 문양을 종몸 부분에 흰색 잉크로 그려 넣었다.<br><br>은신을 해제하는 속도가 <b>10%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Bob"},{"id":"ADDON_Bell_WindstormBlood","ko":"\"폭풍\" - 붉은 피","en":"\"Windstorm\" - Blood","d":"파괴적인 폭풍을 상징하는 ‘Ohuwe-Onmnea’ 문양을 종몸 부분에 진흙으로 그려 넣었다.<br><br>은신 상태에서 레이스의 이동속도가 <b>9%<\/b> <b>빨라진다<\/b>.","r":3,"c":"ka","o":"Bob"},{"id":"Addon_Blinker_001","ko":"체크 무늬 손수건","en":"Plaid Flannel","d":"붉은색과 검은색이 교차하는 체크 무늬 손수건 조각. 천 조각이 너스에게 엄청난 집중력을 불어넣는다.<br><br>너스가 점멸의 도달 위치를 볼 수 있게 된다.","r":0,"c":"ka","o":"Nurse"},{"id":"Addon_Blinker_002","ko":"흰색 참빗","en":"White Nit Comb","d":"병실에서 가져온 기생충이 있는 참빗. 불안증 환자와 그녀의 간호사가 깊은 관계였음을 상징한다.<br><br>점멸 공격의 시간이 <b>50%<\/b> <b>감소한다<\/b>.점멸 공격의 블러드포인트가 <b>100%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Nurse"},{"id":"Addon_Blinker_003","ko":"회중시계","en":"Pocket Watch","d":"불에 타고 깨진 회중시계. 덜그럭거리는 소리가 난다. 모리스 간호사의 시체에서 얻었다.<br><br>너스가 점멸 후 탈진으로 쓰러지기 전 시간이 <b>20%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Nurse"},{"id":"Addon_Blinker_004","ko":"불안한 숨막힘","en":"Anxious Gasp","d":"너스가 아끼던 불안증 소녀의 놀란 헐떡임. 너스의 손길이 닿으면 격렬하게 경련을 일으킨다.<br><br>점멸을 사용 중 생존자를 지나치다 생존자가 비명을 지르며 생존자를 놀라게 한 보상으로 <b>200 블러드포인트<\/b>를 얻는다.","r":2,"c":"ka","o":"Nurse"},{"id":"Addon_Blinker_005","ko":"찢어진 책갈피","en":"Torn Bookmark","d":"신성한 책에 사용했던 희고 깨끗한 책갈피. 분란을 상징한다.<br><br>연속 점멸 횟수가 <b>1회<\/b> 추가된다.점멸 충전 시간을 <b>30%<\/b> <b>증가시킨다<\/b>.","r":4,"c":"ka","o":"Nurse"},{"id":"Addon_Blinker_006","ko":"어두운 허리끈","en":"Dark Cincture","d":"추도식에 사용되는 검은 허리끈. 캠벨 신부의 시체에서 얻었다.<br><br>점멸 후와 탈진 사이의 기간 동안 이동 속도가 <b>30%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Nurse"},{"id":"Addon_Blinker_007","ko":"취약한 헐떡임","en":"Fragile Wheeze","d":"캠벨 신부로부터 빼앗은 청량하고 훌륭한 숨결. 너스의 손길이 닿으면 살짝 구부러진다.<br><br>점멸 공격은 <b>70초<\/b> 동안 <b>깊은 상흔<\/b> 상태 이상에 빠트린다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"Nurse"},{"id":"Addon_Blinker_008","ko":"\"캠벨\"의 마지막 숨결","en":"Campbell's Last Breath","d":"크로투스 프렌 정신병원의 신부였던 '캠벨'에게서 빼앗은 강력한 마지막 숨결. 너스의 손 안에 들어가면 심하게 딱딱거리는 소리가 난다.<br><br>완전히 충전된 점멸을 모두 사용하고 다시 모습을 드러낸 후, 현재 보고 있는 방향으로 완전히 충전된 점멸을 즉시 사용한다.<b>너스<\/b>에게 연속 점멸 횟수가 남았을 경우에만 가능하다.","r":3,"c":"ka","o":"Nurse"},{"id":"Addon_Blinker_009","ko":"금속 숟가락","en":"Metal Spoon","d":"무디고 녹슨 금속 숟가락. 202호실 환자인 ‘배드맨’에게서 압수했다.<br><br>점멸 공격으로 생존자 타격에 성공하면 고통에 찬 비명 소리가 <b>60초<\/b> 동안 <b>50% 커진다<\/b>.","r":0,"c":"ka","o":"Nurse"},{"id":"Addon_Blinker_010","ko":"배드맨의 기념품","en":"Bad Man Keepsake","d":"배드맨이 자신의 손으로 뽑아낸 썩은 어금니.<br><br>점멸 공격으로 생존자 공격에 성공하면 <b>28 미터<\/b> 내에 있는 치료 중이거나, 치료받는 생존자의 오라를 <b>60초<\/b> 동안 볼 수 있다.","r":1,"c":"ka","o":"Nurse"},{"id":"Addon_Blinker_011","ko":"장난감 나무 말","en":"Wooden Horse","d":"싸구려 재목에 도색조차 하지 않은 말 모양 장난감. 긴장증 환자와 그의 간호사가 깊은 관계였음을 상징한다.<br><br>빗나간 점멸 공격으로 인한 추가 탈진 시간을 <b>50%<\/b> <b>감소시킨다<\/b>.","r":0,"c":"ka","o":"Nurse"},{"id":"Addon_Blinker_012","ko":"긴장증 소년의 보물","en":"Catatonic Boy's Treasure","d":"환자의 반복 행동을 멈추게 하는 데 쓰였던 솔방울. 긴장증 소년의 시체에서 얻었다.<br><br>연속 점멸으로 인한 추가 탈진 시간이 <b>65%<\/b> <b>줄어든다<\/b>.","r":1,"c":"ka","o":"Nurse"},{"id":"Addon_Chainsaw_001","ko":"아버지의 부츠","en":"Dad's Boots","d":"믿을 수 있는 부츠 한 켤레로, 맥스 톰슨 경의 시체에서 뽑아냈다.<br><br>전기톱 질주의 선회율이 <b>20%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"HillBilly"},{"id":"Addon_Chainsaw_002","ko":"균형추","en":"Counterweight","d":"안정감을 위해 맨 아랫부분에 무게를 더한다.<br><br>전기톱 질주의 초기 회전율이 <b>70%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"HillBilly"},{"id":"Addon_Chainsaw_003","ko":"기름칠한 조절판","en":"Greased Throttle","d":"윤활제를 바른 방아쇠. 손가락 하나만 까딱하면 전기톱을 다시 살릴 수 있다.<br><br>전기톱을 사용 한 후 회복 시간이 <b>5%<\/b> <b>줄어든다<\/b>.<b>증속 구동<\/b> 중에는 해당 효과가 적용되지 않는다.","r":1,"c":"ka","o":"HillBilly"},{"id":"Addon_Chainsaw_004","ko":"보온 케이스","en":"Thermal Casing","d":"사용자가 에너지 절약을 제어할 수 있는 더 두꺼운 케이스.<br><br>전기톱을 사용하지 않을 때 증속 구동 미터기 속도가 <b>20%<\/b> <b>감소된다<\/b>.","r":1,"c":"ka","o":"HillBilly"},{"id":"Addon_Chainsaw_005","ko":"강철 발가락 부츠","en":"Steel Toe Boots","d":"충격으로부터 보호해 주는 강화된 발가락이 있는 부츠.<br><br>전기톱으로 물체에 타격을 가한 후의 회복 시간이 <b>10%<\/b> <b>줄어든다<\/b>.","r":0,"c":"ka","o":"HillBilly"},{"id":"Addon_Chainsaw_006","ko":"톰슨제 혼합물","en":"The Thompsons' Mix","d":"가족들이 기계를 위해 만든 특별한 기름 물질.<br><br>전기톱을 사용한 후 회복 시간이 <b>10%<\/b> <b>줄어든다<\/b>.<b>증속 구동<\/b> 중에는 해당 효과가 적용되지 않는다.","r":2,"c":"ka","o":"HillBilly"},{"id":"Addon_Chainsaw_007","ko":"그을린 체인","en":"Begrimed Chains","d":"불쾌하지만 이상하게도 친숙한 사슬, 불쾌한 것으로 코팅되어 있다.<br><br>전기톱에 타격을 받은 생존자들은 <b>70초<\/b> 동안 <b>깊은 상흔<\/b>과 <b>출혈<\/b> 상태 이상에 걸린다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"HillBilly"},{"id":"Addon_Chainsaw_008","ko":"다 망가진 엔진","en":"Ragged Engine","d":"사람들은 조율이 필요하다고 말할 것이다. 하지만 맥스는 이미 조율됐다고 말할 것이다.<br><br>전기톱을 사용하지 않을 때 증속 구동 미터기 속도가 <b>30%<\/b> <b>감소된다<\/b>.","r":2,"c":"ka","o":"HillBilly"},{"id":"Addon_Chainsaw_009","ko":"눈에 띄지 않는 체인","en":"Lo Pro Chains","d":"가벼운 체인이 전기톱의 무게를 감소시켜, 훌륭한 기동성을 선사한다.//////////<br><br>전기톱으로 판자 또는 부서지기 쉬운 문에 특수 파괴를 수행할 때마다, 전기톱 질주가 계속된다.판자 또는 벽을 부순 후 <b>5초<\/b> 내에 전기톱 타격을 받은 건강한 생존자들은 건강 상태가 한 단계 낮아진다.부상당한 생존자는 <b>심각한 부상<\/b> 상태 이상에 걸린다.<br><br>제한 시간 안에 심각한 부상을 치료하지 않으면 생존자는 빈사 상태에 빠진다.","r":3,"c":"ka","o":"HillBilly"},{"id":"Addon_Chainsaw_010","ko":"폐기된 공기 필터","en":"Discarded Air Filter","d":"금이 가고 먼지가 많은 필터지만, 여전히 재고로 쌓여있는 모델보다 더 잘 작동한다.<br><br>증속 구동 미터기가 소멸되기 시작하기까지 걸리는 시간이 <b>20%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"HillBilly"},{"id":"Addon_Chainsaw_011","ko":"금이 간 뇌관 전구","en":"Cracked Primer Bulb","d":"연료 라인에서 공기를 제거하는 버튼. 이 기계에는 연료를 공급해야 한다.<br><br>전기톱에 타격을 받은 생존자들은 건강 상태가 한 단계 낮아진다.증속 구동 생성이 <b>15%<\/b> 증가한다.","r":0,"c":"ka","o":"HillBilly"},{"id":"Addon_Chainsaw_012","ko":"싸구려 엔진 오일","en":"Off-Brand Motor Oil","d":"시끄러운 체인에 사용하는 저렴한 기름.<br><br>증속 구동 생성이 <b>15%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"HillBilly"},{"id":"ADDON_Chainsaw_CarburatorGuide","ko":"조정한 카뷰레터","en":"Tuned Carburetor","d":"먼지와 기름이 말라붙었지만, 이 카뷰레터는 잘 조정되었다.<br><br>전기톱 충전 속도가 <b>20%<\/b> <b>증가한다<\/b>.기본 이동 속도가 <b>4.4 m/s<\/b>로 <b>감소한다<\/b>.","r":4,"c":"ka","o":"HillBilly"},{"id":"ADDON_Chainsaw_DeathEngravings","ko":"꽉 막힌 흡입구","en":"Clogged Intake","d":"공기 흐름을 바꾸는 것이 톱의 힘을 바꾸는 핵심이다.<br><br>증속 구동 지속 시간이 <b>15%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"HillBilly"},{"id":"ADDON_Chainsaw_DoomEngravings","ko":"핏빛 판화","en":"Iridescent Engravings","d":"안개 속에 서식하는 어둠을 먹고 사는 괴물을 전기톱 몸통 부분에 새겼다. 이 판화는 전기톱을 사용하는 자가 결의를 다지게 해준다.<br><br>전기톱 질주 이동 속도가 <b>20%<\/b> <b>증가한다<\/b>.전기톱을 충전하는 데 걸리는 시간이 <b>12%<\/b> <b>증가한다<\/b>.","r":4,"c":"ka","o":"HillBilly"},{"id":"ADDON_Chainsaw_HomemadeMuffler","ko":"첨단 소음기","en":"Apex Muffler","d":"다른 모든 것을 능가하는 능숙한 솜씨로 만든 전기톱 소음기.<br><br>공포 범위 밖에 있는 생존자들에게 전기톱 소리는 들리지 않는다.","r":3,"c":"ka","o":"HillBilly"},{"id":"ADDON_Chainsaw_LightChassis","ko":"로우 킥백 체인","en":"Low Kickback Chains","d":"킥백의 가능성을 감소시키데에 특화된 체인이다.<br><br>전기톱으로 물체에 타격을 가한 후의 회복 시간이 <b>15%<\/b> <b>줄어든다<\/b>.","r":2,"c":"ka","o":"HillBilly"},{"id":"ADDON_Chainsaw_ThompsonMix","ko":"고속 방치형 나사","en":"High-Speed Idler Screw","d":"느슨해진 나사는 전기톱에 더 강한 힘을 줄 것이다.<br><br>증속 구동 미터기가 소멸되기 시작하기까지 걸리는 시간이 <b>30%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"HillBilly"},{"id":"ADDON_Chainsaw_ThompsonMoonshine","ko":"징 박힌 부츠","en":"Spiked Boots","d":"진흙을 걷는 걸음 걸음마다의 안정성과 제어력을 확보하기 위해 금속이 장착된 부츠.<br><br>전기톱 질주 회전율이 <b>30%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"HillBilly"},{"id":"Addon_Demogorgon_BarbsGlasses","ko":"바바라의 안경","en":"Barb's Glasses","d":"뒤집힌 세계로 여행하던 중 깨져버린 안경.<br><br><b>찢어발기기<\/b>로 판자 또는 부서지기 쉬운 문에 특수 파괴를 수행할 때마다 재사용 대기 시간이 10% 감소한다.","r":1,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_BlackHeart","ko":"검은 심장","en":"Black Heart","d":"뒤집힌 세계 속에 존재하던 촉수 생물체의 가슴에서 뜯겨진 검고 발효된 심장.<br><br><b>찢어발기기<\/b> 타격의 재사용 대기 시간이 <b>10% 감소한다<\/b>.","r":0,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_BrassCaseLighter","ko":"케이스가 놋쇠로 된 라이터","en":"Brass Case Lighter","d":"문제를 일으키는 데 사용되는 라이터.<br><br>포털에 얼마나 가까운지에 따라 생존자들은 <b>실명<\/b> 상태 이상에 시달리게 된다. 포털과의 접촉을 끊으면, 이 효과는 <b>60초<\/b>동안 지속된다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.","r":2,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_DeerLung","ko":"사슴의 허파","en":"Deer Lung","d":"데모고르곤에 새로운 힘을 불어넣는 고무 느낌의 생 허파.<br><br>뒤집힌 세계를 횡단하는 이동 속도가 <b>30%<\/b> <b>증가한다<\/b>.사용 가능한 포털의 수가 <b>2<\/b>개 <b>줄어든다<\/b>.","r":2,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_ElevensSoda","ko":"일레븐의 탄산음료","en":"Eleven's Soda","d":"탄산음료를 초자연적 에너지로 가득 채울 수 있다.<br><br>뒤집힌 세계를 횡단하는 동안 수리 중인 발전기의 오라를 보여준다.","r":2,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_LerproseLichen","ko":"러프로스 이끼","en":"Leprose Lichen","d":"뒤집힌 세계의 바위에 먼지가 붙어 있는 양 자라는 강력한 노란색 이끼.<br><br>뒤집힌 세계를 횡단하는 동안, 모든 생존자의 오라가 드러난다.그리고 포털에서 나온 후 <b>3초<\/b> 동안 활성화 포털에서 <b>16미터<\/b> 내 모든 생존자의 오라를 노출시킨다.","r":4,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_LifeguardWhistle","ko":"안전 요원의 호루라기","en":"Lifeguard Whistle","d":"한때 호킨스 공용수영장을 지배했던 금속 소재의 녹슨 호루라기.<br><br>이용 가능한 포털의 수가 <b>2<\/b>개 증가한다.","r":3,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_MewsGuts","ko":"야옹이의 내장","en":"Mew's Guts","d":"가엾은 희생양의 맛있는 내장.<br><br>이용 가능한 총 포털 수를 <b>1<\/b>개 <b>늘린다<\/b>.빗나간 <b>찢어발기기<\/b> 공격의 재사용 대기 시간이 <b>11% 감소한다<\/b>.","r":1,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_RatLiver","ko":"쥐 간","en":"Rat Liver","d":"짭짤하고 부드러운 한 무더기의 간. 눅눅하다.<b>심연<\/b>을 충전하는 동안 이동 속도가 <b>3.5%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_RatTail","ko":"쥐꼬리","en":"Rat Tail","d":"데모고르곤이 먹는 쫄깃쫄깃한 쥐꼬리.포털을 여는 속도가 <b>50%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_RedMoss","ko":"붉은 이끼","en":"Red Moss","d":"뒤집힌 세계의 나무에서 자라는 환각제 이끼.<br><br>포털에서 나오는 데 걸리는 시간이 <b>15%<\/b> <b>증가한다<\/b>.포털에서 나올 때 <b>감지 불가능<\/b> 효과의 지속 시간이 <b>8초<\/b> <b>증가한다<\/b>.포털에서 나오는 소리를 들을 수 없다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":4,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_RottenGreenTripe","ko":"썩은 푸른 창자","en":"Rotten Green Tripe","d":"데모고르곤에 힘을 불어넣는 썩은 곱창.뒤집힌 세계를 횡단하는 이동 속도가 <b>15%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_RottenPumpkin","ko":"썩은 호박","en":"Rotten Pumpkin","d":"호킨스의 썩은 토양 때문에 감염된 호박 속.<br><br>뒤집힌 세계를 횡단하면, 들어왔던 포탈은 파괴된다. 횡단에 대해 <b>200 블러드포인트<\/b>를 추가로 획득한다.","r":0,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_StickyLining","ko":"끈적한 내벽","en":"Sticky Lining","d":"차원 간 터널을 덮고 팽창하는 막. 끈적거리며 악취가 진동한다.<br><br><b>심연<\/b>이 생존자를 감지하는 반경이 <b>2.5미터<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_ThornyVines","ko":"가시돋친 덩굴 식물","en":"Thorny Vines","d":"차원 간 터널을 보강하며 뻗어 있는 두껍고 가시가 돋친 덩굴.<br><br>생존자가 포털을 봉인하는 데 소요되는 시간이 <b>8%<\/b> <b>늘어난다<\/b>.<b>심연<\/b>이 생존자를 감지하는 반경이 <b>1미터<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_UnknownEgg","ko":"알 수 없는 알","en":"Unknown Egg","d":"섬뜩한 거미줄로 덮인 크고 따뜻한 알.<br><br>뒤집힌 세계를 횡단하는 능력의 재사용 대기 시간이 <b>2.5초<\/b> <b>감소한다<\/b>.","r":3,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_UpsideDownResin","ko":"뒤집힌 세계의 송진","en":"Upside Down Resin","d":"끈적거리고 인화성이 강한 수액. 차원 간 터널로 가는 관문을 강화한다.생존자가 포털을 봉인하는 데 소요되는 시간이 <b>20%<\/b> <b>늘어난다<\/b>.","r":3,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_VermillionWebcap","ko":"다홍색 웹캡 버섯","en":"Vermillion Webcap","d":"뒤집힌 세계로부터 온 선홍색 독버섯.<br><br>포털에서 나올 때 <b>감지 불가능<\/b> 효과의 지속 시간이 <b>3초<\/b> <b>증가한다<\/b>.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":3,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_VioletWaxCap","ko":"보라색 왁스캡 버섯","en":"Violet Waxcap","d":"데모고르곤이 먹이를 감각하는 텔레파시를 왜곡할 수 있도록 해주는 뒤집힌 세계로부터 온 짙은 색의 버섯.<br><br>포털에서 나올 때 <b>감지 불가능<\/b> 효과의 지속 시간이 <b>1초<\/b> <b>증가한다<\/b>.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":2,"c":"ka","o":"Demogorgon"},{"id":"Addon_Demogorgon_ViscousWebbing","ko":"끈끈한 거미줄","en":"Viscous Webbing","d":"차원 간 터널을 넓히는 탄력 있는 거미줄. 물기가 어려 있다.생존자가 포털을 봉인하는 데 소요되는 시간이 <b>10%<\/b> <b>늘어난다<\/b>.","r":1,"c":"ka","o":"Demogorgon"},{"id":"Addon_DreamInducer_BlackBox","ko":"검은 상자","en":"Black Box","d":"수 많은 사진들로 가득 채워진 검은색 골판지 상자.<br><br>출구가 열리면 잠을 자고 있는 생존자를 <b>15초<\/b> 동안 차단한다.어떤 방식으로든 생존자들이 잠에서 깬 후, <b>3초<\/b> 동안 해당 효과가 유지된다.","r":4,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_BlueDress","ko":"하늘색 드레스","en":"Blue Dress","d":"작은 소녀가 입었던 하얀색 레이스로 장식한 하늘색 드레스.<br><br>꿈 올가미는 더 이상 움직이지 않는다.꿈 올가미는 <b>8초<\/b> 동안 활성화된다.꿈 올가미는 한 번에 <b>1개<\/b>만 배치할 수 있다.","r":2,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_CatBlock","ko":"고양이 그림 블럭","en":"Cat Block","d":"잠자는 고양이와 문자 \"C\"가 그려진 흰색과 보라색의 나무 블록.<br><br>꿈 투영의 재사용 대기 시간은 <b>10%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_ClassPhoto","ko":"학급 단체 사진","en":"Class Photo","d":"94-95년도 배드햄 유치원 학급 아이들의 명랑한 모습을 찍은 단체 사진.<br><br>꿈의 세계에 생존자는 출구가 열린 동안 살인마의 본능에 의해 드러난다.출구로 순간 이동할 수 있는 능력이 부여된다.","r":3,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_GardenRake","ko":"정원용 갈퀴","en":"Garden Rake","d":"숙련된 정원사라면 누구나 가지고 있는 작은 갈퀴.<br><br><b>꿈 올가미의 크기가 10%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_GreenDress","ko":"초록색 드레스","en":"Green Dress","d":"작은 소녀가 입었던 하얀색 비단 리본이 달려 있는 초록색 드레스.<br><br><b>생존자가 깨우기 행동을 수행하는 데 걸리는 시간이 2초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_JumpRope","ko":"줄넘기","en":"Jump Rope","d":"오랜 사용으로 인해 색이 바랜 줄이 긴 이중 줄넘기.<br><br><b>생존자가 꿈 올가미에 타격을 받으면, 근육 손상<\/b>의 지속 시간이 <b>11%<\/b> <b>증가한다<\/b>.<br><br>근육 손상은 생존자의 이동 속도를 감소시킨다.","r":2,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_KidsDrawing","ko":"어린 아이가 그린 그림","en":"Kid's Drawing","d":"무엇을 그렸는진 알 수 없는, 어린 아이가 그린 그림.꿈 능력으로 공격하여 얻은 수면 시간이 <b>10%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_NancysMasterpiece","ko":"낸시의 걸작","en":"Nancy's Masterpiece","d":"소중한 기억을 유지하기 위해 배드햄 유치원에서 낸시 홀브룩이 그린 캐릭터 그림.<br><br>꿈 올가미 또는 꿈 판자로 생존자를 타격한 후, 꿈 투영의 총 재사용 대기 시간이 <b>10%<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_NancysSketch","ko":"낸시의 스케치","en":"Nancy's Sketch","d":"낸시가 그린 투박하고 거친 느낌의 그림.<br><br>생존자가 알람 시계를 사용한 후, 꿈 면역력이 <b>20%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_PaintThinner","ko":"도료 희석제","en":"Paint Thinner","d":"휘발성이 강해 불이 잘 붙는 내용물이 들어있는 깡통.<br><br>생존자가 꿈 판자를 떨어뜨리면, <b>6초<\/b> 동안 살인마의 본능에 의해 드러난다.생존자가 드러난 동안 해당 생존자에 대한 꿈 투영의 능력이 잠금 해제된다.해당 꿈 투영의 차지 속도가 100% 증가한다.","r":2,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_PillBottle","ko":"약통","en":"Pill Bottle","d":"비어있는 약통. 한 때 \"조네럴\"이란 이름의 약이 들어있었다.<br><br>생존자가 깨어날 때마다 수면 미터기는 최대 50%까지 <b>10%<\/b> 더 빠르게 충전된다.","r":3,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_PrototypeClaws","ko":"평범한 갈퀴","en":"Prototype Claws","d":"덤불을 다듬을 때 사용하는 수제 갈퀴.<br><br>꿈 올가미를 발사하는 데 걸리는 차지 시간이 <b>10%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_RedPaintBrush","ko":"빨간 물감 붓","en":"Red Paint Brush","d":"선홍색 물감이 묻어 있는 큰 그림용 붓.<br><br>생존자가 32미터 이상 멀어지면 꿈의 세계에 있는 생존자의 오라가 드러난다.각 생존자의 수면 미터기가 50% 증가한다.","r":4,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_Rope","ko":"야외용 노끈","en":"Outdoor Rope","d":"무엇이든 간편하게 묶을 수 있는 튼튼한 야외용 노끈.<br><br>생존자가 꿈의 세계에 있는 동안:<br><br>꿈 올가미의 이동 속도가 <b>15%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_SheepBlock","ko":"양 그림 블럭","en":"Sheep Block","d":"풀을 뜯고 있는 두 마리의 양과 문자 \"S\"가 그려진 흰색과 파란색의 나무 블럭.<b>알람 시계의 재사용 대기 시간이 10%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_SwingChains","ko":"그네의 체인","en":"Swing Chains","d":"녹이 많이 슬었지만, 그네 의자와 연결하기엔 아직 끄떡없는 체인.<br><br>꿈 투영을 사용한 이후, <b>16미터<\/b> 내 모든 창문이 <b>6초<\/b> 동안 차단된다.","r":3,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_UnicornBlock","ko":"유니콘 그림 블럭","en":"Unicorn Block","d":"뛰노는 유니콘과 문자 \"U\"가 그려진 흰색과 빨간색의 나무 블록.<br><br>꿈 판자의 파열 범위가 <b>14%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_WoolShirt","ko":"양모 셔츠","en":"Wool Shirt","d":"작은 소년의 주황색과 노란색 줄무늬 셔츠. \"제시\"라는 이름표가 달려있다.<br><br>꿈 판자의 파열 전 지연이 <b>10%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"Nightmare"},{"id":"Addon_DreamInducer_ZBlock","ko":"Z 블럭","en":"\"Z\" Block","d":"심한 난도질과 함께 불에 그을린 나무 블록. \"Z\"라는 문자 하나만 알아볼 수 있다.<br><br>꿈 올가미 또는 꿈 판자로 공격 받은 생존자는 <b>3초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"Nightmare"},{"id":"Addon_Flashlight_001","ko":"배터리","en":"Battery","d":"제조사를 알 수 없는 평범한 배터리.<br><br>손전등의 사용 시간을 <b>2초<\/b> 늘려 준다.","r":0,"c":"sa","it":"flashlight"},{"id":"Addon_Flashlight_002","ko":"대용량 배터리","en":"Heavy Duty Battery","d":"\"산업용 규격\"이라고 표기된 배터리.<br><br>손전등의 사용 시간을 <b>4초<\/b> 늘려 준다.","r":1,"c":"sa","it":"flashlight"},{"id":"Addon_Flashlight_003","ko":"포커스 렌즈","en":"Focus Lens","d":"손전등의 빛을 한 곳에 더욱 강하게 집중 시킬 수 있도록 만들어진 두꺼운 유리 렌즈.<br><br>손전등 빛의 사정거리가 <b>25%<\/b> <b>증가한다<\/b>.손전등 빛의 폭이 <b>15%<\/b> <b>감소한다<\/b>.손전등 빛의 밝기가 <b>20%<\/b> <b>증가한다<\/b>.실명 시간이 <b>10%<\/b> <b>증가한다<\/b>.","r":1,"c":"sa","it":"flashlight"},{"id":"Addon_Flashlight_004","ko":"와이드 렌즈","en":"Wide Lens","d":"완벽한 형태의 얇은 렌즈. 빛을 넓게 확산시키는 대신, 사거리는 좁아지도록 설계되었다.<br><br>손전등 빛의 사정거리가 <b>25%<\/b> <b>감소한다<\/b>.손전등 빛의 폭이 <b>25%<\/b> <b>증가한다<\/b>.","r":0,"c":"sa","it":"flashlight"},{"id":"Addon_Flashlight_005","ko":"손전등용 전구","en":"Power Bulb","d":"손전등용 작은 전구. 더 많은 전력을 소모해서 밝고 강한 빛을 발산한다.<br><br>손전등 빛의 밝기가 <b>20%<\/b> <b>증가한다<\/b>.실명 시간이 <b>10%<\/b> <b>증가한다<\/b>.","r":0,"c":"sa","it":"flashlight"},{"id":"Addon_Flashlight_006","ko":"집중반사경","en":"TIR Optic","d":"손전등의 빛이 강해지도록 렌즈와 반사경이 잘 조립되어 있다.<br><br>손전등 빛의 밝기가 <b>30%<\/b> <b>증가한다<\/b>.실명 시간이 <b>15%<\/b> <b>증가한다<\/b>.","r":1,"c":"sa","it":"flashlight"},{"id":"Addon_Flashlight_007","ko":"저전압 필라멘트","en":"Low Amp Filament","d":"손전등의 배터리 수명을 절약할 수 있도록 설계된 필라멘트 전구.<br><br>손전등의 배터리 소모량이 <b>24%<\/b> <b>감소한다<\/b>.","r":1,"c":"sa","it":"flashlight"},{"id":"Addon_Flashlight_008","ko":"가죽 손잡이","en":"Leather Grip","d":"후레쉬를 감싸기 위한 가죽 조각. 이것을 두르고 있으면 쥐고 있기 편하다.<br><br>손전등 빛의 정확도가 <b>20%<\/b> <b>증가한다<\/b>.","r":0,"c":"sa","it":"flashlight"},{"id":"Addon_Flashlight_BrokenBulb","ko":"깨진 전구","en":"Broken Bulb","d":"손상된 전구가 gVial_LargeVial","ko":"반응성 화합물","en":"Reactive Compound","d":"내용물이 빠져나올 것을 간절히 바라며 병 안에 압력이 가해진다.<br><br>안개 구름의 확장 시간이 <b>1초<\/b> <b>감소한다<\/b>.","r":1,"c":"sa","it":"fogvial"},{"id":"Addon_FogVial_SlowRelease","ko":"기름진 수액","en":"Oily Sap","d":"모습을 드러낸 안개는 공기에 달라붙어 감각을 더욱 오랫동안 압도한다.<br><br>안개 구름의 지속 시간이 <b>2초<\/b> <b>증가한다<\/b>.","r":2,"c":"sa","it":"fogvial"},{"id":"ADDON_Frenzy_ColdDirt","ko":"베프","en":"BFFs","d":"4조각으로 쪼개진 차가운 은 목걸이. 가장 친한 친구들끼리 한 명당 하나씩 나누어 가졌다.<br><br><b>음산한 광기<\/b> 동안 생존자를 타격해 토큰을 얻는다.두 번째 연쇄 타격: <b>토큰 2개<\/b>세 번째 연쇄 타격: <b>토큰 3개<\/b>네 번째 연쇄 타격: <b>토큰 4개<\/b>다섯 번째 연쇄 타격: <b>토큰 5개<\/b><br><br>Once the gates are powered, if <b>15개 이상의 토큰<\/b>을 수집한 후, 출구에 전력이 공급되면 <b>음산한 광기<\/b>를 사용하지 않는 동안은 <b>6%의 이동 속도 증가<\/b>를 얻는다.<br><br>이동 속도 증가 효과는 살인마의 이동 속도를 증가시킨다.","r":3,"c":"ka","o":"Legion"},{"id":"ADDON_Frenzy_DefacedSmileyPin","ko":"일그러진 웃는 얼굴 핀","en":"Defaced Smiley Pin","d":"일그러진 웃는 얼굴이 왠지 친숙한 밝은 노랑색 단추이다. 군단의 상징이다.<br><br><b>음산한 광기<\/b>로부터 얻은 심각한 부상을 스스로 치료하는 생존자는 <b>60초<\/b> 동안 <b>깊은 상흔<\/b>에 빠진다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":1,"c":"ka","o":"Legion"},{"id":"ADDON_Frenzy_EtchedRuler","ko":"긁힌 자","en":"Etched Ruler","d":"적들의 이름을 깊이 새겨 넣은 나무 자이다.<br><br><i>음산한 베기<\/i>에 타격을 입은 생존자는 <b>60초<\/b> 동안 <b>인지 불가능<\/b>에 빠진다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":1,"c":"ka","o":"Legion"},{"id":"ADDON_Frenzy_FilthyBlade","ko":"더러운 칼날","en":"Filthy Blade","d":"더러운 핏자국과 녹으로 얼룩진 칼날이 상처 치료를 아주 어렵게 만든다.<br><br>스스로 치료하는 데 필요한 시간이 <b>4초<\/b> <b>늘어난다<\/b>.","r":3,"c":"ka","o":"Legion"},{"id":"ADDON_Frenzy_FranksMixTape","ko":"프랭크의 믹스 테이프","en":"Frank's Mix Tape","d":"살인 임무를 수행할 때에는 반드시 음악과 함께 하도록 하자. 재생 목록은 귀를 찌르는 타악기와 육중한 뒤틀림으로 가득하다.<br><br><b>음산한 광기<\/b>를 사용하는 동안 효과:발전기 손상 속도가 <b>20% 빨라진다<\/b>.벽을 부수는 속도가 <b>30% 빨라진다<\/b>.발전기를 손상하거나 벽을 부수는 동안 능력 게이지가 중단된다.","r":3,"c":"ka","o":"Legion"},{"id":"ADDON_Frenzy_FriendshipBracelet","ko":"우정 팔찌","en":"Friendship Bracelet","d":"회색과 적색의 넓은 밧줄을 꼬은 팔찌이다. 굵은 검은색과 함 히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"Clown"},{"id":"Addon_GasBomb_13","ko":"표백제 플라스크","en":"Flask of Bleach","d":"인간의 폐를 자극하고 화상 및 심한 손상을 유발하는 치명적인 화학 물질.<br><br><b>특제 가스로 인한 근육 손상<\/b>의 페널티가 <b>2%<\/b> <b>증가한다<\/b>.<br><br>근육 손상은 생존자의 이동 속도를 감소시킨다.","r":2,"c":"ka","o":"Clown"},{"id":"Addon_GasBomb_14","ko":"클로로폼이 든 병","en":"Bottle of Chloroform","d":"달콤한 냄새를 풍기는 유기 화합물. 강한 마취 효과를 지니고 있다.<br><br><b>만담용 특제<\/b> 가스 구름의 크기와 범위가 <b>20%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Clown"},{"id":"Addon_GasBomb_15","ko":"화려한 화장용품 키트","en":"Garish Makeup Kit","d":"얼굴과 해독제에 사용할 수 있다. 정체를 알 수 없는 화합물은 해독제의 효과를 강화시킨다.<br><br>기운 회복의 지속 시간이 <b>2초<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Clown"},{"id":"Addon_GasBomb_16","ko":"싸구려 진","en":"Cheap Gin Bottle","d":"밤은 거칠고 낮이 더 거칠 때, 개의 털이 조금이라도 있으면 힘이 난다.<br><br>클라운의 기운 회복이 <b>3%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Clown"},{"id":"Addon_GasBomb_17","ko":"에테르 15 vol%","en":"Ether 15 vol%","d":"고농도의 휘발성 유기 화합물. 독성이 매우 강하다.<br><br>특제 가스에 의한 마취 지속 시간이 <b>0.5초<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Clown"},{"id":"Addon_GasBomb_18","ko":"담뱃갑","en":"Cigar Box","d":"담뱃갑 안에 음산하면서도 아직 수집을 덜 마친 손가락들이 들어있다. 이는 클라운의 수집욕을 자극시켜 화학물 제작 능력을 향상시킨다.<br><br><b>클라운<\/b> 또는 생존자가 회복하는 동안 6미터 내 다른 모든 생존자 및 살인마의 오라가 드러난다.","r":3,"c":"ka","o":"Clown"},{"id":"Addon_GasBomb_19","ko":"문신한 사내의 중지손가락","en":"Tattoo's Middle Finger","d":"큰 문신을 한 사내의 소중한 중지손가락. 기계 기름의 맛이 희미하게 남아있다.<br><br>특제 가스 또는 해독 가스를 들이마신 생존자의 오라를 <b>6초<\/b> 동안 볼 수 있다.","r":4,"c":"ka","o":"Clown"},{"id":"Addon_GasBomb_20","ko":"빨간 머리의 새끼손가락","en":"Redhead's Pinky Finger","d":"빨간 머리를 한 사람의 새끼손가락. 향기가 어렴풋이 나며, 포푸리와 바니시가 섞인 맛이 난다.<br><br><b>특제 가스<\/b> 병에 직접적으로 맞으면 마취가 풀릴 때까지 <b>약점 노출<\/b> 상태 이상에 걸린다.최대 보유 가능한 병의 개수는 <b>1<\/b>개다.<br><br>생존자가 약점 노출 상태에 걸릴 경우, 기본 공격으로도 빈사 상태에 빠진다.","r":4,"c":"ka","o":"Clown"},{"id":"Addon_Ghost_CheapCologne","ko":"싸구려 향수","en":"Cheap Cologne","d":"염가 판매점에서 구매한 소독용 알콜 향이 강한 향수로, 고스트 페이스가 자신의 존재를 알리기 위해 사용한다. 이 향수는 흔적을 남기기 위해 잠깐 들르는 용도로 사용한다.<br><br>표식의 지속 시간이 <b>10초<\/b> <b>늘어난다<\/b>.","r":0,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_ChewedPen","ko":"이빨자국이 난 펜","en":"Chewed Pen","d":"대니의 DNA 흔적이 남아있는 이빨자국이 새겨진 뚜껑 달린 파란색 펜이다. 누구도 찾지 못한 그의 유죄를 입증하는 결정적인 증거물이다.<br><br>빈사 상태의 생존자는 <b>3초<\/b>만에 <b>고스트 페이스<\/b>를 탐지할 수 있다.","r":2,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_DriversLicense","ko":"운전면허증","en":"Driver's License","d":"올슨의 진짜 정체인 대니 존슨에 대한 정보가 담겨 있는 운전면허증이다.<br><br>발전기를 수리하고 있는 생존자에게 표식을 새길 때, 발전기가 폭발하고 <b>20%의 진행도<\/b>를 잃는다.영향을 받은 발전기는 <b>15초<\/b> 동안 차단된다.여러 생존자에게 동시에 표식을 남기는 경우, 진행도 손실 효과는 단 한 번만 적용된다.","r":3,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_DropLegKnifeSheath","ko":"허벅지에 차는 칼집","en":"Drop-Leg Knife Sheath","d":"모든 행동에 적합한 칼로, 자유롭게 움직이며 신속하게 깊은 상처를 입히는 데 적합하다. 이것은 대니가 필라델피아에서 야간 순찰을 돌던 경관에게서 훔쳐낸 무기다.<br><br><b>고스트 페이스<\/b>는 생존자에게 표식을 남긴 후, <b>5초<\/b> 동안 <b>10%의 이동 속도 증가<\/b>를 얻는다.","r":3,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_HeadlinesCutouts","ko":"헤드라인 기사 조각","en":"Headline Cutouts","d":"유타 지방에서 펜실베니아에 이르는 미해결 사건을 다룬 신문 기사의 헤드라인 조각들이다. 고스트 페이스는 이들 중 일부를 작성했으며, 이 사건들은 모두 그가 저지른 것들이다.<br><br>성공한 기록 하나마다 자존감이 고양되고, 자신감도 올라간다.<br><br>미행 중 이동 속도가 <b>40%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_KnifeBeltClip","ko":"나이프 벨트 클립","en":"Knife Belt Clip","d":"정찰용으로 딱 어울리는 벨트 클립으로 칼을 안전하게 소지할 수 있다. 오늘 밤 벌어질 계획에 대해 아는 이는 아무도 없을 것이다.<br><br>앉아 있는 동안, 공포 범위가 <b>12미터<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_LastingPerfume","ko":"독한 향수","en":"Lasting Perfume","d":"고스트 페이스가 자신의 존재를 알리기 위해 사용하는 강한 사향이 포함된 향수. 처치하기로 계획한 피해자를 찾아갈 때 사용한다.<br><br>갈고리에 걸린 생존자는 <b>3초<\/b>만에 <b>고스트 페이스<\/b>를 탐지할 수 있다.","r":2,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_LeatherKnifeSheath","ko":"가죽 나이프 칼집","en":"Leather Knife Sheath","d":"칼을 소지하는데 적당하며, 조용하고 유연한 칼집. 제자리에 고정만 잘하면 이동이 굉장히 편해진다.<br><br>앉아 이동하는 속도가 <b>10%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_MarkedMap","ko":"표식이 그려진 지도","en":"Marked Map","d":"플로리다 주의 로즈빌 북부가 그려진 주석이 첨부된 지도. 각 X 마크는 고스트 페이스에게 희생된 피해자들의 위치를 표시한다. 목표에 대한 계획만 수립되면 들키지 않고 거리를 돌아다닐 수 있다.<br><br>살인마의 위치가 발각될 시 살인마의 본능의 지속 시간이 <b>2초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_NightVisionMonocular","ko":"야간 투시용 단안경","en":"Night Vision Monocular","d":"어둠 속에서도 선명한 사진을 찍을 수 있는 야간 투시용 렌즈. 밤 동안 신중하게 움직이며 잠시 들르는 목적으로 사용하기 좋은 장비다.<br><br><b>고스트 페이스<\/b>를 탐지한 생존자는 <b>10초<\/b> 동안 <b>탈진<\/b> 상태 이상에 빠진다.<br><br>생존자는 탈진으로 탈진에 영향받는 기술을 발동할 수 없다.","r":3,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_OlsensAddressBook","ko":"올슨의 주소록","en":"Olsen's Address Book","d":"무뚝뚝한 어투로 쓰인 푸른색 글자로 가득한 전화번호부. 로즈빌에서 발생한 모든 살인사건 피해자의 주소와 전화번호가 기록되어 있다.<br><br>빠른 행동들을 할 때 <b>5초<\/b> 동안 표식이 새겨진 생존자들의 오라가 드러난다.","r":1,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_OlsensJournal","ko":"올슨의 수기","en":"Olsen’s Journal","d":"나선철 형식으로 얼룩이 묻어있으며, 글자로 가득한 노트. 이 수기에는 피해자를 미행하는 데 사용한 다양한 장비에 대한 내용이 자세히 기록되어 있다.<br><br>표식이 새겨진 생존자는 표식이 사라질 때까지 <b>인지 불가능<\/b> 상태 이상이 적용된다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":1,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_OlsensWallet","ko":"올슨의 지갑","en":"Olsen’s Wallet","d":"현금 30달러, 비디오 클럽 회원증, 올슨의 첫 범행 피해자가 찍힌 사진이 접힌 상태로 보관되어 있는 올슨의 지갑이다. 유죄를 입증할 수 있는 증거를 지님으로써 흥분을 고조시키고 자신의 죄를 반박할 수 있다.<br><br>판자 또는 부서지기 쉬운 문에 기본 파괴를 수행할 때마다, <b>밤의 장막<\/b>이 즉시 재충전된다.","r":2,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_OutdoorSecurityCamera","ko":"야외 보안 카메라","en":"Outdoor Security Camera","d":"로즈빌 북부의 벨리뷰 도로 근처의 집에 침입한 고스트 페이스를 찍은 소형 감시용 카메라. 이 카메라는 고스트 페이스의 행동거지를 남기면서도 경찰에 결정적인 단서를 제공하지 못하도록 교묘한 위치에 설치되었다.<br><br>표식이 새겨진 생존자가 빈사 상태가 되면 <b>7초<\/b> 동안 모든 생존자의 오라가 표시된다.","r":4,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_Philly","ko":"“필리”","en":"“Philly”","d":"올슨이 전에 일하던 필라델피아에서 희생자를 처리하고 빼앗은 카메라. 필름 안에는 그가 필라델피아에서 보낸 마지막 날의 기록이 고스란히 담겨 있다.<br><br>생존자에게 표식을 새기는 데 걸리는 시간이 <b>10%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_ReusableCinchStraps","ko":"신치 스트랩","en":"Cinch Straps","d":"밀행 중 모든 물건을 고정시키는 검은색 스트랩.<br><br>기본 공격에 실패 후, <b>밤의 장막<\/b>은 활성화된 채로 남는다.","r":1,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_TelephotoLens","ko":"망원 렌즈","en":"Telephoto Lens","d":"멀리서 사진을 찍어도 발각되지 않는 수동식 초점 렌즈.<br><br><b>고스트 페이스<\/b>를 탐지한 생존자는 <b>60초<\/b> 동안 <b>인지 불가능<\/b> 상태 이상에 걸린다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":1,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_TheGhostFaceCaughtOnTape","ko":"“테이프에 찍힌 고스트 페이스”","en":"“Ghost Face Caught on Tape”","d":"올슨이 로즈빌 지역에 공포를 조장하는 기사를 쓰기 위해 입수한 테이프다.<br><br>생존자를 빈사 상태에 빠지게 만드는 기본 공격에 성공하면 <b>밤의 장막<\/b>이 즉시 재충전된다.","r":4,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_VictimsDetailedRoutine","ko":"피해자의 세부 일정","en":"Victim’s Detailed Routine","d":"올슨에게 희생된 첫 피해자가 매주 어떻게 행동했는지 적혀 있는 찢어진 페이지. 피해자의 습관을 파악함으로써 저들의 다음 행동에 대응할 수 있다.<br><br>표식이 새겨지면, 생존자는 <b>5초<\/b> 동안 <b>탈진<\/b> 상태 이상에 걸린다.<br><br>생존자는 탈진으로 탈진에 영향받는 기술을 발동할 수 없다.","r":3,"c":"ka","o":"Ghostface"},{"id":"Addon_Ghost_WalleyesMatchbook","ko":"월아이즈 성냥갑","en":"Walleye's Matchbook","d":"로즈빌 북부에 있는 작은 술집에서 받은 성냥갑. 피해자의 전화번호가 파란색 글씨로 적혀 있다. 그의 유죄를 입증한 증거물 중 하나이다.<br><br><b>밤의 장막<\/b> 능력의 재사용 대기 시간이 <b>2초 감소한다<\/b>.","r":0,"c":"ka","o":"Ghostface"},{"id":"Addon_Harpoon_BarbedWire","ko":"가시철사","en":"Barbed Wire","d":"뾰족한 가시가 있으며 잘 휘어지는 미국산 철사. 철사의 심플함에도 불구하고 케일럽은 이것을 창에 감아 사용하면 창의 잔인함을 극도로 끌어올릴 수 있다는 것을 알게 됐다.<br><br>심각한 부상의 치료 시간이 <b>3.5초<\/b> <b>늘어난다<\/b>.","r":3,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_BayshoresCigar","ko":"베이쇼어의 시가","en":"Bayshore’s Cigar","d":"케일럽의 상사가 복부에 창이 꽂혀 울부짖는 동안, 상사의 재킷에서 꺼낸 질 좋은 시가.<br><br>생존자가 탈출하면 기절 지속 시간이 <b>0.75초<\/b> <b>감소한다<\/b>.","r":3,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_BayshoresGoldTooth","ko":"베이쇼어의 금니","en":"Bayshore’s Gold Tooth","d":"헨리 베이쇼어가 끝장나기 전 몇 시간 동안 자비를 외칠 때 떼어 낸 금니.<br><br><b>구속자<\/b>의 감기 속도가 <b>5%<\/b> <b>빨라진다<\/b>.","r":2,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_ChewingTobacco","ko":"씹는담배","en":"Chewing Tobacco","d":"글렌베일의 처참한 시체에서 꺼낸 잘게 썰려 달달한 향이 추가된 담뱃잎 캔. 신경을 자극한다.<br><br>생존자가 탈출하면 기절 지속 시간이 <b>0.25초<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_ClearCreekWhiskey","ko":"골드 크릭 위스키","en":"Gold Creek Whiskey","d":"케일럽의 분노를 진정시키고 그의 발걸음을 늦추게 만든 병에 담긴 따뜻하고 안락한 위스키.<br><br><b>구속자<\/b>의 시야를 조준하는 동안 공포 범위가 <b>8미터<\/b> <b>감소한다<\/b>.","r":3,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_HellshireIron","ko":"헬셔의 도구","en":"Hellshire Iron","d":"헬셔 갱단의 낙인 도구. 전설적인 명성에도 불구하고 그들에게 낙인을 찍히는 없었다. 대신 험한 싸움이 가득한 현상금 사냥에 자주 사용되곤 하였다.<br><br>생존자가 창에 찔리면 <b>감지 불가능<\/b> 상태 이상이 된다. 효과는 생존자가 창에서 벗어난 후에도 <b>10초<\/b> 동안 지속된다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":4,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_HoneyLocustThorns","ko":"수엽나무 가시","en":"Honey Locust Thorns","d":"케일럽이 현상수배범을 두 번이나 놓친 것에 분노하여 가시가 날카로운 가지들을 비틀어 창 형태로 만들고 풀어놓은 것.<br><br>작살 총에서 벗어나면 생존자는 <b>70초<\/b> 동안 <b>깊은 상흔<\/b> 상태 이상에 빠진다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_IridescentCoin","ko":"핏빛 동전","en":"Iridescent Coin","d":"안개 자체에서 만들어진, 유리로 된 동전. 현상금 사냥꾼가 제공한 서비스에 대한 지불금.<br><br>최소 <b>12미터<\/b> 멀리에서 날아온 창에 찔린 생존자는 창에 찔린 동안 <b>약점 노출<\/b> 상태가 된다.<br><br>부상 당한 생존자가 약점 노출 상태에 걸릴 경우, 기본 공격으로도 빈사 상태에 빠진다.","r":4,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_JawSmasher","ko":"조 스매셔","en":"Jaw Smasher","d":"격렬한 총격전에서 케일럽의 턱을 찢어버린 총알. 복수에 대한 불타는 욕망을 다시 불러일으켰다.<br><br><b>구속자<\/b>의 시야를 조준하는 동안 이동 속도가 <b>1.5%<\/b> <b>빨라진다<\/b>.","r":1,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_MarshalsBadge","ko":"집행관의 배지","en":"Marshal's Badge","d":"현상 수배와 함께 헬셔 갱단을 방해한 애리조나 준주의 법 집행관의 시체로부터 떼낸 은빛 배지.<br><br><b>구속자<\/b>의 시야를 조준하는 동안 공포 범위가 <b>4미터<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_ModifiedAmmoBelt","ko":"개조된 총알 벨트","en":"Modified Ammo Belt","d":"케일럽이 자신의 특수 무기를 위해 개조한 오래된 총알 벨트. 애리조나 준주의 사막에는 아직 미세하게 붉은 먼지가 남아 있다.<br><br><b>구속자<\/b>의 재장전 시간이 <b>0.25초<\/b> <b>줄어든다<\/b>.","r":0,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_PoisonOakLeaves","ko":"옻나무 잎","en":"Poison Oak Leaves","d":"평범하게 생긴 식물이지만, 케일럽은 식물에서 나온 기름으로 코팅된 창을 사용하면 상처 주위에 견딜 수 없는 물집이 생긴다는 것을 알게 됐다.<br><br>심각한 부상의 치료 시간이 <b>1.5초<\/b> <b>늘어난다<\/b>.","r":1,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_PrisonChain","ko":"감옥 체인","en":"Prison Chain","d":"쇠공이 이어져있으며 한때 케일럽의 발목을 감싸고 있던 두껍고 무거운 체인. 이후에는 창에 달리게 된다.<br><br>생존자가 창에서 해방되기 위해 필요한 시간이 <b>10%<\/b> <b>늘어난다<\/b>.","r":3,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_RicketyChain","ko":"부서질 듯한 체인","en":"Rickety Chain","d":"케일럽의 프로토타입 작살 총에 처음에 사용된 약한 철 연결고리. 체인이 큰 효과가 없었지만, 애착이 간다.<br><br><i>창에 찔리다<\/i> 스코어 이벤트에서 <b>50%의 추가 블러드포인트<\/b>를 획득한다.생존자들은 <b>33%<\/b> 빠르게 탈출할 수 있다.","r":0,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_RustedSpike","ko":"녹슨 못","en":"Rusted Spike","d":"케일럽이 병적 호기심의 순간에 작살 총 앞 부분에 달아버린 철길용 못. 둔탁한 못의 끝은 대상을 결코 깔끔하게는 뚫지 못한다.<br><br>생존자가 감아 당겨져 있는 상태에서 <b>구속자<\/b>로 타격 시, <b>60초<\/b> 동안 <b>깊은 상흔<\/b>에 빠진다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":1,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_SnakeOil","ko":"엉터리 약","en":"Snake Oil","d":"여행 상인에게 구매한 추출물과 오일의 팅크. 세상의 모든 질병을 치료한다고 한다.<br><br><b>구속자<\/b>의 감기 속도가 <b>2.5%<\/b> <b>빨라진다<\/b>.","r":0,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_SpitPolishRag","ko":"침 묻은 누더기","en":"Spit Polish Rag","d":"더러운 누더기 조각. 총격전에서 작살 총을 닦아내는 건 침과 팔꿈치의 기름으로 충분했다.<br><br>빗나간 <b>구속자<\/b>의 재사용 대기 시간이 <b>0.25초<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_TinOilCan","ko":"작은 오일 깡통","en":"Tin Oil Can","d":"기계의 마찰을 줄이기 위해 사용하는 오일을 조금 담은 깡통. 작살 총의 초기 모델은 막히기 일쑤였기 때문에 오일을 발라야만 했다.<br><br>빗나간 <b>구속자<\/b>의 재사용 대기 시간이 <b>0.5초<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_WantedPoster","ko":"현상 수배 전단","en":"Wanted Poster","d":"누렇게 물든 메이슨 켈리의 현상 수배 전단. 케일럽은 사냥에 집중했다.<br><br><b>구속자<\/b>의 시야를 조준하는 동안 이동 속도가 <b>3%<\/b> <b>빨라진다<\/b>.","r":2,"c":"ka","o":"Gunslinger"},{"id":"Addon_Harpoon_WardensKeys","ko":"교도소장의 열쇠","en":"Warden’s Keys","d":"뭉툭하고 거슬리는 열쇠. 케일럽의 격렬한 기억을 회상시킨다.<br><br><b>구속자<\/b>의 재장전 시간이 <b>0.35초<\/b> <b>줄어든다<\/b>.","r":2,"c":"ka","o":"Gunslinger"},{"id":"Addon_Hatchet_AmanitaToxin","ko":"아마니타 독버섯","en":"Amanita Toxin","d":"손도끼의 날에 발라진 독. 아마니타 버섯의 독은 정신을 마비시킨다.<br><br>손도끼는 <b>60초<\/b> 동안 <b>실명<\/b>에 걸리게 만든다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.","r":0,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_BandagedHaft","ko":"붕대 감긴 손잡이","en":"Bandaged Haft","d":"응급 처치용 붕대가 탄탄하게 감긴 손도끼의 손잡이.<br><br>손도끼를 연속으로 던질 때의 재사용 대기 시간이 <b>10%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_BegrimedHead","ko":"더러운 도끼날","en":"Begrimed Head","d":"만지는 사람의 정신을 혼미하게 하는 더러운 무언가가 묻어있는 도끼날.<br><br>피격당한 생존자는 <b>80초<\/b> 동안 <b>깊은 상흔<\/b>과 <b>출혈<\/b> 상태 이상에 빠진다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 완전히 치료될 때까지 계속 지속된다.","r":3,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_BerusToxin","ko":"노란색 옷감","en":"Yellowed Cloth","d":"물집이 생기고 엉덩이를 닦아내는 데 쓰이는 간단한 재료 조각.<br><br>손도끼의 투사체 속도가 <b>10%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_CoarseStone","ko":"거친 돌","en":"Coarse Stone","d":"너무 거칠어서 위험한 돌. 이 돌로 갈린 도끼의 날은 봉합되지 않는 부상을 입힌다.<br><br>대상을 타격하면 부상이 다시 치료될 때까지 고통의 신음소리가 <b>50%<\/b> 증가한다.","r":0,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_DeerskinGloves","ko":"사슴가죽 장갑","en":"Deerskin Gloves","d":"손을 보호함과 동시에 안정적인 그립감을 주는 매끈한 가죽 장갑.<br><br>손도끼를 재장전하는 데 걸리는 시간이 <b>20%<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_FineStone","ko":"무거운 도끼날","en":"Weighted Head","d":"이상하리만큼 무거운 도끼날로 대상에 강력한 타격을 주기 위해 그렇게 제작되었다. 강한 팔 힘을 가진 자만이 다룰 수 있다.<br><br>손도끼는 <b>10초<\/b> 동안 <b>불구화<\/b> 상태에 빠뜨린다.<br><br>불구화 상태의 생존자는 타인 또는 스스로를 치료하거나, 수리, 파괴공작, 정화, 축복, 또는 아이템을 사용하는 등의 상호작용을 할 수 없다.","r":1,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_FlowerBabushka","ko":"꽃무늬 손수건","en":"Flower Babushka","d":"화려한 꽃무늬가 수놓아져 있는 깨끗한 손수건. 헌트리스에게 잃어버린 작은 아이에 대한 기억을 불러일으켜 분노와 집중력을 끌어올린다.<br><br>손도끼 던지기 준비 동작에 걸리는 시간이 <b>10%<\/b> <b>단축된다<\/b>.","r":2,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_GlowingConcoction","ko":"빛나는 용액","en":"Glowing Concoction","d":"다른 세계에서 만들어진 희미하고 불길하게 빛나는 혼합물.<br><br>손도끼에 피격당한 생존자의 오라가 <b>5초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_InfantryBelt","ko":"보병의 허리띠","en":"Infantry Belt","d":"견고한 공구용 벨트가 한 군인으로부터 약탈을 당했다. 전투 중 그의 속도는 빨랐지만, 그녀가 더 빨랐다.<br><br>손도끼가 타격하면 <b>5초<\/b> 동안 <b>3%의 이동 속도 증가<\/b>가 발동된다.<br><br>이동 속도 증가 효과가 살인마의 이동 속도를 높인다.","r":3,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_IridescentHead","ko":"핏빛 도끼날","en":"Iridescent Head","d":"유리처럼 투명한 도끼날이 안개에 서식하는 엔티티의 힘을 담은 것처럼 보인다.<br><br>성공적인 손도끼 타격은 건강한 생존자조차 빈사 상태에 빠지게 만든다.최대로 들 수 있는 손도끼의 양이 <b>1<\/b>개로 설정된다.","r":4,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_LeatherLoop","ko":"가죽고리","en":"Leather Loop","d":"옳은 손에 쥐여진 옳은 도구는 성공적인 사냥에 열쇠다.<br><br>손도끼가 타격하면 <b>5초<\/b> 동안 <b>2%의 이동 속도 증가<\/b>가 발동된다.<br><br>이동 속도 증가 효과가 살인마의 이동 속도를 높인다.","r":1,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_MannaGrassBraid","ko":"만나 풀 노리개","en":"Manna Grass Braid","d":"만나 풀로 만들어진 동그란 장식물이 달린 노리개. 헌트리스에게 잃어버린 작은 아이에 대한 기억을 불러일으켜 분노와 집중력을 끌어올린다.<br><br>손도끼 던지기 준비 동작에 걸리는 시간이 <b>5%<\/b> <b>단축된다<\/b>.","r":1,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_OakHaft","ko":"참나무 손잡이","en":"Oak Haft","d":"빠른 조작이 가능하도록 손질된 손잡이.<br><br>손도끼를 연속으로 던질 때의 재사용 대기 시간이 <b>20%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_PungentFiale","ko":"군인의 각반","en":"Soldier's Puttee","d":"죽은 군인에게서 가져온 랩으로 발목과 아랫쪽 다리를 보호하는 데 쓰인다.<br><br>손도끼가 없는 헌트리스는 <b>4.6 m/s<\/b>의 속도로 이동한다.","r":4,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_RustyHead","ko":"녹슨 도끼날","en":"Rusty Head","d":"단단하고 불안정한 녹슨 도끼날은 사냥감에게 치료하기 힘든 상처를 입힌다.<br><br>손도끼는 <b>70초<\/b> 동안 <b>깊은 상흔<\/b> 효과를 부여한다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_ShinyPin","ko":"반짝이는 핀","en":"Shiny Pin","d":"형체를 알아볼 수 없을 정도로 훼손되었지만 여전히 반짝이는 구리 핀. 까다로운 사냥감에게서 약탈해왔다.<br><br>손도끼를 조준하거나 투척하는 동안 <b>헌트리스<\/b>의 이동 속도가 <b>5% 증가한다<\/b>.","r":1,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_VenomousConcoction","ko":"신경독 용액","en":"Venomous Concoction","d":"손도끼의 날에 발라진 독액. 이 탁한 용액은 물리면 피로감을 느끼게 하는 베루스 독뱀의 신경독으로 만들어졌다.<br><br><b>손도끼<\/b>는 상대를 <b>5초<\/b> 동안 <b>탈진<\/b> 상태에 빠지게 만든다.<br><br>생존자는 탈진으로 탈진에 영향받는 기술을 발동할 수 없다.","r":2,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_YewSeedBrew","ko":"나무 여우","en":"Wooden Fox","d":"대충 조각된 이 여우 조각상은 크기가 그렇게 크지 않다. 잠행 능력과 교활함이 가공되지 않은 힘만큼이나 효과적이라는 것을 상기시켜준다.<br><br>재장전 후 <b>30초<\/b> 동안 <b>감지 불가능<\/b> 능력을 사용할 수 있다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 자국을 볼 수 없게 만든다.","r":3,"c":"ka","o":"Bear"},{"id":"Addon_Hatchet_YewSeedConcoction","ko":"장미 뿌리","en":"Rose Root","d":"차로 끓였을 때 탈진과 과로 증상을 완화시켜주는 말린 꽃잎.<br><br>손도끼의 투사체 속도가 <b>20%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Bear"},{"id":"Addon_HillbillyChainsaw_IridescentBrick","ko":"더러운 슬리퍼","en":"Filthy Slippers","d":"맥스는 때때로 어머니의 발소리가 버겁다.<br><br>전기톱 질주를 <b>2초<\/b> 동안 유지하면, 전기톱 질주가 끝날 때까지, <b>감지 불가능<\/b> 능력을 사용할 수 있다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":3,"c":"ka","o":"HillBilly"},{"id":"Addon_K22Power_1","ko":"고양이 모형","en":"Cat Figurine","d":"어른 빅터의 눈길을 사로잡은 나무 모형. 그는 어머니가 그것을 시장에서 훔칠 때까지 비명을 질렸고, 그 때문에 정체가 탄로날뻔했다.<br><br><b>덮치기<\/b> 대상의 위치를 표시한다.","r":0,"c":"ka","o":"K22"},{"id":"Addon_K22Power_10","ko":"녹슨 바늘","en":"Rusted Needle","d":"마들렌이 아이들의 누더기 옷을 꿰맬 때 사용했던 바늘.<br><br>달라붙어있는 <b>빅터<\/b>를 으스러뜨리면 생존자가 치료될 때까지 <b>출혈<\/b> 상태에 빠집니다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"K22"},{"id":"Addon_K22Power_11","ko":"하수 쓰레기","en":"Sewer Sludge","d":"도시 하수구를 통해 탈출 시도를 하는 동안 데헤이스 가족들을 뒤덮었던 역겹고 끈적끈적한 혼합물.<br><br>달라붙어있는 <b>빅터<\/b>를 으스러뜨리는데 걸리는 시간이 <b>2초<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K22"},{"id":"Addon_K22Power_12","ko":"마들렌의 스카프","en":"Madeleine’s Scarf","d":"마들렌이 죽기 직전에 입었던 천. 쌍둥이는 그것을 어머니의 죽음을 기념하기 위해 간직했다.<br><br><b>빅터<\/b>의 이동 속도가 <b>0.3 m/s<\/b> <b>빨라진다<\/b>.","r":2,"c":"ka","o":"K22"},{"id":"Addon_K22Power_13","ko":"오래된 비스킷","en":"Stale Biscuit","d":"마들렌이 마을 시장에서 훔친 딱딱하고 이스트를 넣지 않은 비스킷. 풍족하진 않았지만 웬만한 식사보다 좋았다.<br><br><b>덮치기<\/b> 재사용 대기 시간이 <b>0.4초<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"K22"},{"id":"Addon_K22Power_14","ko":"치우쳐진 딸랑이","en":"Weighty Rattle","d":"빅터가 욕심냈던 딸랑이. 그는 어머니가 자신을 위해 그것을 도둑질을 할 때까지 울음을 멈추지 않았다. 하지만 아기의 손에 쥐여주기엔 너무 무거운 딸랑이다.<br><br>달라붙어있는 <b>빅터<\/b>를 으스러뜨리면 <b>20초<\/b> 동안 <b>치료 불능<\/b> 상태에 빠진다.<br><br>치료 불능 상태의 생존자는 치료를 할 수 없다.","r":2,"c":"ka","o":"K22"},{"id":"Addon_K22Power_15","ko":"숲의 스튜","en":"Forest Stew","d":"이끼와 나무껍질을 섞어 허황된 충만감을 자아내는 숙성된 채소 스튜.<br><br><b>빅터<\/b>의 이동 속도가 <b>0.6 m/<\/b> <b>빨라진다<\/b>.","r":3,"c":"ka","o":"K22"},{"id":"Addon_K22Power_16","ko":"팽이","en":"Spinning Top","d":"쌍둥이가 서로 공유하는 나무 팽이. 비록 빅터는 자신만을 위한 팽이를 원했지만... 그리고 시간이 지나 그는 꼭 매달려 소리를 지르면 자신이 원하는 것을 얻는 수 있다는 것을 알게 되었다.<br><br><b>빅터<\/b>의 <b>덮치기<\/b>는 생존자가 가진 생존자 아이템을 떨어뜨린다.","r":3,"c":"ka","o":"K22"},{"id":"Addon_K22Power_17","ko":"향수 한 방울","en":"Drop of Perfume","d":"마들렌의 과거를 떠나오면 함께 챙긴 몇 안 되는 사치품 중 하나. 기분 좋은, 사람을 무장해제시키는 냄새를 풍긴다.<br><br>빅터가 휴면 상태일 때 <b>빅터<\/b>의 알림 범위 내에 있는 생존자는 <b>인지 불가능<\/b>에 빠진다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":3,"c":"ka","o":"K22"},{"id":"Addon_K22Power_18","ko":"빅터의 병정","en":"Victor’s Soldier","d":"빅터가 두려움을 느낄 때마다 꼭 끌어안았던 장난감 병정. 샬롯 안에 질투라는 감정을 불러일으켰다.<br><br>빅터가 휴면 상태에 있을 때 <b>빅터<\/b>를 으스러뜨리면 <b>6초<\/b> 동안 생존자의 오라가 드러난다.","r":3,"c":"ka","o":"K22"},{"id":"Addon_K22Power_19","ko":"침묵의 천","en":"Silencing Cloth","d":"다섯 살짜리 샬롯이 자신의 입에 넣을 거친 천 조각. 마녀 사냥꾼들이 근처에 다가올 때 그녀가 소리 지르는 걸 참을 수 있게 해줬다.<br><br><b>샬롯<\/b>이 휴면 상태에서 깨어나면 샬롯에게 <b>20초<\/b> 동안 <b>감지 불가능<\/b>이 주어진다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":4,"c":"ka","o":"K22"},{"id":"Addon_K22Power_2","ko":"조그마한 손톱","en":"Tiny Fingernail","d":"샬롯이 썩어가는 빅터의 손에서 떼어 낸 손톱. 그녀는 여러 방법으로 빅터의 죽음을 애도하였다.<br><br><b>빅터<\/b>를 <b>방출<\/b>하는 데 걸리는 시간이 <b>33% 감소한다<\/b>.","r":0,"c":"ka","o":"K22"},{"id":"Addon_K22Power_20","ko":"핏빛 펜던트","en":"Iridescent Pendant","d":"유리처럼 생긴 펜던트는 안개가 만든 것이다. 펜던트에는 마들렌 데헤이스의 초상화가 그려져있다. 비록 그녀의 얼굴에서 뭔지 모를 불안감이 느껴졌지만...<br><br>휴면 상태의 <b>빅터<\/b>를 으스러뜨리면 <b>45초<\/b> 동안 <b>약점 노출<\/b> 상태에 빠진다.<br><br>부상 당한 생존자가 약점 노출 상태에 걸릴 경우, 기본 공격으로도 빈사 상태에 빠진다.","r":4,"c":"ka","o":"K22"},{"id":"Addon_K22Power_3","ko":"산유","en":"Soured Milk","d":"발효된 우유가 채워진 금속 병. 비명을 지르던 빅터를 조용하게 만드는 건 한 끼의 식사였다.<br><br><b>빅터<\/b>의 알림 범위가 <b>2미터 증가한다<\/b>.","r":0,"c":"ka","o":"K22"},{"id":"Addon_K22Power_4","ko":"장난감 검","en":"Toy Sword","d":"몇 인치밖에 되지 않는 아주 작은 장난감 검. 검을 쥐자 빅터의 마음에 폭력적인 열정이 일어났다.<br><br><b>덮치기<\/b> 충전 시간이 <b>10% 감소한다<\/b>.","r":0,"c":"ka","o":"K22"},{"id":"Addon_K22Power_5","ko":"고양이의 눈알","en":"Cat’s Eye","d":"굶주린 데헤이스 가족들이 먹은 고양이의 눈알. 빅터는 눈알을 가지고 놀기 위해, 엄마로부터 그것을 숨겼다.<br><br><b>덮치기<\/b> 기술이 완전히 충전되면 <b>빅터<\/b>는 침묵한다.","r":1,"c":"ka","o":"K22"},{"id":"Addon_K22Power_6","ko":"마들렌의 장갑","en":"Madeleine’s Glove","d":"한때 쌍둥이의 엄마가 소유했던 장감. 절망적이었던 그때, 빅터가 엿보지 않도록 그의 입에 물려졌다.<br><br><b>빅터<\/b>의 알림 범위가 <b>4미터 증가한다<\/b>.","r":1,"c":"ka","o":"K22"},{"id":"Addon_K22Power_7","ko":"핏빛 검은 후드","en":"Bloody Black Hood","d":"샬롯을 사냥한 남자들 중 한 명의 후드. 그리고 곧, 그는 먹잇감이 되었다.<br><br><b>샬롯<\/b>이 깨어나는 시간을 <b>0.5초 감소한다<\/b>.","r":1,"c":"ka","o":"K22"},{"id":"Addon_K22Power_8","ko":"의식용 나무 촛대","en":"Ceremonial Candelabrum","d":"빅터가 넘어뜨린 나무 촛대로, 납치범을 불태웠다. 그의 집념의 상징.<br><br>빅터가 휴면 상태일 때 <b>빅터<\/b>를 으스러뜨리는 데 걸리는 시간이 <b>0.2초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K22"},{"id":"Addon_K22Power_9","ko":"아기 치아","en":"Baby Teeth","d":"오래전 빅터가 잃어버린 치아 두 개. 매우 뾰족했다.<br><br>달라붙어있는 <b>빅터<\/b>를 으스러뜨리면 <b>30초<\/b> 동안 <b>실명<\/b>된다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.","r":1,"c":"ka","o":"K22"},{"id":"Addon_K24Power_1","ko":"손상된 주사기","en":"Damaged Syringe","d":"라쿤 시티를 집어삼킨 혼돈의 시기 동안 사용된 형편없는 의료 장비.생존자가 백신을 투약하는 데 걸리는 시간이 <b>5초<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K24"},{"id":"Addon_K24Power_10","ko":"타이런트 고어","en":"Tyrant Gore","d":"전투에서 사망한 T-002 타이런트에서 가져온 손상된 샘플. 극심한 화상의 흔적들이 있다.<b>촉수 일격<\/b>으로 좀비를 말살하면 돌연 변이율이 <b>75%<\/b> <b>증가한다<\/b>.좀비의 리스폰 시간이 <b>7.5초<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"K24"},{"id":"Addon_K24Power_11","ko":"세로토닌 주사기","en":"Serotonin Injector","d":"은신해야 할 때 사용자를 약간 진정시켜주는 호르몬.좀비를 말살하면 <b>15초<\/b> 동안 <b>감지 불가능<\/b>을 획득한다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":2,"c":"ka","o":"K24"},{"id":"Addon_K24Power_12","ko":"T-바이러스 샘플","en":"T-Virus Sample","d":"엄브렐러 코퍼레이션에 의해 개발된 T-바이러스의 샘플로, 연구 대상에게 심각한 돌연변이와 뇌손상을 유발한다.<b>촉수 일격<\/b>으로 좀비를 말살하면 돌연 변이율이 <b>100%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K24"},{"id":"Addon_K24Power_13","ko":"43번 식물 덩굴","en":"Plant 43 Vines","d":"T-바이러스에 감염된 식물의 뒤엉킨 잔해로, T-바이러스를 개발한 연구원 중 한 명을 사망에 이르게 하였다.생존자가 서플라이 박스를 여는 데 필요한 시간이 <b>4초<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K24"},{"id":"Addon_K24Power_14","ko":"릭커의 혀","en":"Licker Tongue","d":"만지는 모든 것을 쉽게 감싸는 끈적끈적한 혀.생존자는 오염된 후 <b>근육 손상<\/b>이 추가로 <b>1초<\/b> 증가한다.<br><br>근육 손상은 생존자의 이동 속도를 감소시킨다.","r":2,"c":"ka","o":"K24"},{"id":"Addon_K24Power_15","ko":"Ne-알파 기생체","en":"NE-α Parasite","d":"네메시스 T타입 개발에 사용된 기생체로, 숙주의 뇌를 장악할 수 있다.오염되면 <b>60초<\/b> 또는 생존자가 백신을 맞을 때까지 <b>인지 불가능<\/b>에 빠진다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":3,"c":"ka","o":"K24"},{"id":"Addon_K24Power_16","ko":"질의 샌드위치","en":"Jill’s Sandwich","d":"비참하게 찌그러지고 최근 치렀던 전투에서 묻은 피가 뚝뚝 떨어지고 있다. 하지만 그런 모습에도 불구하고 샌드위치의 냄새는 잊을 수 없을 만큼 맛있는 냄새가 난다.서플라이 박스를 잠금 해제한 후 생존자의 오라가 <b>12초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K24"},{"id":"Addon_K24Power_17","ko":"부서진 회복 동전","en":"Broken Recovery Coin","d":"월계관을 쓴 새가 그려진 동전. 반으로 쪼개졌다.희생제에서 서플라이 박스 <b>1<\/b>개를 제거한다.","r":3,"c":"ka","o":"K24"},{"id":"Addon_K24Power_18","ko":"감손된 잉크 리본","en":"Depleted Ink Ribbon","d":"이제 누가 그들을 구할 것인가? 좀비에게 활력을 주는 이 마른 잉크 리본에는 어떠한 특별한 점이 있다.좀비의 리스폰 시간이 <b>5초<\/b> <b>감소한다<\/b>.좀비의 이동 속도가 <b>50%<\/b> <b>증가한다<\/b>.모든 발전기가 수리된 후 소멸된 모든 좀비는 출구에 리스폰되어 나타난다.","r":3,"c":"ka","o":"K24"},{"id":"Addon_K24Power_19","ko":"조각난 S.T.A.R.S. 배지","en":"Shattered S.T.A.R.S. Badge","d":"라쿤 시티 희망의 상징이 완전히 파괴되었다.발전기가 수리된 후, <b>60초<\/b> 동안 좀비의 이동 속도가 <b>150%<\/b> <b>증가한다<\/b>.","r":4,"c":"ka","o":"K24"},{"id":"Addon_K24Power_2","ko":"브라이언의 창자","en":"Brian’s Intestine","d":"RPD 서장, 브라이언 아이언스의 소장. 좀비의 구미를 당긴다.좀비의 이동 속도가 <b>25%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K24"},{"id":"Addon_K24Power_20","ko":"핏빛 엄브렐러 배지","en":"Iridescent Umbrella Badge","d":"안개 자체에서 만들어진, 유리로 된 배지. 배지는 윤리적이고 인도적인 과학의 도를 넘은 회사를 나타낸다.백신을 사용한 생존자는 <b>60초<\/b> 동안 <b>약점 노출<\/b> 상태에 빠진다.<br><br>부상 당한 생존자가 약점 노출 상태에 걸릴 경우, 기본 공격으로도 빈사 상태에 빠진다.","r":4,"c":"ka","o":"K24"},{"id":"Addon_K24Power_3","ko":"방문객 손목 밴드","en":"Visitor Wristband","d":"시설 방문객을 위한 전자 엄브렐러 손목 밴드. 추적 장치로도 사용된다.좀비의 탐지 범위는 <b>2미터<\/b>, 시야각은 <b>10도<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K24"},{"id":"Addon_K24Power_4","ko":"S.T.A.R.S. 전장 매뉴얼","en":"S.T.A.R.S. Field Combat Manual","d":"편찬된 S.T.A.R.S. 근거리 전투 지식 매뉴얼. 크리스 레드필드에 의해 편집되었다.좀비가 생존자를 타격하면 <b>6초<\/b> 동안 해당 좀비의 오라가 노랗게 드러난다.","r":0,"c":"ka","o":"K24"},{"id":"Addon_K24Power_5","ko":"마빈의 피","en":"Marvin’s Blood","d":"라쿤 시티 경찰의 오염된 피.생존자가 <b>촉수 일격<\/b>으로 타격을 받으면, 변이율이 오염되지 않은 생존자의 경우 <b>16%<\/b>, 오염된 생존자의 경우 <b>50%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K24"},{"id":"Addon_K24Power_6","ko":"아드레날린 주사기","en":"Adrenaline Injector","d":"감각을 고조시키고 육체를 전투태세로 만드는 호르몬.생존자가 백신을 사용하면 살인마의 본능 시간이 <b>3초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K24"},{"id":"Addon_K24Power_7","ko":"마하일의 눈","en":"Mikhail’s Eye","d":"미하일에게 남은 것은 거의 없었지만, 그의 왼쪽 눈은 그를 죽게 한 폭발에서 살아남았다. 그리고 그 눈알은 좀비들에게 맛있는 음식으로 남았다.좀비의 이동 속도가 <b>35%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K24"},{"id":"Addon_K24Power_8","ko":"좀비의 심장","en":"Zombie Heart","d":"내장이 제거된 좀비의 심장. 바이러스가 가득하기 때문에 유해 폐기물로 간주되었다.<b>촉수 일격<\/b>으로 좀비를 말살하면 돌연 변이율이 <b>75%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K24"},{"id":"Addon_K24Power_9","ko":"관리자 손목 밴드","en":"Admin Wristband","d":"시설 관리자를 위한 전자 엄브렐러 손목 밴드. 보안 구역 접근 허가 및 추적 장치로도 사용된다.좀비의 탐지 범위는 <b>4미터<\/b>, 시야각은 <b>18도<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K24"},{"id":"Addon_K25Power_01","ko":"구부러진 못","en":"Bent Nail","d":"래리 코튼의 손 깊숙이 박혀있는 단순한 모양의 못. 상처는 겉으로 드러난 것이 다였지만, 그후 끔찍한 일련의 사건들이 발생했다.<br><br>악령의 체인으로 생존자를 실명시키면 블러드포인트 <b>100%<\/b> 획득한다.악령의 체인으로 생존자를 타격하면 체인 <b>1개<\/b>가 추가로 생성된다.","r":0,"c":"ka","o":"K25"},{"id":"Addon_K25Power_02","ko":"활기 넘치는 귀뚜라미","en":"Lively Crickets","d":"미스터리한 떠돌이에게 잡아먹히는 것을 아주 아슬아슬하게 피한 곤충들.<br><br>악령의 체인 선회율이 <b>10%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K25"},{"id":"Addon_K25Power_03","ko":"타오르는 양초","en":"Burning Candle","d":"프랭크 코튼이 죽음의 소환식에서 밝힌 촛불.<br><br>체인 사냥을 활성화하는 데 걸리는 시간이 <b>3초<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K25"},{"id":"Addon_K25Power_04","ko":"가죽 조각","en":"Leather Strip","d":"수도사의 수도복에서 찢어진 가죽 조각으로, 노출된 살점을 절단할 수 있다.<br><br>악령의 체인을 개시한 후 <b>고통의 소환<\/b> 재사용 대기 시간이 <b>3% 줄어든다<\/b>.","r":0,"c":"ka","o":"K25"},{"id":"Addon_K25Power_05","ko":"꿈틀거리는 구더기","en":"Wriggling Maggots","d":"코튼 가에 숨겨져 있던 시체 입에서 쏟아져 나온 유충.<br><br>악령의 체인 선회율이 <b>15%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K25"},{"id":"Addon_K25Power_06","ko":"상한 식사","en":"Spoiled Meal","d":"바퀴벌레가 즐기는 곰팡이 더미. 프랭크 코튼의 미스터리한 실종에 대한 실마리일 수도...<br><br>악령의 체인 최대 이동 거리가 <b>2미터<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K25"},{"id":"Addon_K25Power_07","ko":"꼬챙이에 찔린 쥐","en":"Skewered Rat","d":"코튼 가의 쥐 문제에 대한 조잡한 해결책.<br><br>악령의 체인을 개시한 후 <b>고통의 소환<\/b> 재사용 대기 시간이 <b>9% 줄어든다<\/b>.","r":1,"c":"ka","o":"K25"},{"id":"Addon_K25Power_08","ko":"깜빡거리는 텔레비전","en":"Flickering Television","d":"수도사가 도착하자마자 이상하게 행동하는 텔레비전.<br><br>관문의 최대 영역 범위가 <b>4미터<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K25"},{"id":"Addon_K25Power_09","ko":"액체화된 고어","en":"Liquified Gore","d":"수도사들을 소환한 결과. 이것이 인간의 어느 부위였는지 알 수 없을 정도다.<br><br>생존자가 비탄의 배열 장치를 푸는 데 걸리는 시간이 <b>1초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K25"},{"id":"Addon_K25Power_10","ko":"래리의 피","en":"Larry’s Blood","d":"래리 코튼의 피, 그의 형제 프랭크의 일부를 부활시켰다.<br><br>악령의 체인 최대 이동 거리가 <b>4미터<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K25"},{"id":"Addon_K25Power_11","ko":"고문 기둥","en":"Torture Pillar","d":"과거의 희생자들의 선혈로 뒤덮인 달랑거리는 조각.<br><br>체인 사냥 활성화 시간이 <b>6초<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"K25"},{"id":"Addon_K25Power_12","ko":"프랭크의 심장","en":"Frank’s Heart","d":"프랭크의 뛰는 심장은 형제의 피로 생명을 얻었다.<br><br>관문의 최대 영역 범위가 <b>8미터<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K25"},{"id":"Addon_K25Power_13","ko":"래리의 유골","en":"Larry’s Remains","d":"래리 코튼의 유골, 걸쭉하고 끈적끈적한 피로 덮여있다.<br><br>생존자가 비탄의 배열 장치를 푸는 데 걸리는 시간이 <b>2초<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K25"},{"id":"Addon_K25Power_14","ko":"프랭크의 일부","en":"Slice of Frank","d":"수도사의 손에 고문당한 프랭크의 얼굴 살점 조각.<br><br>비탄의 배열 장치를 소지한 생존자는 <b>탈진<\/b> 상태 이상에 빠진다.<br><br>생존자는 탈진으로 탈진에 영향받는 기술을 발동할 수 없다.","r":2,"c":"ka","o":"K25"},{"id":"Addon_K25Power_15","ko":"기름 낀 검은 렌즈","en":"Greasy Black Lens","d":"얼굴과 목의 출렁이는 살집이 처질대로 처진 뚱뚱한 수도사의 선글라스에서 나온 렌즈.<br><br>악령의 체인에 의해 타격을 입은 생존자의 위치가 <b>6초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K25"},{"id":"Addon_K25Power_16","ko":"본연의 고통","en":"Original Pain","d":"핀헤드의 두개골에 처음으로 꽂힌 못. 쾌락과 고통.<br><br>생존자가 악령의 체인에서 해방되면, 오라가 <b>8초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K25"},{"id":"Addon_K25Power_17","ko":"살을 뚫은 철사","en":"Impaling Wire","d":"철사는 수도사의 볼 사이를 뚫었고 그녀의 목에는 벌어진 상처가 적나라하게 드러나있다.<br><br>생존자가 주변 환경을 이용하여 체인을 끊으려 시도하면 또 다른 체인이 생존자들을 겨냥하게 된다.","r":3,"c":"ka","o":"K25"},{"id":"Addon_K25Power_18","ko":"채터러의 치아","en":"Chatterer’s Tooth","d":"끝없이 수다를 떠는 수도사의 조각. 그의 턱에서 떨어진 이빨이 마침내 조용해졌다.<br><br>비탄의 배열 장치를 드러낸다.비탄의 배열 장치를 주우면 체인 사냥이 비활성화된다.비탄의 배열 장치를 주운 후, <b>25초<\/b> 동안 <b>감지 불가능<\/b> 상태 이상을 얻는다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":3,"c":"ka","o":"K25"},{"id":"Addon_K25Power_19","ko":"기술자의 이빨","en":"Engineer’s Fang","d":"수도사와 전갈과 닮은 짐승의 날카로운 이빨이 그들의 음침한 사업에 수도사를 동반하는 것으로 알려졌다.<br><br>악령의 체인은 건강한 상태의 생존자에게 부상을 입히지만 속박하거나 추가 체인을 생성하지는 않는다.악령의 체인으로 건강한 상태의 생존자를 타격한 후 관문을 닫을 시간이 <b>50%<\/b> <b>늘어난다<\/b>.악령의 체인으로 부상 당한 생존자를 공격하면 추가 체인이 단 1개만 생성된다.","r":4,"c":"ka","o":"K25"},{"id":"Addon_K25Power_20","ko":"핏빛 비탄의 배열 장치","en":"Iridescent Lament Configuration","d":"안개 자체에서 만들어진 유리 같은 퍼즐 상자. 이 복제품은 본래의 퍼즐 상자와 다소 다르지만 새로운 힘을 선사한다.<br><br>체인 사냥이 활성화되면 비탄의 배열 장치에서 <b>24미터<\/b> 보다 멀리 떨어져 있는 생존자에게는 배열 장치의 오라가 보이지 않는다.","r":4,"c":"ka","o":"K25"},{"id":"Addon_K26Power_01","ko":"유화 물감","en":"Oil Paints","d":"조금밖에 남지 않은 검정과 회색 물감 한 방울로 까르미나는 광활한 풍경을 그릴 수 있었다.<br><br><b>절망의 까마귀<\/b> 살인마의 본능 탐지 범위가 <b>1.5미터<\/b> <b>증가한다<\/b>.<br><br>살인마의 본능은 간헐적으로 생존자의 위치를 드러낸다.","r":0,"c":"ka","o":"K26"},{"id":"Addon_K26Power_02","ko":"강렬한 부고 기사","en":"Vibrant Obituary","d":"선명하고 눈에 띄는 색상으로 인쇄된 신문 조각. 아무래도 비극은 일상인 듯하다.<br><br><b>절망의 까마귀<\/b> 살인마의 본능이 생존자를 드러내는 시간이 <b>3초<\/b> <b>증가한다<\/b>.<br><br>살인마의 본능은 간헐적으로 생존자의 위치를 드러낸다.","r":0,"c":"ka","o":"K26"},{"id":"Addon_K26Power_03","ko":"걸쭉한 타르","en":"Thick Tar","d":"까르미나가 실험용으로 사용한 끈적거리는 점성이 있는 침전물. 한번 피부에 붙으면 떼어내기가 매우 어렵다.<br><br><b>절망의 까마귀<\/b> 무리를 쫓아 버리는 데 걸리는 시간이 <b>0.5초<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K26"},{"id":"Addon_K26Power_04","ko":"옥수수","en":"Choclo Corn","d":"남미에서 흔히 발견할 수 있는 옥수수 종류. 까마귀 간식으로는 몇 알로도 충분하다.<br><br><b>절망의 까마귀<\/b> 무리가 해체되기 전 유휴 상태의 시간이<b>2초<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K26"},{"id":"Addon_K26Power_05","ko":"마음대로 그리기","en":"Automatic Drawing","d":"까르미나가 계획도 없이 그린 실험적인 그림. 생각하지 말고 행동하라.<br><br><b>절망의 까마귀<\/b> 무리가 정지 상태에서 해체된 후 <b>고통의 새 재사용 대기 시간<\/b>이 <b>1.5초 감소한다<\/b>.","r":1,"c":"ka","o":"K26"},{"id":"Addon_K26Power_06","ko":"썩어가는 시체","en":"Festering Carrion","d":"고기와 내장 더미로 구역질이 나지만, 배고픈 까마귀들이 맛을 보고 싶어 안달이 났다.<br><br><b>절망의 까마귀<\/b> 무리가 날아간 후 <b>고통의 새<\/b> 재사용 대기 시간이 <b>0.5초 감소한다<\/b>.","r":1,"c":"ka","o":"K26"},{"id":"Addon_K26Power_07","ko":"벨벳 천","en":"Velvet Fabric","d":"까르미나가 미술 프로젝트에 사용한 것으로 눈에 띄는 빨간색의 천이다. 천의 밝기는 검은 깃털과 대조된다.<br><br>생존자가 <b>절망의 까마귀<\/b> 무리를 쫓아내려고 할 때, 무리의 오라가 추가로 <b>1.5초<\/b> 더 오래 남는다.","r":1,"c":"ka","o":"K26"},{"id":"Addon_K26Power_08","ko":"까마귀 정물화","en":"Still Life Crow","d":"죽은 까마귀를 그린 펜화. 검은 선 하나하나에서 까마귀 죽음에 대한 까르미나의 슬픔이 느껴진다.<br><br><b>절망의 까마귀<\/b> 무리가 해체되기 전 유휴 상태의 시간이 <b>4초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K26"},{"id":"Addon_K26Power_09","ko":"무제의 고통","en":"Untitled Agony","d":"마티아스의 죽음 이후 검은색 물감이 쏟아진 캔버스. 무겁고 지독한 슬픔을 발산한다.<b>절망의 까마귀<\/b>가 무리 지어 생존자를 따라다니면, <b>1.5초<\/b> 동안 <b>15%의 근육 손상<\/b>을 일으킨다.<br><br>근육 손상은 생존자의 이동 속도를 감소시킨다.","r":1,"c":"ka","o":"K26"},{"id":"Addon_K26Power_10","ko":"목탄 연필","en":"Charcoal Stick","d":"모든 것을 감춰버리는 목탄 연필.<br><br>비행 중에는 <b>절망의 까마귀<\/b> 오라가 더 이상 드러나지 않는다.소환됐을 때, <b>절망의 까마귀<\/b> 오라가 <b>0.5초<\/b> 동안 드러난다.","r":2,"c":"ka","o":"K26"},{"id":"Addon_K26Power_11","ko":"가장 어두운 잉크","en":"Darkest Ink","d":"이상한 잉크, 주변에 모든 빛을 끌어당기는 것 같이 매우 처량하고 어둡다.<br><br><b>절망의 까마귀<\/b>가 무리 지어 생존자를 따라다니면 <b>실명<\/b> 상태에 빠진다. 효과는 생존자가 <b>절망의 까마귀<\/b>를 쫓아 낸 후 <b>15초<\/b> 동안 지속된다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.","r":2,"c":"ka","o":"K26"},{"id":"Addon_K26Power_12","ko":"슬픔이여, 사랑이여","en":"O Grief, O Lover","d":"투신자살 다리로 가기 전, 까르미나가 그린 추상 펜화.<br><br><b>절망의 까마귀<\/b>가 무리 지어 생존자를 따라다니면, <b>탈진<\/b> 상태 이상에 빠진다.<br><br>생존자는 탈진으로 특정 기술을 발동할 수 없다.","r":2,"c":"ka","o":"K26"},{"id":"Addon_K26Power_13","ko":"가시돋친 둥지","en":"Thorny Nest","d":"까르미나의 집 근처에 비어있던 둥지. 날카로운 가시가 박혀 있다.<br><br><b>절망의 까마귀<\/b>에게 당한 생존자는 <b>70초<\/b> 동안 <b>출혈<\/b>과 <b>깊은 상흔<\/b> 상태 이상에 빠진다.<br><br>출혈은 부상당한 생존자가 핏자국을 남길 확률을 증가시킨 출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"K26"},{"id":"Addon_K26Power_14","ko":"실버벨","en":"Silver Bell","d":"까마귀가 좋아하는 반짝이는 장신구. 종이 울리는 소리는 까르미나를 제외한 모든 이들의 주의를 산만하게 했다.<br><br><b>절망의 까마귀<\/b>가 무리 지어 생존자를 따라다니면 <b>인지 불가능<\/b> 상태 이상에 걸린다.<br><br>인지 불가능은 생존자가 듣고 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":2,"c":"ka","o":"K26"},{"id":"Addon_K26Power_15","ko":"마티아스의 아기 신발","en":"Matias' Baby Shoes","d":"마티아스가 언제나 까르미나 자신과 함께 하며 그녀를 지켜보고 있다고 느끼게 하는 비통한 기억.<br><br><b>절망의 까마귀<\/b>가 유휴 상태에 있을 때, 주변 <b>5미터<\/b> 방면에 있는 생존자들의 오라가 <b>3초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K26"},{"id":"Addon_K26Power_16","ko":"잘린 혀","en":"Severed Tongue","d":"까르미나가 죽음을 맞이하기 직전에 잘린 그녀의 혀. 그 광경은 그녀뿐만 아니라, 그녀의 까마귀들도 분노에 사로잡히게 만들었다.<br><br>절망의 까마귀 무리가 날아간 후 예술가의 이동 속도가 느려지는 시간이 <b>0.5초<\/b> <b>줄어든다<\/b>.","r":3,"c":"ka","o":"K26"},{"id":"Addon_K26Power_17","ko":"부패의 정원","en":"Garden of Rot","d":"마음속에서부터 썩어 자라난 자신의 어두움을 묘사한 누드 초상화.<br><br>생존자가 <b>절망의 까마귀<\/b>에 의해 영향을 받으면 쫓아내기 액션이 완료되며, 생존자는 <b>4초<\/b> 동안 <b>약점 노출<\/b>에 빠진다.<br><br>약점 노출 상태에 빠진 생존자는 부상을 입지 않은 상태에서도 기본 공격으로 빈사 상태에 빠진다.","r":4,"c":"ka","o":"K26"},{"id":"Addon_K26Power_18","ko":"잉크 에그","en":"Ink Egg","d":"잉크가 뭉쳐 이상한 달걀처럼 보인다.<br><br><b>절망의 까마귀<\/b> 최대 용량이 <b>1개<\/b> <b>증가한다<\/b>.<b>절망의 까마귀<\/b> 무리가 해체되기 전 유휴 상태의 시간이 <b>2초<\/b> <b>감소한다<\/b>.","r":3,"c":"ka","o":"K26"},{"id":"Addon_K26Power_19","ko":"잘린 손","en":"Severed Hands","d":"까르미나의 잘린 손으로 그녀가 죽음을 맞이하기 직전에 잘렸다. 그 광경은 그녀와 그녀의 보호자로 하여금 순수한 분노를 불러일으켰다.<br><br><b>절망의 까마귀<\/b>에 의해 둘러싸인 생존자로부터 <b>3미터<\/b> 내에 모든 생존자 역시 둘러싸이게 된다.","r":3,"c":"ka","o":"K26"},{"id":"Addon_K26Power_20","ko":"핏빛 깃털","en":"Iridescent Feather","d":"안개 자체에서 만들어진 유리 같은 깃털. 단순하지만 까르미나를 돌보는 자들의 상징이다.<br><br><b>고통의 새<\/b>가 재사용 대기 시간을 가지며 그녀에게 <b>절망의 까마귀<\/b>가 없을 때 <b>예술가<\/b>는 <b>감지 불가능<\/b> 상태 이상을 얻는다.<b>절망의 까마귀<\/b> 최대 용량이 <b>1개<\/b> <b>감소한다<\/b>.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":4,"c":"ka","o":"K26"},{"id":"Addon_K28_01","ko":"나무판자","en":"Wooden Plank","d":"오토 스탬퍼가 자신의 계획을 방해하는 기자를 제물로 바친 무대에서 찢어진 나무판자.<br><br>생존자가 갈고리에 걸리면 <b>나이트폴<\/b> 차지가 <b>25%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K28"},{"id":"Addon_K28_02","ko":"카페인 약","en":"Caffeine Tablets","d":"스탬퍼의 추종자는 잠에 들지 말라는 명령을 받았다. 명령을 따르지 않으면 드루아니의 분노를 불러온다고 믿었다. 최악에 상황에 이른 그는 본국에서 마약을 들여왔다.<br><br><b>으스름<\/b> 및 순간 이동 차지 중 잠겨 있는 캐비닛의 오라가 노란색으로 드러난다.","r":0,"c":"ka","o":"K28"},{"id":"Addon_K28_03","ko":"절구와 절구 공이","en":"Mortar and Pestle","d":"세상과 현대 약과 동떨어진 그곳에서 스탬퍼의 추종자들은 섬에 있는 약초를 임시방편으로 사용해야 했다.<br><br><b>드레지<\/b>는 잔여물이 놓였을 때의 방향 대신 순간 이동이 활성화되었을 때와 같은 방향을 바라보는 잔류물에서 나올 것이다.","r":0,"c":"ka","o":"K28"},{"id":"Addon_K28_04","ko":"추종자들의 고깔","en":"Follower’s Cowl","d":"그들은 그 고깔이 그들의 깨달음을 증명한다고 믿었지만, 고깔은 그들을 어둠 속에 가두었을 뿐이다.<br><br>잔류물로 순간 이동하면, <b>나이트폴<\/b> 상태가 아니더라도 살인마의 본능이 활성화된다.","r":0,"c":"ka","o":"K28"},{"id":"Addon_K28_05","ko":"불타버린 편지","en":"Burnt Letters","d":"일부 추종자들은 본국으로 편지를 보내려는 시도를 했다. 그러나 스탬프는 그 누구도 외부 세계와 연결되지 못하도록 하였다.<br><br>생존자에게 부상을 입히면, <b>나이트폴<\/b> 차지가 <b>25%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K28"},{"id":"Addon_K28_06","ko":"방향제","en":"Air Freshener","d":"그녀의 부모님의 시신을 발견된 후, 경찰이 찾아준 부모님의 유류품. 해디는 자신이 왜 그것들을 지금까지 보관했는지 알 수 없었다.<br><br>순간 이동 시 <b>능력 토큰<\/b>을 <b>1개 더 허용한다<\/b>.","r":1,"c":"ka","o":"K28"},{"id":"Addon_K28_07","ko":"해디의 달력","en":"Haddie’s Calendar","d":"그녀는 부모님이 자신을 인도에 데려가 줄 날을 고대하며 달력에 X표를 그렸다. 그러나 끔찍한 사고가 일어났고 그녀는 달력을 버렸다.<br><br>잠긴 캐비닛 탈출 속도가 <b>0.4초<\/b> <b>줄어든다<\/b>.","r":1,"c":"ka","o":"K28"},{"id":"Addon_K28_08","ko":"떨어진 지붕널","en":"Fallen Shingle","d":"오토마리안들이 드레지에게 포함된 후, 대저택은 황폐해졌다.<br><br><b>어둠의 지배<\/b>를 사용하면, <b>나이트폴<\/b> 차지 속도가 <b>1초당 15%<\/b> 증가한다.","r":1,"c":"ka","o":"K28"},{"id":"Addon_K28_09","ko":"부정한 사상가의 두개골","en":"Malthinker’s Skull","d":"공동체에 부정함을 불러온 사람들이 가끔씩 아무 이유 없이 사라지곤 했다. 그들의 유골은 발견되지 않았다... 드레지가 그들을 데려오기 전까지는.<br><br>부상 당한 생존자가 있을 때 <b>나이트폴<\/b> 차지 속도가 <b>25%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K28"},{"id":"Addon_K28_10","ko":"걱정의 돌","en":"Worry Stone","d":"오토마리안들은 오직 긍정적인 생각만 해야 했다. 일부는 주머니에 이 돌을 넣고 부정한 생각이 들 때마다 돌을 문질렀다.<br><br>캐비닛을 잠그면, 생존자의 오라가 <b>6초<\/b> 동안 드러난다.","r":2,"c":"ka","o":"K28"},{"id":"Addon_K28_11","ko":"오토마리안의 글","en":"Ottomarian Writing","d":"추종자들은 오직 오토 스탬퍼의 격언만을 읽을 수 있다. 그것은 부정적인 사상이나 언행을 매도하는 데 도움이 됐다.<br><br><b>나이트폴<\/b>가 활성화되지 않은 상태에서 <b>순간 이동<\/b>의 재사용 대기 시간이 <b>2초<\/b> <b>줄어든다<\/b>.","r":2,"c":"ka","o":"K28"},{"id":"Addon_K28_12","ko":"부서진 인형","en":"Broken Doll","d":"추종자들은 자신의 가족들을 유토피아로 데려왔다. 그들 중 누구도 살아남지 못했다.<br><br><b>나이트폴<\/b>의 지속 시간이 <b>20초<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K28"},{"id":"Addon_K28_13","ko":"전투모","en":"War Helmet","d":"알프스에서 오버랩을 조사하는 도중, 그녀는 버려진 전생 벙커를 발견한다. 오버랩이 그녀를 거의 집어삼켰을 뻔한 후, 그녀는 이 헬멧을 챙겼다.<br><br><b>살인마의 본능<\/b> 기간이 <b>1.5초<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K28"},{"id":"Addon_K28_14","ko":"파괴된 베개","en":"Destroyed Pillow","d":"수면이 허락되지 않았는 기간 동안, 오토마리안들 중 상위 리더들은 잠에 들지 않기 위해 수면 용품을 갈가리 찢어놓았다.<br><br><b>나이트폴<\/b> 동안 <b>순간 이동<\/b>의 재사용 대기 시간이 <b>2.5초<\/b> <b>줄어든다<\/b>.","r":2,"c":"ka","o":"K28"},{"id":"Addon_K28_15","ko":"밭 가는 칼날","en":"Tilling Blade","d":"자급자족의 섬. 추종자들은 굳은 땅을 갈아 비옥한 땅으로 만들었고, 따뜻한 계절에는 그곳에 작물을 심었다.<br><br>생존자가 <b>나이트폴<\/b>이 활성화된 동안, 건강한 상태에서 부상을 당하면, <b>80초<\/b> 동안, <b>실명, 출혈<\/b>, <b>깊은 상흔<\/b> 상태 효과를 입는다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":3,"c":"ka","o":"K28"},{"id":"Addon_K28_16","ko":"배 열쇠","en":"Boat Key","d":"섬을 오가는 배는 단 한 척이었고, 배의 열쇠는 탈주자들이 도망치지 못하도록 긴밀한 곳에 숨겨져있었다.<br><br><b>나이트폴<\/b>가 활성화되지 않은 상태에서 <b>순간 이동<\/b> 속도가 <b>16%<\/b> <b>증가한다<\/b>.모든 출구에 전원이 들어오면, 모든 활성화된 자물쇠는 즉시 부서진다.","r":3,"c":"ka","o":"K28"},{"id":"Addon_K28_17","ko":"현장 녹화","en":"Field Recorder","d":"해디는 오버랩 주변에서 경험을 모두 다큐멘터리화했다. 자신이 보고 느낀 것을 세상뿐만 아니라 자기 자신에게도 증명하기 위해.<br><br>희생제 시작과 동시에 <b>나이트폴<\/b>이 활성화된다.마지막 발전기가 수리되면 <b>나이트폴<\/b>이 자동으로 발동된다. 잔류물을 건드리는 생존자는 <b>15초<\/b> 동안 <b>탈진<\/b> 상태에 빠진다.<br><br>생존자는 탈진으로 특정 기술을 발동할 수 없다.","r":3,"c":"ka","o":"K28"},{"id":"Addon_K28_18","ko":"소형 마이크","en":"Lavalier Microphone","d":"그녀는 자신이 엄청난 스트레스에 쌓여 가장 내밀한 감정을 느낄 때를 기록하기 위해 늘 소형 마이크를 곁에 두었다.<br><br>마지막 <b>순간 이동<\/b> 토큰을 사용하면, 생존자의 오라가 <b>3초<\/b> 동안 드러난다.<b>순간 이동<\/b>을 사용하여 캐비닛에 들어가면 생존자로부터 <b>6미터<\/b> 내 캐비닛들이 열렸다가 큰 소리를 내면 닫힌다.","r":3,"c":"ka","o":"K28"},{"id":"Addon_K28_19","ko":"희생의 칼","en":"Sacrificial Knife","d":"기자가 오토마리안들에게 오토의 진정한 과제에 대해 경고하려 하자, 오토는 그녀의 목을 베어 반대자들에게 본보기를 보였다.<br><br><b>나이트폴<\/b> 활성화 중 캐비닛을 나가면 살인마로부터 <b>16미터<\/b> 내에 있는 뛰어넘을 모든 것들의 위치가 생존자에게 <b>5초<\/b> 동안 차단된다.","r":4,"c":"ka","o":"K28"},{"id":"Addon_K28_20","ko":"핏빛 나무판자","en":"Iridescent Wooden Plank","d":"기자의 피가 나무판자를 물들이자, 모든 것이 드레지의 출현을 위해 준비되었다.<br><br><b>나이트폴<\/b>의 마지막 <b>12초<\/b> 동안 생존자는 <b>약점 노출<\/b> 상태 이상에 걸린다.<br><br>약점 노출 상태에 빠진 생존자는 부상을 입지 않은 상태에서도 기본 공격으로 빈사 상태에 빠진다.","r":4,"c":"ka","o":"K28"},{"id":"Addon_K29_01","ko":"비단벌레","en":"Jewel Beetle","d":"아름답고 귀중한 곤충. 잡기는 어렵지만, 꽤 가치가 있다.<br><br>악성 속박으로 생존자를 잡았을 때 도약하는 거리가 <b>50%<\/b> <b>감소한다<\/b>.<b>악성 속박<\/b> 스코어 이벤트에서 <b>100%<\/b>의 추가 블러드포인트를 획득한다.","r":0,"c":"ka","o":"K29"},{"id":"Addon_K29_02","ko":"녹색 약초","en":"Green Herb","d":"원기를 회복시켜주는 것으로 잘 알려진 평범한 식물.<br><br><b>악성 속박<\/b> 동안 생존자를 잡을 경우, 감염률이 <b>30%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"K29"},{"id":"Addon_K29_03","ko":"유니콘 메달","en":"Unicorn Medallion","d":"장엄한 유니콘을 묘사한 오래된 동상. 수년 동안 저장 창고에 놓아져있었다.<br><br>초기 <b>악성 속박<\/b> 거리가 <b>20%<\/b> <b>증가한다<\/b>.2차 <b>악성 속박<\/b> 거리가 <b>20%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K29"},{"id":"Addon_K29_04","ko":"R.P.D. 어깨 무전기","en":"R.P.D. Shoulder Walkie","d":"소통 능력을 잃은 라쿤 시티의 경찰관들은 고립되었으며, 그들에겐 가능성이 없다.<br><br>초기 <b>악성 속박<\/b> 거리가 <b>20%<\/b> <b>감소한다<\/b>.2차 <b>악성 속박<\/b> 거리가 <b>20%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K29"},{"id":"Addon_K29_05","ko":"느슨한 크랭크","en":"Loose Crank","d":"도구로 크랭크 밖에 사용하지 않은 사람에겐 온 세상이 크랭크처럼 생긴 구멍일 것이다.1차와 2차 <b>악성 속박<\/b> 사이의 이동 속도의 <b>15%<\/b>로 <b>증가한다<\/b>.","r":1,"c":"ka","o":"K29"},{"id":"Addon_K29_06","ko":"가죽 장갑","en":"Leather Gloves","d":"냉정하고 계산적인 책략가의 장갑. 그들은 냉철하고 전문적인 분위기를 풍긴다.<b>악성 속박<\/b>를 다시 차지하는 시간이 <b>8%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K29"},{"id":"Addon_K29_07","ko":"사자 메달","en":"Lion Medallion","d":"용맹한 사자를 묘사한 오래된 동상. 라쿤 경찰서가 아직 미술관이었을 때 만들어졌다.생존자가 던져지는 거리가 <b>30%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K29"},{"id":"Addon_K29_08","ko":"황금잔","en":"Chalice (Gold)","d":"하지를 축하하기 위해 사용된 순금의 잔.악성 속박으로 생존자를 잡았을 때 도약하는 거리가 <b>50%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K29"},{"id":"Addon_K29_09","ko":"확성기","en":"Bullhorn","d":"기기에서 터져 나온 명령은 누군가를 짜증 나게 했고 누군가를 혼란스럽게 했다.<b>응급 처치 스프레이<\/b>를 사용한 생존자 <b>30초<\/b> 동안 <b>인지 불가능<\/b> 상태 이상에 걸린다.<br><br><b>인지 불가능<\/b>은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":1,"c":"ka","o":"K29"},{"id":"Addon_K29_10","ko":"휴대용 금고","en":"Portable Safe","d":"복잡한 암호가 걸려있는 작은 용기.<b>악성 속박<\/b>으로 부상을 당한 생존자는 완전히 치료될 때까지 <b>출혈<\/b> 상태 이상에 걸린다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"K29"},{"id":"Addon_K29_11","ko":"빨간 약초","en":"Red Herb","d":"시약으로 작용하여 결합 효과를 강화한다.생존자가 <b>응급 처치 스프레이<\/b>를 사용하는 데 걸리는 시간이 <b>2초<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K29"},{"id":"Addon_K29_12","ko":"여인 메달","en":"Maiden Medallion","d":"여인을 묘사한 상. 이것의 목적은 오랫동안 알려지지 않은 채로 남아있다.생존자가 완전히 감염되면, 생존자들은 <b>60<\/b>초 동안 <b>실명<\/b> 상태 이상에 빠진다.<br><br><b>실명<\/b>된 생존자는 오라를 볼 수 없게 된다.","r":2,"c":"ka","o":"K29"},{"id":"Addon_K29_13","ko":"화상 회의 장비","en":"Video Conference Device","d":"많은 복잡한 음모들이 이것과 같은 장치에 의해 조직되었다.<b>감염<\/b>의 패시브 증가률이 <b>30%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K29"},{"id":"Addon_K29_14","ko":"계란 (황금)","en":"Egg (Gold)","d":"매우 탐나는 음식. 현금 가치는 재생 효과 다음으로 높다.추가 <b>악성 속박<\/b>을 사용할 수 있는 시간이 <b>20%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K29"},{"id":"Addon_K29_15","ko":"검은 선글라스","en":"Dark Sunglasses","d":"AR로 강화된 안경은 착용자에게 전장에서 매우 귀중한 이점을 부여한다.생존자 한 명이 <b>우로보로스 감염<\/b>에 100% 감염되면, <b>20초<\/b> 동안 <b>감지 불가능<\/b> 상태 이상을 얻는다.<br><br><b>감지 불가능<\/b>은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":3,"c":"ka","o":"K29"},{"id":"Addon_K29_16","ko":"헬리콥터 조종간","en":"Helicopter Stick","d":"헬리콥터 추락의 파편. 웨스커가 연루되었을 때 헬리콥터 조종사의 직업보다 더 위험한 직업은 거의 없다.생존자가 <b>응급 처치 스프레이<\/b>를 사용하면, <b>8초<\/b> 동안 오라가 드러난다.","r":3,"c":"ka","o":"K29"},{"id":"Addon_K29_17","ko":"우로보로스 덩굴손","en":"Uroboros Tendril","d":"수십 년간의 생물 유기 화학 무기에 대한 연구 결과. 전 세계를 집어삼킬 때까지 연구는 멈추지 않을 것이다.<b>악성 속박<\/b>을 차지하는 동안 이동 속도가 <b>5%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K29"},{"id":"Addon_K29_18","ko":"우로보로스 바이러스","en":"Uroboros Virus","d":"어떤 사람들에게는, 힘과 저항력이 상호 절충할 가치가 있었다.생존자의 감염도가 100%에 도달하면, <b>4초<\/b> 동안 오라가 드러난다.","r":3,"c":"ka","o":"K29"},{"id":"Addon_K29_19","ko":"연구소 사진","en":"Lab Photo","d":"웨스커는 엄브렐러의 생물 무기를 위한 실험 대상이 될 정도로 참 연구가였다.<b>악성 속박<\/b>을 사용해 판자와 부서지기 쉬운 문에 특수 파괴를 수행할 수 있다.<b>악성 속박<\/b>을 사용하는 동안 판자에 특수 뛰어넘기를 수행할 수 없다.","r":4,"c":"ka","o":"K29"},{"id":"Addon_K29_20","ko":"핏빛 우로보로스 유리병","en":"Iridescent Uroboros Vial","d":"완벽한 생물 무기. 수십 년간 연구의 결과다.생존자들은 우로보로스에 감염된 채 희생제를 시작한다.생존자들은 감염 최대치에 도달하면 <b>30초<\/b> 동안 <b>약점 노출<\/b> 상태 효과에 걸린다.<br><br>부상 당한 생존자가 <b>약점 노출<\/b> 상태에 걸릴 경우, 기본 공격으로도 빈사 상태에 빠진다.","r":4,"c":"ka","o":"K29"},{"id":"Addon_K30_01","ko":"투박한 덩어리","en":"Gritty Lump","d":"대부분의 나날 동안 바위처럼 단단하고 밀도가 높은 빵 한 덩어리가 그들의 배를 채웠고, 그들이 진정으로 악랄한 행동을 할 수 있는 에너지를 주었다.<br><br>순찰을 도는 동안 경비대의 이동 속도가 <b>9%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K30"},{"id":"Addon_K30_02","ko":"영역의 지도","en":"Map of the Realm","d":"이 독특한 가죽 지도를 손에 넣는 것은 쉽지 않다. 그러나 돈으로 주고 살 수 없을 땐, 힘으로 빼앗는 것도 방법이다.<br><br>경비대가 순찰을 돌때 탐지 범위가 <b>2미터<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K30"},{"id":"Addon_K30_03","ko":"낡은 타바드","en":"Tattered Tabard","d":"무거운 천으로 뒤덮여 인간도 자연도 일단 목표를 잡으면 막을 수 없었다.<br><br>모든 경비대의 순찰 시간이 <b>8초<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K30"},{"id":"Addon_K30_04","ko":"약탈된 벌꿀 술","en":"Pillaged Mead","d":"희생자로부터 빼앗은 음료는 달콤했지만, 그런 경망한 언동은 삶을 단축할 뿐이었다.<br><br>경비대는 <b>10%<\/b> 더 빠르게 판자와 부서지기 쉬운 문에 특수 파괴를 수행하고 발전기에 손상을 가한다.","r":0,"c":"ka","o":"K30"},{"id":"Addon_K30_05","ko":"말린 말고기","en":"Dried Horsemeat","d":"장기 캠페인은 보충병역을 필요로 했고, 쓰러진 적들의 말은 농장에서의 신선한 식량 못지않았다.<br><br>경비대의 생존자 사냥 시간이 <b>4초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K30"},{"id":"Addon_K30_06","ko":"큰도끼의 도끼날","en":"Battleaxe Head","d":"샌더 롤트는 타워의 대장이였으며, 모습과 품격 모두 무시무시했다.<br><br>사형집행자 소환 후 재사용 대기 시간이 <b>20%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K30"},{"id":"Addon_K30_07","ko":"벼려진 칼날","en":"Treated Blade","d":"두르코스 말레섹은 그림자를 고수했고, 효율적인 살육자였다.<br><br>암살자 소환 후 재사용 대기 시간이 <b>20%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K30"},{"id":"Addon_K30_08","ko":"차가운 강철 수갑","en":"Cold Steel Manacles","d":"알레한드로 산티아고는 병기 제조자로 수습생 생활을 했고, 양심의 가책은 보이지 않았다.<br><br>교도소장 소환 후 재사용 대기 시간이 <b>20%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K30"},{"id":"Addon_K30_09","ko":"군대 동원","en":"Call To Arms","d":"많은 마을에 배치된 영주들은 그들의 부를 지키기 위해 필사적으로 건장한 용병들을 고용하였다. 그러나 아무도 살아남지 못했다.<br><br>순찰 경로가 <b>4미터<\/b> <b>증가하며<\/b>, 경로를 생성하는 동안 이동 속도가 <b>7%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K30"},{"id":"Addon_K30_
