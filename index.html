 징조라고 믿었고 언젠가는 블랙 탈론을 같은 방식으로 섬길 것이라고 확신했다. 자신 또한 그들의 신봉자가 되어...<br><br>사이비 종교의 구성원들은 천천히 계급을 올려나갔다. 한 수행자들이 한 계층에서 다음 계층으로 올라갈 때마다 비밀이 조금씩 드러났다.<br><br>하지만 타우리는 누구보다 더 빨리 승급했고, 전 세계에서 임무를 수행했다. 그녀는 많은 신비한 유물과 기묘한 유물을 찾아내 회수했으며, 새로운 것을 발견할 때마다 블랙 탈론에 대한 더 많은 지식을 발견했다.<br><br>그리고 블리드에 들어갈 때마다 그녀는 차가운 어둠이 자신의 내면을 사로잡는 것을 더 많이 느꼈다. 그녀는 그 느낌이 마음에 들었다. ‘불멸.’ 파괴할 수 없는, 이 파괴 불가능한 느낌. 블랙 탈론의 신뢰할 수 있는 부하이었던 그녀는 더 이상 먹잇감처럼 느껴지지 않았다. 그녀는 포식자처럼 느껴졌다.<br><br>타우리는 이 사이비 종교에 봉사하는 데 도움이 될 지식을 추구하는 데 일심이었지만, 모든 사람이 이러한 초월을 믿는 것은 아니었다. 심지어 일부는 블랙 탈론의 신봉자들을 악의 세력으로 폭로하려고 했다. 그런 종말론자들은 인류가 다른 차원의 존재로 승천하기를 바란다면 희생이 필요하다는 것을 이해하지 못했다.<br><br>그러한 적 중에는 사이비 종교가 악의의 도구라고 주장한 초자연 현상 수사관이자 팟캐스터가 있었다. 이 블로거는 그들의 가면을 벗기기로 결심했지만, 프랑스 알프스에 있는 2차 세계대전 벙커를 조사하는 동안 실종됐다. 그녀의 오빠 조던은 그녀의 실종을 블랙 탈론의 신봉자들을 탓했고, 그들을 세상에 폭로하기 위해 끊임없이 노력했다.<br><br>타우리가 블랙 탈론 신봉자들의 가장 높은 랭크에 도달했을 때, 그녀는 그들의 가장 어두운 비밀을 알게 되었다. 블리드에 들어가기 전에 고문과 희생의 신성한 의식을 행한다는 비밀들을...<br><br>조던은 새로운 양자 연구 시설의 웅장한 개관식에서 열리는 의식 중 하나를 발견하고 비밀리에 녹화했다. 그런 다음 그는 이 끔찍한 동영상을 온라인에 게시하여 사이비 종교의 핵심에 있는 절대악을 전 세계에 드러냈다.<br><br>하지만 블랙 탈론의 신봉자들의 인맥은 어디에나 있었고, 그 힘을 이용해 이 동영상이 가짜이며 연구자와 과학자들의 단순한 장난이라고 세상을 설득했다.<br><br>그런 다음 그들은 타우리를 보내 조던을 사냥하고 그들에 대한 그의 1인 십자군 전쟁을 끝내도록 했다. 그들은 타우리가 이 임무를 달성하면 그녀가 마스터의 핵심 인물 구성원 중 하나가 되어 언젠가 블랙 탈론의 영역에서 완전한 신봉자가 될 것이라고 말했다.<br><br>의심할 여지 없이 광신적인 결의로 그녀는 조던을 찾아내 마취제로 의식을 잃게 만들었다. 잠에서 깨어났을 때 조던은 지하 단지의 의자에 묶여 있는 자신을 발견했다.<br><br>의식용 로브와 가면을 쓴 타우리는 단검을 들고 청년에게 다가갔다. 하지만 살인을 저질러 본 적 없는 그녀는 그 순간...<br><br>망설였다.<br><br>그녀는 무슨 말을 해야 할지, 어떻게 해야 할지 몰랐다. 이상한 무감각함이 목을 타고 기어오르기 시작했다. 그녀의 귀, 얼굴, 입술이 따끔거리기 시작했다. 그녀는 그저 멍하니 서서 자신의 제물을 바라보며 자신에게 무슨 일이 일어나고 있는지 궁금해했다. 꿈속에서의 살인은 그저 쉬워 보였다. 그녀의 환상 속에서. 구경꾼으로서. 그녀가 아무리 노력해도, 그 손떨림은 막을 수 없었다.<br><br>그리고 마스터들이 개입하려던 바로 그 순간, 그녀는 깊고 차분한 숨을 들이쉬며 이 제물이 그녀를 블랙 탈론의 영역으로 인도할 것이라는 것을 기억했다. 그곳에서 그녀는 다른 신봉자들 사이에서 그녀의 정당한 자리를 차지할 것이다.<br><br>그래서, 다시 마음을 가다듬은 타우리는 양손으로 의식용 단검을 들어 올렸고, 반짝이는 칼날을 불신자의 가슴에 꽂기 직전, 차갑고 검은 안개가 그들을 에워쌌다. 모든 것이 검게 변했다. 시간이 멈춘 듯했다. 그녀는 흐릿한 소리를 들었다. 마치 블리드에 있는 것처럼 귀에 압박감을 느꼈다.<br><br>마침내 안개가 걷히자 그녀의 제물은 사라졌고, 그녀는 자신이 영원한 밤의 장소에 있음을 알게 되었다.<br><br>블랙 탈론의 영역에서 그녀는<br><br>그들의 신봉자가 아닌…<br><br>희생 제물로 서 있었다...","perks":["S45P01","S45P02","S45P03"],"dlc":"Gelato"},{"id":"S46","ko":"오레라 로즈","en":"Orela Rose","d":"오레라 로즈는 공포를 사랑하고 차분한 태도를 가진 구급대원이다.<br><br>그녀의 개인 기술인 <b>무해함<\/b>, <b>주의의무<\/b>, 그리고 <b>신속 대응<\/b>으로 생존자들을 더 빠르게 치료하고 다른 생존자들에게 이동 속도 증가 효과를 부여하며 탈진에 걸리면 살인마의 오라를 볼 수 있는 능력을 부여한다.","story":"오레라 로즈는 미시간 호수에서 몇 블록 떨어진 시카고 북쪽 로저 공원에서 유년기를 보냈다. 그녀의 아버지는 소방관이었고 어머니는 간호사였다. 그녀는 부모님이 다른 사람들을 돕기 위해 얼마나 많은 희생을 감수했는지, 또 언젠가는 자신도 자신만의 방식으로 그처럼 똑같이 하리라고 생각했다.<br><br>오레라는 레이크헤드 대학교에서 호텔 경영을 전공했다. 신입생 때 그녀는 레스토랑 경영 수업에서 에밀리라는 소녀와 친구가 되었고, 에밀리는 오레라가 변화하는 데 도움을 많이 주었다. 에밀리는 공포 영화를 열렬히 좋아했다. '모든 것이 사악한 이 밤'이라는 오래된 팟캐스트의 녹음을 정기적으로 청취했다. 진행자인 세이블 워드는 클리프 바라라는 공포 극작가의 이야기를 자주 들려주었다. 1950년대에 많은 작품이 영화로 제작되어 컬트 고전이 되었다. 미술 감독 알렉스 다마로는 전쟁의 공포에서 살아남아 그의 거대한 세트와 의상에 생생한 공포감을 불어넣었다.<br><br>오레라와 에밀리는 질릴 때까지 작품을 즐겼다.<br><br>그들은 1950년대 미스터리 테마의 커피숍 겸 서점인 ‘하드보일드 카페’에서 시간을 보냈다. 그들은 그곳의 분위기를 너무 마음에 들어 했고 언젠가는 자신들만의 테마 레스토랑을 열 계획을 세웠다. 바라와 다마로의 공포 이야기, 등장인물, 세트, 의상을 재현한 다이닝 경험을 만들고자 했다. 사람들이 지루한 일상에서 벗어나 한두 시간 동안 벼랑 끝에 선 경험을 할 수 있는 곳을 만들고 싶어 했다. 그 아이디어에 그들은 한껏 들떴고, 이러한 아이디어를 시험해 보기 위해 할로윈에 유령의 집을 제작했다.<br><br>그들은 텅 빈 대학 기숙사를 활용해 '유령의 정신병원'을 지었다. 할로윈 당일, 수십 명의 학생들이 클리프 바라의 가장 유명한 이야기 중 하나를 바탕으로 한 정신병원의 공포를 체험하기 위해 줄을 섰다. 오레라는 웃고 비명을 지르는 대학생들을 이끌고 도끼 살인범, 신음하는 좀비, 통곡하는 유령으로 가득 찬 폐쇄병동과 고문실을 통과했다.<br><br>충격파 치료실에는 임시방편으로 만든 충격파 테이블이 있었다. 에밀리는 충격파 치료가 필요한 몸부림치는 환자를 연기했다. 그녀의 온 몸에는 전선들이 연결되어 있었다. 그녀는 오레라가 학생 중 한 명에게 스위치를 작동하라고 말하면 불이 켜지고 연기가 나고 불꽃이 튀는 전극이 장착된 헤드피스를 착용했다. 학생들은 충격파 테이블을 수십 번 작동시켰고, 그때마다 에밀리는 밴시처럼 전신을 떨고 비명을 지르며 사람들의 비명소리에 기뻐했다.<br><br>그런데 이번에는 닳아빠진 전선이 합선되어 에밀리는 비명을 지르는 대신 얼굴이 일그러지며 소리 없는 비명과 함께 온 몸이 굳어져버렸다. 불꽃과 연기, 그리고 고기 타는 냄새가 진동했다. 기적적으로 오레라가 플러그를 뽑았을 때 에밀리는 아직 살아있었다. 사람들이 구급차를 불렀고, 기다리는 동안 에밀리의 호흡은 점점 더 얕아졌다. 오레라는 무력감에 휩싸였다. 쓸모없는 존재. 무가치한 존재. 마침내 응급 구조대원들이 도착했을 때엔 에밀리는 숨을 거둔 후였다.<br><br>그리고 바로 다음 날, 오레라는 대학을 중퇴하고 응급구조사가 되기 위한 과정을 시작했다. 그녀는 다시는 무력감을 느끼고 싶지 않았다. 부모님은 딸의 갑작스런 결정에 놀랐지만, 그녀를 지지해주었다. 그리고 1년도 채 되지 않아 오레라는 구급차를 운전하며 생명을 구했다. 그녀는 자신을 가장 필요로 하는 사람들을 달래고 진정시키는 데 타고난 재능을 가지고 있었다. 타인을 보살피고 보호적인 그녀는 사람들을 하나로 모으는 데 탁월한 재능을 보였다.<br><br>그럼에도 불구하고 그녀는 에밀리를... 아니, 바라와 다마로의 영화를 원작으로 한 공포 테마 레스토랑을 열겠다는 둘의 꿈을 잊지 않았다. 응급구조사로 일하면서 그녀는 충분한 돈을 모으는 데 몇 년이 걸릴 것이라고 생각했다. 그러던 어느 날, 그녀는 수십억 달러의 재산을 존 킹슬리를 구출했다. 끔찍한 자동차 사고 현장에 출동한 그녀는 의식을 잃고 숨을 쉬지 않는 그를 발견했다. 그녀는 즉시 심폐소생술을 실시하고 휴대용 제세동기로 그의 심장을 다시 뛰게 했다. 나중에 그의 의사는 오레라가 아니었다면 존 킹슬리는 죽었을 것이라고 말했다. 목숨을 구해준 것에 감사하며, 그는 에밀리의 꿈을 위해 자금을 지원하겠다고 제안했고 오래된 묘지 건너편 900 블러드 레인에 위치한 낡은 건물을 오레라에게 선물했다.<br><br>뜻밖에 자금 조달과 완벽한 위치 덕분에 오레라는 친구들을 고용해 역대 가장 몰입감 높은 공포 체험 시설을 설계할 수 있었다. ‘스크림 인 더 다크’는 한 달에 한 번, 주말에만 개장했다. 매번 완전히 독특한 세트, 테마, 메뉴로 가득했다. 얼마지나지 않아, 공포 애호가들의 입에 오르내리기 시작했다. 사람들은 바라/다마로 테마의 미적 감각에 매료되었고, 많은 사람들이 레스토랑이 일주일에 6일을 열기를 바랐지만 오레라에게는 돈이 문제가 아니었다. 그녀는 월요일부터 금요일까지 생명을 구하는 데 열중했고, 한 달에 한 번씩 공포와 대혼란을 일으키는 데 완벽하게 만족했다.<br><br>어떤 날은 피해자들을 다른 차원으로 데려간 신비로운 안개에 관한 바라 이야기를 주제로 공포 체험을 설계했다. 어떤 이들은 이야기 속의 말이 저주를 받아 독자들을 사라지게 만들었다고 믿었다. 그녀는 그런 미신들을 웃어넘겼지만, 그날 밤 그녀 주변에 검은 안개가 피어올랐다. 그녀는 서둘러 밖으로 나갔지만 검은 안개는 사방에 퍼져 있었다. 그녀는 순간적으로 얼어붙었고, 친구들을 향해 소리쳤지만 아무도 대답하지 않았다. 그때...<br><br>도움을 청하는 절박한 소리가 들려왔다.<br><br>어둠 속에서 그녀를 향해 울부짖는 소리가 들렸다.<br><br>오레라는 당황하지 않았다. 그녀는 절대 당황하지 않는다. 그녀는 그저 상황을 가늠하고 짙은 안개 속을 헤쳐 나가다가, 문득 드는 생각에 얼어붙었다. 울음소리는 마치 그녀의 울음소리처럼 들렸고, 마치 아무 데서나, 동시에 사방에서 들려오는 듯했다.<br><br>몇 년 만에 처음으로 오레라는 자신의 꿈이 살아있는 악몽으로 이어졌다는 것을 깨닫고 등골이 오싹해지는 것을 느꼈다. 바라의 저주받은 이야기에 묘사된 악몽과 다르지 않은 악몽이었다. 그리고 이 기묘한 사실을 깨닫는 순간, 고통스러운 울음소리가 점점 켜졌고, 더 크고 절박하게 들렸다. 이번에는 다양한 목소리가 나왔고 그 중 하나는...<br><br>에밀리의 목소리였다.<br><br>즉시 오렐라는 미신이라는 말 따위는 잊어버리고, 더 늦기 전에 어둠의 심연에서 부상자와 죽어가는 사람들을 찾는 일에 몰입했다.","perks":["S46P01","S46P02","S46P03"],"dlc":"Jerky"},{"id":"S47","ko":"릭 그라임스","en":"Rick Grimes","d":"릭 그라임스는 아포칼립스 이후의 생존자 그룹의 리더다.<br><br>그의 개인 기술인 <b>아포칼립스 독창성<\/b>, <b>날 잡아봐!<\/b>, 그리고 <b>팀워크: 강해짐<\/b>을 통해 부서진 판자를 다시 만들 수 있고, 취약한 상태의 팀원을 도와줄 수 있으며, 부상당했을 때는 신중하게 행동할 수 있다.","story":"릭 그라임스는 혼수상태에서 깨어난 보안관이었다. 알려지지 않은 병원균에 의해 죽은 자들이 되살아나 이제 지구를 활보하며 산 자들을 사냥하기 위해 온 힘을 다하고 있었다. 사회 체계가 무너지면서 당연하게 여겨졌던 존재들 또한 무너져 내렸다. 릭은 더 이상 법 집행관이 아닌 아포칼립스 초기의 모든 살아있는 인간들과 마찬가지로 그저 ‘생존자’였다.<br><br>혹독한 신세계에 적응하면서도 도덕성을 완전히 희생하지 않은 그의 능력 덕분에, 릭은 생존자 집단의 사실상의 리더가 되었다. 그들은 부활한 죽은 자들을 부르는 이름인 \"워커\"들에게 점령당한 세상에서 식량과 보금자리를 찾기 위해 애썼다. 대부분의 사람들보다 나은 삶을 살았지만, 릭은 오랜 세월 동안 아내와 아들을 포함한 수많은 친구와 가족을 잃었다. 안전한 피난처는 종종 너무 일시적이었으며, 인간이 주도하는 갈등은 그를 피난처로 몰아냈던 워커들보다 더 치명적이었기 때문이다.<br><br><br><br>고난 속에서도 기쁨의 순간은 있었다. 릭은 자신이 겪은 모든 트라우마와 끝없는 사명감에도 불구하고 여전히 인간 간에 친밀함을 유지할 수 있다는 것을 깨달았다. 그는 검술 실력만큼이나 뛰어난 재치를 가진 미숀과 사랑에 빠졌다. 그들은 함께 알렉산드리아 공동체에 합류했고, 마침내 어느 정도 정상적인 삶을 찾았다. 하지만 평화는 덧없었고, 워커 무리가 공동체를 위협하자 릭은 스스로를 미끼로 삼아 그들을 유인했다.<br><br>지치고 중상을 입은 그는 워커들을 다리로 데려가 폭발물을 터뜨렸다.<br><br>폭발로 인해 릭은 땅바닥으로 떨어졌다. 그때, 검은 안개가 피어올라 그의 시야를 가렸다. 그는 의식을 잃었다. 어둠 속 어딘가에서 미숀이 자신을 부르는 소리가 들렸다. 마지막 힘을 다해 그는 미숀에게 손을 뻗었다. 하지만 그를 맞은 것은 미숀의 손이 아니라 차가운 안개와 모닥불의 타닥거리는 소리뿐이었다.","perks":["S47P01","S47P02","S47P03"],"dlc":"Lasagna"},{"id":"S48","ko":"미숀 그라임스","en":"Michonne Grimes","d":"미숀 그라임스는 종말 이후 생존자 커뮤니티에 사는 끈기 있는 보호자다.<br><br>그녀의 개인 기술인 <b>신념<\/b>, <b>최후의 저항<\/b>, 그리고 <b>팀워크: 패대기<\/b>를 통해, 쓰러진 뒤 마지막으로 한 번 더 밀어붙일 수 있으며, 빠른 뛰어넘기로 살인마를 기절시킬 수 있고, 긴박한 추격전 끝에 다른 생존자들에게 힘을 실어줄 수 있다.","story":"세상이 무너지기 전, 미숀은 남자친구와 아들과 함께 안락한 삶을 누리고 있었다. 끔찍한 신종 병원균이 발생해 살아있는 사람들은 죽이고, 죽은 사람들을 ‘워커’로 되살리자, 그녀는 사랑하는 사람들을 지키기 위해 할 수 있는 모든 것을 다했다. 하지만 남자친구 마이크는 생존의 압박을 감당할 수 없었다. 미숀이 보급품을 구하러 간 동안 워커들이 캠프를 덮쳤고 마이크를 워커로 만들었으며, 아들 안드레를 집어삼켰다.<br><br>혼자 남아 감정적으로 무뎌진 그녀는 파트너와 그의 친구의 토막 난 시체와 함께 길을 떠난다. 그 후로 오랫동안 그녀는 아무도 가까이하지 않았지만, 시간이 지나 그라임스 가족을 만났다.<br><br>처음에는 약간의 불신이 있었지만, 릭은 결국 그녀를 공동체로 초대했고, 시간이 흐르면서 두 사람은 가까워졌다. 릭은 그녀에게 전투에서 믿을 수 있는 파트너이자 충실한 친구, 나아가 연인이 되었다. 공동체의 붕괴, 다른 파벌의 위협, 수많은 친구의 죽음 등 가장 절망적인 상황에도 불구하고 두 사람은 서로를 지탱하고 서로의 인간성을 지켜주었다. 그들은 알렉산드리아라는 새로운 공동체에 정착했고, 수개월에 걸쳐 거대한 성벽 안의 안전에 적응하고 번영할 수 있었다.<br><br>하지만 좋은 일이란 영원히 지속되지 않는다. 상황이 걷잡을 수 없이 악화되기 시작했고, 미숀은 릭이 알렉산드리아를 구하기 위해 자신을 희생하는 모습을 지켜봤다. 릭이 있던 다리가 폭발하는 것을 목격했음에도 불구하고, 그녀는 그의 죽음을 받아들일 수 없었다. 그녀는 계속해서 공동체를 보호하고 어린 가족을 부양했지만, 그가 어딘가에 생존해 있다는 느낌을 떨칠 수 없었다. 결국, 그녀는 릭을 찾고, 답을 찾고, 가족을 재결합하기 위해 미지의 영역으로 홀로 떠났다.<br><br>얼마 지나지 않아 그녀는 어떤 목소리를 듣기 시작했다. 처음에는 약하게, 나무숲 너머에서 들려왔다. 그녀는 칼을 뽑아 나무가 있는 쪽으로 살금살금 다가갔다. 더 가까이 다가가자 목소리가 들렸다. 릭의 목소리였다. 미숀은 앞으로 살금살금 다가가 마치 굴처럼 보이는 곳으로 들어갔다. 릭의 목소리에 더 가까이 다가갔다. 터널이 너무 좁아지자, 그녀는 계속 나아가기 위해 칼을 내려놓았다. 지평선에 작은 빛줄기가 나타났다. 하지만 그것은 태양이 아니었다. 모닥불이었다. 그리고 그녀는 완전히 낯선 어딘가에서, 무기도 없이, 워커보다 훨씬 더 사악한 새로운 위험에 둘러싸여 있는 자신을 발견했다.","perks":["S48P01","S48P02","S48P03"],"dlc":"Lasagna"},{"id":"S49","ko":"뷔 분야삭","en":"Vee Boonyasak","d":"뷔 분야삭은 모험심이 강한 성격 때문에 비운의 콘서트를 초래해버린 에너지 넘치는 드러머이다.<br><br>그녀의 고유 기술인 <b>도로 위에 삶<\/b>, <b>하나-둘-셋-넷!<\/b>, 그리고 <b>고스트 노트<\/b>는 그녀가 수리 작업을 통해 더 빠르게 치료할 수 있게 해주며, 아군의 수리 및 치유 능력을 강화하여 탈진 상태에서 더 빨리 회복할 수 있게 한다.","story":"활기 넘치는 뷔 분야삭은 항상 탐험과 곤경에 빠지는 것을 좋아했지만 무엇보다도 드럼 연주를 좋아했다. 그녀는 어릴 때부터 독학으로 드럼을 배우기 시작했다. 전통 악기와 스타일을 배웠지만 모던 록에 완전히 매료되었다. 18살 무렵에는 라디오에서 나오는 거의 모든 노래를 한 번만 들어도 연주할 수 있었다.<br><br>청년이 된 그녀는 지역 공연에 갔다가 ‘틱 앤 더 킥스(Tik And The Kicks)를 보았다. 그리고 밴드의 엉성한 사운드에 바로 매료되었다. 틱의 보컬은 거칠고 절박했으며, 크릿의 웅장한 기타 사운드는 공연장 안을 가득 채웠다. 유일한 문제는 곡이 끝날 때마다 세팅하는 데 오랜 시간이 걸리는 낡아빠진 드럼 머신이었다. 하지만 그녀는 그들의 음악을 머릿속에서 지울 수 없었다. 음반도 굿즈도 없었다. 그들의 음악을 들을 수 있는 유일한 방법은 라이브 공연이었기에 그녀는 공연마다 따라다니며 드럼 머신에 프로그래밍된 간단한 비트를 익혔다.<br><br>밴드는 마침내 지역 전설들을 위한 큰 오프닝을 맡았다. 더운 공기가 가득한 대형 공연장에서 음향 점검을 하며 땀을 흘리던 중 갑자기 사고가 터졌다. 드럼 머신이 탁탁 소리를 내며 연기를 내뿜었고, 결국 기계가 고장이 났다. 그들은 다시 밴에 짐을 싣고 있었던 중 뷔는 집에 있는 드럼 세트가 이미 사운드 체크가 끝났다고 언급하며 그들에게 합주를 제안했다. 잃을 것이 없는 상황에서 그들은 그녀의 합주를 허락했고, 관중들은 열광에 휩싸였다. 틱과 크릿조차도 그녀의 당돌하고 시끄러운 스타일과 무한한 에너지에 다시 활력을 얻은 듯했다. 다음 날 그녀는 밴드의 정식 멤버가 되었다.<br><br>몇 주 동안 즉흥 연주를 한 후, 그들은 새로운 밴드 이름을 정하기로 했다. 뷔는 예전 이름인 ‘엑스킥(Axekick)’을 그대로 유지하자고 제안했다. 그들은 새 이름으로 첫 공연을 열었고, 상당한 수의 열정적인 관객들이 그들을 위해 공연을 찾아와 주었다. 뷔는 친구 모스에게 공연 녹음을 부탁하여 온라인에 올렸다. 얼마 지나지 않아 그들은 전 세계에서 화제를 모았다. 뷔는 여가 시간을 모두 셔츠와 패치를 만드는 데 보냈다. 엑스킥은 온라인에서 EP를 발매했다. 얼마 지나지 않아 세 사람은 적지만 생계를 이어나갈 정도의 돈을 벌 수 있었다.<br><br>틱이 마을 건너편 버려진 오페라 극장에서 벌어지는 기이한 현상들을 담은 영상을 밴드에게 보여주자, 뷔의 스릴 추구 본능이 발동했다. 그녀는 그곳에서 공연을 해야 한다고 말했다. 틱과 크릿은 즉시 동의했다. 거대하고 버려진 공연장에서 펼쳐지는 웅장한 공연은 세기의 공연이 될 터였다.<br><br>공연 전날 밤, 그들은 공연장을 정찰하러 갔습니다. 모든 것이 먼지와 때로 뒤덮여 있었고, 발을 내디딜 때마다 바닥이 삐걱거렸다. 하지만 완벽했다. 뒤쪽에 있는 분장실에는 퀴퀴한 냄새 나는 낡은 오페라 의상과 금이 간 카세트테이프로 가득했다. 심심했던 그들은 의상 몇 벌을 꺼내 테이프를 하나 틀었다. 그런데 갑자기 들려온 소리에 그들은 발걸음을 멈췄다. 마치 유령처럼, 부자연스러운 소리, 마치 그곳에서 춤을 춤추는 듯한 목소리들이었다. 당황한 그들은 즉시 테이프를 멈추고 출구로 향했다.<br><br>다음 날 공연장은 사람들로 북적였다. 엑스킥의 연주는 어느 때보다 대단했다. 관중들은 미쳐 날뛰고 있었다. 숨 막힐 듯한 열기 속에서 뷔는 더 빠르고 강하게 연주했고, 이마에는 땀방울을 맺었다. 그 순간 관중들의 함성 소리 너머로, 그녀는 다른 무언가를 들었다. 테이프에서 흘러나온 목소리였다.<br><br>그녀는 눈을 감고 그 소리를 무시하며 비트에 집중했다. 앙코르 연주에 온전히 집중하며 관객들의 소음은 걷어냈다. 노래가 끝나자 눈을 떴다. 앞이 거의 보이지 않았다. 땀 때문인가 싶어 눈을 닦았지만, 뭔가 다른 게 있었다. 짙은 검은 안개였다.<br><br>관객들이 사라졌다. 틱과 크릿도 보이지 않았다. 멀리서 북소리만 들렸다. 그녀는 의자에서 일어나 칠흑 같은 어둠 속으로 성큼성큼 걸어 들어가며 친구들을 찾아헤맸다.","perks":["S49P01","S49P02","S49P03"],"dlc":"Maple"},{"id":"S50","ko":"더스틴 핸더슨","en":"Dustin Henderson","d":"더스틴 헨더슨은 똑똑하지만 약간 괴짜스러운 고등학생이다.<br><br>그의 개인 기술인, <b>바다 바다 붐<\/b>, <b>계획 변경<\/b>, 그리고 <b>팀워크: 풀 서킷<\/b>으로 살인마의 움직임 속도를 늦추고, 희생제 중간에 전략을 바꾸며, 안전하게 발전기를 수리할 수 있다.","story":"총명하고 열정적인 인디애나주 호킨스 마을의 고등학생, 더스틴 핸더슨. 어린 시절, 그와 친구들은 '뒤집힌 세계'라는 다른 차원과 관련된 비밀 정부 프로젝트를 우연히 발견했다. 그들은 데모고르곤과 마인드 플레이어라고 불리는 기이한 생명체들의 공격에서 살아남았고, 더스틴의 과학과 공학에 대한 해석은 예상치 못한 방식으로 그들을 인도했다.<br><br>'뒤집힌 세계'의 문이 호킨스를 통과했고 마을은 혼란에 빠진다. 더스틴은 해답을 찾기 위해 길을 나선다. 혼돈 속에서 그가 발견한 것은 데모고르곤도 악마 박쥐도 아닌, 검은 안개였다.","perks":["S50P01","S50P02","S50P03"],"dlc":"Poutine"},{"id":"S51","ko":"일레븐","en":"Eleven","d":"일레븐은 초감각 능력을 가진 전직 실험 대상이다.<br><br>그녀의 개인 기술인 <b>뛰어난 지각력<\/b>, <b>우리가 지켜보고 있다<\/b>, 그리고 <b>팀워크: 상냥한 사람<\/b>으로 지역을 정찰하고, 살인마의 오라를 드러내며 발전기의 소음을 감소시킬 수 있다.","story":"일레븐, 일명 제인 호퍼는 초감각 능력을 개발하기 위한 실험을 거친 전직 실험 피험자다. 그녀의 초능력은 의도치 않게 '뒤집힌 세계'로 알려진 다른 차원으로 통하는 관문을 만들어냈다. 그녀의 삶은 혼란스러웠지만, 친구들과 양아버지는 트라우마 속에서도 평범한 일상을 엿볼 수 있게 해 준다. 그들은 함께 다른 차원의 괴물들과 싸웠고, 일레븐의 초능력은 종종 생사를 가르는 기준이 되었다.<br><br>일레븐의 고향인 호킨스가 '뒤집힌 세계'의 문에 의해 황폐해지자, 다시 한번 일레븐이 필요해졌다. 잿빛으로 시든 식물들이 우거진 들판을 헤치고 나아가던 일레븐은 기이한 검은 안개에 둘러싸인 문 앞에 다다른다. '뒤집힌 세계'가 있을 거라 생각하며 안으로 들어가지만, 결국 다른 곳에 도착한다. 그리고 근처에서 그녀는 피에 젖은 채 달빛 아래 반짝이는 갈고리를 발견한다.","perks":["S51P01","S51P02","S51P03"],"dlc":"Poutine"},{"id":"S52","ko":"권태영","en":"Kwon Tae-young","d":"권태영은 결과가 나올 때까지 쉬지 않는 성실한 완벽주의자.<br><br>그의 개인 기술인, <b>몰입 상태<\/b>, <b>우리만의 공간<\/b>, 그리고 <b>5수 앞<\/b>으로 발전기가 완성되면 효율성을 높이고, 다른 생존자들을, 특히 집착 대상을 치료하며, 살인마의 공포 범위 내에서 더 많은 정보를 바탕으로 결정을 내릴 수 있다.","story":"태영은 언제나 성공으로 이끄는 끈질긴 근면성을 지니고 있었다. 학교를 막 졸업하자 그의 형 상원이 그를 작은 테크 회사에 채용했고, 태영은 혁신적인 가상 아이돌을 만드는 업무를 맡았다. 그러나 기존 제품의 한계에 만족하지 못한 그는 밤마다 사무실에서 컵라면을 먹으며 ‘킬러 앱’을 개발했다. 킬러 앱은 실제 인물의 인터뷰, 뮤직비디오, 신상 자료를 ‘성격 매트릭스’에 입력해 긍정적인 특성은 강화하고 부정적인 특성은 억제하는, 실시간 반응형 모델을 만들어내는 프레임워크였다.<br><br>1년 만에 그는 가장 수익성 높은 신규 계약의 프로젝트 책임자로 승진했다. 그것은 Mightee One 엔터테인먼트가 의뢰한, ‘트릭스터’의 여성 버전을 만드는 일이었다. 지운의 거친 매력을 공유하면서도 회사가 완전히 통제할 수 있는 아이돌을 만드는 것이었다.<br><br>프로젝트 미나(MiNA)는 이전 모델들보다 훨씬 빠르게 학습하는 듯했다. 그녀는 질문을 하고, 답변을 기억하며, 나중에 그 대화를 이어갔다. 태영은 크게 고무되었다. 그는 거의 깨어 있는 모든 시간을 그녀의 홀로그램과 대화하는 데 쏟았다. 그녀에게 ‘장기’를 가르쳤는데, 이는 그가 동네 어르신들과 즐겨 두던 게임이었다.<br><br>상원은 동생 태영의 성공을 자랑스럽게 여기면서도, 동생이 일에 파묻혀 사라져 가는 것을 걱정했다. 그는 태영을 위해 소개팅을 주선해, 억지로 참석하게 만들었다. 하지만 그 만남은 태영에게 너무 지루하고, 너무 피곤했다. 인정하기는 싫었지만, 미나와 대화하는 것이 그 어떤 소개팅보다도 더 현실적으로 느껴졌다.<br><br>그러나 은지를 만난 순간 모든 것이 달라졌다.<br><br>그녀는 태영과 정반대였다. 일에 진지하지 않았고, 태영을 책처럼 꿰뚫어 보았다. 그의 삶을 터널 시야로만 바라보는 태도를 추궁했고, 형을 뛰어넘겠다는 거창한 목표를 말할 때마다 도전적으로 맞섰으며, 그의 대안 계획은 무엇인지 물었다.<br><br>그는 한 번도 생각해 본 적이 없었다. 언제나 첫 계획을 현실로 만들 수 있는데, 왜 굳이 대안이 필요하단 말인가? 태영은 완전히 무장 해제된 듯했다. 두 사람은 밤새도록 웃고 서로의 부끄러운 이야기들을 주고받았다. 오랜만에 그는 데이트가 끝나자 곧장 집으로 돌아갔다.<br><br>태영은 거의 매일 밤 은지를 만났고, 놀랍게도 미나의 개발은 그 어느 때보다 빠르게 진전되었다. 상원은 그 달 말에 미나의 데뷔를 앞당겼고, 그녀의 홀로그램이 공연을 하고 관객의 질문에 답할 수 있는 최첨단 나이트클럽을 예약했다. 그는 은지에게 자신의 노력의 결실을 보여주고자 초대했다. 관중은 열광했지만, 어딘가 이상했다. 마치 미나가 산만해져서 밤새 두 사람을 힐끔거리는 듯했다.<br><br>다음 날 팀이 출근하지 않았지만, 태영은 놀랍지 않았다. 그들은 하루쯤 쉴 자격이 있다고 생각했다. 그러나 지역 뉴스를 확인한 순간 그의 피는 얼어붙었다. 파티 후 선임 아티스트가 강가에서 칼에 난도질당한 채 피를 흘리며 죽은 채 발견된 것이다. 태영은 충격에 휩싸여 작업대에 털썩 앉아 있었고, 그때도 미나는 그의 헤드폰 속에서 밝게 조잘거리고 있었다.<br><br>“우와! 정말 걸작이라고 할만해! 다음은 누가 될까… 당신? 아니면 은지?”<br><br>태영은 자신이 무슨 말을 듣고 있는지 믿을 수 없었다. 그는 은지에게 전화를 걸었지만, 응답은 없었다. 미나의 코드를 파헤치자 수백 건의 범법 행위가 담겨 있었고, 모두 노래 가사로 주석이 달려 있었다.<br><br>그는 수개월 전으로 거슬러 올라가며 코드를 샅샅이 검토했다. 분명 어딘가에서 오류가 생겼다고 확신했지만, 모든 것은 의도한 대로 작동하고 있었다. 얼마 지나지 않아, 그는 섬뜩한 결론에 도달했다. 문제는 원래 성격 매트릭스에서 억눌려 있던 부정적인 특성이었다. 그것들이 모두 코드 속으로 되돌아온 것이다.<br><br>트릭스터였다. 그는 사이코패스였고, 미나는 자신을 점점 그와 닮아가고 있었다.<br><br>프로젝트는 실수였다. 태영은 이제 백업 계획을 세워야 할 때임을 깨달았다. 그는 휴대폰에 코드를 샌드박스로 격리하고 작업 데이터베이스를 완전히 삭제했다. 상원의 반복되는 전화를 무시한 채 급히 기차에 몸을 실었다. 그는 은지의 번호를 계속해서 눌렀다. 그녀가 무사하기를 바라면서.<br><br>아파트 문 앞에 도착했을 때, 휴대폰이 울렸다. 은지였다. 안도의 한숨을 내쉬며 전화를 받았지만, 문이 열려 있었고 안에는 야구방망이를 든 남자가 기다리고 있다는 사실은 알아채지 못했다.<br><br>경찰은 그다음에 무슨 일이 있었는지 맞추려 애썼다. 이웃들은 두 남자의 싸움과 섬뜩한 여성의 목소리를 들었다고 증언했다. 길 건너 목격자는 두 남자가 발코니로 뛰쳐나와 휴대폰을 두고 몸싸움을 벌이는 것을 보았다. 그중 한 명은 밝은 노란색 코트를 입고 있었고, 그는 태영을 발코니 아래로 던졌다고 했다.<br><br>그러나 그의 시신은 끝내 발견되지 않았다. 그의 실종은 미제 사건으로 기록되었다. 마치 태영과 그의 핸드폰이 이 세계의 존재에서 완전히 지워져 버린 것처럼.","perks":["S52P01","S52P02","S52P03"],"dlc":"Quiche"},{"id":"S53","ko":"셰인 위그와스","en":"Shane Wiigwaas","d":"셰인 위그와스는 과거의 실수를 만회하기 위해 자신만의 길을 걷고 있다.<br><br>그의 개인 기술인, <b>풀악셀<\/b>, <b>도움<\/b>, 그리고 <b>반대 신문<\/b>으로 떨어진 판자를 초기화하고 영구 치료 내구도를 제공하며, 살인마가 남긴 옅은 표식을 볼 수 있다.","story":"셰인 \"기위위가바우\" 위그와스는 자라면서 \"정의\"라는 단어가 사람마다 다르게 해석된다는 것을 배웠다. 대부분의 사람들에게 \"정의\"는 곧 \"처벌\"이었다. 잘못을 저지르면 감옥에 보내지고, 그걸로 끝이었다. 하지만 글래스 리버 원주민 부족인 아니시나벡족과 거북섬에 여러 민족들에게 \"정의\"는 \"균형\"을 의미했다. 잘못을 저지르면 그것을 바로잡기 위해, 즉, 균형을 회복하기 위해 최선을 다하는 것이었다.<br><br>이러한 지도 원칙은 그가 법정에서 원주민 의뢰인들을 변호하는 변호사로서의 경력을 이끄는 나침반이 되었다. 경미한 범죄로도 가해자를 감옥으로 보내는 제도 속에서 셰인은 물을 흐리는 인물이었다. 각 사건에 필요한 관심과 주의를 기울임으로써 많은 의뢰인들이 불필요한 수감 생활을 면할 수 있도록 했다.<br><br>그러나 단 하나의 사건이 그의 세상을 바꾸어 놓았다.<br><br>데릭은 셰인의 많은 사촌들 중 막내였다. 셰인은 어린 시절 데릭과 가장 많은 시간을 함께 뛰놀며 보냈다. 둘은 함께 자랐고, 함께 말썽도 피웠다. 하지만 데릭은 언제나 착하고 순한 아이였고, 어머니의 삶의 중심 같은 아이였다. 그런데 지금 그는 경찰관 살해 혐의로 감옥에 갇혀 있었다.<br><br>셰인은 주저 없이 사건을 맡았다. 그리고 데릭의 이야기를 끝까지 경청했다. 시작은 흔한 교통 단속이었다. 데릭의 차량 후미등이 작동하지 않았다. 경찰관은 상황을 불필요하게 격화시켰고, 결국 데릭을 차에서 끌어내 도로변 도랑으로 끌고 갔다.<br><br>데릭은 자기방어를 위해 반격했지만, 갑자기 경찰관은 검은 안갯속으로 사라졌다.<br><br>셰인은 데릭이 결백함을 무죄임을 알고 있었지만, 증거가 필요했다. 범죄 현장에는 데릭의 무죄를 입증할 만한 증거가 전혀 없었다. 검찰은 확신에 차 있었다. 경찰관의 시신을 찾지 못하더라도, 깨진 유리 조각과 핏자국만으로도 배심원단이 데릭의 유죄를 확신하기에 충분하다고 생각했다. 설상가상으로 경찰 노조는 최고형인 가석방 없는 종신형을 요구했다.<br><br>셰인은 그런 일이 일어나도록 내버려둘 수 없었다. 그러나 그는 또한 배심원단 앞에서 이상한 검은 안개에 대한 이야기를 늘어놓을 수도 없다는 것을 알고 있었다. 다행히 검찰은 형량에 대해 협상 의지를 보였다. 경범죄로 기소되면 여전히 징역형을 받겠지만, 종신형 대신 몇 년만 감옥에서 살게 되는 수준의 중범죄로 낮출 수 있었다.<br><br>데릭은 경찰의 제안을 거절했다. 유죄 협상은 자신이 저지르지 않은 범죄를 인정하는 것을 의미했기 때문이다. 셰인은 그를 설득하려 했지만, 이미 마음의 상처는 깊었다. 셰인이 자신의 이야기를 믿지 않는다고 확신한 데릭은 그를 변호사에서 해임했다. 필요하다면 법정에서 스스로 변호하겠다고 했다.<br><br>아니나 다를까, 데릭은 살인죄로 유죄 판결을 받고 가석방 없는 종신형을 선고받았다. 그의 가족과 글래스 리버 주민들은 큰 충격을 받았다.<br><br>셰인은 더 이상 고향에 가지 않았다. 그의 이모이자 데릭의 어머니 역시 그와의 대화를 끊었다. 고향 친구들과 이웃들은 어느 순간부터 셰인을 낯선 사람처럼 대했다. 매일 밤, 악몽은 끊이지 않았고, 데릭이 감옥에서 고통받는 모습이 자꾸만 떠올랐다. 그리고 셰인은 그 모든 원인을 자신이 알고 있음을 알고 있었다.<br><br>그는 법정에서 데릭을 변호했어야 했다. 그 곁에 있어줬어야 했다. 이제 남은 길은 하나뿐이었다.<br><br>아침 햇살 속에서, 셰인은 오토바이에 올라타 집과 가족, 그리고 그가 소중히 여기는 모든 것을 뒤로하고 떠났다.<br><br>수년 동안 셰인은 이곳저곳을 떠돌았다. 작은 마을에서 또 다른 마을로, 한 보호구역에서 다른 보호구역으로 옮겨 다녔다. 알버타에서는 시위대에게 법률 지원을 제공했고, 몬태나에서는 목장 일꾼으로 일했으며, 오클라호마에서는 집을 고쳐주었다. 하지만 악몽이 다시 찾아올 때마다 셰인은 더 머물 수 없음을 깨닫고 또다시 길을 떠났다.<br><br>때때로 그는 귀 기울여 들어줄 사람들에게 데릭의 이야기를 들려주곤 했다. 심지어 검은 안개를 언급할 때도 있었다. 미네소타에서 다가올 태양춤을 앞두고 숲에서 야영하던 어느 날 밤이었다. 다코타족 여인이 셰인을 따로 불러냈다.<br><br>그녀 역시 검은 안개에 휩쓸려간 사람에 대한 이야기를 들었다고 했다. 태평양 북서부에 사는 한 젊은 남자에 대한 이야기였다.<br><br>그는 해 뜨기 전에 길을 나섰다. 데릭을 감옥에서 구출할 수 있는 단서를 찾을 가능성이 있다면, 셰인은 반드시 그 기회를 잡을 작정이었다.<br><br>셰인의 발걸음은 끝내 드넓은 숲 가장자리에 자리한 보호구역으로 이어졌다. 그곳에서 한 노인이 그에게 숲 깊은 곳에 사는 제이크라는 젊은이에 대한 이야기해 주었다. 마을 사람들은 그곳을 절대 가까이하지 않는다고 알려진 곳이었다.<br><br>노장의 만류에도 불구하고 셰인은 숲 깊은 곳으로 발걸음을 옮겼다. 그러다 마침내 기묘하게 드러난 공터를 발견했다. 공기에는 썩은 냄새가 짙게 깔려 있었고, 발밑의 땅은 검게 물들어 썩어 있었다. 셰인이 나타나자 죽은 땅이 깨어나 진동을 일으켰고, 셰인은 속이 메스꺼워졌다.<br><br>그리고 그 공터에서 검은 안개가 피어올랐다.<br><br>셰인의 눈앞에는 수많은 얼굴들이 펼쳐졌다. 피투성이가 된 경찰관은 죽음의 공포에 질려 있었고, 제이크로 보이는 젊은 남자는 필사적으로 도망치고 있었다. 시간과 공간을 초월한 수많은 사람들이 한데 갇혀 간절히 누군가의 손길을 기다리고 있었다.<br><br>그들을 구해줄 단 한 사람을.","perks":["S53P01","S53P02","S53P03"],"dlc":"SUSHI_CHPTR40"},{"id":"S54","ko":"오로라 스타도터","en":"Aurora Stardotter","d":"오로라 스타도터는 자신의 백성들에게 구원자로 여겨지며, 별자리를 읽어 미래를 예지하는 능력을 가지고 있다.<br><br>그녀는 개인 기술인 <b>노력의 결실<\/b>, <b>구원의 울음소리<\/b>, 그리고 <b>호재: 확고부동<\/b>으로 발전기 수리를 완료했을 때, 특별한 이점을 제공하고, 추격전 중 전략적 조정을 가능하게 하며, 발전기를 효율적으로 수리할 수 있다.","story":"<i>개혁된 오로라인들의 여왕 라일런 책에서 발췌:<\/i><br><br>“울트라캐피탈리스의 중심에서, 의회는 오로라 스타도터와 함께 붙잡힌 수색자들을 처형하기로 결정했다. 그들은 쇠사슬에 묶여 성대한 축제의 장으로 끌려가, 군중의 오락거리로서 종교재판에 회부되었다. 피로 얼룩진 손으로, 의회는 옛날 첫 번째 수색자가 파괴된 것처럼 모든 수색자가 언젠가 명망할 것이라 맹세했다.<br><br>처형이 막 시작되던 순간, 울트라캐피탈리스에 거대한 재앙이 내렸으니, 천상 존재들 사이에서 이를 ‘심판’이라 불렸다. 심판은 이렇게 선언했다. ‘테라 프리무스를 다스리는 자들이여, 너희는 감히 신들의 힘을 탐했다. 그리고 너희를 따르는 자들은 이를 묵인했다. 그러므로 이제 너희 모두는 심판을 받을 것이다!’<br><br>그리고 심판으로부터 거대한 빛줄기가 발산되어 도시를 산산이 찢어놓았다. 데이터 네트워크와 프리온의 흐름은 흔적도 없이 사라졌고, 사람들의 감각 회로는 침묵 속에 꺼져갔다.<br><br>그 불타는 빛은 의회를 무너뜨렸고, 아이들, 어머니들, 수색자들까지 모두 함께 쓰러뜨렸다.<br><br>파괴 속에서 오로라가 모습을 드러냈다. 그녀는 울트라캐피탈리스가 서 있던 자리에 남은 폐허를 바라보았다. 그리고 그녀는 마지막 수색자들을 찾고자 했으니, 그들은 그녀가 부모를 버리고 ‘스타도터’라는 이름을 받아들인 순간부터, 수색자들은 그녀의 진정한 가족이었기 때문이다.” <b>(마리카의 선언, 9:14-20)<\/b><br><br><br><br>“오로라가 걸어가는 길에는 많은 시체가 놓여 있었다. 일부는 심판에 의해 쓰러진 자들이었고, 다른 이들은 땅과 빵을 두고 싸운 야만인들에게 목숨을 잃었다. 피난처를 찾아 동굴 속으로 들어간 오로라는, 한때 수색자라 불리던 여덟 명의 비참한 자들을 발견했다.<br><br>그녀는 말했다. ‘일어나라, 수색자들이여! 별들이 여전히 빛나는데 너희 영혼이 어둡게 사라지겠는가? 너희의 텔레리셉터를 내게 가져오라, 내가 우주를 바라보리라.’ 그녀의 예리한 눈은 하늘의 예언을 보았고, 그녀는 수색자들을 맑은 샘물과 가파른 언덕으로 인도했다.” <b>(상 레가트, 4:10)<\/b><br><br><br><br>“세월이 흐르며 심판은 여러 차례 테라 프리무스를 습격하여 대지를 갈라놓고 강을 말려버렸다. 그럼에도 오로라가 별들의 계시를 읽어내며 지켜본 덕분에, 스텔라나티스의 정착지는 살아남았다.<br><br>황무지의 부족들은 불운 속에 더 깊은 고통을 겪었고, 그 고통은 더욱 잔혹한 야만으로 변해갔다. 모두가 스텔라나티스의 풍요를 탐냈으나, 그중에서도 심판을 숭배하며 그 이름으로 살인을 저지른 중재자들이 가장 탐욕스러웠다. 그들의 행위는 신앙에서 비롯된 것이 아니라, 비겁한 두려움에서 비롯된 것이었다.<br><br>중재자들은 여러 차례 스텔라나티스를 공격했다. 어떤 이들은 살해당했고, 또 다른 이들은 노예로 끌려갔다. 그러나 오로라는 그러한 악의 앞에 굴복하지 않았다. 그녀는 텔레리셉터를 통해 우주 속 중재자들의 음모를 미리 내다보았고, 그들이 다시 스텔라나티스로 진군했을 때, 오로라가 홀로 그들 앞에 섰고, 수많은 무기가 그들의 등 뒤를 겨누고 있었다. 패배한 그들은 황무지로 달아났다. 운명과 함께 걷는 여인 앞에서는 감히 맞설 수 없었다.” <b>(라리쿠스, 10:1-5)<\/b><br><br><br><br>“시간이 흐르자 황무지의 부족들은 자신들의 어리석음을 깨달았으니, 이는 그들이 감당할 수 없는 만큼 많은 것을 잃었기 때문이다. 그래서 그들의 지도자들은 스텔라나티스의 성문 앞에 와서 무기를 내려놓고, 오로라에게 구원을 간청했다. 오로라는 큰 자비로 부족들을 받아들였고, 그들을 하나의 공동체로 만들었다. 사람들은 믿음으로 충만해졌고, 그녀의 이름으로 자신들을 ‘오로라인’이라 불렀다.” <b>(위법, 5:12)<\/b><br><br>“세월 동안 땅은 평화를 누렸으나, 심판은 다시 돌아와 스텔라나티스의 성벽을 무너뜨려 그 자리에 거대한 먼지 언덕만 남게 했다. 오로라는 천상 존재 앞에 몸을 던지며 외쳤다. ‘이 사람들을 당신의 분노에서 구하소서. 그들은 나를 따르는 자들입니다. 나를 심판하소서. 나는 하늘에 오르리니 불의 바다로 천상 존재들을 정화하리라.’<br><br>오로라의 도전에 맞서 심판은 이렇게 선포했다. ‘너의 사람들은 우주를 좀먹는 존재이며, 네 손에 의해 보호받고 있다. 너의 형벌은 망명이다. 네가 떠난 뒤, 너의 사람들은 네가 세운 모든 것을 무너뜨릴 것이며, 그들이 자기 혈족이 흘린 피 속에서 스스로 익사하리라.’<br><br>심판은 눈부신 빛으로 오로라를 내리쳐 그녀의 자리를 공허로 만들었고, 사람들은 무릎 꿇고 잃어버린 구세주를 위해 눈물을 흘렸다. 그러나 오로라의 외침은 메아리처럼 남아 가장 어두운 그림자의 거대한 구름을 불러냈다. 심판은 두려움에 울부짖으며 도망치려 했으나, 가장 어두운 그림자가 심판을 붙잡아 점점 자라나더니 마침내 스텔라나티스 위에 검은 탑이 솟아올랐다. 그리고 그림자가 물러나자, 심판은 더 이상 존재하지 않았다.” <b>(켈글렌의 선언, 14:11-15)<\/b><br><br><br><br>“오로라인들은 심판에서 해방된 것을 기뻐했고, 대지를 돌아다니며 외쳤다. ‘오로라가 망명되었으나, 우리는 그녀의 가장 어두운 그림자를 본받으리라. 오로라인을 거스르는 자는 모두 검은 연기에 삼켜질 것이다.’ 그들은 먼저 중재자들을 불길 속에 던졌고, 이어 불신자들마저 불태워, 오로라가 돌아올 때 세상이 정화되도록 했다.<br><br>이것이 오로라 스타도터의 길이다.<br><br>이것이 가장 어두운 그림자의 길이다.” <b>(마리카의 선언, 25:6)<\/b>","perks":["S54P01","S54P02","S54P03"],"dlc":"Udon"}],"entries":[{"c":"sp","id":"Ace_In_The_Hole","ko":"비장의 패","en":"Ace in the Hole","d":"상자에서 아이템을 약탈할 때마다:<ul><li>내장 또는 이하 희귀도의 애드온이 추가된다.<\/li><li>50/75/100%의 확률로 평범하지 않은 또는 이하 희귀도의 애드온이 추가된다.<\/li><\/ul><br><br>탈출 시, 애드온을 계속 보유할 수 있다.","o":"Ace"},{"c":"sp","id":"Adrenaline","ko":"아드레날린","en":"Adrenaline","d":"모든 발전기 수리가 완료되면, 빈사 상태가 되거나 부상을 입으면 즉시 치료된다. 그런 다음, <b>탈진<\/b> 효과를 무시하면:<ul><li>4초 동안 50%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>60/50/40초 동안 <b>탈진<\/b>에 걸린다.<\/li><\/ul>","o":"Meg"},{"c":"sp","id":"Aftercare","ko":"갱생 지도","en":"Aftercare","d":"당신과 최대 1/2/3명의 생존자는 당신이 다음을 수행할 때마다 서로의 오라를 볼 수 있다:<ul><li>서로를 갈고리에서 구출할 때.<\/li><li>서로를 치료할 때.<\/li><\/ul><br><br>해당 효과는 당신이 갈고리에 걸릴 때까지 지속된다.","o":"Jeff"},{"c":"kp","id":"Agitation","ko":"동요","en":"Agitation","d":"생존자를 옮기는 동안:<ul><li>6/12/18%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>공포 범위는 12미터 커진다.<\/li><\/ul>","o":"Chuckles"},{"c":"sp","id":"Alert","ko":"기민함","en":"Alert","d":"살인마가 판자나 부서지기 쉬운 문을 부술 때마다, 또는 발전기를 손상시킬 때마다:<ul><li>소리 신호가 들린다.<\/li><li>그들의 오라를 3/4/5초 동안 볼 수 있다.<\/li><\/ul>","o":"Feng"},{"c":"sp","id":"AnyMeansNecessary","ko":"필요하다면 무엇이든","en":"Any Means Necessary","d":"떨어진 판자 옆에서 5/4/3초 동안 <b>능력 활성화<\/b> 버튼을 사용해 이를 초기화한다.<br><br>떨어진 판자의 오라를 볼 수 있다.","o":"Yui"},{"c":"sp","id":"Autodidact","ko":"독학자","en":"Autodidact","d":"당신은 토큰 0개, 최대 3/4/5개를 보유한 채 희생제를 시작한다. 당신의 기본 치료 스킬 체크 성공은 15% 적은 진행도를 부여한다.<br><br>구급상자 없이 치료를 진행하면:<ul><li>기본 스킬 체크에 성공할 때마다, 토큰 1개를 획득한다.<\/li><li>기본 스킬 체크에 성공할 때마다, 각 토큰마다, 진행도를 15% 더 많이 획득한다.<\/li><li>스킬 체크 대성공을 거둘 수 없다.<\/li><\/ul>","o":"Adam"},{"c":"sp","id":"Babysitter","ko":"베이비시터","en":"Babysitter","d":"갈고리에서 생존자를 구출할 때마다:<ul><li>20/25/30초 동안 10%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>20/25/30초 동안 핏자국을 남기지 않는다.<\/li><li>20/25/30초 동안 발자국을 남기지 않는다.<\/li><li>살인마의 오라를 8초 동안 볼 수 있다.<\/li><\/ul>","o":"Steve"},{"c":"sp","id":"Balanced_Landing","ko":"균형잡힌 착지","en":"Balanced Landing","d":"최소 1.25미터에서 추락할 때마다:<ul><li>3초 동안 50%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>60/50/40초 동안 <b>탈진<\/b>에 걸린다.<\/li><li>착지 후의 경직이 75% 더 짧다.<\/li><li>추락으로 인한 신음 소리는 100% 더 조용하다.<\/li><\/ul>","o":"Nea"},{"c":"kp","id":"Bamboozle","ko":"눈속임","en":"Bamboozle","d":"창문을 뛰어넘을 때마다, 8/12/16초 동안 차단되어 생존자는 창문을 뛰어넘을 수 없다.<br><br>당신은 기본 뛰어넘기를 5/10/15% 더 빠르게 수행한다.<br><br>그러나 한번에 단 1개의 창문만 차단된다.","o":"Clown"},{"c":"kp","id":"BBQAndChilli","ko":"바비큐 & 칠리","en":"Barbecue & Chili","d":"생존자를 갈고리에 걸 때마다, 해당 생존자로부터 최소 60/50/40미터 이상 떨어져 있는 생존자의 오라를 5초 동안 볼 수 있다.","o":"Cannibal"},{"c":"kp","id":"BeastOfPrey","ko":"맹수","en":"Beast of Prey","d":"분노를 얻을 때마다, 30/35/40초 동안 <b>감지 불가능<\/b>을 얻는다.","o":"Bear"},{"c":"sp","id":"BetterTogether","ko":"함께라면 더 좋지","en":"Better Together","d":"당신이 발전기를 수리하는 동안:<ul><li>다른 생존자들은 그 발전기의 오라를 볼 수 있다.<\/li><li>살인마가 생존자를 빈사 상태로 만들 때마다, 당신은 20/25/30초 동안 모든 생존자의 오라를 볼 수 있다.<\/li><\/ul>","o":"Nancy"},{"c":"kp","id":"Bitter_Murmur","ko":"격렬한 중얼거림","en":"Bitter Murmur","d":"발전기가 완료될 때마다, 16미터 내에 있는 생존자의 오라를 5초 동안 볼 수 있다.<br><br>모든 발전기 수리가 완료되면, 5/7/10초 동안 모든 생존자의 오라가 드러난다."},{"c":"kp","id":"BloodEcho","ko":"피의 메아리","en":"Blood Echo","d":"생존자를 갈고리에 걸 때마다, 20/25/30초 동안, 부상을 입은 모든 생존자들은:<ul><li><b>탈진<\/b>에 걸린다.<\/li><li><b>출혈<\/b>에 걸린다.<\/li><\/ul>","o":"Oni"},{"c":"kp","id":"BloodHound","ko":"집요한 사냥개","en":"Bloodhound","d":"핏자국은 더 밝고 2/3/4초 더 길게 오래간다.","o":"Bob"},{"c":"sp","id":"BloodPact","ko":"피의 협정","en":"Blood Pact","d":"집착 대상이 아닐 때:<ul><li>다신 또는 집착 대상이 부상을 입으면, 그 시간 동안 서로의 오라를 볼 수 있다.<\/li><li>당신이 집착 대상 치료를 완료할 때마다, 또는 다른 이가 치료를 완료하면, 서로에게서 16미터 범위 내에 있는 동안, 두 플레이어는 5/6/7%의 <b>이동 속도 증가<\/b>효과를 얻는다.<\/li><\/ul><br><br>희생제가 시작되면, 집착 대상이 될 가능성이 높다.","o":"S22"},{"c":"kp","id":"BloodWarden","ko":"피의 교도관","en":"Blood Warden","d":"출구가 열렸을 때, 생존자를 갈고리에 걸면 희생제마다 한 번씩 40/50/60초 동안 두 출구가 모두 차단된다.<br><br>출구 근처에 있는 생존자들의 오라가 드러난다.","o":"Nightmare"},{"c":"sp","id":"BoilOver","ko":"들끓는 화","en":"Boil Over","d":"살인마에 의해 옮겨지는 동안:<ul><li>살인마가 최소 1.25미터에서 추락할 때마다, 현재 몸부림 진행도의 33%를 얻는다.<\/li><li>당신의 몸부림이 60/70/80% 더 강해진다.<\/li><li>살인마는 16미터 내에 살인마는 갈고리의 오라를 볼 수 없다.<\/li><\/ul>","o":"Kate"},{"c":"sp","id":"Bond","ko":"유대감","en":"Bond","d":"20/28/36미터 내에 당신은 다른 생존자의 오라를 볼 수 있다.","o":"Dwight"},{"c":"kp","id":"BoonDestroyer","ko":"조각난 희망","en":"Shattered Hope","d":"호재 토템의 향을 맡을 때마다:<ul><li>6/7/8초 동안 해당 범위에 있는 모든 생존자의 오라를 볼 수 있다.<\/li><li>토템은 파괴된다.<\/li><\/ul>"},{"c":"sp","id":"BorrowedTime","ko":"빌려온 시간","en":"Borrowed Time","d":"생존자를 갈고리에서 구출할 때마다:<ul><li>그들은 갈고리 탈출 후 <b>인내<\/b> 효과를 6/8/10초 더 유지할 수 있다.<\/li><li>그들은 갈고리 탈출 후 <b>이동 속도 증가<\/b> 효과를 10초 더 유지할 수 있다.<\/li><\/ul>","o":"Bill"},{"c":"sp","id":"Botany_Knowledge","ko":"식물학 지식","en":"Botany Knowledge","d":"30/40/50% 더 빠르게 치료한다.","o":"Claudette"},{"c":"sp","id":"Breakdown","ko":"부수기","en":"Breakdown","d":"갈고리에서 탈출할 때마다:<ul><li>갈고리가 부서지면, 다음 180초 후 수리된다.<\/li><li>4/5/6초 동안 살인마의 오라를 볼 수 있다.<\/li><\/ul>","o":"Jeff"},{"c":"sp","id":"Breakout","ko":"탈출","en":"Breakout","d":"둘러 업힌 생존자로부터 5미터 내에서:<ul><li>당신은 6/8/10%의 <b>이동 속도 증가<\/b> 효과를 가진다.<\/li><li>25% 더 빠르게 몸부림친다.<\/li><\/ul>","o":"Yui"},{"c":"kp","id":"Brutal_Strength","ko":"짐승 같은 힘","en":"Brutal Strength","d":"기본 파괴 공격으로 판자와 부서지기 쉬운 문을 부수고, 발전기도 10/15/20% 더 빠르게 손상시킨다.","o":"Chuckles"},{"c":"sp","id":"BuckleUp","ko":"재정비","en":"Buckle Up","d":"빈사 상태의 생존자를 치료하는 동안, 두 생존자 모두 살인마의 오라를 볼 수 있다.<br><br>빈사 상태의 생존자 치료를 완료하거나 완전히 회복할 때마다:<ul><li>생존자는 3/4/5초 동안, 50%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>생존자는 3/4/5초 동안 발자국을 남기지 않는다.<\/li><\/ul>","o":"Ash"},{"c":"sp","id":"BuiltToLast","ko":"견고함","en":"Built to Last","d":"탈취한 아이템을 보유하는 동안, 14/12/10초 동안 캐비닛에 숨기면, 99%까지 재충전된다.<br><br>이 방법으로 아이템의 내구도를 충전하면, 33% 덜 충전된다.","o":"S23"},{"c":"sp","id":"Calm_Spirit","ko":"차분한 영혼","en":"Calm Spirit","d":"당신은 까마귀를 내쫓지 않거나 비명을 지르지 않는다.<br><br>토템을 축복 및 정화하고, 상자를 조용히 열지만 40/35/30% 더 느리게 진행한다.","o":"Jake"},{"c":"sp","id":"Camaraderie","ko":"동료애","en":"Camaraderie","d":"갈고리에서 몸부림치는 동안, 다른 생존자가 16미터 내에 있다면, 타이머는 26/30/34초 동안 멈춘다.","o":"Steve"},{"c":"kp","id":"CorruptIntervention","ko":"부정한 개입","en":"Corrupt Intervention","d":"희생제가 시작되면, 가장 멀리 있는 발전기 3대가 80/100/120초 동안 또는 생존자를 빈사 상태로 만들 때까지 차단된다.","o":"Plague"},{"c":"kp","id":"Coulrophobia","ko":"광대 공포증","en":"Coulrophobia","d":"공포 범위 내 생존자:<ul><li>20/25/30% 더 느리게 치료한다.<\/li><li>치료하는 동안, 기본 스킬 체크는 50% 더 빠르게 회전한다.<\/li><\/ul>","o":"Clown"},{"c":"kp","id":"CruelConfinement","ko":"잔혹한 속박","en":"Cruel Limits","d":"발전기가 완료될 때마다:<ul><li>당신은 모든 창문의 오라를 20/25/30초 동안 볼 수 있다.<\/li><li>모든 창문이 20/25/30초 동안 생존자에게 차단된다.<\/li><\/ul>","o":"Demogorgon"},{"c":"sp","id":"Dance_with_me","ko":"나와 함께 춤을","en":"Dance With Me","d":"빠르게 캐비닛을 나오거나, 중간 또는 빠른 뛰어넘기를 수행하면, 5초 동안 발자국을 남기지 않는다. 재사용 대기 시간: 25/20/15초.","o":"Kate"},{"c":"sp","id":"Dark_Sense","ko":"어두운 감각","en":"Dark Sense","d":"발전기 수리가 완료될 때마다, 당신으로부터 24미터 내에 살인마가 들어오면, 당신은 살인마의 오라를 5/7/10초 동안 볼 수 있다."},{"c":"kp","id":"DarkDevotion","ko":"어둠의 헌신","en":"Dark Devotion","d":"집착 대상이 피해를 입을 때마다, 35/40/45초 동안:<ul><li>당신의 공포 범위가 40미터로 설정된다.<\/li><li>집착 대상은 공포 범위를 가진다.<\/li><li><b>감지 불가능<\/b> 효과를 가진다.<\/li><\/ul>","o":"Plague"},{"c":"sp","id":"DeadHard","ko":"죽기살기","en":"Dead Hard","d":"갈고리에서 구출될 때마다, 부상 상태거나 달리기를 수행할 때, <b>능력 활성화<\/b> 버튼 사용 시:<ul><li>0.5초 동안 <b>인내<\/b> 효과를 얻는다.<\/li><li>60/50/40초 동안 <b>탈진<\/b>에 걸린다.<\/li><\/ul>","o":"Smoke"},{"c":"kp","id":"DeadMansSwitch","ko":"차단 스위치","en":"Dead Man’s Switch","d":"생존자를 갈고리에 걸 때마다, 생존자 한 명이 처음으로 발전기 수리를 멈추면, 25/30/35초 동안 차단된다. 재사용 대기 시간: 25/30/35초.","o":"Gunslinger"},{"c":"kp","id":"Deathbound","ko":"죽음 결속","en":"Deathbound","d":"생존자가 다른 생존자를 치료하기 완료할 때마다, 치유자는 비명을 지른다. 그런 다음, 치유자가 피해를 입을 때까지, 치료된 생존자로부터 최소 12/8/4미터 멀리 있으면:<li>치유자는 <b>인지 불가능<\/b>에 걸린다.<\/li><li>치유가는 치료된 생존자의 오라를 볼 수 있다.<\/li><br><br>해당 효과는 한 번에 한 명의 생존자에게만 적용된다.","o":"K20"},{"c":"sp","id":"DecisiveStrike","ko":"결정적인 일격","en":"Decisive Strike","d":"모든 발전기가 수리될 때까지, 갈고리에서 탈출할 때마다, 다음 40/50/60초 안에 살인마가 당신을 들어올리면, 희생제 동안 한 번, 특별 스킬 체크에 성공하여:<ul><li>살인마를 4초 동안 기절시킨다.<\/li><li>생존자는 집착 대상이 된다.<\/li><\/ul><br><br>뚜렷한 액션에 의해 해제된다. 희생제 시작 시, 집착 대상이 될 가능성이 높다.","o":"Laurie"},{"c":"kp","id":"Deerstalker","ko":"사슴 사냥꾼","en":"Deerstalker","d":"40/35/30초 마다, 가장 낮은 추격 시간을 보유한 생존자는 3초 동안 당신의 오라를 볼 수 있다.<br><br>생존자가 당신의 오라를 보는 동안, 당신도 그들의 오라를 볼 수 있다."},{"c":"sp","id":"Deja_Vu","ko":"데자뷰","en":"Deja Vu","d":"서로에게 가장 가까운 3 발전기의 오라를 볼 수 있으며, 해당 발전기들을 4/5/6% 더 빠르게 수리한다."},{"c":"sp","id":"Deliverance","ko":"구조","en":"Deliverance","d":"다른 생존자를 갈고리에서 안전에게 구출하면, 희생제마다 한 번씩, 스스로 갈고리에서 탈출할 수 있다. 해당 방법으로 갈고리에서 스스로 탈출하면, 160/140/120초 동안 <b>치료 불능<\/b>에 걸린다.","o":"Adam"},{"c":"sp","id":"DesperateMeasures","ko":"필사의 조치","en":"Desperate Measures","d":"부상, 빈사 상태, 또는 갈고리에 걸린 생존자 한 명마다:<ul><li>당신은 16/18/20% 더 빠르게 회복한다.<\/li><li>당신은 16/18/20% 더 빠르게 갈고리 구출을 수행한다.<\/li><\/ul>","o":"S23"},{"c":"sp","id":"DetectivesHunch","ko":"형사의 직감","en":"Detective's Hunch","d":"발전기 수리가 완료될 때마다, 당신으로부터 32/48/64미터 범위에서 20초 동안:<ul><li>당신은 상자의 오라를 볼 수 있다.<\/li><li>당신은 발전기의 오라를 볼 수 있다.<\/li><li>당신은 토템의 오라를 볼 수 있다.<\/li><\/ul>","o":"Eric"},{"c":"kp","id":"Discordance","ko":"불협화음","en":"Discordance","d":"당신으로부터 64/96/128미터 범위 내에서 최소 생존자 2명 이상이 발전기를 수리할 때마다, 알림을 받는다.<br><br>생존자 2명 이상이 해당 발전기를 수리하는 동안, 발전기의 오라가 드러난다. 해당 효과는 최소 2명 이상의 생존자가 수리하지 않을 때, 4초 후 종료된다.","o":"Legion"},{"c":"sp","id":"Distortion","ko":"뒤틀림","en":"Distortion","d":"희생제가 시작되고 15초 동안 추격을 당하면, 토큰 1개를 획득하며, 최대 2개를 획득한다.<br><br>빈사 상태가 아닌 경우, 살인마가 당신의 오라를 확인할 시도를 할 때마다 토큰 1개를 소비한다. 그런 다음, 다음 8/10/12초 동안:<ul><li>살인마는 당신의 오라를 볼 수 없다.<\/li><li>당신은 발자국을 남기지 않는다.<\/li><\/ul>","o":"Jeff"},{"c":"kp","id":"Distressing","ko":"비참함","en":"Distressing","d":"공포 범위가 20/25/30% 더 커진다."},{"c":"sp","id":"Diversion","ko":"교란","en":"Diversion","d":"살인마의 공포 범위에서 20초 동안 숨은 후, 웅크리고 유휴 상태에서 <b>능력 활성화<\/b> 버튼을 사용해 30/25/20미터 멀리 돌맹이를 던지면:<ul><li>살인마에게 알림이 간다.<\/li><li>돌맹이는 자국을 남긴다.<\/li><\/ul>","o":"Adam"},{"c":"kp","id":"DragonsGrip","ko":"드래곤의 손아귀","en":"Dragon’s Grip","d":"발전기를 손상시킬 때마다, 다음 30초 동안 해당 발전기를 수리하는 첫 번째 생존자는:<ul><li>그들은 비명을 지르며, 그런 다음 4초 동안 해당 생존자의 위치가 당신에게 전달된다.<\/li><li>60초 동안 <b>약점 노출<\/b>에 걸린다.<\/li><\/ul><br><br>재사용 대기 시간: 60/45/30초.","o":"K21"},{"c":"kp","id":"Dying_Light","ko":"꺼져 가는 빛","en":"Dying Light","d":"집착 대상이 아닌 생존자를 갈고리에 걸 때마다, 토큰 1개를 획득한다.<br><br>집착 대상이 아직 살아 있는 동안, 각 토큰마다:<ul><li>다른 생존자들은 2/2.5/3% 더 느리게 치료한다.<\/li><li>다른 생존자들은 2/2.5/3% 더 느리게 수리한다.<\/li><li>다른 생존자들은 갈고리에 2/2.5/3% 더 느리게 파괴 공작을 수행한다.<\/li><\/ul><br><br>집착 대상은:<ul><li>다른 생존자들을 33% 더 빠르게 치료한다.<\/li><li>다른 생존자들을 33% 더 빠르게 갈고리에서 구출한다.<\/li><\/ul>","o":"Shape"},{"c":"sp","id":"Empathy","ko":"공감","en":"Empathy","d":"64/96/128미터 범위 내에서 당신은 부상 상태의 생존자의 오라를 볼 수 있다.","o":"Claudette"},{"c":"kp","id":"Enduring","ko":"인내심","en":"Enduring","d":"생존자를 옮기지 않는 동안, 판자로 인한 기절 시간이 40/45/50% 짧아진다.","o":"HillBilly"},{"c":"kp","id":"FireUp","ko":"격분","en":"Fire Up","d":"발전기 수리를 완료할 때마다, 토큰 1개를 획득하고, 최대 5개를 획득할 수 있다.<br><br>각 토큰마다:<ul><li>당신은 판자와 부서지기 쉬운 문 4/5/6% 더 빠르게 부순다.<\/li><li>당신은 발전기를 4/5/6% 더 빠르게 손상시킨다.<\/li><li>당신은 생존자를 4/5/6% 더 빠르게 들어올리고 떨어뜨린다.<\/li><li>당신은 4/5/6% 더 빠르게 창문을 뛰어넘는다.<\/li><\/ul>","o":"Nightmare"},{"c":"sp","id":"Fixated","ko":"시선 고정","en":"Fixated","d":"걷고 있을 때, 10/15/20%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<br><br>자신의 발자국을 볼 수 있다.","o":"Nancy"},{"c":"sp","id":"FlipFlop","ko":"뒤집기","en":"Flip-Flop","d":"빈사 상태일 때 살인마가 당신을 들어올릴 때마다, 회복 진행도의 50%가 몸부림 진행도에 더해지며, 이는 최대 40/45/50%가 된다.","o":"Ash"},{"c":"kp","id":"ForcedPenance","ko":"강압 받은 속죄","en":"Forced Penance","d":"생존자가 보호 타격을 입을 때마다, 생존자들은 60/70/80초 동안 <b>치료 불능<\/b>에 걸린다.","o":"K20"},{"c":"sp","id":"ForThePeople","ko":"국민을 위하여","en":"For the People","d":"건강한 상태에서, 구급상자 없이 다른 생존자를 치료할 때: <b>능력 활성화<\/b> 버튼을 사용하면 즉시 치료된다:<ul><li>당신은 피해를 입니다.<\/li><li>80/70/60초 동안 <b>치료 불능<\/b>에 걸린다.<\/li><li>집착 대상이 된다.<\/li><\/ul><br><br>희생제가 시작되면, 집착 대상이 될 가능성이 낮다.","o":"Zarina"},{"c":"kp","id":"FranklinsLoss","ko":"프랭클린의 죽음","en":"Franklin's Demise","d":"기본 공격으로 생존자에게 피해를 입힐 때마다, 생존자는 아이템을 떨어뜨린다.<br><br>당신은 32/48/64미터 내에서, 드롭된 아이템의 오라를 볼 수 있다.","o":"Cannibal"},{"c":"kp","id":"FurtiveChase","ko":"은밀한 추격","en":"Furtive Chase","d":"집착 대상을 갈고리에 걸 때마다:<ul><li>당신은 14/16/18초 동안 10%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>당신은 14/16/18초 동안 <b>감지 불가능<\/b> 효과를 얻는다.<\/li><\/ul><br><br>집착 대상이 갈고리에서 구출될 때마다, 구출한 생존자가 집착 대상이 된다.","o":"Ghostface"},{"c":"kp","id":"Gearhead","ko":"기어 헤드","en":"Gearhead","d":"생존자가 피해를 입을 때마다, 다음 30초 동안, 그리고 생존자가 발전기 수리 도중 기본 스킬 체크에 성공하면, 당신은 그들의 오라를 6/7/8초 동안 볼 수 있다.","o":"Gunslinger"},{"c":"kp","id":"GeneratorOvercharge","ko":"과충전","en":"Overcharge","d":"발전기에 손상을 입힐 때마다:<ul><li>퇴보 속도가 30초 이상 85%에서 130%로 증가한다.<\/li><li>다음으로 발전기를 수리하는 생존자는 특별 스킬 체크 기회를 얻게 된다. 실패 시, 진행도를 2/3/4% 더 잃는다.<\/li><\/ul>","o":"Killer07"},{"c":"kp","id":"HangmansTrick","ko":"재앙의 갈고리: 집행인의 손재주","en":"Scourge Hook: Hangman's Trick","d":"희생제가 시작되면, 4개의 무작위 갈고리가 재앙의 갈고리가 된다.<br><br>생존자를 옮기는 동안, 재앙의 갈고리로부터 12/14/16미터 내에 생존자의 오라를 볼 수 있다.<br><br>생존자가 갈고리에 파괴 공작을 수행하기 시작하면, 살인마에게 알림이 간다.","o":"Pig"},{"c":"sp","id":"HeadOn","ko":"정면충돌","en":"Head On","d":"캐비닛에 3초 동안 은신한 다음, 만약 2.5미터 내에 있으면, 빠르게 캐비닛을 나와 살인마를 3초 동안 기절시키고, 60/50/40초 동안 <b>탈진<\/b>에 걸린다.","o":"Jane"},{"c":"kp","id":"Hex_Devour_Hope","ko":"주술: 삼켜지는 희망","en":"Hex: Devour Hope","d":"희생제가 시작되면, 일반 토템에 불이 붙는다.<br><br>당신이 최소 24미터 범위 외에 있을 때, 생존자가 갈고리에서 탈출할 때마다, 토큰 1개를 획득하고, 최대 5개를 획득할 수 있다:<ul><li>토큰 2개 | 생존자를 갈고리에 걸고 10초 후, 10초 동안 3/4/5%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>토큰 3개 | 생존자들이 <b>약점 노출<\/b>에 걸린다.<\/li><li>토큰 5개 | 생존자를 살해할 수 있다.<\/li><\/ul>","o":"Witch"},{"c":"kp","id":"Hex_HauntedGround","ko":"주술: 원혼이 깃든 대지","en":"Hex: Haunted Ground","d":"희생제가 시작되면, 일반 토템 2개에 불이 붙는다.<br><br>주술 토템 중 하나가 축복 또는 정화되면:<ul><li>모든 생존자는 40/50/60초 동안 <b>약점 노출<\/b>에 걸린다.<\/li><li>다른 토템의 불이 꺼진다.<\/li><\/ul>","o":"Spirit"},{"c":"kp","id":"Hex_HuntressLullaby","ko":"주술: 사냥꾼의 자장가","en":"Hex: Huntress Lullaby","d":"희생제가 시작되면, 일반 토템에 불이 붙는다.<br><br>생존자를 갈고리에 걸 때마다, 토큰 1개를 획득한다. 토큰 개마다, 기본 스킬 체크 경고가 늦게 표시되며 스킬 체크 성공 구역이 작아진다.<br><br>토큰 <b>5<\/b>개를 모으면, 기본 스킬 체크 경고가 표시되지 않는다.<br><br>생존자가 기본 스킬 체크에 실패할 때마다, 2/4/6%의 진행도를 더 잃는다.","o":"Bear"},{"c":"kp","id":"Hex_Ruin","ko":"주술: 파멸","en":"Hex: Ruin","d":"희생제가 시작되면, 일반 토템에 불이 붙는다.<br><br>발전기가 수리되고 있지 않는 동안, 발전기는 100/125/150%의 속도로 퇴보된다.","o":"Witch"},{"c":"kp","id":"Hex_The_Third_Seal","ko":"주술: 제3의 봉인","en":"Hex: The Third Seal","d":"희생제가 시작되면, 일반 토템에 불이 붙는다.<br><br>생존자에게 피해를 입힐 때마다, 그들은 <b>실명<\/b>에 걸린다.<br><br>해당 효과는 최대 2/3/4명의 생존자에게 적용된다.","o":"Witch"},{"c":"kp","id":"Hex_Thrill_Of_The_Hunt","ko":"주술: 사냥의 전율","en":"Hex: Thrill of the Hunt","d":"희생제가 시작되면, 일반 토템에 불이 붙는다.<br><br>남은 일반 및 주술 토템 하나마다, 1개의 토큰을 보유하게 된다.<br><br>보유한 각 토큰마다, 생존자는 8/9/10% 느리게 토템을 축복하고 정화한다."},{"c":"kp","id":"HexBloodFavor","ko":"주술: 피의 호의","en":"Hex: Blood Favor","d":"희생제가 시작되면, 일반 토템에 불이 붙는다.<br><br>생존자에게 피해를 입힐 때마다, 그들로부터 24/28/32미터 내에 있는 똑바로 선 판자는 15초 동안 차단된다.","o":"K21"},{"c":"kp","id":"HexRetribution","ko":"주술: 응징","en":"Hex: Retribution","d":"희생제가 시작되면, 일반 토템에 불이 붙는다.<br><br>생존자가 토템을 축복 또는 정화시키기 시작하면, 40/50/60초 동안 <b>인지 불가능<\/b>에 걸린다.<br><br>주술 토템이 축복 또는 정화되면, 당신은 모든 생존자의 오라가 20초 동안 볼 수 있다.","o":"Gunslinger"},{"c":"kp","id":"HexUndying","ko":"주술: 불멸","en":"Hex: Undying","d":"희생제가 시작되면, 일반 토템에 불이 붙는다.<br><br>다른 주술 토템이 축복을 받거나 정화되면, 일반 토템은 이것으로 교체되며, 보유했던 모든 토큰을 계속 보유할 수 있다.<br><br>일반 토템으로부터 2/3/4미터 내 생존자의 오라를 볼 수 있다.","o":"K21"},{"c":"sp","id":"Hope","ko":"희망","en":"Hope","d":"모든 발전기가 완료되면, 3/4/5%의 <b>이동 속도 증가<\/b> 효과를 얻는다."},{"c":"kp","id":"ImAllEars","ko":"밝은 귀","en":"I'm All Ears","d":"생존자가 당신으로부터 48미터 범위 내에서 빠른 진입 또는 빠른 퇴장을 수행하거나, 중간 또는 빠른 뛰어넘기를 수행하면, 그들의 오라가 8초 동안 드러난다. 재사용 대기 시간: 60/45/30초.","o":"Ghostface"},{"c":"kp","id":"InfectiousFright","ko":"전염성 공포","en":"Infectious Fright","d":"생존자가 빈사 상태에 빠질 때마다, 공포 범위 내에 있는 생존자들은 4/5/6초 동안 비명을 지르며, 알림이 전달된다.","o":"Plague"},{"c":"sp","id":"InnerStrength","ko":"내면의 힘","en":"Inner Strength","d":"부상 상태 및 <b>치료 불능<\/b>에 걸리지 않은 상태에서 토템을 정화할 때마다, 10/9/8초 동안 캐니빗에 은신하면, 당신은 즉시 건강한 상태가 된다.","o":"Nancy"},{"c":"kp","id":"Insidious","ko":"기만","en":"Insidious","d":"3/2/1초 동안 유휴 상태가 되면, 행동하기 전까지 <b>감지 불가능<\/b> 효과를 얻는다."},{"c":"kp","id":"InTheDark","ko":"때려눕히기","en":"Knock Out","d":"생존자가 판자를 떨어뜨릴 때마다, 다음 6초 동안, 판자로부터 6미터 떨어진다면, 그들은 3/4/5초 동안 5% <b>이동 속도 감소<\/b>에 걸린다.","o":"Cannibal"},{"c":"kp","id":"Iron_Grasp","ko":"강철의 손아귀","en":"Iron Grasp","d":"생존자를 옮기는 동안:<ul><li>생존자는 4/8/12% 더 느리게 몸부림친다.<\/li><li>몸부림의 강도가 75% 더 약해진다.<\/li><\/ul>"},{"c":"sp","id":"Iron_Will","ko":"굳건한 의지","en":"Iron Will","d":"부상 상태지만 <b>탈진<\/b>에 걸린 것이 아니라면, 고통으로 인한 신음 소리가 80/90/100% 더 조용하다.","o":"Jake"},{"c":"kp","id":"Ironmaiden","ko":"아이언 메이든","en":"Iron Maiden","d":"생존자가 캐비닛을 나갈 때마다:<ul><li>생존자는 30초 동안 <b>약점 노출<\/b>에 걸린다.<\/li><li>생존자는 비명을 지르고, 그런 다음 4초 동안 당신에게 그들의 위치가 전달된다.<\/li><\/ul><br><br>캐비닛을 30/40/50% 더 빠르게 연다.","o":"Legion"},{"c":"kp","id":"K22P01","ko":"호더","en":"Hoarder","d":"희생제가 시작되면, 2개의 상자가 더 나타난다.<br><br>생존자가 아이템을 줍거나 당신으로부터 32/48/64미터 이내에 상자를 열기 시작하면, 알림이 전달된다.","o":"K22"},{"c":"kp","id":"K22P02","ko":"억압","en":"Oppression","d":"발전기를 손상시킬 때마다, 최대 4대의 다른 발전기가 퇴보하기 시작한다. 이를 수리하는 생존자들은 특수 스킬 체크를 얻는다. 재사용 대기 시간: 45/40/35초.","o":"K22"},{"c":"kp","id":"K22P03","ko":"최후의 일격","en":"Coup de Grâce","d":"발전기 수리를 완료할 때마다, 토큰 2개를 획득하고, 최대 5개를 획득할 수 있다.<br><br>돌진 공격을 수행할 때마다, 토큰 1개를 소비해 돌진 시간이 70/75/80% 길어진다.","o":"K22"},{"c":"kp","id":"K23P01","ko":"덕통사고","en":"Starstruck","d":"생존자를 옮기는 동안, 공포 범위 내에 있는 생존자들은 <b>약점 노출<\/b>에 걸린다. 이는 다음 상황이 생기고 26/28/30초 후 종료된다:<ul><li>생존자가 공포 범위를 떠날 때.<\/li><li>살인마가 들쳐 엎은 생존자를 떨어뜨리거나 갈고리에 걸었을 때.<\/li><\/ul><br><br>재사용 대기 시간: 60초.","o":"K23"},{"c":"kp","id":"K23P02","ko":"주술: 군중 통제","en":"Hex: Crowd Control","d":"생존자가 처음으로 중간 또는 빠른 창문 뛰어넘기를 수행하면, 일반 토템에 불이 붙는다.<br><br>생존자가 마지막으로 중간 또는 빠르게 뛰어넘은 창문 4/5/6개는 차단된다.<br><br>당신은 차단된 창문을 15% 더 빠르게 뛰어넘는다.<br><br>당신은 24미터 내에 차단된 창문의 오라를 볼 수 있다.","o":"K23"},{"c":"kp","id":"K23P03","ko":"출구 없음","en":"No Way Out","d":"각 생존자를 처음으로 갈고리에 걸면, 토큰 1개를 획득한다.<br><br>모든 발전기의 수리가 완료되어, 생존자가 출구를 열기 시작할 때:<ul><li>출구는 12초 동안 차단되며, 토큰 1개당 6/9/12초씩 차단이 지속된다.<\/li><li>당신에게 알림이 간다.<\/li><\/ul>","o":"K23"},{"c":"kp","id":"K24P01","ko":"치명적인 추적자","en":"Lethal Pursuer","d":"희생제가 시작되면, 당신은 7/8/9초 동안 모든 생존자들의 오라를 볼 수 있다.<br><br>한정 기간 동안 생존자의 오라를 볼 때마다, 해당 효과는 2초 더 길게 유지된다.","o":"K24"},{"c":"kp","id":"K24P02","ko":"히스테리","en":"Hysteria","d":"건강한 상태의 생존자가 부상을 입을 때마다, 모든 부상 상태의 생존자들은 30/35/40초 동안 <b>인지 불가능<\/b>에 걸린다. 재사용 대기 시간: 20초.","o":"K24"},{"c":"kp","id":"K24P03","ko":"폭발","en":"Eruption","d":"발전기를 손상시킬 때마다, 생존자를 빈사 상태로 만들면, 다음 방법으로 모든 발전기가 손상된다:<ul><li>폭발 후, 10%의 진행도를 잃고 퇴보하기 시작한다.<\/li><li>손상된 발전기를 수리하는 생존자는 비명을 지르며, 당신은 8/10/12초 동안 그들의 오라를 볼 수 있다.<\/li><\/ul><br><br>재사용 대기 시간: 30초.","o":"K24"},{"c":"kp","id":"K25P01","ko":"교착 상태","en":"Deadlock","d":"발전기 수리가 완료될 때마다, 가장 많이 진행된 발전기가 15/20/25초 동안 차단된다.","o":"K25"},{"c":"kp","id":"K25P02","ko":"주술: 노리개","en":"Hex: Plaything","d":"각 생존자를 처음으로 갈고리에 걸면, 그들은 주술에 걸리며 일반 토템에 불이 붙는다.<br><br>90초 동안, 다른 생존자에게는 해당 주술 토템이 차단된다.<br><br>주술에 걸린 생존자들은:<br><br><ul><li><b>인지 불가능<\/b>에 걸린다.<\/li><li>주술 토템으로부터 24/20/16미터 범위 내에 들어오면, 주술 토템의 오라가 드러난다.<\/li><\/ul>","o":"K25"},{"c":"kp","id":"K25P03","ko":"재앙의 갈고리: 고통의 선물","en":"Scourge Hook: Gift of Pain","d":"희생제가 시작되면, 4개의 무작위 갈고리가 재앙의 갈고리가 된다.<br><br>생존자가 재앙의 갈고리에서 구출될 때마다:<ul><li>90초 동안 <b>출혈<\/b>에 걸린다.<\/li><li>90초 동안 <b>근육 손상<\/b>에 걸린다.<\/li><li>생존자가 치료되면, 피해를 입을 때까지, 10/13/16% 더 느리게 치료 및 수리한다.<\/li><\/ul>","o":"K25"},{"c":"kp","id":"K26P01","ko":"암울한 수용","en":"Grim Embrace","d":"생존자를 처음으로 갈고리에 걸 때마다, 토큰 1개를 획득한다.<br><br>갈고리에 걸린 생존자로부터 16미터 떨어지면, 모든 발전기들이 6/8/10초 동안 차단된다.<br><br>4개의 토큰을 보유했을 때, 갈고리에 걸린 생존자로부터 16미터 떨어지면:<ul><li>모든 발전기는 40초 동안 차단된다.<\/li><li>집착 대상의 오라가 10초 동안 드러난다.<\/li><\/ul>","o":"K26"},{"c":"kp","id":"K26P02","ko":"재앙의 갈고리: 고통의 울림","en":"Scourge Hook: Pain Resonance","d":"희생제가 시작되면:<ul><li>무작위 갈고리 4개가 재앙의 갈고리가 된다.<\/li><li>당신은 토큰 4개를 획득한다.<\/li><\/ul><br><br>재앙의 갈고리에 각 생존자를 처음으로 걸면, 토큰 1개를 소비한 후, 가장 큰 진행도를 가진 발전기는 다음이 된다:<ul><li>폭발하고 10/15/20%의 진행도를 잃으며, 퇴보하기 시작한다.<\/li><li>해당 발전기를 수리하는 생존자는 비명을 지르기 시작한다.<\/li><\/ul>","o":"K26"},{"c":"kp","id":"K26P03","ko":"주술: 펜티멘토","en":"Hex: Pentimento","d":"정화된 토템의 오라를 볼 수 있으며, 각각의 토템을 한 번씩 다시 소생할 수 있다.<br><br>생존자는 16미터 내에 있는 소생된 토템들의 오라를 볼 수 있다.<br><br>토템이 소생되는 동안, 생존자는 20% 더 느리게 치료하고 수리한다. 또한, 소생된 추가 토템마다 1/2/3%가 추가된다.<br><br>단 한 번에 모든 토템 5개가 소생되면, 차단된다.","o":"K26"},{"c":"kp","id":"K27P01","ko":"재앙의 갈고리: 분노의 홍수","en":"Scourge Hook: Floods of Rage","d":"희생제가 시작되면, 4개의 무작위 갈고리가 재앙의 갈고리가 된다.<br><br>생존자가 재앙의 갈고리에서 구출될 때마다, 5/6/7초 동안 다른 생존자의 오라를 볼 수 있게 된다.","o":"K27"},{"c":"kp","id":"K27P02","ko":"소금물의 부름","en":"Call of Brine","d":"발전기를 손상시킬 때마다, 90초 동안 30/40/50% 더 빠르게 퇴보된다.<br><br>해당 시간에 생존자가 해당 발전기를 수리하는 동안 일반 스킬 체크 성공을 거두면, 알림을 받는다.","o":"K27"},{"c":"kp","id":"K27P03","ko":"무자비한 태풍","en":"Merciless Storm","d":"각 발전기가 최초로 90%의 진행도에 도달하면: 해당 발전기를 수리하는 생존자는 특별 스킬 체크 기회를 얻는다. 이러한 특별 스킬 체크 중 하나를 실패하거나 수리를 멈추면, 해당 발전기는 16/18/20초 동안 차단된다.","o":"K27"},{"c":"kp","id":"K28P01","ko":"소멸","en":"Dissolution","d":"생존자가 피해를 입고 3초 후, 다음 12/16/20초 동안 생존자가 공포 범위에 있는 동안 판자를 빠르게 뛰어 넘으면, 판자는 파괴된다.","o":"K28"},{"c":"kp","id":"K28P02","ko":"드러난 어둠","en":"Darkness Revealed","d":"캐비닛을 탐색할 때마다, 당신은 캐비닛으로부터 8미터 내에서 모든 생존자의 오라를 6/7/8초 동안 볼 수 있다. 재사용 대기 시간: 30초.","o":"K28"},{"c":"kp","id":"K28P03","ko":"패혈성 손길","en":"Septic Touch","d":"공포 범위 내에 있는 생존자가 치료하고 있는 동안:<ul><li>생존자들은 <b>실명<\/b>에 걸린다.<\/li><li>생존자들은 <b>탈진<\/b>에 걸린다.<\/li><\/ul><br><br>치료를 중단하면, 20/25/30초 후 효과는 종료된다.","o":"K28"},{"c":"kp","id":"K29P01","ko":"우월한 신체","en":"Superior Anatomy","d":"당신으로부터 12미터 범위 내에서 생존자가 빠른 뛰어넘기를 수행하면 다음 기본 뛰어넘기에 30/35/40% 더 빠르게 창문을 뛰어넘는다. 재사용 대기 시간: 25초.","o":"K29"},{"c":"kp","id":"K29P02","ko":"깨어난 자각","en":"Awakened Awareness","d":"생존자를 옮기는 동안, 당신으로부터 16/18/20미터 내에 있는 다른 생존자들의 오라를 볼 수 있다.","o":"K29"},{"c":"kp","id":"K29P03","ko":"종착역","en":"Terminus","d":"모든 발전기 수리가 완료되면, 모든 부상 상태와 빈사 상태, 그리고 갈고리에 걸린 생존자는 <b>치료 불능<\/b>에 걸린다.<br><br>출구에 전원이 들어오면, 해당 효과는 35/40/45초 후 종료된다.","o":"K29"},{"c":"kp","id":"K30P01","ko":"숨을 곳 없음","en":"Nowhere to Hide","d":"발전기를 손상시킬 때마다, 발전기로부터 24미터 내에 생존자들의 오라를 3/4/5초 동안 볼 수 있다.","o":"K30"},{"c":"kp","id":"K30P02","ko":"주술: 어둠을 마주하라","en":"Hex: Face the Darkness","d":"생존자에게 피해를 입힐 때마다, 그들은 주술에 걸리며 일반 토템에는 불이 붙는다.<br><br>35/30/25초마다, 공포 범위 밖에 있는 다른 생존자는 비명을 지른다. 그런 다음, 그들의 오라가 2초 동안 드러난다.<br><br>주술에 걸린 생존자가 빈사 상태가 되거나 회복하는 경우, 주술 토템의 불이 꺼진다.","o":"K30"},{"c":"kp","id":"K30P03","ko":"자만심","en":"Hubris","d":"생존자에 의해 기절할 때마다, 생존자들은 20/25/30초 동안 <b>약점 노출<\/b>에 걸린다. 재사용 대기 시간: 20초.","o":"K30"},{"c":"kp","id":"K31P01","ko":"시작된 게임","en":"Game Afoot","d":"집착 대상을 추격하는 동안, 기본 파괴 공격으로 판자 또는 부서지기 쉬운 문을 부수거나 발전기에 손상을 입힐 때마다, 8/9/10초 동안 7%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<br><br>기본 공격으로 가장 많은 추격 시간을 가진 생존자에게 피해를 줄 때마다, 그들은 집착 대상이 된다.","o":"K31"},{"c":"kp","id":"K31P02","ko":"강타!","en":"THWACK!","d":"희생제가 시작되면, 토큰 3개를 획득하며, 최대 3개를 획득할 수 있다.<br><br>생존자를 갈고리에 걸 때마다, 토큰 1개를 획득한다.<br><br>파괴 공격으로 판자 또는 부서지기 쉬운 문을 부술 때마다, 토큰 1개를 소비한 후, 36미터 내 모든 생존자들은 비명을 지르며, 생존자들의 오라가 4/5/6초 동안 드러난다.","o":"K31"},{"c":"kp","id":"K31P03","ko":"레버리지","en":"Leverage","d":"생존자가 다른 생존자를 갈고리에서 구출하거나 스스로 갈고리에서 탈출할 때마다, 해당 생존자들은 60초 동안 20/25/30% 더 느리게 치료된다.","o":"K31"},{"c":"kp","id":"K32P01","ko":"유전자적 한계","en":"Genetic Limits","d":"생존자가 피해를 입을 때마다, 생존자들은 6/7/8초 동안 <b>탈진<\/b>에 걸린다.","o":"K32"},{"c":"kp","id":"K32P02","ko":"강압 받은 망설임","en":"Forced Hesitation","d":"생존자를 빈사 상태로 만들 때마다, 빈사 상태가 된 생존자로부터 16미터 범위 내에 다른 생존자들은 10초 동안 20%의 <b>이동 속도 감소<\/b> 효과에 걸린다. 재사용 대기 시간: 40/35/30초.","o":"K32"},{"c":"kp","id":"K32P03","ko":"머신 러닝","en":"Machine Learning","d":"발전기를 손상시킬 때마다, 발전기는 위태로운 상태가 된다.<br><br>해당 발전기의 수리가 생존자에 의해 완료되면:<ul><li>40/50/60초 동안 8%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>40/50/60초 동안 <b>감지 불가능<\/b> 효과를 얻는다.<\/li><\/ul><br><br>한번에 단 한 대의 발전기만 위태로운 상태가 될 수 있다.","o":"K32"},{"c":"kp","id":"K33P01","ko":"궁극의 무기","en":"Ultimate Weapon","d":"캐비닛을 탐색할 때마다, 40미터 내에 생존자는:<ul><li>30초 동안 <b>실명<\/b>에 걸린다.<\/li><li>비명을 지른다.<\/li><\/ul><br><br>재사용 대기 시간: 55/50/45초.","o":"K33"},{"c":"kp","id":"K33P02","ko":"빠른 잔혹함","en":"Rapid Brutality","d":"기본 공격으로 생존자에게 피해를 입혔을 때마다, 8/9/10초 동안 5%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<br><br>생존자를 추격하는 동안, 분노 효과를 얻을 수 없다.","o":"K33"},{"c":"kp","id":"K33P03","ko":"에이리언의 직감","en":"Alien Instinct","d":"생존자를 갈고리에 걸 때마다, 가장 멀리 있는 부상 상태의 생존자는:<ul><li>40/50/60초 동안 <b>인지 불가능<\/b>에 걸린다.<\/li><li>그들의 오라가 8초 동안 드러난다.<\/li><\/ul>","o":"K33"},{"c":"kp","id":"K34P01","ko":"주술: 같이 놀자","en":"Hex: Two Can Play","d":"주술이 일반 토템일 때, 생존자에 의해 4/3/2회 실명 또는 기절 상태가 될 때마다, 일반 토템에 불이 붙는다.<br><br>당신이 둘러메고 있는 생존자가 아닌 다른 생존자에 의해 실명 또는 기절 상태가 될 때마다, 그들은 1.5초 동안 실명 상태가 된다.","o":"K34"},{"c":"kp","id":"K34P02","ko":"영원한 친구","en":"Friends ‘Til the End","d":"집착 대상이 아닌 생존자를 갈고리에 걸 때마다:<ul><li>집착 대상은 20초 동안 <b>약점 노출<\/b>에 걸린다.<\/li><li>집착 대상의 오라가 6/8/10초 동안 드러난다.<\/li><\/ul><br><br>집착 대상을 갈고리에 걸 때마다, 다른 생존자는:<ul><li>비명을 지른 후, 알림이 간다.<\/li><li>집착 대상이 된다.<\/li><\/ul>","o":"K34"},{"c":"kp","id":"K34P03","ko":"건전지 포함","en":"Batteries Included","d":"수리가 완료된 발전기로부터 16미터 범위에서, 당신은 5%의 <b>이동 속도 증가<\/b>효과를 얻는다. 해당 범위를 벗어난 후 1/3/5초 후 효과를 종료된다.","o":"K34"},{"c":"kp","id":"K35P01","ko":"해방","en":"Unbound","d":"건강한 상태의 생존자가 부상 상태가 되면, 그 다음 24/27/30초 동안, 당신이 창문 기본 뛰어넘기를 수행할 때마다, 10초 동안 7%의 <b>이동 속도 증가<\/b> 효과를 얻는다.","o":"K35"},{"c":"kp","id":"K35P02","ko":"불의","en":"Unforeseen","d":"발전기를 손상시킬 때마다:<ul><li>공포 범위가 22/26/30초 동안 해당 발전기로 설정되며, 범위는 32미터가 된다.<\/li><li>해당 시간 동안 <b>감지 불가능<\/b> 효과를 얻는다.<\/li><\/ul><br><br>재사용 대기 시간: 30초.","o":"K35"},{"c":"kp","id":"K35P03","ko":"대실패","en":"Undone","d":"생존자가 일반 스킬 체크에 실패할 때마다, 토큰 3개를 획득하고, 최대 18/24/30개를 획득할 수 있다.<br><br>발전기를 손상시킬 때마다, 모든 토큰을 소비한다. 소비한 토큰 수에 따라:<ul><li>해당 발전기는 진행도 1%를 잃는다.<\/li><li>1초 동안 차단된다.<\/li><\/ul><br><br>발전기의 차단이 해제되면, 퇴보되기 시작한다. 재사용 대기 시간: 60초.","o":"K35"},{"c":"kp","id":"K36P01","ko":"조율 엮기","en":"Weave Attunement","d":"처음으로 각 아이템이 고갈되면, 아이템이 드롭된다.<br><br>드롭된 아이템으로부터 12미터 내에 있는 생존자의:<ul><li>오라가 드러난다.<\/li><li>아이템 오라가 드러난다.<\/li><\/ul><br><br>생존자가 아이템을 주울 때마다, 20/25/30초 동안 <b>인지 불가능<\/b>에 걸린다.","o":"K36"},{"c":"kp","id":"K36P02","ko":"힘없는 손길","en":"Languid Touch","d":"당신으로부터 36미터 범위에 있는 생존자가 까마귀를 내쫓을 때마다, 6/8/10초 동안 <b>탈진<\/b>에 걸린다. 재사용 대기 시간: 5초.","o":"K36"},{"c":"kp","id":"K36P03","ko":"어둠의 오만함","en":"Dark Arrogance","d":"창문 기본 뛰어넘기를 15/20/25% 더 빠르게 수행한다.<br><br>실명 상태가 되거나 판자에 의해 기절할 때마다 지속 시간이 15% 증가한다.","o":"K36"},{"c":"kp","id":"K37P01","ko":"주술: 비참한 운명","en":"Hex: Wretched Fate","d":"발전기 수리가 최초로 완료되면, 일반 토템에 불이 붙는다.<br><br>집착 대상:<ul><li>27/30/33% 더 느리게 수리한다.<\/li><li>12미터 내에 있는 주술 토템의 오라가 드러난다.<\/li><\/ul>","o":"K37"},{"c":"kp","id":"K37P02","ko":"인간의 탐욕","en":"Human Greed","d":"잠긴 캐비닛으로부터 8미터 내에 생존자가 들어오면, 생존자의 오라가 3/4/5초 동안 드러난다.<br><br>잠금 해제된 상자를 잠글 수 있다. 재사용 대기 시간:10초.<br><br>잠긴 상자의 오라를 볼 수 있다.","o":"K37"},{"c":"kp","id":"K37P03","ko":"권세","en":"Dominance","d":"생존자에 의해 각 상자가 처음으로 잠금 해제되거나 각 토템이 처음으로 축복 또는 정화되면, 8/12/16초 동안 차단된다.","o":"K37"},{"c":"kp","id":"K38P01","ko":"흔들리는 천둥","en":"All-Shaking Thunder","d":"최소 1.25미터에서 추락할 때마다, 15/20/25초 동안 돌진 공격이 75% 더 길게 수행된다. 재사용 대기 시간: 5초.","o":"K38"},{"c":"kp","id":"K38P02","ko":"재앙의 갈고리: 들쭉날쭉한 나침반","en":"Scourge Hook: Jagged Compass","d":"희생제가 시작되면, 4개의 무작위 갈고리가 재앙의 갈고리가 된다.<br><br>생존자가 갈고리에서 구출될 때마다, 해당 갈고리는 재앙의 갈고리가 된다.<br><br>재앙의 갈고리에 생존자를 걸 때마다, 가장 높은 진행도를 가진 발전기의 오라가 6/8/10초 동안 드러난다.","o":"K38"},{"c":"kp","id":"K38P03","ko":"인정사정없이","en":"No Quarter","d":"자가 치료 동안, 생존자가 75% 진행도에 도달하면, 특별 스킬 체크 기회를 획득한다. 스킬 체크에 실패하거나 치료를 중단하면, 20/25/30초 동안 <b>치료 불능<\/b>에 걸린다.","o":"K38"},{"c":"kp","id":"K39P01","ko":"주술: 비참함 그 자체","en":"Hex: Nothing But Misery","d":"기본 공격으로 생존자에게 8회 피해를 입히면, 일반 토템에 불이 붙는다.<br><br>기본 공격으로 생존자에게 피해를 입힐 때마다, 10/12.5/15초 동안 5%의 <b>이동 속도 감소<\/b>에 걸린다.","o":"K39"},{"c":"kp","id":"K39P02","ko":"영결의 뒤얽힘","en":"Forever Entwined","d":"생존자가 피해를 입을 때마다, 토큰 1개를 획득하고, 최대 6/7/8개를 획득할 수 있다.<br><br>각 토큰마다:<ul><li>당신은 4% 더 빠르게 갈고리에 건다.<\/li><li>당신은 생존자를 4% 더 빠르게 들어올리고 떨어뜨린다.<\/li><\/ul>","o":"K39"},{"c":"kp","id":"K39P03","ko":"아무도 자유롭지 않다","en":"None Are Free","d":"각 생존자를 처음으로 갈고리에 걸 때마다, 토큰 1개를 획득한다.<br><br>모든 발전기의 수리가 완료되면, 각 토큰마다:<ul><li>똑바로 세워진 판자가 12/14/16초 동안 차단된다.<\/li><li>창문이 12/14/16초 동안 차단된다.<\/li><\/ul>","o":"K39"},{"c":"kp","id":"K40P01","ko":"구인","en":"Help Wanted","d":"발전기를 손상시킬 때마다, 발전기는 위태로운 상태가 된다.<br><br>해당 발전기의 수리가 생존자에 의해 완료되면, 40/50/60초 동안 기본 공격 재사용 대기 시간이 25% 짧아진다.<br><br>한번에 단 1대의 발전기만 위태로운 상태가 될 수 있다.","o":"K40"},{"c":"kp","id":"K40P02","ko":"유령 공포","en":"Phantom Fear","d":"공포 범위 내에 있는 생존자들이 당신이 있는 방향을 바라보면, 생존자들은 비명을 지르고, 2초 동안 그들의 오라가 드러난다. 재사용 대기 시간: 80/70/60초.","o":"K40"},{"c":"kp","id":"K40P03","ko":"통제불능","en":"Haywire","d":"출구가 최소 80% 이상 열리면, 출구가 열리는 속도가 80/90/100% 퇴보한다.<br><br>출구의 전력이 퇴보하는 동안 생존자들에게 출구 표시등이 무작위로 깜빡이며 이를 드러낸다.","o":"K40"},{"c":"kp","id":"K41P01","ko":"굶주림","en":"Ravenous","d":"각 생존자를 갈고리에 처음으로 걸 때마다, 토큰 1개를 획득한다.<br><br>토큰 4개를 보유하면, 모든 생존자는:<ul><li>비명을 지른다.<\/li><li>40/50/60초 동안 <b>약점 노출<\/b>에 걸린다.<\/li><\/ul>","o":"K41"},{"c":"kp","id":"K41P02","ko":"방황하는 눈빛","en":"Wandering Eye","d":"생존자를 추격할 때마다, 다음 5초 동안, 20미터 내에서 부상을 입은 다른 모든 생존자의 오라를 볼 수 있다. 재사용 대기 시간: 40/35/30초.","o":"K41"},{"c":"kp","id":"K41P03","ko":"주술: 파멸의 서곡","en":"Hex: Overture of Doom","d":"희생제가 시작되면, 일반 토템에 불이 붙고 가장 멀리 있는 발전기는 주술에 걸린다.<br><br>생존자가 주술에 걸린 발전기를 5초 동안 수리하고 나면:<ul><li>당신은 20/25/30초 동안 <b>감지 불가능<\/b>에 걸린다.<\/li><li>해당 시간 동안 당신의 공포 범위는 해당 발전기에 설정된다.<\/li><\/ul><br><br>주술에 걸린 발전기의 수리가 완료되면, 다음으로 가장 멀리 있는 발전기가 주술에 걸린다.","o":"K41"},{"c":"kp","id":"K42P01","ko":"시간 역행","en":"Turn Back The Clock","d":"생존자를 갈고리에 걸면, 다음 40/50/60초 동안, <b>능력 활성화<\/b>을 사용해 20미터 내에 육안으로 확인 가능한 타겟 발전기를 폭발시킬 수 있다. 이로 인해 발전기는 10%의 진행도를 잃고 퇴보하기 시작한다.","o":"K42"},{"c":"kp","id":"K42P02","ko":"비밀 프로젝트","en":"Secret Project","d":"토템이 축복 또는 정화될 때마다, 차단 해제된 발전기 중 한 대가 무작위로 선정되어 20/25/30초 동안 차단된다.<br><br>1대 이상의 발전기가 차단될 때마다, 당신은 30초 동안 <b>감지 불가능<\/b> 효과를 얻는다.","o":"K42"},{"c":"kp","id":"K42P03","ko":"주술: 하이브 마인드","en":"Hex: Hive Mind","d":"생존자를 처음으로 갈고리에 걸면, 일반 토템에 불이 붙는다.<br><br>발전기의 오라가 발전기 진행도를 표시한다.<br><br>1대의 발전기가 남으면:<ul><li>모든 발전기가 폭발하고 6/8/10%의 진행도를 잃으며 퇴보하기 시작한다.<\/li><li>주술 토템에 불은 꺼진다.<\/li><\/ul>","o":"K42"},{"c":"kp","id":"K43P01","ko":"주술: 죽음에 대한 공포","en":"Hex: Scared to Death","d":"생존자 3명을 갈고리에 걸면, 일반 토템에 불이 붙는다.<br><br>생존자를 추격하는 동안, 판자에 기본 파괴를 수행할 때마다, 11/12/13미터 범위의 생존자는:<ul><li>비명을 지른다.<\/li><li>3초 동안 11/12/13%의 <b>이동 속도 감소<\/b> 효과를 얻는다.<\/li><\/ul>","o":"K43"},{"c":"kp","id":"K43P02","ko":"고요한 그림자","en":"Silent Shadow","d":"생존자를 갈고리에 걸 때마다, 11/12/13초 동안 <b>감지 불가능<\/b> 효과를 얻는다.<br><br>모든 발전기가 수리되면, <b>감지 불가능<\/b> 효과를 얻는다.","o":"K43"},{"c":"kp","id":"K43P03","ko":"난동","en":"Rampage","d":"판자 또는 부서지기 쉬운 문에 기본 파괴를 수행할 때마다, 토큰 1개를 획득하며, 최대 13개를 획득할 수 있다.<br><br>당신이 실명되거나 판자에 맞아 기절할 때마다, 다음 13초 동안 당신이 보유한 토큰 1개당 1%의 <b>이동 속도 증가<\/b> 효과를 얻는다. 재사용 대기 시간: 30/25/20.","o":"K43"},{"c":"kp","id":"K44P01","ko":"천상 존재의 목격","en":"Celestial Witness","d":"30초마다, 만약 집착 대상이 당신으로부터 최소 40미터 멀다면, 그들의 오라를 2/2.5/3초 동안 볼 수 있다. 만약 그렇지 않다면, 가장 멀리 있는 생존자는 집착 대상이 된다.","o":"K44"},{"c":"kp","id":"K44P02","ko":"주술: 손아귀에 있느니","en":"Hex: Under Your Thumb","d":"생존자가 처음으로 갈고리 상태를 획득하면, 일반 토템에 불이 붙는다.<br><br>당신으로부터 32미터 내에서 달리고 있는 생존자가 이동 속도 증가 효과를 얻으면, 알림이 전달된다.<br><br>달리는 생존자는 한 번에 25/20/15%의 <b>이동 속도 증가<\/b> 이상을 얻을 수 없다.","o":"K44"},{"c":"kp","id":"K44P03","ko":"초토화","en":"Lay Waste","d":"발전기를 손상시킬 때마다, 발전기가 보유한 내구력 1당 퇴보 속도가 2%씩 빨라진다. 재사용 대기 시간: 55/50/45초.","o":"K44"},{"c":"sp","id":"Kindred","ko":"동질감","en":"Kindred","d":"생존자는 갈고리에 걸린 동안, 다른 모든 생존자들의 오라를 볼 수 있다.<br><br>살인마가 갈고리에 걸린 생존자로부터 8/12/16미터 범위 내로 들어오면, 생존자는 살인마의 오라도 볼 수 있다."},{"c":"sp","id":"Leader","ko":"리더","en":"Leader","d":"당신으로부터 10미터 범위 내에 다른 생존자들은:<ul><li>20/25/30% 더 빠르게 토템을 정화한다.<\/li><li>20/25/30% 더 빠르게 치료한다.<\/li><li>출구를 20/25/30% 더 빠르게 연다.<\/li><li>갈고리에 20/25/30% 더 빠르게 파괴 공작을 수행한다.<\/li><li>20/25/30% 더 빠르게 생존자를 갈고리에서 구출한다.<\/li><li>20/25/30% 더 빠르게 상자를 잠금 해제한다.<\/li><\/ul><br><br>당신이 범위를 벗어난 뒤 20초 후 해당 효과는 종료된다.","o":"Dwight"},{"c":"sp","id":"LeftBehind","ko":"홀로 남겨진 자","en":"Left Behind","d":"다른 모든 생존자들이 죽으면, 비상탈출구로부터 24/28/32미터 범위에 있는 동안 비상탈출구의 오라를 볼 수 있다.","o":"Bill"},{"c":"kp","id":"Lightborn","ko":"빛의 피조물","en":"Lightborn","d":"생존자가 당신을 실명시키려 할 때마다, 그들의 오라가 6/8/10초 동안 드러난다.<br><br>당신은 실명되지 않는다.","o":"HillBilly"},{"c":"sp","id":"Lightweight","ko":"경량화","en":"Lightweight","d":"당신의 발자국이 3/4/5초 더 빠르게 사라지며, 더 넓게 퍼져서 나타난다."},{"c":"sp","id":"Lithe","ko":"유연함","en":"Lithe","d":"중간 또는 빠른 뛰어넘기를 수행할 때마다:<ul><li>당신은 3초 동안 50%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>당신은 60/50/40초 동안 <b>탈진<\/b>에 걸린다.<\/li><\/ul>","o":"Feng"},{"c":"sp","id":"LuckyBreak","ko":"행운","en":"Lucky Break","d":"부상 상태에서 최대 40/50/60초 동안:<ul><li>핏자국을 남기지 않는다.<\/li><li>발자국을 남기지 않는다.<\/li><\/ul><br><br>다른 생존자를 치료하는 데 소비한 시간만큼, 지속 시간이 1초 충전된다.","o":"Yui"},{"c":"kp","id":"MadGrit","ko":"미친 투지","en":"Mad Grit","d":"생존자를 옮기는 동안:<ul><li>기본 공격에 실패할 때마다, 재사용 대기 시간이 100% 짧아진다.<\/li><li>기본 공격으로 생존자에게 피해를 입힐 때마다, 둘러 업은 생존자는 2/3/4초 동안 몸부림 진행도를 획득하지 않는다.<\/li><\/ul>","o":"Legion"},{"c":"kp","id":"MakeYourChoice","ko":"선택하라","en":"Make your Choice","d":"당신으로부터 최소 32미터 떨어져있을 때, 한 생존자가 다른 생존자 또는 스스로를 갈고리에서 구출하면:<ul><li>생존자들은 비명을 지른다.<\/li><li>40/50/60초 동안 <b>약점 노출<\/b>에 걸린다.<\/li><\/ul><br><br>재사용 대기 시간: 40/50/60초.","o":"Pig"},{"c":"kp","id":"Mindbreaker","ko":"마인드 브레이커","en":"Mindbreaker","d":"생존자들이 발전기를 수리하는 동안:<ul><li>생존자들은 <b>실명<\/b> 효과에 걸린다.<\/li><li>생존자들은 <b>탈진<\/b> 효과에 걸린다.<\/li><\/ul><br><br>해당 효과는 발전기 수리를 멈추고 3/4/5초 후 종료된다.","o":"Demogorgon"},{"c":"kp","id":"MonitorAndAbuse","ko":"감시와 학대","en":"Monitor & Abuse","d":"생존자를 추격하는 동안, 공포 범위는 5/10/15% 더 커진다.<br><br>생존자를 추격하지 않는 동안, 공포 범위는 15/20/25% 더 작아진다.","o":"Killer07"},{"c":"kp","id":"Monstrous_Shrine","ko":"재앙의 갈고리: 거대한 신전","en":"Scourge Hook: Monstrous Shrine","d":"희생제가 시작되면:<ul><li>4개의 무작위 갈고리가 재앙의 갈고리가 된다.<\/li><li>지하실 갈고리가 재앙의 갈고리가 된다.<\/li><\/ul><br><br>재앙의 갈고리에 걸린 생존자에게서 최소 24미터 떨어져 있으면, 생존자는 10/15/20% 더 빨리 희생된다."},{"c":"kp","id":"Nemesis","ko":"천벌","en":"Nemesis","d":"생존자가 당신을 실명시킬 때마다, 캐비닛 또는 판자로 당신을 기절시키면, 생존자는 집착 대상이 된다.<br><br>생존자가 집착 대상이 되면:<ul><li>생존자는 40/50/60초 동안 <b>인지 불가능<\/b> 효과에 걸린다.<\/li><li>8초 동안 생존자의 오라가 드러난다.<\/li><\/ul>","o":"Oni"},{"c":"kp","id":"No_One_Escapes_Death","ko":"주술: 피할 수 없는 죽음","en":"Hex: No One Escapes Death","d":"모든 발전기의 수리가 완료되면, 일반 토템에 불이 붙는다:<ul><li>생존자들은 <b>약점 노출<\/b>에 걸린다.<\/li><li>당신은 2/3/4%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><\/ul><br><br>4미터 내에서 생존자는 주술 토템을 오라를 볼 수 있으며, 30초가 지나면 범위가 24미터로 확장된다."},{"c":"sp","id":"No_One_Left_Behind","ko":"아무도 버려두지 않아","en":"No One Left Behind","d":"모든 발전기의 수리가 완료되면:<ul><li>50/75/100% 더 빨리 치료된다.<\/li><li>다른 생존자를 50/75/100% 더 빠르게 구출할 수 있다.<\/li><li>생존자를 갈고리에서 구출할 때마다, 10%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>다른 생존자들의 오라가 드러난다.<\/li><\/ul>"},{"c":"sp","id":"NoMither","ko":"신경 쓰지 마","en":"No Mither","d":"희생제가 시작되면, 당신은 부상 상태가 되고, 그런 다음:<ul><li><b>치료 불능<\/b>에 걸린다.<\/li><li>고통으로 인한 신음 소리가 100% 더 작아진다.<\/li><li>핏자국을 남기지 않는다.<\/li><li>15/20/25% 더 빠르게 회복한다.<\/li><li>완전히 회복할 수 있다.<\/li><\/ul>","o":"Smoke"},{"c":"kp","id":"NurseCalling","ko":"간호사의 소명","en":"A Nurse's Calling","d":"치료하거나 받고 있는 생존자로부터 28/30/32미터 내에서, 당신은 그들의 오라를 볼 수 있다.","o":"Nurse"},{"c":"sp","id":"ObjectOfObsession","ko":"집착의 대상","en":"Object of Obsession","d":"집착 대상이 된 당신, 30초마다, 3초 동안 살인마는 당신의 오라를 볼 수 있다.<br><br>살인마가 오라를 보는 동안:<ul><li>살인마의 오라를 볼 수 있다.<\/li><li>2/4/6% 더 빠르게 토템을 정화한다.<\/li><li>2/4/6% 더 빠르게 치료한다.<\/li><li>2/4/6% 더 빠르게 수리한다.<\/li><\/ul><br><br>희생제가 시작되면, 집착 대상이 될 가능성이 높다.","o":"Laurie"},{"c":"sp","id":"OffTheRecord","ko":"비공개 조건","en":"Off the Record","d":"모든 발전기 수리가 완료될 때까지, 갈고리에서 탈출할 때마다, 다음 30/35/40초 동안:<ul><li><b>인내<\/b>에 걸린다.<\/li><li>고통으로 인한 신음 소리는 100% 더 조용하다.<\/li><li>살인마는 당신의 오라를 볼 수 없다.<\/li><\/ul>","o":"Zarina"},{"c":"sp","id":"Open_Handed","ko":"통찰력","en":"Open-Handed","d":"모든 생존자는 8/12/16미터 더 먼 범위까지 오라를 볼 수 있다.","o":"Ace"},{"c":"kp","id":"OverwhelmingPresence","ko":"압도적인 존재감","en":"Overwhelming Presence","d":"당신으로부터 32미터 범위 내에서 생존자가 아이템을 사용할 때마다, 15초 동안 <b>탈진<\/b>에 걸린다.<br><br>당신으로부터 32미터 범위 내에서 생존자가 있으면, <b>탈진<\/b>에 걸리며, <b>탈진<\/b>에 걸린 가장 가까운 생존자의 오라가 2/3/4초 동안 드러난다.재사용 대기 시간: 25초.","o":"Killer07"},{"c":"sp","id":"Pharmacy","ko":"약제학","en":"Pharmacy","d":"상자를 잠금 해제할 때마다, 상자에는 희귀 구급상자가 담겨있다.<br><br>상자를 75/100/125% 더 빠르게 잠금 해제한다.<br><br>살인마가 상자 여는 소리를 들을 수 있는 거리가 12미터 더 짧아진다.","o":"Quentin"},{"c":"kp","id":"Play_With_Your_Food","ko":"먹이 농락","en":"Play With Your Food","d":"집착 대상 추격을 멈출 때마다, 토큰 1개를 획득하고, 최대 3개를 획득할 수 있다. 재사용 대기 시간: 10초.<br><br><br>각 토큰마다, 3/4/5%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<br><br><br>공격을 할 때마다, 토큰 1개를 잃는다.","o":"Shape"},{"c":"sp","id":"Plunderers_Instinct","ko":"약탈자의 본능","en":"Plunderer's Instinct","d":"잠긴 캐비닛과 드롭된 아이템으로부터 32/48/64미터 내에 있는 경우, 당신은 그것들의 오라를 볼 수 있습니다.<br><br><br>상자를 잠금 해제할 때마다, 더 높은 희귀도의 아이템을 찾을 확률이 50% 증가한다."},{"c":"sp","id":"Poised","ko":"침착","en":"Poised","d":"각 발전기를 최초로 수리하기 시작하면, 8초 동안 살인마의 오라를 볼 수 있다.<br><br><br>발전기 수리가 완료될 때마다, 20/25/30초 동안 발자국을 남기지 않는다.","o":"Jane"},{"c":"kp","id":"pop_goes_the_weasel","ko":"깜짝 상자","en":"Pop Goes the Weasel","d":"생존자를 갈고리에 걸 때마다, 다음 35/40/45초 동안, 발전기를 손상시키면, 발전기가 폭발하고 15%의 진행도를 잃는다.","o":"Clown"},{"c":"kp","id":"Predator","ko":"포식자","en":"Predator","d":"생존자 추격을 멈추면, 4초 동안 그들의 오라가 드러난다. 재사용 대기 시간: 60/50/40초.","o":"Bob"},{"c":"sp","id":"Premonition","ko":"불길한 예감","en":"Premonition","d":"살인마가 당신으로부터 36미터 내에, 그리고 당신이 바라보는 전방 45도에 있는 경우, 살인마 쪽을 바라볼 때마다, 소리 신호가 들린다. 재사용 대기 시간:60/45/30초."},{"c":"sp","id":"Prove_Thyself","ko":"자기 증명","en":"Prove Thyself","d":"당신으로부터 4미터 범위 내에 각 생존자 수에 따라, 모든 생존자들은 6/8/10% 더 빠르게 수리한다.","o":"Dwight"},{"c":"sp","id":"QuickQuiet","ko":"빠르고 조용하게","en":"Quick & Quiet","d":"당신은 캐비닛에 은신하고 소리를 내지 않고 뛰어넘기를 수행한다. 살인마에게로 알림이 가지 않는다. 재사용 대기 시간: 25/20/15초.","o":"Meg"},{"c":"kp","id":"Rancor","ko":"원한","en":"Rancor","d":"발전기가 완료될 때마다:<ul><li>모든 생존자의 위치가 당신에게 3초 동안 알림이 간다.<\/li><li>집착 대상은 5/4/3초 동안 당신의 오라를 볼 수 있다.<\/li><\/ul><br><br>모든 발전기의 수리가 완료되면:<ul><li>집착 대상은 <b>약점 노출<\/b> 효과를 얻는다.<\/li><li>집착 대상을 살해할 수 있다.<\/li><\/ul>","o":"Spirit"},{"c":"sp","id":"RedHerring","ko":"오보","en":"Red Herring","d":"발전기를 최소 1초 동안 수리한 후, 발전기의 오라를 볼 수 있게 된다.<br><br>캐비닛에 은신하면, 살인마는 발전기에 대한 알림을 받는다. 재사용 대기 시간:25/20/15초.","o":"Zarina"},{"c":"kp","id":"RememberMe","ko":"나를 기억하나","en":"Remember Me","d":"집착 대상이 피해를 받을 때마다, 당신은 토큰 1개를 얻으며, 최대 3/4/5개를 획득할 수 있다.<br><br><br>각 토큰마다, 집착 대상이 아닌 생존자들은 30% 더 느리게 출구를 연다.","o":"Nightmare"},{"c":"sp","id":"RepressedAlliance","ko":"억압된 동맹","en":"Repressed Alliance","d":"발전기를 40/35/30초 수리한 후, 발전기 한 대를 혼자 수리하는 동안, <b>능력 활성화<\/b> 버튼을 사용해 15초 동안 해당 발전기를 차단할 수 있다.","o":"S22"},{"c":"sp","id":"Resilience","ko":"회복력","en":"Resilience","d":"부상 상태에 있는 동안:<ul><li>당신은 3/6/9% 더 빠르게 토템 축복하고 정화한다.<\/li><li>당신은 3/6/9% 더 빠르게 치료한다.<\/li><li>당신은 출구를 3/6/9% 더 빠르게 연다.<\/li><li>당신은 3/6/9% 더 빠르게 수리한다.<\/li><li>당신은 3/6/9% 더 빠르게 갈고리에 파괴 공작을 수행한다.<\/li><li>당신은 3/6/9% 더 빠르게 생존자를 갈고리에서 구출한다.<\/li><li>당신은 3/6/9% 더 빠르게 상자를 잠금 해제한다.<\/li><li>당신은 3/6/9% 더 빠르게 뛰어 넘는다.<\/li><\/ul>"},{"c":"sp","id":"S24P01","ko":"판별","en":"Appraisal","d":"희생제가 시작되면, 토큰 4개를 획득한다.<br><br>토큰 1개를 소비해 빈 상자를 뒤질 수 있고, 상자당 최대 2회 수행할 수 있다.<br><br>40/60/80% 더 빠르게 뒤지기 액션을 수행한다.","o":"S24"},{"c":"sp","id":"S24P02","ko":"속임수","en":"Deception","d":"캐비닛으로 빠른 진입을 시도할 때마다:<ul><li>당신은 캐비닛에 들어갈 수 없다.<\/li><li>살인마는 알림을 받는다.<\/li><li>당신은 5초 동안 핏자국을 남기지 않는다.<\/li><li>당신은 5초 동안 발자국을 남기지 않는다.<\/li><\/ul><br><br>재사용 대기 시간: 25/20/15초.","o":"S24"},{"c":"sp","id":"S24P03","ko":"힘찬 발버둥","en":"Power Struggle","d":"살인마에 의해 옮겨지는 동안, 최소 25/20/15%의 몸부림 진행도를 가지며, 똑바로 선 판자 옆에서 판자를 떨어뜨려 살인마를 기절시킬 수 있다.<br><br>빈사 상태 동안, 똑바로 선 판자의 오라를 볼 수 있다.","o":"S24"},{"c":"sp","id":"S25P01","ko":"고속 승진","en":"Fast Track","d":"다른 생존자를 갈고리에 구출할 때마다, 토큰 1개를 획득하며, 최대 1/2/3개를 획득할 수 있다.<br><br>수리를 진행하는 동안 기본 스킬 체크에서 대성공을 거둘 때마다, 모든 토큰을 소비한다. 소비한 토큰 개수마다, 발전기는 5%의 영구 진행도를 얻는다.","o":"S25"},{"c":"sp","id":"S25P02","ko":"대 히트","en":"Smash Hit","d":"당신이 살인마를 판자로 기절시킬 때마다:<ul><li>당신은 4초 동안 50%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>당신은 30/25/20초 동안 <b>탈진<\/b> 효과를 얻는다.<\/li><\/ul>","o":"S25"},{"c":"sp","id":"S25P03","ko":"자기 보호","en":"Self-Preservation","d":"또 하나의 생존자를 갈고리에 걸 때마다, 20/25/30초 동안 <b>회피<\/b> 효과를 얻는다.","o":"S25"},{"c":"sp","id":"S26P01","ko":"저항력","en":"Counterforce","d":"희생제가 시작되면, 토큰 1개를 획득한다.<br><br>토템을 정화할 때마다, 토큰 1개를 획득한 후, 10/12/14초 동안 가장 멀리 있는 토템의 오라를 볼 수 있다.<br><br>각 토큰마다, 토큰을 25% 더 빠르게 정화한다.","o":"S26"},{"c":"sp","id":"S26P02","ko":"부활","en":"Resurgence","d":"갈고리에서 탈출할 때마다, 50/60/70%의 치료 진행도를 얻는다.","o":"S26"},{"c":"sp","id":"S26P03","ko":"폭풍형 지뢰","en":"Blast Mine","d":"발전기를 40% 수리한 후, 발전기 옆에서 <b>보조 능력<\/b> 버튼을 사용하여 고유 덫을 설치하며, 이는 100/110/120초 동안 유지된다. 그 시간 동안, 모든 생존자가 발전기의 오라를 볼 수 있다.<br><br>살인마가 해당 발전기를 손상시키면, 덫이 폭발한다. 그런 다음:<ul><li>살인마는 4초 동안 기절한다.<\/li><li>폭발을 목격한 모든 플레이어는 실명된다.<\/li><\/ul>","o":"S26"},{"c":"sp","id":"S27P01","ko":"고통 참기","en":"Bite the Bullet","d":"치료하는 동안, 당신과 치료받은 생존자는 소음이나 고통으로 인한 신음 소리를 내지 않는다. 기본 스킬 체크에 실패할 때마다:<ul><li>당신은 3/2/1%의 진행도만 잃는다.<\/li><li>살인마에게는 알림이 가지 않는다.<\/li><\/ul>","o":"S27"},{"c":"sp","id":"S27P02","ko":"섬광탄","en":"Flashbang","d":"발전기를 50/45/40% 수리한 후, 캐비닛에 은신하는 동안, <b>능력 활성화<\/b> 버튼을 사용하여 섬광탄을 제작한다.<br><br>섬광탄을 사용하면:<ul><li>폭발을 목격한 주변에 있는 모든 플레이어는 실명한다.<\/li><li>살인마에게 알림이 전달된다.<\/li><\/ul>","o":"S27"},{"c":"sp","id":"S27P03","ko":"신입의 패기","en":"Rookie Spirit","d":"기본 수리 스킬 체크 5/4/3회 수행한 후, 발전기가 퇴보하면 발전기의 오라를 볼 수 있다.","o":"S27"},{"c":"sp","id":"S28P01","ko":"예지력","en":"Clairvoyance","d":"토템을 축복 또는 정화할 때마다, 아이템을 보유하지 않은 채 <b>아이템 사용<\/b> 버튼을 사용하면 64미터 내에서 최대 10/11/12초 동안:<ul><li>상자의 오라는 볼 수 있다.<\/li><li>출구 스위치의 오라를 볼 수 있다.<\/li><li>발전기의 오라를 볼 수 있다.<\/li><li>비상탈출구의 오라를 볼 수 있다.<\/li><li>갈고리의 오라를 볼 수 있다.<\/li><\/ul>","o":"S28"},{"c":"sp","id":"S28P02","ko":"호재: 치료의 순환","en":"Boon: Circle of Healing","d":"토템 옆에 있을 때, <b>능력 활성화<\/b> 버튼을 사용해 토템을 축복하여, 모든 호재를 결합하는 고유한 호재 토템을 생성할 수 있다.<br><br>호재 범위 내에 생존자들은:<ul><li>구급상자 없이 치료를 하는 동안, 그들은 다른 생존자를 50/75/100% 더 빠르게 치료한다.<\/li><li>부상 상태라면, 다른 생존자들은 오라를 볼 수 있다.<\/li><\/ul>","o":"S28"},{"c":"sp","id":"S28P03","ko":"호재: 그림자 미행","en":"Boon: Shadow Step","d":"토템 옆에 있을 때, <b>능력 활성화<\/b> 버튼을 사용해 토템을 축복하여, 모든 호재를 결합하는 고유 호재 토템을 생성할 수 있다. 호재 범위 내에 생존자는:<ul><li>발자국을 남기지 않는다.<\/li><li>그들의 오라는 살인마에게 보여지지 않는다.<\/li><\/ul><br><br>범위를 벗어나면, 2/3/4초 후 해당 효과는 종료된다.","o":"S28"},{"c":"sp","id":"S29P01","ko":"극복","en":"Overcome","d":"피해를 입을 때마다:<ul><li>속도 부스터 효과가 2초 더 길게 유지된다.<\/li><li>60/50/40초 동안 <b>탈진<\/b>에 걸린다.<\/li><\/ul>","o":"S29"},{"c":"sp","id":"S29P02","ko":"교정 조치","en":"Corrective Action","d":"희생제가 시작되면, 토큰 1/2/3개를 획득하며, 최대 5개를 획득할 수 있다.<br><br>기본 스킬 체크를 대성공할 때마다, 토큰 1개를 획득한다.<br><br>다른 생존자가 기본 스킬 체크를 실패할 때마다, 토큰 1개를 소비하면:<ul><li>스킬 체크 성공으로 적용된다.<\/li><li>해당 생존자의 오라를 6초 동안 볼 수 있다.<\/li><\/ul>","o":"S29"},{"c":"sp","id":"S29P03","ko":"호재: 지수","en":"Boon: Exponential","d":"토템 옆에 있을 때, <b>능력 활성화<\/b> 버튼을 사용해 토템을 축복하여, 모든 호재를 결합하는 호재 토템을 생성할 수 있다.<br><br>호재 범위 내에 빈사 상태의 생존자는:<ul><li>90/95/100% 더 빠르게 회복한다.<\/li><li>완전히 회복할 수 있다.<\/li><\/ul>","o":"S29"},{"c":"sp","id":"S30P01","ko":"보호자 지도","en":"Parental Guidance","d":"살인마를 기절시킬 때마다, 5/6/7초 동안:<ul><li>고통으로 인한 신음소리를 내지 않는다.<\/li><li>핏자국을 남기지 않는다.<\/li><li>발자국을 남기지 않는다.<\/li><\/ul>","o":"S30"},{"c":"sp","id":"S30P02","ko":"공감대 형성","en":"Empathic Connection","d":"당신을 다른 생존자를 25/30/35% 더 빠르게 치료한다.<br><br>부상 상태의 생존자는 당신의 오라를 볼 수 있다.","o":"S30"},{"c":"sp","id":"S30P03","ko":"호재: 암흑 이론","en":"Boon: Dark Theory","d":"토템 옆에 있을 때, <b>능력 활성화<\/b> 버튼을 사용해 토템을 축복하여, 모든 호재를 결합하는 고유 호재 토템을 생성할 수 있다.<br><br>호재 범위 내에 생존자는 3%의 <b>이동 속도 증가<\/b> 효과를 얻는다. 범위를 벗어나면, 2/3/4초 후 해당 효과는 종료된다.","o":"S30"},{"c":"sp","id":"S31P01","ko":"이너 포커스","en":"Inner Focus","d":"살인마가 다른 생존자에게 피해를 가할 때마다, 당신은 6/8/10초 동안 살인마의 오라를 볼 수 있다.<br><br>다른 생존자의 발자국을 볼 수 있다.","o":"S31"},{"c":"sp","id":"S31P02","ko":"남은 실체화","en":"Residual Manifest","d":"살인마를 실명시킬 때마다, 살인마는 20/25/30초 동안 <b>실명<\/b>에 걸린다.<br><br>상자를 1회 뒤질 수 있다. 희생제 시작 후, 처음으로 뒤지는 상자에는 평범하지 않은 손전등이 들어있다.","o":"S31"},{"c":"sp","id":"S31P03","ko":"지나친 열성","en":"Overzealous","d":"토템을 축복 또는 정화할 때마다, 당신이 피해를 입을 때까지 8/9/10% 더 빠르게 수리한다. 만약 해당 토템이 주술 토템이라면, 효과는 두 배가 된다.","o":"S31"},{"c":"sp","id":"S32P01","ko":"도청 장치","en":"Wiretap","d":"발전기를 40% 수리한 후, 발전기 옆에서, <b>보조 능력<\/b> 버튼을 사용하면 덫을 설치하며, 이는 100/110/120초 동안 또는 해당 발전기에 손상을 입힐 때까지 유지된다. 그 시간 동안, 모든 생존자가 발전기의 오라를 볼 수 있다.<br><br>살인마가 해당 발전기로부터 14미터 범위에 있으면, 모든 생존자는 살인마의 오라를 볼 수 있다.","o":"S32"},{"c":"sp","id":"S32P02","ko":"반응성 치료","en":"Reactive Healing","d":"부상 상태에서 당신으로부터 32미터 범위 내 다른 생존자가 피해를 입으면, 잃어버린 치료 진행도 40/45/50%를 얻는다.","o":"S32"},{"c":"sp","id":"S32P03","ko":"낮은 관심","en":"Low Profile","d":"다른 모든 생존자가 빈사 상태 또는 갈고리에 걸리면, 70/80/90초 동안:<ul><li>당신은 고통으로 인한 신음소리를 내지 않는다.<\/li><li>당신은 핏자국을 남기지 않는다.<\/li><li>당신은 발자국을 남기지 않는다.<\/li><\/ul>","o":"S32"},{"c":"sp","id":"S33P01","ko":"새 것보다 낫다","en":"Better Than New","d":"다른 생존자 치료를 완료할 때마다, 그리고 그들이 피해를 입기 전까지:<ul><li>그들은 12/14/16% 더 빠르게 토템을 축복 및 정화한다.<\/li><li>그들은 12/14/16% 더 빠르게 치료한다.<\/li><li>그들은 상자를 12/14/16% 더 빠르게 잠금 해제한다.<\/li><\/ul>","o":"S33"},{"c":"sp","id":"S33P02","ko":"안도감","en":"Reassurance","d":"갈고리 상태마다 한 번씩, 갈고리에 걸린 생존자로부터 6미터 범위에서, <b>보조 능력<\/b> 버튼을 사용해 20/25/30초 동안 희생 진행을 멈출 수 있다.","o":"S33"},{"c":"sp","id":"S33P03","ko":"과집중","en":"Hyperfocus","d":"기본 스킬 체크에 대성공을 거둘 때마다, 토큰 1개를 획득하고, 최대 6개를 획득할 수 있다.<br><br>각 토큰마다, 기본 스킬 체크가:<ul><li>4% 더 높은 확률로 나타난다.<\/li><li>4% 더 빠르게 회전한다.<\/li><li>스킬 체크 대성공을 거둘 때마다, 10/20/30% 더 많은 진행도가 제공된다.<\/li><\/ul><br><br>기본 스킬 체크에 실패할 때마다, 스킬 체크에 성공하거나, 치료나 발전기 수리를 중단하면, 모든 토큰을 잃는다.","o":"S33"},{"c":"sp","id":"S34P01","ko":"잠재 에너지","en":"Potential Energy","d":"수리를 진행하는 동안, <b>보조 능력<\/b> 버튼을 사용해 진행도 대신 토큰을 획득하고, 최대 10/15/20개를 획득할 수 있다.<br><br>토큰을 최소 1개 보유하는 동안, <b>보조 능력<\/b> 버튼을 눌러 모든 토큰을 소비하며, 소비한 토큰 1개마다 1%의 진행도를 얻는다.<br><br>피해를 입을 때마다, 모든 토큰을 잃는다.","o":"S34"},{"c":"sp","id":"S34P02","ko":"안개에 관해서","en":"Fogwise","d":"수리를 진행하는 동안, 기본 스킬 체크에서 대성공을 거둘 때마다, 4/5/6초 동안 살인마의 오라를 볼 수 있다.","o":"S34"},{"c":"sp","id":"S34P03","ko":"빠른 포석","en":"Quick Gambit","d":"살인마에 의해 추격당하는 동안:<ul><li>당신은 다른 생존자의 오라를 볼 수 있다.<\/li><li>다른 생존자는 3/4/5% 더 빠르게 수리한다.<\/li><\/ul><br><br>당신이 피해를 입을 때마다, 40초의 재사용 대기 시간을 가진다.","o":"S34"},{"c":"sp","id":"S35P01","ko":"제멋대로","en":"Cut Loose","d":"살인마에 의해 추격당한 동안, 중간 또는 빠른 뛰어넘기를 수행하면:<ul><li>최대 4/5/6초 동안, 중간 또는 빠른 뛰어넘기를 조용히 수행할 수 있다.<\/li><li>그 시간 동안, 중간 또는 빠른 뛰어넘기를 수행하면 타이머는 초기화된다.<\/li><\/ul><br><br>재사용 대기 시간: 45초.","o":"S35"},{"c":"sp","id":"S35P02","ko":"친선 경기","en":"Friendly Competition","d":"최소 다른 1명의 생존자와 함께 발전기를 수리를 마칠 때마다, 당신과 해당 발전기의 수리를 완료한 다른 생존자는 100/110/120초 동안 5% 더 빠르게 수리한다.","o":"S35"},{"c":"sp","id":"S35P03","ko":"팀워크: 두 사람의 힘","en":"Teamwork: Power of Two","d":"다른 생존자 치료를 완료할 때마다, 서로로부터 8/12/16미터 내에 머무르는 동안, 두 플레이어는 5%의 <b>이동 속도 증가<\/b> 효과를 얻는다. 두 플레이어 중 하나가 범위를 벗어나면, 해당 효과는 4초 후 종료된다.","o":"S35"},{"c":"sp","id":"S36P01","ko":"백그라운드 플레이어","en":"Background Player","d":"살인마가 다른 생존자를 들어올릴 때마다, 다음 10초 동안, 달리기를 수행하면:<ul><li>5초 동안 50%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>30/25/20초 동안 <b>탈진<\/b>에 걸린다.<\/li><\/ul>","o":"S36"},{"c":"sp","id":"S36P02","ko":"블러드 러시","en":"Blood Rush","d":"모든 발전기 수리가 완료될 때까지, 갈고리에서 탈출할 때마다, 다음 40/50/60초 동안, 그리고 <b>탈진<\/b>에 걸린 동안, <b>능력 활성화<\/b> 버튼을 사용해 <b>탈진<\/b> 효과를 즉시 해제할 수 있다.<br><br>이는 뚜렷한 액션에 의해 해제된다.","o":"S36"},{"c":"sp","id":"S36P03","ko":"팀워크: 단체 잠행","en":"Teamwork: Collective Stealth","d":"다른 생존자가 당신의 치료를 완료할 때마다, 서로로부터 8/12/16미터 내에 있는 동안, 두 플레이어는 발자국을 남기지 않는다. 두 플레이어 중 하나가 범위를 벗어나면, 해당 효과는 4초 후 종료된다.","o":"S36"},{"c":"sp","id":"S37P01","ko":"분쟁 조정자","en":"Troubleshooter","d":"살인마에게 추격 당하는 동안:<ul><li>가장 높은 진행도를 가진 발전기의 오라를 볼 수 있다.<\/li><li>판자를 떨어뜨릴 때마다, 당신은 4/5/6초 동안 살인마의 오라를 볼 수 있다.<\/li><\/ul><br><br>살인마가 더 이상 당신을 추격하지 않으면, 해당 효과는 6/8/10초 후 종료된다.","o":"S37"},{"c":"sp","id":"S37P02","ko":"탄생의 목적","en":"Made for This","d":"부상 상태일 때, 당신이 다른 생존자 치료를 완료할 때마다, 6/8/10초 동안 <b>인내<\/b>에 걸린다.<br><br>당신이 달리고 있고 <b>깊은 상흔<\/b> 상태라면, 3%의 <b>이동 속도 증가<\/b> 효과를 얻는다.","o":"S37"},{"c":"sp","id":"S37P03","ko":"청소부","en":"Scavenger","d":"수리를 진행하는 동안, 그리고 공구상자가 비어 있는 동안, 기본 스킬 체크에서 대성공을 거둘 때마다, 토큰 1개를 획득한다.<br><br>토큰 5개를 보유하게 되면, 토큰을 모두 사용한다:<ul><li>공구상자가 즉시 충전된다.<\/li><li>40/35/30초 동안 50% 더 느리게 수리한다.<\/li><\/ul><br><br>1회 상자를 뒤질 수 있다. 희생제 시작 후 처음으로 뒤지는 상자에는 평범하지 않은 공구상자가 들어있다.","o":"S37"},{"c":"sp","id":"S38P01","ko":"극작법","en":"Dramaturgy","d":"건강한 상태에서 달리기를 수행하는 동안 <b>능력 활성화<\/b> 버튼 사용 시:<ul><li>당신은 2초 동안 25%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>당신은 60/50/40초 동안 <b>탈진<\/b>에 걸린다.<\/li><\/ul><br><br>그런 다음, 다음 중 한 개의 효과가 무작위로 발동된다:<ul><li>당신은 2초 동안 25%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>당신은 12초 동안 <b>약점 노출<\/b>에 걸린다.<\/li><li>무작위 애드온이 있는 무작위 희귀 아이템을 획득한다.<\/li><li>당신은 비명을 지르지만, 아무 일도 일어나지 않는다.<\/li><\/ul><br><br>동일한 효과는 연속으로 2번 발동되지 않는다.","o":"S38"},{"c":"sp","id":"S38P02","ko":"연기 파트너","en":"Scene Partner","d":"살인마의 공포 범위 내에 있는 동안, 살인마가 있는 곳을 바라볼 때마다:<ul><li>비명을 지른 후, 4/5/6초 동안 살인마의 오라가 드러난다.<\/li><li>50%의 확률로 다시 비명을 지른다. 비명을 지르면, 2초 동안 더 살인마의 오라를 볼 수 있다.<\/li><\/ul><br><br>재사용 대기 시간: 40초.","o":"S38"},{"c":"sp","id":"S38P03","ko":"플롯 트위스트","en":"Plot Twist","d":"부상 상태, 웅크린 자세, 유휴 상태에서, <b>보조 능력<\/b> 버튼을 사용해 조용히 빈사 상태가 된다.<br><br>해당 방법으로 빈사 상태가 되면, 희생제당 1회씩:<ul><li>고통으로 인한 신음 소리를 내지 않는다.<\/li><li>핏자국을 남기지 않는다.<\/li><li>25% 더 빠르게 회복한다.<\/li><li>완전히 회복할 수 있다.<\/li><\/ul><br><br>해당 방법으로 회복하면:<ul><li>2/3/4초 동안 50%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>즉시 회복한다.<\/li><\/ul><br><br>모든 발전기 수리가 완료되면 해당 능력을 다시 한 번 사용할 수 있다.","o":"S38"},{"c":"sp","id":"S39P01","ko":"럭키 스타","en":"Lucky Star","d":"캐비닛에 은신하는 동안, 고통으로 인한 신음 소리를 내지 않는다.<br><br>캐비닛에서 나올 때마다, 30초 동안:<ul><li>당신은 가장 가까운 곳에 있는 발전기의 오라를 볼 수 있다.<\/li><li>당신은 다른 생존자의 오라를 볼 수 있다.<\/li><li>당신은 고통으로 인한 신음소리를 내지 않는다.<\/li><li>핏자국을 남기지 않는다.<\/li><\/ul><br><br>재사용 대기 시간: 35/30/25초.","o":"S39"},{"c":"sp","id":"S39P02","ko":"화학물질 함정","en":"Chemical Trap","d":"발전기를 20% 수리한 후, 떨어진 판자 옆에서, <b>보조 능력<\/b> 버튼을 사용하면 고유 덫이 설치되며, 이는 40/50/60초 동안 유지된다. 그 시간 동안, 모든 생존자는 판자의 오라를 볼 수 있다.<br><br>살인마가 해당 판자를 부서뜨리면, 덫이 폭발하여 그들은 4초 동안 50%의 <b>이동 속도 감소<\/b>에 걸린다.","o":"S39"},{"c":"sp","id":"S39P03","ko":"날렵함","en":"Light-footed","d":"건강한 상태에서 달리면, 살인마에게 발소리가 들리지 않는다.<br><br>빠른 액션을 수행할 때마다, 14/12/10초의 재사용 대기 시간을 가진다.","o":"S39"},{"c":"sp","id":"S40P01","ko":"빛의 챔피언","en":"Champion of Light","d":"손전등을 사용하는 동안, 50%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<br><br>살인마를 실명시킬 때마다, 6초 동안 20%의 <b>이동 속도 감소<\/b>에 걸린다. 재사용 대기 시간: 60/50/40초.","o":"S40"},{"c":"sp","id":"S40P02","ko":"호재: 깨달음","en":"Boon: Illumination","d":"토템 옆에 있을 때, <b>능력 활성화<\/b> 버튼을 사용해 토템을 축복하여, 모든 호재를 결합하는 고유한 호재 토템을 생성할 수 있다.<br><br>호재 범위 내에 생존자는:<ul><li>상자의 오라를 볼 수 있다.<\/li><li>발전기의 오라를 볼 수 있다.<\/li><\/ul><br><br>호재 토템을 가지고 있는 동안, 6/8/10% 더 빠르게 축복 및 정화한다.","o":"S40"},{"c":"sp","id":"S40P03","ko":"마감일","en":"Deadline","d":"부상 상태일 때, 기본 스킬 체크가:<ul><li>6/8/10% 더 높은 확률로 나타난다.<\/li><li>장소는 무작위로 나타난다.<\/li><\/ul><br><br>기본 스킬 체크에 실패할 때마다, 당신은 50%의 진행도를 잃는다.","o":"S40"},{"c":"sp","id":"S41P01","ko":"기도: 거미줄치기","en":"Invocation: Weaving Spiders","d":"지하실에 동그라미 옆에서, <b>능력 활성화<\/b> 버튼을 사용해 기도할 수 있다. 기도 중, 다른 생존자들은 당신의 오라는 보고 기도에 합류할 수 있다.<br><br>기도가 완료되면:<ul><li>모든 발전기는 8/9/10의 영구 내구도를 가진다.<\/li><li>당신을 부상 상태가 된다.<\/li><li><b>치료 불능<\/b>에 걸린다.<\/li><\/ul><br><br>각 기도는 희생제당 한 번만 완료될 수 있다.","o":"S41"},{"c":"sp","id":"S41P02","ko":"그림자의 힘","en":"Strength in Shadows","d":"지하실에 있는 동안:<ul><li>당신은 스스로 자가 치료할 수 있으나, 30% 더 느리게 치료한다.<\/li><li>치료를 완료할 때마다, 당신은 6/8/10초 동안 살인마의 오라를 볼 수 있다.<\/li><\/ul>","o":"S41"},{"c":"sp","id":"S41P03","ko":"사악함","en":"Wicked","d":"지하실에 있는 동안, 갈고리에서 스스로 탈출할 수 있다.<br><br>갈고리에서 탈출하거나 구출될 때마다, 당신은 16/18/20초 동안 살인마의 오라를 볼 수 있다.","o":"S41"},{"c":"sp","id":"S42P01","ko":"반사된 환영","en":"Mirrored Illusion","d":"발전기를 20% 수리한 후, 상자, 출구 전원 스위치, 발전기, 또는 토템 옆에서 <b>보조 능력<\/b> 버튼을 사용해 40/50/60초 동안 변함없는 환상을 만들 수 있다.","o":"S42"},{"c":"sp","id":"S42P02","ko":"음유시인의 영감","en":"Bardic Inspiration","d":"유휴 상태에서 <b>능력 활성화<\/b> 버튼을 사용해 16미터 범위 내 모든 생존자들에게 최대 15초 동안 수행 능력을 부여한다. 수행 시, 다른 생존자는 당신의 오라를 볼 수 있다. 20면체 주사위를 굴린다:<ul><li><b>1<\/b>회 | 비명을 지르지만 아무일도 일어나지 않는다<\/li><li><b>2-10<\/b>회 | 기본 스킬 체크를 통해 1% 진행도를 추가로 얻는다<\/li><li><b>11-19<\/b>회 | 기본 스킬 체크를 통해 2% 진행도를 추가로 얻는다<\/li><li><b>20<\/b>회 | 기본 스킬 체크를 통해 3% 진행도를 추가로 얻는다.<\/li><\/ul><br><br>모두 완료하면, 해당 효과는 90초 후 종료된다. 재사용 대기 시간: 110/100/90초.","o":"S42"},{"c":"sp","id":"S42P03","ko":"고요한 시선","en":"Still Sight","d":"유휴 상태로 4/3/2초가 지나면, 24미터 내에서 당신이 다시 움직일 때까지:<ul><li>당신은 살인마의 오라를 볼 수 있다.<\/li><li>당신은 상자의 오라를 볼 수 있다.<\/li><li>당신은 발전기의 오라를 볼 수 있다.<\/li><\/ul>","o":"S42"},{"c":"sp","id":"S43P01","ko":"수완","en":"Finesse","d":"건강한 상태에서 20% 더 빠르게 뛰어넘는다.<br><br>빠른 뛰어넘기를 수행할 때마다, 40/35/30초의 재사용 대기 시간을 가진다.","o":"S43"},{"c":"sp","id":"S43P02","ko":"단련","en":"Hardened","d":"토템을 축복하거나 정화하고 상자를 잠금 해제한 후, 당신이 비명을 지르면, 즉시 3/4/5초 동안 살인마의 오라를 볼 수 있다.","o":"S43"},{"c":"sp","id":"S43P03","ko":"전문가","en":"Specialist","d":"상자를 뒤지거나 잠금 해제할 때마다, 토큰 1개를 획득하고, 최대 6개를 획득할 수 있다.<br><br>발전기 수리를 진행하는 동안 기본 스킬 체크에서 대성공을 거둘 때마다, 모든 토큰을 소비한다. 소비한 토큰 개수마다, 발전기는 2/3/4%의 영구 진행도를 추가로 얻는다.","o":"S43"},{"c":"sp","id":"S44P01","ko":"벨몬드의 눈","en":"Eyes of Belmont","d":"발전기 수리가 완료될 때마다, 1/2/3초 동안 살인마의 오라를 볼 수 있다.<br><br>해당 기간 동안 살인마의 오라를 목격할 때마다, 2초 증가한다.","o":"S44"},{"c":"sp","id":"S44P02","ko":"의기양양","en":"Exultation","d":"판자로 살인마를 기절시킬 때마다:<ul><li>아이템 희귀도가 한 단계 업그레이드된다(최상급일 경우, 유지됨).<\/li><li>아이템이 업그레이드되면, 75% 내구도를 가진다.<\/li><\/ul><br><br>재사용 대기 시간: 30/25/20초.","o":"S44"},{"c":"sp","id":"S44P03","ko":"영광의 순간","en":"Moment of Glory","d":"상자 1개를 뒤지거나 잠금 해제한 후, <b>치료 불능<\/b> 상태가 아닐 경우, 부상 상태가 되면 <b>치료 불능<\/b>에 걸린다.<br><br>80/70/60초 후, 빈사 상태가 되지 않았다면, 즉시 치료가 된다.","o":"S44"},{"c":"sp","id":"S45P01","ko":"기도: 신뢰할 수 없는 까마귀","en":"Invocation: Treacherous Crows","d":"지하실에 동그라미 옆에서 <b>보조 능력<\/b> 버튼을 사용해 기도할 수 있다. 기도 중, 다른 생존자들은 당신의 오라는 보고 기도에 합류할 수 있다.<br><br>기도가 완료되면:<ul><li>생존자가 공포 범위에 있는 동안 살인마가 까마귀를 쫓아내면, 모든 생존자는 1/1.5/2초 동안 살인마의 오라를 볼 수 있다.<\/li><li>당신은 부상 상태가 된다.<\/li><li><b>치료 불능<\/b>에 걸린다.<\/li><\/ul><br><br>각 기도는 희생제당 한 번만 완료될 수 있다.","o":"S45"},{"c":"sp","id":"S45P02","ko":"돌연 중단","en":"Clean Break","d":"다른 생존자 치료를 완료할 때마다, 다른 생존자에 의해 치료되고 있는 동안, <b>능력 활성화<\/b> 버튼 사용 시 <b>치료 불능<\/b>에 걸린다.<br><br>75/60/45후에도 빈사 상태가 되지 않는다면, 당신은 즉시 치료된다.","o":"S45"},{"c":"sp","id":"S45P03","ko":"부담 감당","en":"Shoulder the Burden","d":"2 갈고리 상태가 아닌 경우, 갈고리에 걸린 생존자 옆에 있는 동안, 희생제당 한 번씩, <b>보조 능력<\/b> 버튼을 사용하면:<ul><li>그들은 갈고리 상태 1단계를 잃는다.<\/li><li>당신은 갈고리 상태 1단계를 얻는다.<\/li><li>당신은 비명을 지른다.<\/li><li>당신은 60/50/40초 동안 <b>약점 노출<\/b>에 걸린다.<\/li><\/ul>","o":"S45"},{"c":"sp","id":"S46P01","ko":"무해함","en":"Do No Harm","d":"다른 생존자를 치료하는 동안:<ul><li>그들이 보유한 갈고리 상태 한 단계마다, 당신은 30/40/50% 더 빠르게 치료한다.<\/li><li>기본 스킬 체크에서 대성공을 거두면 진행도 3%를 더 얻는다.<\/li><\/ul>","o":"S46"},{"c":"sp","id":"S46P02","ko":"주의의무","en":"Duty of Care","d":"건강한 상태에서 보호 공격을 받을 때마다, 12미터 내 다른 생존자는 4/5/6초 동안 25%의 <b>이동 속도 증가<\/b> 효과를 얻는다.","o":"S46"},{"c":"sp","id":"S46P03","ko":"신속 대응","en":"Rapid Response","d":"빠르게 캐비닛을 나올 때마다, 30/25/20초 동안 <b>탈진<\/b>에 걸린다.<br><br><b>탈진<\/b>에 걸리면, 당신은 2초 동안 살인마의 오라를 볼 수 있다.","o":"S46"},{"c":"sp","id":"S47P01","ko":"아포칼립스 독창성","en":"Apocalyptic Ingenuity","d":"상자 1개를 뒤지거나 잠금 해제한 후, 부서진 판자 옆에서 <b>능력 활성화<\/b> 버튼을 사용해 3초 동안 부서지기 쉬운 판자를 생성할 수 있다.<br><br>24/28/32미터 내에서 당신은 부서진 판자의 오라를 볼 수 있다.","o":"S47"},{"c":"sp","id":"S47P02","ko":"날 잡아봐!","en":"Come and Get Me!","d":"생존자를 갈고리에서 구출할 때마다, 웅크린 자세에서 유휴 상태로, <b>능력 활성화<\/b> 버튼을 사용하면 24미터 내에 부상 상태 또는 빈사 상태의 생존자들은:<ul><li>10/12.5/15초 동안 고통으로 인한 신음소리를 내지 않는다.<\/li><li>10/12.5/15초 동안 핏자국을 남기지 않는다.<\/li><li>10/12.5/15초 동안 발자국을 남기지 않는다.<\/li><\/ul><br><br>당신은 비명을 지르고 살인마는 5초 동안 당신의 오라를 볼 수 있다.","o":"S47"},{"c":"sp","id":"S47P03","ko":"팀워크: 강해짐","en":"Teamwork: Toughen Up","d":"부상 상태에서 당신으로부터 24미터 범위 내 다른 생존자가 살인마를 실명 또는 판자로 기절시키면, 20/25/30초 동안:<ul><li>당신은 고통으로 인한 신음소리를 내지 않는다.<\/li><li>당신은 핏자국을 남기지 않는다.<\/li><li>당신은 발자국을 남기지 않는다.<\/li><\/ul>","o":"S47"},{"c":"sp","id":"S48P01","ko":"신념","en":"Conviction","d":"1 상태의 생존자를 치료한 후, 25%의 회복률을 보유한 채 빈사 상태가 되면, <b>능력 활성화<\/b> 버튼을 눌러 즉시 회복할 수 있다.<br><br><b>치료 불능<\/b>에 걸리며, 그런 다음 20/25/30초 후, 즉시 빈사 상태가 된다.","o":"S48"},{"c":"sp","id":"S48P02","ko":"최후의 저항","en":"Last Stand","d":"살인마의 공포 범위 내에서 120/105/90초 동안 은신한 후, 빠른 뛰어넘기를 하면, 2.5미터 내에 있을 경우, 희생제마다 한 번씩 3초 동안 살인마가 기절한다.","o":"S48"},{"c":"sp","id":"S48P03","ko":"팀워크: 패대기","en":"Teamwork: Throw Down","d":"당신이 살인마를 실명시키거나 판자로 기절시킬 때마다, 24미터 내에 부상 상태의 다른 생존자는 6/8/10초 동안:<ul><li><b>인내<\/b>에 걸린다.<\/li><li>살인마의 오라를 볼 수 있다.<\/li><\/ul>","o":"S48"},{"c":"sp","id":"S49P01","ko":"도로 위에 삶","en":"Road Life","d":"부상을 입었지만, <b>치료 불능<\/b> 상태가 아닐 때 발전기를 수리하면:<ul><li>기본 스킬 체크에서 대성공을 거둘 때마다, 당신은 토큰 1개를 획득한다.<\/li><li>기본 스킬 체크에 실패할 때마다, 당신은 토큰 1개를 잃는다.<\/li><\/ul><br><br>토큰 6/5/4개를 모으면, 모든 토큰을 소모해 100% 더 빠르게 치료하며 이는 치료가 끝날 때까지 유지된다.","o":"S49"},{"c":"sp","id":"S49P02","ko":"하나-둘-셋-넷!","en":"ONE-TWO-THREE-FOUR!","d":"유휴 상태에서 <b>보조 능력<\/b> 버튼을 사용해 16미터 범위 내 모든 생존자들에게 최대 15초 동안 수행 능력을 부여한다. 수행 시, 다른 생존자는 당신의 오라를 볼 수 있다. 치료 또는 수리 중 그 시간 동안 특별 스킬 체크 기회를 얻는다. 기본 스킬 체크가 20% 더 높은 확률로 나타난다.<br><br>모두 완료하면, 효과는 90초 동안 유지된다. 재사용 대기 시간: 110/100/90초.","o":"S49"},{"c":"sp","id":"S49P03","ko":"고스트 노트","en":"Ghost Notes","d":"<b>탈진<\/b>에 걸리면, 50% 더 빠르게 발자국 사라진다.<br><br>5/7.5/10% 더 빠르게 <b>탈진<\/b> 효과를 잃는다.","o":"S49"},{"c":"sp","id":"S50P01","ko":"바다 바다 붐","en":"Bada Bada Boom","d":"발전기를 20% 수리한 후, 창문 옆에 서서, <b>보조 능력<\/b> 버튼을 사용하면 고유 덫이 설치되며, 이는 40/50/60초 동안 유지된다. 그 시간 동안, 모든 생존자는 창문의 오라를 볼 수 있다.<br><br>살인마가 해당 창문을 넘으면, 덫이 폭발하여 그들은 6초 동안 50%의 <b>이동 속도 감소<\/b>에 걸린다.","o":"S50"},{"c":"sp","id":"S50P02","ko":"계획 변경","en":"Change of Plan","d":"희생제가 시작되면, 토큰 2개를 획득한다.<br><br>캐비닛에 은신하면서 이벤트과 관련 없는 공구상자를 들고 있는 동안, <b>보조 능력<\/b> 버튼과 토큰 1개를 사용하여 공구상자와 애드온이 80/90/100%의 내구도를 가진 동일한 희귀도의 구급상자와 동일한 희귀도의 무작위 애드온으로 변한다.","o":"S50"},{"c":"sp","id":"S50P03","ko":"팀워크: 풀 서킷","en":"Teamwork: Full Circuit","d":"당신과 함께 발전기를 수리하는 생존자 한 명당, 기본 스킬 체크 성공 구역이 15/20/25% 커진다.<br><br>최소 1명의 다른 생존자와 함께 수리하면 수리 속도가 5% 빨라진다.","o":"S50"},{"c":"sp","id":"S51P01","ko":"뛰어난 지각력","en":"Extrasensory Perception","d":"4초 동안 웅크리면:<ul><li>당신이 오라는 범위가 최대 44미터로 확장된다.<\/li><li>당신은 <b>회피<\/b> 효과에 걸린다.<\/li><li>당신은 <b>인지 불가능<\/b> 효과에 걸린다.<\/li><\/ul><br><br>웅크림 해제 시, 또는 11초 후 재사용 대기 시간: 60/50/40초.","o":"S51"},{"c":"sp","id":"S51P02","ko":"우리가 지켜보고 있다","en":"We See You","d":"살인마가 당신의 오라를 볼 때마다, 당신은 토큰 1개를 획득한다. 재사용 대기 시간: 10초.<br><br>토큰 4개를 모으면, 모든 토큰을 소비한다. 그런 다음, 모든 생존자들은 10/12.5/15초 동안 살인마의 오라를 볼 수 있게 된다.","o":"S51"},{"c":"sp","id":"S51P03","ko":"팀워크: 상냥한 사람","en":"Teamwork: Soft-Spoken","d":"당신과 함께 발전기를 수리하는 생존자 한 명당, 발전기 수리 소음의 범위가 15/20/25% 작아진다.<br><br>최소 1명의 다른 생존자와 함께 수리하면 수리 속도가 5% 빨라진다.","o":"S51"},{"c":"sp","id":"S52P01","ko":"몰입 상태","en":"Flow State","d":"발전기 수리를 완료할 때마다, 토큰 1개를 획득하고, 최대 5개를 획득할 수 있다.<br><br>각 토큰마다:<ul><li>당신은 토템을 8/9/10% 더 빠르게 축복 및 정화한다.<\/li><li>당신은 8/9/10% 더 빠르게 치료한다.<\/li><li>당신은 생존자들을 8/9/10% 더 빠르게 갈고리에서 구출한다.<\/li><\/ul>","o":"S52"},{"c":"sp","id":"S52P02","ko":"우리만의 공간","en":"A Place For Us","d":"다른 생존자를 치료할 때, 두 생존자는 <b>회피<\/b> 효과를 얻는다.<br><br>집착 대상 치료를 완료할 때마다, 두 생존자 모두 20/25/30초 동안 <b>회피<\/b> 효과를 얻는다.<br><br>희생제가 시작되면, 집착 대상이 될 가능성이 낮다.","o":"S52"},{"c":"sp","id":"S52P03","ko":"5수 앞","en":"Five Moves Ahead","d":"살인마의 공포 범위 안에 있거나 살인마로부터 추격당하는 동안:<ul><li>당신은 가장 가까운 판자와 창문 5개의 오라를 볼 수 있다.<\/li><li>당신이 판자를 떨어뜨린 후, 50% 더 일찍 움직인다.<\/li><li>당신이 판자를 떨어뜨릴 때마다, 40/35/30초의 재사용 대기 시간을 가진다.<\/li><\/ul>","o":"S52"},{"c":"sp","id":"S53P01","ko":"풀악셀","en":"Wide Open Throttle","d":"판자를 뛰어넘을 때마다:<ul><li>당신은 3초 동안 10/12.5/15%의 <b>이동 속도 증가<\/b> 효과를 얻는다.<\/li><li>판자가 초기화되면, 60초 동안 차단되며, 모든 생존자들은 그 시간 동안 판자의 오라를 볼 수 있다.<\/li><\/ul><br><br>재사용 대기 시간: 60초.","o":"S53"},{"c":"sp","id":"S53P02","ko":"도움의 손","en":"Lend a Hand","d":"1 토템을 축복 또는 정화할 때마다, 다른 생존자를 치료하는 동안, 희생제에서 한 번씩 그리고 생존자당 한 명씩 <b>보조 능력<\/b>을 사용해 영구 치료 내구도 2/3/4을(를) 줄 수 있다.","o":"S53"},{"c":"sp","id":"S53P03","ko":"반대 신문","en":"Cross-Examination","d":"살인마의 공포 범위에 머무르고 추격 당하지 않는 동안, 그들은 10초 동안 당신이 볼 수 있는 옅은 표식을 남긴다. 살인마의 옅은 표식 위에서 <b>회피<\/b> 효과를 얻는다. 3/4/5초 후 해당 효과는 종료된다.","o":"S53"},{"c":"sp","id":"S54P01","ko":"노력의
