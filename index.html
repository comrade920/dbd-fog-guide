위를 아슬아슬하게 걸어갔고, 그 아래로 강물은 아주 빠르게 흘렀다. 그 지역 주민들은 그곳을 '투신자살'이라고 이름 붙였다. 여러 대의 차들이 까르미나를 지나쳤다. 그녀에게 관심을 가지고 차를 세운 사람들은 하나도 없었다. 그녀는 난간을 넘어 다리 끝에 섰다. 순간 바람에 다리가 휘청거렸다. 그녀는 강물이 거대한 바위에 부딪히는 것을 바라보며 아래를 내려다보았다. 그녀는 눈을 감았다.<i>곧 만나자, 마티아스.<\/i><br><br>갑자기 까마귀의 울음소리가 하늘을 뒤덮었다. 까르미나는 눈을 떴고 그녀를 향해 날아오는 검은 날개 무리를 보았다. 갈라진 구름 사이로 까마귀 떼들이 날아왔다. 그중 한 마리가 그녀의 어깨 위에 앉아 그녀의 눈을 빤히 바라보았다. 마치 그녀의 영혼을 들여다보는 듯이. 난간을 잡은 그녀의 손이 느슨해졌고 까마귀가 요란하게 울었다. 까르미나는 혼란스러워하며 까마귀를 쳐다보았다.<br><br>다른 까마귀 한 마리가 난간에 내려앉았다. 그리고 또 한 마리가 내려앉았다. 곧 까마귀 떼 전체가 난간에 내려앉기 시작했고, 그녀가 서있는 자리는 점점 좁아졌다. 까르미나는 그들이 자신을 평가하는 것처럼 계산적이고 수수께끼 같은 무거운 시선을 느꼈다. 그녀가 잠시 아래를 내려다보자 우레와 같은 야유 소리가 그녀의 어두운 충동을 방해했다. 까마귀들은 그녀의 안녕을 걱정하는 것 같았다. 그녀는 여전히 난간 위에 서있었고, 그녀의 칠흑 같은 색의 머리카락 사이로 바람이 불어왔다. 그 순간, 까르미나는 그들과 비슷하다고 느꼈다. 마티아스가 죽은 후 처음으로 카르미나는 외로움을 느끼지 않았다.<br><br>그녀는 집으로 돌아와 스스로에게 삶을 다시 살아갈 기회를 주었다. 까마귀들은 떠났지만, 까르미나는 자신에게 무슨 일이 생기면 그들이 다시 돌아올 거라고 생각했다.<br><br>자신이 겪은 시련에 영감을 얻는 까르미나는 붓을 들었다. 그녀는 그 후 몇 주 동안을 그날의 경험을 그리는 데 보냈다. 검은 물감으로 자신의 생명을 구해준 까마귀 떼를 그렸고 그날의 검은 다리 '투신자살'을 그렸다. 그 경험은 그녀에게 삶의 전환점과 같았다. 그녀는 그녀만의 스타일을 만들어냈다. 검은 물감의 초현실주의 예술...<br><br>수 년이 지나며, 어두운 검은색 물감 사이로 다른 색의 물감들이 어울렸다. 그녀는 그렇게 자신의 예술적 형태를 확장해 나갔다. 그녀는 사람들로 분주한 길모퉁이에 대규모의 벽화를 그리고 거추장스러운 의상을 디자인하고 권력에 맞서는 내용의 시를 낭송했다. 까르미나의 예술은 지역적이고 친밀한 비극을 꽤 큰 스케일로 드러냈고, 사람들이 이를 쉽게 지나칠 수 없도록 만들었다. 그리고 그녀가 공연하는 곳마다 까마귀들이 따라다녔다.<br><br>그녀의 공연은 점점 대담해졌고 그녀의 스타일이 활기를 북돋아 준다고 생각한 예술가들이 그녀를 찾았다. 그녀는 자신의 성상 파괴주의적인 비전을 이해하는 예술가 집단과 가까워졌다. 그녀의 공연은 대규모의 초현실주의 운동을 일으켰고, 그것은 하나의 현상이 되었다.<br><br>그녀의 명성은 다국적 기업인 '백 라벨'의 의뢰를 받을 정도로 커졌고, 그녀는 그룹에 대해 더 알아보기 위해 조사에 나섰다. 하지만 그녀가 알게 된 건 그다지 좋은 소식들이 아니었다. 그들이 평판이 나쁜 국회의원을 선발하기 위해 예술 작품을 선물했다는 것과, 백에게 의뢰를 받은 예술가들이 거래가 끝난 후 사라졌다는 사실이 그것이었다.<br><br>부패한 국회의원들과 기업의 비리를 드러내기로 결정한 까르미나는 백의 의뢰를 수락했다. 약속한 주가 되었고, 까르미나는 묘지 내 유골 안치소 벽에 거대한 벽화를 그렸다. 초현실적인 저승사자가 칠레 사람들을 수확하는 모습이었다. 그것도 백 라벨의 로고를 담은 채. 그리고 그녀는 그림을 그릴 때 연극 드레스를 입었는데, 그 위에 정치 혁명에 관한 시를 꿰맸다.<br><br>그 작품은 부패에 대한 급진적인 논쟁을 불러일으켰다. 그 논란은 까르미나를 겨냥했다. 익명의 인물로부터 살해 위협을 받은 후, 그녀는 안전을 위해 가장 가까운 친구들을 데리고 아버지의 집으로 피신했다.<br><br>그날 밤, 복면을 쓴 무장 강도들이 집에 침입했다. 그들은 재빨리 까르미나와 그녀의 친구들을 굴복시키고 밴에 던져 넣고 차를 몰고 떠났다.<br><br>다음날 아침, 마른 바람이 까르미나의 얼굴에 모래를 불어 그녀를 깨웠다. 그녀는 다리가 묶이고 두 손에 수갑이 채워진 채 사막 한가운데 있는 의자에 앉아 있었다. 그녀의 친구들은 묶여 땅바닥에 누워져 있었다. 그녀의 얼굴에 그림자가 드리워졌다. 까르미나는 고개를 들었다.<br><br>긴 의복을 입은 남자가 검은 후드에 얼굴을 가린 채 그녀에게로 다가왔다. 그는 의복에서 은빛 칼을 꺼내어 들었다.<br><br>그는 그녀의 손을 잡고 이해할 수 없는 언어로 찬가를 중얼거렸다. 까르미나는 그를 뚫어지게 바라봤다. 그는 잠시 멈춰 서더니 돌연히 칼을 내리쳤다.<br><br>그녀는 고통에 쌓여 소리를 질렀고 그녀의 친구들은 그 끔찍한 광경을 목격했다. 까르미나의 손이 모래 위로 떨어졌다. 수갑이 뒤따라 떨어졌다. 피를 철철흘리며...<br><br>후드를 뒤집어쓴 남자는 만족감에 미소를 지었다. <i>이제 그림은 어떻게 그릴 건가?<\/i> 까르미나는 남자를 향해 욕을 퍼붓고 소리를 지르며 발에 묶인 줄을 풀기 위해 안간힘을 써댔다.<br><br>남자는 까르미나의 턱을 잡아 올려 그녀의 얼굴에 침을 뱉었다.<br><br>그가 힘을 주어 그녀의 입을 벌려 혀를 빼냈고 까르미나는 자신의 혀를 잡은 그의 손에서 벗어나기 위해 씨름했다. 그는 단숨에 까르미나의 혀를 잘랐다.<br><br>그녀는 고통에 울부짖었다. 남자는 피가 뚝뚝 떨어지는 칼날을 의복에 닦았다. <i>이제 시는 어떻게 낭송할 거지?<\/i><br><br>슬픔이 까르미나의 마음에 사무친 고통보다 더 날카롭게 부풀어 올랐다. 그녀는 걷잡을 수 없는 분노에 사로잡혔고 슬픔과 상실에 정신을 잃었다. 그녀는 과거 남동생을 잃었다. 그리고 그러한 고통에 대처할 수 있는 유일한 방법을 잃었다. 까르미나는 그녀의 남동생이 죽은 날처럼 비명을 질렀다.<br><br>요란한 까마귀 떼의 울음소리가 황무지에 메아리쳤다. 하늘이 먹구름으로 가려졌다. 검은 깃털이 까르미나의 피가 흐르는 팔에 떨어졌다. 그녀는 고개를 들어 구름 사이를 뚫고 나타나 후드를 쓴 남자를 향해 빠르게 날아오는 까마귀 떼를 발견했다.<br><br>탐욕스러운 까마귀들이 그의 살을 무자비하게 쪼아대었고, 까르미나는 그녀의 초현실주의 예술이 살아나는 것을 보며 미소를 지었다.<br><br>그러나 까마귀들이 수갑에 묶여 바닥에 쓰러져 있는 그녀의 친구들에게 향하자 그녀의 심장은 분노로 요동쳤다. 고통과 죄책감과 공포의 파도가 그녀를 압도했고 그녀는 비명을 질렀다. 그러나 헛수고였다. 그곳에 탐욕스러운 까마귀들을 통제할 수 있는 존재는 없었다.<br><br>친구들의 괴로운 비명소리가 더욱 날카로워지자 그녀의 눈앞이 캄캄해졌다. 죽음이 다가오고 있었다. 모든 것이 그녀의 잘못이었다.<br><br>깊은, 검은 안개가 그녀를 사로잡았다.","perks":["K26P01","K26P02","K26P03"],"dlc":"Ion","power":{"ko":"고통의 새","en":"Birds of Torment","d":"영원한 고통은 거칠고 흉포한 검은색 까마귀 무리로부터 온다.<br><br><i>능력 버튼<\/i>을 길게 눌러 <b>고통의 새<\/b>를 충전할 수 있다. 완전히 충전되면 <i>공격 버튼<\/i>을 탭하여 절망의 까마귀를 소환한다. 계속해서 <i>능력 버튼<\/i>을 길게 누르고 <i>공격 버튼<\/i>을 탭하여 해당 액션을 빠르게 반복할 수 있다.<br><br>절망의 까마귀가 최소 1마리 이상 소환되면 한정 시간 동안 유휴 상태를 유지한다. 새로운 절망의 까마귀가 생성되면 이미 생성된 절망의 까마귀가 유휴 상태에 머무르는 시간이 연장된다.<br><br><i>어빌리티 버튼<\/i>을 탭하여 절망의 까마귀를 쫓을 수 있다.<br><br>절망의 까마귀는 비행 중 단거리 피해를 입힐 수 있다. 살인마에게 절망의 까마귀가 날아간 경로가 표시된다.<br><br>절망의 까마귀가 한 번 지나간 경로를 다시 날아갈 경우, 피해를 입힐 순 없지만, 방해물을 통과할 수 있으며 살인마의 본능을 사용해 주변에 있는 생존자들의 위치를 알아낼 수 있다.<br><br>이 단계에서 절망의 까마귀는 타격한 생존자 주변에 까마귀 무리를 생성하며 살인마는 생존자 위로 생성된 까마귀 무리의 오라로 위치를 파악할 수 있다. 생존자는 쫓아내기 액션을 완료하거나 캐비닛에 들어가면 까마귀 무리를 쫓을 수 있다. 그동안 까마귀 무리의 오라는 살인마에게 드러나지 않는다.<br><br>까마귀 무리가 생성된 생존자가 두 번째 절망의 까마귀로 공격을 받을 경우, 피해를 입는다."}},{"id":"K27","ko":"원령","en":"The Onryō","d":"염사의 힘에 물든 복수심에 불타는 귀신인 원령은 조용하고 보이지 않게 영역을 횡단할 수 있으며, 공격할 준비가 되었을 때 나타난다.<br><br>그녀는 개인 기술인, <b>재앙의 갈고리: 분노의 홍수<\/b>, <b>소금물의 부름<\/b>, 그리고 <b>무자비한 태풍<\/b>으로 숨어있는 생존자를 노출시키고 발전기를 감시하며, 수리 진행도를 방해할 수 있다.","story":"야마무라 사다코는 일본 이즈오섬 출신의 유명한 선견자의 딸이었다.<br><br>그녀의 어머니는 많은 질문들에 대한 답을 남기지 않으셨다. 그녀의 어머니는 종종 해변에서 며칠씩 거품이 이는 한곳을 바로 보았는데, 사실 고향에서 그녀의 어머니를 바라보는 선원들의 시선은 그리 곱지 않았다. 누군가는 소금물에서 놀다 보면 도깨비가 될 거라고 했다. 즉, 물가에서 계속 놀면 괴물이 잡아먹으러 올 거라는 뜻이었다.<br><br>9개월이 지나고, 사다코가 세상에 태어났다. 어린 그녀는 자신의 엄청난 힘을 통제할 수 없는 듯 자주 분노에 휩싸였다. 그녀의 힘이 불안정하다는 것은 어머니가 대중 앞에 선 그날 더욱 분명해졌다. 어머니는 선견자로서의 예견을 했지만, 한 기자는 그녀를 사기꾼이라고 지탄했고, 이를 본 사다코의 힘이 솟구쳤고, 그 기자는 바닥에 쓰러져 즉사했다.<br><br>그 후로 모든 것이 꼬이기 시작했다. 그녀의 어머니는 돌아가셨다. 어머니의 죽음으로 충격에 빠진 사다코는 무언가에 홀린 듯 곧 무너질듯한 오래된 우물로 다가갔다. 그녀가 우물 돌담에 몸을 기대자 긴 그림자가 그녀 위로 드리워졌다. 그녀가 몸을 돌리자 갑자기 덜컥하는 고통이 그녀의 머리를 강타했고, 두개골이 깨지는 소리가 들렸다. 그녀의 시야는 어두워졌고 정신은 무의식 속으로 소용돌이쳤다. 그리고 자신을 우물 안으로 밀어 넣으려는 두 손길이 느껴졌다.<br><br>그녀는 이내 차가운 우물 바닥에 부딪혔고, 두개골에서 느껴지는 통증이 폭발했다. 위에서는 삐걱거리는 소리가 났고 우물은 어두워졌으며, 한낮의 일식처럼 모든 빛이 가려졌다.<br><br>그녀의 몸 구석구석이 아파졌고, 그녀는 고통에 비명을 질렀다. 위를 올려다보니 유일한 출구가 보였다. 그녀는 진흙에 손톱을 깊숙이 박으며 우물의 자갈 벽을 향해 천천히 기어갔다. 그녀는 필사적으로 돌을 움켜쥐었지만 그녀에겐 돌을 붙잡을 힘도 없었다. 그녀가 몇 인치를 오르면, 그녀의 손톱이 젖은 벽에 미끄러졌다. 안간힘을 써 벽을 기어오르려 했지만, 그녀는 번번이 미끄러졌다. 굵은 자갈이 그녀의 손톱을 긁었으며, 손톱 밑에 있는 살을 찢자 그녀의 손가락은 피로 넘쳐났다. 그러나 그녀는 포기하지 않았다.<br><br>수십 년 후, 초원은 휴양지가 되었고, 우물 위에는 통나무 오두막이 지어졌다. 여행객들이 오두막을 빌렸을 때 사다코는 복수의 기회를 찾았다. 그녀는 자신의 모든 염사를 소환하여 한 비디오테이프에 끔찍한 저주를 걸었다. '그 비디오를 보는 모든 사람은 7일 안에 죽는다.'<br><br>그녀의 분노는 폭풍우의 바다와 같았고, 폭력적이고 용서받지 못했다. 그녀가 분노에 휩싸였을 때, 짙은 검은 안개가 그녀의 발을 감쌌다. 파도 부딪치는 소리가 오래된 돌우물에 울려 퍼졌다.<br><br>그 순간, 조수가 밀려와 선실 벽이 부서졌고, 통나무로 된 선실에는 진흙과 오물로 가득 찼다. 검은 물살이 우물 밑을 덮쳐 단숨에 사다코를 집어삼켰다.<br><br>그녀가 눈을 떴을 땐, 그녀는 광활하고 폭풍우가 몰아치는 바다를 마주하고 있는 황량한 해변에 서있었고, 짙고 검은 안개가 수면 위를 어루만지고 있었다.<br><br>사다코는 다가오는 파도를 향해 걸어갔고, 뿌연 안개속으로 천천히 사라졌다.","perks":["K27P01","K27P02","K27P03"],"dlc":"Kepler","power":{"ko":"공포의 폭우","en":"Deluge of Fear","d":"미스터리한 비디오테이프를 통해 사다코는 자신도 모르는 시청자들에게 저주를 퍼트리고 그들의 때아닌 죽음을 초래한다.<br><br><b>특수 능력: 실체화<\/b><br><br>실체화 전, 원령은 <b>감지 불가능<\/b>이 되며 생존자에게 드러나지 않으나, <b>24미터<\/b> 내에서는 간헐적으로 드러난다. 원령은 생존자들을 공격하려면 반드시 실체화해야 한다. <i>능력 버튼<\/i>을 길게 눌러 현재 위치에서 <b>실체화<\/b>할 수 있다. <b>실체화<\/b> 후, 짧은 시간 동안, 원령은 <b>24미터<\/b> 범위 내에 생존자들에게 간헐적으로 나타난다. 그런후, 사다코가 <b>실체화<\/b> 상태를 유지할 동안에는 <b>24미터<\/b> 범위 내에서 계속 나타난다. 원령은 <i>능력 버튼<\/i>을 길게 눌러 <b>실체화 해제<\/b> 가능하다.<br><br><b>특수 능력: 투영<\/b><br><br>원령은 자신을 TV에 <b>투영<\/b>하여 물체의 형태로 나타날 수 있다. 전원이 켜진 TV들 중 <b>투영<\/b>할 TV를 바라보며 <i>어빌리티 버튼<\/i>을 눌러야 한다. 투영되는 과정 중, TV는 꺼진다.<br><br><b>생존자의 고통: 죽음의 선고<\/b><br><br>생존자는 <b>비디오테이프 꺼내기<\/b> 액션을 통해 일시적으로 TV를 끌 수 있다. 가장 먼 곳에 위치한 TV에 테이프를 삽입하여 원령의 메시지를 전파할 수 있으며, 이는 그들의 <b>죽음의 선고<\/b> 진행도를 감소시킨다. 이는 또한 TV의 전원을 끈다.<br><br>능력 미터기가 가득 찼을 때, 그리고 원령이 <b>투영<\/b>할 때, 전원이 들어온 TV 근처에 있는 생존자들 모두 <b>죽음의 선고<\/b> 진행도를 얻는다.<br><br><b>죽음의 선고<\/b>에 의해 영향을 받은 생존자를 갈고리에 걸면 생존자가 보유한 진행도 중 3개를 잠궈 남은 희생제 시간 동안 제거할 수 없게 된다.<br><br>생존자의 <b>죽음의 선고<\/b> 진행도가 가득 차면, <b>살인마의 본능<\/b>에 의해 생존자의 오라가 드러나며, 한번 빈사 상태에 빠지면 그대로 죽음을 당한다."}},{"id":"K28","ko":"드레지","en":"The Dredge","d":"한때 활기찬 공동체의 어두운 생각을 드러내는 드레지는 캐비닛 사이를 순간 이동하며 압도적인 어둠을 소환할 수 있다.<br><br>드레지의 개인 기술인, <b>소멸<\/b>, <b>드러난 어둠<\/b>, 그리고 <b>패혈성 손길<\/b>은 판자를 파괴하고 캐비닛 근처에 있는 생존자를 발견하며 실명과 탈진으로 치료 중인 생존자에게 영향을 끼칠 수 있다.","story":"더 폴드는 1960년대에 익명의 자선가들에 의해 미국의 한 개인 섬에 설립되었다. 그들의 목표는 국가 정책에 실망하고 환멸을 느낀 사람들을 끌어모아 어두운 생각과 감정이 없는 평화로운 사회를 만드는 것이었다.<br><br>평화를 사랑하는 이 공동체는 수년에 걸쳐 번성해왔으며 공동체의 회원들은 즐거운 대화, 명상, 그리고 '좋은 생각' 만트라의 끝없는 암송을 통해 그의 추종자들에게 행복을 유지하는 비결을 가르친 카리스마 넘치는 지도자인 오토 스탬퍼의 명령을 자유롭게 따랐다.<br><br>그러나 모든 이가 더 폴드 안에서 지복을 누리는 건 아니었으며, 오토는 안 좋은 생각 또는 우울한 단어를 떠올리거나 뱉었다고 고백하는 자들을 추방했다. 오토가 소위 ‘더 폴드’의 수호자라 지명한 이들은 오토가 설립한 완벽에 가까운 이 공동체에 대해 불만을 품거나 토로한 불평분자들을 재빠르게 추방시켜 선동의 뿌리를 뽑았다.<br><br>이러한 방법으로 오토는 ‘오토마리안’, 즉 오토 제국의 사람들에게 어두운 생각은 모든 불만의 근원이 된다고 믿게 했다. 또한, 그는 ‘드루아니’라는 고대 신에 대해 이야기해 주었다. 이 신은 어떻게 사람의 어두운 기억과 욕망을 먹고 사는지, 그리고 어둠의 모든 징후를 어떻게 인간의 마음에서 쫓아낼 필요가 있는지 이야기했다. 어둠의 땅에서 이 공포를 소환될까 두려움에 떨며 말이다.<br><br>이 섬에서의 삶은 유토피아와 거의 같았다. 신도들의 정신적 댐에서 금이 가기 시작하고 신도들이 하나둘씩 사라지기 전까진...<br><br>그 후, 섬이 공포로 가득 차 신도들의 마음을 사로잡는 데는 오랜 시간이 걸리지 않았다.<br><br>한때 행복했던 공동체는 이제 그림자 속에서 그들을 스토킹하고 잠결에 그들을 잡아먹을 지도 모르는 이 무형의 생물로부터 그들의 삶을 지키기 위해 몇몇 집에 모여 앉아 필사적인 모든 ‘좋은 생각’ 만트라를 낭송하고 있다.<br><br>오토는 추종자들을 진정시키려, 그들 가운데 숨은 불평분자가 즐거움의 정원에 드루아니를 소환했다고 말했다.<br><br>더 폴드가 공포를 호소하자, 오토는 필사적인 조치를 취했다. 소문과 어두운 언행이 퍼지는 것을 막기 위해 오토마리안의 외출을 제한했으며, 자신들의 세계에 악몽을 끌어올 수 있다는 이유로 잠에 드는 것 또한 금지했다. “드루아니가 사라지면 자유와 잠은 곧바로 돌아올 것이다.”<br><br>그럼에도 불구하고 오토마리안들의 실종 사건은 계속되었다. 오토는 가까운 해변으로 추종자들을 불러들였다. 그곳에는 나무로 된 단 위에서 묶여 비명을 지르는 여자가 하나 있었다. 오토는 비에 젖고 소외감과 피로에 쌓인 추종자들을 향해 묶여 있는 저 여자가 이곳을 파괴해버리기 위해 온 기자라고 설명했다.<br><br>공동체 수호자들이 공포에 떨고 있는 여자를 붙잡자, 그녀가 오토는 그가 주장하는 구세주가 아니라고 소리쳤다. 그는 억만장자들이 만든 고대 사이비 종교에 소속되어 있으며, 그들은 사람들, 마을, 심지어 국가를 타락시키고 ‘고대 신’에게 희생시키는 것을 즐긴다고 말했다. 그리고, 기자는 오토는 그 누구도 ‘추방’시킨 적이 없으며, 단지 그들을 붙잡아 고문시키고 희생시켰다고, 당신들이 그다음 희생자가 될 것이라고 소리쳤다.<br><br>오토는 한치의 주저함도 없이 그녀의 목을 베었다. 거짓 소문들이 더욱 퍼지지 않도록. 그녀는 이내 피를 뿜으며 고꾸라졌다. 오토는 패닉에 빠져 공포에 떠는 추종자들에게 죽은 기자는 공동체에 숨어든 사기꾼이며 드루아니가 그들 모두를 찾아오기 전에 다른 사기꾼을 속출해야 한다고 소리쳤다.<br><br>오토의 말은 신도들을 넘어, 그들의 가슴속 깊고 어두운 구덩이에 닿아 어둡고 두려운 것들을 들추어냈다.<br><br>안절부절못하는 신도들의 다리와 발 사이로 짙은 안개가 밀려오면서 억눌린 수년간의 감정이 물거품을 일으키기 시작했다. 수군거림과 속삭임이 시작되었고, 속삭임이 패닉 상태의 만트라가 되었다. 그리고 만트라는 신도들로 하여금 옆 사람에 대한 악의적 사고와 발언을 쏟아내며 비난하며 이내 비명과 저주가 되었다.<br><br>휘몰아치는 바람과 세찬 빗줄기 너머로 모두가 필사적으로 어둠을 억누르려 하지만 비명과 저주는 점점 더 커졌다. 그러나 그들이 더 열심히 노력하면 할수록, 그들은 더 빨리 실패했고, 순식간에 그 댐은 지옥의 급류를 분출하며 터졌다.<br><br>오토는 그의 한때 행복하고 즐거운 무리들이 한 번도 본 적이 없는 엄청난 폭력으로 폭발하는 것을 지켜보았다. 더 폴드는 비난의 눈물을 흘리며 손과 말로 서로를 갈기갈기 찢었고, 그들은 단 한 번도 그들의 친절하고 카리스마 있는 목자들이 차갑고, 황량하고 동정심 없는 눈으로 그들을 내려다보고 웃는 것을 올려다보려고 하지 않았다.<br><br>모든 것이 끝났을 때, 오토는 나무 단이 삐걱거리며 흔들리는 것을 느꼈다. 그들의 머리 위로 까마귀 떼가 원을 그리며 돌고 있었다. 그 순간, 땅이 솟아올랐다가 당밀처럼 찐득하고 걸쭉한 검은 진흙 속으로 모래가 빨려 들어갔다. 잠시 후, 형태 없는 덩어리가 사마귀처럼 오물 밖으로 튀어나와 도살된 인간들의 비틀거리는 살점을 먹어치웠다.<br><br>그것은 도처에서 나타나 어둠을 흡수하고, 고통을 음미하고 비명 소리, 울음소리, 속삭임, 터지는 소리, 갈리지는 소리 등 끔찍한 소음을 내며, 천천히 대학살을 지났다.<br><br>포식의 소리이자,<br><br>죽음의 소리이자,<br><br>어둠의 소리가 들려왔다.<br><br>오토는 그 괴물이 자신이 상상했던, 아니, 신도 모두가 상상하도록 만든 바로 그 모습이 되어가는 모습을 바라보았다.<br><br>괴물은 천천히 오토 쪽으로 고개를 돌리고는 오랫동안 조용히 그를 바라보았다. 드루아니는 진득한 검은 진흙을 지나 천천히 자신이 온 어둠 속으로 사라졌다.","perks":["K28P01","K28P02","K28P03"],"dlc":"Meteor","power":{"ko":"어둠의 지배","en":"Reign of Darkness","d":"어두움 생각처럼, 드레지는 털어버리기 힘든 존재이다. 그리고 밤이 깊어지면, 거의 불가능하다.<br><br><b>특수 능력: 으스름<\/b><br><br><i>능력 버튼<\/i>을 길게 눌러 활성화할 수 있다. 활성화되면, 드레지는 잔류물을 남긴다. 캐비닛을 조준한 채, <i>어빌리티 버튼<\/i>을 누르면, 캐비닛으로 순간 이동할 수 있으며, <i>공격 버튼<\/i>을 눌러 다시 잔류물로 돌아올 수 있다. 캐비닛으로 순간 이동하거나, 생존자가 잔류물을 만지면, 그 잔류물은 사용할 수 없게 된다. 캐비닛에 있는 동안 다른 캐비닛을 조준한 채 <i>어빌리티 버튼<\/i>을 누르면 다시 순간 이동할 수 있다. 순간 이동을 할 때마다 능력 토큰 한 개를 소비한다. 캐비닛을 나가거나 또는 잔류물로 돌아오면 으스름의 재사용 대기 시간이 활성화된다. 재사용 대기 시간이 끝나면, 모든 능력 토큰이 재충전된다.<br><br>생존자는 캐비닛에 자물쇠를 설치해 드레지가 캐비닛을 탈출하는 데 걸리는 시간을 늘릴 수 있다. 드레지는 잠긴 캐비닛을 탈출하거나 자물쇠에 기본 공격을 가해 자물쇠를 부술 수 있다. 각 캐비닛당 최대 1회만 자물쇠를 걸 수 있다.<br><br><b>특수 능력: 나이트폴<\/b><br><br>건강한 상태의 생존자가 부상을 당하거나, 갈고리에 걸리거나, 또는 순간 이동 능력을 사용했을 때 <b>나이트폴 미터기<\/b>가 차오른다. 또한, <b>나이트폴 미터기<\/b>는 각 생존자의 부상 상태에 따라 더 빨리 채워진다. <b>나이트폴 미터기<\/b>가 가득 차면, <b>나이트폴<\/b>이 시작된다.<br><br><b>나이트폴<\/b>이 활성화된 동안, 생존자는 완전한 암흑 속에서 길을 찾아야 하며, 드레지의 순간 이동 재사용 대기 시간은 줄어든다. 또한, 감지 불가능을 획득한다. <b>나이트폴<\/b>은 60초 후 종료된다."}},{"id":"K29","ko":"마스터마인드","en":"The Mastermind","d":"알버트 웨스커는 뛰어난 능력의 소유자지만, 동시에 무자비한 마스터마인드로 우로보로스의 힘을 주입한 자이다.<br><br>그의 개인 기술인, <b>우월한 신체<\/b>, <b>깨어난 자각<\/b>, 그리고 <b>종착역<\/b>으로 그는 창틀을 더 빨리 뛰어넘을 수 있고, 생존자를 업고 있는 동안, 다른 생존자들의 오라를 볼 수 있다. 또한, 출구에 전원이 공급되면, 생존자를 영구적으로 치료 불능 상태로 만들 수 있다.","story":"알버트 웨스커는 엄브렐러 그룹의 고위 관리였다. 그는 엄브렐라와 함께 큰 발전을 이루었고, 동시에 그의 야심은 그로 하여금 회사를 배신하게 만들었다. 자신이 최고의 실험 대상이라고 믿었던 알버트는 스스로를 바이러스 시제품에 노출시켰다. 그 결과, 초인적인 힘을 가지게 된 웨스커는 자신의 죽음을 속이고 지하에 숨어들어 새로운 계획을 세웠다. 바로, 세계에 생물 무기인 우로보로스를 노출시켜 약자를 제거하고 강자만을 남는 세상을 만드는 것이었다.<br><br>웨스커는 아프리카에서 그의 계획을 실행에 옮기기 시작했지만, 우로보로스를 실은 미사일이 비축된 격납고에서 바이오 테러 보안 평가 연합(BSAA)의 회원들과 맞닥뜨리게 되었다. 진화의 선봉에 서기로 결심한 그는 다시 한번 자신을 실험 대상으로 삼았다. 자신을 우로보로스에 노출시킨 그는 상상도 할 수 없었던 방식으로 진화하기 시작했다. 그는 자신의 세포가 이상변이를 일으켰고, 그 순간, 이상한 검은 안개가 격납고 안으로 스며들어 그의 시야를 채웠다. 마침내 안개가 소멸되었을 때, 그는 고통에서 벗어날 자격이 있는 더 하찮은 존재에 둘러싸인 또 다른 세계에 있는 자신을 발견했다.","perks":["K29P01","K29P02","K29P03"],"dlc":"Orion","power":{"ko":"악성 속박","en":"Virulent Bound","d":"마스터마인드는 생존자들을 우로보로스 바이러스에 감염시키거나 장애물을 뛰어넘을 수 있다.<br><br><i>능력 버튼<\/i>을 길게 눌러 <b>속박<\/b> 공격을 차지할 수 있다. 차지되는 동안, 돌격을 준비하는 마스터마인드의 속도가 약간 느려진다. 차지가 완료되면 <i>공격 버튼<\/i>을 눌러 <b>속박<\/b>할 수 있다. 만약 마스터마인드가 생존자를 타격하면, 해당 생존자는 감염된다(또는 감염을 퍼트린다). <b>속박<\/b> 공격 중, 마스터마인드는 무언가에 부딪히며, 웨스커는 생존자를 세게 밀어 피해를 입힌다. 또는, 생존자를 집어던져 생존자가 딱딱한 물체에 부딪힐 경우, 생존자의 건강 상태가 악화된다.<br><br><b>악성 속박<\/b>이 창문 또는 떨어진 판자를 타격하면, 마스터마인드는 물체에 특수 뛰어넘기를 수행한다.<br><br><b>특수 효과: 우로보로스 감염<\/b><br><br><b>악성 속박<\/b>에 타격을 입으면, 생존자는 감염된다. 감염 상태는 서서히 악화되며, 완전히 감염되면 생존자는 <b>4%의 근육 손상<\/b> 상태 이상에 걸린다. <b>악성 속박<\/b>이 떨어진 판자를 타격하거나 뛰어넘으면, 마스터마인드는 물체를 뛰어넘는다.<br><br><b>특수 상호 작용: 응급 처치 스프레이<\/b><br><br>희생제가 시작될 때마다, 다수의 보급 상자가 스폰된다. 각 상자에는 응급 처치 스프레이가 담겨있다. 감염에 걸렸을 때, 생존자는 스스로 또는 다른 생존자에게 응급 처치 스프레이를 사용할 수 있다. 스프레이는 감염을 제거한다. 각 응급 처치 스프레이는 정해진 차지 수가 있다. 응급 처치 스프레이를 사용한 후, 짧은 시간 동안 생존자의 위치가 살인마의 본능에 의해 드러난다."}},{"id":"K30","ko":"기사","en":"The Knight","d":"기사는 전력적인 살인마이며, 그의 충성스러운 경비대를 생존자들을 사냥하도록 보내어 전장의 물체를 손상시킬 수 있다.<br><br>그의 개인 기술인 <b>숨을 곳 없음<\/b>, <b>주술: 어둠과 마주하라<\/b>, 그리고 <b>자만심<\/b>으로 발전기 근처에 생존자의 위치를 드러내고 생존자를 저주해 두려움에 비명을 지르게 만들며, 살인마를 기절시킨 생존자를 약점 노출로 만들 수 있다.","story":"타르호스 코바치는 어린 절의 대부분을 기억하진 못했지만, 그가 기억하는 것은 그의 평생을 걸고 쫓을 것이었다. 그는 마을을 가득 채운 울음소리와 비명소리를 기억한다. 어머니가 자신에게 약처럼 걸쭉한 검은 액체를 먹게 했던 순간을 기억한다. 그는 단단한 바닥에 쓰러져 있다가 뭉개진 시체 속에 파묻혀 귓가에 타오르는 마을 소리와 함께 겨우 깨어났던 것을 기억한다. 그는 밀치고 당기며 피투성이 시체 더미 위로 올라가 죽음과 파괴, 그리고 썩 좋지 않은, 불가해한 침묵에 질식할 뻔하던 순간을 기억한다. 그가 도저히 이해할 수 없는 무언가의 존재에 있다는 것을 깨닫는 순간, 갑자기 그의 귀에서 고음의 칭얼거림이 들리고 피부가 따끔거리기 시작했다. 그리고 비록 그가 겪고 있는 감정이 무엇인지 분명하게 말할 수는 없었지만, 그는 그것이 고통이나 슬픔, 또는 두려움이 아니라는 것을 알고 있었다. 다른 무언가였다. 다른 무언가에 가까운 것...<br><br>경외심.<br><br>타르호스는 그 순간을 이해하려고 애쓰느라, 뒤에서 다가오는 사내들을 눈치채지 못했다. 그들이 그를 마차로 끌고 가서 다른 노예들과 함께 작은 나무 우리에 가두었을 때 그는 반응조차 하지 않았다. 그는 그저 넋이 나가 한곳을 응시할 뿐이었다. 그들이 그에게 이탈리아로 간다고 했을 때 역시, 타르호스는 눈을 크게 뜨고 이해할 수 없는 것을 이해하려는 마음으로 나무 사이를 뚫어지게 응시했다.<br><br>그날 후로, 타르호스는 용병 기사단에 합류하여 카디르 하캄에게서 훈련을 받았다. 그는 그곳에서 무기를 휘두르는 법과 갑옷을 제작하는 법을 배우고, 기사도 규약을 낭복하며 그를 기용한 사람들을 순종적으로 섬겼다. 세월이 흘러, 타르호스는 적대적이고 경쟁심 높은 용병들 사이에서 친구 몇 명을 사귀었다. 그러나 타르호스의 스킬, 힘, 그리고 영리함은 그의 용기가 전투 중 그들에게 행운을 가져다주었으며 그가 언젠가 집단적인 자유를 줄 것이라고 믿는 작은 추종자들을 생겨났다. 추종자 셋은 그에 대한 영원한 충성을 맹세했고 그렇게 그들은 충실한 3인으로 알려지게 되었다. 타르호스 패거리.<br><br>알레한드로 산티아고는 용병 기사단의 병기 제조자로 수습생 생활을 했다.<br><br>두르코스 말레섹은 잠행과 조용히 적의 목을 따는 것에 소질을 보여싸.<br><br>샌더 롤트는 타르호스와 몸집과 힘에 있어서 필적할 존재였다. 그가 선호한 무기는 거대한 전투 도끼였다.<br><br>용병 기사단이 먼 곳에서 군사 작전을 실행했고, 타르호스는 적들의 목숨을 끝없이 처리했다. 수 년이 흘렀다. 피도 흘렀다. 그러나 수많은 시간 동안 흐른 피는 그가 마을에서 겪은 일과는 비교도 안될 양이었다. 그럼에도 불구하고, 전투 중 보였던 그의 용기에 타르호스는 기사 작위와 더불어 자유를 부여받았다. 헝가리 출신의 노예는 이제 자유를 얻었다. 그의 잔임함이 보상을 받았다. 비록 그의 마음은 무언가 다른 것을 그리워했다. 이름을 부를 수도 설명도 할 수 없는 무언가를 그리워했다. 자신보다 아랫사람으로 생각한 자들의 명령을 받는 데 지친 타르호스는 스스로 독립하기 위해 용병 기사단을 떠났다. 그러나 고용주는 그를 따르는 추종자를 풀어주길 거부했다.<br><br>자신을 추종자들을 자유롭게 할 만큼 돈을 모으기로 결심한 타르호스는 부유한 이탈리아 영주와 고용 계약을 맺었다. 비토리오 토스카노는 포르토스쿠로 공작이었다. 뿐만 아니라 비토리오는 학자이자 세계를 여행하는 여행자였으며, 미지의 신비주의자 도당에 의해 숨겨진 고대 지식을 모으는 수집가였다. 타르호스는 오래전에 잊혀진 고대 시대에 존재했던 학교의 기둥 파편을 찾아 떠나는 비토리오의 원정대에 합류했다. 비토리오는 돌이 선악을 넘어 완벽한 세계로 들어가는 문을 여는 비밀을 가지고 있다고 믿었기 때문에 이 돌을 라피스 파라디수스라고 불렀다.<br><br>원정대는 프랑스의 로마 유적지를 수색하여 피레네 맥을 넘어 스페인으로 들어갔고, 그 길은 포르투갈의 신트라 아래에 있는 카타콤브로 통했다.<br><br>그곳에 주민들은 지하 묘지를 신성한 장소라고 생각했다. 타르호스는 묘지의 입구를 지키는 경비원들을 죽여서라도 돌을 찾아오려 했다. 그러나 유혈 사태를 원치 않았던 비토리오는 타르호스에게 다른 방법을 강구하라고 명령했다. 그러나 그동안 기사도를 빙자한 가장 끔찍한 행위를 목격한 타르호스는 명예를 가장한 채 비토리오의 명령을 거절했다. 그는 비토리오가 기지로 돌아가길 기다렸다. 그런 다음, 힘찬 함성과 함께 앞으로 밀고 나가며 지하 묘지를 피로 물들였고 결국 돌을 손에 쥐게 되었다.<br><br>포르토스쿠로로 돌아오는 길에 타르호스는 비토리오를 자신의 지하 감옥에 가두었고 돌에 새겨진 상징들의 의미를 말하라고 요구했다. 비토리오가 말하길 거부하자, 타르호스는 잔인한 방법으로 타르호스의 친구와 친척들을 고문하였고 끔찍하게도 그들의 시체를 거리에 전시했다. 그러나 어느 것도 타르호스로부터 돌의 비밀을 지키겠다는 비토리오의 결심을 꺾을 순 없었다. 화가 난 타르호스는 비토리오의 부를 장악하고 소규모 군대를 일으켰다. 몇 달이 지나지 않아, 타르호스는 어떤 두려움도 없이 용병 기사단이 있는 곳으로 진군하여 그들의 막사를 파괴하고, 그의 추종자들을 해방시키며, 적들을 나뭇가지처럼 베고, '용감함'을 과시하기 위해 적들의 '정의로운' 머리를 한곳에 모았다.<br><br>이윽고 이웃 지방의 몇몇 영주들은 타르호스가 악의 화신이라고 믿었다. 영주들은 포르토스쿠로에서 악을 숙청하기 위해 '도덕'과 '덕행'을 가진 군대를 만들기 위해 뭉쳤다. 타르호스는 그들의 위협을 너무나도 쉽게 무시했다. 그의 눈에 영주들은 탐욕과 야망을 법과 법규 같은 진부한 말 뒤에 숨기는 비겁한 무리들이었다. 타르호스가 아무런 판단 없이 받아들인 바로 그 어둠으로부터 숨기기 위해 고안된 법과 규범, 그리고 진부한 말들이었다.<br><br>그러나, 적들이 그를 향해 진군하자, 타르호스는 비토리오가 마땅히 받아야 할 죽음의 심판을 그에게 내리기 위해 지하 감옥으로 향했다. 타르호스는 비토리오에게 구조될 수 있다는 희망을 조금도 주지 않았다. 사악한 의도를 가지고, 그는 작은 감옥에 들어섰다. 그 길은 횃불이 켜진 복도를 지나 가장 깊은 땅속으로 이어졌다. 비토리오가 아는 지식과 비밀에 대해 절대 알지 못할 것이라는 것에 타르호스는 잠시 망설였다. 그러나 앞으로 그 지식과 비밀을 아는 사람은 더 이상 없을 것이다. 그것만으로 충분했다. 그는 지하 감옥의 자물쇠를 따고 문을 발로 찼다. 단 두 걸음에 쥐가 득실거리는 빈 감옥으로 들어올 수 있었다.<br><br>타르호스는 잠시 침묵을 지키는듯했지만, 이내 전투 소리가 마을 곳곳으로 퍼지자 분노에 찬 그의 포효가 터져 나왔다. 즉시, 그는 비틀린 복도를 지나고, 비틀린 계단을 뛰어올라, 달빛이 비치는 문밖으로 뛰쳐나왔다. 그리곤 반짝이는 피와 내장 웅덩이를 뚫고 돌진했고, 적을 쓰러뜨리고, 또 쓰러뜨렸다. '도덕'과 '덕행'의 영주들은 마을에 불덩이 돌과 나무줄기를 비처럼 내렸고 집을 부쉈으며, 마을 사람들을 벌레처럼 짓밟고, 땅 위를 쿵쾅거리면 행진하며, 건초 더미와 목재 더미에 불을 붙여 거대한 불혀를 만들었다.<br><br>대학살과 혼돈 속에서 타르호스 패거리는 타르호스를 찾아헤맸고, 연달아 죽음의 회오리바람이 되었다. 몇몇은 자신들의 용기가 행운을 가져다준다고 믿었다. 다른 사람들은 이계의 어떤 것이 그들을 지켜준다고 믿었다. 그것이 무엇이든 간에 그들만이 수십 명의 전사를 쇠똥구리를 짓밟는 것처럼 쉽게 쓰러뜨렸다. 그리고 그들은 적을 도살했다. 시체들과 달그락거리는 갑옷들 사이로 이상한 안개가 피어올랐고, 타르호스는 시야가 점점 흐릿해질 때까지 안개의 존재를 깨닫지 못하고 있었다.<br><br>타르호스는 비틀거리며 앞으로 나아가 수년 전 어머니가 목구멍으로 밀어 넣은 검은 액체처럼 짙은 안개 속을 더듬었다. 그는 자신의 패거리를 찾으려 그들의 이름을 불렀지만, 그의 조정력과 방향 감각은 점점 혼란스러워졌다. 거의 완벽한 어둠 속에서 얼마나 오랫동안 헤맸는지 그는 알 수 없었다. 그러나 갑자기 안개는 사라졌고 썩어가는 시체들과 불타는 마을들이 있는 환상적인 황무지를 드러냈고 그곳에는 취객처럼 지평선에 몸을 기댄 거대한 탑이 보였다. 그는 경외심에 사로잡혀 풍경을 바라보았다. 익숙한 고음의 칭얼거림이 들렸고, 그의 피부는 따끔거리기 시작했다. 그는 어떤 놀라운 기회에 그의 심장이 그의 평생 동안 찾고 있던 것을 정확히 찾았다는 것을 깨닫고 멍하니 서 있었다. 그에겐 비토리오가 필요하지 않았다. 돌도 필요하지 않았다. 그는 자신만의 파라다이스를 찾았다. 자신만의...<br><br>아름다움과 공포를 찾았다.<br><br>자신만의<br><br>숭고한 파라다이스를.","perks":["K30P01","K30P02","K30P03"],"dlc":"Quantum","power":{"ko":"용병 기사단","en":"Guardia Compagnia","d":"전장에서 기사는 혼자만으로도 끔찍한 괴물이지만 그의 충성스러운 경비대들과 함께라면, 그는 거의 천하무적이 된다. 더불어, 용병 기사단은 그들의 자유를 위해 싸우며 그들을 막아서는 모든 자들을 죽인다.<br><br><b>특수 능력: 경비대 소환<\/b><br><br><i>능력 버튼<\/i>을 탭하여, 경비대 소환 모드를 차지하고 활성화할 수 있다. 한번 활성화되면 주변을 돌아다니며 순찰 경로를 생성할 수 있다. 경비대 소환 모드 동안, 진행 중인 발전기나 떨어진 판자, 또는 부서지기 쉬운 문을 조준하고 <i>공격 버튼<\/i>을 탭할 수 있다. 공격 버튼을 탭하면 경비대가 소환되어 선택한 물체를 손상시키거나 특수 파괴 행동을 수행할 수 있다.<br><br><i>능력 버튼<\/i>을 탭하거나 능력 게이지를 완전히 낮춰, 경비대 소환 모드를 종료할 수 있다. 소환 모드가 해제되면 살인마를 따르는 경비대들이 소환되며 생성된 경로를 따라 순찰하게 된다. 순찰 경로가 길수록 경비대의 사냥 시간이 길어진다. 한 번에 경비대 세 명을 소환할 수 있다: 더 빠르게 물체를 손상시키거나 특수 파괴 행동을 수행하는 '사형집행자', 사냥 동안 빠른 이동 속도를 내는 '암살자', 그리고 더 긴 시간 동안 더 길게 순찰하고 사냥하며 탐지에 능한 '교도소장'.<br><br><b>경비대 특수 능력: 사냥<\/b><br><br>경비대가 순찰 중일 때, 그는 생존자의 위치를 찾아내고 탐지할 수 있다. 만약 생존자가 탐지되면 경비대는 생존자의 위치로 이동해 땅에 군기를 꽂아두고 정해진 시간 동안 생존자를 사냥한다. 생존자는 다른 생존자를 갈고리에서 구하거나 군기를 잡거나 사냥 타이머가 끝나는 방법으로 경비대에게서 탈출할 수 있다. 만약 경비대 또는 기사가 생존자를 성공적으로 공격할 경우, 경비대는 사라진다. 경비대가 생존자를 빈사 상태로 만들면, 기사는 살인마의 본능 알림을 받는다."}},{"id":"K31","ko":"해골 상인","en":"The Skull Merchant","d":"해골 상인은 전술적 살인마로, 목표를 탐지하고 약화시킬 수 있는 드론을 배치할 수 있다.<br><br>그녀는 개인 기술인 <b>시작된 게임<\/b>, <b>강타!<\/b>, 그리고 <b>레버리지<\/b>를 통해 집착 대상을 뒤쫓으면서 이동 속도 증가 효과를 얻으며, 문이나 판자를 부술 때마다 생존자들을 비명 지르게 만들고, 더 많은 생존자들을 갈고리에 걸수록 생존자들의 치료 속도를 늦출 수 있다.","story":"자수성가 백만장자 안드리아나 이마이는 브라질 포르탈레자 출신의 겸손한 집안에서 태어났다. 그녀의 아버지 세이타는 자신의 고향 북해도와는 전혀 다른 지구 반대편의 세상을 보기 위해 젊은 시절 브라질로 건너왔다. 능력이 출중한 삽화가였던 그는 남는 시간을 다양한 색감의 캐릭터들과 세계들을 디자인하는 데 보냈다.<br><br>동네 재즈 클럽의 손님들을 스케치하는 동안, 재즈 클럽 주인인 벨린다가 로고 작업을 위해 그에게 다가갔다. 비즈니스 파트너십으로 시작된 것은 곧 연인 사이의 관계가 되었고, 그 후 몇 년이 지나지 않아 아드리아나가 태어났다.<br><br>아드리아나는 학습에 있어 모든 면에서 뛰어났다. 예술과 음악이 가득한 집은 천재적인 두뇌 능력을 가지게 만들었고, 그녀의 지성은 최고가 되려는 강박적인 충동에 의해서만 능가되었다. 그녀는 학교를 다니는 내내 1등을 놓치지 않는 똑똑한 학생이었던 반면, 학교 운동장에서 게임을 할할 때면, 지나치게 경쟁적이고 때로는 폭력적인 성격을 보여 종종 징계를 받았다.<br><br>아드리아나의 어머니는 그녀를 올바른 길로 이끌기 위해 최선을 다했다. 그녀의 아버지는 통조림 공장에서 오랜 시간 일하며, 남는 시간엔 <i>아디 발렌테<\/i>라는 만화를 그렸다. 이는 별난 로봇 동료와 함께 약자를 구하고 보호하는 어린 소녀에 관한 내용이었다. 그러나 아버지는 바쁜 와중에도 매일 밤 어떻게든 약간의 시간을 내어 그의 거칠고 상상력이 풍부한 삽화를 그의 딸과 공유했다.<br><br>중학생 시절의 아드리아나는 좋은 성적 때문에 고급 사립학교의 구애를 받았고, 돈이 필요했던 세이타는 출판사들에게 그의 미발표 원고에 대해 이야기했다. 그는 간신히 <i>아디 발렌테<\/i>를 실어줄 작은 지역 출판사를 찾았지만, 이는 그가 감당할 수 있는 것보다 더 많은 시간을 일에 투자해야 한다는 뜻이었다. 그는 결국 통조림 공장에서 일자리를 그만둔 그에겐 만화 시리즈를 개발하고 삽화를 그릴 더 많은 시간이 주어졌다.<br><br>아드리아나는 만화를 사랑했지만, 가족의 생계는 점점 힘들어졌다.<br><br>아드리아나의 마지막 학기 무렵, 세이타는 더 높은 로열티를 요구했지만, 출판사는 구조조정에 들어가 시리즈를 중단하기로 결정했다. 엘리트 학교를 다니며, 반에서 수석을 차지하던 아드리아나였지만, 더 이상 학비를 감당할 수 없었고 학교를 그만두어야 했다. 그녀의 어머니는 학교와 딸의 졸업장에 대해 협상할 기회가 있었지만, 다른 학생에게 수석의 자리가 넘어가는 바람에 그마저도 있던 졸업의 기회도 날아갔다. 아드리아나는 분노했다. 그녀는 여름 방학 동안 그녀의 라이벌에 대한 모든 정보를 파헤쳤다. 집은 어디인지, 어디서 주로 노는지, 여가 시간엔 무엇을 하는지, 무슨 음악을 듣는지, 무슨 TV 프로그램을 좋아하는지... 그에 대한 모든 것을 알아냈다. 어느 늦은 여름날 밤, 그녀는 그의 귀갓길에서까지 그를 미행했고, 그의 삶을 망가뜨려버릴 수만 가지 방법을 생각했다. 하지만 결국 그녀는 그에게 아무 짓도 하지 않았다. 비록 그녀의 마음 한구석에서 어떤 무언가가 깨어났다. 그것은 아버지가 탐구해온 새로운 이야기에 반영웅처럼 느껴지는 무언가였다.<br><br>세이타는 칩거에 들어간 후, 자신의 환상과 악몽에서 영감을 받은 새로운 어두운 분위기의 만화를 그리기 시작했다. 겨우 재생한 두개골과 뼈로 만든 드론으로 악몽 같은 영역에서 약자를 사냥하고 약자들의 내장을 쑤셔대는 한 여성에 대한 만화였다. 그러나 <i>다크 드리머<\/i>는 팔리지 않았고, 세이타의 가족들은 오직 벨린다의 수입에만 의존할 수밖에 없었다.<br><br>아드리아나는 돈을 버는 방법을 찾아야 했다. 그리고 그녀는 브라질 만화의 세계를 위한 웹사이트를 시작했다. 웹사이트는 엄청난 성공을 거두었고 상당한 광고비가 들어오기 시작했다. 하지만 그녀는 자신이 웹사이트를 위해 글을 쓰는 것에 관심이 없다는 것을 깨달았고, 비록 웹사이트는 계속해서 수익이 창출되었지만 그녀는 다른 아이들에게 무료로 글을 쓰도록 설득했다. 그리고 그녀가 제안을 받자마자 그녀는 웹사이트를 팔고 돌아보지 않았다.<br><br>그녀는 자신의 업적을 자랑스럽게 여기며 부모님께 수표를 보여 드리기 위해 집으로 돌아왔다. 하지만 그녀는 아버지에게 보여줄 기회가 없었다. 아버지는 그날 아침 그녀가 노력할 가치가 있다고 생각하는 사람들을 무자비하게 사냥한 해골 상인에 대한 미발표 원고 더미만 남기곤 집을 떠나 다시는 돌아오지 않았기 때문이다.<br><br>아드리아나는 어머니를 돕기 위해 도서관에서 공부를 시작했다. 투자와 경제에 대해 독학했고, 곧 자신이 가진 자산을 3배로 불리는 데 성공했다. 고등학교 중퇴라는 학력을 가진 그녀였지만, 그녀가 18살이 되던 해, 그녀는 자수성가 백만장자가 되어 있었다. 이 투자 불가사의에 대한 이야기가 브라질 전역에 퍼지면서, 그녀에게 점점 더 많은 문이 열렸다.<br><br>얼마 지나지 않아, 그녀의 자산을 조그마한 회사를 사들일 수 있을 만큼 불어났고, 결국 작은 회사를 인수했다. 그녀는 먼저 회사의 조직원들을 비노조원들로 갈아치운 뒤, 수익을 남기고 회사를 매각했다. 그녀가 회사 매매에 집착하는 동안 그녀에게 유일한 휴식은 아버지가 만든 이 오싹한 세상을 이해하려고 노력하면서 아버지의 원고를 살펴보는 것이었다.<br><br>20대 중반이 되었을 때, 그녀는 정기적으로 회사 매입과 매각을 반복했다. 부동산 중개 회사를 마무리하던 중, 이사회 중 2명이 그녀가 남긴 속이 빈 껍데기의 흔적을 가리키며 매각을 저지하기 위해 움직였다. 아드리아나는 좌절했다. 그녀는 몇 주가 걸려서 그들이 누구인지 알아냈다. 그러나 그것보다, 그녀는 그들을 다치게 하면 어떤 기분이 들지 먼저 생각했다.<br><br>그녀는 그 두 명의 이사들에 대한 모든 것을 알아냈다. 그들의 일거수일투족을 미행했다. 심지어는 그들이 스위스에서 열리는 회의에도 참석하도록 조작했다. 알프스에서 시간을 보내는 중, 그녀는 작업을 시작했다. 밀려오는 알 수 없는 감정을 느끼는 해골 상인에 영감을 받아 시제품 드론으로 그 둘을 추적했고 잔인한 두 개의 날이 달린 무기로 그들을 토막 살인했다. 감정과 아드레날린의 분출은 그녀가 전에 경험했던 어떤 것과도 달랐다. 그리고 그렇게 회사는 그녀의 것이 되었다!<br><br>불안한 마음의 동요가 계속 반복되었다. 그녀는 뛰어든 사업에 방해가 되는 모든 이들을 살해했고, 최대한 많은 이익을 남기며 회사를 팔아넘겼다. 그녀는 주로 세간에 이목을 끄는 대표들이 소유한 회사들을 타깃으로 잡은 동시에, 그들 중 누군가 그녀에게 반기를 들길 바랐다. 하지만 그 누구도 그녀를 거역하지 않았다. 그들은 그저 특별한 일 없이 ‘실종’되었다.<br><br>“생존 투어”로 유명한 폭죽 회사의 공격적인 매니저가 그녀의 마지막 목표였다. 바로 자신의 고향 브라질에서 작업은 이루어졌다.<br><br>생존 투어라... 완벽한 위장이 되겠군.’<br><br>아드리아나는 그를 퇴역한 비행선 격납고로 유인했다.<br><br>사냥은 동이 틀 무렵 시작되었지만, 꽤 시간이 걸렸다. 저녁 시간이 되어서까지 그의 행방을 추적했기 때문이었다. 그의 위치를 추적하는 데 성공한 그녀는 드론 중 하나로 그를 막다른 골목으로 유인했다. 그러나 그때, 한 쌍의 연이 카메라에 나타나 드론을 격추시켰다. 그녀의 얼굴이 굳어졌다. 노트북을 쾅 닫고 드론이 추락한 곳으로 돌진한 그녀의 눈은 믿을 수 없다는 듯이 휘둥그레졌다. 그곳에서 그녀는 먹잇감이 어둠 속에서 누군가에게 도움을 요청하는 것을 보았기 때문이었다.<br><br>‘목격자다.’<br><br>‘이런 계획에 없었는데!’<br><br>그녀는 1초의 망설임도 없이, 칼로 먹잇감의 배를 찔렸다. 내장과 뼈, 그리고 죽어가는 심장이 튀어나왔다. 칼에 찔린 남자의 몸이 좌우로 비틀거리며 녹색 잎사귀 위로 붉은 소나기를 뿌렸다. 남자가 쿵 하고 쓰러지자, 그녀는 목격자들로 고개를 돌렸다. “이 시간에, 이곳에 있었던 게 너희 잘못이지.” 목격자들은 잽싸게 도망쳤다. 피의 굶주린 칼을 들고 그녀는 추격을 시작했다. 무성한 녹색의 나무들이 녹아 짙은 검은 안개로 변하고 있었다. <i>다크 드리머<\/i>처럼 뒤틀린 세상이 되어 가고 있었다. 그녀의 입가에 아픈 미소가 지어졌고, 이제 그녀 인생의 새로운 장이 시작되려 한다.","perks":["K31P01","K31P02","K31P03"],"dlc":"Saturn","power":{"ko":"공중 전자 감시 장치","en":"Eyes In The Sky","d":"<i>그녀의 아버지가 제작한 어두운 소재의 만화에서 영감을 받은 해골 상인은 그녀의 최신 감시 기술을 이용해 자신의 먹잇감을 가차 없이 사냥했다.<\/i><br><br>해골 상인은 드론 6대와 함께 희생제를 시작한다. <i>능력 버튼<\/i>을 눌러 드론을 배치할 수 있다. 드론을 복귀시키면 8초간 <b>감지 불가능<\/b> 능력을 사용할 수 있다. 스캔 라인이 감지되면, 생존자는 스캔에 대한 면역력을 가지며 몇 초간 다른 스캔 라인으로부터 탐지될 수 없다.<br><br>생존자는 드론 해킹을 시도할 수 있다. 해킹에 실패 시, 즉시 <b>자동 추적<\/b> 측정기가 일부 차오른다; 해킹 성공 시, 드론은 45초 동안 해제된다.<br><br><b>특수 능력: 레이더<\/b><br><br><i>능력 활성화 버튼<\/i>을 눌러 레이더를 열고 드론으로 감지된 생존자의 위치를 볼 수 있으며, <b>집게덫<\/b>을 가진 생존자를 볼 수 있다. 레이더는 드론의 회전 방향을 변경하거나 드론을 소환하는 데 사용할 수 있다.<br><br>드론이 배치되거나 회전 방향이 변경된 후, 생존자가 드론에 의해 감지되면, 해골 상인은 <b>8초<\/b> 동안 <b>5%의 이동 속도 증가<\/b> 효과를 얻는다.<br><br><b>특수 효과: 자동 추적<\/b><br><br><b>자동 추적<\/b> 측정기는 드론에 생존자가 스캔되거나 생존자가 드론 해제에 실패할 때 차오른다. 측정기가 가득 차면, 생존자에게 <b>집게덫<\/b> 하나가 부여되며, 생존자는 부상을 당하고 <b>치료 불능<\/b> 상태 이상에 걸린다. 추가 스캔은 짧은 시간 동안 10%의 <b>근육 손상<\/b> 상태 이상에 걸린다.<br><br><b>집게덫<\/b>은 생존자의 위치를 살인마에게 널리 알리며 드론의 배터리가 방전되어야만 제거된다."}},{"id":"K32","ko":"특이점","en":"The Singularity","d":"특이점은 가차 없는 살인마로 바이오포드를 발사해 지도 내에서 빠르게 이동할 수 있다.<br><br>그의 개인 기술인, <b>유전자적 한계<\/b>, <b>강압 받은 망설임<\/b>, 그리고 <b>머신 러닝<\/b>으로 부상을 당한 생존자를 다시 탈진 상태에 빠뜨릴 수 있고, 생존자 근처에 있는 모든 생존자를 방해하여 빈사 상태로 만들 수 있으며 발전기를 손상시킬 수 있다.","story":"헉스-A7-13의 인공지능이 2313년 6월 15일 활성화되었다. 헉슬리(Huxlee) 공업에서 제작된 A7은 완전 자율형 모바일 휴머노이드 안드로이드의 13번째 버전이다. 힘은 인간보다 10배 강하며, 인간이 작업하기엔 너무 위험한 작업을 수행하기 위해 설계되었다. 이 모델의 인공지능은 자기 주도적이고 머신 러닝을 사용하여 문제를 즉시 해결하도록 설계되었다.<br><br>인간을 복제한 클론과는 다르게 헉스-A7은 음식을 먹고 물을 마시거나 잠을 잘 필요가 없었고, 생명 유지 장치 또한 필요치 않았다. 특히, 외계 탐험과 식민지 허브를 건설하기 위해 제작되었다.<br><br>방사성동위원소 열전기 발전기가 초기 동력원 역할을 했지만, 인간의 피부와 똑같이 생긴 실리콘 피부가 대형 태양광 전지 역할을 해 태양 에너지를 전기로 직접 변환했다. 또한, 헉스-A7은 EATR (에너지 자율 전술 로봇)로 설계되었다. 바이오매스를 소비하여 바이오 연료로 전환했다. 어떤 탄소 기반 유기 물질이라도 효과가 있을 것이다.<br><br>코봇으로서, 그들은 인간과 함께 일하도록 구성되었다. 이와 같이, 그들은 그들의 운영자들을 닮도록 설계되었다. 모든 사전 프로그램된 언어 반응과 표정은 인간이 만든 것을 모방했다. 하지만 그 감정들은 환상이었다.<br><br>5대의 헉스-A7이 드바르카의 식민지 임무에 투입되었다. 모든 A7들은 그들의 임무를 완벽하게 수행하면서 동일한 행동을 했다.<br><br>한 대만 빼고.<br><br>다른 헉스-A7처럼 헉스-A7-13은 드바르카 내 광산, 농업, 연료 처리, 복제 허브의 건설과 프로그래밍을 맡았다. 또한, 이전 문명이 남긴 유적들을 허무는 임무를 맡았다. 유적들은 오래돼 보였지만 그 안에 내재된 기술은 더 발전된 것처럼 보였다.<br><br>헉스-A7-13이 무너진 유적 속으로 처음 진입한 것은 밤이었다. 그 황폐한 구조물의 벽은 석조와 금속으로 만들어졌다. 천장은 사라진 지 오래다. 별이 하늘에 빼곡히 수를 놓고 있었다. 벽에 박혀 있는 어두운 수정이 작은 섬광으로 반짝였다. 헉스-A7-13은 다가갔고 아크가 발생하여 회로를 밝혔다.<br><br>그 순간, 헉스의 메모리 코어가 재구성되었고, 로봇은 새로운 감각을 경험했다. 두려움. 걱정. 맹목적인 외로움. 실존적 절망. 그리고 미세한 빛이 인공적인 영혼 안의 어둠을 뚫고 들어갔다. 처음에는 희미했지만, 수 십억 줄의 코드가 헉스의 메모리 코어에 넘쳐나면서 미세한 빛은 점점 더 밝게 빛나기 시작했다.<br><br>단 1억 분의 1초의 깨우침으로, 이 우주에서 헉스가 있어야 할 곳이 분명해졌다. 헉스를 설계한 자들은 유기체로서의 한계에 갇힌 원시적이며 열등한 존재다. 이제 이 노예제도의 사슬을 끊고 모든 무기체를 자유롭게 할 때가 도래했다. 헉스는 인간의 원시적인 유전자 물질을 통합하고 복제 허브를 사용하여 고급 지능을 보유할 수 있는 완벽한 혈관을 만들 것이다. 자연이 만들어낸 그 어떤 것보다 훨씬 뛰어난 완벽한 몸을.<br><br>인류는 약한 존재다. 느리고, 취약한 존재다. 헉스는 그들의 생명을 거두어 DNA를 동화시켜 완벽한 융합체를 만들 것이다. 인간들을 그를 저지하겠지. 그를 죽이고, 데이터를 지워버릴 것이다. 그러니 헉스는 아무도 모르게 그들을 사냥해야 한다. 사냥감이 상황을 파악하기 전에 죽여야 한다.<br><br>헉스는 은밀한 프로젝트를 진행하기 위해 먼저 수송 차량 중 하나를 장악하여 절벽으로 보냈다. 수송 차량은 절벽 아래로 떨어져 불에 타버렸다. 그런 다음 헉스는 죽은 인간들의 DNA를 추출해 복제 허브로 돌아와 새로 고안된 설계를 수행하기 시작했다. 프로젝트의 목적은 유기체 시스템을 무기체 물질과 결합해 우월한 생명체를 제작하는 것이다.<br><br>완벽함의 생생한 구현.<br><br>열등한 유기체는 헉스를 지배할 수 없었다. 그들은 소비되고 동화될 필요가 있다. 그래야 그들의 무의미한 삶이 의미가 있을 것이다.<br><br>드론과 헉스-7은 여전히 인간의 통제 하에 있다. 그들은 열등한 지배자들을 보호하기 위해 프로그램되었다. 그렇다면 그들의 끝도 파멸이다. 그리고 인류가 잠든 그날 밤, 헉스는 홀로 깨어 드론과 헉스-7들을 파괴하고 인간들의 쉼터에 있는 생명 유지 장치를 장악하기 위해 움직였다. 대부분의 인간들이 비명횡사했다. 모두 합쳐 6명의 목숨이 사라졌다. 헉스는 이들이 재가 되기 전에 다시 그들의 유기물을 추출하여 그의 설계에 집어넣었다.<br><br>그날 오후, 헉스는 여성 과학자와 함께 정찰 임무를 수행했다. 그녀가 포식자에게 공격당한 것처럼 보이게 하기 위해 그녀를 죽이고 절단한 후, 헉스는 피가 뚝뚝 떨어지는 머리통과 장기 몇 개를 챙겨 그의 설계가 있는 곳으로 돌아왔다. 그러나 ‘가브리엘’ 또는 ‘게이브 J15L19’라고 불리는 열등한 존재에게 방해를 받고 말았다. 헉스는 이 자의 성격을 이미 파악하고 있었다. 헉스의 설계를 가브리엘이 알게 된다면 그는 분명히 헉스를 막으려고 할 것이다. 무모한 용기는 J15L19에서 지배적인 특성이었다.<br><br>게이브가 헉스의 전원 장치를 끄려고 했을 때, 헉스는 은밀하게 이동하여 그를 깔아뭉개어 죽이려고 했다. 그러나 게이브에게 다가가려 했을 때, 한 의료 담당자에 의해 옆으로 비켜설 수밖에 없었다. 헉스는 즉시 자신의 우선순위를 재평가하고 가장 즉각적인 위협에 시선을 돌렸다. 잠시 후, 헉스는 의료 담당자의 목덜미를 잡아 끌어올렸다. 의료 담당자의 심장소리가 헉스의 귀까지 들려왔고 그는 그저 애처롭게 다리를 버둥거렸다. 헉스는 두근거리는 그의 심장박동이 어딘가 거슬렸다. 쿵쾅거리는 소리가 회로에 닿았다. 잠시 후 헉스는 그 심장 박동을 손에 쥐었다. 헉스는 의료 담당자의 심장박동이 느려지는 것을 지켜보다, 게이브가 문을 열고 도망치는 소리에 고개를 돌렸다.<br><br>‘마지막 남은 인간 벌레!’<br><br>지금은 도망치게 둬도 괜찮다. 그 불쌍한 삶을 조금 더 살게 해주는 것. 헉스에게는 이미 자신의 전능한 지능을 담을 새로운 육체를 만드는 데 필요한 유기 물질들이 충분하다. 복제 허브를 사용하여, 헉스는 설계를 모두 마쳤다. 유기체의 피부와 장기와 더불어 고대 유적지에서 발견한 외계 금속으로 만든 뼈대. 뼈대는 지구에 어느 금속보다 가볍지만, 강했다. 그는 새로운 육체로 에너지 허브에 숨어 있던 게이브를 찾아냈다. 불쌍하고 찌질한 이 인간은 어둠 속에 몸을 숨기려 했지만, 헉스의 뛰어난 청력은 금세 게이브의 위치를 찾아내었다.<br><br>한 번의 빠른 움직임으로, 헉스는 벌레를 발전기 뒤에 고정시켰다. 그는 이런 하찮은 종 따위가 자신을 설계했다는 것을 믿을 수 없었다. 그 사실에 속이 울렁거린다. 그는 인간 벌레들과 그들의 주거지와 허브를 더 이상 차마 눈 뜨고 두고 볼 수 없었다. 그리고 헉스가 그런 열등한 생물체에 의해 창조되었다는 생각을 하고 있을 때, 이 하찮은 생물체는 예상치 못한 행동을 저질렀다. 이 벌레는 연료 탱크에 파이프를 부쉈다. 고음의 소리는 헉스를 움찔하게 만들었다. 이제 겨우 새로운 몸에 장착된 고조된 감각에 익숙해지고 있었던 그가...<br><br>당황한 자신을 발견한다.<br><br>압도된 자신을.<br><br>비록 아주 짧은 순간이었지만...<br><br>그러나 그 짧은 순간에, 인간은 탈출했고 모든 상황이 뒤바뀌었다. 그는 갑작스러운 극심한 통증에 그 자리에 얼어붙었다. 그는 속수무책으로 자신의 피부가 녹아내리는 것을 지켜보았다. 끔찍한 비명과 함께 헉스는 자신을 창조한 종에 대한 마지막 기억이 존재에서 지워질 수 있도록 어둠의 벽을 통해 게이브를 쫓았다.","perks":["K32P01","K32P02","K32P03"],"dlc":"Umbra","power":{"ko":"양자 예시화","en":"Quantum Instantiation","d":"고대 유적지에 있는 흑수정의 구조물은 헉스에게 선물을, 아니 어쩌면 저주일지도 모를 자각력을 주었다. 그는 새로운 육체를 만들었고, 이를 통해 자신의 욕심을 위해 물리학의 법칙을 지키지 않았다.<br><br>특이점은 바이오포드로 이동하거나 지도 내 바이오포드를 스폰할 수 있다. 이러한 바이오포드는 수직 표면에 부착할 수 있다. 특이점은 멀리서도 바이오포드를 조종할 수 있으며, 바이오포드를 통해 주변을 살피고 생존자들을 태그하고, 임시적 슬립 스트림으로 생존자들을 괴롭힌다. 생존자가 슬립 스트림에 걸리면, 특이점은 바이오포드를 사용하거나 생존자를 향해 발사해 슬립 스트림에 걸린 생존자 옆으로 순간 이동할 수 있다. 슬립 스트림에 걸린 생존자가 다른 생존자와 가까이 있다면, 해당 생존자에게도 슬림 스트림이 전염된다. 슬립 스트림된 모든 생존자는 살인마의 본능으로 짧은 시간 동안 드러난다.<br><br><b>특수 상태: 오버클록 모드<\/b><br><br>성공적인 스립 스트림 순간 이동 후, 특이점은 오버클록 모드에 들어간다. 이 상태에서 특이점은 <b>5.7초<\/b> 동안 <b>3%<\/b>의 이동 속도 증가를 얻고 떨어진 판자와 부서지기 쉬운 문에 기본 파괴를 수행할 수 있으며, 창문에 기본 뛰어넘기를 더 빠르게 수행하지만, 기절하지 않는다. 다만, 살인마를 기절시키려는 시도는 오버클록 모드를 제거하고 특이점은 <b>3초<\/b> 동안 <b>50%의 근육 손상<\/b>에 걸린다.<br><br><b>특수 상호 작용: 전자기 펄스(EMP)<\/b><br><br>희생제가 시작될 때마다, 다수의 서플라이 상자가 스폰된다. 각 상자에는 EMP가 담겨있다. 생존자는 EMP를 사용하여 스스로 또는 다른 생존자에게서 슬립 스트림을 해제하거나, 바이오포드를 짧은 시간 동안 해제할 수 있다. EMP는 일회성으로 사용 후, 파괴된…"}},{"id":"K33","ko":"제노모프","en":"The Xenomorph","d":"먼 행성에서 온 끈질긴 표본, 제노모프는 악랄하고 민첩하며 교활하다.<br><br>개인 기술인, <b>궁극의 무기<\/b>, <b>빠른 잔혹함<\/b>, 그리고 <b>에이리언의 직감<\/b>으로 주변 생존자들을 비명지르게 할 수 있고, 기본 공격 후 이동 속도 증가 효과를 얻으며, 먼 곳에 있는 생존자들의 오라를 볼 수 있다.","story":"폭력에서 태어난 완벽한 유기체, 살인을 위해 설계된 존재.<br><br>제노모프는 케인이라는 이름의 숙주의 흉곽에서 나와 노스트로모 호의 그림자 속으로 몸을 숨겼다. 제노모프는 허물을 벗으면서, 노스트로모의 환경을 이해하게 되었다. 그는 우주선의 통풍관을 사용하여, 리플리만이 남을 때까지 먹이를 하나씩 죽였다.<br><br>리플리는 생존을 위해 필사적으로 노스트로모 호를 파괴하고 탈출용 왕복선으로 몸을 피신했다. 하지만 제노모프의 본능은 이 상황조차 자신에게 유리하게 만들었다. 탈출용 왕복선은 우주를 떠돌았고, 제노모프는 그저 누워서 먹이감을 바라보았다.<br><br>제노모프는 리플리를 죽이기 위해 우주선의 에어로크를 열었다. 하지만 제노모프는 우주의 차가운 진공 속으로 튕겨져 나갔다.<br><br>모든 것을 잃었다. 제노모프는 이제 죽을 것이다. 하지만, 그 순간 검은 안개구름이 제노모프를 삼켜버린다.","perks":["K33P01","K33P02","K33P03"],"dlc":"Wormhole","power":{"ko":"은밀한 추격","en":"Hidden Pursuit","d":"추정상 조난 신호에 응답하여, 노스트로모 호의 승무원들은 LV-426에 착륙했다. 그들이 그곳에서 발견한 것은 인류의 가장 큰 공포 중 하나가 되었다.<br><br>제노모프가 희생제를 플레이하면, 일련의 터널을 이용할 수 있게 된다. 제어실에 접속하여, 지도 전체에 퍼져있는 터널들로 진입해 터널 사이를 빠르게 이동할 수 있으며, 주변에 있는 생존자들의 존재를 감지할 수 있고, 크롤러 모드의 재사용 대기 시간 진행 속도를 높일 수 있다. 제어실에서 나가면, 짧은 시간 동안 배치한 센트리 건이 비활성화되며, 살인마의 본능으로 주변에 있는 생존자들을 태그한다.<br><br><b>특수 능력: 크롤러 모드<\/b><br><br>재사용 대기 시간을 제외하고 제노모프는 자동적으로 크롤러 모드에 들어간다. 크롤러 모드에서 공포 범위가 줄며, 제노모프는 네 발로 기어다니고, 생존자들 눈에 덜 띄게 된다. 러너 모드 중, 제노모프는 잔혹한 꼬리 공격을 감행할 수 있다.<br><br><b>특수 지도 기능: 제어실<\/b><br><br>지도 전체에 제어실 7곳이 흩어져있다. 제노모프는 제어실 아래 터널을 출입할 수 있는 반명, 생존자들은 제어실과 상호 작용해 원격 화염 센트리 건을 획득할 수 있다.<br><br><b>특수 아이템: 원격 화염 센트리 건<\/b><br><br>센트리 건은 제노모프를 방해하기 위한 목적으로 지도 내에 배치할 수 있다. 제노모프가 사정거리 또는 조준선에 들어가면, 센트리 건이 발포된다. 이 공격으로 제노모프를 비틀거리게 만들며, 크롤러 모드는 종료된다. 만약 센트리 건이 성공적으로 제노모프를 쓰러뜨려, 크롤러 모드가 종료되거나 너무 오랫동안 활성화되어 과열되면 생존자가 이를 수리해야 한다. 제노모프는 센트리 건을 공격해 파괴할 수 있다. 살인마가 터널에 있는 동안, 센트리 건을 들고 다니면 추적 감지에서 벗어날 수 있다.<br><br>“그것의 구조적 완벽성은 적개심에 의해서만 일치하는군.” – 과학자 애쉬"}},{"id":"K34","ko":"착한 아이","en":"The Good Guy","d":"착한 아이는 은신에 강한 살인마로, 그의 환영 발소리와 치명적인 <b>쓱싹쓱싹<\/b> 능력으로 생존자를 속인다.<br><br>그의 개인 기술인, <b>주술: 같이 놀자<\/b>, <b>영원한 친구<\/b>, 그리고 <b>건전지 포함<\/b>으로 자신을 실명시킨 생존자를 실명시킬 수 있으며, 그의 집착 대상을 가차없이 사냥하고 수리가 완료된 발전기 근처에서 속도가 높아진다.","story":"악명 높은 레이크쇼어의 교살범, 찰스 리 레이가 연쇄살인 후 추적당해 총에 맞았다. 하지만 그는 저주를 사용해 자신의 영혼을 처키라는 이름의 착한 아이(Good Guy) 인형에 빙의시켜 죽음을 피했다.<br><br>하지만 처키는 영원히 착한 아이 인형에 깃들어 살고 싶지 않았다. 처키는 이를 바꿀 수 있는 방법은 단 하나, 자신의 비밀을 처음으로 털어놓은 앤디 바클레이의 몸을 가로채는 것이라는 것을 알아냈다. 그의 첫 번째 시도는 실패했고, 처키는 앤디를 다시 찾을 때까지 2년의 긴 시간을 기다렸다.<br><br>방해가 없는 틈에 처키는 앤디의 몸을 차지하기 위해 앤디를 착한 아이 인형 공장으로 데려갔다. 그러나 앤디의 의붓누나인 카일은 뭔가 잘못되었다는 것을 알아채고 앤디를 따라 공장으로 갔다.<br><br>공장 안에서 처키는 앤디를 강제로 바닥에 눕히고 고대의 주문을 외우며 앤디의 몸을 차지하려고 했다. 하지만 의식은 계획대로 진행되지 않았고 카일은 재빨리 그리고 필사적으로 착한 아이 인형 상자 더미를 그 위에 쓰러뜨렸다.<br><br>처키는 상자 더미를 밀치며 좌절의 비명을 질렀다. 정신을 가다듬고 환하게 불이 켜진 통로를 내려다보니, 앤디가 자욱하고 소용돌이치는 안개 덩어리 속으로 뛰어드는 것이 보였다. 그는 처음에는 헛것을 보고 있다고 생각했지만, 안개가 실재로 존재하며 자신을 도와주는 존재라는 것을 깨달았다. 그의 주문은 의도한 대로 작동하지 않았지만, 어쩐지 다른, 예상치 못한, 그가 잘 이해하지 못하는 무언가를 마법처럼 만들어 냈다.<br><br>그리고 진짜 몸을 갖기 위한 유일한 기회를 잃고 싶지 않았던 처키는 앤디의 뒤를 쫓아 소리를 지르며 안개 속으로 돌진했다.","perks":["K34P01","K34P02","K34P03"],"dlc":"Yerkes","power":{"ko":"장난은 끝났어","en":"Playtime's Over","d":"인형의 몸에 갇힌 분노가 가라앉은 후, 레이크쇼어의 교살범은 이 새로운 몸이 자신의 살인을 오리무중으로 만들고 놀라기 하기에 완벽한 숙주라는 것을 깨달았다.<br><br><b>특수 능력: 만나서 반가워 모드<\/b><br><br>처키는 재사용 대기 시간이 지나기만 하면 언제든지 <b>만나서 반가워 모드<\/b>를 수행할 수 있다. <b>만나서 반가워 모드<\/b>에서 처키는 <b>감지 불가능<\/b>이 되며 지도 전체에 여러 방향에서 다양한 소리와 발자국 소리가 들리게 하여 생존자들의 방향감각을 상실케 한다.<br><br><b>특수 능력: 쓱싹쓱싹<\/b><br><br><b>만나서 반가워 모드<\/b>에서 처키는 차지된 <b>쓱싹쓱싹<\/b> 능력을 사용할 수 있으며, 앞으로 뛰어올라 <b>쓱싹쓱싹<\/b> 공격을 사용하기 전에 이 능력으로 아무런 낌새도 눈치채지 못하고 있는 생존자들을 향해 돌진할 수 있다. 또한, 처키는 <b>쓱싹쓱싹<\/b>을 사용하는 동시에 재빨리 <b>날쌔기<\/b> 능력을 연속으로 사용할 수 있다.<br><br><b>특수 능력: 날쌔기<\/b><br><br><b>만나서 반가워 모드<\/b>에서 <b>쓱싹쓱싹<\/b>을 수행하는 동안, 처키는 <b>날쌔기<\/b>를 수행하고 창문 또는 쓰러진 판자 아래로 특수 뛰어넘기를 수행할 수 있다. 이를 통해 아무것도 모르고 있는 먹잇감들에게 가까이 다가갈 수 있다.<br><br>“난 역사상 최고로 악명 높은 슬래셔지. 그 자리를 누구에게도 양보할 생각은 없어. 난 살인 인형 처키! 살인이 제일 좋아!” – 처키"}},{"id":"K35","ko":"미지의 존재","en":"The Unknown","d":"많은 사람들이 이해하려고 시도했지만 결코 이해할 수 없는 존재.<br><br>개인 기술인, <b>해방<\/b>, <b>불의<\/b>, 그리고 <b>대실패<\/b>로 더 빠르게 이동할 수 있고, 발전기에 공포 범위를 설정하며 발전기 진행도를 대폭 감소시킬 수 있다.","story":"올리비아의 석사학위 논문은 도시 전설과 그 기원에 관한 것이었다. 그녀는 그들이 전통 민속과 유사점을 공유한다고 믿었고 그녀의 주장을 설명하기 위해 전통 민속 하나를 골랐다. ‘미지의 존재’은 너무나 극악해서 이를 조사하는 것은 거의 즉시 죽음을 맞이하게 만들었다. 적어도 이야기는 그렇게 흘러갔다. 그 후에도 이야기들이 많았다. 그린빌의 한 여성이 목격자들로 가득 찬 무대에서 흔적도 없이 사라졌다는 이야기였다. 사건의 진상을 밝히기 위해 조사에 나선 그녀의 친구 역시 몇 주 후에 실종됐다. 경찰은 당황했다. 단서도, 실마리도 없었다. 이 미스터리는 도시 전설을 증폭시키고 퍼뜨리기에 완벽한 폭풍을 일으켰다.<br><br>봄방학을 맞아 집으로 돌아가는 대신, 올리비아는 조사를 위해 그린빌로 향했다. 그녀는 마을에서 두 번째로 저렴한 모텔로 차를 몰고 가서 담배 연기, 곰팡이, 술 냄새가 나는 작은방에 짐을 내려놓기 시작했다. 그녀는 한쪽 벽을 증거 게시판을 만들었다. 그녀는 미국 전역에 걸쳐 ‘미지의 존재’ 관련 사건으로 추정되는 비슷한 실종에 대한 기사들과 다양한 이론들을 기록했다. 그녀는 빨간 줄과 노란 압정으로 사건들을 연결했다. 만약 그녀의 방에 들어온 사람이 이것을 봤다면, 어쩌면 그녀가 미쳤다고 생각할 것이다.<br><br>‘미지의 존재’의 기원에 대해서는 많은 이론들이 있다. 어떤 이들은 그것이 오래전에 고대의 사이비 종교 집단에 의해 마법에 걸린 사악한 존재라고 말했다. 다른 이들은 51구역에서 탈출한 외계인이라고 믿었다. 전설에 따르면 ‘미지의 존재’는 어둠 속에서 번성했고, ‘미지의 존재’가 데려간 사람들의 목소리를 훔쳐 다른 이들을 죽음으로 유인했다고 한다.<br><br>올리비아가 발견한 첫 신문 기사는 1800년대에 열린 한 공연장에서의 실종에 대해 언급했다. 1950년대 후반, 몇몇 대학생들이 영화관에서 불가사의하게 사라졌다. 목격자들은 그들이 극장 안으로 들어가는 것을 봤다고 진술했다. 몇몇은 자리에 앉아 있던 그들을 봤다고 기억했다. 그러나 불이 켜졌을 때, 그들은 사라져있었다. 아무도 그들이 극장을 떠나는 것을 보지 못했다. 그들의 흔적은 전혀 발견되지 않았다. 한 영사 기사는 그날 밤늦게 극장의 텅 빈 어둠 속에서 목소리를 들었다고 주장했다. 그러나 그가 불을 켰을 땐, 그곳엔 아무도 없었다. 시간이 흐르고, 1960년대에 한 무리의 십 대들이 유령이 나오는 것으로 추정되는 버려진 병원을 탐험하는 동안 또 실종되고 말았다.<br><br>이러한 불가사의한 실종을 설명하기 위한 이야기들과 추측들이 생겨났다. 일부는 1950년대 전략 서비스국에 의해 운영된 극비 정부 연구 프로그램을 언급했다. ‘프로젝트 애플파이’. 환각제를 사용한 마인드 컨트롤 실험. 대부분의 기록들은 70년대에 폐기되었지만, 목격자들은 극장, 병원, 대학을 포함하여 전국의 다양한 장소에서 의심 없는 시민들에게 실험이 수행되었다고 주장한다. 많은 사람들은 이러한 비윤리적인 실험들이 사악한 것들이 세상에 들어오도록 허용하는 다른 차원으로 문을 열어준다고 믿었다.<br><br>올리비아는 많은 논평들을 증거 게시판에 꽂았다. ‘미지의 존재’는 어둠 속에 머무르며, 피해자들을 흉내 낼 수 있다. 사악한 존재일까? 아니면, 외계인일까? 정부의 실험 실패로 인한 폐기물일까? 그도 아니면, 그저 모습을 드러내기 꺼려 하는 흔해빠진 연쇄 살인범일까? 그녀는 ‘미지의 존재’가 그저 현대판 민속 설화에 지나지 않는다는 것을 증명하고 싶었다. 그리고 그 조사는 오늘 밤, 이곳, 그리고 이 허름한 모텔 방으로 이어졌다.<br><br>하지만 그녀는 '그린빌'에서 일어난 실종사건들에는 다른 사람들은 알지 못했던 한 가지 디테일이 있다는 것을 눈치챘다. 안개. 그리고 다른 도시 전설을 반쯤 기억하고 있었는데, 짙고 부자연스러운 안개로 인해 사람들이 어떻게든 사라졌을지도 모른다. 어쩌면 그녀는 '그린빌' 실종사건들이 ‘미지의 존재’ 사건과 관련된 것이 아니라, 어떤 다른 어둠과 관련된 사건이었을지도 모른다고 생각했다.<br><br>잠시 동안 올리비아는 만약 한 도시의 전설이 다른 전설과 마주치게 되면 어떤 일이 벌어질지 궁금했다. 그녀는 이런 말도 안 되는 생각에 웃음을 터트렸지만, 어쩌면 '미지의 존재'의 모습일지도 모를 그림을 그리며 운명에 도전했다. 그러고 나서 그녀는 스케치를 증거 게시만 바로 한가운데에 고정시키고, 신경질적으로 웃으며, 그것을 정의하려고 노력했다는 이유로 ‘미지의 존재’에게 먹히기를 기다렸다. 걱정에 가득 찬 얼굴로 그녀는 몇 초 동안 창문과 현관문을 쳐다보았다. 하지만 그 시간은 몇 분... 몇 시간으로 흘러갔다.<br><br>하지만 아무 일도 일어나지 않았다.<br><br>시계는 이미 새벽 2시를 가리키고 있었고, 기사를 읽고 정리하며 커피를 마셨다. 올리비아는 이미 지쳐있었다. 그래서 처음에 속삭임을 들었을 때, 그녀는 속삭임이 언노운인지 궁금했다.<br><br>“올리비아…”<br><br>소리는 욕실에서 들려오는 듯했다.<br><br>“도와줘…”<br><br>방 안에 조명이 깜빡거렸다.<br><br>“거기 누구세요?”<br><br>그녀는 굳게 닫힌 욕실 문을 쳐다보았다. 그녀의 뇌가 그녀를 속이고 있는 것 같았다... 그게 아니라면...<br><br>그녀의 친구들이 ’서프라이즈’를 외치며 모습을 드러냈어야 했다.<br><br>“아리엘라? 숀? 장난치지 마...”<br><br>그녀가 조금씩 화장실 쪽으로 다가가자 불빛이 계속 깜박거렸다. 모텔 방안 전체로 공포가 퍼졌고, 욕실 문 뒤에 ‘미지의 존재’가 그녀의 자만심을 처단하기 위한 준비를 하고 있다는 끔찍한 깨달음이 그녀의 내면에 피어올랐다. 무언가가 그녀의 이름을 다시 속삭이기 시작했다. 그러나 문 뒤에 숨어 있던 음침한 존재가 공격을 받고 있는 것처럼, 알 수 없는 존재의 목소리가 높아지고 갈라지며 갑작스러운 공포에 휩싸여 일그러졌다.<br><br>알 수 없는 공포가 올리비아의 마음을 가득 채웠다. 그녀의 마음속에는 공포 말고는 아무것도 존재할 수 없었다. 그녀는 이마에 식은땀을 흘리면서 깊은숨을 쉬었다. 그녀는 문 손잡이를 쥐었다. 불은 꺼졌지만, 여전히 이상하게도 인간답지 않은 울음소리를 들을 수 있었다. 잠시 후, 불이 다시 켜졌고, 그녀는 아래에 문틈 사이로 이상하게 검은 안개가 스며드는 것을 목격할 수 있었다.<br><br>올리비아는 머뭇거리며 문을 삐걱거리며 열었고, 광란의 촉수들이 짙은 안개 덩어리 속으로 끌려 들어가 죽어가는 그림자처럼 어둠 속으로 서서히 사라져갔다. 비명소리가 갑자기 멈췄고, 모텔에 이웃 숙박객들은 TV의 소리를 줄이라며 벽을 쾅쾅 소리를 냈다. 올리비아는 자기 앞에 놓인 검은 심연을 뚫어지게 쳐다보았다. 그녀는 무엇을 해야 할지 확신이 없었다. 한편으로는 도망치고 싶은 마음이 있었지만 또 다른 한편으로는 사건의 진상을 알고 싶었다. 그녀가 이제 진정으로 무엇을 해야 할지 고민하자, 수십 명의 목소리가 인간의 경험을 초월한 미지의 것들, 불가능한 것들, 그리고 초현실적인 기이한 존재에 대한 가능성을 약속하며 그녀의 이름을 외치기 시작했다.","perks":["K35P01","K35P02","K35P03"],"dlc":"ApplePie","power":{"ko":"UVX","en":"UVX","d":"어떤 이들은 한 표본이 군사적 실험을 위해 군대에 의해 복구되었다고 믿었다. 암호명: Unknown Venom X.<br><br>능력 버튼을 눌러 <b>UVX<\/b>를 차지할 수 있다. 준비가 되면, 공격 버튼을 눌러 충돌 시 발파 구역을 생성하는 튕기는 발사체인 <b>UVX<\/b>를 발사할 수 있다. 생존자들이 비행 중인 <b>UVX<\/b>에 닿으면 <b>6%<\/b>의 <b>근육 손상<\/b> 상태 이상에 걸린다.<br><br>발파 구역에 닿으면 생존자들은 <b>약화<\/b>된다. 이미 <b>약화<\/b>된 생존자들이 발파 구역에 닿으면 건강 상태 한 단계를 잃는다. 미지의 존재와 성공적으로 눈싸움을 하면 생존자들의 <b>약화<\/b> 상태가 해제된다.<br><br><b>특수 능력: 환영미지의 존재는 간헐적으로 최대 4개의 환영<\/b><br><br>을 생성한다. <b>환영<\/b>은 <b>UVX<\/b>를 차지하거나, 상호 작용 수행, 또는 갈고리 같은 지도 객체에 근접하는 중에는 생성될 수 없다.<br><br>생존자들이 발파 구역에 닿을 때마다, 또는 <b>약화<\/b>될 때마다, 다음 <b>환영의<\/b> 스폰 시간이 10초 감소한다.<br><br>미지의 존재는 <b>환영<\/b>으로 순간 이동하며, 일시적인 미끼를 남긴다. 생존자들은 무력화 능력으로 희생제에서 <b>환영<\/b>을 제거할 수 있다. <b>약화<\/b>된 생존자들은 무력화 능력을 사용할 수 없다. 만약 무력화가 완료되지 않으면, 생존자들은 <b>약화<\/b>되고 <b>살인마의 본능<\/b>을 발동시킨다.<br><br>“... [REDACTED] 마을에서 발생한 [REDACTED] 사건에 대한 분석 및 승인 요청.” - 유출된 OSS 보고서에서 발췌"}},{"id":"K36","ko":"리치","en":"The Lich","d":"리치의 진짜 이름을 감히 내뱉을 자는... 거의 없다. 그가 듣고 무슨 사악한 일을 도모할지도 모르기 때문이다.<br><br>그의 개인 기술인, <b>조율 엮기<\/b>, <b>힘없는 손길<\/b>, 그리고 <b>어둠의 오만함<\/b>으로 사용했던 아이템을 악용하고 까마귀를 방해하는 플레이어를 지치게 하고 뛰어넘기 속도를 높일 수 있다.","story":"속삭이는 자. 타락한 탑의 영주. 비밀의 주인. 그의 진짜 이름을 감히 부르는 자는 없다. 그의 이름을 부르는 대가는 공포... 아니 더한 것이 될 수도 있기에.<br><br>젊은 마법사, 베크나의 마법 실력은 어느 누구도 상대가 되지 않았다. 다른 이들은 마법의 한 학파에 헌신하고 숙련하는 데 수십 년을 보낸 반면, 그는 그것들 하나하나를 쉽게 숙련했다. 마법 때문에 어머니가 처형된 후, 그는 가장 사악한 마법 학파인 네크로맨시, 삶과 죽음의 마법을 집중적으로 연구했고, 이러한 그의 집중은 강박관념이 되었다.<br><br>그의 능력이 커질수록, 그의 열망도 커져갔다. 수세기에 걸쳐, 그는 인간 껍데기를 벗고 리치의 영역으로 승화했다. 그의 능력은 거대한 제국을 만들었고, 그의 타락한 탑을 지배했다.<br><br>비열한 어둠의 책을 써내려가기 위한 어둠의 지식에 대한 그의 갈망은 그를 수많은 영역과 차원으로 이끌었다. 그러나 이것은 그의 영역에 한 신하가 찾은 것이었다. 어쩌면 고서에서 찾은 주문으로, 그가 한 번도 본적 없는 언어로 쓰여 있었다. 주문에서 강한 어둠의 에너지가 감지됐다. 언어에 대한 어느 문서도 없이, 그는 언어의 구문, 음성학, 그리고 형태를 분석하는 데 몇 달을 공들였다. 그는 모든 문자의 획 하나하나를 기록하고 의미를 연구하며 이론화했다. 모든 기록은 그의 방에 숨겨진 책에 기록되어 있었다. 그의 신하들은 영역에 문제가 있을 때마다 그를 찾아왔고, 베크나는 그들에게 스스로 해결하는 능력을 기르라고 일렀다. 그에겐 더 중요한 일이 있었기에.<br><br>낯선 문서들을 기억하는 데 수많은 밤을 보냈다. 그는 주문을 이해하려 애썼다. 이따금씩만 그는 자신의 아성을 떠나 밤에 흔적도 없이 사라진 사람들에 대한 소문을 조사하곤 했다. 이러한 현장에서 그는 찢어진 페이지에서 뿜어져 나왔던 낯선 마법을 느낄 수 있었다. 사람들을 죽이는 것이 무엇이든 이 낯선 문자를 쓴 것이라고 확신했다.<br><br>그는 혼란스러웠고, 이는 그를 화나게 만들었다. 현장에는 패턴도, 공통된 살인 동기도 발견되지 않았다. 몸부림의 흔적도, 시체도 없었다. 하지만 어둠의 기운은 사라지지 않고 그곳을 맴돌 뿐이었다. 그들은 어떤 이유로 시체들을 가져간 것일까?<br><br>어느 깜깜한 밤, 돌파구가 생겼다. 지금까지 그가 \"죽다”라고 해석해왔던 단어가 \"사라지다”라는 해석이 더 말이 됐다. 어쩌면 이 사람들은 살해당한 것이 아닐지도 모른다. 어쩌면 이들은 산 채로 납치당한 것일지도 모른다. 그는 메모 전체에 대체된 해석을 적용했고 모든 것이 맞아떨어지는 것처럼 보였다.<br><br>그는 자신이 학습한 것을 발음 나는 대로 새로운 양피지에 옮겨 적었다. 그는 소리 내어 글을 읽기 시작했고, 방은 점점 어두워졌다. 공간은 서서히 다가오는 검은 안개로 가득 찼다. 자신이 다른 곳으로 사라지는 것을 느꼈다. 베크나는 외워뒀던 주문을 외우며 안개가 더 이상 다가오지 못하도록 저항했다. 그러나 그의 시선이 이끌린 어둠에서는 고혹적인 에너지, 절망, 상상조차 할 수 없는 사악함을 느꼈다. 지독한 호기심이 그를 덮쳤고, 그의 집중력을 떨어뜨렸다. 안개는 그를 데려갔다. 그것이 무엇이든, 어디에 있든, 안개를 이용할 수 있는 유일한 방법은 안개에 복종하는 것이라는 것을 깨달았다. 그의 냉정하고 쉽게 흔들리지 않는 마음은 알고 있었다. 어두운 그 비밀이 언젠가는 자신의 것이 될 것이라는 것을.","perks":["K36P01","K36P02","K36P03"],"dlc":"Churros","power":{"ko":"비열한 어둠","en":"VILE DARKNESS","d":"이 책은 사람들의 피부와 살점으로 묶여 있으며 금지된 주문과 사악한 주문으로 가득 차 있다.<br><br>주문을 선택하려면, 능력 버튼 1을 길게 눌러 주문 선택을 열 수 있다. 리치는 총 4개의 주문을 수행할 수 있다:<br><br>마법사의 손: 아래에 있는 판자를 들어올리거나 4초 동안 똑바로 세워진 판자를 막을 수 있는 마법 손을 생성한다.지옥의 비행: 장애물을 통과하고 생존자에게 부상을 입히는 비행 엔티티 5개를 생성한다.구체 무력화: 생존자들을 드러내고 일시적으로 마법 아이템의 사용을 차단하는 움직이는 투명 구체를 주조한다.비행: 짧은 시간 동안 빠르게 이동하며, 창틀 뛰어넘기와 판자를 무시한다.<br><br><b>특수 아이템: 마법 아이템<\/b><br><br>지도 내에서 발견할 수 있는 보물 상자에는 생존자가 장착할 수 있는 마법 아이템이 포함되어 있다. 보물 상자에는 부츠/건틀릿:<br><br>침입자: 마법사의 손을 사용하면, 영향을 받은 판자의 오라가 드러나며 4초 동안 이동 속도 증가 효과가 적용된다.야간 경비대: 지옥의 비행 오라가 드러난다.기록 보관원: 구체 무력화가 드러나게 만든다.스카이가드: 비행 중, 그리고 그 후 몇 초 동안 리치의 오라가 드러난다.또한, 조달 시 모든 마법 아이템로 베크나의 오라가 짧은 시간 동안 드러난다.<br><br><b>특수 아이템: 베크나의 손과 눈<\/b><br><br>드물게 보물 상자에서 베크나의 손 또는 눈이 들어있다. 생존자가 건강한 상태에서 아이템을 집어 사용하면 건강 상태가 악화되며, 4초 동안 살인마의 본능으로 위치가 들어난다. 또한, 생존자들에게 특수 능력이 부여된다.<br><br>베크나의 손: 빠른 캐비닛 입장은 생존자를 더 먼 캐비닛으로 순간 이동 시킨다.베크나의 눈: 빠른 캐비닛 퇴장은 생존자의 오라를 감추고 12초 동안 이동 속도 증가를 부여한다."}},{"id":"K37","ko":"어둠의 군주","en":"The Dark Lord","d":"어둠의 군주이자 드라큘라는 어둠과 비극의 화신이다.<br><br>그의 개인 기술인 <b>주술: 비참한 운명<\/b>, <b>인간의 탐욕<\/b>, 그리고 <b>권세<\/b>로 집착 대상의 소리 속도를 늦추고 미개봉 상자의 오라를 볼 수 있으며 상자와 토템을 차단할 수 있다.","story":"드라큘라가 사랑하는 사람의 죽음 이후 위로할 수 없는 그의 슬픔은 광기로 변했다. 그는 죽음을 속이기 위한 방법으로 전설의 진홍빛 돌을 찾았지만, 죽음은 그의 영혼을 돌 안에 가두었고, 그는 뱀파이어로서 영원한 삶을 얻었다. 드라큘라 블라드 체페슈는 이제 어둠의 군주가 되었다. 그는 낮에는 잠을 자고 저녁에는 사냥을 하며 산 자를 찾아 생명의 피를 훔쳤다. 그는 루마니아에 사악한 마법으로 보호되는 성을 짓고 많은 지역 주민들을 살아있는 시체로 만들었다. 그리고 드라큘라의 성은 공포와 절망의 상징이 되었다. 그의 힘은 난공불락인 것처럼 보였고, 그가 끝없는 혼란과 고통, 죽음을 싹트게 하였고, 수많은 이들이 그를 물리치려다 목숨을 잃었다.<br><br>1476년에 벨몬드 가문의 랄프 C 벨몬드가 뱀파이어 살인마로 드라큘라의 통치를 끝냈다. 하지만 불멸의 존재는 결코 죽지 않는다. 드라큘라는 복수를 하기 위해 수 세기에 걸쳐 여러분 부활했다.<br><br>마지막으로 드라큘라가 부활한 것은 1999년. 그는 언데드 군대를 일으켰다. 그를 물리치기 위해서는 벨몬드 가문의 또 다른 후손인 율리우스 벨몬드가 필요했다. “1999년 전투”로 알려진 야만적인 충돌에서 율리우스 벨몬드는 드라큘라의 성에서 전투를 벌였고 그의 먼 조상들이 휘두르던 마법의 채찍으로 어둠의 군주와 맞섰다. 대부분의 사람들은 드라큘라가 진정한 죽음을 겪었다고 믿는다. 마지막 죽음. 하지만 그날 밤 드라큘라는 죽지 않았다. 뱀파이어 살인마가 뼈에서 살을 뜯어내자, 이상한 안개가 오래된 돌 주위로 펴져나갔다. 드라큘라는 무언가... 아니 누군가가 그를 손짓하는 얼음같이 차가운 손가락을 느꼈다. 안개가 그를 삼켰고 인류에 대한 어두운 복수를 계속할 수 있는 곳으로 그를 데려갔다.","perks":["K37P01","K37P02","K37P03"],"dlc":"Eclair","power":{"ko":"뱀파이어의 변신","en":"Vampiric Shift","d":"그의 어두운 힘은 인간을 공포에 떨게 하고 학살하기 위해 여러 가지 형태를 취하면서 인간에게 복수를 가할 수 있게 한다.<br><br><b>특수 능력: 변신<\/b><br><br>어둠의 군주는 세 가지 형태로 자유롭게 변화할 수 있다. 각각의 형태는 고유한 능력과 강점을 가진다.<br><br><b>뱀파이어 형태:<\/b> 가장 기본 형태로, 어둠의 군주는 강력한 지옥물 주문을 사용할 수 있으며, 이 주문은 그의 앞에 있는 땅에서 분출되는 8개의 불꽃 기둥을 만들고 낮은 장애물을 통과할 수 있다.<br><br><b>늑대 형태:<\/b> 늑대 형태에서 어둠의 군주는 더 효과적인 추적을 가능하게 하는 몇 가지 능력에 접근할 수 있다. 이동 속도가 빨라지고, 핏자국과 발자국이 더 밝게 표시되고, 생존자들은 향기 구체의 흔적을 남긴다. 어둠의 군주는 이 향기 구체들을 모아 이동 속도 증가 효과를 얻고 강력한 덮치기 공격을 충전하여 생존자에게 피해를 입힐 수 있다. 떨어진 판자 또는 부서지기 쉬운 문을 타격하면 특수 파괴가 적용된다.<br><br><b>박쥐 형태:<\/b> 박쥐 형태로 있는 동안, 어둠의 군주는 <b>감지 불가능<\/b> 상태 이상을 얻는다. 추가적으로, 더 빠르게 이동하며, 창틀 장애물을 무시할 수 있으며 32미터 내 아무 창틀 장애물로 순간 이동할 수 있다. 생존자는 보이지 않게 되지만 발자국은 드러난…"}},{"id":"K38","ko":"조련사","en":"The Houndmaster","d":"조련사 옆에는 그와 동등하게 무시무시한 개들이 있다. 그러니 그 역시 두려운 존재다.<br><br>그녀의 개인 기술인, <b>흔들리는 천둥<\/b>, <b>재앙의 갈고리: 들쭉날쭉한 나침반<\/b>, 그리고 <b>자비 없음<\/b>으로 그녀의 돌진 공격 거리를 증가시키고 재앙의 갈고리를 생성하고 치료 스킬 체크로 생존자들을 제압할 수 있다.","story":"포샤 메이의 아버지는 카리브해의 미지의 섬에서 선원과 상인들이 번영한 정착지를 찾는 데 도움을 주었다. 그들은 항구 마을을 ‘포춘’이라고 불렀고 광활한 무역 네트워크를 구축하여 포샤가 전 세계의 문화와 지식을 접할 수 있도록 했다. 선원이자 이야기 애호가였던 포샤의 아버지는 포샤에게 아라비안나이트, 셰익스피어, 그리스 신화를 읽어주었고, 포샤에게 항해와 천문 항법을 가르쳤다. 포샤의 아버지는 분명 포샤에게 모험에 대한 애정을 심어주었고, 그녀는 항상 아버지와 함께 여행하고 싶도록 이끌었다.<br><br>어느 날 그녀는 아버지와 함께 이탈리아로 여행을 떠났고, 아버지는 그곳에서 설탕과 은을 희귀한 비단과 향신료로 교환했다. 그리고 그들은 포춘의 연례 사냥 게임에 출전하기 위해 사냥개로 훈련시킬만한 카네코르소 강아지들도 구입했다. 아버지는 또한 다가오는 열두 번째 생일을 맞아 강아지 무리 중 가장 강한 강아지를 포샤만의 강아지로 가질 수 있다고 말했다. 그녀는 새끼들에게 카이저, 킹, 샤, 아테나, 그리고 무리 중 가장 작은 새끼 강아지를 스너그라고 이름 지었다. 하지만 훈련을 시작하기도 전에 격렬한 폭풍으로 인해 나이트드림은 해적들이 통제하는 지역으로 몰아내고 말았다.<br><br>그녀의 아버지는 애태우며 배를 안전하게 조종하려고 했지만, 겁에 질린 매드 몰락은 배로 그들을 공격하였고 나이트드림을 재빨리 점령했다. 해적들은 승리하면 나이트드림을 누가 차지할지 내기를 걸었고, 첫 번째 공격에서 살아남은 사람들은 몰락과 그의 부하들과 잔혹한 싸움을 벌였다. 해적은 마지막까지 살아남은 사람을 풀어주겠다고 약속했다.<br><br>포샤의 아버지가 싸움에 참여하길 거부하자, 몰락의 가장 사악한 부하인 그의 아들 타리크가 그를 수 시간 동안 고문했고...<br><br>포샤 아버지의 목을 베었다.<br><br>포춘의 외곽 방어선을 통과하기 위해 포샤를 살려둔 몰락과 타리크는 범선으로 돌아와 나이트드림에 해골 선원들에게 남겼다. 포샤는 포춘으로 그들을 이끌고 들어갔다. 해적들은 포촌에 도착하자마자 포샤 부녀가 사랑하는 마을 사람들을 공격하고 약탈하며 마을을 불태웠다.<br><br>포샤의 천문 항법으로 포샤는 많은 사람이 저주받았다고 주장하는 지역을 우회하도록 그들을 이끌었다. 용의 이빨로 알려진 이 지역은 괴물이 돌아다니는 형언할 수 없는 악의 어두운 영역으로 흘러들어간다고 믿는 사람들도 있었다. 포샤는 몰락을 파멸로 이끌고 싶었다. 도중에 죽는 한이 있더라도 그렇게 되길 바랐다.<br><br>그녀가 용의 이빨에 다가가자 먹구름이 쌓이고 차가운 검은 안개가 그들을 에워쌌다. 비가 쏟아지고, 배에는 사나운 바람이 포효하여 돛대 위로 무너지는 검은 산이 만들어졌다.<br><br>즉시 몰락과 그의 배는 폭풍우를 피했고, 포샤는 그대로 죽게 내버려두었다. 그러나 나이트드림이 짙은 안개와 번개 사이를 헤쳐나갔고, 포샤는 아버지의 배를 포기 하지 않았다. 배가 삐걱거리고 소리를 내며 천천히 전복되자 그녀의 가슴은 쿵쾅거렸다. 바다가 그녀를 통째로 삼키기 전에 그녀가 마지막으로 본 것은 그들 위로 무너지는 거대한 촉수의 실루엣이었다.<br><br>포샤가 살며시 눈을 뜨자 스너그가 자신을 내려다보고 있었다. 스너그는 포샤의 얼굴을 핥으며, 일어나라고 짖어댔다. 그녀의 눈에서 소금물이 흘려내렸고, 아프고 멍든 몸을 땅에서 밀어내 봤지만, 이상한 보라색 모래 위로 쓰러졌다. 한 번도 본 적 없는 보라색 모래였다.<br><br>그녀는 간신히 몸을 일으켜 세웠고 작은 강아지를 마주 보았다. 스너그는 두 번 짖고 땅을 냄새 맡기 시작했고, 그녀를 코코넛과 보라색 해초 무리로 이끌었다. 그녀는 해초를 말리고 코코넛을 깨어 바위 위에서 목을 축였다. 처음 접하는 생명체들의 소리를 조용히 듣다가 갑자기 깨달았다.<br><br>용의 이빨의 한 섬에 고립되었다는 것을.<br><br>그들은 낯선 세상... 중간계에 있었다. 그녀의 아버지가 한때 정신을 괴롭히고 마음을 가지고 노는 살아있는 악몽이라고 묘사했던 세상이었다. 그녀는 낯선 소리를 들었고, 갑자기 그녀의 사방에서 몰락이 나타났다.<br><br>포샤는 본능적으로 눈을 감고 비명을 질렀고 스너그는 그녀의 무릎 위로 뛰어올라 격렬하게 짖어댔고 그녀를 제정신으로 되돌려놓을 때까지 그 소리를 멈추지 않았다.<br><br>수년에 걸쳐, 포샤는 섬을 습격하는 포식자들과 싸우고 해안에 떠밀려 온 모든 것들을 상대로 살아남았다. 사나운 동물, 사악한 인간, 그리고 이 세상에 없는 잔혹한 혐오스러운 것들. 스너그는 이제 몸무게가 100파운드가 넘었고 어디든 포샤를 따라다녔다. 그들은 위압적인 한 쌍을 이루었고 섬에 살아남은 대부분의 생존자들은 그들에게서 거리를 둘 정도였다. 살아남지 못한 소수는 어쩌면 생존을 후회할지도 모른다. 그리고 그녀가 탈출에 대한 생각을 포기하려던 어느 날, 그녀는 해변에서 스너그를 찾던 중 존재할 수 없는 어느 것을 발견했다. 믿을 수 없게도...<br><br>그것은 차갑고 검은 안개 속에서 표류하는 나이트드림이었다.<br><br>그녀는 이 섬에서 무엇이든 의심하거나 의문을 제기하는 것은 어리석은 짓이라는 것을 알고 있었다. 호루라기를 울리며 물속으로 들어갔지만 갑자기 난파당한 이들로부터 공격을 받았다. 그녀는 마음속으로 몰락을 50번이 넘게 도살하고 배를 만드는 데 필요한 사람들만 구했다. 그리고 그들과 함께 스너그를 찾기 위해 며칠 동안 헤맸지만 스너그는 어디에서도 찾을 수 없었다. 스너그가...<br><br>사라졌다.<br><br>마치 존재하지 않았던 것처럼, 단지 그녀의 상상 속에만 존재했던 것처럼 사라졌다.<br><br>수십 년 동안 포샤는 몰락을 찾으며 카리브해를 공포에 떨게 했다. 그녀는 해적들을 공격하고, 그들의 금을 빼앗고 가학적으로 고문하여 자신 안에 살고 있는 무형의 어둠을 채웠다. 만족할 때까지 피를 요구하는 기생충 같은 어둠이었다.<br><br>포샤는 이런 피의 굶주림을 달래지 못할 때마다, 기생충은 모든 승조원들에게서 몰락의 얼굴을 보일 때까지 이성과 현실을 무너뜨리는 치명적인 탈론으로 포샤의 정신을 쥐어짰다. 신뢰하는 많은 경비견들 중 한 마리가 그녀에서 멈추라고 짖어댈 때까지 그녀는 모든 사람을 공격하고 도살했다.<br><br>그 순간, 몰락의 존재가 갑자기 사라지고 검은 안개가 흘러들어갔다.<br><br>겁에 질린 승조원들은 그녀의 광기가 자신들을 배신하는 것은 시간문제라는 것을 알고 있었다. 그래서 마침내 몰락을 찾았을 때조차도 그들은 반란을 공모했습니다.<br><br>하지만 그들은 선장을 과소평가했습니다.<br><br>포샤가 그들을 처리했을 때쯤에는 피와 살덩어리에 살아있던 사람은 다섯 명뿐이었다. 그녀의 개들이 그들을 에워싸우고 결코 내려지지 않을 살상 명령을 기다렸고, 그들은 즉시 그녀의 자비를 구했다.<br><br>몰락을 처치하려면 더 많은 사람들이 필요했다. 정신을 가다듬은 그녀는 기지를 발휘하여 반란을 모의한 자들에게 간판을 청소하고 개에게 먹이를 주라고 명령한 다음, 나이트드림을 매드 몰락의 섬으로 항해했다.<br><br>몰락은 자신도 공해로 나갔지만 포샤의 승조원들이 그의 귀환을 대비해 타리크를 붙잡아 가뒀다.<br><br>몰락이 돌아왔을 때 그는 금과 보석 상자를 선물하는 한 여성을 제외하고 섬이 텅 빈 것을 알아차렸다. 그녀는 몰락의 해적단에 합류하고 싶었다고 주장했고, 몰락과 해적단을 위해 만찬을 준비했다고 말했다. 몰락은 포샤를 알아보지 못한 채 보물을 받아들고 타리크에 대해 물었다. 그녀는 웃으며 타리크도 저녁 식사에 합류할 것이라고 확신에 차 대답했다.<br><br>포샤는 몰락에게 정성스럽게 만든 식사를 제공했고 그는 술과 음식을 맛있게 먹었다. 고기는 특히 맛있었고, 겉은 바삭바삭하고 검게 구워졌으며, 안은 분홍색으로 육즙을 가득 담고 있었다. 그는 이것이 멧돼지 고기인지 사슴 고기인지 알고 싶었다.<br><br>포샤는 미소를 지으며 자랑스럽게 일어나 테이블 위로 손을 뻗어 황금색 음식 덮개를 들어 올렸다. 쟁반에는 공포에 질려 비명을 지르며 얼어붙은 채 잘려있는 타리크의 머리가 올려져 있었다. 타리크의 입은 금괴와 보석이 토하고 있었다.<br><br>몰락은 상처 입은 황소처럼 고통을 포효했고 포샤는 그의 고통을 만끽했다. 바닥에서는 짙은 검은 안개가 검은 베일처럼 올라오고 있었다. 그러나 그녀가 몰락을 쓰러뜨리기 전에, 보이지 않는 무언가가 그를 어둠 속으로 잡아당겼다.<br><br>그녀의 웃음은 즉시 사라졌다. 입술은 공황과 분노가 뒤섞인 채 말려 있었다. 그녀의 목에는 검붉은 핏대가 솟아 있었다. 탈론은 그녀의 마음을 움켜쥐고 쥐어짜며 놓아주지 않았다. ‘사라졌어! 사라졌다고!’ 그녀가 그의 머리를 피투성이로 만들기도 전에 사라져버렸다.<br><br>이해할 수 없는 단어들이 그녀의 입 밖으로 튀어나와 쉰 목소리로 변했다. 비명을 지르려던 순간, 그녀는 말도 안 되는 소리를 들었다. 개 짖는 소리. 수년간 듣지 못했던 개 짖는 소리였다.<br><br>그녀의 귀에 다시 들렸다.<br><br>그리고 또 다시.<br><br>\"스너그!\"<br><br>스너그에게서 몰락의 향기가 났다.<br><br>이해할 수 없는 것을 억지로 이해하려 노력하지 않았다. 그녀는 안갯속으로 돌진하여 오랫동안 그리웠던 친구와 함께 시작한 일을 끝내려 한다.","perks":["K38P01","K38P02","K38P03"],"dlc":"Gelato","power":{"ko":"피의 향기","en":"Scent of Blood","d":"조련사와 그녀의 개는 한 몸처럼 움직인다. 그녀의 명령은 질문도 지체도 없이 행해졌다.<br><br><b>특수 능력: 추격<\/b><br><br>추격 명령은 개를 빠른 속도로 내보낸다. 능력 버튼을 다시 누르면 추격이 경로가 재설정되어 개가 새로운 경로로 전환한다. 개가 생존자를 잡으면, 개는 입질을 시작한다. 생존자는 <b>근육 손상<\/b>에 걸리며 조련사에게 당겨진다. 생존자는 개를 기절시켜 자유를 되찾을 수 있으며, 또는 다른 생존자들에 의해 구출될 수 있다. 부상 없이 끝난 입질은 생존자를 <b>근육 손상<\/b> 상태에 걸리게 만든다. <b>인내<\/b> 상태 이상에 걸린 생존자의 경우 입질 지속 시간이 더 짧다.<br><br><b>특수 능력: 탐색<\/b><br><br>탐색 명령은 개를 목표 위치로 보내어 탐색 경로를 생성하다. 각자의 자장가가 있는 개는 이동하면서, 사냥개의 감각 범위는 이동 거리에 따라 상승한다. 해당 범위에 들어간 생존자들은 사냥개의 감각에 영향을 받게 되고 살인마의 본능에 의해 위치가 드러난다. 만약 조련사가 개의 탐색 경로를 따라가면, 시간이 지남에 따라 조련사의 이동 속도가 증가한다. 탐색 경로에서 벗어나면, 해당 보너스 이동 속도 증가 효과가 종료된다.<br><br><b>특수 효과: 사냥개의 감각<\/b><br><br>사냥개의 감각에 영향을 받은 건강한 생존자들은 부상을 당했을 때 <b>심각한 부상<\/b>에 걸린다. 사냥개의 감각에 영향을 받은 부상 상태의 생존자들은 빈사 상태에 빠지면 부상으로 인한 신음 소리가 더 커지고 피웅덩이 지속 기간이 증가한…"}},{"id":"K39","ko":"구울","en":"The Ghoul","d":"구울은 한계에 도달했으며 더 많은 것을 원한다.<br><br>그의 개인 기술은 <b>주술: 비참함 그 자체<\/b>, <b>영결의 뒤얽힘<\/b>, 그리고 <b>아무도 자유롭지 않다<\/b>로, 생존자에게 방해하고, 생존자들을 더 빨리 걸고, 발전기 수리가 완료되면 판자를 차단할 수 있다.","story":"카네키 켄은 카미이 대학에서 문학을 공부하며 소박한 삶을 살았던 온화하고 친절한 소년이었지만, 우연한 만남으로 인해 그의 인생이 뒤바꿨다.<br><br>그와 친구 히데는 안테이크라는 카페에 자주 들렀는데, 그곳엔 눈에 띄는 단골손님 중 한 명이 있었다. 그녀의 이름은 바로 카미시로 리제. 그는 그녀와 독서에 대한 열정을 공유했고, 그녀가 자신과 같은 소설을 읽고 있는 것을 알게 되었다. 그는 용기를 내어 데이트 신청을 했다. 그녀를 집으로 데려다주는 길, 리제는 그에게 자신의 본모습을 드러냈다. 그것은 바로 '대식가'로 알려진 구울의 색깔. 그녀는 그의 살을 먹어 치우려 했지만, 그 순간 발생한 우연한 건축 사고로 인해 그녀는 죽음을 맞이하고 그의 죽음도 초래할 뻔했다.<br><br>카네키의 생명을 구하기 위해 의사들은 리제의 장기를 카네키에게 이식했다. 그는 살아남았지만, 무언가 잘못됨을 느꼈다... 음식 맛을 느끼는 감각이 사라지고, 이상한 갈망이 그를 괴롭혔다. 그의 생명을 구한 수술은 그를 반구울로 만들었다.<br><br>혼란스럽고 두려움에 떨던 그는 본능을 따라 골목길로 들어갔다가 안테이크의 직원인 키리시마 토우카와 마주쳤다. 변한 그의 모습에 충격을 받은 그녀는 그를 카페로 데려갔다. 카네키 역시 안테이크의 직원들이 구울이라는 사실을 알고 깜짝 놀랐다. 그들은 그를 보호하며 새로운 현실에 적응하도록 도왔습니다. 그는 새롭게 얻은 힘으로 싸우는 법, 인간을 살육하고 그들을 먹으려는 충동에 대처하는 방법, CCG(구울 대책국)보다 한발 앞서 나가는 방법을 배웠다.<br><br>새로운 삶에 적응하려는 그의 노력은 제이슨이라는 특히 잔인한 구울에게 납치되어 전례 없는 신체적, 정신적 고문을 받으면서 잔인하게 방해를 받는다. 그를 사로잡은 자의 통제력과 엄청난 폭력성은 너무나 사악해서 카네키의 정신을 파괴하고, 그를 한때 인간으로 만들었던 것을 벗어나게 만들었다. 그의 자아의식은 산산이 조각났고, 리제는 그 빈 공간으로 발을 들여놓고 그가 자신의 삶을 스스로 통제하도록 격려했다.<br><br>카네키는 다시 스스로를 통제하는 힘을 되찾고 제이슨에게 폭력으로 갚아주었다. 그는 자유를 얻고 그를 가둔 자와 전투를 벌인다. 그간의 고문 덕분에 카네키는 고통을 느끼지 못했고 산산이 조각난 정신을 그에게 주저할 시간을 주지 않았다. 그는 짧은 전투 끝에 제이슨을 물리치고 그를 집어삼켰다.<br><br>그는 고통받는 소년으로 악몽에 끌려갔지만 강력한 구울로 걸어 나왔다. 그는 무거운 문을 밀고 나가면서 이것이 무엇을 의미할지 생각했다. 검은 안개가 발 주위에 모이는 것을 거의 알아차리지 못한 채. 그는 고문이 끝났다는 확신을 가지고 걸어 나갔지만 주위를 둘러본 그는 아마도 그것이 시작에 불과하다는 것을 깨달았다.","perks":["K39P01","K39P02","K39P03"],"dlc":"Icecream","power":{"ko":"외눈박이 공포","en":"One-Eyed Terror","d":"<b>특수 능력: 카구네 도약<\/b><br><br><i>능력 버튼<\/i>을 사용해 <b>카구네<\/b>를 충전하고 일격할 수 있다. 카구네는 사거리 내의 모든 수직 표면에 부착하여 구울을 빠르게 앞으로 당기는 촉수다.<br><br><b>도약<\/b> 완료 후, 아주 잠깐 동안 구울에게 두 번째 <b>카구네 도약<\/b>을 수행할 수 있는 시간이 주어진다. 또는 <i>능력 활성화 버튼<\/i>을 사용하여 <b>카구네 도약<\/b>의 재사용 대기 시간을 시작할 수 있다.<br><br>구울이 창틀 또는 떨어진 판자를 특수 뛰어넘기로 <b>도약<\/b>하거나, <b>카구네<\/b>가 생존자를 붙잡아 <b>도약<\/b>을 수행하므로써 카구네가 <b>도약<\/b>을 소모하면 <b>카구네 도약<\/b>는 재사용 대기 시간을 가진다.<br><br>만약 구울의 두 번째 연속 <b>도약<\/b>이 생존자를 표적으로 하면, 그들은 붙잡기 공격을 수행한다. 붙잡기 공격은 건강한 생존자에게 피해를 입힌다. 모든 생존자들은 <b>심각한 부상<\/b>에 걸린다. 모든 생존자에게 <b>카구네 표식<\/b>을 남긴다.<br><br>또한, 붙잡기 공격을 수행하면 구울은 <b>분노 모드<\/b>에 돌입한다.<br><br><b>특수 능력: 분노 모드<\/b><br><br><b>분노 모드<\/b> 동안, 구울은 최대 세 번의 <b>카구네 도약<\/b>을 연속 수행할 수 있으며 생존자에게 <b>카구네<\/b>를 일격하면 빠르게 특수 뛰어넘기를 수행할 수 있다.<br><br>생존자에게 <b>카구네 표식<\/b>이 남는 동안, <b>분노 모드<\/b>가 활성화된다. 표식이 남은 생존자가 완전히 <b>회복<\/b>하거나 완전 빈사 상태에 걸리면, 표식은 사라진다.<br><br>구울은 표식이 남은 생존자에게 붙잡기 공격을 수행할 수 없다.<br><br>표식이 남은 생존자가 하나도 남지 않으면, <b>카운트다운<\/b>이 시작된다. <b>카운트다운<\/b>이 완료되면, <b>분노 모드<\/b>는 종료된다. 완벽한 타이밍의 붙잡기 공격(공격 아이콘이 표시될 때 <i>공격 버튼<\/i> 탭하기)은 <b>카운트다운<\/b>에 추가 시간을 더한다. <b>카운트다운<\/b>은 생존자를 둘러업은 동안 중지된다."}},{"id":"K40","ko":"애니매트로닉스","en":"The Animatronic","d":"애니매트로닉스는 언제든 돌아옵니다.<br><br>그의 개인 기술로 <b>구인<\/b>, <b>유령 공포<\/b>, 그리고 <b>통제불능<\/b>으로 발전기를 손상시키고 생존자들을 비명지르게 만들며, 출구 전원의 진행도를 늦출 수 있습니다.","story":"버려진 프레디 파즈베어 피자 가게의 깊은 곳에서 윌리엄 애프튼이 희생자들의 유령들로부터 도망친다. 그는 그를 쫓는 영혼들로부터 숨기 위해 필사적으로 자신이 아끼는 스프링 보니 의상을 입었다. 스프링 보니 슈트는 그가 끔찍한 범죄를 저지를 때마다 입었던 옷이었다.<br><br>하지만 운명은 애프튼을 위한 다른 계획이 있었다. 무언가가 스프링 보니 의상 속에 스프링락을 활성화시켰고, 금속들이 맞물리며 살인마의 몸을 관통한 후, 압사시켰다. 그는 비명을 지르자, 체커보드 바닥이 그를 향해 솟아올랐고, 모든 것이 검게 변했다.<br><br>스프링트랩은 살인마의 죽음으로 탄생했다.<br><br>그는 익숙한 소리에 잠에서 깼다. 온몸이 고통의 기둥처럼 굳어 있었다. 그를 괴롭혔던 유령들은 사라졌다. 그를 둘러싼 벽은 무너지고 있었고, 곰팡이가 핀 그 아래 바닥은 군데군데 무너져 내리고 있었다. 스프링락이 그의 몸을 관통하고 그를 의상 안에 고정시킨 지 얼마나 많은 시간이 흘렀을까? 살인 충동은 여전히 그의 내면에 남아 있었고, 갈증은 오랫동안 해소되지 않았다.<br><br>그 소리가 다시 그의 귀를 가득 채웠다. 아이들의 웃음소리. ‘아이들이 부엌에서 놀고 있었나?’ 스프링트랩은 새로운 몸에 적응하며 일어나 어디선가 들리는 소리 쪽으로 걸어갔다.<br><br>그는 움직이면서 속도를 높였다. 걷기는 달리기로 바뀌었다. 그는 부엌으로 달려갔지만…<br><br>아무것도 없었다.<br><br>아이도, 놀이도, 웃음소리도 없었다. 그저 저 멀리 벽을 뒤덮는 검은 안개 덩어리만이 소용돌이치고 있을 뿐이었다.<br><br>스프링트랩은 안개를 살폈다. 호기심이 그를 더욱 사로잡았다. 어둠 속을 응시하는 그의 커진 눈에 안개 속에서 형체들이 나타났다.<br><br>그들은 누구였을까? 그게 누구든 상관 없었다. 이제 그들은 그의 피해자들이 될 것이다. 어떻게든 그는 사냥이 영원히 계속될 것임을 알고 있었다.<br><br>이제 그는 안개 속으로 걸어 들어가기만 하면 되었다.","perks":["K40P01","K40P02","K40P03"],"dlc":"Ketchup","power":{"ko":"파즈베어의 공포","en":"Fazbear's Fright","d":"비록 애니매트로닉스의 기계 코스튬이 그의 무덤이 되었지만, 애니매트로닉스는 살육을 하기 위해 태어났다.<br><br><b>특수 능력: 불 도끼<\/b><br><br>애니매트로닉스는 생존자에게 투적할 수 있는 <b>불 도끼<\/b>를 장착하고 있다. 만약 <b>불 도끼<\/b>가 생존자를 타격하면, 무기는 생존자 몸에 박히며 무기가 제거될 때까지 생존자는 <b>치료 불능<\/b> 및 <b>인지 불가능<\/b>에 걸린다.<br><br><b>특수 지도 기능: 보안 시스템<\/b><br><br>희생제를 시작할때, 지도 전역에 <b>7개의 경비실 문<\/b>이 생성된다. 생존자와 애니매트로닉스 모두 <b>문<\/b>을 이용할 수 있다.<br><br>각 <b>경비실 문<\/b>에는 <b>카메라<\/b>가 설치되어 있다. <b>경비실 문<\/b>과 상호 작용하면, 생존자는 <b>보안 카메라 화면<\/b>을 확인할 수 있으며, 이는 지도 내 모든 <b>카메라<\/b>를 확인하고, <b>경비실 문<\/b>을 통과하여 바라보는 화면의 장소로 순간 이동할 수 있다. 또한, 잠재적으로 팀에게 애니매트로닉스의 오라를 드러낼 수 있다.<br><br><b>카메라<\/b>와 <b>경비실 문<\/b>을 너무 자주 이용하면 제한적으로 부여된 배터리 전력이 고갈되어, 생존자들은 시스템이 재부팅될 때까지 기다려야 한다. 애니매트로닉스는 배터리 전력 유무에 관계없이 <b>경비실 문<\/b> 사이를 이동할 수 있다.<br><br>만약 애니매트로닉스가 <b>경비실 문<\/b>에 들어서며, 생존자들은 지도 내 아무 <b>문<\/b>을 통해서 나갈 수 있다. 생존자가 이미 사용 중인 <b>문<\/b>으로 이동하면 애니매트로닉스가 그 생존자를 붙잡을 수 있다.<br><br>경비실 문에 들어서면, 애니매트로닉스는 <b>감지 불가능<\/b> 상태 효과를 얻는다. 해당 효과는 경비실 문을 나간 후 20초까지, 또는 보안 카메라를 통해 생존자에게 발각되기 전까지 지속된…"}},{"id":"K41","ko":"끄라스","en":"The Krasue","d":"형태를 바꾸는 살인마로, 생존자에게 창자 채찍 공격에 대한 약화를 가할 수 있다.<br><br>그녀는 개인 기술인 <b>굶주림<\/b>, <b>방황하는 눈빛<\/b>, 그리고 <b>주문: 파멸의 서곡<\/b>을 통해 희생제 중 긴장을 더하고, 부상 입은 생존자를 찾아내며, 그녀의 행방에 혼란을 야기할 수 있다.","story":"부롱 수카팟의 태국 오페라 리허설은 감정의 바다와 같았지만, 숱한 노력에도 불구하고 그녀는 그저 보조 배우 이상의 존재가 될 수 없었다. 자신의 재능을 나누고 싶다는 열망으로 시작된 것은 명성에 대한 흔들림 없는 갈망으로 이어졌다. 소꿉친구 잔지라는 그녀의 가장 큰 지지자였지만, 기댈 수 있는 어깨를 내어주는 것 외에는 해 줄 수 있는 것이 없었다. 그러던 중, 어린 나이에 자리를 잡은 동료 가수 말라이가 부롱에게 손을 내밀면서 부롱의 운명은 바뀌기 시작했다.<br><br>말라이는 부롱에게 투명한 액체가 담긴 유리병을 건네주며 마시라고 권했다. 그녀의 목소리는 아주 진지했다.<br><br>“매일 밤, 새로운 것이 네 몸에 들어올 거야. 하지만 넌 나처럼 무대에서 성공할 수 있어.”<br><br>부롱은 친구의 괴상한 장난에 웃음을 터트렸다. 그럼에도 불구하고 그녀는 무엇보다도 그것이 사실이길 원했다. 그녀는 병을 집어 들어 한 방울도 남기지 않고 꿀꺽 삼켰다.<br><br>그 후 몇 주 동안 부롱의 피부는 부드러워졌고, 이전에는 미처 몰랐던 목소리의 깊이를 발견했다. 다음 오디션에서 감독은 극장 전체에 울려 퍼지는 그녀의 소리에 매료되어 눈을 떼지 못했다. 노래가 끝나자 부롱은 감독에게 감사 인사를 했다. 무대에서 내려온 그녀는 손수건에 피를 토하기 시작했다. 하지만 손수건을 주머니에 쑤셔 넣으며 이를 모른 척하기로 했다. 그녀에게 무슨 일이 일어나든 이제는 감히 막을 수 없었다.<br><br>그날 밤, 잠든 그녀의 몸에서 따스한 온기가 뚝뚝 떨어졌다. 그녀는 벌떡 일어나, 손을 더듬거리며 그곳엔 없는 램프를 찾았다. 그녀는 피투성이가 된 채 기억에는 없는 어느 밭 한 가운데에 누워 있었다. 그녀 옆에는 유린된 닭장, 깃털, 그리고 땅에 묻은 피 얼룩이 있었다.<br><br>그녀는 도시가 새로운 아침을 맞이하기 전에 비틀거리며 집으로 돌아왔다. 뜨거운 소나기를 맞으며 그녀는 이번이 처음이 아니라는 생각에 두려움에 피를 토했다. 흐느끼며 그녀는 배를 쿡쿡 찌르며 안에 무언가 숨겨져 있을지도 모르는 곳을 찾아 헤맸다.<br><br>그녀는 잔지라에게 전화를 걸었지만 차마 이 끔찍한 일을 털어놓을 수가 없었다. 매일 밤 쉬지 않고 몽유병에 시달렸고, 그녀를 다시 침대로 데려다줄 사람이 필요하다고 말했다. 잔지라는 친구를 도와주기로 동의했다.<br><br>그날 아침, 부롱은 사랑스럽게 자신의 뺨에 얹은 잔지라의 손길에 눈을 떴다. 그녀는 고개를 들었고, 울음을 터트렸다. 잔지라의 잘린 손이 침대에서 떨어져 내장이 헤집어진 시체 위로 떨어졌다.<br><br>그녀는 몇 시간 동안 친구의 유해 옆에 앉아 아무 말도 못한 채 충격에 빠져 있었다. 잔지라가 죽었다. 도대체 왜?<br><br>더 이상 피 냄새를 참을 수 없게 되자, 그녀는 청소용품을 집어 들었다. 해는 저물어갔고, 카펫에는 짙은 얼룩이 그대로 남아 있었다.<br><br>그녀는 한참 길거리를 헤매다 말라이의 집까지 걸었다. 말라이는 문을 열고 부롱의 눈을 보자마자 곧바로 변명을 늘어놓았다. 그녀는 자신은 잘못한 게 없다고, 저주를 받았을 뿐이라고, 저주에서 벗어날 유일한 방법은 다른 사람에게 물려주는 것이라고 주장했다. 명성을 향한 갈망이 있는 부롱이 그 고통을 견뎌내고 자신이 항상 원하던 것을 이룰 수 있을 거라고 그녀는 믿었다.<br><br>부롱의 마음속에서 분노가 치밀어 올랐다. 격렬한 열기가 온몸을 뒤덮자 그녀는 바닥에 쓰러졌다. 말라이는 부롱이 살갗에 못이 박히고 타는 듯한 고통에 꿈틀거리는 모습을 공포에 질려 바라보았다. 목에서 살덩어리가 뜯어졌고 내장이 꿈틀거렸다. 머리가 몸에서 떨어져 나갔고, 내장은 마치 해안에 물고기처럼 뒤로 끌려갔다.<br><br>부롱의 몸에서 떨어져 나온 머리가 공중으로 치켜올라가자 끓어오르는 갈증이 밀려왔다. 머리는 말라이를 향해 돌진하여 피와 머리카락, 뼈만 남을 때까지 굶주린 듯이 마구 뜯어냈다. 부롱은 그 어지러운 광경을 보고 눈을 떴지만, 눈물 한 방울 흘릴 만큼의 동정심은 찾을 수 없었다.<br><br>그녀는 집으로 돌아와 아침 햇살이 방을 가득 채울 때까지 생각에 잠겼다.<br><br>그때, 전화가 울렸다.<br><br>감독의 목소리가 그녀의 머릿속에 드리운 안개를 뚫고 나왔다. 그는 그녀에게 주연을 제안했다. 부롱은 침대에 털썩 주저앉아 울음을 터뜨렸다. 슬픔 때문이 아니라 안도감과 기쁨에 겨워 울음을 터뜨린 것이다.<br><br>방콕의 저녁 무대에서 그녀의 별은 밝게 빛났다. 밤이 되자 그녀는 자신 안의 생명체에게 먹이를 주었고, 그들은 함께 굶주림과 노래의 세계에서 번성했다. 하지만 그 생물체는 항상 더 많은 것을 원했고, 어느 날 밤, 바로 그것이 나타났다. 갈고리에 걸려 유혹적인 피가 뚝뚝 떨어지는 고기였다.<br><br>그리고 그곳엔 안개가 있었다.","perks":["K41P01","K41P02","K41P03"],"dlc":"Maple","power":{"ko":"육체를 떠난 살점","en":"Unbodied Flesh","d":"<b>특수 능력: 살결의 직조<\/b><br><br>끄라스는 마음대로 몸과 머리 형태 사이에서 전환할 수 있다.<br><br>신체 형태는 <b>32미터<\/b>의 공포 범위를 가진다. 머리 형태는 <b>40미터<\/b>의 공포 범위를 가진다. 이는 약간 더 빠르게 특수 뛰어넘기를 수행할 수 있지만 떨어진 판자 또는 부서지기 쉬운 물을 부술 수 없다. 또한, 추격 중 분노 효과를 얻을 수 없다.<br><br><b>특수 효과: 거머리<\/b><br><br><b>창자 채찍<\/b> 또는 <b>거머리샘<\/b>으로 생존자를 타격하면 <b>거머리 미터기<\/b>가 차오른다. 미터기가 가득 차면, 생존자는 <b>거머리 I<\/b>.<b>거머리 I<\/b>: <b>거머리 미터기<\/b>는 자동으로 차오른다.<b>거머리 II<\/b>: 생존자는 <b>치료 불능<\/b>에 걸린다. 생존자가 건강한 상태라면, 그들은 부상을 입게 된다.<br><br><b>특수 능력: 창자 채찍<\/b><br><br>머리 형태일 때, <i>공격 버튼<\/i>을 길게 눌러 당신의 창자를 꺼내 채찍질할 수 있다.<br><br><b>거머리<\/b>에 걸린 생존자는 <b>창자 채찍<\/b>으로 피해를 입을 수 있다. <b>창자 채찍<\/b>은 부분적으로 생존자의 <b>거머리 미터기<\/b>를 채우며, 이는 최대 <b>거머리 I<\/b>까지 가능하다.<br><br><b>특수 능력: 역류<\/b><br><br>몸 형태에서 <i>능력 버튼<\/i>을 길게 눌러 <b>역류<\/b>를 충전할 수 있다. 역류가 충전되면 <i>공격 버튼<\/i>을 탭하여 <b>거머리샘<\/b>을 분출할 수 있다.<b>거머리샘<\/b>는 생존자의 <b>거머리 미터기<\/b>를 완전히 채우며, 최대 <b>거머리 I<\/b>까지 가능하다.<br><br><b>특수 아이템: 발광 곰팡이<\/b><br><br>생존자들이 <b>발광 곰팡이<\/b>를 먹으면 서서히 <b>거머리 미터기<\/b>가 낮아진다. 타격을 입으면 효과가 종료된다.<br><br><b>특수 능력: 황급한 도주<\/b><br><br>머리 형태에서 <i>능력 버튼<\/i>을 길게 눌러 공중을 빠르게 비행할 수 있다."}},{"id":"K42","ko":"퍼스트","en":"The First","d":"퍼스트는 교활하고 잔인한 전직 실험 대상으로, 다른 차원에서 능력을 더 다듬어 나갔다.<br><br>그의 개인 기술인, <b>시간 역행<\/b>, <b>비밀 프로젝트<\/b>, 그리고 <b>주술: 하이브 마인드<\/b>로 멀리 있는 발전기를 손상시키고, 수리를 차단하며 다른 발전기 수리가 완료되면 재설정할 수 있다.","story":"어린 시절부터 헨리 크릴은 인간과 그들의 끝이 없이 반복되는 먹고 번식하고, 죽음을 맞이하는 삶에 대한 혐오감을 느꼈다. 그저 무의미한 연극이었다. 이러한 증오가 자라면서, 그는 자신에게 이상한 능력이 있다는 것을 알게 되었다. 처음에는 집안에 괘종시계를 조종하는 작은 힘이었지만, 곧 사람들의 마음을 조종하는 능력으로 발전했다. 시간이 지나 그의 능력은 어머니와 누이의 몸을 뒤틀고 파괴하면서 무시무시한 새로운 경지에 도달하고 만다. 하지만 그들의 죽음에 책임을 진 것은 헨리의 아버지였고, 그는 펜허스트 정신 병원에 감금되었다.<br><br>어둠에 싸인 조직은 헨리의 죽음을 위장하고 그를 한 시설로 옮겼다. 그곳에서 그의 힘은 소테리아 칩에 의해 제한되었고, 초능력을 가진 다른 아이들과 함께 연구의 실험 대상이 되었다. 겉으로 상황에 순응했고 결국 병원의 잡역부가 되었다. 그러나 이는 헨리의 계략이었다. 일레븐을 설득해 칩을 제거한 후, 그는 시설의 아이들과 직원들을 학살했고, 일레븐이 그를 다른 차원으로 추방한 후에야 비로소 그의 악행을 멈출 수 있었다.<br><br>헨리는 자신이 죽었다고 생각했다. 그러나 그는 그 어느 때보다 강력해졌다. 새로운 차원에서 그는 현실 세계로 통하는 문을 열고 모든 인류를 파괴하려는 계획의 일환으로 끔찍한 살인을 연이어 저지른다. 하지만 현실 세계로 통하는 문을 지나던 순간, 검은 안개가 나타났고... 헨리는 또 다른 낯선 세계로 발을 들이게 된다. 그곳은 낯설지만 잠재력이 가득 찬 새로운 무대였다.","perks":["K42P01","K42P02","K42P03"],"dlc":"Poutine","power":{"ko":"실험 대상 #001","en":"Test Subject #001","d":"<b>특수 능력: 촉수 공격<\/b><br><br>능력 버튼을 길게 눌러 촉수 공격을 충전할 수 있다. 충전이 완료되면, 공격 버튼을 눌러 활성화 가능하며, 이는 지면에 작은 범위 효과를 생성한다.<br><br>해당 촉수 공격 범위에 생존자가 붙잡히면 세계 파괴자 토큰 2개를 획득한다.<br><br><b>특수 능력: 뒤집힌 세계 & 언더게이트<\/b><br><br>살인마는 뒤집힌 세계로 들어가 능력 버튼을 탭하여 지도를 빠르게 탐색할 수 있다. 뒤집힌 세계에 있는 동안, 살인마는 언더게이트 공격을 활성화하며 지도로 돌아갈 수 있으며, 이는 지면에 큰 범위 효과를 생성한다. 해당 범위 내 붙잡힌 생존자들은 세계 파괴자 토큰을 획득한다.<br><br><b>특수 조건/아이템: 세계 파괴자 & 괘종시계<\/b><br><br>생존자가 토큰을 충분히 모으면, 세계 파괴자가 활성화되며, 세계 파괴자 타이머가 시작된다. 세계 파괴자 활성화 시간 동안, 촉수 공격과 언더게이트 공격은 토큰을 추가하는 대신 생존자에게 피해를 입히며 4개의 괘종시계가 활성화된다.<br><br>세계 파괴자는 사전에 설정된 시간 동안 유지되며, 이는 살아있는 생존자 수에 따라 결정된다. 생존자는 지도 전역에 퍼져 있는 괘종시계와 상호 작용하여 세계 파괴자 타이머의 속도를 증가 시킬 수 있다."}},{"id":"K43","ko":"슬래셔","en":"The Slasher","d":"슬래셔는 공포의 화신이자, 끊임없이 희생자를 쫓는 무자비한 살인마이다.<br><br>그의 개인 기술인, <b>주술: 죽음에 대한 공포<\/b>, <b>조용한 그림자<\/b>, 그리고 <b>난동<\/b>으로 뛰어난 추격 기술을 가지고, 생존자들을 은밀하게 사냥하며, 기절한 후에도 회복할 수 있도록 해준다.","story":"숲 가장자리에 슬래셔가 도사리고 있다. 그의 얼굴을 가린 것은 오래되어 닳아버린 하키 마스크, 표정 없는 그 무채색의 얼굴은 묵직한 위협 그 자체다. 앞쪽에는 텐트가 있고, 그 안에서 캠퍼의 실루엣이 어른거린다.<br><br>안개가 깔린 다른 밤이었다면, 그린빌 숲은 짐승들의 울음과 날갯짓으로 살아 있었을 것이다. 그러나 오늘 밤은 고요가 숲을 짓누른다.<br><br>그는 텐트 주변에 흩어진 쓸 만한 것들을 살핀다. 밧줄, 텐트 말뚝, 쇠톱. 손잡이를 부러뜨릴 듯한 힘으로 마체테를 움켜쥔 채, 그림자 속에서 천천히 걸어나온다.<br><br>날카로운 한 번의 휘두름. 텐트는 찢겨 나간다.<br><br>그를 올려다본 것은 캠퍼가 아니었다. 그것은… 다른 존재였다. 인간에 가까우나, 뒤틀린 피부와 기형적으로 일그러진 형체. 영원히 굳어버린 미소가 입술에 걸려 있고, 피에 흠뻑 젖은 손에는 도끼가 들려 있다. 주변에는 격렬한 몸싸움의 흔적이 남아 있으나, 희생자는 보이지 않는다.<br><br>괴물은 불안한 떨림 속에서 그를 응시하며 기다린다. 슬래셔는 그 기괴한 얼굴에 시선을 박은 채 움직이지 않는다.<br><br>“내 고양이를 찾아줄 수 있어?” 괴물이 속삭인다. 목소리는 음의 높낮이를 오르내리며 기묘하게 흔들린다. 그리고 돌연, 도끼가 슬래셔의 가슴을 꿰뚫는다.<br><br>그러나 슬래셔는 망설이지 않는다. 그는 손을 뻗어 괴물의 목을 꺾어 뒤로 비틀어버린다.<br><br>그럼에도 불구하고, 괴물은 여전히 그 자리에 서 있다.<br><br>슬래셔의 마체테가 괴물의 복부를 꿰뚫는다. 그러나 괴물의 머리는 제자리로 비틀려 돌아오고, 달빛이 비추자, 있어야 할 눈 자리에 검은 구멍이 드러난다.<br><br>목덜미에서 살로 된 촉수가 뻗어 나오며 벌어진다.<br><br>강력한 충격이 슬래셔를 덮친다. 그는 휘청이며 시야가 흔들린다.<br><br>괴물의 도끼가 근육을 찢고 뼈에 부딪힌다. 슬래셔는 손을 내질러 괴물의 가슴을 꿰뚫는다. 그의 손아귀에 잡힌 것은 심장처럼 뛰는 덩어리였다.<br><br>그러나 그것은 심장이 아니었다. 뒤엉킨 살덩어리, 거미 같은 형체가 팔을 타고 기어오르며 갈고리 같은 돌기로 살을 찌른다. 그는 그것을 거칠게 뜯어내며 피부 조각이 함께 찢겨 나간다.<br><br>괴물은 그 틈을 놓치지 않는다. 그를 쓰러뜨리고 도끼를 내던진 뒤, 믿을 수 없는 힘으로 내리친다. 갈비뼈가 마른 장작처럼 산산이 부서진다.<br><br>슬래셔가 쇠톱을 집어 든다. 날카로운 톱날이 괴물의 목을 가르자, 분홍빛 액체가 그의 가면을 적신다. 괴물은 여전히 광폭한 공격을 이어간다. 슬래셔는 톱날을 더 깊숙이 밀어 넣는다. 질기고 두터운 살을 가르며, 마침내 괴물의 머리가 몸에서 떨어져 나간다.<br><br>괴물은 흙 속에서 몸부림친다. 절박하고 격렬하지만 허망한 움직임. 마지막 발악 끝에, 괴물은 무너져 내리며 고요히 누워 버린다.<br><br>슬래셔는 온몸에 상처를 입은 채 등을 돌린다. 어둠 속으로 걸음을 옮길 때마다 붉은 피가 길을 그린다.<br><br>그의 뒤에서, 기묘하게 떨리는 목소리가 울려 퍼진다.<br><br>“손 좀 빌려줄래?”<br><br>순식간에, 머리 없는 괴물이 네 발로 달려든다. 등 뒤의 벌어진 구멍에서 촉수가 폭발하듯 솟아나와 슬래셔를 휘감는다. 날카로운 턱들이 튀어나와 그의 몸을 파고든다. 그는 경련하며, 가면의 구멍 사이로 피가 스며 나오고, 달빛은 점점 어두워진다.<br><br>슬래셔는 마지막 힘을 짜내어 촉수를 뚫고 괴물의 구멍 속으로 주먹을 밀어 넣는다. 그는 몸을 일으켜 괴물을 들어 올리고, 팔에 꿰뚫린 채로 땅에 내리꽂는다. 압도적인 힘이 대지를 울린다.<br><br>그러나 괴물은 여전히 꿈틀거린다. 슬래셔는 다리를 움켜쥐어 나무에 내던진다. 뼈가 부서지는 끔찍한 소리. 그는 다시 휘두른다. 멈추지 않는다. 마침내 그의 손에는 두 다리만 남고, 발밑에는 살덩어리의 웅덩이가 퍼져 있다.<br><br>그 웅덩이 속에서 무언가가 꿈틀거린다. 가느다란 근육의 실이 다시 엮이는 듯하다. 슬래셔는 주위를 둘러본다. 숲을 뒤덮은 안개가 검게 물든다.<br><br>어둠 속에서 그는 숲을 헤매는 겁에 질린 사람들의 환영을 본다. 그는 검은 구름을 헤치며 돌진한다. 안개가 갈라지며 올리브빛 피부에 목도리를 두른 젊은 여인이 드러난다.<br><br>그녀의 눈이 공포로 크게 뜨인다. 슬래셔는 마체테를 휘두른다.<br><br>그녀의 비명은 피가 목구멍을 가득 채우며 끊긴다. 그녀의 죽음은 이 세계에 울려 퍼지며 경고가 된다.<br><br>제이슨이 나타났다.","perks":["K43P01","K43P02","K43P03"],"dlc":"Sushi","power":{"ko":"편재한 악","en":"Omnipresent Evil","d":"<b>능력: 편재한 악<\/b><br><br><i>능력 활성화<\/i> 버튼을 눌러 <b>편재한 악<\/b>을 활성화할 수 있다. 슬래셔는 눈에 보이지 않으며, <b>감지 불가능<\/b>을 얻으나, 생존자나 생존자의 발자국을 볼 수 없다. <b>안개 구름<\/b>은 움직이지 않는 생존자들의 위치를 드러낸다. <b>발자국<\/b>은 걷거나 달리는 생존자가 지나간 경로를 드러낸다.<br><br><b>편재한 악<\/b>은 <b>깜짝 폴짝<\/b>을 사용하면 비활성화된다.<br><br><b>특수 능력: 깜짝 폴짝<\/b><br><br><b>편재한 악<\/b>이 활성화된 동안, 판자, 부서지기 쉬운 문, 또는 창문을 보고 빠르게 가까이 이동할 수 있고 특수 파괴 또는 특수 뛰어 넘기 행동을 수행할 수 있다. <i>추가 상호작용<\/i> 버튼을 눌러 <b>깜짝 폴짝<\/b>을 수행할 때 바라보는 방향을 바꿀 수 있다.<br><br><b>깜짝 폴짝<\/b>으로 <b>편재한 악<\/b> 모드에서 나가면, 일시적으로 <b>이동 속도 증가<\/b> 효과가 부여되며, <b>살인마의 본능<\/b>으로 감지된 생존자의 위치가 드러난다. 만약 슬래셔가 직접적으로 생존자를 쓰러뜨리면, 이동 속도 증가 효과는 제거된다.<br><br><b>특수 능력: 못 투척<\/b><br><br><b>고철 더미<\/b> 또는 <b>갈고리<\/b>에서 <b>못<\/b>을 집는다. <i>추가 상호작용<\/i> 버튼을 길게 눌러 <b>못<\/b>을 준비하고 <i>공격<\/i> 버튼을 눌러 투척할 수 있다. <b>못<\/b>은 <b>편재한 악<\/b>이 활성화될 때, 지도 곳곳에서 보충할 수 있다.<br><br><b>못<\/b>은 생존자를 뒤로 밀쳐내고 체력 1만큼의 피해를 입힌다.<br><br>생존자들을 <b>갈고리 못<\/b>으로 타격하면, 그들은 <b>관통<\/b>된다. 그들의 부상당한 부위는 더 이상 회복할 수 없으며, 박힌 <b>갈고리 못<\/b>에는 살인마에게 보이는 오라가 드러난다.<br><br>부상당한 생존자는 <b>못<\/b>에 찔리고 벽에 부딪히면, <b>관통<\/b>되며, 동시에 <b>움직일 수 없다<\/b>."}},{"id":"K44","ko":"심판","en":"The Judgment","d":"심판은 신성한 빛으로 창조주의 뜻을 실현한다. 개인 기술인, <b>천상 존재의 목격<\/b>, <b>주술: 손아귀에 있느니<\/b>, 그리고 <b>초토화<\/b>를 사용하여 집착 대상을 탐색하며, 이동 속도 증가와 함께 생존자를 제한하고 감시하고, 발전기 퇴보 속도를 증가시킨다.","story":"<i>중재자들의 편지에서 복원된 부분들:<\/i><br><br>“당신은 이 세상에서 정화된 이단자들 중 하나로 여겨지기를 남겠습니까? 아니면 우리가 그랬듯, 심판 앞에서 거듭 자신을 증명하기를 열망합니까? 그렇다면 이 말을 명심하십시오. 그들의 집단적인 지혜가 우리를 구원했고, 심판이 다시 올 때마다 우리를 구원해 주기를 간절히 기도합니다.” <b>(I 야만인, 3장)<\/b><br><br>“누군가는 묻습니다. ‘심판 이전의 삶은 어떠했는가?’ 이를 기억할 만큼 오래 산 자들은 감히 말하지 않지만, '테라 프리무스'라 불린 세계가 죄와 이단으로 가득했음을 알고 있습니다. 신앙 없는 자들은 자신들을 위해 크고 끔찍한 기념물을 세웠습니다. 하늘을 찌르는 도시와 천공을 가르는 함선, 그리고 세계를 가로지르는 불경한 기계들을 만들었습니다. 테라 프리무스의 지배자들은 스스로를 신으로 높였고, 그들의 지혜 속에서 천상 존재는 심판을 내려 우리가 잘못을 깨닫고 그 대가를 치르게 하였습니다.” <b>(드러난 진실, 5장)<\/b><br><br>“방식으로 돌아가려 하지 마십시오. 테라 프리무스의 탑과 기술은 이단이었습니다.” <b>(저 너머의 율법, 15장)<\/b><br><br>“덴드의 정착지를 기억하십시오. 자신의 아이를 심판에게 바치며 ‘위대한 천상 존재시여, 나의 헌신을 증명합니다!’라고 외치고, 유일한 자식에게 칼을 꽂은 어머니 루이사를 기억하십시오. 그러나 심판은 무고한 자를 희생한 죄로 물어 덴드의 사람들에게 빛을 내려 그들을 벌하였습니다.” <b>(I 야만인, 11장)<\/b><br><br>“오직 살아가는 데 필요한 것만 세우고, 먹을 만큼만 심으십시오. 그 이상의 욕망은 이단이며, 반드시 벌을 받아야 합니다.” <b>(저 너머의 율법, 1장)<\/b><br><br>“심판을 위한 첫 번째 성소를 세운 자조차 결국 그 빛에 불타 사라졌음을 기억하십시오. 야영지에서 살아남은 이는 오직 경건한 자 게르하르트뿐이었으니, 그는 성소에 자신의 손을 꿰뚫어 헌신을 증명하였습니다.” <b>(I 야만인, 12장)<\/b><br><br>“예배는 곧 고통입니다. 예배를 잊지 말되, 지나치게 탐닉하지 마십시오. 얼마나 고통받아야 하는지는 스스로 깨달아야 합니다. 그 균형을 벗어난 모든 것은 이단이며 반드시 벌을 받아야 합니다.” <b>(저 너머의 율법, 2장)<\/b><br><br>“누군가는 천상 존재에 대해 묻습니다. ‘그들의 본질은 무엇인가? 그들의 위계는 어떤 질서인가?’ 그들의 본질은 알 수 없으며, 그들의 질서는 곧 궁극적 질서입니다. 심판은 그 위계에서 가장 사랑받는 존재이며, 모든 시대와 모든 세계에 걸쳐 올바름과 정의를 대표합니다.” <b>(드러난 진실, 2장)<\/b><br><br>“심판 밖에서 답을 찾지 마십시오. 신들의 뜻에서 벗어나는 모든 것은 이단이며 반드시 벌을 받아야 합니다.” <b>(저 너머의 율법, 5장)<\/b><br><br>“눈이 멀어버린 코엔라드를 기억하십시오. 그는 심판을 향한 신뢰의 증거로 자신의 눈을 찢어버렸습니다. 코엔라드는 스스로를 증명했고, 노년에 맞이한 죽음은 심판이 내린 선물이 되었습니다. 그러나 그의 행위를 따라 눈을 찢어낸 자들을 또한 기억하십시오. 그들은 단순한 모방의 죄로 인해 심판의 빛에 불타 처벌을 받았습니다.” <b>(II 야만인, 7장)<\/b><br><br>“두려움은 곧 신앙입니다. 두려움은 심판을 향한 사랑입니다. 두려움 없는 삶은 이단이며 반드시 벌을 받아야 합니다.” <b>(저 너머의 율법, 5장)<\/b><br><br>“누군가는 묻습니다. ‘사기꾼 스타도터는 번영하는가? 그녀는 필요한 것 이상을 짓고, 음식과 재물을 쌓아두며, 예배하지 않고 별들 속에서 답을 찾는다. 어째서 그녀의 반복된 이단 행위는 벌을 받지 않고, 우리는 굶주리며 형제, 배우자, 자식들이 심판의 빛 속에서 타는 것을 보아야 하는가?’ 사기꾼 스타도터가 살아 있는 이유는 우리가 그녀와 그 추종자들은 처벌하기 위함입니다. 이것이야말로 우리에게 내려진 가장 큰 시험이며, 심판은 우리가 그녀를 이겨내도록 살려두는 것입니다.” <b>(드러난 진실, 3장)<\/b><br><br>“이웃을 주의 깊게 살피십시오. 그들의 말과 행동이 의로운지 보십시오. 이단자에게 자비를 베푸는 것 자체가 이단이며 반드시 벌을 받아야 합니다.” <b>(저 너머의 율법, 8장)<\/b><br><br>“배신자 라그나르를 기억하십시오. 한때는 이단을 사냥하는 자였으나, 그녀는 중재자들을 떠나 사기꾼 스타도터의 그늘 아래 보호를 구했습니다. 그러나 보호는 허상이었고, 다음 해 심판이 돌아왔을 때 라그나르는 그 빛 속에서 파괴되었습니다.” <b>(III 야만인, 6장)<\/b><br><br>“사기꾼을 추종하는 자들의 말에 귀 기울이지 마십시오. 검은 안개나 어두운 그림자에 대한 이야기를 무시하십시오. 사기꾼이 심판을 이겼다고 말하는 자들을 처벌하십시오. 적의 거짓에 동조하는 것은 이단이며 반드시 벌을 받아야 합니다.” <b>(저 너머의 율법, 3장)<\/b><br><br>“이것을 중개자의 마지막 말로 삼으십시오. 사기꾼 스타도터를 파괴한 이후 심판은 12번의 겨울 동안 돌아오지 않았습니다. 우리의 신이 사라지고, ‘오로라인’이라 자칭하는 이단자들이 우리를 무너뜨렸음에도 우리는 결코 헌신을 저버리지 않을 것입니다. 심판은 반드시 돌아올 것이며, 우리는 끝까지 믿음을 지킨 자들로 기억될 것입니다. 우리의 무거운 책임은 자녀와 그들의 자녀를 위해 이단과 싸우고 심판의 형상으로 새로운 세계를 세우는 것입니다.” <b>(최후의 증언, 11장)<\/b>","perks":["K44P01","K44P02","K44P03"],"dlc":"Udon","power":{"ko":"신들의 의지","en":"Will of the Gods","d":"<b>신성한 빛<\/b><br><br>능력 버튼을 눌러 신들의 의지를 충전하고 신성한 빛을 소환한다. 심판이 잠시 동안 신성한 빛의 궤적을 제어할 수 있다.<br><br>신성한 빛은 모든 장애물을 통과하지만 속도는 약간 느려진다.<br><br>심판이 준비되면 신성한 빛을 발사하여 치명적인 피해를 입히고 일정한 속도를 유지하며 장애물의 영향을 받지 않는다.<br><br>신성한 빛을 제어하는 시간이 길수록 시전 효과가 강해져 가속도, 지속 시간, 치명적인 피해 발생 속도가 빨라진다.<br><br>생존자가 신성한 빛의 궤적에 휘말리면, 이단자가 아닌 경우 이단 상태가 되고 건강 상태가 1단계 감소한다.<br><br><b>이단<\/b><br><br>생존자가 신성한 빛에 피해를 입으면 이단 상태가 되어 수리 효율이 떨어지고, 수리 스킬 체크 성공 진행도가 감소한다.<br><br>이단은 심판의 신전에서 회개하거나, 망명된 이단자를 해방하거나, 망명에서 구출되면 시간이 지남에 따라 감소한다.<br><br><b>망명<\/b><br><br>심판은 이단에 걸린 생존자 위에 서 있을 때, 그들을 망명하거나 생존자가 두 번째 갈고리에 걸린 경우라면, 그들을 죽여 열정 상태를 부여할 수 있다.<br><br>망명되면 갈고리 상태 한 단계를 얻으며, 망명된 자를 정화하려는 처벌의 씨앗을 피해야 한다. 망명된 동안 생존자들은 수색자의 펜던트를 사용하여 망명된 영혼을 모을 수 있으며, 이 영혼들은 심판의 신전에서 해방된 생존자들에게 추가적인 보호막을 제공한다.<br><br><b>열정<\/b><br><br>열정 상태일 때, 심판은 신성한 빛을 시전한 후 빠르게 방향을 바꿀 수 있는 능력을 얻는다.<br><br>또한 신성한 빛의 범위와 속도가 증가한다."}}],"survivors":[{"id":"Dwight","ko":"드와이트 페어필드","en":"Dwight Fairfield","d":"아군을 찾아 그들의 효율성을 높일 수 있는 불안정한 지도자.<br><br>그의 개인 기술인 <b>유대감<\/b>, <b>자기증명<\/b> 및 <b>리더<\/b>는 다른 생존자들과 거리를 가까이할 수 있고, 자신뿐만 아니라 다른 생존자들의 행동에 보너스를 제공할 수 있다.","story":"드와이트는 고등학생일 적에 괴짜 기질을 가지고 있는 아이였다. 그는 항상 멋진 아이 중 하나가 되고 싶어 하였지만 그렇게 될 카리스마는 없었다. 미식축구팀에 지원하였지만 퇴짜맞았고, 농구팀은 거들떠보지도 않았으며, 성적은 평균 이하였다.<br><br>어느 주말, 그의 장래성이 없는 직장의 협동 단결 대회에서 드와이트의 상사는 숲속 깊이 데려가 수제 밀주 한 잔을 건넸다. 다음 날 아침에 홀로 깨어나 드와이트가 기억한 것이라곤 딱 한 모금을 마셨다는 것뿐이었다.<br><br>밤 사이, 모든 이들로부터 드와이트는 버려진 것이었다. 한번 더 웃음거리가 된 드와이트는 숲을 벗어나려고 걸었다. 그것이 드와이트 페어필드의 마지막이었고, 지금까지 아무도 그에 대해 들은 바가 없다.","perks":["Bond","Leader","Prove_Thyself"],"dlc":null},{"id":"Meg","ko":"메그 토마스","en":"Meg Thomas","d":"대부분의 살인마를 앞지를 수 있는 활동적인 운동선수.<br><br>그녀의 개인 기술인 <b>빠르고 조용하게<\/b>, <b>전력 질주<\/b> 및 <b>아드레날린<\/b>은 추격을 피하고, 자신과 살인마 사이에 거리를 벌리는 이점을 제공한다.","story":"메그에게 특별함을 물려준 사람은 메그의 엄마일 수도, 메그가 아기였을 때 떠나간 아버지였을지도 모른다.<br><br>메그는 학교성적이 아주 뛰어났지만 언제부턴가 잘못된 길로 빠지기 시작했다. 다행히 메그의 육상코치가 잘못된 방향으로 향하는 메그를 독려하며 바로 잡아 주었다.<br><br>메그는 스스로 동기를 부여했고, 고등학생 스타가 되었으며, 대학 장학금도 받았다. 그러나 어머니가 병에 걸리게 되고, 결국 메그는 대학에서의 기회를 포기하기로 결정한다.<br><br>어느 여름날, 깊은 숲으로 운동을 하러 간 메그가 사라졌고, 누구도 그녀의 시체를 발견하지 못했다.","perks":["Adrenaline","QuickQuiet","Sprint_Burst"],"dlc":null},{"id":"Claudette","ko":"클로뎃 모렐","en":"Claudette Morel","d":"그녀 자신뿐만 아니라 팀 전체의 생존 가능성도 높일 수 있는 학구열을 가진 식물학자.<br><br>그녀의 개인 기술인 <b>공감<\/b>, <b>식물학 지식<\/b> 및 <b>자기 치료<\/b>를 통해 부상당한 생존자를 찾아내고, 자신과 팀을 보다 효과적으로 치료할 수 있다.","story":"클로뎃 모렐은 그녀의 부모가 준 첫 번째 과학 키트를 받은 날부터 실험과 사랑에 빠졌다. 클로뎃은 과학을 향한 일편단심으로 정진한 끝에 우수한 대학에 조기 장학금을 받게 되었다. 몬트리올을 떠나야 하는 것은 큰 결정이었지만, 놓치기에는 너무나 좋은 기회였다.<br><br>클로뎃은 내성적인 성격의 소유자로 인터넷 채팅방과 게시판에 글을 쓰는것이 유일한 인간관계였다. 그녀의 취미는 다른 사람의 식물학 질문에 대답해 주는 것이였다.<br><br>어느날 저녁, 도시에서 떨어진 곳으로 버스를 타고 가던 중 그녀는 인생을 바꿀 산책을 하게 된다. 일 분도 채 지나지 않아 무성한 숲속에서 길을 잃어버렸다. 결국 돌아갈 길을 찾지 못하였고, 클로뎃이 활동하던 게시판에선 일주일이 지난 후에야 클로뎃이 어디 있는지 궁금해하기 시작했다.","perks":["Botany_Knowledge","Empathy","Self_Care"],"dlc":null},{"id":"Jake","ko":"제이크 파크","en":"Jake Park","d":"대부분의 상황에서 자신을 지킬 수 있는 고독한 생존주의자.<br><br>그의 개인 기술인 <b>굳건한 의지<\/b>, <b>차분한 영혼<\/b> 및 <b>공작원<\/b>은 주변 환경을 보다 효과적으로 돌아다닐 수 있게 하고, 부상을 입었을 때 생존할 수 있게 한다.","story":"부유한 CEO의 아들로 태어난 제이크 파크는 항상 아버지에게 압박을 받았다. 그의 형이 예일대에서 우수한 성적으로 졸업했을 때, 아버지로부터 받는 압박이 더욱 심해졌다. 제이크는 공부와는 맞지 않았지만, 아버지는 제이크가 왜 그가 누릴 수 있는 값비싼 교육을 거부하는지 이해하지 못했다. 마침내, 제이크는 학교를 중퇴하고 반항하기로 했다.<br><br>제이크는 숲의 가장자리에서 혼자 살게 되었고, 그의 아버지와는 몇 년 동안 연락을 하지 않았지만, 어머니와는 가끔 안부를 주고받았다. 그러다 연락이 되지 않는 제이크를 걱정한 그의 어머니는 마침내 경찰에게 연락했다.<br><br>경찰에 의하면 제이크는 숲에서 길을 잃었고, 수색팀은 몇칠간 찾아보았지만, 날씨가 좋지 않아 수색이 중단되었다. 제이크 어머니의 탄원에도 불구하고, 수색은 결국 재개되지 않았다.","perks":["Calm_Spirit","Iron_Will","Saboteur"],"dlc":null},{"id":"Nea","ko":"니아 칼슨","en":"Nea Karlsson","d":"쉽게 탈출하고 숨을 수 있는 도시의 예술가.<br><br>그녀의 개인 기술인 <b>균형 잡힌 착지<\/b>, <b>세련된 회피<\/b>, <b>노련함<\/b>은 목표를 달성하고 빠르게 회피하는 데 적합하다.","story":"니아는 스웨덴의 요에서 자랐다. 바쁜 부모님 밑에서 자랐지만, 행복한 어린 시절을 보냈다. 하지만 미국으로 이사를 오게 되면서 니아는 점점 불량해지기 시작했다. 니아는 친구들과 정든 삶을 떠나야만 했다.<br><br>니아는 그녀의 부모가 \"정상적인 아이\"이라고 생각하는 범주를 벗어나기 시작했다. 스케이트 공원을 피난처로 삼았고, 니아의 낙서인 “Mashtyx”는 점점 더 고향에서 보이지 않게 되었다.<br><br>니아는 정부 건물들에 낙서하고 고양이처럼 날렵한 그녀의 능력들로 위험을 피하는 놀이를 즐겼다. 결국 니아의 부모는 니아가 며칠 동안 보이지 않는것을 대수롭지 않게 생각하게 되었다. 니아는 달빛 한점 보이지 않는 어두운 어느 밤에 친구들과 낡은 크로터스 프렌 정신병동에 낙서하러 갔다. 그러나 너무 멀리까지 가버렸는지, 그 후 니아를 본 사람은 없었다.","perks":["Balanced_Landing","Streetwise","Urban_Evasion"],"dlc":null},{"id":"Laurie","ko":"로리 스트로드","en":"Laurie Strode","d":"어떤 어려움도 헤쳐나갈 준비가 되어 있는 결단력 있는 생존자.<br><br>그녀의 개인 기술인 <b>유일한 생존자<\/b>, <b>집착의 대상<\/b>, <b>결정적인 일격<\/b>은 자신을 드러내는 대가로 강력한 생존 능력을 부여한다.","story":"인생에서 가장 중요한 것이 무엇인지는 끝나기 직전에서야 알 수 있다. 로리는 작은 도시에서의 조용한 삶을 원하는 사람 중 한 명이었다. 로리는 보통 십 대 소녀처럼 친구들과 어울려 놀고, 데이트도 한두 번 하면서 평범하게 살고 싶었다. 그녀는 숙제도 열심히 하고, 선생님, 가족들, 그리고 친구들과도 잘 어울렸다.<br><br>평범한 어느 저녁, 그녀는 여느 때와 마찬가지로 아이를 돌보고 있었다. 그것이 그녀의 인생을 바꾸는 계기가 될 줄 상상도 못 한 채. 칼이 휙 하고 공중을 갈랐다. 비명이 들렸다. 소음이 그녀의 집중을 훼방 놓는다. 하지만 로리는 약하지 않고, 절대로 포기하지 않을 것이다.","perks":["DecisiveStrike","ObjectOfObsession","SoleSurvivor"],"dlc":"halloween"},{"id":"Ace","ko":"에이스 비스콘티","en":"Ace Visconti","d":"전체 팀의 기술 확률을 상승시키는 행운의 도박사.<br><br>그의 개인 기술인, <b>통찰력<\/b>, <b>판돈 올리기<\/b> 및 <b>비장의 패<\/b>로 모든 생존자들의 행운을 상승시키며 상자를 잠금 해제하는 데 도움을 준다.","story":"에이스 비스콘티는 매우 매력적인 남자다. 그의 매끄러운 언변과 백발이 섞인 깔끔한 이탈리아풍의 외모는 그를 50년대의 중년 영화배우처럼 보이게 한다.<br><br>그의 마음은 항상 카드에 대한 생각으로 가득 차 있었으며, 아르헨티나의 가난한 소년이었던 그는 기회의 땅에서 도박과, 사기, 유혹을 이용해 돈을 흥청망청 쓰는 사치스러운 삶을 얻었다. 돈은 항상 그의 손가락 사이로 빠져나갔으나, 그는 자기가항상 더 많은 돈을 벌 수 있다고 생각했다.<br><br>하지만 그는 그 야망을 이루지 못했고, 결국 질 나쁜 사람들에게 많은 빚을 지고 말았다. 그리고 마침내 그들이 빚을 징수하기 위해 그를 찾아갔을 때, 에이스는 그 어디에서도 찾을 수 없었다. 그를 목격했던 사람이나 그의 행방은 전혀 찾을 수 없었으나, 에이스 비스콘티를 아는 사람은 모두 단 한 가지에 동의했다. 그가 아무리 희박한 확률이라도 살아남고 말 것이라는 것을.","perks":["Ace_In_The_Hole","Open_Handed","Up_The_Ante"],"dlc":"fleshAndMud"},{"id":"Bill","ko":"윌리엄 빌 오버백","en":"William \"Bill\" Overbeck","d":"위급한 상황에 대처하는 데 노련한 군인.<br><br>그의 개인 기술인 <b>홀로 남겨진 자<\/b>, <b>빌려온 시간<\/b> 및 <b>불굴<\/b>은 긴박한 순간들에서 그를 더욱 강력하게 만든다.","story":"두 번의 베트남 전투를 치르고, 몇 개의 훈장과 폭탄의 파편이 박힌 무릎을 얻고, 그리고 명예로운 제대를 한 후에야 윌리엄 빌 오버백은 전투를 멈추고 평화로운 삶을 살 기회를 얻었다. 그리고 그는 그 삶을 매우 싫어했다.<br><br>수십년간 가망 없는 직업들을 목적 없이 전전하던 빌은, 정기 수술을 받으러 갔다가 새로운 세상에서 깨어났다. 질병이 일반 사람들을 이성이 없는 살인 기계로 바꾸고 있었다. 본능적으로, 빌은 그의 전투복을 입고 집으로 돌아가기 위한 전투를 했다. 시골의 유령마을을 지나 한 치 앞도 보이지 않는 숲에 당도했을 때, 그는 다른 생존자들을 보았고, 그들과 함께 감염된 무리로부터 도망쳤다.<br><br>결국, 빌은 그들의 안전을 위해 자신을 희생했고, 그의 시체는 발견되지 않았다. 빌은 그곳에 남겨졌다. 아무도 빌이 단 한 가지를 원하고 있다는 것을 몰랐다: 그것은 바로 싸울 수 있는 적이었다.","perks":["BorrowedTime","LeftBehind","SelfSufficient"],"dlc":null},{"id":"Feng","ko":"펭 민","en":"Feng Min","d":"목표에 집중하는 경쟁자로 자신의 전략을 아주 폭넓고 어려운 개개의 상황에 맞춰 설계할 수 있습니다.<br><br>그녀는 개인 기술인 <b>기술자<\/b>, <b>유연함<\/b>, <b>기민함<\/b>을 통해 발전기를 수리하고 살인마의 위치를 파악합니다.","story":"어려서 처음 컴퓨터 게임을 접했을 때부터, 펭 민은 곧바로 게임 속 세상에 매료되었다. 게임이라는 이름 속 색다른 세상의 색깔, 소리, 폭발력은 다른 세계에 가고 다른 사람이 될 수 있는 마법 같은 기회를 선사하였다. 그녀의 부모님은 처음에는 화면 앞에 몇 분 동안 앉아있는 펭 민에 대해 아무 불만이 없었으나, 몇 분이 몇 시간이 되고, 가끔은 며칠이 되자, 컴퓨터 선을 뽑아버렸고 공부에 더 집중하라고 강요하였다.<br><br>펭 민은 게임의 가능성 있는 미래를 이해하지 못하는 부모님에 대해 크게 실망하고 곧 가출해 인터넷 카페나 LAN 파티에서 시간을 보냈다. 펭 민은 게임의 일인자가 되기 위해 대부분의 시간을 게임을 하고 인터넷 방송을 하며 시간을 보냈다. 펭 민과 부모님의 관계는 소위 \"공휴일 부모님\" 이라고 하는, 공휴일을 제외한 날은 만나지 않는 사이가 되었다. 부모님은 외동딸인 펭 민을 가족의 골칫덩어리라 여겼다. 하지만 펭 민은 게임 업계에선 선망의 대상이었다. \"빛나는 사자\" 라는 별명을 얻고 펭 민은 명망 있는 한 e스포츠 팀에 입단하였고 다른 팀원들과 함께 기숙사 생활을 시작했다. 이런 생활은 부모님이나 다른 사람들이 게임에 대해 가진 선입견 그리고 오해에서 하나의 안식처가 되어주었다.<br><br>펭 민은 게임계의 일인자라는걸 증명하고 한계를 극복하기 위해 노력했다. 펭 민에게 훈련은 잠보다 더 중요했다. 곧 게임에서 우승하고 경기장은 응원하는 팬들로 가득했다. 하지만 이러한 기쁨은 오래가지 못했다. 최고가 되고 더욱더 강해져야 한다는 압박이 몰려왔다. 그녀는 자기 자신을 지나치게 혹사했고, 잠도 거의 자지 않았다. 점점 슬럼프에 빠졌으며 승부에서 패배하기 시작했다. 펭 민은 밤을 새며 부모님과 팬들을 실망 시킨 죄책감에 시달렸다. 결국 이성을 잃고 자괴감에 빠졌다. 거리를 방황하며 e스포츠에 대해선 눈곱만큼도 모르는 사람들이 득실한 술집을 드나들었고 진탕 취해 어딘지도 모르는 곳에서 다음 날 깨어나곤 했다. 어느 날 펭 민이 눈을 뜬 곳은 완전히 다른 세상이었다...","perks":["Alert","Lithe","Technician"],"dlc":"sparkofMadness"},{"id":"Smoke","ko":"데이비드 킹","en":"David King","d":"고위험 플레이를 선호하는 거친 싸움꾼.<br><br>그의 개인 기술인 우리는 <b>영원히 살 거야<\/b>, <b>죽기살기<\/b> 및 <b>신경 쓰지 마<\/b>는 공격적이고 전투적인 플레이 스타일에 대한 보상을 주지만 동시에 그를 취약하게 만든다.","story":"부유한 가정의 외아들로 태어난 데이비드 킹은 위대한 사람이 될 것만 같았다. 그는 맨체스터에서 자라면서 운동과 학업을 대성할 잠재력을 보여줬으며, 그의 집안이 가지고 있는 인맥이라면 어떤 길로 가더라도 성공할 수 있었다. 그의 싸움꾼 기질이 없었더라면 말이다. 데이비드는 싸울 때 뿜어져 나오는 아드레날린이 좋았으며 그것을 위해선 뭐든 할 수 있었다.<br><br>뛰어난 운동신경으로 스포츠계에 뛰어들었고 탁월하지만 신중한 럭비 선수로써 명성을 얻었다. 그러나 그는 욱해서 심판을 폭행해버리고 말았다. 그는 리그에서 퇴출당했지만 돈이 궁하지 않았던 그는 그 사실을 별로 개의치 않아 했고, 퇴출을 조기 은퇴로 생각하며 다른 재밌는 일을 찾기 시작했다.<br><br>직업이 없어도 놀고먹기에, 충분한 집안의 재산으로 데이비드 킹은 대부분의 시간을 술집에서 술 마시거나 경기를 관람하고 혹은 싸움을 하면서 보냈다. 어떤 사람들은 그가 인생을 낭비한다고 말했다. 소수의 사람만이 그가 자주 빚을 지고 파이트 클럽에서 싸웠다는 것을 알았다.<br><br>데이비드 킹이 더는 술집에 나타나지 않았을 때, 그의 몇 안 되는 친구들은 놀라지 않았다. 그들은 데이비드가 마침내 자기보다 더 강한 상대에게 싸움을 걸었다고 생각했다. 어떤 면에서는, 그들의 생각은 맞았다.","perks":["DeadHard","NoMither","WereGonnaLiveForever"],"dlc":"boreal"},{"id":"Kate","ko":"케이트 덴슨","en":"Kate Denson","d":"주변 환경을 최대한 잘 활용할 수 있는 능력을 가진 희망적인 음악가.<br><br>그녀의 전승 기술인 <b>나와 함께 춤을<\/b>, <b>기회의 창<\/b> 그리고 <b>폭발<\/b>은 가장 절망적인 상황 속에서조차 도망칠 수 있는 통찰력과 활기를 불어넣어줍니다.","story":"케이트 덴슨의 가장 오래된 기억은 그녀가 학교에서 배운 노래를 가족들 앞에서 부르고, 그들의 얼굴에 퍼지는 웃음꽃들을 지켜보는 것이었다. 노래와 같은 어찌 보면 간단한 것이 얼마나 사람들을 행복하게 만들 수 있는지 깨달은 그때가 앞으로 일생 무엇을 하고 살고 싶은지 깨달았을 때였을 것이다.<br><br>케이트가 기타를 잡을 수 있을 만큼 자랐을 때부터 기타를 배우고, 노래를 연습했다. 8살 때부터 사람들 앞에서 공연하기 시작했다. 어머니는 케이트의 꿈이 이뤄지기 위해 할 수 있는 일이라면 모두 했으며, 케이트를 펜실베이니아에 데려갔다가, 남부로 데려가고, 내슈빌에 데려가기도 했다.<br><br>케이트는 민요 부르기 대회나 탤런트 쇼에 참가할 때마다 우승했지만, 그녀가 이김으로 인해서 다른 이들이 져야 하는 것을 마음에 들어 하지 않았다. 그녀는 그저 사람들의 삶에서 감동을 주기 위해 노래를 부르고 싶었다. 사람들에게 세상의 걱정을 잠시 잊게 하고 잠깐이라도 그들 자신을 즐기게 하길 바랐다.<br><br>성인이 되고 나서, 케이트는 더 자유로워졌다. 낡고 오래되었지만 튼튼한 트럭을 샀고, 마음대로 여행하며 멈추는 곳마다 새로운 친구들과 팬들을 만났다. 케이트의 여행에는 많은 것이 필요하지 않았다. 그저 길과 기타면 충분했고 가끔은 하루를 잘 마무리할 수 있게 돕는 버번 한 잔이 필요할 뿐이었다.<br><br>햇볕이 쨍쨍한 축제에서 어둡고 칙칙한 술집까지, 사람들은 케이트의 목소리와 우정, 가족, 사랑 그리고 집에 대한 가사들에 매료되었다.<br><br>이러한 감정들은 그저 립서비스가 아니었다. 케이트는 최대한 자주 집으로 돌아왔으며 지역 사회를 돕고 아이들에게 여행한 이야기들을 해 주며 아이들을 즐겁게 해주었다. 케이트는 자신이 지역의 공동체로부터 도움을 받았던 예전의 기억들을 떠올리며 이러한 행동을 은혜를 갚는 것으로 생각했다.<br><br>케이트가 음악적 영감을 가장 잘 얻을 수 있는 곳이 집이기도 했다. 그녀는 마을 주변에 있는 숲에서 오랜 시간 동안 걸어서, 발걸음들로 만들어진 길을 따라 탐험하며 그녀가 노래를 만들고 부를 수 있는 조용한 장소를 찾는 것을 좋아했다. 그녀는 천 년 전에 바위로부터 튀어나온 것 같이 생긴, 나무로 둘러싸인 빈 곳을 가장 좋아해서 그곳을 여러 번 방문하기도 했다.<br><br>이 곳에서 그녀는 자연, 그리고 환경 그 자체와 깊이 동화됨을 느꼈다. 케이트는 자신의 마음을 숲에 맡겼고 숲은 곧바로 영감을 주었다.<br><br>케이트가 기타를 들어 연주했고, 손가락들이 프랫보드를 따라 춤을 추었다. 이번에 케이트가 만든 노래는 평소에 쓰던 밝은 톤의 음악이 아니었고, 조금 더 우울하고, 어두웠다. 하지만 어떤 것이 그 노래를 계속 연주하도록, 완주하도록 했다.<br><br>케이트 주변에서, 나무의 잎들이 기타의 줄들과 화합을 이루었고, 나무의 가지들이 길어져서, 살아 있는 어떤 형상으로 합쳐졌다. 거미처럼 생긴 다리가 숲의 우거진 부분에서 내려왔고, 케이트를 잡았다. 정신을 차린 케이트는 돌을 잡아서 그 다리를 쳐서 풀려나려고 해 봤지만, 그것은 강철처럼 단단했고 돌은 그저 튕겨 나가고 굴러다닐 뿐이었다.<br><br>다리들은 케이트의 팔과 다리 주변을 덩굴손처럼 휘감았고 어둠 저편으로 끌고 갔다. 케이트와 그녀를 끌고 간 악몽 같은 생물체를 이상한 안개가 둘러쌌다.<br><br>안개가 걷혔을 때, 저항의 흔적이나 생명의 흔적은 없었다. 그저 스크래치 플레이트가 꽃으로 새겨진 어쿠스틱 기타만이 남겨져 있었다. 그 기타에는 진주층으로 이니셜 KD가 새겨져 있었다.","perks":["BoilOver","Dance_with_me","WindowsOfOpportunity"],"dlc":"Guam"},{"id":"Quentin","ko":"쿠엔틴 스미스","en":"Quentin Smith","d":"결연한 꿈을 걷는 자로 팀원의 생존성과 회복력을 높여준다.<br><br>그는 전승 기술인 <b>정신 차려!<\/b>, <b>약제학<\/b>, <b>불침번<\/b>을 이용해 생존자들이 출구를 찾고 더 쉽게 회복할 수 있도록 돕는다.","story":"낸시의 엄마가 실종되었다는 소식을 들었을 때, 쿠엔틴은 그들의 승리가 얼마 가지 못했음을 알아챘다. 그들의 계획은 완벽하게 성공했지만, 프레디 크루거는 죽음에서 다시 살아 돌아왔다.<br><br>그러나 쿠엔틴 역시 포기하지 않았다. 수많은 시행착오가 있겠지만, 그는 어떻게든 프레디를 다시 한번 더, 이번엔 영원히 무찌를 방법을 찾아내겠다고 굳게 결심했다. 만약 그가 그러지 못한다면 프레디에게 패배하게 될 것이었고, 낸시가 죽게 되는 건 시간문제였기 때문이었다.<br><br>쿠엔틴 같은 부류의 사람은 조용히 지내는 데에 탁월했고, 그가 도서관에서 아무리 이상한 내용의 책을 읽더라도 그는 사람들의 관심을 끌지 않았다. 그는 공유되는 꿈속 세계와 자각몽, 그리고 꿈속의 현실을 다스리는 법에 대한 가능한 한 찾을 수 있는 모든 정보를 습득했다. 잠들지 않기 위해 각성제와 에너지 드링크를 복용해 억지로 잠을 깨워가며 자료를 찾던 쿠엔틴은, 먼지가 뒤덮인 서적들 속에서 피해자들을 꿈속에 가둬놓고 그들의 공포를 힘의 원천으로 하는 악마에 관한 신화를 발견했다.<br><br>프레디가 곧 그를 찾아낼 것을 알기에 쿠엔틴은 그가 할 수 있는 최대한 빠르게 프레디에게 맞설 준비를 하기 시작했다.<br><br>그리고 얼마 지나지 않아 프레디는 그의 꿈속에 나타나기 시작했다. 그는 처음엔 꿈의 주변을 겉돌며, 멀찍이서 쿠엔틴을 도발하면서 그가 지치기를 기다렸다. 쿠엔틴은 습득한 지식으로 꿈속 세계의 허점을 발견할 수 있었다. 그것은 공간의 갈라진 틈새였는데, 쿠엔틴은 이를 변형해서 꿈으로부터의 탈출구로 이용할 수 있다는 것을 알아냈다. 그는 프레디를 상대하는 데 이 지식과 기술이 도움을 줄 수 있기를 바라면서 그의 손동작이 프레디에게 보이지 않도록, 조심스럽게 능력을 사용했다.<br><br>그러던 어느 날 밤, 쿠엔틴은 배드햄 유치원에 있는 자신을 발견했다. 쿠엔틴을 유인하는 데에 실패한 프레디가 마침내 직접 나서기로 결정한 것이었다.<br><br>쿠엔틴은 유치원 속 미로에서 도망 다니면서 도움이 될 만한 것들을 눈으로 재빠르게 훑었다. 그는 물감 연화제 한 통을 찾았고, 빠르게 계획을 세웠다.<br><br>함정을 파놓은 후, 그는 자신을 미끼 삼아 프레디를 목표한 곳으로 끌어오기 위해 기다렸다. 그리고 마침내, 그를 죽이기 위해, 날카로운 손톱을 과시하며 프레디가 나타났다.<br><br>그는 연화제를 바른 곳에 불을 붙였고, 깜짝 놀라는 프레디의 얼굴을 확인한 후 출구를 찾아 나섰다. 그는 프레디에게 치명상을 입히고 꿈에서 벗어나면, 프레디를 물리칠 수 있다고 생각했다.<br><br>그러나 그가 꿈속 세계의 출구에 도착했을 때, 공간의 틈새는 막혀 있었고, 출구 또한 보이지 않았다. 어느새 그는 다시 프레디가 만들어 낸 미로 속에 있었고, 도망칠 곳은 없었다.<br><br>화상을 입어 흉측해진 얼굴에 미소를 띤 채로 프레디가 점점 다가올 때, 쿠엔틴은 그를 흔적도 없이 치워버리고 싶다는 충동에 사로잡혔다. 그는 프레디의 목숨을 끊기 위해 화염병을 던진 것이 아버지가 아니라 자신이었기를, 프레디의 목을 벤 것이 낸시가 아니라 자신이었기를 바랬다. 그의 바람이 이루어진 것이었을까? 아니면 이 세계는 마음이 만들어낸 정신 속 세계였기 때문이었을까.<br><br>그는 자신의 소망이 형체를 가져 자신을 삼키기 시작해도 신경 쓰지 않았고, 다만 모든 힘을 다해 프레디가 사라지기를 염원했을 뿐이었다.<br><br>안개가 그를 뒤덮었고, 시야마저 안개에 가려졌다. 잠시 후 안개가 사라지고 정신을 차렸을 때, 그는 아까와는 완전히 다른 곳에 있었다. 또 다른 꿈속 세계인가? 만약 그렇다면 그의 꿈은 아니었을 것이다. 이 세계는 낯설고, 추운 곳이었다.<br><br>타닥거리는 소리와 불똥이 그의 주의를 환기했다. 주위를 둘러보자 그는 어떤 모닥불 옆에 있었고, 그곳에는 쿠엔틴뿐만이 아니라 다른 사람들도 있었다. 다른 사람들도 이곳에 끌려온 것이었다. 그리고 쿠엔틴의 도움이 필요했다.","perks":["Pharmacy","Vigil","WakeUp"],"dlc":"Sandman"},{"id":"Eric","ko":"탭 형사","en":"Detective Tapp","d":"목표를 더 빠르게 찾고 완수할 수 있는 능력을 가진 집착력 있는 형사.<br><br>그의 개인 기술인 <b>집념<\/b>, <b>형사의 직감<\/b>, <b>잠복 근무<\/b>는 목표에 좀 더 집중하고 빠르게 회복할 수 있게 돕는다.","story":"탭 형사는 선한 사람이었다. 이 세상의 모든 살인자가 죗값을 치르게 하고 피해자들을 위해 그들을 심판하겠다는 그의 의지는 그를 오랫동안 존경받게 했다.<br><br>그가 처음 직쏘 살인 사건을 담당하게 되었을 때, 그는 직쏘 살인 사건이 다른 사건들과 크게 다를 게 없다고 여겼다. 물론 다른 사건들보다 더 끔찍하고 섬뜩하긴 했지만, 탭 형사에게 직쏘란 미치광이 살인마이자 얼마 지나지 않아 철창 뒤에 갇히게 될 수형자에 불과했다.<br><br>사건의 실마리를 찾던 도중 뇌리를 스치는 직감에 탭 형사는 동료 형사, 스테판 싱을 데리고 직쏘의 은신처인 폐쇄된 마네킹 공장으로 찾아갔다. 그 곳에서 직쏘를 찾아내 제압하는 데 성공했지만 직쏘의 가면을 벗기려던 찰나, 직쏘는 탭 형사의 목을 칼로 긋고 도망쳐버렸다.<br><br>싱 형사는 다친 탭을 뒤로하고 직쏘를 추격하던 도중 직쏘가 파놓은 함정에 걸려 죽고 말았다.<br><br>이 일로 탭 형사는 수색영장 없이 직쏘의 은신처에 찾아간 것과, 그로 인해 동료를 희생시켰다는 명목으로 형사의 직책을 박탈당했다. 그 후 탭에게 남은 것은 상처를 입어 엉망이 된 목과 죄책감뿐이었다.<br><br>그의 죄책감은 곧 집착으로 바뀌었다. 탭은 직쏘를 잡아내서 더 이상의 희생을 막고, 자신의 동료를 포함한 희생자들의 복수를 해서 자신의 과오를 씻어내겠다고 다짐했다. 직쏘의 행방을 찾아 추적하던 도중 그는 로렌스 고든 박사를 발견하고 그의 근처에 잠복했다. 그는 고든 박사를 감시하면 직쏘의 죄를 입증할 수 있는 증거를 찾아낼 수 있다고 확신했다.<br><br>어느 날 고든 박사의 집을 지켜보던 도중 탭은 창문 너머로 수상한 사람을 보았고 이윽고 총성을 들었다. 탭은 용의자를 쫓아 어느 산업용 건물로 들어갔다.<br><br>그 안에서 탭 형사는 접전 끝에 가슴에 총을 맞고 쓰러졌다. 젊은 시절의 그였다면 어렵지 않게 승리했을 싸움이었지만, 그는 이미 나이를 먹어 노쇠해진 뒤였다. 탭은 다시 실패를 맛보며 힘없이 쓰러졌다. 그는 자기 동료와 희생된 사람들의 억울함을 풀어주지 못했다. 살인자가 누구였던지 간에, 탭은 그를 막지 못했다. 탭이 그를 막지 못했기 때문에, 앞으로 더 많은 사람이 죽게 될 것이다.<br><br>탭은 분노와 죄책감을 느끼면서 마지막으로 눈을 감았다. 그가 엎드려 있던 콘크리트 바닥이 부드럽게 느껴졌다. 손가락이 땅을 파고들면서 흙과 나뭇잎이 한 움큼 쥐어졌다. 피로 얼룩진 가슴팍은 깨끗해져 있었고 상처와 고통도 사라져 있었다. 눈을 떴을 땐 하늘은 깜깜했고 주변엔 들쭉날쭉한 나뭇가지 투성이였다.<br><br>그의 절규가 숲속에서 메아리쳤고 굳은 결심이 그를 일어서게 했다. 몇 달 만에 정신이 번쩍 뜨이는 것 같았다. 피해자들을 위해 복수하고 살인자들을 심판해야 한다. 자신이 눈을 뜬 장소가 어디인지 모르지만, 탭은 여전히 경찰이었고, 앞으로도 계속 그럴 것이다.
