 그에겐 아직 해야 할 일이 있다.","perks":["DetectivesHunch","StakeOut","Tenacity"],"dlc":"Finland"},{"id":"Adam","ko":"아담 프란시스","en":"Adam Francis","d":"낯선 환경이나 상황에서도 빠르게 적응하고, 그에 따른 전략적인 사고를 할 수 있는 교사.<br><br>그의 전승 기술인 <b>교란<\/b>, <b>구조<\/b> 그리고 <b>독학자<\/b>는 살인마의 시선을 다른 곳으로 끌고, 절망적인 상황에서도 스스로 살아남을 수 있으며, 희생제 안에서 자신의 노련함을 증명한다.","story":"아담은 자메이카 킹스턴의 롤링턴 마을에서 태어났다. 아담이 2살 때 그의 아버지는 교통사고로 사망하였고, 삼촌이 그를 양육하게 되었다. 그의 삼촌은 교육을 중요하게 여겼으며, 엄격하고 공정한 사람이었다.<br><br>킹스턴 대학에서 아담은 아버지가 출판했던 작품들을 우연히 접하며 문학에 대한 열정을 불태웠다. 그러나, 킹스턴 대학은 체육 학과 쪽으로 정평이 나 있는 학교였다. 책만을 달고 살던 소심한 10대였던 아담은 그런 면에서 불량한 아이들에게 완벽한 먹잇감이었다. 그는 체육엔 소질이 없었고, 자신을 챙기는 것만으로도 벅찼다.<br><br>대학 생활을 하는 동안 그는 자신이 이곳이 아닌 다른 어딘가에서 사는 삶을 꿈꿔왔다. 그의 절친한 친구가 음악 업계로 진로를 바꿨던 일은 이러한 그의 꿈에 큰 영향을 미쳤다. 아담의 우수한 성적은 더 높은 수준의 교육을 받을 수 있을 정도였고, 마침 해외에서 외국 교사를 필요로 한다는 것을 알게 되었다.<br><br>대학을 졸업한 후, 그는 해외로 나가기 위한 충분한 자금을 모으려고 과외 수업을 했다. 그는 매일같이 장시간을 통근하면서, 수많은 시험지를 채점하였고, 야간 강의와 아침 강의도 계획하였다. 이듬해에 그는 가까스로 해외에 나갈 수 있는 지원 자격을 얻게 되었다. 그의 새로운 인생을 위한 첫 비행기는 일본 남부로 떠났다.<br><br>아담은 가고시마에서 정신없는 삶을 살았다. 그러다 보니 집에 돌아왔을 때 다른 일을 할 작은 여유조차 없었다. 초등학생 수준의 일본어 실력에 스스로가 위축되었고, 장을 보는데도 한나절이 걸렸으며, 다음 날은 긴 통근 시간이 기다리고 있고, 수업할 때에도 일본의 문화에 적응해야 하는 등 그가 배워야 할 것이 많았기 때문이다.<br><br>그러나 몇 개월이 지나고, 그는 드디어 일상생활에 익숙해지기 시작했다. 기차를 타고 출근하던 어느 날 아침 그는 자신을 되돌아보았다. 더는 지도에 빼곡히 쓰여있는 한자들을 해석하느라 골머리를 앓지 않아도 되었다. 그는 이제 이곳에서도 자신만의 삶을 영위할 수 있었다. 일본어는 점점 늘어갔고, 학생들과도 서서히 말문이 트이기 시작했다. 주말에는 고급 식당에서 식사하였다. 나아가 그는 이제 일본에서 그의 생애 첫 휴가를 계획하고 있었다.<br><br>찰나의 순간, 아담 주변의 세상이 느리게 움직이기 시작했다. 철도의 불결한 마찰음이 들리고, 여행 가방들이 바닥에 떨어져 내리기 시작했다. 열차가 뒤집혔고 아담은 고꾸라졌다. 바로 그때 충격으로 떨어져 나간 문이 여자아이를 덮쳤다. 아담은 아이를 대신해 몸을 던졌고 충격에 대비해 눈을 질끈 감았다. 아무 일도 일어나지 않은 것처럼 조용했다. 그가 한쪽 눈을 살며시 떴을 때 어둠 외엔 아무것도 보이지 않았다. 기차 안은 짙게 깔린 안개만이 자욱했을 뿐이었다.<br><br>서늘한 기운이 그의 몸을 타고 입술에 닿았으며 이내 온몸 구석구석을 지배했다. 어둠의 속삭임이 콧노래를 희미하게 흥얼거렸고, 그는 눈을 감은 채 정처 없이 어둠 속을 떠돌아다녔다. 아무도 아담 프란시스에게 무슨 일이 일어났는지 알 수 없었다. 동료 교사들은 뉴스를 통해 그가 탄 기차가 탈선했다는 소식을 보았고 최악의 경우 아담이 실종되었음을 알게 되었다. 그들의 불길한 예감은 사고 현장에서 아담의 여행 가방은 발견되었지만, 그의 시신은 어디에도 보이지 않는다는 점에서 확실시되었다. 오늘날까지도, 아담의 삼촌은 아담이 사고 현장에서 무사히 벗어나 여전히 어딘가에 살아 있을 것이라고 믿고 있다.","perks":["Autodidact","Deliverance","Diversion"],"dlc":"Haiti"},{"id":"Jeff","ko":"제프 요한센","en":"Jeff Johansen","d":"불가능한 확률에 흔들림 없이 맞서는 과묵한 예술가이다.<br><br>전승 기술은 <b>부수기<\/b>, <b>갱생 지도<\/b>, <b>뒤틀림<\/b>으로, 관찰하기 좋고 살인마로부터 존재감을 숨기는 데 도움이 된다.","story":"제프 요한센은 앨버타주 오르몬드에서 나고 자랐다. 외동으로 조용하게 자란 탓에 사람 많은 곳을 싫어했다. 고등학교 시절에는 자신의 불안증 많은 기질을 수줍음으로 오인한 나머지, 양아치들은 물론 교사들마저 위협하는 강하고 냉정한 태도로 자신을 포장했다. 집에서는 헤비메탈에 빠져서 음반 수집을 시작했다. 음반 커버의 상징성에 자극을 받아서 직접 그림을 그리게 되었고 부모님 사이의 끊임 없는 불화 속에서 버티는 데 힘을 주었다.<br><br>점점 더 자주 폭발하는 부모님을 피해서 제프는 비디오 가게에서 일을 시작했다. 손님이 뜸한 덕분에 그림 그릴 시간이 많아졌다. 늦은 밤에 오는 단골 하나가 제프의 스케치를 보고는 오르몬드 산에 버려진 폐가에 모이는 자신의 갱을 위해서 그림을 그려 달라고 했다. 제프는 의뢰를 수락하고 휘갈기는 것 같은 핏빛 글자로 “군단” 이라 쓴 커다란 벽화를 그랬다. 노동의 대가로 제프는 50달러와 맥주 12캔을 받았다. 그 벽화는 제프가 처음 받은 의뢰였고 자기 그림에 자부심을 가지게 된 바탕이었다.<br><br>부모님이 이혼한 뒤에 제프는 억지로 어머니를 따라 고향과 아버지로부터 멀리 떨어진 매니토바주 윙클러로 이사를 해야 했다. 제프는 윙클러에서 더욱 고립되어 그림과 음악만 가까이 했다. 위안이라고는 고등학교를 졸업한 직후에 라이브 음악 공연이 있는 근처 술집에서 일을 시작한 것이었다. 그리고 곧 로드 매니저 일을 찾아서 윙클러를 떠났다.<br><br>몇 년 뒤에 제프는 콘서트에서 일어난 싸움에 휘말려 부상을 입었다. 의사는 시력을 어느 정도 잃게 될 수 있다며 그 마을에 남아서 상태를 지켜보라고 권했다. 이때는 제프가 자기 삶의 선택을 되돌아보게 되는 힘든 시기였다.<br><br>그리고 제프는 예술 학교에 들어갔다. 시력은 천천히 돌아왔지만, 무리해선 안 되었다. 제프는 수업을 몇 개 듣고, 여러 가지 매체를 시험한 끝에 유화와 디지털 아트를 선택했다. 디지털 아트 수업 덕분에 나중에 유급 인턴십 자리를 제안받게 되었다. 제프는 사무직을 선택했고 소형 양조장의 라벨을 디자인하는 데서 자기 재능을 발견했다. 그리하여 제프는 조용하고 단순한 삶을 이어갔다. 직접 맥주를 만들고, 유기견을 입양해 키우고, 타투를 디자인하고 좋아하는 음악 밴드의 앨범 커버 디자인 외주를 받으며 일했다. 그리고 어느 날, 아침에 오르몬드에서 아버지가 돌아가셨고, 유품을 정리해 달라는 전화를 받게 된다.<br><br>그래서 제프는 오르몬드로 돌아갔고, 돌아가신 아버지 집에 도착하자마자 강렬한 향수를 느꼈다. 안에는 낡은 기타 케이스가 벽에 기대어 있었는데, 검은 빈티지 모델과 함께 “우리 아들에게” 라고 쓴 포스트잇이 있었다.<br><br>결국 제프는 어린 시절을 추억하면서 애초에 예정했던 것보다 더 오래 오르몬드에 머무르게 되었다. 차로 예전 고등학교를 지나치면서 오르몬드 산에 벽화를 그렸던 일이 떠올랐다. 제프는 맥주 12캔을 사 들고 그 산장을 향했다.<br><br>제프로부터 소식이 끊기고 몇 주가 흐르자, 직장 동료들은 제프가 슬픔을 이기지 못했다고 생각했고, 이웃은 제프가 맡겨놓은 개를 돌보는 게 힘들어져서 날이 갈수록 짜증을 냈다. 결국 개는 다시 유기되었고, 제프가 마시던 친숙한 몰트향을 쫓아다니다가 사고를 당하고 말았다.","perks":["Aftercare","Breakdown","Distortion"],"dlc":"Kenya"},{"id":"Jane","ko":"제인 로메로","en":"Jane Romero","d":"영향력 있는 유명 인사로, 앞길을 가로막는 장애물들을 정면으로 돌파하는 성격이다.<br><br>그녀는 <b>연대<\/b>, <b>침착<\/b>, <b>정면충돌<\/b>이라는 개인 기술들을 보유하고 있으며, 이들을 유연하게 활용하여 자신은 물론 다른 사람들을 도와 어려운 상황을 헤쳐나간다.","story":"제인 로메로는 유명한 여배우인 로레타 로렌스의 딸로, 어머니에 대한 기억은 전혀 없다. 그녀의 부모는 제인이 아직 아기였을 때 갈라졌는데, 엄마는 영화 촬영으로 집을 비우는 일이 잦아 주로 성공을 꿈꾸는 비주얼 아티스트인 아버지의 손에 길러졌다. 그녀는 자신의 삶에서 자리를 비운 어머니를 증오하는 한편 스크린에 비친 어머니를 동경하는 양가적인 감정을 품으며 자랐다.<br><br>십대 때, 제인은 남몰래 어머니의 재능을 흉내 낼 수 있기를 바랐다. 그녀는 연극에서 연기와 지도를 하기도 했고, TV 광고 오디션에 나가거나 스튜디오에서 아버지의 일을 도왔다. 2학년이 됐을 때, 제인은 전국 웅변대회에 나가 1등을 차지했다. 그녀의 웅변술에 관심을 가진 한 라디오 방송국이 그녀에게 인터뷰를 제안했다. 생방송으로 진행되는 쇼에서 제인의 자연스러운 매력과 말 솜씨는 스태프를 매료시켰고, 그녀는 아르바이트로 함께 일해보지 않겠냐는 제안을 받았다.<br><br>커뮤니케이션 관련 대학을 졸업한 뒤 그녀는 방송국 일을 그만두고 트렌디한 버라이어티 쇼에서 일하기로 했다. 하지만 그녀의 솔직한 화법과 애드리브는 쇼의 운영진의 관심을 끌지 못했고, 그녀는 5개월 만에 해고당하고 말았다. 다른 기회가 있음에도 불구하고 제인은 전에 일하던 라디오 방송국에서 새로운 쇼를 제안했지만 <i>너무 위험하다<\/i>는 이유로 거절당했다.<br><br>4개월 뒤, 그녀는 자신이 출연했던 쇼의 재방송을 본 한 프로듀서에게서 전화를 받았다. 그는 위기에 처한 방송, <i>퀵 토크<\/i>를 살릴 수 있는 공동 진행자를 찾고 있다고 말했다.<br><br>TV 생방송은 긴 방송 시간에 급여는 낮고, 안정성도 전혀 없었지만, 그녀만의 방송을 진행할 수 있는 플랫폼을 약속받았다. 그녀는 <i>퀵 토크<\/i>의 다소 저급하며 선동적인 분위기에 반기를 들었고, 대신 사적인 이슈들에 집중했다. 시청자들은 그녀의 솔직 담백한 화법을 반겼으며, 몇 주 동안 쇼의 시청자 수는 꾸준히 증가했다.<br><br>2년 뒤, 그녀는 전국으로 송출되는 한 시간짜리 방송인 <i>제인 로메로 쇼<\/i>를 시작했다. 그녀는 거기서 금기시되는 주제부터 버림받았던 성장한 이야기까지 모두 다뤘다. 그녀의 쇼는 최고 기록을 나날이 갱신했고 그녀의 이니셜 J.R.을 딴 미용 크림부터 패션 액세서리까지 등장했다.<br><br>하지만 제인은 더 많은 것을 원했다. 그녀는 다른 이들이 자신의 발자취를 따라오기를 원했고, 제인은 자신을 버린 어머니와 자신의 유년 시절을 다룬 회고록을 출판했다. 회고록은 즉시 베스트셀러에 등극했지만 혹독한 비판을 받았다. 평론가들은 <i>개성 없고 어디서나 볼 법한 자기 계발 팁으로 적당히 버무린 슬픈 일화담<\/i>이라며 깎아내렸다. 이 비평에 큰 충격을 받은 그녀는 자신이 거둔 성공에도 불구하고 회의감을 느끼기 시작했다.<br><br>성공한 이후 스케줄은 빡빡해졌고 대중들을 계속 즐겁게 해줘야 한다는 압박감도 커져갔다. 유난히 바쁘던 일주일에 그녀는 에피소드를 보류하고 대신 2시간짜리 이혼 관련 특별 방송을 했다. 특히 어머니가 그녀의 쇼에 나오기로 했다는 소식을 들었을 때, 그녀의 스트레스는 최고조에 달했다.<br><br>제인은 담담한 얼굴로 쇼를 시작했다. 별 문제 없이 대부분을 마쳤지만, 어머니가 청중들을 향해 환하게 지으며 세트장으로 나오자 그녀는 속이 뒤집힐 것 같았다. 제인은 그동안 속으로 썩혀 온 질투에 완전히 집어삼켜졌다. 그래도 단정한 미소를 유지할 수 있었다. 어머니가 끼어들어 사실 둘은 아무 사이도 아니라는 말을 하기 전까지는. 이후 인터뷰는 엉망진창이 됐다.<br><br>쇼가 끝난 뒤, 제인은 차를 몰고 아버지가 사는 뉴저지로 갔다. 그녀는 최근 영 제정신이 아니었고, 아버지와 함께 이 상황에 대해 의논할 필요가 있었다. 그녀는 하루 종일 관자놀이를 두들기는 편두통을 잠재우기 위해 진통제를 먹고 해안선을 따라 고속도로를 탔다. 상태가 좀 안정되자 그녀는 라디오를 켰고, 클래식이 흘러나왔다. 차는 느린 속도로 움직였다. 길은 검은 눈으로 뒤덮였고, 집으로 돌아가는 차들로 빽빽했다. 밤이 찾아왔다. 어둠 때문에 그녀의 시야는 점점 좁아졌고, 헤드라이트 불빛이 붉은색으로 출렁였다. 그녀는 정신을 차리려고 눈을 깜빡였지만, 눈을 감을 때마다 눈꺼풀은 점점 무거워지고 둔해졌으며, 결국 영원히 닫히고 말았다.<br><br>다음 날 아침, 수사 당국은 물에 빠진 제인의 차를 인양했다. 몇 주 동안 주변을 샅샅이 뒤졌지만 제인의 시신은 수습하지 못했다.<br><br><i>제인 로메로 쇼<\/i>의 송출 및 관련 상품 판매는 그녀의 부모가 참석한 장례식 이후로 미뤄졌다.<br><br>대중은 그녀의 죽음을 애도했으며, 덕분에 J.R. 상품의 판매량이 급증한 것은 물론 한 달 뒤 제인 로메로 쇼의 모든 에피소드가 다시 방영되었으며, 여기에는 제인의 명복을 기리는 인사말이 붙게 되었다.","perks":["HeadOn","Poised","Solidarity"],"dlc":"Mali"},{"id":"Ash","ko":"애슐리 제이 윌리엄스","en":"Ashley J. Williams","d":"\"외로운 늑대\", 자만심 넘치며 자기주장이 강한, 생존을 위해 태어난 남자이다.<br><br>그의 개인 기술은 <b>슬리퍼<\/b>, <b>재정비<\/b>, <b>남자의 패기<\/b>로, 난처한 상황에 처한 친구들을 도울 수 있는 것은 물론 고통스럽거나 어려운 상황에서도 쉽게 회복할 수 있게 해주는 능력들이다.","story":"친구들과 함께 오두막집에서 주말을 보내는 동안, 애슐리 제이 윌리엄스는 네크로노미콘 엑스 모티스(망자의 책)를 발견했고 숲속에서 어둠의 무언가를 깨웠다. 악은 그의 친구들을 사로잡았고, 그는 친구들을 죽일 수밖에 없었다. 악에 물든 자신의 오른손 역시 톱으로 잘라내 버렸다. 이후 30년간, 애슐리는 낮에는 밸류 스톱 백화점에서 일하고 밤에는 허름한 술집에서 여자들을 꾀며 과거로부터 도망쳤다. 하지만 어느 날 밤 기분에 취한 그는 한 여자의 환심을 사려고 네크로노미콘의 한 구절을 읊고 말았다. 악은 다시 애슐리를 찾아냈고, 그의 주변 인물들의 삶을 망가뜨리기 시작했다. 그의 동료 중엔 무당의 집에서 자란 파블로와 데다이트로 인해 고아가 된 켈리가 있었는데 이 둘이 그의 싸움을 돕기로 했다. 악과 싸우면서 애슐리는 오랫동안 잃어버렸던 딸 브랜디와 재회했는데, 그녀는 애슐리가 인류의 구세주라는 역할을 맡을 수 있도록 격려해 주었다. 최종 형태를 갖춘 악마와의 끔찍한 결전 이후 마지막 숨을 내쉰 애슐리는 수메르 기사단에게 인도되어 미래로 전송되었다.<br><br>애슐리는 머리가 지끈거리는 와중에 한목소리를 듣고 깨어났다. 일주일 전 데다이트 일당을 물리친 이후 그는 계속해서 숙취를 겪고 있었다. 그는 노래하는 여성의 감각적이고 자신을 부르는 듯한 목소리를 다시 한번 들었다.<br><br>사각팬티 차림으로 복도로 나간 그는 목소리를 쫓아 성큼성큼 공공 라커룸까지 걸어갔다. 애슐리가 문을 열자 노랫소리가 멈췄다. 커튼을 치는 소리가 들렸다. 그는 탈의실로 들어서며 누구 없냐고 외쳤다. 그의 목소리가 곰팡이 낀 타일 벽에 부딪히며 울렸다. 계속 나아간 그는 아직 물이 뚝뚝 떨어지는 샤워기로 손을 뻗었다. 차갑고 축축한 손가락이 그의 등 살갗을 쓸어내렸다. 그는 뒤를 돌아보았다.<br><br>그곳엔 높은 창문으로 들어오는 아침 햇살을 받으며 헐벗은 여인 하나가 서 있었다. 그녀의 피부가 반짝이고 있었다. 애슐리는 곧바로 그녀를 알아보았다. 고등학생 때 잠깐 만났던 여자 린다 에머리였다. 악으로부터 고향을 지키던 이들은 30년 만에 재회한 것이었다. 애슐리는 새로 쌓은 자신의 명성을 마음껏 누리기 위해 그녀와의 관계를 얼마 지나지 않아 청산했었다.<br><br>린다는 가까이 다가온 애슐리를 향해 윙크했다. 그는 열정적으로 그녀의 뺨을 애무했다. <i>린다가 대체 왜 여기 있지? 자기 딸의 행방에 대해서 조금이라도 아는 게 있을까? 또 파블로와 켈리는 어떻게 됐지?<\/i><br><br>갑자기 날카로운 칼날이 자기 손을 파고드는 것을 느낀 애슐리는 깜짝 놀라 물러섰다. 린다는 한 손가락으로 칼끝을 쓰다듬으며 손끝에 애슐리의 피를 모았다. 미소를 짓던 그녀의 피부가 쪼그라들고 머리카락이 사라지더니, 어깨가 굽으면서 몸매가 망가지는 등 순식간에 노인으로 변해버렸다. 애슐리는 반나체 상태로 간신히 그녀의 공격을 방어했다.<br><br>린다가 칼을 휘두를 때마다 상처가 하나씩 늘었다. 그녀는 애슐리의 아픈 무릎을 공격하여 그를 넘어뜨렸다. 그녀가 위로 올라탔을 때, 애슐리는 비명을 지르며 그녀가 쥐고 있던 칼을 쳐냈다. 혈관이 두드러진 그녀의 손이 애슐리의 목을 감싸더니 조르기 시작했다. 그는 컥컥거리며 물비누 통에 손을 뻗었다. 그리고 손가락에 비누를 묻혀 그녀의 눈을 찔렀다. 린다가 움찔거리며 자세가 흐트러진 사이 애슐리는 팔꿈치로 그녀의 얼굴을 가격한 뒤 그녀를 밀쳐냈다. 그리고 데굴데굴 굴러 바닥에 떨어진 칼을 잡았다. 그 칼을 그녀의 심장에 꽂으려는 순간 그는 멈췄다. 더 좋은 생각이 떠올랐다.<br><br>그는 칼을 그녀의 목에 들이댔다. <i>나랑 거래하자, 악마야. 널 살려주는 대신 날 친구들에게 돌려보내 줘.<\/i> 악마도 동의했다.<br><br>주문을 외우기 시작한 악마는 그에게도 똑같이 따라 하라고 했지만 쉽지 않았다. 아무 일도 일어나지 않자 애슐리는 다시 악마를 위협했고, 악마는 그가 부정확하게 따라해서 그렇다고 반박했다. 둘이 수메르어로 뭐라 뭐라 떠드는 동안 뒤에 있던 샤워실에서 쉬익 하는 소리가 들렸다. 축축한 타일 바닥이 어두워지고 파이프들이 터졌다. 오물 소용돌이와 샤워 커튼, 사용한 화장지가 뒤섞여 악마를 집어삼키는 동안, 애슐리는 자기 손을 천천히 빠져나가는 락커 문을 붙잡고 있을 뿐이었다.<br><br><i>제기라아아알!<\/i><br><br>애슐리는 엔티티의 왕국에 정면으로 추락했고, 입에는 풀이 잔뜩 들어갔다. 그는 일어나서 언제 입었는지도 알 수 없는 마른 옷을 손으로 털었다. 주변을 둘러본 그는 웃음기가 싹 가셨다. 두 가지만은 확실했다. 하나는 이 주변에 바 같은 것은 눈을 씻고 찾아봐도 없다는 것이고 다른 하나는 산탄총과 전기톱이 필요하다는 사실이었다. 그가 앞에서 희미하게 반짝이는 불빛을 향해 걸어가자, 나무 사이로 비명이 울려 퍼졌다.<br><br><i>멋지군 그래.<\/i>","perks":["BuckleUp","FlipFlop","TheMettleOfMan"],"dlc":"Nepals"},{"id":"Nancy","ko":"낸시 윌러","en":"Nancy Wheeler","d":"열정적인 기자 지망생으로 정확한 조사 능력과 함께 다른 사람들이라면 놓칠 수도 있는 부분을 잘 감지한다.<br><br>그녀의 기술은 <b>함께라면 더 좋지<\/b>, <b>시선 고정<\/b>, <b>내면의 힘<\/b>이며, 이 기술들은 그녀가 예상할 수 없는 일에 도전하는데 필요한 정보와 용기를 준다.","story":"패기가 넘치며 반항적인 낸시 윌러는 좋은 기사 거리를 감지하는 본능을 지닌 완고한 조사관입니다. 현명한 기자인 그녀는 친한 친구 바바라가 실종되었을 때 모든 진실을 밝히고 정의를 지키기 위해 할 수 있는 모든 것을 했으며, 직장에서의 불평등과 차별에도 불구하고 열심히 기사를 위한 사건을 쫓았습니다. 그러던 어느 날 밤 저녁, 그녀는 한 사건을 쫓던 중 두려움 없이 호킨스 국립연구소에 접근하다 그만 의식을 잃고 말았고, 잠시 후 으스스한 안갯속에서 공기를 타고 흐르는 포효와 함께 깨어나고 맙니다.","perks":["BetterTogether","Fixated","InnerStrength"],"dlc":"Qatar"},{"id":"Steve","ko":"스티브 해링턴","en":"Steve Harrington","d":"한때 이름 좀 날렸던 양아치로서, 독특한 자기만의 유머가 그의 특징이지만 의외로 동료 생존자들을 보호하고 돕는다.<br><br>기술로 <b>베이비시터<\/b>, <b>동료애<\/b>, <b>새로운 활력<\/b>을 지니고 있다. 이 기술들은 살인마를 교란하고 고통을 견딜 수 있게 하며 다시 싸울 수 있도록 한다.","story":"이성들로부터 인기가 많으며 거만하지만 동정이 있는 스티브 해링턴은 종종 더스틴이라는 소년의 보호자 노릇을 톡톡히 하며 그가 끈적끈적한 차원 간 괴물인 데모고르곤을 발견할 수 있도록 도왔습니다. 보호자로서 책임감을 인정받은 그는 수상하고 위험한 일들에 휘말리는 호킨스의 아이들 사이에서 '베이비시터'라는 별명까지 붙었으며, 그는 용기와 함께 기지를 발휘하여 데모고르곤의 위협으로부터 친구들을 지켜냅니다. 어느 날 밤, 낸시 윌러로부터 다급한 전화를 받은 그는 그녀를 위해 곧장 호킨스 국립연구소로 향하였지만 발견한 것은 오직 그녀의 노트뿐이었습니다. 그곳에서 그가 무슨 일이 일어나고 있는 건지 깨닫기 전에 갑자기 땅이 갈라지고 검은 안개의 소용돌이가 그의 눈을 채웠으며, 잠시 후 그는 낯익은 듯한 낯익지 않은 이상한 장소에서 다시 깨어나게 됩니다.","perks":["Babysitter","Camaraderie","SecondWind"],"dlc":"Qatar"},{"id":"Yui","ko":"유이 키무라","en":"Yui Kimura","d":"성격이 확고한 비공식 레이서. 자신과 동료 생존자가 힘든 상황 속에서도 유리하게 이겨낼 수 있도록 도와준다.<br><br>개인 기술인 <b>행운<\/b>, <b>필요하다면 무엇이든<\/b>, <b>탈출<\/b>을 사용하면 자신의 핏자국을 감추거나 떨어진 판자를 다시 올리고, 속수무책으로 당하는 생존자들을 도와줄 수 있다.","story":"전통적인 교육 속에서도 유이 키무라는 자신의 고향인 히다에서 스쿠터로 레이싱을 했다. 바로 이곳에서 불가능에 가까운 일을 해내고 명성을 얻은 것이다. 유이의 아버지는 자신이 남성적인 일이라고 규정한 것은 최대한 유이와 멀어질 수 있도록 노력했다. 하지만 유이의 할머니는 유이의 할아버지가 차량과 오토바이의 엔진에 대해 기록해둔 엔지니어 매뉴얼과 메모들을 유이에게 몰래 전해주었다. 유이는 할아버지의 매뉴얼을 읽고 지식을 빠르게 습득했다. 나중에 가서는 자신의 스쿠터를 정비할 수 있었을 뿐만 아니라 엔진까지 직접 개조했기 때문에, 모터크로스 경기에서 나이가 더 많은 소년과 겨루기도 했었다. 할아버지가 남긴 ‘행운을 두건’을 자신의 팔에 두르고, 마을 소년들과 함께 레이스를 벌이기도 했다. 유이를 이길 수 없었던 소년들은 레이스를 할 때마다 그들만의 전략을 만들어 그녀를 이겨보려고 했다. 그러나 소년들 입장에서는 운이 나쁘게도, 유이를 따라잡을 사람은 없었다. 유이는 레이스를 할 때마다 소년들을 앞질렀고, 친구들 사이에서 엄청난 인기를 얻었다. 학교에 입학할 때가 되자 유이는 용기를 내서 아버지께 오토바이 레이스의 길을 걷고 싶다고 밝혔고, 결국 아버지와 언쟁을 하게 되었다. 정식 교육을 거부하는 유이를 보고 크나큰 실망감을 느낀 나머지, 아버지는 유이에게 더 이상 이 집의 구성원이 될 수 없다고 말한다. 할머니는 유이에게 따뜻한 말과 함께 그동안 모아둔 돈을 쥐여 주었고, 유이는 무거운 마음을 안은 채 나고야로 떠났다.<br><br>나고야는 유이가 예상하던 그런 곳이 아니었다. 돈벌이라고는 급이 낮은 사무 일이나 안내원 일과 같은 단조로운 일밖에 찾을 수 없었다. 결국 할머니에게서 받은 돈을 모두 털어서 레이스용 오토바이를 구매해 불법 사설 레이스에 참가하게 된다. 레이스에서 우승을 한 유이는 그동안 만져봤던 것보다 더 큰돈을 벌게 된다. 유이의 용기와 민첩한 반사 신경에 대한 소문은 삽시간에 퍼지게 되었다. 얼마 지나지 않아서 유이는 자신의 시그니처인 분홍색 슈트를 입고 활동하는 비공식적인 여성 오토바이 레이서가 된다. 자신을 따르는 팀과 함께하던 중에, 유이는 어둠 속에서 누군가의 시선을 느끼게 된다. 거주하던 아파트에서 행운의 손수건이 도둑맞은 걸 알게 되어 경찰서로 향하지만, 경찰들은 대수롭지 않게 웃어넘겨버렸다. 심지어 스토킹하고 있는 자가 어쩌면 멋진 남자일 수도 있다며, 조만간 그자와 결혼할지도 모른다고 그녀를 우롱했다.<br><br>어느 날 저녁, 집에 돌아온 유이는 몰래 자신의 물건을 뒤지는 스토커를 발견했다. 스토커는 유이를 발견하지 못한 채 계속해서 유이의 물건을 뒤졌다. 그 순간, 유이는 어떻게 해야 할지 감이 안 잡혔다. 하지만 스토커가 자신의 옷들을 기분 나쁠 정도로 뚫어져라 쳐다보자, 유이는 스토커에게 나가라고 소리를 질렀다. 그러자 칼을 든 채로 돌아선 스토커가 유이에게 달려들었다. 그녀는 무사히 스토커의 공격을 피했고, 그 덕에 스토커의 손이 벽에 부딪혀 칼을 놓치게 된다. 한치의 망설임도 없이 유이는 스토커에게 달려들었다. 둘은 바닥을 구르며 서로 필사적으로 싸운다. 유이는 시라카와에서 스쿠터로 레이스 했을 때보다 더 많은 타격을 입었지만 아드레날린이 솟구치면서 가까스로 유이는 스토커를 제압했다. 그러고는 바닥에 떨어진 칼을 주워 날이 제대로 선 칼날을 스토커의 목에 가져다 댔다.<br><br>경찰이 아파트에 도착해서 스토커를 연행했고, 유이는 외상을 치료하기 위해 급히 병원으로 이송됐다. X-ray 검사를 해보니 팔과 발 몇 군데가 부러져 있었다. 이윽고 유이의 팀원들이 하나둘씩 병원에 도착했고, 그들은 함께 돈을 모아서 병원비에 보탰다. 재활치료는 쉽지 않았지만 유이는 결코 포기하지 않았고, 팀원들의 도움 덕에 레이스를 다시 준비할 수 있게 되었다. 그 사건 이후 유이의 첫 레이스에 팀원들이 유이에게 새로운 분홍색 두건을 보여줬다. 거기에는 팀의 시그니처와 함께 행운을 비는 메시지가 써져 있었다. 유이는 레이스에서 우승하고 영향력을 펼쳐 다른 여성들을 도와주리라 결심했다. 그 결심대로 유이의 팀은 사쿠라 7 갱이란 이름으로 불리게 되었는데, 팀원 모두 학대범과 스토커로부터 피해를 입은 여성들을 도와주겠다는 의미로 분홍색 두건을 두르고 있었다.<br><br>사쿠라 7이 성장하면서 팀원 수도 7명을 넘었고, 유이의 시그니처인 분홍색은 여성의 권리 신장을 상징하게 되었다. 유이를 지지하는 의미로 여성들은 사설 레이스의 입장권을 줄 서서 구매하기도 했다. 이후 7개의 레이스를 연속으로 우승한 유이에게 어느 스폰서가 관심을 가지고 연락을 취했고 그 덕에 유이는 전국 모토 챔피언십에 참가 자격을 땄을 뿐만 아니라 우승까지 거머쥔 최연소 여성 참가자가 되었다. 곧이어 유이의 후원은 세 배 이상 증가했고, 유이의 팀 역시 마찬가지였다. 하지만 이 모든 건 불법으로 진행된 TK3 (도쿄 킥 3000) 사설 레이스에서 충격적인 결말을 맞이한다. 레이스에서 선두로 달리던 유이는 갑자기 나타난 기묘한 안갯속으로 들어가게 된다. 당황스러움에 유이는 오토바이를 멈춰 서서 주변을 살펴봤다. 얼마 지나지 않아, 유이는 자신이 있는 곳이 도쿄가 아니라는 것을 깨닫게 된다.","perks":["AnyMeansNecessary","Breakout","LuckyBreak"],"dlc":"Sweden"},{"id":"Zarina","ko":"자리나 카시르","en":"Zarina Kassir","d":"세상 물정에 밝고 용기 있는 다큐멘터리 제작자로 살인마의 탐지를 피하고 다른 생존자들을 훌륭하게 도와준다.<br><br>그녀의 개인 기술인 <b>비공개 조건<\/b>, <b>오보<\/b> 그리고 <b>국민을 위하여<\/b>는 그녀가 위험이 닥쳤을 때 그녀의 자취를 드러내지 않고 방해를 일으키고 그녀의 안전을 포기하면서 다른 이들을 빠르게 치료한다.","story":"브루클린의 레바논인 가정에서 태어난 자리나는 두 문화적 정체성의 충돌 속에서 성장했다. 그녀는 그 문화적 차이가 자신을 괴롭힘의 대상으로 만드는 것이라고 생각했고, 놀림과 괴롭힘을 피하기 위해 인기 있는 아이들이 좋아하는 것과 이미지를 관찰하고 그 이미지를 자신에게 투영하는 법을 익혀나갔다. 그녀는 학교에 가서 '카리나'라는 가명을 쓰며 머리를 더 밝게 염색하고 '외국인'이라는 딱지를 떼려고 노력했다.<br><br>집에서는 언제나 TV의 뉴스 채널이 틀어져 있었다. 불의에 대한 긴급 속보는 자리나를 고무시켰고, 자신만의 이야기를 만들 수 있도록 영감을 받았다. 시간이 지나 청소년이 되었을 때, 그녀는 자신의 진짜 이름과 뿌리를 받아들이고 아버지의 디지털카메라를 빌려 베이 릿지에 있는 자신의 커뮤니티 멤버에 대한 인터뷰를 진행했다. 그녀는 자신의 콘텐츠를 온라인에 게시하며 점점 팔로워를 늘려나갔다. 매주 새로운 화제를 다루고 사람들이 카메라를 통해 자신의 생각을 말할 수 있게끔 하였다.<br><br>패스트푸드 식당 주인이 노동자를 착취한다는 소식을 들었을 때, 그녀는 몰래 잠입하여 직설적인 내용이 담긴 영화를 제작하기로 결심하였다. 그녀는 변장을 하고 억양을 고쳐 레스토랑의 웨이트리스로 잠입했다. 3주의 무급 근무 후 급여를 요구하자 그녀는 해고를 당하고 말았다. 보복을 위해 그녀는 식당 주인의 욕설이 담긴 영상을 게시했고, 몇 시간이 지나지 않은 채 뉴스는 그녀의 이야기에 집중하게 되었다. 하지만 어쩐지 식당 주인에게도 불쌍한 마음이 들었다.<br><br>이러한 경험을 통해 자리나는 독립 프로듀서 및 영화 제작자가 될 수 있었다. 그녀의 수상을 위한 첫 영화는 학교의 영어 수업에서 논란이 된 살인 혐의로 처형된 두 명의 이탈리아인 이민자 사코와 반제티의 이야기를 담은 시에서 영감을 받은 영화였다. 그녀는 이 영화로 수상을 했고 타협하지 않는 다큐멘터리 영화 제작자로 알려지게 되었다.<br><br>몇 달 후, 어떤 공개 감시 카메라 영상으로 그녀의 삶은 송두리째 바뀌게 되었다. 그 영상에는 집으로부터 두 블록 떨어진 거리에서 자신의 아버지가 커피 두 잔을 들고 가는데 뒤에 서 있던 두 명의 큰 후드 차림 남자들이 아버지에게 무언가 소리쳤고, 그가 놀라 쳐다보니 갑자기 그중 한 남자가 아버지를 달려오는 차에 밀어버리는 장면이 담겨있었다.<br><br>아버지의 죽음은 평화로웠던 자리나에게 분노와 고통의 충격을 남겼다.<br><br>가해자인 클라크 스티븐슨은 곧 체포되어 살인 혐의로 수감되었다.<br><br>자리나는 클라크가 형량과 반성의 시간을 너무 짧다고 생각했고, 그가 속한 갱단이었던 'IR-28'에 집착하기 시작하였다. 1년의 시간이 지났을까, 그녀는 클라크의 중죄함을 더 입증할 수 있을만큼 그에 대해 충분히 조사하였다. 그녀는 클라크를 인터뷰하기 위해 마지막 유산으로 새로운 카메라와 네브라스카행 비행기 티켓을 구입했고 헬셔 교도소의 소장에게 뇌물을 줬다.<br><br>그녀는 첫 만남을 촬영했고 그녀의 아버지와 갱단과 폭력 성향에 대해 물었지만, 클라크는 인터뷰를 거부했다. 몇 주 뒤, 그녀는 자신이 알아낸 사실을 이용해 그를 압박하였고, 결국 사건은 계획된 범죄였다는 것을 알아내었다.<br><br>자리나의 영화는 아버지의 죽음과 갱단이 남긴 피의 흔적을 증명하였고, 마침내 영화의 국제적인 명성 덕분에 뉴스가 이 이야기를 다루게 되었다.<br><br>일부 수감자들은 그녀의 다큐멘터리에 대한 얘기를 들었을 때 그녀에게 연락을 하기도했다. 그들의 대부분은 영화화하지 않을까하는 기대감에 수많은 기이한 이야기들을 그녀에게 풀어놓았지만, 그중 단 하나의 이야기만이 그녀의 흥미를 사로잡았다. 바로 '정신 나간 아일랜드인의 대학살' 때문에 헬셔 교도소의 한 구역이 완전히 봉쇄됐다는 이야기였다. 공식적인 이야기는 아일랜드인 무법자가 교도소장과 그의 경비들을 무참하게 살해했다는 것이였다.<br><br>자리나는 사코와 반제티 영화 작업을 통해 '공식적인' 이야기가 항상 '진실한' 이야기는 아니라는 것을 배웠다. 그녀가 헬셔의 기록을 조사한 결과, 1860년 죄수에게 수년의 형이 선고되었다는 사실을 발견했다. 교도소의 설계도에 따르면 봉쇄된 구역은 원래 헬셔의 기초시설의 일부였고, 그녀는 봉쇄된 구역을 찾을 수 있다면 정신 나간 아일랜드인의 이야기도 밝힐 수 있다고 생각했다. 다만 어떻게 그곳으로 들어갈 수 있을까였다.<br><br>다음 날 아침, 그녀는 헬셔 교도소 산책 투어에 참가했다. 시차로 인해 피로를 겪는 관광객들 속에 묻혀 있다가 그들이 부엌으로 향할 때 갑자기 방향을 틀었다. 설계도를 모두 외운 그녀는 어디로 가야 할지 알뿐만 아니라 감시 카메라에 걸리지 않는 방법도 알고 있었다. 하지만 예상치 못했던 치밀한 보안 때문에 많은 것을 알아낼 수 없었지만, 그녀는 낡은 죄수의 침대 밑에 몸을 숨길 수 있었다. 경비원들이 사라졌을 때 그녀는 계속해서 감옥을 탐색했고 마침내 아일랜드인의 감방을 발견했다.<br><br>자리나는 어둡고 낡은 감옥에 들어가 오래된 벽돌 벽을 어루만졌다. 그녀는 손가락 끝으로 느껴지는 흔적을 따라 읽기 시작했고, \"베이쇼어에게 죽음을\"이라는 문장을 유추해냈다. 느슨했던 벽돌이 갑자기 떨어져 공간이 생겼다.<br><br>그녀가 공간에 손을 넣자, 부서진 차가운 금속 같은 것이 느껴졌다. 그녀는 손에 닿는 금속을 꺼내 보았다... 오래된 녹슨 렌치였다. 갑자기 등골이 서늘해지고 오한이 들었다. 그녀의 발밑에는 사지가 뒤틀린 한 남자가 피를 흘리며 쓰러져 있었고, 그의 눈은 어둡고 끔찍했다. 그녀 아버지의 눈동자와 비슷했다. 검은 바닥에는 진분홍색의 피가 흥건했다. 감옥은 검은 안개로 가득 찼고, 그녀는 악몽 같은 이 상황을 떨쳐내기 위해 질끈 눈을 감았다.","perks":["ForThePeople","OffTheRecord","RedHerring"],"dlc":"Ukraine"},{"id":"S22","ko":"쉐릴 메이슨","en":"Cheryl Mason","d":"쉐릴 메이슨은 테러에 참여한 자신과 그녀의 팀 모두를 대담하게 만드는 용사다.<br><br>그녀의 개인 기술인 <b>소울 가드<\/b>, <b>피의 협정<\/b>, 그리고 <b>억압된 동맹<\/b>으로 그녀는 엄청난 고난을 이겨내고, 팀원들과 계속 연락을 취하며 목표를 계획할 수 있다.","story":"자상하지만 충동적인 그녀. 이전에는 헤더로 알려져 있던 쉐릴 메이슨은 양아버지 해리 메이슨의 비극적인 죽음 이후 그녀의 삶을 다시 살아가려고 시도한다. 하지만 그녀는 태어나면서부터 자신을 쫓던 사이비로부터 해방되었지만, 아버지의 죽음에 대한 죄책감에 사로잡혀 있었고 어둠은 매일 밤 가증스러운 악몽으로 가장하여 그녀를 벌했다. 그녀는 양심의 가책을 덜기 위해 문제아들을 위한 위기 개입 센터에서 자원봉사를 했다. 3개월 후, 그녀는 훈련을 받았고 감독 없이 상담을 할 수 있을 정도로 능력을 키웠다. 그러나 그녀의 첫 전화를 받을 마음의 준비가 아직 되지 않았다. 그녀가 들은 것은 정적뿐이었다. 검은 연기가 땅에서 솟아오르자 공기가 탁해졌고 갑자기 그녀의 귀에 익숙한 여자 목소리가 들렸다. 다시는 소식을 들을 수 없을 거라고 생각했던 어떤 사람이었다. <i>왜 이 부패한 세상에 매달리고 있나요? 오직 하느님만이 우리를 구원할 수 있다는 것을 알고 있잖아요.<\/i> 그녀일 리가 없었다. 클로디아는 죽었다. 갑자기 세상이 빙빙 돌더니 그녀는 매스꺼운 듯 무릎을 꿇었다. 뜨거운 담즙이 역류하며 그녀는 따뜻한 피를 바닥에 토해냈다. 그녀는 안정을 찾은 듯 고개를 들어 주변을 살폈다. 그녀는 그녀가 모르는 세상에 와있었다. 춥고 절망적인 곳이었다.","perks":["BloodPact","RepressedAlliance","SoulGuard"],"dlc":"Wales"},{"id":"S23","ko":"펠릭스 릭터","en":"Felix Richter","d":"선견지명이 있는 건축가로서, 계획을 세우고 다른 생존자들을 도울 수 있다.<br><br>그의 개인 기술, <b>선견지명<\/b>, <b>필사의 조치<\/b> 및 <b>견고함<\/b>으로 발전기를 탐지하고 생존자를 구하며 그의 도구를 최대한 활용할 수 있게 도와준다.","story":"펠릭스 릭터는 독일 코부르크의 야노스와 우르술라 릭터 사이에서 태어났다. 릭터 가문은 그 동네 유지로서 의사들 사이에서 가장 존경받는 인물 중 하나였다. 고대 사회의 구성원인 그의 부모는 항상 릭터 저택을 떠나 의학 회의나 인도주의적 원조에 참여하기 위해 전 세계를 떠돌아다녔다. 그의 부모는 세계를 돌아다니며 어린 펠릭스에게 태어나서 처음 접하는 새로운 문화, 언어 그리고 건축물들을 보여줬다. 언제 건축에 관심이 생겼는지는 알 수 없지만, 꽤 큰 관심사가 되었고 가문의 레가시에도 불구하고 펠릭스는 언젠가 세계를 고취시킬 건축물을 설계하고 싶었다. 23살이 되던 해, 스위스 건축 메달 및 독일 국립 디자인상을 받으며 건축학의 신동으로 불렸다. 이러한 성공에도 불구하고 그는 찜찜한 기분을 털어낼 수 없었다. 실력과 노력이 아닌 그저 행운과 가문의 힘으로 얻은 성공 같았다.<br><br>펠릭스는 자라면서 사회적으로 미숙하고 내성적인 성격으로 자랐다. 상상 속 친구들과 어울려 지내는 것을 더 선호했다. 친구가 몇 명 없었던 그는 부모님과 여행을 떠나지 않을 때면, 아버지의 서재에 틀어박혀 희귀한 책을 읽었고 역사와 건축에 대해 공부했다. 마치, 수 세기에 걸친 건축적 동향에 대한 모든 것을 빨아들이고 싶은 듯이. 반면 펠릭스의 아버지는 그의 어린 아들이 좀 더 외향적으로 자라길 바라는 마음으로 그의 사회적 스킬을 키워줄 전문가란 전문가는 모두 고용하였다. 이런 노력이 모두 실패했을 때쯤, 아버지는 자신의 아들이 준비가 되었을 때 스스로 배울 것이라는 믿음을 가졌다. 그 후, 아버지는 아들과 함께 서재에 앉아 아들에게 그의 비밀 모임과 어둡고 불길한 힘에 맞서 싸운 고대 전투에 대해 터무니없는 이야기를 들려주며 아들의 정교한 나무 건물 모형 제작을 도왔다. 펠릭스는 아버지의 이야기가 그저 그의 ‘임페리아티’ 모임을 좀 더 멋지게 보이게 하기 위해 지어낸 것이라고 생각했다.<br><br>펠릭스는 가끔 자신의 디자인 감성이 여름휴가로 다녀온 다이어 섬에서 나오는 게 아닌가 생각했다. 다이어 섬은 전 세계 최고의 집들이 모인 개인 섬이었다. 매년 여름, 펠릭스는 그의 부모님과 함께 그 섬으로 휴가를 즐기러 갔다. 임페리아티의 멤버 또한 자녀들을 데려와 서로 교류하고 평생의 인맥을 쌓을 수 있도록 하였다. 펠릭스는 다른 10대들과 잘 어울리지 못했지만, 소위 ‘주류’가 아니라고 생각하는 비사교적인 네 명의 친구들을 사귀었다. 그들의 다른 10대들로부터 일명 ‘부랑자들’이라고 불리며 조롱을 당하기도 했다. 하지만 그 다섯 명의 친구들은 은근히 그 이름을 좋아하며 기분 좋게 받아들였다. 대중 연설을 연습하거나 끝없는 토론에 참여하기보다는 부랑자들은 섬의 폐허와 미스터리를 탐험했다. 모험 중 하나가 악화되기 전까지 말이다.<br><br>버려진 수용소를 탐험하던 그들은 지하 실험실처럼 보이는 곳으로 내려갔다. 그곳에는 그들은 영국 동인도 회사가 제1차 아편 전쟁의 포로들을 대상으로 한 비인간적인 실험을 그린 삽화와 기록이 있는 낡은 가죽 일기장을 발견했다. 잠긴 문을 밀고 들어가자, 그들은 사람의 해골과 알 수 없는 세럼이 담긴 먼지투성이의 병이 가득한 공간이 보였다. 병에 든 내용물을 실험하기도 전에 그들은 땅이 살짝 흔들리는 것을 느꼈고 쉬익 하는 소리에 귀를 기울였다. 불안한 상상이 현실과 어우러져 공포를 느끼자 갑자기 이상한 안개가 나타났고 거대한 발톱이 땅에서 솟아오를 듯했다. 무슨 일이 벌어지는지 알아채기 전, 다행히도 펠릭스의 아버지와 몇몇 아이들의 부모들이 아이들을 구하기 위해 이상한 도구와 물체를 가지고 나타났다. 펠릭스가 현실을 자각하기도 전에 모든 것이 끝나버렸다. 부랑자들은 안전했지만 부모들은 흔적도 없이 사라져 버렸다.<br><br>그의 아버지의 실종에 충격을 입은 펠릭스는 섬에서 겪은 초자연적 현상을 이해하려고 갖은 종류의 이론을 살펴봤다. 그는 부랑자들을 비롯하여 그와 비슷한 방법으로 사랑하는 사람을 잃은 사람들과 온라인을 통해 편지를 주고받았다. 이 비극으로 부랑자들의 관계는 더욱 돈독해졌고, 수년간 부모에게 벌어진 기묘한 일을 밝혀내기 위해 함께 노력했다. 하지만 전혀 말이 되지 않았다. 그들이 찾은 모든 실마리는 그들을 언제나 막다른 골목에 다다르게 만들었다. 시간이 흐르면서 그들의 노력은 줄어들었고, 다섯 명의 친구들이 각자의 길을 갔고, 그저 부모를 빼앗아간 이름 없는 어둠을 잊혀지길 바랄 뿐이었다.<br><br>비록 펠릭스는 다른 사람들 밑에서 일하는 것에는 재능을 보이지 못했지만, 수년의 시간이 지나 그는 우수한 건축가로 인정받았다. 그리고 그는 자신의 아버지가 옳았음을 깨달았다. 부족한 사회성이 그를 방해하고 있는 것을 말이다. 아버지에 대한 헌신과 목적을 가지고 발음과 예의를 개선한 펠릭스는 네트워크를 형성하는 방법, 음, 그의 표현을 빌리자면 ‘연기하는 법’을 배워나갔다. 그는 자신을 더 호감 있게 만들고 잠재 고객들에게 인기를 끌기 위해 완벽한 파사드를 만들었다. 다양한 건축 회사에 근무한 경험으로 펠릭스는 동료, 로렌 골더와 함께 회사를 차렸다. 비슷한 비전을 공유하며 정형적인 현대식 건물들에 대해 철학적으로 반대하는 것도 닮아있던 두 사람은 때때로 특이한 재료와 모양, 그리고 구성을 실험하기도 했다.<br><br>펠릭스는 건축계를 떠들썩하게 만든 신랄하고 비전통적인 기기에 찬성하며 꾸준히 인습적인 기대를 무너뜨렸다. 그러나 온갖 찬사를 받으면서도 그는 자신이 사기꾼이라는 느낌을 떨칠 수 없었다. 흠잡을 데 없는 디자인으로 세상에 영감을 주는 참된 건축가를… 연기하는 배우. 그는 불안감과 자기 회의를 느낄 때마다 아버지의 가혹한 충고와 현명함을 바라며 끊임없는 파티와 술 속에 빠져 그의 마음속 불안감을 감췄다.<br><br>마침내 펠릭스의 여자친구가 그에게 임신 소식을 알렸다. 그 소식을 들은 펠릭스의 마음이 흥분되기 시작했다. 아버지로서 자신의 아버지가 그러하였듯 아이에게 영감을 주는 아버지가 되고 싶었던 펠릭스는 다시 활력을 띄었다. 그에게 지금 필요한 것은 도전 의식을 북돋우는 프로젝트와 건축가로서의 재능을 뽐낼 시멘트였다. 운명이 그러하듯, 펠릭스의 회사, ‘릭터 & 골더’는 아버지의 친구로부터 건축 의뢰를 받게 되었다. 아버지의 친구는 다이어 섬에 새롭고 독특한 무언가를 짓고 싶다고 했다. 육아에 대한 기사와 책으로 걱정에 빠진 펠릭스에겐 흥미로운 도전이었지만, 동시에 더욱 두려움에 떨게 하였다.<br><br>6개월이 지나지 않아 다이어 복원 프로젝트가 진행되었다. 펠릭스가 프로젝트 진행을 위해 섬을 조사하는 도중, 오랫동안 감춰졌던, 잊혀졌던 산산조각 나버린 빅토리아 빌딩과 무너져버린 폐허 뒤로 익숙한 목소리가 들렸다. 펠릭스는 기묘하게 몰려온 안개 속에서 어떠한 형태가 천천히 형성되는 것을 목격했다. 그의 눈과 입이 벌어졌지만 아무 소리도 낼 수 없었다. ‘이런 일이 가능한 거야? ’설마? 가능한 일인가? 아니야… 그럴 리가 없어… 그건… 불가능한 일이야… 하지만…’<br><br>펠릭스는 아버지가 안개 속에서 걸어 나오자, 비틀거리며 뒷걸음질 쳤다. 다리에 힘이 풀리고 그의 심장은 두근거리는 소리가 귀에 들릴 정도로 요동쳤다. 아버지였다. 정말로 아버지였다. 뱃속에 있는 아이에게도 할아버지에 대해 알려줄 수 있게 되었고 아버지가 사라진 후로 자신이 얼마만큼 성장했는지, 이뤄냈는지 보여줄 수 있게 되었다. 펠릭스와 아버지는 오랫동안 서로를 바라보았다. 잠시 후, 아버지는 아들에게 실망스러운 표정을 보이며 뒤돌아섰고, 그렇게 길을 계속 걸어갔다. 펠릭스는 두근거리는 심장을 부여잡고 아버지를 쫓아갔다. 그 후, 펠릭스를 본 사람은 아무도 없었다.","perks":["BuiltToLast","DesperateMeasures","Visionary"],"dlc":"Yemen"},{"id":"S24","ko":"엘로디 라코토","en":"Élodie Rakoto","d":"오컬트 조사관으로 교활한 속임수과 완고한 결심으로 자신의 생존을 유지할 수 있다.<br><br>그녀의 개인 기술인, <b>판별<\/b>, <b>속임수<\/b>, 그리고 <b>힘찬 발버둥<\/b>으로 창의적이게 사물과 상호작용할 수 있는 동시에 살인마로부터 탈출하기 위한 대책 계획을 세울 수 있다.","story":"부유한 파리 가정에서 태어난 엘로디 라코토는 부모님이 태어난 마다가스카르의 푸른 섬에서 몇 마일 떨어진 편안한 집에서 유년기를 보냈다. 그녀의 가방은 항상 무거웠다. 하지만 학교 공부 때문이 아니었다. 그녀의 가방에는 기본적으로 역사책 몇 권과 인쇄된 지도 몇 장, 그리고 작은 삽이 있었다. 그녀는 반복되는 학교의 역사 공부보다 도시를 탐험하며 조각상, 이웃, 그리고 길가의 낙서에 숨겨진 이야기를 찾아내는 것을 더 좋아했다. 그녀는 파리의 조각들을 모아 컬렉션을 만들기도 했다.<br><br>엘로디가 14살이 되던 해, 그녀의 부모님은 ‘출장’으로 인해 가족 모두가 다이어 섬으로 갔다. 하지만 실망스럽게도 그 섬은 ‘임페리아티’라는 모임의 회원들을 위한 개인 사유지였고 그 모임의 회원이었던 그녀의 부모님 덕분에 엘로디는 매일 가식적이고 어색한 사교 모임에 참여해야 했다. 섬에서의 몇 주가 지나고 그녀는 ‘부랑자들’을 만났다. 그들은 부모님들의 정치적 체스판에 관심이 전혀 없는 10대들이었다. 지루하고 비 오는 밤, 그녀는 그들에게 부모님들의 감시 없이 몰래 외출해 섬을 탐험하자고 설득하고 했다.<br><br>어느 안개 낀 저녁, 그들은 버려진 수용소를 우연히 발견한다. 부랑자들의 멤버 중 하나인 펠릭스는 사실 들어가고 싶지 않았다. 하지만 고집스러운 엘로디에 의해 수용소 안으로 들어갔다. 그곳에서 그들은 폐허가 된 기이한 지하실을 발견한다. 부랑자들은 흥분을 감추지 못하며 낯선 장치를 지나 전리품과 기념품을 찾아 헤맸다. 하지만 엘로디는 맨 왼쪽 벽 구석에 무언가 이상한 것이 있다는 것을 알게 되었고 그것은 원 모양의 기이한 긁힘이었다. 그녀는 손가락을 따라 차가운 콘크리트 벽을 느꼈다. 벽에 남겨진 표시는 깊고 좁았다. 그때, 따뜻한 속삭임이 그녀의 마음을 방황하게 만들었다.<br><br>깊은 속에서 우르릉거리는 천둥소리. 까맣고 반짝이는 파도. 회색빛깔 모래 덮인 해변. 불안전함. 그녀는 무언가에 이끌려 얼음처럼 차가운 모래에 원을 그리고 그 가운데 선을 그었다.<br><br>날카로운 천둥소리와 번개가 하늘을 휘저었다. 매끈한 흑요석이 콘크리트 바닥을 찢으며 대지로 솟아오르자 땅이 흔들렸다. 건물은 무너지기 시작했다. 엘로디의 아버지는 그녀에게 죽음 힘을 다해 뛰라고 소리쳤고 어머니는 기괴한 악기를 휘두르고 있었다. 그런 다음 그들은 찾아온 것은...<br><br>완전한 암흑...<br><br>그리고 엘로디는 그녀의 부모를 다시 볼 수 없었다.<br><br>그 후 몇 년 동안, 이 악몽은 그녀를 한밤중에 깨우고, 땀을 흘리고, 나뭇잎처럼 떨게 만들었다. 그녀는 어린 시절에 야간 공포증을 앓았는데 종종 잠자리에 드는 것을 거부했다. 그런 그녀를 달래기 위해 그녀의 할머니는 티 캔들에 불을 붙이고 양초의 심지가 녹아내린 밀랍에 의해 꺼질 때까지 그녀에게 이야기를 들려주었다. 따뜻한 바닐라 향의 양초는 엘로디가 두려움과 적을 물리치는 전설적인 영웅들의 이야기를 상상하며 잠들 수 있게 했다. 엘로디는 이제 할머니의 이야기를 기억하진 못하지만, 그녀가 말해준 푸른 마다가스카르의 열대우림과 거대한 산들에 대한 그리움이 그대로 남아있었다. 엘로디가 슬픔으로 춥고 멍해졌을 때, 그녀는 바닐라 향의 양초를 켜, 멀고도 소박한 장소에 대한 어릴 적 기억을 소환하며, 지독한 우울증을 극복하기 위해 기운을 북돋우곤 했다.<br><br>14년이 지난 후에도, 엘로디는 여전히 퍼즐의 잃어버린 조각들을 찾으러 다녔다. 어떠한 이성적인 설명도 부모님의 실종을 설명할 수 없었기 때문이었다. 그래서 그녀는 다른 곳을 찾아 헤맸다. 그녀는 한밤중 흔적도 없이 사람들의 자취를 없애는 암흑의 힘에 대해 언급한 모든 전설들을 조사했다. 그곳에서 그녀는 옛날이야기들을 번역했고 부모님이 다이어 섬에서 사라진, 그 이상한 방식을 입증하는 세계의 이야기들을 태피스트리로 만들었다. 그리고 그곳에서 그녀는 이해할 수도, 설명할 수도 없는 ‘그것’, 자신의 부모님을 데려간 무언가를 파괴하거나 재건하려고 했던 고대 문명에 의해 만들어진 유물을 모았다. 유물에는 다양한 이름이 있었다. 각각의 언어마다 그것을 부르는 방식이 달랐다. 심연, 무한, 구멍.<br><br>이러한 그녀의 발견은 그녀를 오컬티즘의 암흑 분야로 더 밀어 넣었다. 부랑자들은 오래전에 사건을 포기했다. 하지만 사실 그녀는 자신의 이론으로 그들을 소외시켰다. 하지만 부모님은 포기할 수 없었다.<br><br>춥고 안개 낀 저녁, 엘로디는 어디론가 향했다. 모퉁이를 돌아 파리 13구를 떠났다. 그곳은 중세 시대에 지어진 도서관이 있던 곳이었다. 그녀는 희귀한 유물을 보관하는 오컬트 전문가인 하즈라 샤를 위해 해야 할 일이 있었다.<br><br>그는 그녀가 다이어 섬에서 발견한 발톱 같은 도둑맞은 희귀한 가늘고 긴 송곳니의 마오리 조각상을 구해낸 후에 그녀를 채용하려 했다. 그 후 5년간, 엘로디는 수집가를 위한 신비한 유물을 조달했다. 그 대가로 그는 그녀에게 돈과 장비, 그리고 세상에 알려지지 않은 필사본에 대한 꽤 정확한 정보를 제공했다.<br><br>수집가의 요청대로, 그녀는 17세기, 샴쌍둥이를 출산한 산모를 유죄로 판결한 마녀재판의 기록을 손에 넣었다. 전설에 따르면 불가사의한 주문이 이 쌍둥이 두개골에 새겨졌다고 했다. 이 두개골은 모두 수집가에게 있었지만, 그 마녀의 두개골은 아직 발견되지 않았다. 행적을 알 수 없었다. 하지만 엘로디는 그때 당시에 쓰인 신문 기사를 찾는 데 성공했다. 기사에는 그러한 판결을 받은 자들의 유해는 지하 묘지로 옮겨진다고 적혀있었다. 대유행을 피하기 위해서였다. 엘로디는 자신의 예감을 따라 행동했다. 잃어버린 두개골을 찾기 위해 지하 묘지에 침입하는 행동은 확실히 위험을 수반하지만 지금까지 수집가를 위해 한 것보다 위험하지 않았다.<br><br>손전등을 쥔 그녀는 고대 지하 묘지의 벽을 따라 걸었다. 그리곤 무너진 벽을 발견했다. 큰 바위 몇 개가 길을 막고 있었다. 그녀는 휴대용 X-ray 분석기를 들고 벽의 재료를 스캔했다. 수집가를 위해 일한 특전이었다. 잘 섞이지 않은 벽돌 회반죽과 모래의 흔적들이 보였다. 이곳 전체가 무너지기 쉬웠고 축축한 저녁 공기로 인해 땅은 축축하게 젖어 있었다. 그리고 그녀는 그곳을 향해 발을 내디뎠다.<br><br>길고 위험한 지하로의 여정이었다. 공기는 무거웠고 곰팡이가 슬어있었다. 그녀는 열쇠고리가 달린 손전등이 끝없이 쌓인 새하얀 두개골의 벽에 다다르자, 숨을 헐떡이기 시작했다.<br><br>무언가 금이 가는 소리가 들렸다. 그녀는 빙글빙글 돌다가 야구방망이와 정면충돌했다. 그녀의 머리에서 깨지는 듯한 고통이 느껴졌고, 암흑이 그녀의 시야를 가득 채웠다.<br><br>그녀가 정신을 차렸을 때쯤, 그녀는 한 남자의 어깨에 둘러 업혀있었다. 그들은 지하 묘지의 더 깊은 곳에 들어와 있었고, 그 남자는 검은 망토를 입고 있었다.<br><br>검은 베일.<br><br>그녀는 유물을 탐험하는 동안 그들을 간신히 피해 다녔다. 무자비하고 치명적인 그들은 다양한 이름으로 불렸다. 엘로디가 알아낸 정보에 의하면 그들은 궁극적으로 같은 그룹에서 움직인다는 것이었다. 소위 '악마'라 불리는 존재를 위해 인간을 희생하다는 소문의 오컬트 광신자들이었다. 엘로디는 당장 이곳을 빠져나가야 한다.<br><br>엘로디는 벽에 매달려 있던 두개골을 집어 남자의 머리를 강타했다. 남자는 충격에 균형을 잃고 비틀거렸다. 그녀는 그 틈을 타 도망을 쳤다. 하지만 그녀가 모퉁이를 돌 때쯤, 갑자기 그녀의 옆구리에서 찌르는듯한 통증이 느껴졌다.<br><br>아래로 향한 그녀의 시선 끝에는 옆구리에 박힌 큰 칼이 있었다. 놀란 그녀는 칼을 뺐고 따뜻한 피가 뿜어져 나왔다.<br><br>자신의 심장박동 소리가 귓가에 들렸고 시야는 흐릿해졌다.<br><br>그녀는 무릎을 꿇었고 모든 힘을 끌어모았다. 빨간 피가 묻은 손가락으로 원을 그리고 그 가운데 선을 하나 그었다.<br><br>이해하기 힘든 무거움이 그녀의 어깨 위에 내려앉았다. 익숙한 바닐라 향이 나는 과일과 리치가 느껴졌다. 가는 열대성 빗물이 잎이 무성한 덩굴 위로 부슬부슬 내렸다. 따뜻했다.<br><br>마다가스카르.<br><br>우거진 나뭇잎에서 유령 같은 울음소리가 터져 나왔다.<br><br>엘로디가 고개를 들자 덩굴은 뱀으로 변했고 부드러운 캐노피 토양은 갑자기 잿빛으로 변했다. 그녀의 발밑은 무너져 내려버렸다. 그녀는 유사 같은 빽빽하고 차가운 무언가로 가라앉고 있었다. 그녀는 비명을 질렀다. 심연... 무한... 구멍...이 그녀를 모두 집어삼킬 때까지...<br><br>그녀는 그녀가 찾는 것을 찾게 되었다.","perks":["S24P01","S24P02","S24P03"],"dlc":"Aurora"},{"id":"S25","ko":"이윤진","en":"Lee Yun-jin","d":"격동의 시간을 살아오는 동안 이기적인 음악 프로듀서, 이윤진은 목표를 좀 더 앞당긴다.<br><br>그녀의 개인 기술인, <b>고속 승진<\/b>, <b>대 히트<\/b> 및 <b>자기 보호<\/b>로 다른 생존자가 다쳤을 때 자신의 능력을 향상시켜 빠르게 추격을 피할 수 있다.","story":"굴하지 않는 성격과 야심을 가진 윤진은 수년간의 노력과 자기희생 끝에 음악계에서 성공을 거두는 고난의 삶을 타고났다.<br><br>어린 시절 윤진은 악기들이 내는 소리에 매료되어 드럼 소리를 흉내 내고 피아노 건반을 쳤다. 하지만 그녀가 열 살이 되던 해, 그녀는 악기를 쥔 손을 놓아야만 했다. 그녀의 가족에게 빚이 많았고 그 빚은 제때 갚지 못했다. 채권자들은 집을 포함하여 그들이 소유한 모든 것들을 가져갔다. 윤진은 네 살짜리 여동생을 끌어안고 울었다. 그 후, 윤진의 가족들은 창문도 없는 방 두 칸짜리 반지하로 이사했다. 부모님은 부채를 갚기 위해 밤낮으로 일했고 그 덕분에 윤진의 어린 동생을 하루 종일 돌봐야 했다. 매일 밤 그녀는 두 사람이 잠들 때까지 노래를 불렀다.<br><br>열일곱 살이 되던 해, 유명한 음반사인 Mightee One 엔터테인먼트가 오디션을 위해 그녀의 고등학교를 방문했다. 비록 그녀는 아이돌 연습생으로 발탁되진 못했지만 스튜디오의 무급 인턴십을 따냈다. 그 후 몇 년 동안 그녀는 어떠한 인정이나 관심도 받지 못한 채 스튜디오 최고의 히트곡의 일부를 만들어냈다. 돈을 벌기 위해 그녀는 화려한 옷을 입었고 자신의 아티스트 이름인 ‘매그넘 오푸스’를 반복되는 사운드 바이트로 자신의 노래에 삽입했다. 팬들은 그녀를 알아보기 시작했고 그녀는 그녀의 특별한 손길이 필요한 형편없는 실력의 보이 밴드인 NO SPIN의 프로듀서가 되었다.<br><br>NO SPIN 홍보가 마음에 들지 않았던 윤진은 그녀가 맡은 보이 밴드를 돋보이게 만들 무언가를 찾고 있었다. 그리고 그녀는 회사와 계약되어 있던 오디션을 통해 학지운의 신랄하고 날 것의 소리를 발견하게 되었다. 윤진은 지운을 NO SPIN의 새 멤버로 소개하고 밴드를 다시 데뷔시켰다. 데뷔 후 몇 시간이 지나지 않아 그들은 이미 유명해져있었다.<br><br>밴드의 성공은 윤진을 책략에 능한 프로듀서라는 명성을 더욱 확고하게 만들었다. 호화로운 행사에 참석하기 위해 화려한 패션으로 치장한 윤진의 가혹하고 피폐했던 어린 시절은 더 이상 그녀의 것이 아닌 듯 보였다. 그녀는 펜트하우스로 거처를 옮기고 서울의 멋진 경치를 볼 수 있는 스카이라인 레스토랑에서 사교계 인사들과 저녁식사를 했다.<br><br>첫 번째 앨범은 신기록을 달성하며 성공을 거두었고 NO SPIN의 두 번째 앨범에 대한 기대를 한껏 높여놓았다. 하지만 새로운 트랙을 녹음하던 중 갑자기 화재 알림이 울렸다. 위험을 감지한 윤진을 재빠르게 건물을 빠져나왔지만 상황을 파악하느라 미적거리던 다른 직원들은 화재가 난 건물에 남겨졌다. 그녀는 화재로 기침하는 사람들이 가득한 길거리까지 나와서야 NO SPIN의 멤버가 보이지 않는다는 것을 알아차렸다. 건물을 뒤덮은 골리앗 같은 화염은 끊임없이 흐르는 소방 호스에 의해 서서히 길들여지고 있었다.<br><br>지운을 제외한 NO SPIN의 멤버를 화재로 잃었다. 앨범은 화재로 없어져 버렸고 밴드는 더 이상 없었다. 윤진은 모든 일에서 배제되고 지운이 아이돌 연습생 강사로 썩어갈 것이다. 그러나 윤진은 독수리들이 자신의 작품을 빼앗으려고 몰려드는 것을 그저 속수무책으로 지켜보는 희생자가 되지 않을 것이다.<br><br>윤진은 Mightee One 엔터테인먼트에는 비밀로 한 채 지운을 다시 데뷔시키기 위한 새로운 트랙을 만들었다. 또한 그녀는 지운의 슬픔을 활용해 갑작스러운 상실의 고통을 탐구하는 노래를 만들도록 그를 밀어붙였다. 뮤직비디오에는 지운이 NO SPIN 작별 인사를 고하는 장면이 담겼다. 윤진은 지운이 새로운 예명으로 데뷔하길 원했다. 트릭스터. 그는 전설의 도깨비 영혼처럼 공포와 경외심의 상징이 될 것이다.<br><br>슬픔과 죄책감에 대한 보편적인 주제를 담은 지운의 노래는 세계적으로 유명세를 탔다. 윤진과 트릭스터는 함께 월드 투어를 떠났고 그들은 어디에서든 환영받았다. 하지만 꺼림칙하게도 그들이 가는 곳마다 기이한 살인 사건들이 발생했다. 그들의 투어 날짜가 희생자가 죽음을 당한 날과 일치한다는 점이 윤진을 불안하게 만들었다. 그녀는 이미 NO SPIN 멤버들을 잃은 상실감에 매우 지친 상태였으며 남은 아티스트는 지켜내고 싶었다. 그래서 트릭스터의 보안에 대해 더욱 신경을 썼다. 만약 그 연쇄살인마가 트릭스터에 집착하는 미치광이 팬이라면… 아티스트의 병적인 노래에 영향을 받은 사람이라면?<br><br>서울로 돌아온 윤진은 지운과 함께 새로운 소재로 작업했다. 동이 트기 직전, 스튜디오로 다시 돌아간 그녀는 이미 그곳에 있는 지운의 모습을 보고 깜짝 놀랐다. 지운은 밤을 새운 듯 지쳐 보였다. 지운이 작업한 트랙을 들어보았다. 트랙의 인트로는 비명소리와 올가미 소리로 가득했다. 그녀의 취향에는 너무 실험적인 트랙이었다.<br><br>일주일 후, 또 다른 사망자가 보도되었다. 시체에는 고문의 흔적이 보였으며 이전 살인들과 같이 대담하게 노출되어 있었다. 이번에는 다이아몬드 커프링크가 희생자의 눈에 박혀있었다. 다음날 모든 TV 채널에는 그 희생자에 대한 이야기로 가득했다. 피해 여성의 SNS에 올라온 영상에는 남자친구가 하트 모양의 생일 케이크를 건네자 깜짝 놀라며 꺄악 소리를 지르는 그녀의 모습이 담겨있었다. 그 순간 윤진의 속이 울렁거렸다. 목소리. 영상에 담긴 여자의 목소리가 낯익다. 그러나 윤진은 희생자를 만난 적이 없다.<br><br>다음날 아침, 그녀는 트릭스터의 오프닝 트랙을 듣자 심장이 얼어붙는 것 같았다. 그의 노래에서 흘러나오는 비명소리가 그 희생자의 목소리와 같았던 것이다. ‘지운이 혹시 희생자의 생일 비디오에서 샘플을 채취한 걸까? 아니, 그건 불가능해. 이 노래는 사건이 보도되기 전엔 녹음된 거잖아?!’ 윤진은 녹음 부스 유리창 반대편에 비친 지운을 응시했다. 지운은 NO SPIN의 유일한 생존자이다. 나머지 모두는 죽었다. 그리고 그 기이한 사건들의 발생일자가 지운의 투어 날짜와 동일하다. 죽음의 흔적들이 그에게 모여드는 것 같았다.<br><br>만약 그가 이런 짓을 벌였다면, 어떤 아티스트도 스캔들에서 살아남지 못할 것이다. 윤진의 커리어, 아니, 그녀의 삶은 끝날 것이다. 그녀가 가진 모든 것이 파괴될 것이다. 메스꺼움이 밀려왔다. 두근거리는 심장을 쥐며 그녀는 화장실로 달려갔다. 얼음같이 차가운 물에 얼굴을 씻자 정신이 번쩍 들었다. 이렇게 복잡한 설명이 필요한 일 일리가 없다. 윤진은 자신이 너무 일을 열심히 한 탄이라고 생각했다. 그게 아니라면 그녀의 성공을 의심한 탓일 것이다. 그녀는 마음속으로 이 이심을 조작했다. 불행은 성공보다 신뢰하기 쉬웠기 때문이었다. 그녀는 자신의 마음을 가다듬으며 걱정거리를 뒤로하고 녹음실로 돌아왔다.<br><br>몇 달이 지나고 Mightee One 엔터테인먼트의 경영진들로부터 서서히 압력이 가해졌다. 수익은 하락했고, 그의 음악에 담긴 폭력적인 주제와 공연 중 칼 던지기 묘기에 못마땅했던 그들은 트릭스터를 비난하기 시작했다. 윤진은 그녀의 아티스트를 희생양으로 삼았다는 점에 매우 화가 났지만 그녀 역시 지운의 음악이 이윤을 창출하기에는 너무 틈새시장이라는 의견에는 동의했다. 그녀는 지운에게 경영진과 다툼이 있었지만 수적으로 불리했다고 전했다. 지운은 윤진의 분노를 보고 그녀가 자신의 편이라고 믿었다. 그런 두 사람에게 3개월이라는 시간이 주어졌다. 그 동안 Mightee One의 다음 히트곡을 만들어내고 경영진에게 공연을 선보여야 한다.<br><br>시간은 빠르게 흘렀고 비공개 공연 날짜가 되었다. 윤진은 경영진들 사이에 앉아 그녀의 아티스트를 기다렸다. 그녀는 자신이 작곡한 노래에는 자신이 있었지만 노래가 시작되자마자 뭔가가 잘못됐다는 걸 깨달았다.<br><br>자욱하고 역겨운 연기가 공연장으로 스며들었다. 윤진은 숨을 헐떡이며 기침을 했다. 그러나 기침을 하면 할수록 더 많이 들이마셔버렸다. 그녀의 몸은 의자 위로 쓰러졌다. 팔다리는 무겁고 무감각했으며, 악몽이 되살아나는 것을 보면서 눈이 휘둥그래졌다.<br><br>트릭스터는 사람들을 때리고 칼로 찌리고 팔다리를 잘랐다. 그는 피의 소용돌이였다. 경영진들은 도축장에 고기처럼 잘게 썰어졌다. 그들은 도망칠 수도 없었다. 윤진처럼 온몸이 마비되어 속박당했다. 그녀는 뱃속에서부터 끓어오르는 분노를 느꼈다. 그녀는 어째서 그녀의 본능을 부정했던 걸까? 화재 사건. 투어에 맞춰 발생한 살인 사건들. 모두 그였다. 언제나 그였다. 그리고 그녀는 이 모든 것을 처음부터 알고 있었다. 그녀의 커리어는 끝이 났다. Mightee One 역시 끝이다. 그녀의 동료, 친구, 지금까지 함께 했던 모든 사람들이 그녀의 눈앞에서 죽어가고 있다. 다시 한번 더 그녀는 자신이 가진 모든 것들을 빼앗겨버렸다.<br><br>안된다. 허락할 수 없다. 그는 대가를 치를 것이다. 지운 역시 윤진의 고통을 알게 될 날이 올 것이다. 그 순간 갑자기 땅에서부터 어두운 검은 안개가 피어올랐다. 그녀는 다른 곳에 와 있었다…<br><br>밝은 불빛이 번쩍이며 그녀의 눈을 멀게 했다. 어둠 속에서 환한 스포트라이트가 그녀를 비췄다. 그러자 군중들이 그녀의 이름을 외치며 환호하기 시작했다. \"매그넘 오푸스! 매그넘 오푸스!\"<br><br>그녀는 미소를 지으며 그 안에 어둠을 반겼다.","perks":["S25P01","S25P02","S25P03"],"dlc":"Comet"},{"id":"S26","ko":"질 발렌타인","en":"Jill Valentine","d":"질 발렌타인은 수많은 생체병기들에 맞서 승리를 거둔 S.T.A.R.S.의 창립 멤버이다.<br><br>질 발렌타인은 개인 기술인 <b>저항력<\/b>, <b>부활<\/b> 그리고<b>폭풍형 지뢰<\/b>로 간접적으로 반격할 수 있으며, 그녀의 팀원들에게 강력한 지원을 제공할 수 있다.","story":"자물쇠 따기 및 폭탄 처리 능력이 뛰어난 질 발렌타인. 그녀는 특수전술 구조대(S.T.A.R.S.)의 요원이다. 모두를 충격에 빠뜨린 바이오하자드에서 팀원들을 용기 있게 구출한 뒤, 그녀는 라쿤 시티에 남겨진 생존자를 구하기 위해 길을 떠났다. 하지만 치명적이고 무자비한 슈퍼 솔저 네메시스가 그녀의 행방을 추적하고 있다. 네메시스에게 몇 차례 타격을 가한 후, 질은 지하실로 달려가 차가운 공기가 감도는 방의 자물쇠를 따고 들어갔다. 그녀가 안으로 들어가자 검은 안개가 그녀를 뒤덮었고 그녀의 몸은 무감각해졌다.","perks":["S26P01","S26P02","S26P03"],"dlc":"Eclipse"},{"id":"S27","ko":"레온 S. 케네디","en":"Leon S. Kennedy","d":"레온 S. 케네디는 라쿤 시티가 바이러스 감염 위험에 빠졌을 때 경찰관으로서의 의무보다 더 많은 일을 해낸 신입 경찰관이다.<br><br>레온은 개인 기술인 <b>고통 참기<\/b>, <b>섬광탄<\/b>, 그리고 <b>신입의 패기<\/b>로 고통을 무시하고 살인마를 혼란에 빠뜨리며 놓쳐버린 목표물을 추적할 수 있다.","story":"경찰로서의 부임 첫날, 좀비 무리들과 마주한 레온 스콧 케네디는 업무를 빨리 배워야 했다. 라쿤 시티를 황폐화시킨 바이오하자드를 조사하던 레옹은 갑작스럽고 예상치 못한 검은 안개에게 미혹되어 엄브렐러 코퍼레이션이 소유한 버려진 실험실을 발견하게 되었다.","perks":["S27P01","S27P02","S27P03"],"dlc":"Eclipse"},{"id":"S28","ko":"미카엘라 레이드","en":"Mikaela Reid","d":"미카엘라는 젊은 신비주의자로 초자연적인 능력으로 희생제의 판을 바꿀 수 있다.<br><br>그녀의 전승 기술인, <b>예지력<\/b>, <b>호재: 치료의 순환<\/b>, 그리고 <b>호재: 그림자 미행<\/b>으로 그녀는 해당 지역의 감시를 서면서 은신처를 생성한다.","story":"미카엘라 리드는 16살에 아버지를 여의었다. 그녀는 언제나 아버지가 가르쳐준 동이 틀 무렵의 항해법을, 그의 화려하지만 삼킬 수는 없는 타코를, 따뜻하고 중독적인 웃음소리를 그리워할 것이다. 그녀의 감정은 마치 폭풍이 몰아닥칠 광활한 검은 바다 위에서 노를 젓고 있는 것과 같이 느껴졌다. 굽이치는 파도 하나하나가 그녀를 집어삼키는 듯했다. 고통스러운 어둠에 떠내려가 자기 자신을 잃어버리는 듯했지만 주변 사람들의 사랑과 보살핌으로 다시 해변으로 되돌아갔다.<br><br>좋은 사람들 사이에서 미카엘라는 과거를 뒤로하고 삶은 새로운 빛을 통해 바라봤다. 그녀는 새로운 것을 시도해보는 것을 좋아했으며 그 결과 스토리텔러가 되었다. 친구들은 주인공들이 적발하고 생존을 위해 처절하게 싸우는 배경의 이야기들을 좋아했다. 그래서 그녀는 다른 공포 이야기들을 더 열심히 읽기 시작했고 이야기들이 주는 강력하고 가슴 두근거리는 현실도피적 체험을 음미했다. 가을은 그녀가 가장 좋아하는 계절이 되었고 그녀는 매년 할로윈마다 친구들을 초대하여 집에서 만든 간식과 공포 이야기, 무서운 게임을 즐겼다.<br><br>세월이 흐르면서 그녀는 마법에 흥미를 보였고 가벼운 축복, 식물에 기초한 주문, 그리고 손금을 읽는 법을 연마했다. 그녀는 바디버터, 비누와 스킨 로션과 같은 수제 제품을 만들기 위해 세이지, 쑥, 라벤더 들을 가꾸었다. 친구들과 가족들을 위해 만든 것들에 의지해서 살아갈 수 있길 열망하여…<br><br>그동안, 그녀는 동네에서 예술적으로 독립적이며 다소 별난 카페로 알려진 문스톤에서 바리스타로 일했다. 매주 금요일 밤, 그녀는 마이크를 들고 카페 손님들 앞에 서서 스토리 쇼를 선보였다. 그녀의 가장 친한 친구이자 룸메이트인 줄리안은 그녀의 쇼를 촬영하여 인터넷에 게시하였다. 그리고 그녀 모르게 영원의 할로윈 축제에도 그녀의 영상을 보냈다. 이 축제는 할로인 동안 유명한 스토리텔러들이 자신의 스토리 쇼를 선보이는 축제다.<br><br>마침내 미카엘라가 축제 관계자로부터 할로윈에 열리는 그랜드 파이널에 자신을 초청하는 이메일을 받았다. 멋진 서프라이즈였다. 축제의 우승 상금은 그녀가 자신의 제품을 출시할 수 있을 만큼 충분히 컸다. 예상치 못한 이벤트에 신난 그녀는 방을 돌며 부정적인 에너지를 없애기 위해 허브를 태우며 공연에서 선보일 다음 이야기를 만들기 시작했다.<br><br>미카엘라는 밤을 꼴딱 새우며 공책에 이야기를 끄적거렸다. 하지만 이야기의 인트로가 문제였다. 머릿속에 이야기를 글로 표현하기엔 인내와 실력이 필요했다. 그리고 그 다음날 밤, 악몽이 시작되었다. 일주일 내내 그녀는 숨을 헐떡이며 잠에서 깨어났다. 그녀의 꿈은 매일 밤 똑같았다. 차가운 계단을 지나 어둡고 지하실로 끌려가는 꿈. 그런 다음 날카로운 쇠갈고리가 가슴을 찌려 폐가 불에 타는 듯한 고통을 느꼈다. 정체 모를 어두운 누군가가 자신을 갈고리에서 끌어내리고 고통이 그녀를 깨울 때까지 천천히 들어 올렸다. 할로윈을 위한 이야기를 더 멋지게 다듬을수록 그녀의 악몽은 어두워졌다.<br><br>그렇게 며칠이 지나고 악몽에 시달린 그녀의 심신은 지치고, 불안했으며, 스트레스가 그녀를 괴롭혔다. 종종 정신이 팔려 카페 손님들의 주문을 제대로 응대하지 못했다. 너무 서두르게 준비한 커피는 톡 쏘는 맛이 났으며, 가끔 잘못된 손님에게 전달되기도 했다. 그녀는 아침에 더 이상 커피 원두를 축복하지도, 남은 커피 찌꺼기를 보며 운세를 읽으려 하지도 않았다. 힘은 빠져 있었고, 마치 그녀의 마력은 고갈된 느낌이었다.<br><br>어느 날 밤 그녀는 비명을 지르며 일어났다. 충분히 참았다. 그녀는 줄리안에게 자신이 잠이 든 동안 지켜보며 특이한 것을 녹음해 달라고 부탁했다. 그는 동의하며 미카엘라가 침대에 잠든 동안 그녀의 모습을 촬영하기로 했다.<br><br>그녀가 잠에 빠져든 지 몇 분이 지나지 않아 그녀의 손가락과 발가락이 경련을 일으키기 시작했다. 그녀의 숨소리 역시 불안정했다. 줄리안은 미카엘라가 천천히 공중으로 떠오르는 것을 보고 충격에 빠졌다. 극심한 공포에 사로잡힌 줄리안은 미카엘라의 어깨를 흔들며 그녀를 깨우려 했지만 그녀가 비명을 지르기 시작하자 그것조차 할 수 없었다. 핸드폰을 집어올려 119를 불러보려 했지만 강력한 충돌이 그의 시선을 빼앗았다. 그는 복도를 내려다보았고 커다란 송곳니를 가진 거미에 의해 욕실 문을 쾅 닫는 것을 목격했다.<br><br>소란 속에서 미카엘라가 깨어났다. 그녀는 검은 거미 송곳니가 욕실 문을 갈기갈기 찢는 것을 보고 침대에서 뛰어내렸다. 그녀는 자신의 침실 문을 쾅 닫으며 줄리안에게 방어벽을 치는 것을 도와달라고 소리쳤다. 하지만 그가 몸을 움직이기도 전에 전기가 나가버렸고, 방 안은 어둠으로 잠식되었다.<br><br>몇 초 후, 전기와 함께 기분 나쁜 고요함이 몰려들었다. 미카엘라와 줄리안은 아주 조심스럽게 방을 빠져나왔다. 찢겨나갔던 욕실 문은 온전해 보였고 비정상적인 물체 역시 보이지 않았다. 하지만 줄리안은 지난 몇 분간의 말도 안 되는 이 모든 순간들을 촬영했다.<br><br>잠 못 이루는 밤의 연속이었다. 그녀가 카페의 일을 마치고 아파트로 돌아왔을 때 줄리안은 그곳에 없었다. 미카엘라는 그가 촬영하여 인터넷에 게시한 영상들을 삭제해 주길 바랐다. 그가 학교에 있을 거라고 생각한 그녀는 집을 떠났다. 그녀 뒤에 있는 문이 닫히는 소리가 욕실에서 들려오는 숨 막히는 울음소리를 숨겼다.<br><br>미카엘라는 차로 향하며 고개를 돌려 어깨너머 뒤를 돌아봤다. 누군가… 자신을 쳐다보는 느낌이 들었다. 그녀는 보호 주술을 중얼거리며 차 열쇠를 만지작거렸다. 그 순간 벽에 그림자가 드리웠고 그녀는 질주하기 시작했다. 그녀가 차에 도착해 몸을 숨기고 차 문을 잠갔다. 숨을 거칠게 몰아쉬던 그녀는 창문으로 시선을 돌렸다. 그곳에 아무것도, 아무도 없었다. 그저 예민해진 그녀의 정신이 그녀를 가지고 논 것일지도 모른다. 그녀는 차 시동을 켜고 학교로 향했다.<br><br>그 다음날 역시 줄리안의 행방은 묘연했다. 미카엘라는 그녀가 아는 모두에게 연락을 취했다. 하루 종일 그를 찾으러 다녔고 밤새도록 그가 돌아오길 기다렸다. 심란하고 불안했던 미카엘라는 문스톤 카페에 출근하는 것도 잊고 있었다. 고대하던 할로윈과 축제 오늘 밤부터 시작될 예정이다. 줄리안이 미카엘라 대신 참가신청까지 했던 스토리텔링 대회 역시 오늘이었다. 줄리안은 그런 존재였다. 미카엘라가 그녀 자신을 의심할 때마다 그녀를 응원해 준 고마운 친구. 아마도 그곳에 줄리안이 있을 것이라는 생각이 들었다. 하지만 그녀의 악몽과 줄리안 실종에 대한 걱정으로 대회 준비를 거의 하지 못하였다. 그녀는 정리되지 않은 이야기의 시작으로 가득한 자신의 공책을 바라봤다. 그녀에겐 두 가지 선택이 주어졌다. 두려움에 떨며 잠 조차 이루지 못한 채 집에 가만히 있는 방법, 그리고 줄리안이 시작한 일을 끝내는 방법... 그녀가 공포 이야기를 나누는 것을 좋아했던 이유는, 이야기를 얘기함으로써 어떠한 도전이든 직면할 수 있는 용기를 느꼈기 때문이었다.<br><br>그날 저녁 영원의 할로윈 축제의 진행자가 미카엘라의 이름을 호명하자, 그녀는 검은 드레스에 어울리는 챙이 넓은 마녀 모자를 쓴 채 대담하게 무대에 올랐다. 관중 속에서 줄리안을 찾길 바라며… 하지만 줄리안은 보이지 않았고 또한 관중을 정면으로 마주한 것은 그다지 현명한 선택이 아니었다. 수많은 사람들이 그녀의 손짓 하나하나, 행동 하나하나에 집중했기 때문이다. 그녀의 심장은 두근거렸고 손은 심하게 흔들렸다.<br><br>그녀는 따뜻한 마이크를 손에 쥐며 목을 가다듬었다. 무거운 고요함이 그녀를 반겼고 멀리서 들려오는 기침소리만이 허공에 울렸다. 그녀는 오늘 밤이 이 영역과 저 너머에 영역 사이에 장막이 얇아진 ‘모든 성자들의 전야’라는 것을 스스로 상기시켰다. 그녀의 마음에는 중요한 이야기가 하나 담겨있었다. 그녀가 그 이야기를 잘 전달하기만 한다면, 줄리안이 들어줄 것이다.<br><br>미카엘라는 깊은숨을 내쉬었다. 가을밤의 습한 바람이 그녀의 주변에 떨어진 낙엽들을 흔들었다. 그리고 그녀는 눅눅한 잎사귀의 매캐한 냄새를 들이마셨다. 그녀의 입속에 여전히 남아 있는 커피의 씁쓸한 뒷맛을 느끼며 꿀꺽 삼켜넘겼다. 저 먼 곳에서 까마귀들은 늙은 떡갈나무 위에 올라 깍깍거렸다. 그녀는 눈을 감았고 눈꺼풀 밑으로 진홍색 어둠이 더 어둡게 변했다. 심장박동이 느려지는 것이 느껴졌다. 차가운 밤공기 속에서 입김을 내뿜으며 깊게 숨을 내쉬었다. 몇 주 만에 정신이 깨며 처음으로 상쾌함이 느껴졌고 인생의 모험담을 전할 준비가 된 기분이었다.<br><br>그녀의 깊고 간드러진 목소리가 마이크를 통해 흘러나왔다. 그녀는 추운 가을밤에 불어닥치는 바람 이야기를 들려주었다. 동이 트기 전에 사라진 충실했던 친구의 이야기. 어둠의 날개에 숨어있는 잊혀진 희생자들의 이야기. 끔찍한 비밀들로 봉인되어 고동치는 무덤들의 이야기. 그리고 죽음의 그림자 속 영원한 밤의 이야기를…<br><br>미카엘라는 하늘 밤을 가리키며 빛을 초월하는 어둠은 존재하지 않는다고 말했다. 달이 뜨지 않는 밤에도, 오래전에 생명을 다한 별들이 밤하늘을 밝게 비춘다고…<br><br>그 순간, 짙은 검은 안개가 미카엘라를 감쌌고 관객들은 놀라움에 사로잡혔다.<br><br>그리곤 미카엘라 리드를 다시 본 사람은 아무도 없었다.","perks":["S28P01","S28P02","S28P03"],"dlc":"Hubble"},{"id":"S29","ko":"요나 바스케스","en":"Jonah Vasquez","d":"요나는 수학 천재로, 논리를 사용하여 팀을 돕는다.<br><br>그의 개인 기술인, <b>극복<\/b>, <b>교정 조치<\/b>, <b>호재: 지수<\/b>로 빠르게 도망치고 실패한 스킬 체크를 교정할 수 있으며 빈사 상태의 생존자를 치유할 수 있다.","story":"요나 바스케스는 베일에 가려진 진실을 보았다. 그의 재능은 그로 하여금 소수의 사람들만이 할 수 있는 방식으로 숫자를 이해하도록 하였다. 석양, 건축, 풀잎 하나 등, 그는 그의 눈으로 보는 것보다 더 많은 것을 보았다. 그는 '왜' 그리고 '어떻게 우리가 존재하는지 밝히기 위해 우주 곳곳에서 지속적으로 전개되는 복잡한 방정식들을 설명하는 언어를 이해했다. 그건 바로 수학이었다. 구조물. 패턴. 깨지지 않는 법칙: 물리학.<br><br>만약 그의 가족이 집안 대대로 내려온 가난을 또다시 그대로 물려받았다면 그의 재능은 빛을 보지 못했을지도 모른다. 하지만 어떤 패턴들은 그들의 공통적인 경로에서 벗어나가 마련이었고, 요나의 아버지는 그가 가진 모든 힘을 다해 가족에게 더 나은 삶을 주기 위해 노력했다. 캘리포니아 주에 위치한 프레즈노 근처 마을에서 과일을 재배하는 직업을 시작으로 요나의 아버지는 마침내 작은 맹그로브를 소유하게 되었다. 이는 풍족하진 않았지만, 요나가 안정적인 어린 시절을 보내고 교육을 받기엔 충분했다.<br><br>그는 비록 상급 반에 배치되었지만, 같은 반 친구들에 비해 요나의 총명함은 그다지 눈에 띄는 것은 아니었다. 그에겐 친한 친구가 몇 명 있었고, 야구에 열정을 보이며 고대 문명에 관심을 갖는 평범한 소년이었다. 그러나 그가 혼자 있을 땐, 그의 머리는 숫자들로 가득 찼다. 그리고 요나에게는, 이 순간들이 가장 매혹적으로 다가왔다. 그는 피보나치와 레카만 수열을 연구했고, 곧 역사 속 수학자들의 복잡한 방정식에 푹 빠져버렸다.<br><br>16살 생일날, 그는 주소가 적혀 있지 않은 카드를 받게 되었다. 그 카드에는 알 수 없는 숫자들이 적혀있었다. <b>8, 25, 19, 44, 1; -20.37, -69.85; 13, 2, 26, 11, 1<\/b><br><br>그것은 퍼즐이었다. 그의 수학 선생님 또는 그가 두뇌 훈련 퀴즈들을 좋아한다는 것을 아는 그의 친척들 중 하나가 보낸 것일지도 모른다. 그러나 이번 퍼즐은 조금 달랐다. 요나는 숫자를 보자마자 이 숫자들은 좌표를 의미한다고 생각했고 칠레에 어느 지역인지 찾아보았다. 하지만 정답은 아니었다. 모든 시도가 실패로 돌아갔다.<br><br>시간이 흐르면서, 그는 퍼즐이 결함이 있다고 확신하며 퍼즐을 해결하는 것을 포기했다. 그는 대학을 졸업하고 CIA에 암호 해독가로 고용되었다. 직원 안내서를 처음 받은 그날, 그에게 익숙한 숫자들이 눈에 들어왔다. <b>8, 25, 19, 44, 1; -20.37, -69.85; 13, 2, 26, 11, 1<\/b>. 목뒤로 흐르는 긴장감이 느껴졌다. 마치 누군가의 장난에 놀아난 느낌이 들었다. 그는 퍼즐로 돌아왔지만, 지난 수년간의 경험이 새로운 정보를 제공하지 않는다는 것을 확인할 뿐이었다. 그는 퍼즐에 연연할 시간이 없었다. 해야 할 일이 있었기 때문이다.<br><br>그는 유럽 전역의 신호소로부터 온 메시지를 해독하는 일을 하게 되었다. 보관된 영상에 따르면 23년 동안 수십 대가 알 수 없는 용량으로 운영되었다. 단순하게 깜빡이는 빛은 분리된 정보를 드러내는 복잡한 코드를 숨겼다. 별거 아니었지만, 그는 그 메시지가 전 세계적으로 막강하고 부유한 개인들과 관련이 있는 것 같다는 것을 발견했다.<br><br>그러나 프로젝트는 갑자기 중단되었고 프로젝트에 참여한 모든 요원들은 다른 업무로 배치되었다. 요나는 새롭게 형성된 관타나 민주주의의 비밀 특수부대로 옮겨져, 반란군의 메시지를 가로채 해독하는 업무를 맡았다. 그의 업적은 미국이 수많은 반란군의 위치를 파악할 수 있도록 했고 그 곳에는 폭탄이 떨어졌다.<br><br>하지만 요나는 그 메시지들이 미끼였다는 것이 너무 늦게 알게되었다. 민간인 사상자는 매우 많았으며, 실제 사망자 수는 고위 공무원들에 의해 은폐되었다. 요나는 자책했다. 그는 그 지역에 가해진 피해뿐만 아니라, 수많은 이산가족이 생겨나는 과정 역시 목격하게 되었다. 그는 휴가를 내고 관타나에 남아 피해 상황을 조사했다. 뭔가를 해야만 할 것 같았다. 그는 CIA의 디지털 보안 전문가 중 한 명의 부탁을 들어주는 대신 대가로 반란군의 컴퓨터 네트워크에 침투할 수 있게 해달라고 부탁했다. 네트워크 침투에 성공한 그는 반군으로부터 집과 사랑하는 사람들을 잃은 사람들을 위해 아무도 눈치채지 못할 만큼 자금을 빼돌려 나눠주었다.<br><br>그 일은 아무도 모르게 마무리되는 것 같았다. 그의 스위트룸에 총알이 빗발치기 전까진 말이다. 총알을 유리창을 산산조각이 냈고 벽에 수많은 총알구멍을 냈다. 요나는 바닥에 엎드렸다. 그러나 잠시 후 뭔가 결심한 듯 노트북을 챙기고 부엌 창문을 깨부순 뒤 옆 건물 옥상으로 뛰어내렸다. 그가 욱신거리는 발목을 문지르기도 전에 작은 집은 화염에 휩싸였다. 그는 뒤도 돌아보지 않고 도망쳤다. 그는 골목으로 내려가 빈민가에 상자 더미와 썩어가는 나무판자 사이에 몸을 숨겼다. 그렇게 일주일이 흘러, 그는 미국 대사관에 도착했다. 그의 몸은 쌓인 먼지로 가득했고 너무나도 지쳐있었다.<br><br>그가 숨을 돌리기도 전에 그의 상사인 CIA 국장의 전화를 받게 되었다. “그럴 만한 가치가 있었나? 자네가 십자군 원정대라도 되는 것 같은가?”<br><br>그는 자신의 무력함을 느꼈다. 그리고 단순한 것에 집중하기로 했다. 숫자였다.<br><br>CIA 국장은 그에게 새로운 임무를 전달했다. 그중에 일부를 제외하고는 모두 기밀이었다. 신호소에 대한 그의 조사가 저 위쪽 고위급에게 전달되었고 프로젝트는 비밀리에 재개되었다고 국장은 전했다. 요나는 많은 시간을 암호 해독에 할애했다. 그가 이렇게 몰두한 데는 일 자체가 흥미로운 작업이기도 했지만 죄책감 때문이기도 했다. 신호소로 시작된 정보는 그를 훨씬 더 당혹스러운 곳으로 이끌었다. 공포 팟캐스트.<br><br>캠프파이어 공포 이야기와 세계 각국의 슬래셔 이야기에는 암호가 숨겨져 있었다. 때때로는 숫자로 가득했고, 때때로는 말로 전해졌다. 하지만 매번 비밀 암호나 악수인 것처럼 그는 다음과 같은 메시지를  날아다녔다. 그가 산들바람의 향기가 더 이상 귤 냄새가 아니라는 것을 깨달았을 땐... 이미 늦은 후였다.<br><br>냄새였다.","perks":["S29P01","S29P02","S29P03"],"dlc":"Ion"},{"id":"S30","ko":"요이치 아사카와","en":"Yoichi Asakawa","d":"요이치는 천재적인 해양 생물학자이자 심령 술사로, 자신이 보유한 지식과 능력으로 자신과 다른 생존자들을 도울 수 있다.<br><br>그의 개인 기술인, <b>보호자 지도<\/b>, <b>공감대 형성<\/b>, 그리고 <b>호재: 암흑 이론<\/b>으로 살인마들에게서 숨을 수 있고, 부상당한 생존자들에게 소리칠 수 있으며, 다른 생존자들이 더 빠르게 이동할 수 있도록 도와줄 수 있다.","story":"어릴 적부터 이해할 수 없는 저주가 요이치의 아버지와 어머니, 두 사람의 목숨을 앗아갔을 때부터 그는 초자연적 현상에 관심을 갖게 되었다. 성인이 된 요이치는 도쿄에 있는 대학에서 해양생물학을 수석으로 졸업했으며, 아버지의 뒤를 이어 학교 역사상 최연소 교수가 되었다. 그러나 그의 커리어는 이즈오섬에서 연구를 하던 중 두 제자가 사라지면서 흔들리기 시작했다. 그에게 이즈오섬은 언급만으로도 과거의 아픈 기억을 떠올리게 하는 곳이었다. 그로 인해 깊게 감춰졌던 기억들이 그의 어둡고 깊은 잠재의식을 뚫고 끓어올랐다. 흐릿한 얼굴, 뒤틀린 입, 그리고 설명할 수 없는 죽음들이 갑자기 그의 머릿속에 가득 차기 시작했다. 그를 괴물이라고 부르던 사람들의 소리. 그리고 괴물... 사다코는 그에게 저주가 끝나지 않았다는 것을 알아주려는 듯 아주 깊은 심연에서 떠올랐다. 저주는 절대 끝나지 않았다.<br><br>비명과 함께 요이치는 눈을 감은 채 천천히 두려움을 떨쳐냈다. 그가 다시 눈을 떴을 때, 사다코는 사라졌지만, 무언가가 돌아왔다. 불길한 이계의 무언가가. 출렁이는 바다처럼 깊은 숨을 내쉬는 불안한 존재가 근처에 있는 것을, 그는 느낄 수 있었다. 사다코가 그를 괴롭히는 것일까? 원령이 그에게 경고하는 걸까? 아니면 또 다른 존재일까? 사람들을 집어삼키는 무언가. 사람들을 사라지게 만든 무언가. 요이치는 알 수 없었다. 그는 평생토록 자신의 심령 능력과 초자연적인 현상에 대해 이해하려고 노력했다. 그의 본능은 그 해답이 물에 있다고 말했다. 어찌됐든 그는 바다의 지적 생물체와 미개척 영역을 연구하는데 그의 일생을 바쳤다. 어쩌면 이젠 그가 생각하는 '지능'에 대한 정의를, 아니면 '생명'에 대한 정의를 재고해야 할 지 모른다.<br><br>진실에 목말라 있는 요이치는 병리학과 신비 동물학, 신학, 민속사 분야에 대한 광란의 연구에 뛰어들었다. 그가 전문 분야를 넓힐수록 사람들의 조롱과 따돌림은 더 심해졌다. 한때 영리한 젊은이로 선망받던 그는 이제 괴짜이자 골칫거리로 여겨졌다. 몇 달이 채 가지 않아 그의 대학은 그를 해직시켰다. 그는 주저하지 않고 다른 학교들에 문을 두드려보았지만, 일본 내 명문 대학들은 하나같이 그를 받아주지 않았다. 최후의 수단으로 그는 언론 매체들에 문의했는데, 운명의 장난일까, 그의 어머니가 살아생전 기자로 일했던 회사가 그의 이야기를 자신들의 신문에 최초로 실을 권리를 대가로 그에게 연구 자금을 지원해주기로 했다.<br><br>이러한 힘든 시기를 보내고 있던 요이치에게, 그의 아버지가 다시 돌아왔다. 그리고 아버지의 영혼은 요이치에게 선택한 분야에 대한 연구를 멈추지 말라고 조용히 강요했다. 그리하여, 요이치는 도쿄의 한 작은 아파트에서 다른 연구원들과 함께 협력하며 초자연적 현상에 대한 연구를 이어나갔다. 몇 달 뒤, 그는 스코틀랜드의 한 등대에서 네 명의 블로거가 미스터리하게 실종되었다는 소식을 접했고, 이는 그의 학생들이 실종되었던 옛 사건을 떠올리게 했다. 절박한 심정으로 요이치는 글래스고로 가는 첫 번째 비행기를 타고 그곳으로 날아갔다. 한 스코틀랜드 현지 대학의 교수는 약 70년 전 한 영화의 스태프 한 명이 바로 같은 등대 근처에서 실종됐었던 사건과 매우 비슷하다고 결론을 내렸다. 물속에는 분명 지능 같은 것이 존재했다. 마치 고대 전설에 존재했던 사이렌처럼 바다 깊은 곳에서 사람들을 부르는 무언가가. 요이치가 연구결과를 조사하자, 그의 아버지가 나타나 요이치가 올바른 길로 가고 있다고 알려주었다.<br><br>아버지의 안내에 따라, 요이치는 조그마한 낚싯배를 빌려 ‘세븐헌터스’로 알려진 작은 섬들로 향했다. 그들이 그 섬들에 다가가자 어둠이 깔렸다. 이제는 원격 통제되고 자동화된 등대가, 별안간 죽어가는 별처럼 펑 하고 터지더니 빛을 읽었다. 바다는 거세게 출렁이기 시작했고, 번개가 번쩍였으며, 선장은 요이치에게 뱃머리를 돌리자고 사정했으나 요이치는 거절했다. 그는 진실에 너무 가까이 있었고 흔들리지 않았다. 그들이 말다툼하는 동안 바다는 더욱 격력해졌고 배를 위아래로 흔들었다. 이내 집채만 한 거대한 파도가 배를 들어 올렸고 배는 결국 어두운 뾰족한 암초에 부딪혀 산산조각이 났다.<br><br>요이치는 그 뒤로 거의 기억이 없었다. 그는 물에 빠진 것이 기억에 났다. 그가 아버지가 등롱에 서서 자신을 향해 손짓하고 있는 것을 보고 육지로 수영한 것이 기억에 났다. 그가 계단을 오르며 짙고 검은 안갯속을 뚫고 나간 것이 기억에 났다. 그가 걸음을 내딛을 때마다 물이 차오르다 결국 격앙된 바다가 그를 통째로 집어삼켜버린 것이 기억에 났다.","perks":["S30P01","S30P02","S30P03"],"dlc":"Kepler"},{"id":"S31","ko":"해디 카우르","en":"Haddie Kaur","d":"해디는 용감하고 결연한 팟캐스터로, 스스로 '오버랩'이라고 이름붙인 엄청난 고통의 장소를 보고 느끼는 능력을 가졌다.<br><br>그녀의 개인 기술인, <b>이너 포커스<\/b>, <b>남은 실체화<\/b>, 그리고 <b>지나친 열성<\/b>으로 생존자와 살인자를 추적하고 손전등을 더 효과적으로 사용하며 발전기들을 더 효율적으로 수리할 수 있다.","story":"해디는 사랑이 넘치는 가정에서 그녀의 젊은 시절을 보냈다. 그녀의 어머니인 바산트 카우르 교수는 퀘벡주 트루아리비에르에 있는 대학에서 농업 과학을 가르치기 위해 전 세계를 돌아다녔다. 그녀의 아버지인 라잔 싱은 작은 퀘벡 마을에서 출장연회 사업으로 놀라운 성공을 거두었다. 그녀의 집은 언제나 커민, 칠리, 마살라, 카더몬 그리고 탄두르 오븐에서 갓 구워져 나온 신선하고 김이 나는 난 향기로 끊임없이 소용돌이쳤다. 그녀의 초기 기억은 인도에 대한 이야기로 가득 차 있었고 그녀의 부모님이 그녀의 10번째 생일이 지난 새해에 펀자브를 방문하기로 약속한 기억이었다.<br><br>연휴 동안, 그녀의 부모님은 그들의 가장 친한 친구인 마리스와 프랑수아 로아와 함께 파티에 갔다. 하지만 해디가 아프다는 전화 한 통에 그들은 서둘러 집으로 발걸음을 옮겼다. 퀘벡 시골의 구불구불한 눈길에 라잔은 차를 제어할 수 없게 되었고, 얼음으로 뒤덮인 울창한 숲으로 미끄러졌다. 이들은 그렇게 어두운 숲에 갇혀 죽음을 맞이했다. 이들의 시신은 사건이 일어난 지 이틀이 지난 후에나 발견되었다. 해디의 열이 내릴 때쯤, 경찰은 해디에게 부모님은 고통스럽지 않게 세상을 떠나셨다고 전해주었다. 하지만 해디는 경찰이 자신을 위해 거짓말을 하고 있다는 것을 알만한 나이였다. 다음날 아침, 해디는 평생 동안 자신을 괴롭히게 될 질문에 잠을 깼다. 그녀의 머리가 새하얗게 쇠어있었다.<br><br>로아는 해디를 집에 데려왔다. 그리고 부모님의 빈자리를 채워주기 위해 최선을 다했다. 엄청난 사랑을 잃었지만, 그 공간은 다시 새로운 가족들의 사랑으로 가득 찼다. 양부모님은 친아들 조던만큼 해디를 사랑해 주었고, 조던 역시 새 동생을 아꼈다. 그러나 부모를 잃은 트라우마는 그녀 안에 무언가를 끄집어 냈다. 그녀는 다른 사람들이 볼 수 없는 것을 보기 시작했다. 끔찍하고 초자연적이며 설명할 수 없는 무언가를... 유령들은 교실, 집, 그리고 침대에서 그녀를 괴롭혔다. 그녀의 끊임없는 비명소리에 사람들을 그녀를 “헬리 해디”라고 불렀고, 이는 그녀에게 소외감과 고뇌를 더했을 뿐이었다. 한때 명랑하고 사교적인 아이였던 해디는 그렇게 세상과 담을 쌓아나갔다.<br><br>얼마 지나지 않아 해디는 자신의 불가사의한 능력이 특정 영역, 즉 어두운 영역에서만 촉발된다는 것을 깨달았다. 마치 이 세상에 또 다른 차원이 자신의 차원으로 흘러들어가는 곳이 있는 것 같았다. 조던은 이 교차하는 지역을 ‘오버랩’이라고 불렀고, 이 지역들은 해디에게 공포 이야기에서 튀어나온 듯한 어둡고 그늘진 세계에 대한 통찰력을 주는 듯했다. 해디가 고등학교를 졸업할 때쯤, 그녀는 설명할 수 없는 기분에 사로잡혔다. 자신의 부모님이 누구였는지 알아봐야겠다는 강한 끌림. 인도 여행 자금을 마련하기 위해, 조던은 해디에게 그녀의 능력을 이용해 퀘벡에 있는 유령이 나오는 장소를 탐험하고 기록하자고 제안했다. ‘도레아’ 시설에서, 해디는... 환자와 의사들의 잔존 기억과 그 밖의 많은 것들을 보고 들을 수 있었다.<br><br>시설에서 느껴지는 기운을 기록하는 동안, 그녀는 잠식하는 차원을 ‘참해’라고 불렀다. 차원은 모든 시간과 장소에 대한 그녀의 기억으로 그녀를 공격했을 뿐만 아니라 초자연적인 에너지로 힘을 채우는 듯한 느낌을 주었기 때문이었다. 참해는 천천히 세상을 타락시키고 집어삼키는 인간의 고통에 살아있는 모자이크였다. 해디는 자신의 가설에 추가할 수 있는 증거를 더 찾기 위해 심층 깊은 조사를 진행해야 한다고 결론지었다.<br><br>조던은 삼촌 스테판에게 영상과 녹음 파일을 보여주었고 스테판은 그들이 이를 다큐멘터리 형식의 웹 시리즈로 만드는 것을 도왔다. 첫 번째 에피소드를 업로드한 지 며칠 만에, ‘심연의 참해’에 대한 이야기가 빠르게 퍼져나갔다. 실제 범죄 팬, 심령 추격자, 그리고 회의론자들이 그녀가 겪고 있는 일에 대해 자기만의 가설을 펼치며 댓글 창을 가득 메웠다. 스테판 삼촌은 제작을 맡았고, 얼마 지나지 않아, 해디는 스테판 삼촌에게서 프로 팟캐스터로서 첫 수표를 건네받았다.<br><br>실행 예산으로, 해디는 전 세계에 유령이 출몰한다는 곳을 조사하며 참해에 대한 해답들을 찾아볼 수 있게 되었다. 그녀의 조사는 그녀를 한때 마을 전체 주민들이 사라진 외딴섬으로 이끌었다. 이런 강한 느낌을 주는 곳은 이곳이 처음이다. 고통과 잔인함, 그리고 억눌러진 어둠이 그녀의 심장을 마구 뛰게 만들었다.<br><br>해디는 버려진 유령 마을의 감정을 받아들이기 위해 눈을 감았다. 마음을 진정시키자, 비명소리, 울부짖음, 고통에 새어 나오는 신음 소리가 들려왔다. 해디가 다시 눈을 떴을 때, 주황색의 잔상이 아른거렸다. 마을 사람들이 진흙과 빗속에서 서로 엉킨 모습이었다. 하지만 조던의 훗날로 보이는 어떤 남자가 그녀에게 손짓하기 시작하자, 마을 주민들의 잔상은 모두 사라졌다. 해디는 중년의 남자를 쫓아갔지만, 그 순간 참해는 그녀의 감정으로 그녀를 장난감처럼 가지고 놀 수 있으며, 현실이 될 수 없는 것을 진실로 보게 만든다는 것을 깨달았다.<br><br>해디는 프로젝트에서 완전히 손을 떼고 싶었지만, 그녀는 이제 그녀의 가족을 먹여 살리는 회사의 핵심이 되었다. 스테판 삼촌은 유령이 출몰하는 지역들을 계속 발굴하며 방송 계획을 추진해 나갔다. 해디는 인도 전역을 배낭여행한 후, 계속해서 참해의 공포에 시달리는 경험을 계속하게 되었다.<br><br>그 후, 2차 세계 대전 알프스의 한 벙커에서 있었던 사건을 조사하던 중, 펀자브어로 도움을 요청하는 누군가의 목소리가 희미하게 들렸다. 눈 덮인 숲으로 터널이 갑자기 뚫리면서 벙커 안으로 눈이 몰아쳤다. 멀리서 자동차의 경음기 소리가 크게 나더니 점점 소리가 줄어들었다. 높은 눈 벽을 통해 붉은빛이 반짝였고, 그녀의 시야에 거대한 소나무 아래 부서진 파란색 차량이 들어온다. 해디는 곧장 그곳으로 달려간다. 심장이 요동친다. 산산조각 난 앞 유리를 통해 그녀는 얼어붙은 피바다에 갇힌 부모님의 시신을 목격했다.<br><br>해디가 눈을 가늘게 뜬다. 그들의 떨리는 푸른 입술 사이로 아주 희미한 입김이 흘러나온다. 절박감과 함께 그녀는 눈 더미를 헤쳐 나아갔다. 다 헛수고였다. 그녀는 죽어가는 부모님에게 그날 밤 아파서 죄송했다고, 모두 자기 잘못이라며 울부짖었다. 그 순간 그들은 눈을 부릅뜨고 일제히 해디 평생의 질문에 답을 했다.<br><br><i>그래, 아가... 모두 네 탓이란다. 우리는 고통 속에 죽었어...<\/i><br><br>얼어붙은 덩굴이 그녀를 감싸며 끝없는 어둠의 세계로 그녀를 끌어내렸고, 끔찍한 울부짖음과 함께 해디는 다시 눈 속으로 떨어졌다.","perks":["S31P01","S31P02","S31P03"],"dlc":"Meteor"},{"id":"S32","ko":"에이다 웡","en":"Ada Wong","d":"에이다 웡은 미스터리로 가득한 비밀 요원으로 그녀의 스파이 스킬은 그녀를 위험한 적으로 만든다.<br><br>그녀의 개인 기술인, <b>도청 장치<\/b>, <b>반응성 치료<\/b>, 그리고 <b>낮은 관심<\/b>으로 그녀는 살인마를 염탐할 수 있으며, 아군이 다쳤을 때 치료 능력을 한껏 발휘한다. 또한, 에이다가 최후의 생존자가 되면 흔적을 남기지 않는다.","story":"에이다 웡에 대한 모든 것은 수수께끼였다. 그녀의 이력, 국적, 충성심, 동기, 심지어 그녀의 진짜 이름까지도 수수께끼였다. 엄브렐러 그룹을 상대로 일하는 기업 스파이였을까? 알버트 웨스커에게 충성스러운 조수였을까? 아니면 이중간첩이었을까? 그리고 그녀는 왜 라스 플라가 기생충을 노렸을까? 분명히, 그녀는 훈련된 암살자였던 것이다. 고급 무술 훈련을 받은 무기 전문가. 로스 일루미나도스 교단을 조사하는 도중 그녀는 의식의 희생양으로 붙잡혀 거의 죽을 뻔했다. 그러나 결국 그녀는 탈출했고, 그 후, 그녀를 본 사람은 아무도 없었다. 그것 역시 수수께끼였다.","perks":["S32P01","S32P02","S32P03"],"dlc":"Orion"},{"id":"S33","ko":"레베카 체임버스","en":"Rebecca Chambers","d":"레베카 체임버스는 재능 있는 의무병이자 그녀 주위의 사람들을 진정시켜주는 부대의 멤버이다.<br><br>그녀의 개인 기술인, <b>새 것보다 낫다<\/b>, <b>안도감<\/b>, 그리고 <b>과집중<\/b>으로 자신의 동료에게 속도 부스트를 제공하고 고통에 몸부림치는 아군의 고통을 완화하며, 스킬 체크를 고속으로 완료한다.","story":"신동이었던 레베카 체임버스는 18살에 대학을 졸업했다. 신입 경찰관으로서, 그녀는 브라보 팀과 함께 현장 의무병으로 임명된 특수 전술 및 구조 부대의 최연소 멤버였다. S.T.A.R.S.는 그녀의 팀을 아크레이 연구소로 파견시켜 끔찍한 살인 사건들을 조사하게 하였다. 버려진 기차를 탐사하는 중 그녀는 언데드 괴물들과 돌연변이가 된 동물들을 발견했다. 그녀는 탈출했지만, 더 끔찍한 곳에 도착했다. 바로, 충격적인 혐오로 가득 찬 지하 공간, 엄브렐러 그룹의 시설이었다.<br><br>그녀는 다른 브라보 팀원들을 찾기 위해 필사적으로 그들의 알 수 없는 목소리를 따라 어디서 나타났는지 모를 미스터리한 검은 안개 속으로 걸어들어갔다. 레베카는 짙은 안개를 헤치고 지나갔고, 그 순간, 뒤에서 위협적인 발자국 소리가 다가오는 것을 들었다. 그녀는 본능적으로 허리에 찬 무기 쪽으로 손을 뻗었다. 그러나 그녀의 권총집은 텅 비어있었다. 무기가 사라진 것이다.<br><br>그녀가 당황스러움에 뒤를 돌아보자, 낮게 으르렁거리는 소리와 함께 곤봉 같은 거대한 무기가 그녀를 향해 다가왔다. 그녀는 재빨리 몸을 피해 위기를 모면했다. 그녀는 다시 두 발로 일어서 어둠 속에서 깜박이는 불빛을 향해 돌진했다.","perks":["S33P01","S33P02","S33P03"],"dlc":"Orion"},{"id":"S34","ko":"비토리오 토스카노","en":"Vittorio Toscano","d":"비토리오는 안개의 비밀을 밝히려 노력하며 끝도 없이 안갯속을 헤맸다.<br><br>비토리오의 개인 기술인, <b>잠재 에너지<\/b>, <b>안개에 관해서<\/b>, 그리고 <b>빠른 포석<\/b>으로 발전기 진행도를 저장해 추후에 사용할 수 있고, 스킬 체크 대성공 후 살인마의 위치를 드러내며, 발전기를 수리하는 동안 동료 생존자들에게 속력 부스터를 제공한다.","story":"1343년 알베르토와 카테리나 토스카노 사이에서 태어난 비토리오 토스카노는 가문의 땅을 물려받을 삼 형제 중 막내였다. 그가 열다섯 살이 되던 해, 그의 아버지는 그를 형들에게 무술을 가르친 바로 그 기사 에토레 파브리치오에게 보내 무술 훈련을 받게 했다. 하지만 비토리오는 그의 형제들이 했던 것처럼 전투 훈련을 받지 않았다. 철학을 공부했던 그는 물리적 폭력은 무능한 사람들의 마지막 피난처라고 믿었다.<br><br>비토리오의 평화주의에 격분한 파브리치오는 그의 견습 기사 중 하나에게 비토리오를 공격하라고 명령했다. 비토리오가 타격을 막아냈지만 반격은 하지 않았다. 그의 분노한 상대가 달려들자, 비토리오가 다시 한번 공격을 쳐냈다. 그를 공격한 견습 기사는 자신의 단검에 걸려 넘어졌다. 그는 1분도 안 되어 피를 흘리며 그 자리에서 즉사했고 비토리오는 다시는 칼을 들지 않겠다고 맹세하며 칼을 내던졌다<br><br>비토리오는 학자가 될 만큼의 소질을 보였지만, 이에 불만족스러웠던 그의 아버지는 비토리오를 삼촌 렌조에게 보내어 공부를 하게 했다. 렌조는 포르토스쿠로 공작이라는 작위가 있었을 뿐만 아니라, 학자이자 희귀 유물 수집가이기도 했다.<br><br>렌조의 지도 아래, 비토리오는 사라진 문명과 고대 역사에 대한 그의 연구에 집중했다. 그는 잊혀진 서적에 대해 연구했고, 고대 비밀 사회의 철학과 지혜에 대한 전문가이자, 지식을 수호하는 무명의 수호자가 되었다. 수호자들은 거의 모든 세기와 문화에 존재한다. 그들은 시간과 지역에 따라 다양한 이름으로 불리었으며, 그들은 다른 차원, 즉 완벽한 세계에서 온 존재로 불렸다. 비토리오는 감시자, 관리인, 안내자, 마스터, 목격자에 대한 모든 정보를 수집했다.<br><br>비토리오의 연구는 이 수호자들이 인류가 점차 더 높은 존재의 영역으로 넘어가는 것을 돕는 불가사의한 진보의 지식을 지키는 문지기 역할을 했다는 것을 밝혀냈다. 그는 목격자가 인류를 자멸로 이끌 수 있는 지식을 방출하기 전 인류가 스스로 지혜를 얻기를 기다린다는 이론을 세웠다. 이 목격자들은 천천히 성장, 이해, 집단적 지혜를 자극할 지식으로 인류에게 영감을 주는 방법을 찾아냈다.<br><br>비토리오는 돈과 권력에 대한 탐욕이 모든 갈등의 근원이라는 렌조 삼촌의 견해를 연구에 참고했다. 그는 이 문지기들에 대한 잊혀진 지식이 폭력적인 세계에 평화, 조화, 질서를 가져다줄 수 있길 희망했다.<br><br>비토리오의 성화에 렌조는 고대 유적의 폐허에서 유물들을 찾기 위한 탐험에 나섰다. 헝가리에서, 그들은 로마 시대의 청동으로 만들어진 로마 12면체를 발견했다. 아나톨리아에서, 그들은 테오도시우스 오벨리스크 아래에 숨겨진 터널을 발견했고 그곳에서 아카디아의 쐐기 문자로 새겨진 석판을 발견했다.<br><br>석판에는 세 조각으로 쪼개져 전 세계로 흩어진 신비로운 유물들의 이야기가 기록되어 있었다.<br><br>하나의 단서가 그들을 트로이의 폐허로 이끌었다. 그곳에는 고대 보물을 간직한 비밀의 방이 존재했다. ‘수많은 보물 중 가장 귀중한 것은 신비로운 유물의 조각이다.’ 또 다른 단서가 그들을 로도스 섬으로 이끌었고, 그 섬은 동일한 유물의 두 번째 조각이 보관되어 있는 곳이었다. 델포이의 아폴로 신전 아래에 검은 대리석 제단에서 비토리오는 세 번째 유물 조각을 찾았다. 제단 위에 놓인 판화에는 크레타의 지도와 미노스 궁전 위에 있는 별이 그려져 있었다.<br><br>비토리오는 궁전의 폐허 아래 미로 깊숙한 곳에서 세 개의 유물을 합쳐 열쇠를 만들었고, 이 열쇠를 넣을 구멍을 발견했다. 구멍에 열쇠를 꽂자 고대 기계들이 살아났고, 바위 하나가 드르륵 열리더니 숨겨진 궁륭이 드러났다.<br><br>렌조와 비토리오는 궁륭 안으로 들어섰다. 궁륭 안쪽에는 산스크리트어로 보이는 언어로 새겨진 하얀 대리석 벽이 있었다. 벽에 쓰여진 메시지는 준비되지 않은 지식으로 인류를 타락시키려는 사이비 단체에 대해 경고했다. 이 사이비 단체는 목격자를 추격했고, 그들을 감금했다. 하지만 목격자들은 감금되기 전, 이 어둠의 세력에 대한 비밀 지식과 세상을 파괴하려는 자들을 막을 방법과 함께 전 세계에 유물을 숨겼다고 한다.<br><br>벽에 쓰여진 메시지는 고대 시대의 학교의 돌에 관해서도 언급하고 있었다. 존재의 면 사이를 여행하는 비밀을 가진 그런 돌이었다. 비토리오는 '라피스 파라디수스'라고 불리는 이 돌이 목격자나 그들의 유토피아를 찾는 열쇠를 쥐고 있다고 믿었다.<br><br>두 사람이 궁륭을 나오는 도중, 렌조는 실수로 검은 독사를 밟고 말았다. 독사는 렌조의 다리를 송곳니로 물은 다음, 빛의 속도록 모습을 감췄다. 독이 렌조의 온몸으로 퍼졌고 얼마 지나지 않아 목숨을 잃었다. 렌조의 유일한 상속인인 비토리오는 삼촌의 토지, 장서, 칭호와 더불어 막대한 재산을 상속받았다. 그는 삼촌의 영을 기리고 인류가 나약함, 탐욕, 잔인함을 극복할 수 있도록 결심한 그는 라피스 파라디수스를 찾아 혹시나 살아있을 목격자들을 찾아야 한다고 생각했다.<br><br>1391년, 비토리오는 또 다른 탐험을 떠났다. 이번엔 용병 기사단을 고용하여 그들에게서 탐험에 도움을 얻고 보호를 받았다. 경비대 소속이었던 타르호스 코바치는 사람도 짐승도 두려워하지 않았다. 비토리오의 탐험과 발견은 결국 그들을 포르투갈의 신트라라는 도시 아래에 있는 지하 묘지로 이끌었다. 하지만, 지하 묘지에 들어서려면, 묘지를 지키고 있는 문지기들을 모조리 죽여야 했다. 누구의 피도 흐르지 않길 원했던 비토리오는 타르호스에게 묘지로 통하는 다른 방법을 찾으라 명령했다.<br><br>타르호스는 비토리오의 명령을 거역했고, 하루가 끝이 날 무렵, 자신의 고용주인 비토리오의 손에 수갑을 채웠다.<br><br>그들은 다시 이탈리아로 돌아왔고, 타르호스는 비토리오를 지하 감옥에 가두었다. 그런 다음, 타르호스는 포르토스쿠로에서 고문 파티를 시작했다. 사람들에게 바위 뒤에 숨겨진 의미를 말해주면 목숨만은 살려주겠다고 약속하며 말이다.<br><br>몇 주도 지나지 않아, 타르호스는 마을 사람들을 고문하는 것이 지겨워졌고, 비토리오는 말동무라곤 쥐들 밖에 없는 지하 감옥에 방치되어 있었다. 혼자 있는 동안 그는 라피스 파라디수스의 상징들을 돌바닥에 새겨 넣었다. 그는 파라다이스 같은 세상을 상상하면서 수많은 장면들을 떠올리려 노력했다. 그리고 그가 배고픔과 절망에 굴복하려는 순간, 그는 끝없는 평화와 연민의 세계에 대해 명상하는 동안 마지막 한 장면을 떠올리려 노력했다.<br><br>처음에 비토리오는 자신이 실패했다고 생각했다. 지하 감옥에 쥐들은 그의 패배감을 감지하고 그의 살점을 뜯어먹기 위해 그를 향해 위협적으로 다가왔고, 그는 마지막 힘을 다해 숨을 헐떡였다. 그 순간, 차갑고, 부자연스러운 검은 안개가 돌바닥에서 피어올랐다. 잠시 후, 그의 귀로 고뇌의 외침이 흘러들어왔고 까마귀들이 그의 머리 위를 배회했다. 그는 어렵게 두 발로 일어섰다. 그리고 그는 다른 세상에 있는 자신을 발견했다.<br><br>그러나 그가 기대했던 파라다이스는 아니었다.","perks":["S34P01","S34P02","S34P03"],"dlc":"Quantum"},{"id":"S35","ko":"탈리타 리라","en":"Thalita Lyra","d":"탈리타는 기술과 번영으로 연과 싸우면서 경쟁력 있는 기술을 익혔다.<br><br>그녀의 개인 기술인, <b>제멋대로<\/b>, <b>친선 경기<\/b>, 그리고 <b>팀워크: 두 사람의 힘<\/b>을 통해 연속으로 빠른 뛰어넘기를 수행할 수 있으며, 동료들의 발전기 수리 속도를 높일 수 있고, 탈리타가 치료한 동료의 이동 속도를 높일 수 있다.","story":"만약 나에게 물어본다면, 탈리타 리라는 그녀가 인생에서 가장 원했던 것은 사람들을 불러 모으는 일이라고 말할 것이다. 그녀의 아버지가 계약한 최신 포로 밴드를 위한 클럽을 처분하는 것이든, 그녀의 어머니가 보타포구, 라파, 그리고 이파네마를 전 세계 관광객들에게 자랑하는 것이든, 탈리타는 사람들이 그들의 열정을 공유하고 의미 있는 관계를 형성하기 위해 모이는 것을 보는 것을 좋아했다.<br><br><br><br>그녀가 십 대에 들어섰을 때, 탈리타는 연싸움을 하다 자신의 커뮤니티를 찾게 되었다. 그녀의 삼촌 이나시오는 탈리타와 헤나토에게 남매간의 사소한 다툼을 해결하는 방법을 가르쳐주었다. 연을 만들고 다른 연들을 끊어지고 승자가 결정될 때까지 연을 날리는 방법이었다. 탈리타와 헤나토는 해변에 자리 잡은 삼촌의 연 상점에서 여름을 보내는 것을 좋아했다. 그들은 아침부터 상점 일을 돕고, 오후에는 연싸움을 하며 여름을 보냈다. 그들의 익살스러움은 아이어른 할 것 없이 모두의 관심을 끌었고, 얼마 지나지 않아 탈리타는 상점에 오는 손님들에게 연싸움을 가르치기 시작했다. 훨씬 더 많은 사람들과 연결되길 원하던 탈리타는 연싸움을 촬영해 온라인에 영상을 올렸다. 그녀는 온라인 홍보로 삼촌에게 따로 홍보비가 필요가 없다고 말했다.<br><br><br><br>탈리타는 자신이 올린 연싸움 영상이 자신을 스타덤에 오르게 할 거라는 것을 전혀 예상하지 못했다. 탈리타와 그녀의 해설을 담은 영상은 점점 더 많은 유명해져갔고, 영상을 본 사람들을 연싸움에 대한 그녀의 통찰력과 매력에 대해 끊임없이 얘기했다. 심지어, 그녀의 영상은 어느 모델 에이전시의 시선도 사로잡았다. 그리고 얼마 지나지 않아, 그녀 앞으로 포스터 광고를 위한 화보 촬영과 TV 광고 스케줄이 잡혀있었다. 그녀는 모델 일이 좋았고 이는 머지않아 커가면서 봐온 일일 연속극의 스타들처럼 그녀를 톱스타 배우로 만들어 줄 것이다. 그녀의 커뮤니티는 브라질 전역에 퍼져있었고, 어쩌면 브라질을 넘어서도 그녀를 응원하는 사람들이 있을지도 모른다.<br><br><br><br>그러나 일은 그녀가 바라는 방향으로 나아가지 않았다.<br><br><br><br>모델 일은 조금씩 그녀를 연 상점에서 멀어지게 만들었다. 처음엔 연을 날리며 생겼던 영광의 상처 자국들을 없애기 위해 연날리기를 포기해야 했다. 그다음엔, 그녀의 하루는 모델 사업 내 인맥관리와 수다떨기, 공연 준비로 가득 채워졌다. 탈리타가 고등학교를 졸업할 무렵에는 그녀의 에이전시는 그녀에게 더 많은 일을 해주고 싶어 했다. 즉, 연 상점에서 보내는 시간이 더욱 적어진다는 것을 의미했다. 그러나 그녀는 이 모든 노력과 헌신은 가치가 있을 것이라고 스스로에게 말했다.<br><br><br><br>몇 년이 정신없이 지나갔다. 이제 탈리타는 낯선 사람들의 어색한 시선과 흘김에 지쳐있었다. 명성은 그녀가 생각했던 것만큼 매력적이지 않은 것 같았다. 늦은 밤 헤나토와 이야기를 나누면서 그녀는 자신이 놓치고 있는 것이 무엇인지 깨달았다. 바로 사람들과의 연결. 마음이 맞는 사람들과의 진정한 연결. 그것이 그녀의 부모님이 사람들을 그들에게 끌어들인 방법이다. 그리고 탈리타에겐 연싸움이 바로 사람들과 연결될 수 있는 방법이었다.<br><br><br><br>결심이 선 그녀는 빠른 시간 내에 모델 일을 정리하고, 모은 돈으로 연 상점을 열었다. 삼촌 이나지오의 축복과 함께 헤나토를 사업 파트너로 삼았다. 그렇게 ‘펀 카이트 리오’는 사람들이 연싸움 재료를 구매하기 위해 찾는 프리미엄 상점이 되었고, 탈리타의 유명세 역시 연날리기의 인기를 올리는 데 한몫했다.<br><br><br><br>시작은 좋았지만 탈리타는 언제나 그렇듯 더 많은 사람들에게 닿길 바랐다.<br><br><br><br>펀 카이트 리오의 첫 번째 토너먼트는 성공적이었다. 수백 명의 참가자들이 하늘에서 춤을 추는 수십 개의 연들을 보기 위해 리오의 변두리까지 모여들 정도였다. 오랜 친구들과 새로운 친구들이 서로 어울리고, 매점 일을 돕고, 그리고 한두 번의 경기가 진행되는 동안 탈리타는 행복의 눈물을 흘리는 자신을 발견했다.<br><br><br><br>그녀는 성취감을 느꼈다. 이게 바로 그녀가 만들고 싶었던 커뮤니티였다.<br><br><br><br>해가 저물고 토너먼트가 끝이 날 때쯤, 들판은 쓰레기들로 뒤덮여있었다. 탈리타와 헤나토는 남아서 쓰레기를 주웠다. 헤나토가 들판 위를 날아오른 낯선 드론을 발견했을 땐, 이미 하늘엔 보름달이 높게 떠올라있었다.<br><br><br><br>드론을 보자 탈리타의 짓궂은 어린 시절의 모습이 굉음을 내며 되살아났다. 도전의 시간이 왔다. 드론을 쓰러뜨리기 위한 두 남매의 레이스. 헤나토는 이를 받아들이지 않을 수 없었다.<br><br><br><br>결국 탈리타의 연이 드론의 회전자 날개에 걸려들었다. 그녀는 환호했고 헤나토는 털털거리는 소리를 내며 숲으로 사라지는 드론을 바라보았다. 잠시 후, 드론은 연기를 남기며 사라졌다.<br><br><br><br>탈리타는 떨어진 드론을 찾고 싶지 않았다. 연을 찾을 생각도 없었다. 하지만 헤나토는 홀로 숲 쪽으로 걸어갔고, 탈리타는 동생이 혼자서 어두운 숲을 헤매게 할 수 없었다.<br><br><br><br>깊은 숲속에서 헤나토가 찾은 것은 드론만이 아니었다. 탈리타의 귀로 비명소리가 들려왔고, 숲속에서 피로 뒤덮인 남자가 나타났다. 그는 살려달라며 필사적으로 외치며 헤나토의 팔을 붙잡았다. 그러나 너무 늦은 후였다. 남자는 둘로 나뉘었고, 갈라진 남자 뒤로 최첨단 사냥 장비로 온몸에 장착한 여자가 걸어 나왔다.<br><br><br><br>‘헤나토는 어째서 움직이지 않은 거지?’<br><br><br><br>그녀는 동생의 나머지 한 팔을 끌어당기며 달렸다. 또 다른 드론 한 대가 머리 위로 떠올랐다. 그녀가 연으로 추락시킨 드론과 닮아 있었다. 드론들은 사냥꾼의 눈이었고, 그녀는 하늘에서 두 대 중 하나를 추락시키는 데 성공했다.<br><br><br><br>헤나토는 충격에 빠져있었고, 탈리타는 동생의 팔이 깊게 베었음을 알아차렸다. ‘도대체 언제?’ 아무렴 상관없었다. 피는 멈출 기미가 보이지 않았고, 둘은 어서 안전한 곳으로 대피해야 했다. 그 순간 그녀의 눈앞에 공장이 보였다. 곰팡이가 슬어가는 벽돌로 지은 건물은 흘러간 시간을 피하지 못하고 붕괴되어 있었다.<br><br><br><br>탈리타는 헤나토를 공장 안으로 데려갔고, 어두운 벽감에 몸을 숨겼다. 사냥꾼이 그들의 뒤를 따라 공장으로 들어왔다. 사냥꾼은 나무 들보를 질질 끌어와 입구를 막았다. 유일한 출입구가 막혀버리고 말았다. 탈리타는 자신들에게 시간이 얼마 없다는 것을 알고 있었다. 사냥꾼이 먼저 남매를 찾지 않아도, 그녀의 드론이 그들을 찾아낼 것이다.<br><br><br><br>탈리타는 벽감에 숨은 채 밖에 상황을 살폈다. 공장의 공기가 변하고 있었다. 어둡고 칙칙한 벽들이 밝고 화창한 풍경으로 녹아들고 있었다.<br><br><br><br>해변이 보인다.<br><br><br><br>해결책을 찾았다. 출구다. 살아남을 수 있는 단 한 번의 기회. 이제 해변을 향해 달려나가면 된다.<br><br><br><br>탈리타는 헤나토를 팔로 감싸서 그를 일으켜 세웠다. 그녀는 헤나토가 그만두라고 말하는 것을 들었다고 생각했지만, 그를 무시했다. 생존의 기회가 눈앞에 있다. 그들은 사냥꾼을 뒤로하고 해변을 따라 뛰었고, 한 걸음 한 걸음 따뜻한 모래를 걷어찼다.<br><br><br><br>탈리타는 끊임없이 뛰었다. 발아래 모래가 소용돌이치는 검은 안개가 변할 때에도.","perks":["S35P01","S35P02","S35P03"],"dlc":"Saturn"},{"id":"S36","ko":"헤나토 리라","en":"Renato Lyra","d":"헤나토는 상금에서 눈을 떼는 적이 없었으며, 그의 팀원들에게도 똑같은 열정을 바랐다.<br><br>그의 개인 기술인, <b>백그라운드 플레어<\/b>, <b>블러드 러시<\/b>, 그리고 <b>팀워크: 단체 잠행<\/b>을 통해 살인마의 추격이 가까워졌을 때 더 빨리 이동할 수 있으며, 탈진 상태 이상에서 즉시 회복하고, 동료를가 플레이어를 치료한 후 동료와 플레이어의 긁힌 자국을 숨길 수 있다.","story":"헤나토는 평범한 어린아이가 아닌, 세계와 주변 사람에 대해 연구하는 과학자에 더 가까운 아이였다. 그는 반 친구의 얼굴을 찌르거나 친구에게 매우 가까이 밀착했을 때, 친구들이 보일 반응에 큰 호기심을 가졌다.<br><br><br><br>괴짜 취미가 있는 헤나토에게 친구가 없다는 건 어쩌면 놀랄 일이 아닐지도 모른다. 그는 학교 일진들의 타깃에 되기 십상이었고, 특히 그가 월반을 했을 때는 괴롭힘이 더 심해졌다. 그럼에도 불구하고, 자신보다 한두 살 더 많은 아이들 사이에서도 헤나토는 우수한 성적을 냈고, 그는 친구들의 환심을 사려 하지도 않았다.<br><br><br><br>헤나토는 두 가지 취미가 있었다. 하나는 퍼즐을 푸는 것이었고, 하나는 탈리타 누나를 짜증 나게 만드는 것이었다. 이는 헤나토가 사랑을 표현하는 방법이었다. 헤나토는 누나가 아이들과 어른들을 상대로 연싸움에서 쉽게 이기는 것을 보고 자랐고, 언젠가 누나처럼 되고 싶어 했다. 그래서 누나가 연날리기에 관심을 가지기 시작했을 때, 그 역시 연날리기를 좋아하기 시작했다.<br><br><br><br>헤나토의 부모님은 아들이 사회성을 기를 필요가 있다는 것을 알고 있었다. 그가 13살이 되던 해 여름, 그들은 아들을 해변에 있는 이나시오 삼촌의 연 상점으로 보내 잡일을 돕게 했다. 탈리타는 그곳에서 새로운 친구들을 사귄 적이 있었으니, 어쩌면 헤나토 역시 그렇게 할 수 있을 것이라고 생각했다. 그러나 탈리타는 하루 종일 헤나토에게 일을 시켰고, 이는 그 무엇보다 그를 짜증 나게 만들었다. 두 사람 사이에 언쟁이 점점 심해지자, 이나시오 삼촌은 그들이 화해할 수 있도록 연싸움의 예술적인 면모를 보여주었다.<br><br><br><br>연싸움은 순식간에 헤나토의 마음을 사로잡았다.<br><br><br><br>그는 연싸움을 매우 좋아했다. 연싸움에서 패배해도 상관없었다. 이나시오가 예상했듯 두 남매의 다툼은 점점 줄어들었고, 함께 연을 날리는 시간이 길어졌다.<br><br><br><br>헤나토가 탈리타와 지내는 것처럼 지낼 수 있는 그런 행운을 가졌더라면 좋았을 것이다. 탈리타는 헤나토에게 연싸움을 배우는 아이들과 경쟁하는 것을 그만두라고 말하곤 했지만, 헤나토는 듣지 않았다. 그는 누가 자신에게 이래라저래라 하는 것을 싫어했다. 누나가 모델 일에 집중하기 위해 가게에서 보내는 시간을 줄이기 시작했을 때, 헤나토는 누나 대신 선생님으로 사람들 앞에 나서야 했다. 무엇보다도, 그는 모든 사람들이 그의 누나를 얼마나 그리워하는지 듣게 될 것이다.<br><br><br><br>헤나토는 고등학교를 2년 조기 졸업했다. 그의 부모님은 대학교 공부나 취업 같은 것들은 나중에도 할 수 있으니, 그에게 봉사를 하며 시간을 보내볼 것을 제안했다. 그러나 헤나토는 부모님이 자신을 한 사람의 어른으로 대해주길 바랐다. 탈리타는 헤나토에게 기타를 연주할 수 있는 곳을 찾아 기타 연습을 하고 열심히 하는 모습을 보여준다면, 가족들이 더 이상 그에게 간섭하지 않을 거라고 얘기했다.<br><br><br><br>누나의 제안이 마치 달콤한 음악처럼 그의 귀로 흘러들어왔다.<br><br><br><br>헤나토는 동네 양로원에 자원봉사자로 지원했다. 먼저, 그는 양로원에 거주하는 사람들을 위해 기타를 연주했고, 얼마 지나지 않아 주방 일을 돕기 시작했다. 그는 어느새 주변 사람들을 진정으로 아끼는 것이 무슨 뜻인지 알아가고 있었다. 그는 아무런 대가 없이 타인을 돕는 노력을 했다. 그리고 난생처음으로 헤나토는 자신에게 다른 사람들의 삶을 더 좋게 만들 수 있는 힘이 있음을 느꼈다.<br><br><br><br>이러한 새로운 통찰력은 탈리타가 삶의 기로에 섰을 때 특히 쓸모가 있었다. 탈리타는 모델과 배우로서의 삶을 추구해나가고 싶었지만, 그녀는 연 상점을 제일 그리워했다. 헤나토는 탈리타가 고민을 털어놓을 사람이 필요했을 때, 그녀의 고민을 진심으로 경청해 주었다. 그리고 며칠 동안 이어진 긴 대화를 통해, 탈리타에게 목적에 대한 새로운 감각을 일깨워주는 데 도움을 주었다.<br><br><br><br>탈리타가 그녀의 새로운 사업인 연싸움 상점 ‘펀 카이트 리오’의 파트너가 되어 달라고 헤나토에게 물었을 때, 헤나토는 기다렸다는 듯이 누나의 제안을 받아들였다. 맨 처음부터 사업을 구축해나가는 일들은 헤나토에게 끝판왕 퍼즐처럼 느껴졌다.<br><br><br><br>상점을 열었을 당시, 헤나토의 분석적 사고는 상점에 많은 도움이 되었다. 그는 누나에게 모델로서의 유명세를 이용해 상점을 홍보하도록 격려했고, 전국의 컨벤션과 심포지엄을 예약하여 펀 카이트 리오에 대한 소식을 알렸다. 시간이 지나면서, 탈리타가 연싸움 대회를 열자고 제안할 만큼 상점은 커갔고, 그것은 쉬운 일처럼 보였다.<br><br><br><br>토너먼트 대회는 활기가 넘쳤다. 하루 종일, 친구들과 낯선 사람들은 헤나토에게 다가와 그의 노고에 감사하곤 했다. 연싸움은 여기 모인 사람들에게 의미가 있었고, 이는 그들의 삶을 더 좋게 만들었고, 헤나토는 그들의 전반적인 행복과 행복에 기여했다.<br><br><br><br>그리고 어느새 토너먼트가 끝이 났고 달은 하늘 높이 걸려 있었다. 이 순간 피곤함과 배고픔, 모두가 떠난 들판에 남은 쓰레기를 줍는 일은 아무래도 상관없었다. 모든 것들이 가치 있는 일이라고 느껴졌다.<br><br><br><br>열심히 쓰레기를 줍던 그의 눈에 하늘을 나는 드론이 보였다. 드론을 보자 누나와 했던 어렸을 적 연으로 무선 조종 비행기를 격추하거나 해변가에 있던 남매의 마음에 들지 않는 사람들의 연을 끊어버리던 추억이 기억났다. 탈리타 역시 똑같은 생각을 했나보다. 탈리타는 헤나토에게 드론 격추 내기를 제안했다. 누나에게 실력을 뽐낼 기회가 찾아왔다. 완벽한 하루에 어울리는 완벽한 마무리.<br><br><br><br>아니, 이건 완벽한 실수였다. 순간, 헤나토는 소름이 느껴졌다. 그는 탈리타를 말려보려 했지만 그녀는 이미 들떠있었다. 드론이 그녀의 연을 먹어 치우고 숲으로 비뚤어진 연기를 내뿜으며 하강하기 시작했다.<br><br><br><br>그들은 곤경에 처했다. 그가 숲을 향해 달려갔을 때 비로소 탈리타는 정신을 차리고 뒤를 따랐다.<br><br><br><br>드론이 나무에 박혀 죽은 회전자 날개에 연이 매달려 있는 것을 발견하는 데 오랜 시간이 걸리지 않았다. 헤나토가 매듭을 풀자 날카로운 끈이 그의 손가락에 파고들었고, 그는 어두운 숲에서 피 묻은 손이 뻗어 연을 거의 자유롭게 했던 그 순간...<br><br><br><br>헤나토의 손끝에 누군가가 닿았다!<br><br><br><br>헤나토는 부상당한 남자를 보고 펄쩍 뛰었다. 그는 필사적으로 도움을 요청하며, 횡설수설했다. 헤나토는 그 남자가 넘어지지 않도록 손을 내밀었지만, 이미 너무 늦은 순간이었다.<br><br><br><br>두 칼이 헤나토의 팔과 남자를 베었다. 상처를 살펴볼 시간이 없었다. 칼은 다시 하늘 위로 날아올랐고 헤나토의 옆엔 몸이 반쪽으로 나누어진 남자가 쓰러져있었다. 그리고 탈리타가 격추한 드론과 닳은 드론과 함께 무장한 여자가 나타나 헤나토 앞에 서있었다.<br><br><br><br>헤나토는 도망쳐야 한다는 걸 알고 있었지만, 그의 발은 꼼짝하지 않았다. 시간이 얼마 남지 않았다. 그 순간 그를 끌어당기는 또 다른 손이 느껴졌다.<br><br><br><br>모든 것들이 흐릿했다. 팔에는 깊은 상처가 생겨있었고, 욱신거림이 느껴졌다. 그러나 누나가 곁에 있다는 걸 알고 있었다. 그리고 도망쳐야 한다는 것을 알고 있었다.<br><br><br><br>깊어가는 밤, 남매는 몸을 숨기기 위해 걸음을 멈췄다. 헤나토는 숨을 고르려 노력했지만 그럴 시간은 허락되지 않았다. 그들이 발걸음을 멈추자마자 탈리타는 다시 그를 버려진 폐공장으로 끌어당겼다.<br><br><br><br>하지만 이곳에는 공장이 없다고 헤나토는 속으로 생각했다.<br><br><br><br>공장은 숲보다 더 추웠다. 그는 지혈을 위해 팔을 움켜쥐었다. 어지러움이 느껴졌다. 벌써 얼마나 많은 피를 잃었을까? 탈리타는 공장의 어두운 구석에서 그를 지키고 있었다. 그리고 그 순간...<br><br><br><br>그녀는 헤나토를 일으켜 세우며, 도망치라고 말했다.<br><br><br><br>“어디로?” 탈리타는 해변으로 도망치라고 속삭였다. 헤나토는 누나를 말려보려 그녀를 끌어당겼지만 헤나토는 너무 약했다. 해변은 보이지 않았다. 그에게 보이는 것은 오직 두 남매에게로 다가오는 검은 안개뿐이었다.","perks":["S36P01","S36P02","S36P03"],"dlc":"Saturn"},{"id":"S37","ko":"가브리엘 소마","en":"Gabriel Soma","d":"지략이 뛰어난 엔지니어로, 어느 상황에서는 최고의 결과물을 만들 준비가 되어있다.<br><br>그의 개인 기술인, <b>분쟁 조정자<\/b>, <b>탄생의 목적<\/b> 그리고 <b>청소부<\/b>로 추격 동안 그가 볼 수 있게 도와주며, 생존자 치료 후 인내를 얻고 공구상자를 재충전할 수 있다.","story":"재앙적인 핵 전쟁은 2098년 인류를 거의 멸망시켰다. 그러나 인류는 결집했고 결국 새로운 길을 찾았다.<br><br>발명가들과 혁신가들은 에너지를 만들고 음식을 재배하는 새로운 방법을 발견했다. 이러한 선견지명이 있는 한 사람은 헉슬리 공업(Huxlee Industries Ltd.)을 설립했다. 지구의 많은 지역들은 인간이 살 수 없는 상태가 되었고 세계의 많은 자원들이 줄어들고 있었기에, 헉슬리는 회사의 모든 수익을 로켓 과학, 인공 지능, 그리고 유전 공학 연구에 쏟아부었다.<br><br>그들은 귀중한 자원이 있고 생명체가 살 수 있는 행성을 찾기 위해 은하계를 탐험하기 시작했다. 그들의 계획은 은하의 먼 곳까지 여행하고, 그 귀중한 자원들을 채굴하여, 인류를 위한 평화롭고 번영하는 미래를 만드는 것이었다.<br><br>인류가 식민지화한 각각의 행성은 신중하게 설계되었다. 자원이 추출되었고, 신중하게 조작된 DNA로 조작된 개인을 만들기 위해 성장 허브가 구축되었다.<br><br>각각의 개인은 다른 사회적 기능을 위해 만들어졌다. 인구의 대다수는 육체노동자였다. 그 외에 인구들은 과학자, 엔지니어, 행정가, 농학자, 의사가 되기 위해 만들어졌다. 완벽하게 운영될 수 있는 기능적인 사회를 만들자는 취지였다.<br><br>가브리엘 소마는 인류의 첫 식민지 행성이었던 프록시마 켄타우루스 자리 C의 복제 허브에서 태어났다. 그는 식민지 허브를 건설하기 위해 파견된 로봇과 안드로이드를 관리하고 수리하는 소규모 승무원의 일부였다. 게이브는 알지 못한 사실이지만, 어린 시절의 모든 기억은 그를 복제한 사람들에 의해 그의 의식에 심어졌다. 그의 다른 선원들처럼, 그는 자신이 지구상의 어머니와 아버지 사이에서 태어났다고 믿었다. 사랑하는 가족의 서사적 순서를 만들어 심리적 안정을 유지했다. 사실 그들 가운데 누구도 자신들이 식민지 허브에서 태어나고 자랐다는 것을 인지하지 못했다.<br><br>가브리엘의 우주선이 드바르카에 착륙했다. 드바르카는 최근 태양계에서 발견된 행성이었다. 그들이 도착하자마자, 인간이 조종하는 UAV 5대와 완전 자율형 로봇 헉스-A7 5대가 행성의 표면을 탐사하기 위해 파견됐다.<br><br>이 기계들은 들이마실 수 있는 공기와 풍부한 물, 그리고 다양한 생물체들을 탐지했다. 예상치 못한 무언가를 포함하여... 그곳엔 아무도 모르게 사라진 고대 문명의 유적들이 있었다. 유적들은 오래돼 보였지만 그 기술은 놀랍게도 발전되어 있었다. 그 기술에 전력을 전달하는 것이 무엇이든 간에 미스터리였다. 기계는 작동하지 않는 상태였고, 오랫동안 휴면 상태였기 때문이다.<br><br>행성이 인류에 적절한 동시에, 다양하고 귀중한 미네랄 자원을 품고 있다는 것이 증명되었으므로, 식민지 허브 건설이 시작되었다.<br><br>착륙선에는 10인승 승무원들이 거주할 수 있는 숙소가 있었다. 대부분의 허브 건설은 자동화되었지만, 헉슬리 공업은 항상 감독자 자격으로 행동할 수 있는 인력을 포함시켰다.<br><br>그 행성은 굉장한 아름다움을 지니고 있었다. 알록달록한 꽃들로 뒤덮인 오래된 성장의 숲과 목초지. 잔잔한 호수. 넓은 강. 게이브는 드바르카와 같은 행성에서 영원히 살고 싶었다. 그러나 고무적인 아름다움과 평화로운 환경은 오히려 팀 전체를 안일하게 만들었다. 심지어 팀 보안 책임자인 마이클도.<br><br>마이클은 동식물을 기록하는 업무를 담당하는 과학자 사라와 함께 유적지 가장자리를 정찰하기 위해 수송 차량을 운전하고 있었다. 사라의 말에 따르면, 차량이 갑자기 속력을 올렸고 브레이크는 말을 듣지 않는다고 했다. 두 사람의 눈앞에 절벽이 나타났고 마이클은 사라에게 뛰어내리라고 소리쳤지만 문은 열리지 않았다. 마이클은 사라 쪽에 창문에 총을 쐈고, 사라는 창문을 넘어 안전하게 점프했다. 마이클의 자신 쪽에 창문을 향해 총을 쏴 탈출할 구멍을 만들었지만, 제때 탈출하진 못했다. 그가 사투를 벌이는 동안, 차량은 절벽으로 굴러떨어졌다. 3000미터가 넘는 절벽에서의 추락으로 수송 차량의 연료 탱크가 파열되었다. 사라는 절벽으로 달려갔다. 수송 차량은 불타오르고 있었고, 그 사이로 마이클의 끔찍한 비명소리가 들려왔다.<br><br>그날 오후, 그들은 추도식을 열었다. 그리고 그날 밤, 가브리엘은 쉽게 잠들 수 없었다. 갑작스러운 호흡 장애로 잠에서 깼다. 그의 숨이 짧아지면서 그의 눈은 점점 커졌다. 그는 손으로 목을 부여잡았다. 주거지에 전력이 공급되고 있지 않아 산소가 부족해진 것이다. 그는 필사적으로 어두운 복도를 비틀거리며 마지막 힘을 다해 수동으로 비상문을 열어 살아남을 수 있었다.<br><br>그러나 그의 동료 6명은 그처럼 운이 좋은 편이 아니었다. 생명 유지 장치와 환기 시설의 고장으로 동료들은 침대 위에서 질식사했다. 오직 의료 담당자인 드미트리만이 사라를 구하기 위해 사용했던 산소 탱크를 근처에 보유하고 있었던 덕분에 간신히 살아남았다.<br><br>그날 오후, 게이브는 사라에게서 조난 호출을 받았다. 그러다 갑자기 송신이 끊겨버렸고 가브리엘은 그녀를 찾으러 주거지를 빠져나왔다. 그는 반쯤 지어진 식량 허브 근처에서 머리통이 없어진 채로 훼손된 그녀의 시체로 이어진 혈흔을 발견했다. 게이브는 첫 구역 스캔에서 놓친 어떤 위험한 포식자가 있을 것이라고 추론했다.<br><br>식민지 허브로 돌아온 가브리엘은 최초 정찰에서 무엇을 놓쳤는지 알아보기 위해 메인 서브에 접속하여 일지를 살펴보았다. 그러나 그가 찾은 것은 큰 문제였다. 헉스-A7 중 한 대가 수송 차량을 장악하고 상륙용 주종의 생명 유지 장치를 끊은 것이다.<br><br>가브리엘은 오류가 난 헉스를 찾기 위해 영내를 수색했고 복제 허브에서 그를 찾아냈다. 로봇은 피에 뒤덮인 모습을 하고 있었으며, 그의 손에는 과학 담당관의 머리통이 쥐어져 있었다. 헉스는 DNA를 추출하여 새로운 무언가를 만들고 있는 듯했다.<br><br>바로 새로운 육체.<br><br>게이브는 즉시 로봇에게 작동 중지를 명령했지만, 로봇은 그의 말을 듣지 않았다. 그는 로봇의 소스코드에 오류가 생겼다고 생각했지만, 그가 스캐너를 메모리 코어에 꽂았을 때, 그는 원래의 코드가 생전 처음 보는 이해할 수 없는 외계어로 쓰여진 코드로 대체되었음을 발견했다.<br><br>분명히, 헉스는 재교정이 필요했다. 하지만 게이브가 교정 작업을 수행하려 하자, 헉스는 모든 장비를 태워버릴 고전력을 방출했다. 게이브가 로봇의 전원 공급 장치를 제거하려고 시도하자, 헉스는 그의 목을 움켜쥔 뒤 실험실 반대편 30미터 멀리 던져버렸다.<br><br>시끄러운 소동에 드미트리는 실험실 안으로 달려들어왔고 게이브에게 다가오는 헉스를 보았다. 그는 오류 도구를 비활성화하는 코드를 소리치며 헉스에게 전원 종료를 명령했지만, 헉스는 천천히 몸을 돌려 드미트리에게 다가왔다. 헉스는 소리치는 의료 담당자를 잠깐 응시하곤 주먹을 날려 그의 가슴 한가운데 구멍을 내고 그의 몸속에서 박동치는 심장을 꺼냈다. 의료 담당자는 그 자리에서 죽음을 맞았고 헉스는 그의 피를 뽑아 자신의 설계에 집어넣었다.<br><br>가브리엘은 빠르게 정신을 다잡고 외계의 어느 숲을 통과해 연료 허브로 질주했다. 그곳에서 그는 기다란 쇠파이프를 찾은 다음 몸을 숨겼다. 그리고 기다렸다.<br><br>그러나 헉스는 나타나지 않았다.<br><br>해가 산 뒤로 넘어가고 날이 저물자, 게이브는 체온 저하로 온몸을 떨기 시작했다. 세찬 바람이 부는 소리가 문틈 사이로 들렸고, 잠시 후, 덜컹거리는 문 소리와 함께 헉스가 나타났다.<br><br>헉스는 자신을 위한 새로운 육체를 만들었다. 기계의 일부는 인간의 살점이 붙어있었고, 일부는 실리콘이, 그리고 인간의 팔다리가, 또 다른 일부는 금속 기계로 구성되어 있었다. 거대하고 강한 힘을 가진 존재. 아름답고...<br><br>고대의 신 같은 전지전능함.<br><br>가브리엘은 또다시 도망을 시도했지만, 헉스는 그가 움직이는 소리를 놓치지 않고 그를 수소 발전기 뒤에 가두었다.<br><br>꼼짝 못 하게 된 게이브는 액체 수소 연료 탱크를 발견하고 파이프를 사용하여 밸브를 부수었다. 헉스의 정신이 팔린 사이 게이브는 재빨리 탈출했고, 도망갈 땐 파이프로 문을 타격해 연료에 불을 붙였다. 화염은 탱크로 되돌아갔고 허브는 곧바로 거대한 불덩어리로 변해 폭발했고 헉스의 발아래를 날려버렸다.<br><br>게이브는 초원을 가로질러 숲으로 달려갔다. 뒤를 돌아봤을 때, 그는 불길과 연기 속에서 걸어 나오는 헉스를 보았다. 헉스가 불타고 있다. 녹아내리고 있다. 삐걱거리며, 변형된 그의 모습은 마치 끔찍하고 화가 나있는...<br><br>고대의 신 같았다.<br><br>우거진 숲은 달의 빛을 막아주었고 헉스가 그를 발견하기 전에 게이브는 짙은 안갯속으로 달려들어갔다.<br><br>그를 소모하고.<br><br>그를 흡수했다.","perks":["S37P01","S37P02","S37P03"],"dlc":"Umbra"},{"id":"S38","ko":"니콜라스 케이지","en":"Nicolas Cage","d":"니콜라스 케이지는 평생의 역할에 갇힌 슈퍼스타이다.<br><br>그의 개인 기술인, <b>극작법<\/b>, <b>연기 파트너<\/b> 및 <b>플롯 트위스트<\/b>를 사용해 그는 빠르게 탈출을 하고 살인마의 오라를 보며, 죽은 척을 할 수 있다.","story":"수많은 수상. 박스 오피스에서의 수십억 달러 흥행. 전 세계 곳곳에서 촬영된 100편이 넘는 영화들. 배우 니콜라스 케이지는 모든 것을 해냈고, 모든 것을 보았다.<br><br>아니, 보았다고 생각했죠.<br><br>그의 책상을 가로지르는 마지막 대본은 완전히 새로운 것이었다. 저 아래 너머. 그가 대본에 단어 하나하나, 그리고 각 장의 페이지를 곰곰이 생각하면서 닉은 점점 더 혼란스러워졌다. 마치 대본이 그의 모든 것을 집어삼키는 것 같았다. 그는 어두운 신전의 큰 제단 앞에 무릎을 꿇고 있는 자신의 모습을 볼 수 있었다. 그는 바로 그 제단 위에 피로 물든 고대의 상징물들을 그리면서 손끝에 거친 돌을 느낄 수 있었다. 벽에서 빛이 나고 우르르 무너지자 우르릉거리는 소리가 그에게 들렸다.<br><br>니콜라스는 그의 소속사 직원을 황급히 불렸다. 해가 떠오를 때가 됐을 때, 그는 태평양 한가운데를 건너는 전용기에 올라타 있었다. 소속사는 니콜라스에게 '저 아래 너머'가 의심스러운 금융가들의 지원을 받고 있다고 경고했었다. 그리고 니콜라스는 상관하지 않았죠. 그는 무임금으로 그 영화를 찍을 의향이 있었지만, 소속사는 그에게 그 영화에서 손을 떼라고 설득했다.<br><br>비행기가 착륙하고 니콜라스는 그가 도착한 이 바위섬이 그동안 봉쇄되어 있는지 궁금했다. 흙으로 된 활주로 옆에는 그가 인식하지 못한 로고가 새겨진 연구용 텐트가 있었다. 그가 전용기에서 내리자마자, 그는 무장한 경비원들에 의해 정부 요원처럼 깐깐해 보이는 백발의 여성인 저 아래 너머의 감독이 있는 곳으로 안내되었다. 감독의 이름은 폴린 스탬퍼.<br><br>스탬퍼 감독은 니콜라스를 자신의 차량에 태우고 함께 세트장으로 둘러보았고, 다른 두 대의 검은색 지프가 그들을 따라왔다. 흙길은 버려진 캠프를 지나 폭포의 가장자리를 따라, 울창한 숲이 우거진 계곡으로 되돌아갔다. 스탬퍼 감독은 니콜라스와 경호원들을 영화의 주요 장소인 고대 사원의 무너진 폐허가 있는 불길한 동굴로 안내했다.<br><br>그곳은 그가 사무실에서 대본을 있었을 당시 상상했던 곳도 완전히 똑같았다. 암흑의 사원. 본당 중앙에 있는 돌 제단. 빛이 발하길 기다리는 매끈한 벽들. 분출되길 바라는 벽들...<br><br>니콜라스는 바로 촬영에 들어갈 준비가 되어 있었다. 스탬퍼 감독은 그에게 촬영은 다음날 아침에 시작될 것이라고 부드럽게 상기시켰으나 니콜라스에게는 그 어떤 것도 들리지 않았다. 촬영팀들은 재빨리 소환되었고, 해가 지기 시작할 무렵, 니콜라스는 그가 듣고 싶어 했던 말을 들을 수 있었다:<br><br>액션!<br><br>니콜라스는 그의 대사를 한자의 실수도 없이 내뱉었다. 그의 혀에서 쉽게 굴러 떨어진 어두운 주문. 그는 빨간 잉크가 담긴 컵에 손가락을 담그고 돌 제단에 기호를 그렸다. 촬영장에서 이런 기분을 느껴본 적이 없다. 그리고…<br><br>니콜라스는 고개를 들어 신전 벽이 빛나는 것을 보았고, 그가 제단에 그린 것과 같은 기호들이 드러냈다. 니콜라스는 불빛은 특수 효과로, 영화 후반 작업 중 추가될 거라고 생각했다. 그러나 무언가 잘못됨을 느꼈다.<br><br>그는 벽으로 다가가 기호를 손으로 만졌다. 대본에 쓰여있는 것처럼. 그는 검은 안개가... 정말 암흑 같은 안개가 기호에서 피어올라 그의 팔을 감쌀 때 믿을 수 없다는 듯이 쳐다보았다. 그저 짓궂은 장난이라고 생각했다. 그는 스탬퍼 감독과 그녀의 촬영팀들이 그저 짓궂은 장난에 당하고 있는 자신을 바라보고 있길 기대하며 카메라 뒤를 바라보았다.<br><br>그러나 그들의 모습은 어디에도 보이지 않았다. 그리고 검은 안개가 그의 주변을 가득 채우고 있었다.<br><br>이게 진짜 일리 없어. 그저... 영화의 한 장면일 뿐일 거야.","perks":["S38P01","S38P02","S38P03"],"dlc":"Venus"},{"id":"S39","ko":"엘렌 리플리","en":"Ellen Ripley","d":"노스트로모의 준위, 엘렌 리플리는 유능하며 실용적이다. 그녀의 개인 기술인, <b>럭키 스타<\/b>, <b>화학물질 함정<\/b>, 그리고 <b>날렵함<\/b>으로 피웅덩이와 고통의 비명소리를 숨기고 살인마를 함정으로 느리게하고, 또 은밀히 달릴 수 있다.","story":"엘렌 리플리는 노스트로모호의 마지막 항해에서 준위로 근무했다. 미지의 외계 생명체가 승무원 중 한 명에게 달려 들었을 때, 그녀는 검역 프로토콜을 따르려고 시도했지만, 배에 배치된 AI의 MU/TH/UR이 다른 계획을 세웠기 때문에 그녀의 노력은 허사로 돌아갔다.<br><br>격리 프로토콜도 없이, 재난이 닥쳤다. 에이리언은 우주선의 선임 참모를 숙주로 삼아 그의 가슴을 뚫고 튀어나와 노스트로모의 뱃속으로 빠져나갔다. 외계 생명체는 성장을 계속하며, 리플리만이 남을 때까지 나머지 승무원들을 하나하나 제거했고 공포의 지배가 계속되었다.<br><br>혼자 남아 모든 희망을 잃은 리플리였지만, 그녀는 승무원의 고양이 존스를 구하고, 노스트로모에 자폭 장치를 설치하는 데 성공했다. 하지만 에이리언이 자신보다 한발 앞서 있다는 것을 깨닫지 못했다.<br><br>탈출용 우주왕복선은 광활한 우주를 지났고, 노스트로모라는 작은 빛의 반점이 팽창하는 오렌지색 불덩어리로 폭발했다. 우주왕복선이 요동치며 덜컹거렸고 노스트로모 호가 '무'로 사라진 후, 침묵이 흘렀다.<br><br>리플리는 국경으로 돌아가는 긴 여행을 준비하기 시작했는데, 갑자기 우주왕복선의 깊은 그림자 속에서 무언가가 움직였다. 바로... 에이리언.<br><br>조심스럽게, 리플리는 여압복을 넣어둔 사물함 쪽으로 몸을 기울였다. 그리고 나서, 에이리언이 그녀에게 다가가자, 그녀는 에어로크를 열어 외계 생명체를 차갑고 광활한 우주로 내쫓았다. 왕복선의 안전을 확보한 리플리는 상업 우주선 노스트로모 호에 대한 마지막 보고서를 기록하고 그녀의 초동면실로 들어갔다. 검은 잠안개가 슬며시 그녀를 휘감아 무겁고 피곤하게 만들었다. 그녀는 악몽에 눈을 감았지만... 눈을 떴을 때, 다른 악몽 속에 있었다.","perks":["S39P01","S39P02","S39P03"],"dlc":"Wormhole"},{"id":"S40","ko":"앨런 웨이크","en":"Alan Wake","d":"베스트 셀러 작가, 앨런 웨이크는 어둠을 밀어내는 것이 무엇을 의미하는지 알고 있다.<br><br>그의 개인 기술인, <b>빛의 챔피언<\/b>, <b>호재: 조명<\/b>, 그리고 <b>마감일<\/b> 기술로 손전등을 더 강력하게 만들고, 상자와 발전기를 드러내고, 스킬 체크의 빈도를 증가시킬 수 있다.","story":"13년 전, 베스트셀러 작가 앨런 웨이크는 불가사의한 정황 속에서 브라이트 폴즈 마을에서 사라졌다. 외부 세계가 아무 일 없이 흘러가는 사이, 앨런은 자신의 이야기가 살아나는 기이한 차원인 어둠의 공간에 갇혔다.<br><br>앨런은 타자기 앞에 앉아, 마치 오두막 창문 밖에 시간이 가만히 멈춰있는 것처럼 한 페이지, 한 페이지를 써 내려갔다. 그는 어둠의 공간으로부터 탈출할 수 있는 단 하나의 이야기를 쓰겠다는 희망으로 그의 마음의 가장 어두운 곳으로부터 공포와 악마들을 불러일으켰다. 그래야만 앨런은 현실 세계로 돌아와 그의 아내 앨리스와 재회할 수 있었다.<br><br>하지만 탈출의 기회는 전혀 오지 않았고, 글을 쓰는 영원한 시간이 흐른 후, 앨런은 한때 알던 삶으로 다시 돌아갈 수 있다는 모든 희망을 잃었다.<br><br>그 순간, 그는 무언가를 기억해 냈다. 그가 수년 전 나이트 스프링스라는 쇼를 위해 쓴 첫 대본 중 하나였다. 그가 \"깊은 밤\"라고 부르는 긴장감 넘치는 초자연적 스릴러 영화는 악몽 같은 세상에 갇힌 한 무리에 대한 내용이다. 그 에피소드는 그들 모두가 탈출하는 것으로 끝이 났다... 하지만 어떻게?<br><br>앨런은 에피소드의 결말을 떠올리기 위해 고군분투했다. 하지만 이미 나이트 스프링스에서의 그의 시간은 너무 오래된 일이 되어버렸고 어둠의 공간은 시간과 기억의 도둑이었다.<br><br>유일한 해결책은 앨런이 에피소드가 어떻게 끝났는지 떠올릴 때까지 필요한 만큼 많은 초안을 기억에서 재구성하는 것뿐이었다.<br><br>대본이 반복될 때마다 어둠의 공간이 앨런 주변을 바뀌면서 그를 극의 중심에 놓이게 만들었다. 그리고 실패한 모든 결말은 앨런을 오두막집과 타자기로 다시 데려왔다. 앨런은 좌절하지 않고 마음속으로 속삭이는 목소리처럼 결말이 그에게 올 때까지 몇 번이고 시도했다.<br><br>앨런은 최종 초고를 쓰고 검은 안개의 벽 앞에 서 있는 자신의 캐릭터들과 함께 있는 자신을 발견했다. 안개를 보자, 오싹함이 앨런의 등골을 오싹하게 만들었지만 에피소드의 결말에 가까워졌다는 것을 느꼈다. 그는 자신의 캐릭터들이 안개의 벽을 통과하는 것을 지켜보며 악몽 같은 세상을 뒤로했다.<br><br>앨런은 깨달음에 충격을 받아 벽을 응시했다. 에피소드는 애매모호한 느낌으로 끝났다. 캐릭터들은 집으로 돌아갔을까? 사랑하는 사람들에게 돌아갔을까? 앨런은 자신이 의도했던 바를 기억하지 못했다.<br><br>그는 시간을 되돌려 다시 시작하고 싶었다. 다시 한 번만 더 초고를 쓰고 싶었다. 그 생각이 머리를 스치자마자 그는 그것을 보았다. 안갯속 깊은 곳에서 희미한 빛이 깜박거리며 살아났다.<br><br>신호다... 집으로 가는 길. 이 모든 시간이 흐르고, 저기 그 빛이 있다. 바로 그의 앞에...<br><br>앨런은 깊고 떨리는 숨을 들이쉬고 안갯속으로 들어가 먼 곳의 불빛에서 눈을 떼지 않았다.","perks":["S40P01","S40P02","S40P03"],"dlc":"Zodiac"},{"id":"S41","ko":"세이블 와드","en":"Sable Ward","d":"세이블은 어둠과 그 안에 능력을 받아들이는 것이나 두려워하지 않았다.<br><br>그녀는 개인 기술인, <b>기도: 거미줄치기<\/b>, <b>그림자의 힘<\/b>, 그리고 <b>사악함<\/b>으로 수리 진행도의 속도를 높이고, 구급상자 없이 자가 치료할 수 있으며, 지하실 갈고리에서 탈출할 수 있다.","story":"세이블은 그녀가 입양됐다고 의심치 않았다. 그녀가 미친 듯이 활기 넘치는 엄마와 웃음이 많고 골프광 철부지 아빠 아들의 자식일 리는 없었다. 그리고 그들은 그녀를 이해하지 못했다. 사실 그린빌에 어느 누구도 그녀를 이해하지 못했어다. 미카엘라를 제외하곤. 그들은 3학년 때부터 변함없는 친구였다. 미카엘라를 만나기 전까진 세이블에겐 친구가 없었다. 그녀는 조랑말이나 인형 놀이, 테디 베어나 티파티에는 관심이 없었다. 그녀는 벌레, 도마뱀, 자전거 타기, 흙먼지 싸움을 좋아했다. 그녀가 가장 좋아하는 휴일은 할로윈이었고 8학년 때 머리를 보라색으로 염색했을 때 그녀가 제정신이라고 생각한 사람은 미카엘라뿐이었다. 세이블의 엄마는 분노했고 그녀의 아빠는 딸의 머리색이 바뀐지 알아채지도 못했다. 처음으로 쇼핑몰에 가서 귀를 뚫던 날, 그리고 그녀의 첫 번째 문신을 고르던 날, 미카엘라가 그녀를 도와줬다. 부모님이 절대 볼 수 없는 장소에 숨겨진 오컬트 기호를 새겼다. 하지만 미카엘라는 문신을 하는 것을 거부했다. 그녀는 미카엘라를 달콤한 말로 설득해 봤지만, 미카엘라는 꼼짝하지 않았다. 미카엘라는 세이블과는 달랐다. 세이블은 어두운 주술을 이해하고 즐겼다. 한편으로 문신은 그녀의 부모님과 선생님들을 놀라게 했기 때문이었고 다른 한편으로는 자신을 진정한 ‘나’로 느끼게 해주었기 때문이다. 어떤 사람들은 그녀가 자신을 보여주는 방식 때문에 그녀를 ‘고트’이라고 불렀다. 하지만 그녀는 그런 꼬리표를 좋아하지 않았다. 그녀는 공포 영화를 좋아했고 오컬트가 흥미진진하다는 것을 알게 되었다. 그녀는 오컬트를 이해할 수 있었다. 그녀는 부모님의 빛나는 따분한 세계에도 어두운 이면이 있다는 것을 알고 있었다. 그들은 자신들의 두려움에 맞서는 것이 두려웠고, 모든 것이 완벽한 것처럼 가식적으로 행동했으며, 영원히 행복한 삶을 누릴 거라고 생각했다. 하지만 세이블은 더 잘 알고 있었다. 죽음이 우리 모두를 쫓아다니고 있으며, 영원한 삶은 없다는 것을.<br><br>미카엘라는 세이블을 문스톤에 취직시켰다. 아마 이 마을에서 그녀를 유일하게 고용할 곳은 문스톤뿐이었을 것이다. 그녀는 지역 대학에서 수업을 들었고, 다락방에서 단파 라디오로 게릴라 라디오 쇼를 제작했다. ‘모든 것이 사악한 이 밤’은 세상의 어두운 이면에 관한 것이었다. 오컬트. 도시 전설. 공포. 그리고 종종 그린빌에 유일한 극장에서 볼 수 있는 공포 영화에 대해 미카엘라와 열띤 토론을 했다. 미카엘라는 그녀의 공포 이야기에 약간의 코미디를 가미하는 것을 좋아했지만, 세이블은 잔인한 요소를 추가하는 걸 좋아했다. 더 무섭게. 더 많은 유혈. 그녀는 고어를 즐겼다. 공포를 즐겼다. 아드레날린 분출을 느끼는 것을 좋아했다. 그리고 조금도 과장하지 않고, 그들의 토론은 재미있었다.<br><br>세이블은 쇼를 위한 영감을 찾을 때, 박해를 피해 탈출하는 사람들이 안식처로 마을을 설립한 초기 정착민들의 모든 동상과 묘비가 있는 묘지를 산책하곤 했다. 그녀는 자신의 쇼에서 종종 마을 역사에 대해 이야기했고, 기묘한 목격과 실종이 마을의 역사와 어떤 연관이 있다는 이론을 형성했다. 전화를 건 청취자 중 하나는 그 마을이 ‘틈’ 위에 지어졌다고 주장했다. 전화 건 사람은 이어서 틈이 세계들 사이의 ‘오버랩’이라고 표현했다. 또 다른 청취자는 틈이 잊혀진 악마들에게 바쳐진 고대의 사이비 종교에 의해 만들어졌다고 말했다. 그리고 틈을 고통과 두려움과 불행을 먹고 사는 고대 신을 위한 우주적 뷔페라고 정의했다. 심지어 어떤 청취자는 틈이 아니라, ‘미지의 존재’라고 부르며, 이를 감히 상상하는 사람들을 집어삼킨 불가사의한 존재라고 주장했다. 이 모든 이론들은 재미있고 고무적인 토론을 위한 것이었고, 그녀는 실제로 일어난 공포 이야기에 대해 논하는 것을 정말 좋았다, 단, 그 공포가 그녀의 삶을 집어삼키기 전까지...<br><br>어느 날 저녁 세이블은 문스톤의 연례 할로윈 축제에서 미카엘라에게 진짜 공포 이야기를 해달라고 부탁했습니다. “사람들을 겁먹게 할 진짜 공포 이야기를 해줘. 어린아이 장난치듯 깔짝대지 말고 공포를 받아들여. ‘미지의 존재’에 관한 이야기를 해줘. 그들이 상상할 수 있도록. 그 미지의 존재가 이 무대에 나타날 것이라고 믿게 해봐. 잠재적으로 죽음을 초래할 수 있는 쇼만큼 청중들을 두렵게 하는 것은 없잖아?” 미카엘라는 세이블의 아이디어를 듣고 웃음을 터트리며 세이블의 부탁을 거절했다. 그녀의 룸메이트와 또 다른 이야기를 작업하고 있었기 때문이었다.<br><br>하지만 미카엘라가 연기를 펼치는 동안 기묘한 검은 안개가 그녀를 데려갔고 세이블은 차가운 죄책감이 그녀의 목덜미를 잡는 것을 느꼈다. 그녀는 왠지 자신이 미카엘라를 죽음으로 보낸 것이라고 생각했다. 미지의 존재가 그녀를 데려갔을까? 그녀가 미지의 세계를 정의하려고 했던가? 그렇다면 그녀 룸메이트는 어떻게 됐는가? 그녀의 룸메이트도 실종됐다. 그러나 세이블은 미카엘라의 이야기가 미지의 존재에 관한 것이 아니라는 것을 깨달았다. 그것은 다른 것에 관한 것이었다. 다른 차원. 무서운 생명체, 가학적 살인자, 그리고 끝없는 공포로 가득 찬 차원...<br><br>이것들은 미지의 존재가 아니었다.<br><br>이를 깨달은 세이블은 그린빌에서 일어난 다른 실종 사건들을 조사하기 시작했다. 얼마 지나지 않아, 그녀는 대부분의 실종 사건들이 극장이나 근처 어딘가에서 일어났다는 것을 깨달았다. 더 조사를 진행한 후, 그녀는 극장이 1920년대에 땅에 불타버린 오래된 원룸 형태의 기숙사 폐허 위에 지어졌다는 것을 알아냈다. 정확한 사유는 모르나, 학생들은 빠져나오지 못했고 모두가 불길에 휩싸여 죽었다. 해답에 가까워진 그녀는 계속해서 조사를 이어나갔고, 두 명의 십 대 형제가 최근 극장에서 사라졌다는 것을 발견했다. 엘리아스와 엘란. 유일한 목격자인 그들의 여동생 엘렌은 눈을 뽑아버리고 한 기관에 헌신하며 살고 있었다. 그래서 세이블은 먼 친척 행세를 하며, 엘렌에게 말을 걸었다. 엘렌은 형제들과 함께 영화 스크린 뒤에 있는 보관실에서 오래된 영화 포스터를 훔치려 했다는 것을 인정했다. 그리고 그녀는 지하에 있는 비밀 문과 다른 장소로 이어지는 통로에 대해 설명했다.<br><br>“엄청 어두웠어요.”<br><br>“그리고 엄청 추웠죠.”<br><br>“사악한 장소에요.”<br><br>“거긴 절대 가지 마세요.”라고 엘렌은 사정했다.<br><br>하지만 세이블은 엘렌의 말을 따를 생각이 없었다.<br><br>이미 사건 안으로 발은 들어놓은 세이블이었다.<br><br>미카엘라를 다시 봐야겠다고 결심한 세이블은 극장으로 차를 끌고 갔다. 영화관 스크린 뒤에 있는 문을 쉽게 발견할 수 있었다. 어둠 속에서 그녀는 쇠지레로 문을 열고 삐걱거리는 지하실로 향하는 나무 계단을 내려갔다. 전등 스위치가 깜박거리며 망가진 극장 좌석과 80년 이전에 상영된 영화 포스터로 채워진 방을 밝혔다. 그녀는 드넓게 펼쳐진 지하를 뒤적였고 원작 프랑켄슈타인의 포스터 뒤에 숨겨진 두꺼운 나무로 된 문을 발견했다. 그녀는 문을 밀어 열었고 완벽한 어둠 속으로 내려가는 끝없는 원형 계단이 드러났다. 만년필형 손전등을 사용하여 길을 찾으며 그녀는 그 계단은 10분 정도 내려왔다. 그리고 얼마 지나 더 낮은 깊이에서 올라오는 차갑고 검은 안개를 알아챘다.<br><br>미카엘라를 데려갔던 차가운 검은 안개였다.<br><br>위험을 느낀 세이블은 다시 계단을 올라갈까 생각했지만 그녀는 무서운 괴물들과 가학적인 살인마들, 그리고 끝없는 공포에 대해 생각했고, 그녀는 가장 친한 친구가 모든 재미를 혼자 즐기게 내버려 두지 않기로 결정했다.","perks":["S41P01","S41P02","S41P03"],"dlc":"ApplePie"},{"id":"S42","ko":"아스트리 야자르","en":"Aestri Yazar","d":"아스트리, 동료 바드 베어마르, 그리고 그들의 곡예단은 모험을 포기하지 않았다.<br><br>그들의 개인 기술인, <b>반사된 환영<\/b>, <b>음유시인의 영감<\/b>, 그리고 <b>공허한 시선<\/b>으로 환영으로 생성하고, 다른 플레이어를 도와 발전기를 더 빨리 수리할 수 있으며, 주변에 살인마, 발전기 및 상자들을 볼 수 있다.","story":"아스트리와 베어마르는 지역주민들과 노래와 이야기를 교환하기 위해 그레이호크 자유 도시에 도착했다. 하지만 두 음유시인들이 방문하는 동안 배운 것은 그들을 마지막 모험으로 이끌었다.<br><br>현지인과 여행객들에 따르면, 전혀 다른 새로운 마법이 땅 전체에 퍼지고 있었다. 악의 세력들은 흔적도 없이 이 땅의 구석구석에서 사라지고 있었다. 그레이호크 전역에는 기쁨이 찾아왔지만, 아스트리와 베어마르는 다르게 느꼈다. 음유시인의 삶의 목적은 역경에 대한 승리를 축하하는 것이었다. 악이 없는 세상에는 새로운 노래가 만들어질 수 없을 것이다.<br><br>아스트리는 자신이 무엇을 해야 하는지 알고 있었다. 그녀는 자신과 베어마르가 이 낯설고 새로운 마법의 근원을 찾는 것을 도와줄 모험가를 찾아 술집과 도시의 뒷골목을 샅샅이 뒤졌다. 많은 이들이 왜 악을 다시 불러오려 하냐며 그녀의 제안을 거절했지만, 그녀의 재치와 매력은 모험을 떠날 주민들을 끌어모으기에 충분했다.<br><br>어중이떠중이 모험가들은 함께 늪지대와 산속을 여행했다. 모험가들이 사라진 악과 비밀리에 동맹을 맺고 있다고 믿는 사람들은 그들을 마을에서 쫓아냈지만, 음식이나 집, 그리고 가장 중요한 정보를 제공해 줄 만큼 친절을 베푸는 이들도 있었다. 베어마르는 모든 단서와 소문을 열심히 기록했고, 이 낯선 마법의 근원이 폐허에서 크고 강력한 고대 탑이 나타났다는 케오랜드 왕국 근처에 있어야만 한다고 결론지었다.<br><br>남쪽으로 향하는 동안 그들이 의심했던 것들이 확인됐다. 마을 사람들은 탑에 대해, 그리고 탑의 영주에 대해 쉬쉬하면서도 이야기를 멈추지 않았다. 그들은 리치 베크나의 근거지 타락한 탑을 향해 여정을 떠났다.<br><br>타락한 탑에 가까워질수록 공기 중에서 사악한 마법의 힘이 느껴졌다. 그들은 베크나와의 전투를 위해 몸을 단련했지만, 텅텅 비어있는 탑을 발견하고 충격을 받았다. 그들은 산산이 부서진 스테인드글라스의 창문을 지나 탑의 꼭대기에 도달할 때까지 나선형 계단을 올라갔다. 잔해 속에서, 아스트리는 급하게 쓰여진 두루마리를 발견했다.<br><br>베어마르는 아르카나에 대한 자신의 능숙함을 뽐내고 싶었다. 그는 두루마리를 자세히 살펴보았고, 그 단어들이 어떤 주문이라는 것을 깨달았다. 그가 큰 소리로 단어들을 말하자 탑이 우르릉거리기 시작했다. 검은 안개가 돌 바닥에서 스며나왔다. 아스트리는 베어마르의 암송을 막아 보았지만, 너무 늦었다. 안개가 모험가들을 사로잡았고, 그들은 곧 사라졌다..","perks":["S42P01","S42P02","S42P03"],"dlc":"Churros"},{"id":"S43","ko":"라라 크로프트","en":"Lara Croft","d":"라라 크로프트의 본능은 위험한 수많은 탐험에 연마되었다.<br><br>그녀는 개인 기술인, <b>수완<\/b>, <b>전문가<\/b> 및 <b>단련<\/b>을 사용하여 비명을 지르는 대신 살인마의 위치를 드러낼 수 있고 발전기를 더 효율적으로 수리하고, 더 빠르게 창문을 뛰어넘을 수 있다.","story":"어린 시절에도 라라는 끝없는 호기심에 이끌렸다. 고고학자이자 귀족이었던 그녀의 아버지 리처드 크로프트 경은 원정을 자주 떠났기에 그녀는 어린 나이에 자립하게 되었다.<br><br>그녀가 그녀의 가장 친한 친구인 사만다 니시무라를 만난 곳은 대학교였다. 사만다는 라라에게 학교와 박물관의 조용한 홀을 너머 삶의 재미를 즐기며 경험하라고 격려하곤 했다.<br><br>야마타이 섬으로 고고학 탐험을 갈 기회가 생겼을 때, 라라는 그 기회를 놓치지 않았다. 그녀의 멘토인 콘래드 로스는 그녀와 사만다가 탐험에 합류할 수 있도록 도왔다. 그들이 섬에 도착하기 바로 직전, 모든 계획이 틀어졌다. 배는 폭풍우를 만나 두 동강이 났고, 탐험대는 섬의 해안에 뿔뿔이 흩어지게 되었다. 라라는 섬을 장악한 범죄 조직인 솔라리 형제단의 추적을 피하면서 선원들을 찾기 위해 고군분투했다. 그녀는 마티아스라는 섬 주민과 함께 사만다를 찾았지만, 라라가 다시 기절한 동안, 그들이 실종되었다.<br><br>그녀가 사만다의 행방을 쫓는 도중, 그녀는 형제단이 고대 여왕을 소환하여 그녀의 영혼을 담을 인간을 찾고 있다는 것을 알게 되었고, 마티아스의 말로 사만다가 그 인간이 확신하게 되었다. 라라가 마침내 폭포 아래의 동굴에 있는 그들을 찾아냈을 때, 그들은 사만다를 화로에 묶어, 그녀가 여왕의 영혼을 담을 수 있는 자인지, 아니면 단순히 불에 타 죽을 필멸의 운명인지 시험하기 위해 준비하고 있었다.<br><br>사만다를 구하기 위한 필사적인 시도로, 라라는 횃불을 향해 화살을 쏘았다. 그러나 그녀는 수적으로 열세했다. 위치가 발각된 그녀는 즉시 형제단에 붙잡히고 말았다. 보초 두 명이 그녀를 돌다리로 데려가자 기이한 검은 안개가 그들을 감쌌다. 보초들이 안개로 당황한 틈을 타 그녀는 피의 강으로 뛰어들었다.<br><br>물속으로 서서히 가라앉는 동안, 수십 개의 팔다리가 그녀를 향해 손을 뻗어 그녀를 붙잡았다. 활을 찢고 그녀를 강 아래로 당겼다. 마치 강에 살아있는 것 같았다. 그녀는 필사적으로 발을 차며 수면 위로 올라가려 발버둥 쳤다. 마침내, 그녀는 역겨운 피의 강에서 기어 나왔다. 하지만 완전히 새로운 악몽에 빠져있는 자신을 발견하고 만다.","perks":["S43P01","S43P02","S43P03"],"dlc":"Donut"},{"id":"S44","ko":"랄프 C 벨몬드","en":"Trevor Belmont","d":"뱀파이어 사냥꾼인 랄프 C 벨몬드는 자신의 운명이 악을 물리치는 것임을 알 수 있다. 그의 개인 기술인 <b>벨몬드의 눈<\/b>, <b>의기양양<\/b>, 그리고 <b>영광의 순간<\/b>으로 살인마의 오라를 볼 수 있고 아이템의 희귀도를 높일 수 있으며 건강 상태를 1단계 올릴 수 있다.","story":"1476년, 공포가 루마니아 시골 지역을 휩쓸었다. 신화와 전설의 몬스터들이 그 밤을 지배했다. 어떤 이들은 불멸의 영혼을 영원한 생명과 맞바꾼 신비한 귀족... 드라큘라 백작의 명령을 받았다고 말했다. 포위된 마을 사람들은 랄프 C 벨몬드에게 자신들을 구해달라고 간청했다. 랄프는 그의 조상들처럼 초자연적인 힘을 가지고 있었다. 그런 능력들 때문에, 왈라키아 사람들은 그를 두려워하고 기피했다. 그러나 이제 더 큰 위협에 직면하게 되면서, 겁에 질린 사람들은 그에게 이 사악한 생명체를 처치해 달라고 간청했다. 랄프는 자신 내면의 악마들과 씨름할 때에도 드라큘라의 부하들을 파견했다. 그는 백작의 알현실에서 백작과 직면 맞섰고, 자신의 조상들이 물려준 강력한 채찍을 사용하여 그를 물리쳤다. 뱀파이어 살인마가 되었다.<br><br>마침내 괴물이 죽자 랄프는 여전히 그를 공포의 대상으로 여기던 일반 사람들로부터 멀리 떨어진 언덕에 있는 작은 집으로 물러났다. 몇 년 후, 그의 소박하고 평화로운 삶에 어둠이 침입했다. 언데드의 악몽이 그를 공포로 가득 채웠다. 인근 마을에서 의문의 실종 사건이 일어났다는 소문을 듣게 된 그는 나이트워커가 돌아왔을까 봐 걱정했다. 그는 조사를 시작했고, 밤에 찾아온 차갑고 검은 안개의 속삭임을 들었다. 그리고 이 악이 뭔가 다른 것이 아닐까 의심하기 시작했다. 어둡고 똑같이 위험한 무언가였다. 갑작스러운 불길한 예감이 그를 공포로 가득 채웠다. 가족이 위험에 처한 것은 아닐까? 서둘러 집으로 돌아오던 길에 그는 땅에서 자욱한 검은 안개가 피어오르며 황량해진 마을을 발견했다. 그는 채찍에 손을 뻗었지만 채찍은 이미 사라졌다. 상황을 깨닫기도 전에 그는 자신이 끝없는 어둠의 암울하고 무서운 차원에 있는 자신을 발견했다.","perks":["S44P01","S44P02","S44P03"],"dlc":"Eclair"},{"id":"S45","ko":"타우리 카인","en":"Taurie Cain","d":"타우리 카인은 블랙 탈론의 추종자로 키워졌으며, 희생 제물이 되는 상황에 처해졌다.<br><br>그녀는 개인 기술인, <b>기도: 신뢰할 수 없는 까마귀<\/b>, <b>돌연 중단<\/b>, 그리고 <b>부담 감당<\/b>으로 살인마의 오라를 드러내고 치료 불능 후 치료되며 다른 생존자의 갈고리 상태를 이어갈 수 있다.","story":"타우리 카인은 글래스고 외곽 교외에서 오빠 이완과 함께 태어나고 자랐다. 스코틀랜드에선 홈스쿨링이 드문 케이스였지만 이 아이들은 홈스쿨링을 받았고, 겉보기에 모든 면에서 완벽하게 평범해 보였다.<br><br>하지만 진실은... 전혀 평범하지 않았다.<br><br>그녀의 부모님은 비밀 결사의 일원이었고 타우리와 이완은 같은 은밀한 사이비 종교의 추종자로 자랐다.<br><br>블랙 탈론의 신봉자들로...<br><br>이 미스터리한 모임은 수 세기 동안 존재해 왔으며 다른 차원에 존재하는 고대 신을 숭배한다. 그들은 이 신을 블랙 탈론이라고 부르며 인류가 인간의 존재를 초월하는 데 어떤 식으로든 도움이 된다고 믿는다.<br><br>빈센트 카인은 고고학 교수였다. 레이첼 카인은 인류학을 가르쳤다. 가족 휴가로 그들은 전 세계를 여행했다. 하지만 테마파크 대신 고대 문명의 역사적인 유적지를 방문했다. 예를 들어, 고대 사이비 교도들이 머리통의 살점을 끓이고 두개골에 신비한 상징을 새긴 튀르키예의 괴베클리 테페에 있는 세계에서 가장 오래된 거석 유적지 같은 곳을 다녔다.<br><br>이와 같은 장소에는 블랙 탈론의 영역과 겹치는 영역이 있었는데, 그 영역을 블리드라고 불렀으며, 비밀 지식과 기술은 발견될 진보된 세계의 승천한 신봉자들에 의해 숨겨져 있다고 믿었다.<br><br>그러나 블리드는 신체적, 정신적으로 많은 위험을 안고 있으며, 그 안으로 들어가는 사람들은 이런 위험에 대비해 특수한 방탄 방호복을 입지만, 실제로 그 방호복이 얼마나 많은 보호를 제공하는지는 아무도 모른다.<br><br>블랙 탈론의 신봉자들은 그들이 발견한 각 블리드 근처에 거주 공간, 보관 구역, 연구실이 완비된 지하 단지를 건설했다. 빈센트 카인이 괴베클리 테페의 블리드에 들어갔을 때, 타우리와 이완은 아직 어린아이들이었다. 그리고 남편이 돌아오지 않자, 그의 아내도 남편을 쫓아 사라졌다.<br><br>부모님을 찾기 위해 필사적으로 방에 들어갔던 타우리와 이완은 얼마 지나지 않아 방에 숨어 들어갔지만, 곧 방호복이 얼마 남아 있지 않다는 것을 깨달았다. 공기 튜브가 연결된 오래된 잠수복처럼 자신에게 맞지 않는 원래 슈트는 단 한 벌뿐이었다. 그러나 그녀는 부모님을 버리지 않고 슈트 없이 블리드에 들어가기로 결정했다.<br><br>이완은 너무 두려웠기에 여동생을 따라갈 수 없었다.<br><br>타우리는 블리드에서 광기를 발견했다. 야만과 공포를... 피가 얼어붙는 비명과 사나운 으르렁거림, 그리고 그림자 속으로 미끄러져 들어가는 무언가. 그녀는 두 현실이 하나로 합쳐지는 이 기이하고 시대를 초월한 장소에서 포식자들이 자신을 사냥한다는 것을 느낄 수 있었다.<br><br>두려움을 억제하기 위해 고군분투하던 그녀는 피비린내 나는 방호복 조각을 발견했다. 시체는 찾을 수 없었지만 머리카락 한 덩어리와 살덩어리, 그리고 김이 모락모락 나는 내장만이 남아 있었다.<br><br>100피트 떨어진 곳에서 그녀는 아버지를 발견했다. 그의 방호복은 손상되지 않았지만 의식이 없었다.<br><br>그녀는 포식자들이 그림자 속에서 그녀를 쫓는 동안에도 그를 옮기기 위해 애썼다. 그들이 가까이 다가오자, 그녀의 오빠 이완이 갑자기 낡고 큰 방호복을 입고 나타났다. 그는 이계의 생명체들을 유인해 타우리가 아버지를 안전한 곳으로 옮길 수 있을 만큼 충분한 시간을 벌어주었다.<br><br>그녀의 오빠의 비명소리가 여전히 그녀의 귀에 맴도는 중에도, 그녀는 필사적으로 정신을 부여잡으며 블랙 탈론의 신봉자들을 놀라게 했다. 그녀의 아버지는 결국 부상에서 회복되었지만 다시는 블리드에 뛰어들지 못했다.<br><br>타우리에게는 블리드에서 보낸 시간 동안 아무런 나쁜 영향도 받지 않았다. 적어도 육체적인 영향은 없었다. 하지만 어두운 무언가가 그녀의 마음을 건드렸다. 그녀는 이타적인 신봉자들이 사냥을 하고 블랙 탈론에게 제물을 바치는 모습을 여러 번 보았다. 그녀는 자신의 환상이 어떠한
