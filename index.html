<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="데드 바이 데이라이트 기술·애드온·아이템·공물·캐릭터 한국어 검색 도감">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>안개 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky search bar over a two-pane field guide — results list left, entry detail right; on phones the detail slides over as a sheet. */
:root{
  --bg:#f3f2f4; --surface:#ffffff; --sunk:#e8e6ea; --line:#d6d2da;
  --fg:#1d1a20; --muted:#6a6470; --accent:#8e1f2c; --accent-fg:#ffffff; --hl:#7a1724;
  --r0:#8a6a4c; --r1:#b8901c; --r2:#3f8a3a; --r3:#7d48ad; --r4:#c0346e; --r5:#c26a12; --t1:#9a7400; --t2:#2f7d2a; --t3:#7a3fb0;
  --sv:#2d6c8f; --kl:#8e1f2c;
  --f-display:"Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131116; --surface:#1c1920; --sunk:#25212a; --line:#36303d;
  --fg:#ebe7ee; --muted:#9a93a1; --accent:#c8434f; --accent-fg:#160c0e; --hl:#f08a92;
  --r0:#a98663; --r1:#d8b23e; --r2:#62b357; --r3:#a777d6; --r4:#e2609a; --r5:#e8913a; --t1:#e3bd45; --t2:#6cc561; --t3:#b98ae6;
  --sv:#6bb1d6; --kl:#e0626c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131116; --surface:#1c1920; --sunk:#25212a; --line:#36303d;
  --fg:#ebe7ee; --muted:#9a93a1; --accent:#c8434f; --accent-fg:#160c0e; --hl:#f08a92;
  --r0:#a98663; --r1:#d8b23e; --r2:#62b357; --r3:#a777d6; --r4:#e2609a; --r5:#e8913a; --t1:#e3bd45; --t2:#6cc561; --t3:#b98ae6;
  --sv:#6bb1d6; --kl:#e0626c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
.brand .ver{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.searchrow{display:flex;gap:8px}
.sbox{flex:1;min-width:0;position:relative}
.sbox input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 40px 0 14px;font-size:16px}
.sbox input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.clear{position:absolute;right:6px;top:7px;width:32px;height:32px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;border-radius:8px}
.charsel{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:42%;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.65;margin-left:4px}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.meta{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;width:100%}
.row:hover{background:var(--sunk)}
.row[aria-selected="true"]{background:var(--surface);border-color:var(--line)}
.row .nm,.row .en{display:block}
.row .nm{font-weight:600;font-size:15px;line-height:1.3}
.row .en{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tag{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.row .tag b{display:block;font-weight:500;color:var(--fg);font-size:12px}
.more{margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px dashed var(--line);background:none;cursor:pointer;color:var(--muted)}
.empty{padding:28px 10px;color:var(--muted)}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:2px}

/* glyphs: perks are diamonds, add-ons are squares, characters are circles — the shapes the game itself uses */
.g{width:36px;height:36px;display:grid;place-items:center;position:relative;flex:none}
.g span{position:relative;z-index:1;font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--fg)}
.g::before{content:"";position:absolute;inset:5px;border:2px solid var(--c,var(--muted));background:color-mix(in srgb,var(--c,var(--muted)) 16%,var(--surface))}
.g.perk::before{transform:rotate(45deg);inset:6px}
.g.addon::before{border-radius:4px}
.g.char::before{border-radius:50%;inset:3px}
.g.big{width:64px;height:64px}.g.big span{font-size:24px}.g.big.perk::before{inset:10px}

.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-height:calc(100vh - 170px);overflow:auto;min-width:0}
.dhead{display:flex;gap:16px;align-items:center}
.dhead h2{font-family:var(--f-display);font-size:26px;font-weight:800;margin:0;line-height:1.2;text-wrap:balance}
.dhead .en{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.pill{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--sunk);border:0;cursor:default}
button.pill{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pill.r{color:var(--bg);background:var(--c)}
.desc{margin-top:14px;max-width:62ch}
.desc li{margin:4px 0 4px 18px;list-style:"– "}
.desc em{font-style:normal;font-weight:600;color:var(--hl)}
.num{font-weight:700;color:var(--hl);font-variant-numeric:tabular-nums;white-space:nowrap}
.tier{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tier i{font-style:normal}
.tier .t1{color:var(--t1)}.tier .t2{color:var(--t2)}.tier .t3{color:var(--t3)}
.tier .sl{color:var(--muted);font-weight:400;margin:0 1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:9px;height:9px;border-radius:2px;display:inline-block}
.desc b{font-weight:600}
.flavor{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-family:var(--f-display);font-size:14px;color:var(--muted);max-width:62ch}
.sec{margin-top:22px}
.sec h3{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px}
.mini{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;min-width:0}
.mini:hover{background:var(--sunk)}
.mini .g{width:28px;height:28px}.mini .g span{font-size:11px}
.mini .t{font-size:13.5px;line-height:1.3;min-width:0}
.links{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.links a{font-size:13px;color:var(--accent);text-underline-offset:3px}
.back{display:none;border:0;background:none;color:var(--muted);padding:0 0 12px;cursor:pointer;font-size:14px}
.note{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px;margin-bottom:12px}
.hint{color:var(--muted);font-size:14px}
.hint kbd{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:4px;padding:1px 5px}

@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;inset:0;top:0;z-index:20;border-radius:0;border:0;max-height:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 30px);transform:translateX(100%);transition:transform .22s ease}
  .detail.open{transform:none}
  .back{display:block}
  .brand h1{font-size:20px}
}
@media (prefers-reduced-motion:reduce){.detail{transition:none}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>안개 도감</h1><span class="ver">DEAD BY DAYLIGHT · 게임 데이터 v<span id="ver"></span></span></div>
    <div class="searchrow">
      <div class="sbox">
        <input id="q" type="search" placeholder="기술·애드온·캐릭터 검색 (ㅈㄱㅅㄱ, dead hard, bbq…)" autocomplete="off" aria-label="검색">
        <button class="clear" id="clr" aria-label="검색어 지우기" hidden>×</button>

</main>

<script id="data" type="application/json">{"version":"10.1.2","killers":[{"id":"Chuckles","ko":"트래퍼","en":"The Trapper","d":"능력 : <b>곰덫<\/b><br><br>곰덫을 설치할 수 있다. 곰덫을 밟은 생존자는 부상한 상태가 되고, 자리에서 움직이지 못하게 된다.희생제가 시작될 때 1개의 곰덫을 가지고 시작한다.5개의 곰덫이 맵 내에 무작위로 놓여있다.파괴 공작된 곰덫은 3분 후에 자동으로 재생성된다.전승 기술 : <b>불안한 존재, 짐승 같은 힘, 동요<\/b>","story":"에반 맥밀란은 자신의 아버지, 아치 맥밀란을 우상으로 여겼다. 막대한 재산의 상속자이기뿐만 아니라, 그의 아버지가 사유지를 운영하는 방법 때문이었다. 에반은 자신의 밑에서 일하는 노동자들을 통제하고 감시하는 역할을 맡았다. 아버지와 아들의 통제 아래에서 맥밀란 사유지의 생산성은 항상 높았다. 하지만 아치 맥밀란의 건강과 정신 상태가 점점 나빠지자, 에반은 아버지의 재산을 노리는 무리로부터 아버지를 보호해야 했다. 아버지가 무엇을 요구하든지 에반은 따를 것이다.<br><br>마침내 아치가 완전히 이성을 잃었을 때, 에반은 현대 역사상 가장 최악의 대량 학살을 저지르고 말았다. 에반은 수백명의 노동자들을 어두운 광산에 밀어 넣고, 폭파했다. 맥밀란 사유지에서 일어난 이야기는 재산과 힘을 가지고 있는 자들이 그릇된 생각을 가지고 있으면 어떤 비극이 벌어지는지 잘 보여주고 있다. 그 이후, 에반의 아버지가 자신의 창고 지하실에서 죽은 채로 발견되었다는 것 말고 다른 에반 맥밀란에 대한 기록은 전해지지 않는다.","perks":["Agitation","Brutal_Strength","Unnerving_Presence"],"dlc":null,"power":{"ko":"곰덫","en":"Bear Trap","d":"발이 걸리면 도망치지 못하도록 철로 만들어진 큰 곰덫. 곰덫들은 희생제 무대의 아무 데나 놓여 있으며, 집어서 어디든 설치할 수 있다.<br><br><b>곰덫<\/b><br><br>초기화가 되면, <b>2개의 곰덫<\/b>을 보유한 채 희생제를 시작한다. 주변을 탐색하여 더 많은 곰덫을 찾아 수집할 수 있다.<br><br><b>곰덫 설치:<\/b><br><br><i>능력 버튼<\/i>을 길게 눌러 알맞은 위치에 <b>곰덫<\/b>을 설치할 수 있다. <b>곰덫<\/b>을 밟은 플레이어는 제대로 움직일 수 없다. 건강한 상태의 생존자가 <b>곰덫<\/b>을 밟으면 부상 상태가 되지만 탈출을 시도해볼 수 있다. <i>상호작용 버튼<\/i>을 눌러 <b>곰덫<\/b>에 걸린 주변 생존자를 둘러업을 수 있다.<br><br><b>덫 초기화:<\/b><br><br>곰덫이 아직 설치가 되지 않은 경우, <b>곰덫<\/b> 주변에 서서 <i>능력 버튼<\/i>을 길게 눌러 원래 위치에 초기화할 수 있다.<br><br>곰덫을 설치 및 재설치하면 트래퍼에게 <b>5초<\/b> 동안 <b>7.5%의 이동 속도 증가<\/b> 효과가 부여된다.<br><br><b>곰덫 수집:<\/b><br><br><b>곰덫<\/b> 주변에서 <i>상호작용 버튼<\/i>을 눌러 곰덫을 수집할 수 있다. 초기화가 되면, 어떤 경우에도 최대 <b>2개의 곰덫<\/b>을 보유한 채 시작하게 된다."}},{"id":"Bob","ko":"레이스","en":"The Wraith","d":"능력: <b>통곡의 종<\/b><br><br>일정 시간 동안 거의 보이지 않는 은신 상태가 될 수 있다.은신 상태일 때 이동 속도가 빨라진다.은신 상태에서 사물과 상호작용은 할 수 있으나, 생존자를 공격할 수는 없다.전승 기술: <b>포식자, 집요한 사냥개, 그림자의 피조물<\/b>","story":"필립 오조모는 새로운 시작을 하겠다는 희망을 가지고 이 나라에 도착했으며, 운 좋게도 오토헤븐 폐차장에 취업해 생계를 꾸려나가고 있었다. 무슨 연유에선지 그의 직장은 뇌물을 받은 경찰의 묵인하에 영업하고 있었지만, 오조모는 신경 쓰지 않았다. 그의 모국에서도 많은 범죄를 봐 왔기 때문에, 자신과 관련이 없다면 상관하고 싶지 않았다. 오조모는 그저 차를 고치고, 분쇄하는 것에 집중했다. 이것들은 그가 매우 잘하는 일이었다. 차를 넣으면, 작은 사각형 모양의 고철이 나온다.<br><br>어느 흐린 날, 오조모는 아직 분쇄되지 않은 차에서 피가 흐르고 있는 것을 발견했다. 거기엔 손발이 묶인 채 공포에 질려 벌벌 떨고 있던 청년이 있었다. 무슨 일인지 영문을 모르던 오조모는 그 남자를 풀어줬으나, 그의 상사는 도망치던 남자를 붙잡아 목을 벴다. 오토헤븐 폐차장은 의뢰를 받은 이들을 증거 없이 처리하는 곳이었고 오조모는 자기도 모르게 '처형자'로 일해왔다는 충격적인 사실을 전해 듣는다. 분개하여 이성을 잃은 오조모는 그가 여태까지 했던 것처럼 그의 상사를 차에 집어넣어 천천히 분쇄기로 갈아버렸다. 아자로프의 신체 일부가 기계에 걸리자 오조모는 아자로프의 머리를 척추째로 뽑아버렸고, 그 이후 그곳을 떠난 오조모의 모습을 본 이는 아무도 없었다고 한다.","perks":["BloodHound","Predator","Shadowborn"],"dlc":null,"power":{"ko":"통곡의 종","en":"Wailing Bell","d":"고대의 힘을 불어넣은 주철로 만든 종. 레이스가 종을 치면 영적 세계로 이동할 수 있다.<br><br><b>통곡의 종<\/b><br><br><i>능력 버튼<\/i>을 길게 눌러 <b>은신<\/b>할 수 있다. <i>능력 버튼<\/i>을 다시 누르면 <b>은닉 해제<\/b>할 수 있으며, 은신 상태에서는 <b>1초<\/b> 동안 이동 속도가 빨라진다. 생존자는 통곡의 종은 <b>24미터<\/b> 안에서 들을 수 있다.<br><br><b>은신:<\/b><br><br>은신 중인 <b>레이스<\/b>의 이동 속도가 약간 증가하고 거의 보이지 않게 되며, <b>감지 불가능<\/b> 상태 효과를 획득한다. 은신 상태에서 <b>레이스<\/b>는 공격을 멈추지만, 주변 사물과 상호 작용은 가능하다. <b>레이스<\/b>가 밝은 빛에 노출되면 자동으로 <b>은닉 해제<\/b>된다."}},{"id":"HillBilly","ko":"힐빌리","en":"The Hillbilly","d":"능력 : <b>전기톱<\/b><br><br>전기톱을 작동시킨 후 빠르게 질주한다.질주를 시작한 직후 잠시 동안은 방향 전환이 쉽다.전기톱으로 질주하는 동안에는 방향 전환이 어려워진다.전기톱에 타격당한 생존자를 빈사 상태로 만든다.전승 기술 : <b>인내심, 빛의 피조물, 땜장이<\/b>","story":"부유한 대지주인 맥스와 에블린 톰슨의 아들로 태어난 힐빌리는, 부모가 원하지 않는 자식이었으며, 부모는 이름도 지어주지 않았다. 아들의 존재를 부끄러워했던 부모에 의해 방에 감금되었으며, 벽에 난 작은 구멍으로 음식을 받아먹어야만 했다. 그 소년이 마침내 탈출하였을 때, 자신을 키워주는 대신 고문했던 부모를 잔인하게 도살하여 복수했다.<br><br>하지만 그 후에도 그의 광기는 멈추지 않았고, 농장에서 살면서 가축들을 도살했다. 결국 그는 자신의 족쇄로부터 탈출해, 옥수수밭을 달리며 눈앞에 보이는 모든 것을 잔인하게 학살했다. 이후 고문받아 내장이 모두 꺼내진 동물들의 사체가 농장 전역에서 발견되었지만, 맥스와 에벌린의 시체는 행방을 알 수 없었다. 거대했던 콜드윈드 농장은 황폐해졌고, 사람들은 토지를 분할 및 매각하려 했지만, 구매하려는 구매자는 나타나지 않았다. 더운 여름밤 들렸던 소리는 아마도 전기톱 소리였을 것이다.","perks":["Enduring","Lightborn","Tinkerer"],"dlc":null,"power":{"ko":"전기톱","en":"Chainsaw","d":"<i>기계는 그에게 새로운 생명을 주었고, 그곳에서 그는 권력을 쥐었다.<\/i><br><br><i>능력 버튼<\/i>을 길게 눌러 <b>전기톱 질주<\/b>를 발동시킬 수 있다. <b>전기톱 질주<\/b>에 타격을 입은 생존자는 빈사 상태에 빠진다. 떨어진 판자 또는 부서지기 쉬운 문을 타격하면 특수 파괴가 적용된다.<br><br>전기톱의 회전 속도 증가 및 각 질주는 <b>증속 구동 미터기<\/b>를 오르게 만든다. 미터기는 전기톱을 사용하지 않을 때 감소한다.<br><br>미터기가 가득 차면, 전기톱은 <b>증속 구동<\/b>으로 들어간다.<br><br><b>특수 상태: 증속 구동<\/b><br><br><b>증속 구동<\/b> 중, 전기톱은 향상된다. 전기톱 차지 및 질주 속도는 증가되며, <b>전기톱 질주<\/b>의 재사용 대기 시간은 감소한다.<br><br><b>증속 구동<\/b>은 <b>20초<\/b> 동안 유지된다."}},{"id":"Nurse","ko":"너스","en":"The Nurse","d":"능력: <b>스펜서의 마지막 숨결<\/b><br><br>점멸로 최대 20미터까지 이동할 수 있다.점멸 후, 탈진 상태가 되기 전에 1회의 점멸을 더 사용할 수 있다.점멸 후 치명적인 공격을 수행할 수 있다. 전승 기술: <b>천식, 사망 공포증, 간호사의 소명<\/b>","story":"샐리 스미손은 아이들과 그녀의 남편 앤드류와 그가 지은 통나무 집에서 함께 행복하게 사는 꿈을 가지고 이 마을에 왔다. 그리고 어느 날 앤드류와 일하던 감독이 샐리를 찾아왔고, 그 후로 샐리는 전혀 다른 삶을 살게 되었다. 다른 곳에서 일을 찾지 못했고, 결국 크로터스 프렌 정신병원에서 일하게 됐다. 샐리는 밑바닥에서 시작하게 됐으며, 매우 힘들게도 밤에 일해야만 했다. 수십 년 동안 끔찍하고 잔혹한 것들을 견뎌내야만 했으며, 그 때문에 정신은 점점 황폐해져만 갔다. 마침내, 한계에 다다른 샐리는 결국 광기에 사로잡혀, 정화하고자 하는 갈망에 몸을 내맡겼다. 9월 어느 날 아침 정신병원을 방문한 당직자는 침대에 눕혀진 50구의 환자들의 시신과 4구의 직원들의 시신을 발견했고, 생존자는 텅 빈 눈으로 몸을 앞뒤로 흔들고 있는 샐리 뿐이었다. 샐리는 구급차로 이송되었으나, 그 구급차는 병원에 당도하지 않았다. 그 차는 숲 근처에서 사고가 나 부서진 채로 발견되었고, 차 안의 모든 사람은 죽어있었다. 그리고 샐리는 어디에서도 발견되지 않았다.","perks":["NurseCalling","Stridor","Thanatophobia"],"dlc":null,"power":{"ko":"스펜서의 마지막 숨결","en":"Spencer's Last Breath","d":"크로투스 프렌 정신병원의 소장, 패트릭 스펜서에게서 빼앗은 마지막 숨결. 강력하고 파괴적인 힘으로 너스가 영적 차원을 경유하는 점멸 이동을 사용할 수 있게 해 주지만 그 힘을 사용한 후에는 탈진을 겪게 된다.<br><br>점멸을 사용할 수 있다.점멸 후, 탈진 상태가 되기 전에 <b>1회<\/b>의 점멸을 더 사용할 수 있다.점멸 후, 탈진으로 쓰러지기 전 공격은 특수 공격이다.점멸 후, 탈진으로 쓰러지기 전, <b>너스<\/b>는 생존자들을 방해하거나 붙잡을 수 있다."}},{"id":"Witch","ko":"해그","en":"The Hag","d":"능력 : <b>검게 변색된 촉매<\/b><br><br>이 촉매를 이용해서 최대 10개까지 유지되는 환영 덫을 맵 내에 심어둘 수 있다.환영 덫이 발동되면 즉시 해당 위치로 순간 이동할 수 있다. 단, 이 능력은 40미터 내에 있는 덫에만 적용된다.환영 덫은 생존자가 일정 범위까지 다가가면 발동되며, 발동될 시 해그의 환영이 튀어나오며 생존자를 혼란에 빠뜨린다. 전승 기술 : <b>주술 : 제3의 봉인, 주술 : 파멸, 주술 : 삼켜지는 희망<\/b>","story":"리사 셔우드는 친절한 사람들과 오래된 전통이 있는 조용한 마을에서 자랐다. 리사는 특히 주술에 관심이 많았으며 노인들은 리사에게 행운과 안전을 상징하는 문양을 그리는 법을 알려주었다. 어느 날 밤, 숲을 지나 집에 가던 중, 전조도 없이 매우 큰 폭풍을 만난다. 어둡고 축축한 숲속에서 리사는 발을 헛디뎌 넘어지고 머리를 세게 부딪혔다. 희미해지는 의식 속에서 리사가 마지막으로 본 것은 사악하고 굶주린 습격자들이었다.<br><br>그들은 리사를 어느 침수된 지하실에 감금했다. 어둠 속에서, 리사는 커다란 상처가 파리 떼에 뒤덮인 다른 마을 사람들을 볼 수 있었다. 식인 행위가 시작되고 녹슨 칼과 지저분한 이빨이 그들의 몸을 난도질하며 대부분의 사람은 살아남지 못했지만, 리사는 어떻게든 살아남았다. 굶주림 끝에 리사의 팔은 족쇄를 헐렁하게 할 정도로 여위었다. 팔을 잡아당기자 금속이 근육을 찢었고, 마침내 풀려났다. 리사의 살에서 누런 고름이 비어져 나왔고, 썩어가는 상처 아래로 뼈가 보였다. 리사의 목숨이 꺼져가고 있을 때, 혼미한 의식 속에서 리사는 집과 마을 사람들을 생각했다. 그리고 마을 사람들이 가르쳐준 문양을 그렸다. 그때 어두운 굶주림이 리사 안에 섞이며 그것이 피를 바랬고, 리사는 복수하기로 결심했다.<br><br>경찰이 마침내 늪지대의 낡은 집을 찾아냈을 때, 그 마을에 살던 사람들의 시체는 게걸스럽게 먹혀 심하게 훼손되어 있었다. 전통적인 문양들이 바닥에 피로 휘갈겨져 있었고, 리사의 시체는 끝내 발견되지 않았다.","perks":["Hex_Devour_Hope","Hex_Ruin","Hex_The_Third_Seal"],"dlc":"fleshAndMud","power":{"ko":"검게 변색된 촉매","en":"Blackened Catalyst","d":"해그의 힘의 근원. 검게 변색된 손가락이 무서운 힘의 촉매로 사용된다. 간단한 주술 의식으로 진흙을 마음대로 움직여, 진흙과 부패의 기운으로 이루어진 환영을 만들고 사용한다.<br><br><b>10개<\/b>의 환영 덫을 만들고 유지할 수 있다.<b>48미터<\/b> 내의 환영 덫이 발동되면 즉시 해당 위치로 순간 이동할 수 있다."}},{"id":"Shape","ko":"쉐이프","en":"The Shape","d":"생존자들을 미행하며 자신의 힘을 키우는 무시무시한 살인마.<br><br>그의 고유 기술인 <b>가장 좋은 것은 마지막에<\/b>, <b>먹이 농락<\/b> 그리고 <b>꺼져 가는 빛<\/b>으로 생존자 한 명을 선택해 그를 집착 대상으로 만들고 집착 대상의 상태에 따라 치명적인 효과가 발생한다.","story":"몇몇 인간은 단지 타고난 본성이 악하다. 본성에 정제된 순수한 형태의 악을 품고 있다. 마이클 마이어스는 이러한 부류의 사람 중 하나다. 마이클에게 다른 사람에게 고통을 주는 것은 잘못된 일이 아니었으며, 그것이야말로 정확하게 자신이 찾고 있던 일이었다. 그러나 이러한 악으로 마음이 가득 찬 사람들은 살아가는 것조차 힘들다. 마이클과 다른 사람들의 차이점은 문제를 해결하는 방법에 있었다.<br><br>마이클은 다른 사람을 죽이는 일로 내면의 평화를 찾았다. 그가 자기 누나의 목숨을 앗아갔을 때, 경찰은 사건 현장에서 광대 분장을 하고 있던 말 없는 소년을 찾아냈다. 만일 누군가가 커지는 불길을 본다면, 거기에 가솔린을 들이붓지는 않는다. 그러나 그 소년의 악마 같은 본성을 알 수 없었던 경찰들의 행동은 불길에 가솔린을 들이붓는 것과 같았다. 마이클을 구한다는 이유와 함께 정신병원으로 보냈기 때문이다. 성공적이지 못한 치료와 매일 밤 들리는 비명은 단지 마이클을 더 내향적이고 정신적으로 혼란스럽게 만들 뿐이었다. 사람들은 마이클이 곧 잊히고 묻히기를 바랬다. 하지만 그때... 마이클이 탈출했다.","perks":["Dying_Light","Play_With_Your_Food","Save_The_Best_For_Last"],"dlc":"halloween","power":{"ko":"내면의 악","en":"Evil Within","d":"쉐이프는 추적에 숙련되어 그의 먹잇감을 미행하며, 악을 발휘할 완벽한 순간을 기다린다.<br><br>쉐이프는 세 가지 모드를 전환하며 먹잇감을 사냥한다. 각 모드에는 서로 다른 강점과 약점이 있다.<br><br><b>특수 모드: 스토커<\/b><br><br>쉐이프는 천천히 이동하며 <b>감지 불가능<\/b> 상태이다.<b>스토커 모드<\/b>에서 <i>능력<\/i> 버튼을 길게 누르면 근처에 있는 생존자를 <b>미행<\/b>하며 <b>미행 미터<\/b>가 채워진다.<b>미행 미터기<\/b>가 가득 차면, <b>인간의 모습을 한 악 모드<\/b>가 잠금 해제된다.<br><br><b>특수 모드: 추적자<\/b><br><br>쉐이프는 빠르게 이동하며 <b>16미터<\/b>의 공포 범위를 가진다. 장애물을 뛰어넘기, 기본 파괴, 돌진 및 기절 회복 속도가 증가한다.<br><br><b>특수 모드: 인간의 모습을 한 악<\/b><br><br>쉐이프의 공포 범위가 <b>32미터<\/b>로 증가한다. 뛰어넘기와 기본 파괴 속도, 그리고 기절 회복 속도 역시 증가한다. 두 번째로 갈고리에 걸린 생존자는 죽음을 맞이할 수 있다. <b>인간의 모습을 한 악 모드<\/b>는 <b>60초<\/b> 후 종료된다.<br><br><b>특수 능력: 살육 공격<\/b><br><br><b>인간의 모습을 한 악 모드<\/b>에서 <i>능력<\/i> 버튼을 길게 누르면 <b>살육 공격<\/b>이 충전되고 <i>공격<\/i> 버튼을 눌러 공격을 수행할 수 있다. <i>능력<\/i> 버튼을 길게 누를수록 더 멀리 공격할 수 있다.<b>살육 공격<\/b>에 타격을 받을 생존자는 건강한 상태라도 빈사 상태가 된다. 떨어진 판자 또는 부서지기 쉬운 문을 타격하면, 특수 파괴가 적용된다."}},{"id":"Killer07","ko":"닥터","en":"The Doctor","d":"정신 이상을 일으키는 살인마는 자신의 파워인 <b>카터의 불꽃<\/b>을 사용하여 생존자들에게 전기 충격을 주어 정상적인 생활을 못 하게 만든다. 결과적으로 공포에 질려 환영으로 보고 비명을 지르게 만들어 자신들의 역할을 발설하게 한다.<br><br>그의 개인 기술, <b>압도적인 존재감<\/b>, <b>감시와 학대<\/b> 그리고 <b>과충전<\/b>은 그의 추격 능력을 상승시키고 생존자의 수리 능력에 영향을 미치며, 그가 추격하지 않을 때는 그를 발견하기 쉽지 않게 만든다.","story":"심리학에 특출한 재능을 보였던 헤르만은 CIA가 주도하는 특별한 뇌과학 프로그램에 발탁되어 래리 기념 연구소라고 알려진 비밀 시설로 가게 되었다. 여기서 헤르만은 오토 스템퍼 박사를 만나게 되며, 그의 지도아래 연구소로 보내진 스파이들에게서 정보를 캐내기 위해 매우 잔인한 요법들을 시행하기 시작했다. 그는 점점 더 난폭한 전기충격요법을 사용하기 시작했고, 국가에 위협을 끼칠 수도 있는 많은 중요한 정보들을 빼내었다.<br><br>시간이 흘러, 헤르만은 닥터라는 이름을 얻었으며, 아무도 그가 의사 면허증이 있는가 또는 정보를 실토한 스파이들은 어떻게 되는가에 대한 의문을 가지지 않았다. 마침내 래리 기념 연구소의 무서운 진실이 밝혀졌다. 직원, 환자들, 그리고 죄수들은 모두 다양한 종류의 두뇌 외상으로 죽은 채 발견되었다. 그중에는 오토 스탬퍼 박사의 시체도 있었지만, “닥터” 헤르만 카터는 끝내 발견되지 않았다.","perks":["GeneratorOvercharge","MonitorAndAbuse","OverwhelmingPresence"],"dlc":"sparkofMadness","power":{"ko":"카터의 불꽃","en":"Carter's Spark","d":"<b>카터의 전류<\/b><br><br><b>닥터<\/b>의 특수 능력인 <b>전기장 방출<\/b> 또는 <b>정전기 폭발<\/b>로 생존자를 성공적으로 공격하여 생존자의 <i>광기<\/i>를 증가시켜 결국 <b>광기<\/b>의 상태로 그들을 괴롭히고 점점 더 강력한 효과를 촉발시킨다.<br><br><b>광기 I단계:<\/b><br><br>1회 비명을 질러 <b>닥터<\/b>에게 위치를 노출한다. 스킬 체크 발생과 방향에 <b>약간<\/b> 영향을 준다.<br><br><b>광기 II단계:<\/b><br><br>1회 비명을 지르고 <i>닥터의 환영<\/i>의 형태로 환영을 보게 된다. 스킬 체크 발생과 방향에 <b>적당히<\/b> 영향을 준다.<br><br><b>광기 III단계:<\/b><br><br>즉시 비명을 지르고 <i>닥터의 환영<\/i>의 형태로 환영을 보게 된다. 스킬 체크 발생과 방향에 <b>엄청나게<\/b> 영향을 준다. <i>정신 가다듬기<\/i>에 성공하기 전까지 생존자는 치료, 수리, 파괴 공작, 잠금 해제, 정화 또는 아이템을 사용할 수 없다. 생존자가 <i>정신 가다듬기<\/i>를 성공하면 <b>광기 I단계<\/b>로 내려간다.<br><br><b>특수 능력: 전기장 방출<\/b><br><br><i>능력 버튼<\/i>을 길게 눌러 <b>전기장 방출<\/b>을 발동하면, 플레이어 앞 지면에 전기장 공격을 퍼붓는다. <b>전기장 방출<\/b>에 감전되는 생존자는 <i>광기<\/i>가 증가하며 수행 중인 모든 상호 작용은 중단된다. <b>전기장 방출<\/b>은 즉시 <b>인지 불가능<\/b> 상태를 무효화한다.<br><br><b>특수 능력: 정전기 폭발<\/b><br><br><i>능력 활성화 버튼<\/i>을 길게 눌러 <b>정전기 폭발<\/b>을 발동하면, 닥터의 공포 범위 내에 있는 모든 생존자는 비명을 지르고 <i>광기<\/i>가 증가한다. <b>정전기 폭발<\/b>은 오직 재사용 대기 시간이 아닐 때만 발동할 수 있다. <b>정전기 폭발<\/b>은 즉시 <b>인지 불가능<\/b> 상태를 무효화한다."}},{"id":"Bear","ko":"헌트리스","en":"The Huntress","d":"능력: <b>사냥 손도끼<\/b><br><br>투척을 준비하는 자세가 길수록 <b>도끼의 속도가<\/b> 빨라진다.준비 자세에서 공격 버튼을 누르면 <b>투척을 취소<\/b>할 수 있다.투척한 손도끼는 <b>소모되고 소지 개수가 줄어든다.<\/b>캐비닛에서 <b>손도끼를 수급<\/b>할 수 있다.헌트리스의 <b>콧노래<\/b> 소리는 반경 45m부터 20m까지 들리며, <b>공포 범위<\/b>는 20m부터이다.헌트리스는 다른 살인마보다 이동 속도가 <b>약간<\/b> 느린 편이다.전승 기술: <b>맹수, 텃세, 주술: 사냥꾼의 자장가<\/b>","story":"안나가 걸음을 떼기 시작했을 때, 안나의 어머니는 가혹하고 고독한 북부의 숲에서 살아남는 법을 가르쳐주기 시작했다. 이와 같은 매우 위험한 오지에서의 생활은 기술과 적응이 필요했다. 해가 지고 일을 하기가 어려워지면, 안나의 가족은 가혹한 겨울도 견딜 수 있는 견고한 자신들의 집으로 들어왔다. 벽난로 옆에서 안나는 어머니가 만들어준 나무 장난감과 가면들 사이에서 어머니의 팔을 베고 자장가를 들으며 행복한 꿈을 꾸었다. 곧 일어날 모든 것을 바꿀 참사에 대해 아무것도 모른 채.<br><br>안나와 어머니는 숲속에서 커다란 엘크를 쫒고 있었다. 위험한 사냥감인 줄은 알고 있었지만, 이번 겨울은 유달리 혹독하고 식량은 동이 나고 있었다. 굶주림은 숲의 어떤 생물보다 그들을 두렵게 했다. 어떠한 경고도 없이, 엘크는 뒤로 돌더니 안나에게로 돌진했다. 거대한 짐승의 발이 지면에 내리 찍힐 때마다 온 세계가 흔들리는 것 같았고, 안나는 공포에 온몸이 마비되고 말았다. 엘크의 눈에 깃든 살의가 보일 만큼 가까워졌을 때 안나의 어머니가 도끼를 들고 그 앞을 가로막았다. 엘크의 뿔에 받혀 안나의 어머니가 공중으로 떠올랐고, 오싹한 비명이 입에서 새어나왔다. 안나의 어머니는 모든 힘을 다해 엘크의 머리에 도끼를 계속해서 휘둘렀고, 엘크는 그녀를 떨쳐내려고 흔들었다. 뚝하는 소리와 함께, 엘크의 뿔이 부러졌고 안나의 어머니는 벗어났다. 야수는 쓰러졌다.<br><br>어머니의 쓰러진 몸을 일으켜 세우기에 안나는 너무 작았기에 그 자리에 주저앉았다. 죽어가는 엘크의 울음소리가 들려오는 와중에 어머니는 안나에게 좋아하는 자장가를 불러주었다. 안나가 고요한 숲에 혼자 남을 때까지.<br><br>집으로 돌아온 안나는 생존을 위해 본능을 따라 야생과 하나가 되었다. 사냥을 연습하며 위험한 포식자가 되어갔고 인간성을 서서히 잃어갔다. 영토를 넓히고 다람쥐와 토끼, 밍크와 여우, 심지어 늑대와 곰 같은 더 위험한 동물들까지 사냥했다. 아무것도 모르는 여행객이 그 숲을 통과했을 때, 안나는 새로운 먹잇감인 인간을 발견했다. 그 불행한 영혼들은 다른 동물들처럼 도살되었다. 안나는 희생자의 물건과 형형색색의 옷, 특히 장난감을 모으는 것을 좋아했다. 그러나 차마 어린 소녀들은 죽일 수 없었다. 안나는 소녀들을 숲속 깊은 곳의 오두막으로 데려갔다. 안나에게 그 아이들은 소중했고, 안나에게 마음속 깊은 곳 뭔가를 깨웠다. 안나는 가족이 된 소녀들과 친밀해지기를 원했다. 훔친 나무 장난감, 인형과 안나는 읽을 수 없는 책들 사이에서 소녀들은 벽에 거친 끈으로 단단히 묶였다. 소녀들을 돌아다니게 둘 수는 없었다. 이렇게 하지 않으면 틀림없이 밖으로 나가서 죽게 될 것이다. 그러나 소녀들은 항상 쇠약해져 굶어 죽거나 추위, 병으로 죽었고, 이런 소녀들의 죽음은 언제나, 안나는 슬픔과 광기에 깊이 빠져들게 했다. 그 광기는 안나가 마을을 습격해 무고한 가족들을 도살하고 그들의 딸을 납치하게 했다. 안나는 두려워하는 소녀들을 진정시키기 위해 어머니가 수년 전에 만든 동물 가면 중 하나를 썼다. 마을 사람들은 붉은 숲에서 남자들을 죽이고 어린 소녀들을 먹는 반인반수의 여사냥꾼의 전설을 퍼뜨렸다.<br><br>전쟁이 결국 그 숲까지 퍼지게 되었다. 독일군은 러시아 제국을 무너뜨리기 위해 행진을 시작했다. 이 암흑기 동안, 더는 여행객들이 존재할 수 없었다. 마을 사람들은 집을 버리고 떠났고 티끌 하나 발견되지 않았다. 오직 도끼로 거칠게 난도질 된 군인들의 시체만이 발견되었을 뿐이다. 기이하게 한 무리의 군대가 모두 사라지기도 했다. 전쟁이 끝나고, 여사냥꾼의 소문도 같이 잊혀져 붉은 숲에 집어삼켜졌다.","perks":["BeastOfPrey","Hex_HuntressLullaby","TerritorialImperative"],"dlc":"boreal","power":{"ko":"사냥 손도끼","en":"Hunting Hatchets","d":"헌트리스가 엄마에게서 배우고 야생의 생활을 하면서 능숙해진 능력. 헌트리스는 손도끼를 정확하게 던질 수 있다.<br><br><b>7개<\/b>의 손도끼를 가지고 희생제를 시작한다.손도끼 투척 버튼을 오래 누르고 있을수록 손도끼를 빨리 던질 수 있게 된다.손도끼는 <b>캐비닛<\/b>에서 충전할 수 있다."}},{"id":"Cannibal","ko":"카니발","en":"The Cannibal","d":"능력 : <b>부바의 전기톱<\/b><br><br>짧은 시간 시동을 걸고 난 뒤 좌우로 전기톱을 휘두르며 4초 동안 전진한다.<b>카니발<\/b> 앞에서부터 원뿔 모양의 피해를 준다.<b>카니발<\/b>은 전기톱을 휘두를 때도 이동 방향을 자유롭게 바꿀 수 있다.<b>다수의<\/b> 생존자를 한 번에 때릴 수 있다.물체에 닿으면 <b>카니발<\/b>은 <b>울부짖게<\/b> 되며, 주위에 있는 사람들에게 피해를 줄 수 있다.전기톱에 타격당한 생존자를 빈사 상태로 만든다.전승 기술 : <b>때려눕히기, 바비큐 & 칠리, 프랭클린의 죽음<\/b>","story":"살인마들이 살인하는 이유는 그들의 병든 마음때문일까, 아니면 다른 외부의 요인으로 인한 것일까' 라는 주제는 항상 논쟁의 대상이었다. 그러나 한 살인마에게는 본능과 외부의 요인, 둘 다 연관이 있었다.<br><br>레더페이스가 살인을 하는 이유는 남보다 우위를 차지하기 위해서도, 쾌락을 위해서도, 머릿속에서 들리는 목소리 때문도 아니다. 두렵기 때문이다. 다른 사람이 자신을 해칠까 두려워서, 가족이 자신을 불쾌하게 생각할까 봐 두려워서, 인육을 먹겠다는 의지가 발각될까 두려워서이다.<br><br>자신이 들은 대로 행동하고, 자신의 가족은 자신을 사랑하니까 중요한 건 그뿐이다. 외부인은 위협이며, 위협은 해결해야 한다.<br><br>멋대로 집에 들어온 아이들처럼 말이다. 꼭 자신의 집처럼 들어온 아이들 말이다. 집을 구경하고, 가족의 비밀을 찾으려고 했다. 하지만 레더페이스가 해결했고, 가족을 지켰다. 배운 대로.<br><br>보호자뿐만 아니라 다른 역할도 많으며, 그 역할에는 각자의 얼굴이 있다. 저녁을 준비하며, 가족을 돌보고, 식사할 때는 제대로 된 복장을 갖춘다. 원래는 할아버지와 할머니가 레더페이스를 돌봐줬지만, 할아버지는 늙었고 할머니는 거동을 못 하게 된 지가 오래니 레더페이스와 그의 형제가 그 역할을 이어받아야 했다. 레더페이스에게는 가족이 전부이다. 가족을 지키고 안전하게 해줘야 한다.<br><br>하지만, 최선을 다했음에도 한 여자아이가 도망치고 말았다. 막으려고 했지만 실패했고, 최대한 빨리 쫓아가려고 했으나 그 아이를 돕는 자가 있었다. 트럭을 몰던 또 다른 외부인이었다. 사악한 트럭 기사는 레더페이스의 형제를 동물이라도 된다는 듯이 깔아뭉갰다. 분노한 레더페이스가 놈을 덮쳤고, 톱으로 가족의 복수를 하려 했으나 트럭 기사는 재빨랐다. 그는 레더페이스를 쓰러뜨리고 톱을 빼앗아 레더페이스에게 들이댔다.<br><br>외부인들이 사라져가는 걸 보자 분노, 슬픔, 고통이 찾아오고 자신의 가족은 이제 어떻게 될지 우려가 되었다. 놈들은 분명히 경찰을 대동해 다시 찾아올 테고, 경찰은 형제와 할아버지를 데려갈 게 뻔하다. 모두를 데려가면 레더페이스는 어떻게 될까? 명령을 받지 않으면 자신은 시들어 죽게 될 것이다.<br><br>자신의 세상이 무너진 레더페이스는 원을 그리며 돌면서 톱을 휘둘렀고, 자신을 둘러싼 무수히 많은 외부의 위협과 싸우고자 했다.<br><br>하지만 또 다른 기분이 엄습했다. 알아채지도 못한 사이에 한기가 돌았다. 외부인이 자신에게 무슨 짓을 하든 더 나쁜 일이 있다는 걸 깨달았다. 그림자 속에 숨겨진 더 큰 일이. 전과는 비교할 수 없는 공포에 휩싸이게 됐다. 하지만 가족에게서 느꼈던 공포처럼 편안했다. 가족을 실망시켰다는 공포 말이다.<br><br>익숙하지만 알수 없는 기분이 들었고, 어떻게 해야 할지 본능적으로 알았다. 레더페이스의 가족에게 일어났던 일처럼 실패해서는 안 된다. 외부인이 다시 올 테지만 자신의 능력으로 위협을 물리칠 것이다. 비명을 지르겠지만 조용하게 만들 수 있다. 톱이 돌아가는 소리만 남을 때까지.<br><br>외부인이 오기를 기다린다.","perks":["BBQAndChilli","FranklinsLoss","InTheDark"],"dlc":"Cannibal","power":{"ko":"부바의 전기톱","en":"Bubba's Chainsaw","d":"카니발은 완충된 3개의 차지샷을 보유한 채로 희생제를 시작한다. <i>능력 버튼<\/i>을 길게 눌러 차지샷 1개를 소모하여 다수의 상대를 타격할 수 있는 <b>전기톱 싹쓸이<\/b> 공격을 발동할 수 있다. <b>전기톱 싹쓸이<\/b>로 타격을 입은 생존자는 빈사 상태에 빠진다. 떨어진 판자 또는 부서지기 쉬운 문을 타격하면 특수 파괴가 적용된다.<br><br>내구도를 사용하여 <b>전기톱 싹쓸이<\/b>의 지속 시간을 연장시킬 수 있다. 하지만, 지속 시간을 연장하면 그 다음 재사용 대기 시간이 약간 길어진다. 전기톱을 사용하지 않는 시간 동안 내구도가 재충전된다.<br><br>전기톱의 회전 속도를 올리면 <b>울부짖음 미터기<\/b>가 천천히 차오른다. 미터기가 가득 차거나 <b>전기톱 싹쓸이<\/b>로 물체를 타격하면, <b>울부짖음<\/b>을 방출한다. <b>울부짖음<\/b>은 살인마 주변에 있는 모든 생존자들에게 피해를 입히며 생존자들은 빈사 상태에 빠진다.<br><br><b>전기톱 싹쓸이<\/b>에 사용된 각 차지샷마다 <b>울부짖음<\/b> 지속 시간이 증가한다. 사용하지 않은 내구도는 사라진다. <b>울부짖음<\/b>이 발동되는 동안 이동 속도가 늦어진다. <b>울부짖음 미터기<\/b>는 전기톱을 사용하고 있지 않을 때 줄어들며 <b>전기톱 싹쓸이<\/b>가 발동되는 동안 완전히 소모된다."}},{"id":"Nightmare","ko":"나이트메어","en":"The Nightmare","d":"살인마 나이트메어는 그의 능력인 <b>꿈의 악마<\/b>를 사용하여 생존자들을 수동적으로 꿈의 세계에 빠트릴 수 있다. 여기서 생존자들은 그의 꿈 능력에 취약해진다. 그는 <b>꿈 투영<\/b> 능력으로 빠르게 맵을 돌아다니며 생존자들을 압박할 수 있다.<br><br>나이트메어의 개인 기술인 <b>분노<\/b>, <b>나를 기억하나<\/b>, <b>피의 교도관<\/b>은 지속 시간 동안 그의 능력을 향상시키며, 희생제가 최고조에 다다를수록 그를 더욱 강하게 만든다.","story":"그가 살아있을 때에도, 프레디 크루거는 그의 진정한 모습을 아는 사람들에게는 악몽같은 존재였다. 따뜻함과 친근함의 가면 뒤에 숨은 프레디의 실제 성격은 그의 피해자들만 알고있었다. 마침내 사람들이 피해자의 말에 귀기울였을때, 스프링우드의 부모들은 프레디를 잡아 그들의 손으로 프레디를 심판하였다. 그들은 그 날의 화재가 괴물을 없애고, 아이들을 안전하게 해줄거라고 믿었다. 하지만 그처럼 강한 악은 살아남고 말았다.<br><br>시간이 흐르고 공포가 희미해져가자 희생자들은 그를 완전히 잊게 되었다. 하지만 프레디가 돌아왔고, 꿈은 다시 악몽이 되었다.<br><br>프레디는 그를 화나게 한 사람들에게 자신의 분노를 집중했고, 낸시 홀브룩에게 집착하기 시작했다. 하지만 그는 그녀의 힘과 지략을 과소평가했다. 그녀의 친구인 쿠엔틴과 함께, 그녀는 프레디를 약화시켜 한번 더 쓰러뜨리는데 성공했다.<br><br>하지만 죽음은 저번에도 프레디가 죽기를 원하지 않았는데 왜 그가 지금 죽을것이라 생각하는가?그는 다시 나타났고, 복수를 다짐했다. 이제 그의 분노는 낸시를 향한 복수를 방해했던 남자아이를 향했다.<br><br>프레디는 쿠엔틴의 꿈에 매일 밤마다 나타났고, 그가 체력에 한계를 느낄 때까지 공격해왔다. 적당한 때가 되자, 쿠엔틴은 프레디에 의해 베드햄 유치원의 어두운 곳으로 끌려오게 되었다. 이 곳이 그의 마지막 복수를 할 장소였다.<br><br>프레디는 유치원의 복도를 따라 소년을 미행했다. 그는 서두르지 않고, 사냥의 매 순간을 음미했다. 그가 가장 즐긴 것들은 공기 속의 땀 냄새, 공포에 질린 거친 숨결이였다. 그것들은 모두 그의 장난감이였다.<br><br>긴 복도 끝에 소년이 있었다. 너무 무섭고 지쳐서 더 이상 도망칠수 없었을까? 운명을 받아들인 걸일까? 프레디가 팔을 벌리고 손톱을 벽에 긁으며 다가왔다. 손가락 끝은 파이프를 훑었고, 금속성 소리는 소년의 공포감만 더할 뿐이었다.<br><br>불꽃이 바닥과 바닥을 뒤엎은 액체에 튀었다. 푸른 화염이 방을 재빠르게 집어삼켰다. 프레디가 불속에서 분노에 차올라 뛰쳐나올때, 소년은 도망쳤다. 그들이 프레디의 지하실에 도달할때까지 방들과 벽들은 그들을 빠르게 지나치며 흐려져갔다. 탈출구는 없었다.<br><br>프레디는 천천히 소년에게 다가갔다. 소년의 공포는 프레디가 알아챌 정도로 커졌지만, 소년의 눈은 거의 존경스러울 정도로 반항적인 증오로 불타올랐다.<br><br>프레디가 손톱을 들어올렸다.<br><br>그리고 프레디는 무언가 다른 것을 느꼈다; 오래되고, 강력하고 어두운 것을. 독기가 그를 감쌌고 유일하게 느낄 수 있는 감각은 멀리서 구부러지고 삐걱거리는 목재 기둥의 소리 뿐이었다. 메아리가 울려퍼졌다. 언어와 순수한 공포 사이에는 무언가 신비하고 알 수 없는 것이 있었다.<br><br>떨어지고 회전하는 순간이 이어졌고 프레디는 학교로 돌아왔다. 하지만 프레디의 학교가 아니었다. 생긴 것은 똑같았지만, 뭔가 다른 느낌이 들었다. 그의 힘은 어떤 면에서는 절제되었고 다른 누군가에게 집중되어있었다. 소년은 더이상 보이지 않았지만, 다른 희생양이 복도로 걸어왔다. 어떤 이들은 하찮아 보였다; 다른 이들은 그의 새 장난감이 될 것이다. 모든 것이 그의 손톱 앞에 쓰러질 것이니.","perks":["BloodWarden","FireUp","RememberMe"],"dlc":"Sandman","power":{"ko":"꿈의 악마","en":"Dream Demon","d":"모든 생존자는 시간이 경과함에 따라 채워지는 수면 미터기를 보유한다. 수면 미터기가 가득 채워지면, 생존자들은 잠이 들어 꿈의 세계로 들어간다. 꿈의 세계에서 생존자들은 <b>인지 불가능<\/b> 상태 효과에 영향을 받는다. 깨어 있는 생존자를 <i>기본 공격<\/i>으로 공격하면, 해당 생존자도 꿈의 세계로 보내진다. 스킬 체크를 실패하거나, 깨어 있는 생존자들이 <i>깨우기 행동<\/i>을 하거나, 일시적으로 수면 면역력이 생기는 알람 시계를 사용하여 생존자들은 잠에서 깨어날 수 있다.<br><br>깨어 있는 생존자들은 <b>나이트메어<\/b>의 공포 범위를 듣고 16미터 내 있을 경우 그를 볼 수도 있다. 또한, 생존자들은 16미터에서 32미터 안에서 나이트메어를 가끔 볼 수 있지만, 그 넘어 범위에서 그를 볼 수 없다.<br><br><b>특수 능력: 꿈 올가미 및 꿈 판자<\/b><br><br>선택 후 <i>능력 버튼<\/i>을 눌러 <b>꿈 올가미<\/b>를 차지할 수 있으며, <i>공격 버튼<\/i>을 눌러 던질 수 있다. <b>꿈 올가미<\/b>는 직선으로 던지거나 벽을 통과할 경우, 빠른 속도로 날아가지만 난간은 불가능하다. 깨어 있는 생존자가 <b>꿈 올가미<\/b>에 맞으면 수면 미터기에 시간이 추가되는 반면, 잠들어 있는 생존자는 <b>12%<\/b>의 <b>근육 손상<\/b>에 걸린다.<br><br>선택 후 <i>능력 버튼<\/i>을 눌러 유효한 판자 위치에서 <b>꿈 판자<\/b>를 소환할 수 있다. <b>꿈 판자<\/b>를 목표로 잡은 상태에서, <i>능력 버튼<\/i>을 누르면 판자를 파열할 수 있다. 파편에 깨어 있는 생존자가 맞으면 해당 생존자의 수면 미터기에 시간이 추가되는 반면, 잠들어 있는 생존자는 부상을 입는다.<br><br><b>특수 능력: 꿈 투영<\/b><br><br><i>능력 활성화 버튼<\/i>을 길게 눌러 발전기 또는 꿈의 세계에서 치료 행동을 수행하고 있는 생존자가 있는 장소로 순간 이동할 수 있다. 순간 이동을 하면, 주변에 모든 생존자들의 수면 미터기에는 시간이 추가되며 일시적으로 살인마의 본능에 의해 위치가 드러난다. 꿈의 세계에 각 생존자마다, 재사용 대기 시간이 <b>15%<\/b> 감소한다."}},{"id":"Pig","ko":"피그","en":"The Pig","d":"능력: <b>직쏘의 세례<\/b><br><br><i>능력 발동<\/i> 버튼을 눌러앉을 수 있다. 앉아있는 동안:<br><br><b>피그<\/b>는 공포 범위가 없다.<i>공격 버튼<\/i>을 눌러 돌진해서 매복 공격을 할 수 있다.<br><br>4개의 역방향 곰덫을 가지고 희생제를 시작한다:<br><br>역방향 곰덫을 <i>빈사 상태<\/i>의 생존자들에게 씌울 수 있다.역방향 곰덫이 발동하면, 생존자는 자동으로 희생된다.역방향 곰덫이 씌워진 채로 출구를 나가면, 생존자는 자동으로 희생된다.역방향 곰덫은 타이머의 시간이 끝나면 발동한다.역방향 곰덫의 타이머는 발전기 수리가 완료되면 시작된다.생존자들은 맵 곳곳에 있는 직쏘 상자에서 키를 찾아서 역방향 곰덫을 해제할 수 있다.전승 기술: <b>집행인의 손재주, 감시, 선택하라<\/b>","story":"흔히 직쏘로 잘 알려진 존 크레이머는 그들 부부 사이에는 새로운 시작을, 아이에게는 멋진 삶의 시작을 선사하고 싶었기에 풍요와 부활을 상징하는 돼지의 해에 아이를 갖기로 계획했고, 아이는 그 해에 태어나기로 되어있었다. 그러나 이 계획은 한 마약 중독자가 마약을 훔치기 위해 아내의 클리닉에 침입했을 때 산산이 조각났다.<br><br>아들을 죽게 만든 그 사건이 일어난 뒤 존은 마침내 그 마약 중독자를 찾아냈다. 그리고 존은 그를 첫 번째 실험 대상으로 삼았다. 이제 그에게 있어서 '돼지(피그)'의 의미는 영원히 바뀌어 버렸다. 그것은 죽음의 문턱에서 살아남거나 자신을 스스로 극복하지 못하는 이상 우리는 단지 고깃덩이에 불과하다는, 존의 내면에 존재하는 추악한 재앙을 불러일으키는 매개체를 의미하게 되었다. 그렇게 피그는 그들의 실험체를 운반하는 직쏘의 수하가 되었다. 그리고 충성스러운 피그는 직쏘의 제자로 '부활'해 새로운 삶을 살게 되었다.<br><br>아만다 영의 경우에도 그랬다. 아만다의 인생은 자신과 주위 사람들에게 해만 끼치는 삶이었지만, 그런 끔찍한 삶은 직쏘를 만났을 때, 그리고 직쏘의 실험에 참여했을 때 변화했다. 이제 아만다는 자신의 인생이 가치가 있는 것이라고 생각하게 되었다. 아만다는 암이 직쏘를 잠식했을 때 그의 자리를 이어갈 준비를 하며, 그의 실험에 헌신하게 되었지만, 존의 죽음이 임박하고, 실험체들은 게임의 시련 속에서 다시 태어나거나 자신을 구할 수 없다는 믿음 때문에 점점 더 존에게 의존적으로 변해갔다. 이런 아만다를 본 존은 아만다를 구원할 다른 게임과, 다른 기회를 보여주었지만, 그런데도 아만다는 자신의 분노와 질투가 자신을 지배하도록 내버려두었다. 아만다는 실험에 실패했고, 총에 맞아 그녀의 삶을 마감했다.<br><br>타일 바닥에 피를 흘리며 죽어갈 때, 어둠이 나무 삐걱대는 소리와 함께 뭔가가 아만다의 시야를 채워갔다. 아만다는 숲속에 있었으며, 다시 '피그'의 눈으로 세상을 보게 되었다. 나무들이 아만다를 에워싸고 나뭇가지가 마구 할퀴어댔다. 공포의 물결은 아만다를 뒤덮었고 마스크 안에서 울리는 자신의 숨소리를 들을 수 있었다.<br><br>이런 꼴로 이런 곳에서 삶을 보내는 저주를 받은 것일까? 아니면 이것은 다른 실험일까? 아마 자신은 전혀 실패하지 않은 것이 아닐까? 존은 언제나 모두에게 한 걸음 더 나아가고, 모든 가능성에 대비하라고 가르쳤기에, 그는 아만다를 포기하지 않았던 것이 아닐까?<br><br>직쏘는 죽었지만, 아만다에게 다른 것을 전해주었다. '피그'로써의 삶 말이다. 궁극적으로 아만다는 자신의 결정은 모두 옳았다고 여겼다. 게임의 시간은 아직 끝나지 않았다. 그들 누구에게도 구원의 기회는 존재하지 않는다. 저들은 모두 고깃덩이이며, 고깃덩이는 죽어야만 한다.","perks":["HangmansTrick","MakeYourChoice","Surveillance"],"dlc":"Finland","power":{"ko":"직쏘의 세례","en":"Jigsaw's Baptism","d":"주인의 사상을 영원히 따르는 그녀는, 은혜를 모르는 사람들과 죄를 지은 사람들을 음흉하고 잔인하게 처벌했다.<b>피그<\/b>는 은밀한 움직임과 함께 매복 공격으로 돌진하며, 생존자의 머리에 치명적인 역방향 곰덫을 씌울 수 있다.<br><br><b>직쏘의 세례<\/b><br><br><b>4개<\/b>의 <i>비활성화<\/i>된 역방향 곰덫을 가지고 희생제를 시작한다. 빈사 상태의 생존자 옆에서 <i>능력 활성화 버튼<\/i>을 눌러 생존자에게 <i>비활성화<\/i>된 역방향 곰덫을 설치할 수 있다. 발전기 수리 시도가 완료되면 역방향 곰덫은 <i>활성화<\/i>된다.생존자들은 맵 곳곳에 있는 직쏘 상자에서 키를 찾아 <i>활성화<\/i> 또는 <i>비활성화<\/i>된 역방향 곰덫을 해제할 수 있다.<br><br><b>활성화된 역방향 곰덫:<\/b><br><br>역방향 곰덫이 <i>활성화<\/i>되면 카운트 다운이 시작된다. <i>활성화<\/i>된 역방향 곰덫에 걸린 생존자는 타이머의 시간이 끝나거나 <i>활성화<\/i>된 역방향 곰덫을 지닌 채 희생제를 탈출하려고 하면 자동으로 희생된다.<br><br><b>특수 능력: 앉기<\/b><br><br><i>능력 활성화 버튼<\/i>을 눌러 앉을 수 있으며, <i>능력 활성화 버튼<\/i>을 다시 누르면 일어설 수 있다. <b>피그<\/b>는 앉아있는 동안 느리게 이동한다. <b>피그<\/b>에게는 앉아있는 동안 <b>감지 불가능<\/b> 상태 효과가 보장된다.<br><br><b>특수 능력: 매복<\/b><br><br><i>공격 버튼<\/i>을 눌러 돌진과 <b>매복<\/b> 공격을 할 수 있다."}},{"id":"Clown","ko":"클라운","en":"The Clown","d":"능력 : <b>만담용 특제 가스<\/b><br><br><i>능력 발동<\/i> 버튼을 눌러 가스병을 투척할 수 있다.<br><br>가스병이 지형지물에 충돌할 경우, 병이 깨지며 영향권 내에 있는 생존자 모두를 마취시키는 가스를 생성한다.<br><br>생존자가 가스에 마취되면 2초동안<br><br>시야가 흐릿해진다.이동 속도가 15% 느려진다.계속 기침을 한다.<br><br>두 번째 능력 발동 버튼을 눌러 가스병을 충전할 수 있다.<br><br>전승 기술 : <b>눈속임<\/b>, <b>광대 공포증<\/b>, <b>깜짝 상자<\/b>","story":"1932년 케네스 체이스가 태어날 때 난산으로 어머니가 사망했다. 이 사건은 케네스와 그의 아버지 사이에 엄청난 거리가 생기는 계기가 되었고 그 거리는 다시는 좁혀지지 않았다. 케네스가 자라면서, 아버지의 분노도 커져만 갔고, 그는 습관적으로 술을 마시게 되었다. 케네스가 학교에 다닐 즈음부터 그들은 거의 완전히 떨어져서 살게 되었다.<br><br>학업적인 면에서 케네스는 평범했지만, 특출난 운동 솜씨를 보였다. 그는 키 크고 힘이 세게 자랐고, 달리기 운동에서 엄청난 활약을 보였지만 팀 운동을 함께 하자는 제안은 항상 거절했다.<br><br>학교에서부터 집으로 걸어올 때 가끔 땅에 있는 깃털을 발견하곤 했고 수집품으로서 그것들을 침대 밑의 담배 박스에 넣어서 모으기 시작했다. 그의 아버지는 항상 일하거나 술을 마시고 있었기에 케네스는 오랜 시간을 혼자 보내야만 했고, 케네스는 입술에 깃털들을 비빌 때 느껴지는 규칙적인 깃털의 결들과 부드러움에 사로잡혔다. 집 정원에 있는 먹이통에 날아오는 새들을 바라보며, 케네스는 그 새가 얼마나 부드러울지 상상했고 한 마리를 잡기로 결심했다. 지역의 치과 의사에게 환심을 사서 소량의 마취제를 구했다. 마취제를 이용해서 그는 먹이통에 함정을 설치했고 그것이 그가 새를 만질 수 있는 시간을 충분히 벌어줄 거라고 생각했다.<br><br>몇 번의 실패 끝에, 그는 결국 개똥지빠귀 한 마리를 잡을 수 있었다. 새를 손에 들었을 때, 하나의 생명이 더 살아갈지의 여부가 자신의 손에 달려있다는 사실에 갑자기 쾌감을 느꼈다. 원래는 새가 마취에서 풀리면 새를 놓아줄 생각이었다. 하지만 새의 눈이 뒤집어지고 의식이 돌아와서 더욱 몸부림칠 때, 케네스는 새를 더 세게 움켜쥐었다. 케네스의 손가락이 새의 가슴 깃털이 움직이지 않을 때까지 새의 목을 감싸안고 조였다. 깃털만 남기고 나머지는 버렸고, 예전에 모은 수집품을 '가짜'로 치부해버리고 새로운 수집품을 모으기 시작했다.<br><br>1940년대 말, 케네스는 학교를 떠나 지역의 작은 식당에서 빈 그릇을 치우는 사람으로 일하기 시작했다. 이제 다람쥐, 너구리, 그리고 개와 같은 더 큰 수집품들을 모으기 시작했다. 수집품마다 투여할 마취제의 양을 조절하는 실력도 엄청나게 늘었다.<br><br>1954년 초, 젊은 남성이 실종되었고 실종자를 찾기 위해서 마을 전체가 뒤집어졌다. 몇 달 뒤, 케네스의 아버지는 집 밑의 좁은 공간에서 일하다가 담배 박스를 발견했다. 박스를 부숴서 열었고 깃털들, 동물의 발들, 그리고 사람의 손가락을 발견하고 엄청난 공포에 휩싸였다.<br><br>일을 하고 집에 돌아오는 길에, 케네스는 아버지가 담배 박스를 들고 지하실을 나오는 것을 보았다. 케네스는 뒤돌아서서 떠났고 다시는 돌아오지 않았다.<br><br>몇 주간의 방탕한 생활 끝에 케네스는 이동식 서커스를 보았고, 엄청난 힘을 가진 케네스는 로프를 당기는 역할을 맡게 되었다. 제프리 호크라는 이름을 가지게 되었다.<br><br>한번도 경험해본 적 없던 굳게 단결된 공동체를 접함으로써, '제프리'는 사회성을 배웠다. 새로운 성격을 위장하고, 매력적이고 이타적인 이미지로 새로운 가족에게서 호감을 얻게 되었다.<br><br>다음 10년 동안 서커스에서 지냈고, 미국의 넓고 긴 땅덩어리를 여행하였다. 하지만 떠돌아다니는 삶을 살았던 탓에 케네스는 나쁜 습관들을 가지게 되었다. 술이든, 정크 푸드든, 마약이든, 먹고 싶은 만큼 먹었다. 시간이 지나며 이러한 나쁜 행동을 충분히 하면서, 예전의 본능들이 되살아났지만 케네스는 살인을 저질러도 떠돌이 생활 덕분에 발각되지 않을 수 있었다. 공연하는 동료들로부터 옷과 화장 도구를 빌려 분장을 하고 희생자들을 데려와 마취시킨 다음, 캐러밴으로 데려왔다. 사람들의 정신을 차렸을 때 자신에게 자비를 구하는 것을 즐겼다. 케네스는 희생자들이 밤에 실종되기 전에 정신적으로나 육체적으로 고문했고, 그들의 비명은 그에게 활력소가 되어 즐거움을 주었다.<br><br>희생자들의 힘이 완전히 다했을 때, 케네스는 그들의 손가락을 자른 후 맛보고 가장 맛있고 예쁜 손가락을 찾아 다녔다. 가장 예쁜 손가락을 찾으면 그 손가락을 잘라서 자랑스럽게 자신의 수집품에 추가했고, 나머지는 쓰레기처럼 버렸다.<br><br>케네스는 남성이든. 여성이든, 젊은이든, 노인이든 간에 신경 쓰지 않았다. 좋은 수집품의 정수는 그것의 다양성과 수집품들이 불러내는 기억, 그리고 이야기이기 때문이다.<br><br>케네스는 점점 더 자신의 복장을 덜어냈고 자신만의 스타일로 다듬었다. 그리고 클라운으로서의 자기 자신을 받아들였다.<br><br>시간이 지나며, 케네스는 현실에 안주했고 일을 대충하게 되었다. 술에 취해 잠들었을 때 한 명의 희생자가 눈이 가려진 상태로 풀려나 도망쳤다. 도망쳐서 비명을 지르며 도움을 구했고 클라운이 일어났을 때 다른 서커스단 일원들에게 포위당했다. 케네스는 말을 채찍질했고 캐러밴은 어둠 속으로 사라졌다.<br><br>그때부터 케네스는 온 나라를 배회했고, 연극 광고 안내문에서는 케네스를 볼 수 없었지만 케네스는 기생충처럼 항상 카니발이나 서커스에 출현했다. 자신에게 가까이 올 만큼 용감하거나 멍청한 사람들을 꾀었고 마취시켜서 그들이 실종되었다는 것을 다른 사람들이 깨닫기 전에 다른 곳으로 떠났다.<br><br>길을 따라가다가, 미국의 잘 포장된 길을 뒤로하고 안개 속으로 들어가서 새로운 장소로 도달했다. 그곳은 일시적이고 덧없는, 그가 살고 싶었던 인생에 딱 맞는 장소였다. 평생 살아오면서 가졌던 집들보다 이곳을 더욱 집처럼 느끼며, 그는 캠프를 차려 그의 첫 방문자를 기다렸다.","perks":["Bamboozle","Coulrophobia","pop_goes_the_weasel"],"dlc":"Guam","power":{"ko":"만담용 특제 가스","en":"The Afterpiece Tonic","d":"마취제와 근육 이완제로 실험하는 몇 년 동안, 클라운은 몇 가지의 유용한 혼합물들과 화학식들을 만들어냈다. 그가 가장 아끼는 것이면서도 가장 효과가 좋은 혼합물인 만담용 특제 가스는 그가 많은 불행한 희생양들을 마취시키고 납치하는 데 도움을 주었다. 그와 관련된 특제 해독 가스 역시 효과가 좋다.<br><br><i>능력 활성화 버튼<\/i>을 탭하여 <b>만담용 특제 가스<\/b>와 <b>특제 해독제<\/b>를 전환할 수 있다. <i>능력 사용 버튼<\/i>을 탭하거나 길게 누른 후 떼서 병을 투척할 수 있다.<br><br><i>능력 활성화 버튼<\/i>을 길게 눌러 병을 보충할 수 있다.<br><br><b>특수 능력: 만담용 특제 가스<\/b><br><br>충격을 받으면, 병이 깨지고 생존자를 <b>마취시키는<\/b> 보라색 구름을 방출한다. <b>마취된<\/b> 생존자들은 <b>1.6초<\/b> 동안 흐릿한 시야를 가지며 기침을 하고 <b>14%의 근육 손상<\/b>에 걸린다.<br><br><b>특수 능력: 특제 해독제<\/b><br><br>충격을 받으면, 병이 깨지고 활성화 시 노랗게 변하는 회색 가스 구름이 방출한다. 클라운과 생존자가 활성화된 <b>해독 구름<\/b> 속으로 들어가면 <b>6초<\/b> 동안 <b>12%의 이동 속도 증가<\/b>를 얻게 된다. <b>마취에 취한<\/b> 생존자가 <b>해독 구름<\/b>에 들어가면 치료된다."}},{"id":"Spirit","ko":"스피릿","en":"The Spirit","d":"능력 : <b>야마오카의 원혼<\/b><br><br>현실과 영적 세계를 넘나들 수 있는 살인마로, 능력인 <b>'야마오카의 원혼'<\/b>으로 방심하고 있는 생존자를 사냥할 수 있다. 자신의 능력을 사용해서 한 장소에서 다른 장소로 순간 이동할 수 있다.<br><br>생존자를 감시하다가 능력을 이용해 순간적으로 접근하거나, 예상할 수 없는 위치로 순간 이동해 생존자를 방해할 수 있다.전승 기술 : <b>분노하는 영혼<\/b>, <b>주술: 원혼이 깃든 대지<\/b>, <b>원한<\/b>","story":"린은 야마오카 집안의 외동딸이었다. 가가와현에 있는 먼지가 자욱한 전통 가옥에서 나고 자랐다. 린은 타카마츠시의 사립 대학을 다녔는데, 이는 집안의 가계에 큰 재정적 부담을 안겨주었다. 그 해, 린의 어머니는 병에 걸렸고 지불해야만 하는 청구서들은 쌓여만 갔다. 린은 가계의 짐을 덜어주기 위해 아르바이트를 구했지만, 보수는 형편없었다.<br><br>린의 아버지는 끝이 보이지 않는 빚과 맞닥뜨렸다. 린의 아버지는 승진에 희망을 품으며 평소보다 두 배로 교대 근무를 하였다. 그 때문에 점점 잠이 부족해지기 시작했다. 매일 밤 어두운 속삭임이 그를 괴롭혔고, 현재의 절망적인 상황을 계속 되뇌었다. 지칠 대로 지친 린의 아버지는 현실 감각마저 잃어가기 시작했다. 매일 밤 그 속삭임을 떨쳐내기 위해, 필사적으로 몸부림쳤다. 그는 직장 상사를 만나 집안 사정을 토로했다. 상여금, 승진, 휴가... 그 어떤것이든..<br><br>하지만 상사는 그의 부탁을 들어주지 않았다. 회사는 결함 있는 제품을 생산하였고 그 결과 큰 적자를 보게 되었다. 누군가는 이번 사태에 대한 책임을 져야만 했고 회사는 그 표적으로 린의 아버지를 지목하였다. 그로 인해 결국 22년간 몸 바쳤던 회사에서 해고당했다.<br><br>그날 저녁, 린은 식당에서 서빙하느냐 늦게까지 일을 하다 아르바이트를 끝내고 집으로 돌아왔다. 린이 집 앞에 자전거를 세워놨을 때, 집 안에서 울리는 어머니의 비명을 들었다.<br><br>린은 급히 계단을 올라 부모님의 방으로 달려갔다. 그곳에서 린은 어머니의 토막 난 시체를 목도하게 되었다. 어머니의 팔다리는 깔끔하게 잘려나가 있었고, 부자연스럽게 뒤엉켜있었다. 또한 가슴은 갈비뼈가 드러날 정도로 심각하게 훼손되어 있었다. 린은 구역질을 났다.<br><br>그때 날카로운 카타나가 린을 베었고, 팔을 두 동강냈다. 린은 육체적 고통보다 자신의 아버지가 매정하게 카타나를 휘두르고 있다는 사실에 더 큰 충격을 받았다. 린은 처절하게 울부짖으며 아버지를 말리려 했지만, 아버지는 그녀의 팔을 다시 한 번 베어버렸다.<br><br>린은 피로 얼룩진 바닥을 미끄러지듯 황급히 빠져나갔다. 문틀을 부여잡으며 자신을 일으켜 세웠다. 카타나가 벽을 찢고 다른쪽 팔도 베었다. 린은 고통에 찬 비명을 지르고 다리를 절며 복도로 뛰쳐나갔지만, 아버지의 검이 기다리고 있을 뿐이었다.<br><br>린은 뒤로 물러서서, 찢어진 배를 부여잡고 온몸을 떨었다. 어머니의 토막 난 팔다리가 눈에 아른거렸다. 린은 아버지에게 달려들었고, 아버지는 잠시 주춤했지만 이내 린의 찢어진 배를 가격했고, 린은 고통스러워하며 나자빠졌다. 린은 필사적으로 다시 일어서려 했지만, 아버지가 그녀의 허벅지를 베었고, 다시 한번 바닥에 뒹굴었다.<br><br>린이 계단을 향해 기어가자 아버지는 딸의 머리카락을 움켜잡고 유리창으로 던졌다. 그 충격으로 유리가 산산이 조각났고 한 층 아래로 굴러떨어졌다. 그렇게 떨어진 린은 위층에서 자신에게 다가오는 발소리를 듣고 있었다. 죽을힘을 다해 산산이 조각난 유리 파편의 바다로 자신의 몸을 던졌다. 유리 파편이 그녀의 살을 파고들었다. 아버지는 그러지 말았어야 했다... 자신의 딸 그리고 아내에게 저지른 만행으로부터 결코 자유로울 수 없을 것이다.<br><br>린은 피를 토했으며, 턱에 유리 조각이 깊게 박힐수록 더 심하게 피를 흘렸다. 더딘 심장 박동 소리가 귀를 울렸다. 자신의 몸이 너무 무겁게 느껴졌고 더는 움직일 수 없었다.<br><br>대지가 아버지의 발소리로 요동쳤다. 린은 이제 원하던 것을 얻을 수 없다는 걸 알게 되었지만, 상관없었다. 아버지는 반드시 대가를 치르게 될 것이다. 이번 생 혹은 다음 생에서라도.<br><br>어두운 안개가 천천히 린의 눈을 감쌌으나, 분노는 쉽사리 가라앉지 않았다. 린은 아직 안식을 취할 수 없었다. 그 때 어둠이 피와 복수를 속삭였다.<br><br>서약은 이루어졌고 린은 눈을 감았다.","perks":["Hex_HauntedGround","Rancor","SpiritFury"],"dlc":"Haiti","power":{"ko":"야마오카의 원혼","en":"Yamaoka’s Haunting","d":"스피릿은 자신의 능력인 '야마오카의 원혼'을 사용하여 영적 세계를 드나들 수 있으며 현실로 돌아올 때는 새로운 지점에서 나타난다.<br><br>능력 버튼을 길게 눌러서 해당 능력을 사용할 수 있다. 스피릿은 능력 사용과 동시에 자신의 육체를 떠나며, 능력을 사용한 자리에는 자신의 '껍질'을 남긴다.<br><br>야마오카의 원혼 능력이 발동된 동안:스피릿은 짧은 시간동안 나타날 새로운 위치로 이동할 수 있으며, 짧은 시간 동안 이동 속도가 빨라진다. 그러나 능력 사용 중에도 주변 지형지물들과의 충돌 판정은 유지된다.스피릿은 영적 세계에서 모든 생존자들의 모습을 볼 수는 없지만, 그들의 발자국은 땅바닥에 지속해서 남는다.생존자는 스피릿이 능력을 사용하는 중에 그녀의 현재 위치를 대략 가늠할 수 있는 청각 신호를 받을 수 있다.능력 사용이 끝나고 현실로 돌아오면, 스피릿의 껍질은 즉시 사라지고 짧은 시간 동안 이동속도 증가 효과를 받는다.<br><br>야마오카의 원혼 능력을 사용하면 스피릿의 능력 게이지가 닳게 된다. 게이지는 능력을 사용하지 않을 때 시간이 지나면 자동으로 채워진다. 능력은 게이지가 완전히 충전되어야만 사용할 수 있다."}},{"id":"Legion","ko":"군단","en":"The Legion","d":"능력 : <b>음산한 광기<\/b><br><br>무자비한 살인마로, <b>음산한 광기<\/b>에 차 무력한 생존자들에게 달려든다. 광기를 지속하는 동안의 공격은 생존자의 체내에 계속 유지되어 재빠르게 대응하지 못한 이들을 쓰러뜨린다.<br><br>군단의 전승 기술인 <b>불협화음<\/b>, <b>미친 투지<\/b>, <b>아이언 메이든<\/b>은 생존자들을 갈고리로 옮기는 동안에도 먹잇감을 추적하여 무자비하게 공격할 수 있게 해준다.","story":"프랭크 모리슨은 이룬 게 별로 없는 열아홉 살이었다. 심판을 스탠드로 밀친 문제로 농구팀에서 쫓겨난 이후로 학교도 가지 않았다. 하지만 프랭크에게는 가능성이 있었고 암울한 어린 시절에도 불구하고 분위기를 띄우는 능력이 있었다. 프랭크가 캘거리를 떠나 위탁 가정을 떠돌기 시작한 건 6살 때부터였다. 수없이 욕을 하고 떼를 쓰고 싸움을 하고 다녀도 정부는 계속 낯선 가정으로 옮겨주기만 했다. 3년 전, 클라이브 앤드류스가 양아버지가 되어 입양 기관에서 프랭크를 데려간 것이 마지막이었다. 둘은 7시간이나 걸려서 오르몬드에 있는 작은 오두막에 갔다. 아마 둘이 같이 보낸 시간 중에 가장 긴 시간이었을 것이다. 클라이브는 가족 복지기관에서 받은 양육비로 술을 마시느라 바빴다.<br><br>오르몬드는 작고 낡은 동네로 주민이 6천 명밖에 되지 않는 외딴곳이었고, 회색 겨울이 일 년의 대부분을 차지했다. 프랭크는 다른 입양 가정으로 가려고 할 수 있는 짓을 다 하다가 한 예쁜 소녀의 관심을 받게 되면서 마음을 바꿨다. 줄리는 동네에서 유명했고 자신이 오르몬드에서 썩는 것보다 더 나은 삶을 자격이 있다고 믿었다. 그리고 외지에서 온 프랭크가 바로 그 구명줄이었다. 프랭크는 줄리가 여는 파티에 참석했다. 다들 자기보다 어렸기에 손쉽게 강한 인상을 줄 수 있었고, 그건 꽤 기분 좋았다. 으스대길 좋아하는 충동적인 조이와 줄리의 절친이고 순진한 부끄럼쟁이 수지도 알게 되었다.<br><br>넷은 오르몬드 산에 있는 버려진 산장에서 어울리기 시작했다. 다 같이 있으면 조그맣고 무의미한 인생의 지루한 단조로움에서 탈출할 수 있었다. 프랭크는 자신들의 미숙함을 뭔가 특출난 힘으로 바꿀 기회라고 보았다. 그래서 야밤에 소동을 피우며 자신들의 한계를 시험했다. 주말이면 으레 시비 걸기, 기물 파손, 도둑질 등을 저질렀다. 그리하여 결국 세 사람은 프랭크가 하자는 대로 하게 되는 지경에 이르렀다. 넷이서 마스크를 쓰면 못할 것이 없었다. 어느 날 저녁, 프랭크는 조이에게 자신을 해고한 가게를 때려 부수라고 지시했다. 그들은 문을 닫은 후 텅 빈 가게에 쉽게 침입할 수 있었다. 하지만 관리인이 곧 줄리에게 달려들어 들었고, 프랭크는 지나치게 흥분해서 손에 쥐고 있던 칼로 관리인의 등을 찔러버렸다.<br><br>그들은 프랭크 때문에 충격에 휩싸였고, 그는 하던 일을 마저 끝내야 한다고 말했다. 그러자 조이는 칼을 들어 피를 흘리고 있는 그의 갈비뼈를 다시 찔렀다. 하지만 수지는 그것을 원하지 않았고, 프랭크는 그녀에게 소리쳤다. 줄리는 눈을 꽉 감고 칼을 집어 그의 가슴을 다시 찔렀고, 피에 젖은 칼을 수지에게 넘겨주었다. 이제 그들은 모두 공범이 되었다. 수지는 두려움에 떨며 줄리를 보았고, 그 사이에 프랭크가 그녀의 떨리는 손에 칼을 쥐어 꽉 잡고는 남자의 목에 깊게 찔렀다. 프랭크는 계속해서 빨리 움직이라고 소리쳤고, 그들은 흔적을 처리한 후에 시체를 묻기 위해 트렁크에 싣고 오르몬드 산으로 향했다.<br><br>산에서 시체를 묻고 있을 때, 프랭크는 누군가가 숲속을 지나가는 것을 발견했고, 그는 확인을 위해 그쪽으로 다가갔다. 그러자 프랭크 주위로 안개가 짙어졌고, 너무 짙은 나머지 앞이 보이지 않기 시작했다. 프랭크는 서둘러 돌아오려다 넘어졌는데, 그때 불길한 징조를 발견했다. 그것은 어둠으로 이어지는 괴상한 길이었다. 이윽고 줄리와 수지, 조이가 시체를 처리했지만 프랭크는 아직 보이지 않았다. 그리고 줄리는 눈 위에 새로 생긴 발자국을 발견했고, 셋은 흔적을 따라서 다시 숲속으로 들어갔다. 그날 밤, 셋이 돌아오지 않자 그들의 부모는 드디어 자식들이 프랭크와 같이 도망가 버렸다고 생각했고, 마을 사람들은 저마다의 추측을 내놓았다. 이후 오르몬드 산의 버려진 오두막에서 시체가 발견되었을 때, 마을의 분위기는 바뀌기 시작했다.","perks":["Discordance","Ironmaiden","MadGrit"],"dlc":"Kenya","power":{"ko":"음산한 광기","en":"Feral Frenzy","d":"프랭크가 군단으로 만들기 전까지 그들은 평범한 친구들이었다. 하지만 그들은 이제 어떠한 규칙도 지키지 않고 규칙을 지키지 않는 스릴 넘치는 자유에 힘을 얻는다.<br><br><b>음산한 광기<\/b><br><br><b>음산한 광기<\/b>를 사용하면 생존자들 사이를 빠르게 이동하며 다수의 공격을 감행할 수 있으며, 능력 게이지가 가득 차면 <i>능력 버튼<\/i>을 눌러 <b>음산한 광기<\/b>를 발동할 수 있다. <b>음산한 광기<\/b>가 활성화되어 있는 동안 <b>군단<\/b>은 더 빠르게 움직이며, 추가적인 능력으로 <b>판자 넘기<\/b>와 <b>음산한 베기<\/b>를 사용할 수 있게 된다.<br><br><b>특수 능력: 판자 넘기<\/b><br><br><b>음산한 광기<\/b>가 활성화되어 있는 동안 <i>상호작용 버튼<\/i>을 눌러 떨어진 판자에 <b>특수 뛰어넘기<\/b>를 사용할 수 있다.<br><br><b>특수 능력: 음산한 베기<\/b><br><br><b>음산한 베기<\/b>는 <b>음산한 광기<\/b>가 활성화되어 있는 동안 <i>공격 버튼<\/i>을 눌러 사용할 수 있다. <b>음산한 베기<\/b>로 생존자를 가격하면 부상 상태에 빠트리고 <b>심각한 부상<\/b> 상태 이상 효과를 걸며, <b>군단<\/b>의 능력 게이지가 리필된다. 추가적으로, 공포 범위 내 있지만, <b>심각한 부상<\/b> 상태 이상 빠지지 않은 생존자의 경우, 살인마의 본능에 의해 표시된다. 만약 생존자가 <b>음산한 베기<\/b>로 인해 이미 생존자가 <b>심각한 부상<\/b> 상태 이상에 빠져 있는 경우, <b>음산한 광기<\/b>는 효과 없이 즉시 비활성화된다. <b>음산한 광기<\/b>를 비활성화시키는 <b>음산한 베기<\/b>에 성공할 때마다 <b>음산한 광기<\/b>의 남은 지속 기간 동안, <b>군단<\/b>의 이동 속도가 <b>0.24m/s<\/b> 증가한다. 연속 다섯 번의 <b>음산한 베기<\/b>는 모든 생존자를 빈사 상태에 빠뜨린다. <b>음산한 베기<\/b>를 다섯 번 성공하면 예외 없이 <b>음산한 광기<\/b>를 종료시킨다."}},{"id":"Plague","ko":"역병","en":"The Plague","d":"능력 : <b>끔찍한 숙청<\/b><br><br>독실한 살인마인 역병은 <b>끔찍한 숙청<\/b> 능력을 사용해 가까운 거리에 있는 생존자를 감염시킬 수 있다. 감염된 생존자들은 헌신의 웅덩이에서 자신을 치료하지 않으면, 부상 또는 치료 불능 상태가 된다.<br><br>전승 기술인 <b>부정한 개입<\/b>, <b>전염성 공포<\/b>와 <b>어둠의 헌신<\/b>은 또한, 생존자를 방해하는 동시에 공포 범위 내에 있는 이들에게 혼란과 공포를 주는 능력을 부여한다.","story":"일곱 가족 중 가장 어렸던 아디리스는 다섯 살이던 무렵, 바빌론의 중심에 있는 정화의 사원 벽돌처럼 빨갛게 불타는 계단에 홀로 남겨졌다. 충격과 슬픔을 이겨내기 위해, 그녀는 자신을 위한 계획을 가지고 있던 신들에게 매달렸다. 아디리스의 새로운 인생은 일종의 노예 상태라 할 만했다. 정원을 가꾸고, 의식에 쓰일 상을 차렸으며, 의식용 향기구를 닦았다. 아다리스는 밤이 되면 자신의 목표를 드러내 줄 상징을 보여달라며 기도를 올렸다.<br><br>아디리스가 성년이 되었을 때, 물과 창조를 관장하는 염소자리를 기리는 연례 의식에 참여하는 고위 사제들을 수행했다. 거대한 다주식 회랑에서 향로를 위아래로 흔들며, 향이 모두 타기 전에 차가운 석조 기둥에 닿도록 검은색 짙은 연기를 내보냈다. 연기가 기둥에 닿는 순간 자신의 걱정들은 사라졌으며, 신들이 내린 축복으로 어느 때보다 신들과 가까워졌음을 느꼈다. 이후 사제들의 정화 의식을 돕게 된 아디리스는 새로 맡은 임무는 물론 기존의 일도 충실히 하면서 하루하루 부지런히 보냈다.<br><br>하지만 사제들은 갈수록 더 많은 도움이 필요했다. 드높은 사원의 담장 너머로 끔찍한 역병이 다시 퍼지면서 예방을 위해 매일 청소를 해야 했다. 하지만 수개월 뒤, 사제들도 결국 역병에 걸리고 말았다. 이들은 순식간에 힘을 잃어 어떤 의식도 치를 수 없을 만큼 약해지고 말았고, 수많은 정화 의식을 도왔던 아디리스는 의식을 이어나갈 수 있는 유일한 사람이 되었다. 계속 커지는 공포는 초보자의 손을 빌리는 한이 있더라도 제압해야만 했다.<br><br>첫 번째 의식을 앞두고 불안했던 아디리스는 사제들의 성전실을 방문했다. 양초에 불을 붙이고 나니 등 뒤에 좁은 출입구가 있는 것을 발견할 수 있었다. 틈새로 몸을 구겨 넣은 아디리스는 성역 아래에 숨겨져 있던 지하실을 발견했다. 그곳에는 보석으로 손가락을 잔뜩 치장한 채 손을 쭉 뻗은 어느 여인의 황금 동상만이 서 있을 뿐이었다. 이는 곧 아디리스가 기다리던 신호이기도 했다.<br><br>아다리스가 대회랑으로 입장하자 그곳을 꽉 채운 추종자들이 절을 올렸다. 벽돌 제단으로 성큼성큼 걸어간 아디리스는 은으로 연마한 의식용 단검을 집어 들었다. 루비 반지를 낀 손으로 마치 발톱으로 낚아채듯 칼을 움켜쥐었다. 그 현란한 광경은 이미 아디리스의 젊음과 아름다움에 매혹된 추종자들을 완전히 굴복시켰다.<br><br>아디리스가 창조의 서사시를 암송하기 시작하자, 뒤에 있던 한 여성이 기절하여 쓰러졌다. 여자에게 달려간 아디리스는 그 여성의 발을 뒤덮은 검은 수포들을 발견했다. 주저 없이 성스러운 칼을 쥐고 자신의 발을 향해 휘둘러 발가락 하나를 잘라냈다. 그 뒤 피투성이의 발가락을 신에게 바치면서 이 불쌍한 여성을 보호해줄 것을 간청했다. 아디리스를 새로운 여사제로 여기는 추종자들 사이에 침묵이 퍼졌다.<br><br>아디리스의 부와 아름다움, 헌신에 관한 이야기는 바빌론 전역에 질병만큼이나 빠른 속도로 퍼져나갔다. 얼마 후 아디리스의 추종자들은 그녀를 바빌론의 고위 여사제로 부르게 되었다.<br><br>하지만 아디리스에게 감염의 첫 번째 징후가 나타나자 믿음이 흔들리기 시작했다. 아디리스는 피와 가래가 섞인 기침을 했으며, 목에는 종양이 퍼졌고, 네 발가락만이 남은 발은 검게 변했다. 자신에게 나타나는 증상에 부끄러움을 느낀 아다리스는 베일 달린 머리 장식을 쓰기 시작했고 자신의 피부에서 나는 기름 썩은 내를 가리기 위해 향로를 들고 다녔다. 구원을 꿈꾸며 의식을 계속했고, 추종자들에게 축복받은 물과 음식을 나눠주었다.<br><br>하지만 어떠한 의식도 아디리스를 구할 순 없었다. 신들에게 간청을 드리는 절박한 시도에도 불구하고 아디리스는 도시에서 제 발로 떠나게 되었다. 얼마 안 남은 추종자들과 함께 북쪽으로 떠난 아디리스는 우라슈투의 추운 삼림지대를 헤치며 더는 걸을 수 없을 때까지 나아갔다.<br><br>이들 무리는 자리를 잡았고, 아디리스의 자신의 토사물위에 쓰러졌다. 검게 번했던 아디리스의 발은 퉁퉁 부어 더 이상 걸을 수 없는 지경이었다. 아디리스와 추종자들은 동굴 안에서 진실을 깨달았다. 이들은 모두 전염병에 걸린 것이었다.<br><br>구역질 나는 추종자들 사이에 무릎 꿇은 아디리스는 마지막 기도를 올렸다. 향의 검은 연기가 차가운 바람에 흩어지기 전에 축축한 공기 속으로 퍼졌다.<br><br>아디리스는 물론 추종자들의 시신 모두 발견되지 않았다. 많은 이들은 아디리시의 귀환을 이야기했지만, 바빌론의 고위 여사제에게 어떤 운명이 닥쳤는지 아는 이는 하나도 없었다.","perks":["CorruptIntervention","DarkDevotion","InfectiousFright"],"dlc":"Mali","power":{"ko":"끔찍한 숙청","en":"Vile Purge","d":"그녀는 전염병이 몸을 뒤덮으면서 상태가 악화되었다. 발가락은 검게 변했으며, 목에는 낭종으로 인해 버섯이 피고 목은 매일같이 피를 토했다.<br><br><b>끔찍한 숙청<\/b><br><br><b>끔찍한 숙청<\/b>으로 환경에 존재하는 사물과 생존자들을 감염시켜 끊임없는 질병을 퍼트린다. <i>능력 버튼<\/i>을 누르면 <b>끔찍한 숙청<\/b>을 충전할 수 있으며, 다시 버튼을 놓으면 감염 담즙 줄기를 발산한다. 줄기에 닿은 생존자는 감염되며, 환경의 사물도 짧은 시간 동안 오염된다. 생존자는 또한 오염된 물체와 상호작용해도 감염된다.<br><br>생존자의 감염 표시기가 완전히 채워지면 생존자는 부상 상태에 빠져 <b>치료 불능<\/b> 상태 이상 효과에 걸리게 되고, 임의의 간격으로 구토에 시달리게 된다.<br><br><b>특수 능력: 부패 흡수<\/b><br><br>감염된 생존자는 <i>헌신의 웅덩이<\/i>를 통해 정화하며 감염을 치료하고 자신의 체력을 완전히 회복한 상태로 되돌릴 수 있다. 이 행동은 웅덩이를 부패시키며, <b>역병<\/b>은 부패를 소모하여 숙청을 강화시킬 수 있다. 부패된 <i>헌신의 웅덩이<\/i>에서 <i>상호작용 버튼<\/i>을 누르고 있으면 <b>끔찍한 숙청<\/b>이 <b>부정한 숙청<\/b>으로 변한다. 이 행동은 웅덩이의 부패를 제거시킨다.<br><br><b>특수 공격: 부정한 숙청<\/b><br><br><b>부패 흡수<\/b> 능력을 사용하면 짧은 시간 동안 <b>끔찍한 숙청<\/b>이 <b>부정한 숙청<\/b>으로 변한다. <b>부정한 숙청<\/b>의 줄기에 닿은 생존자는 즉시 피해를 입지만 더 이상 생존자를 감염시키거나 환경의 사물을 오염시킬 수는 없다."}},{"id":"Ghostface","ko":"고스트 페이스","en":"The Ghost Face","d":"으스스한 살인마로 고유 능력인 <b>밤의 장막<\/b>을 사용하여 피해자를 몰래 뒤쫓거나 살금살금 다가갈 수 있습니다. 밤의 장막에 걸린 생존자는 취약해지며 유령의 존재를 잊게 됩니다. 따라서 모든 지각 능력과 신경을 활용하여 유령이 접근하지 못하도록 막아야 합니다.<br><br>유령은 개인 기술인 <b>밝은 귀<\/b>, <b>전율의 기쁨<\/b>, <b>은밀한 추격<\/b>을 활용하여 생존자의 위치를 찾고, 발전기를 지키며, 불시에 추격할 수 있습니다.","story":"몇몇에겐 제드 올슨이라는 이름으로 익숙한 대니 존슨은 부엌 탁자 위의 신문을 집어 들었다. 일주일 전 신문이었지만, 거칠고 퀭한 그의 얼굴이 첫 면을 장식하고 있었다. 그 사건이 일어난 건 뜨겁고 습한 공기가 부엌의 모든 사물에 스며들어 가만히 서 있던 대니마저 땀을 뻘뻘 흘리게 했던 후덥지근한 플로리다의 어느 오후였다. 이 신문 기사는 무조건 좋아야 한다. 로즈빌에서 그가 이룬 업적은 대단했기 때문이다.<br><br><i><b>고스트 페이스, 자취를 감추다<\/b><br><br>1993년 6월 18일<br><br>제드 올슨의 첫인상은 다양한 소규모 신문사를 다니며 경력을 쌓은 겸손하고 열정적인 프리랜서였다. 로즈빌 가제트의 기자들은 융통성있고 정직한 그의 성품에 크게 기대했고, 면접이 시작한 지 5분도 지나지 않아 그는 이방인 취급에서 완전히 벗어났다.<br><br>\"제드는 면접실에 들어서자마자 편집장을 빠르게 찾아내고는 그에게 기분 좋은 미소와 힘찬 악수를 건네며 미국의 전통적인 가치에 대해 대화를 나눴어요. 그리고는 곧 입사가 결정됐죠.\"—로즈빌 가제트 전 기고자<br><br>올슨은 유타에서 펜실베니아까지 그 동안 작은 마을들을 전전한 자신의 들쭉날쭉한 경력에 대해 변명하지 않았다. 이전 직장에 대해서도 확인할 필요가 없었다. 그의 이력서는 깔끔했고, 면접 태도도 아주 좋았으며, 신문사는 기고자를 필요로 했다.<br><br><b>로즈빌의 연쇄 살인마<\/b><br><br>로즈빌에서 살인 사건이 시작됐을 때, 올슨은 신문사에서 일한 지 5개월 차였다. 피해자는 젊은이부터 노인까지 다양했으며, 집으로 돌아가던 중에 흉기에 찔려 당했다. 수사 보고서를 살펴본 결과 피해자는 불특정 다수였지만, 살인자는 현장 주변을 훤히 꿰고 있었다. 여러 개의 자상은 개인적 동기에 의한 살인임을 말해주고 있었다. 하지만 DNA 흔적은 전혀 발견되지 않아 관할 경찰은 당혹감을 감추지 못했다. 살인범은 범죄에 대한 열정과도 같은 격렬한 범죄를 저질렀지만, 동시에 아주 냉혹하게 범행을 계획했다.<br><br>또한 살인마는 목표 대상을 미행하는 것을 좋아했다. 두 명의 피해자는 사망하기 며칠 전까지 집으로 가던 중 검은 형체에게 미행을 당했다는 신고를 했다. 살인범은 로즈빌 북부 월아이즈부터 이들을 따라갔으며 집에 도착했을 때 내부로 들어갈 방법을 찾으려 사진을 몇 장 찍은 것이 분명했다. 범인은 몇 주 동안 같은 피해자를 관찰하며 대상의 습관이나 행동반경을 치밀하게 관찰했다. 살인충동이 일 때마다 그는 목록에서 가장 약한 피해자를 찾아 집 안으로 몰래 침입했다.<br><br>신문사의 모든 직원이 로즈빌 연쇄 살인 사건에 매달렸다. 올슨은 종종 피해자의 집을 찾아가 유족들과 인터뷰를 하고 경찰의 공식 발표를 전했다. 당시에는 아무도 모르고 있었지만, 올슨의 개입으로 인해 최후의 시체 한 구가 더 추가되었다.<br><br><b>고스트 페이스<\/b><br><br>올슨이 한밤중에 후드 모자를 뒤집어쓴 인물이 가택을 침입하는 영상을 공개했을 때, 로즈빌은 공포로 몸서리쳤다. 얼굴에 마스크를 쓴 인물이 어둠 속에서 뿌옇지만 하얀 모습으로 카메라를 잠시 응시하더니 집 내부로 사라진 것이다. 올슨은 \"테이프에 찍힌 고스트 페이스\"라는 기사를 냈다. 그는 마을 전체가 자신이 쓴 기사로 얼마나 겁을 먹었을지 상상하며 즐거워하는 듯했다.<br><br>몇 주 뒤, 올슨은 사무실 책상에 쪽지 하나를 남기고 모습을 감췄다.<br><br>“제 이야기가 마음에 드셨으면 좋겠습니다. 전 이야기에 생명력을 불어넣는 것을 좋아하거든요. 걱정하지 마세요. 일은 아직 끝난 게 아니니까요.” –제드 올슨<br><br>제드 올슨의 행방이 묘연해지면서 로즈빌 치안 당국은 어떤 성명도 내지 않았다.<\/i><br><br>대니는 신문에서 자신이 쓴 기사를 오리며 미소를 지었다. 당국이 그를 지목했을 때, 그는 짐을 꾸려 서둘러 로즈빌을 떠났다.<br><br>그가 일어서자 축축한 의자 시트가 그의 살에 달라붙었다. 대니가 침실로 들어서자 숨 막힐 정도의 습기가 그를 집어삼켰다. 갈라진 벽지는 힘없이 축 늘어져 있었고, 뿌옇게 습기가 낀 작은 창문에 물방울이 흘러내리고 있었다. 꽃무늬 벽지에는 끔찍한 사진들과 신문 헤드라인들로 뒤덮여 있었다. 대니는 자상이 있는 두부 사진 위에 일주일 전의 신문을 핀으로 고정했다. 허기로 인한 고통이 미약하게 그를 자극할 때, 그는 마지막으로 밥을 먹은 게 언제인지 곰곰히 생각했다. 오늘 아침 칼과 옷을 씻으면서 먹은 게 마지막이었나? 아니면 길에서 여자애를 쫓던 어젯밤이었나? 기억이 잘 나지 않았다.<br><br>대니는 한 발짝 뒤로 물러나 벽에 장식한 자기 작품을 경외심에 찬 눈으로 바라보았다. 그는 마음 속에서 자신이 쓴 모든 기사와 계획한 모든 이야기, 그리고 현실 세계에서 재현한 모든 장면을 되짚고 있었다.<br><br>전율이 한 차례 그의 몸을 타고 흘렀다. 쌀쌀한 바람이 침실의 습기를 만나 불투명하고 차가운 안개로 변했다. 여성이 비명을 질렀다. 말라붙은 나뭇잎이 그의 발밑에서 바스락거렸다.<br><br>그는 새로운 기대로 미소를 지었다.","perks":["FurtiveChase","ImAllEars","ThrillingTremors"],"dlc":"Oman","power":{"ko":"밤의 장막","en":"Night Shroud","d":"<b>고스트 페이스<\/b>는 몇 주 동안 희생자를 연구하고 그 습관을 세세하게 기록한다. 살인 충동이 끓어오르기 시작할 때, 그는 어디에서 어떻게 공격해야 효과적인지를 잘 알고 있다.<br><br><b>밤의 장막<\/b><br><br>능력 게이지가 가득 찼을 때 <i>능력 버튼<\/i>을 길게 눌러 <b>밤의 장막<\/b>을 활성화할 수 있다. <b>밤의 장막<\/b>이 활성화된 동안 <b>고스트 페이스<\/b>에게는 <b>감지 불가능<\/b> 상태 효과가 보장된다. <i>기본 공격<\/i> 사용 시 능력 게이지는 완전히 고갈되며, <b>밤의 장막<\/b> 능력 역시 해제된다.<br><br><b>탐지:<\/b><br><br><b>고스트 페이스<\/b> 근처에 있는 생존자는 고스트 페이스가 있는 방향을 바라볼 때 짧은 시간 동안 그를 <i>탐지<\/i> 할 수 있을 지도 모른다. <i>탐지<\/i>에 성공한 경우 <b>고스트 페이스<\/b>의 능력 게이지는 완전히 고갈되며 <b>밤의 장막<\/b>도 자동으로 해제된다.<b>고스트 페이스<\/b>를 <i>탐지<\/i>한 생존자는 <i>살인마의 본능<\/i>에 의해 자신의 위치가 짧은 시간 동안 표시된다.<br><br><b>특수 능력: 미행<\/b><br><br><b>밤의 장막<\/b>이 활성화된 동안 <i>능력 버튼<\/i>을 길게 눌러 생존자를 미행할 수 있다. 잠복 중 <i>능력 버튼<\/i>을 길게 누르면 숙여서 더 빠르게 미행할 수 있다. 생존자를 끝까지 미행하면 대상에게 <i>표식<\/i>을 남기며 <i>표식<\/i>이 새겨진 제한된 시간 동안 <b>약점 노출<\/b> 상태에 빠지게 된다. <i>표식<\/i>이 새겨진 생존자는 <b>고스트 페이스<\/b>를 <i>탐지<\/i>할 수 없다.<br><br><b>특수 능력: 앉기<\/b><br><br>능력 활성화 버튼을 눌러 앉을 수 있으며, 버튼을 다시 누르면 일어설 수 있다. <b>고스트 페이스<\/b>는 앉아있는 동안 느리게 이동한다."}},{"id":"Demogorgon","ko":"데모고르곤","en":"The Demogorgon","d":"정체가 알려지지 않은 살인마, 여러 개의 포탈을 열 수 있고 그 사이를 가로질러 먼 거리를 이동할 수 있다. <b>심연<\/b>의 힘을 이용해 포탈과 가까운 거리에 있는 생존자들을 감지하고 멀리서 달려들어 생존자에게 피해를 입힐 수 있다.<br><br>기술인 <b>서지<\/b>, <b>잔혹한 속박<\/b>, <b>마인드 브레이커<\/b>는 발전기 주변의 환경에 영향을 미치며, 생각지 못한 방법으로 주변의 생존자들에게 영향을 준다.","story":"바늘 같은 송곳니들이 가득 차 있는 꽃이 핀 듯한 얼굴과 거대하고 구부러져 있는 날카로운 발톱을 지닌 데모고르곤은 모든 차원을 자유롭게 이동하며 생존자들을 위협하는 무시무시한 괴물입니다. 그는 먹이를 사냥할 때 자비나 동정 따위 없이 육체를 산산 조각내고 남김없이 먹어치우는 잔인한 악몽 그 자체이며, 단지 피를 갈망하는 순수한 본능에 의해 움직일 뿐입니다. 완벽한 사냥꾼 데모고르곤은 뒤집힌 세계에 도사리고 있는 섬뜩한 증거이자 엔티티가 선택한 이유이기도 합니다.","perks":["CruelConfinement","Mindbreaker","Surge"],"dlc":"Qatar","power":{"ko":"심연","en":"Of the Abyss","d":"알 수 없는 다른 세계의 힘이 그것의 몸을 타고 밀려 들어왔다. 갑자기 땅이 갈라지며 열리더니 데모고르곤을 통째로 삼켰다.<br><br><b>심연<\/b><br><br><i>능력 버튼<\/i>을 길게 눌러서 완전히 충전하면 <b>심연<\/b>을 활성화시킬 수 있다. 활성화된 포털의 근처에 있는 모든 생존자들은 살인마의 본능에 의해 감지된다.<br><br><b>특수 공격: 찢어발기기<\/b><br><br><b>심연<\/b>을 충전하거나 버튼을 누르고 있는 도중 <i>공격 버튼<\/i>을 누르면 상대방을 향해 뛰쳐나가 포악하게 벤다. 떨어진 판자 또는 부서지기 쉬운 문을 타격하면 특수 파괴가 적용된다.<br><br><b>특수 능력: 포털<\/b><br><br><i>능력 활성화 버튼<\/i>을 누르면 자신의 앞에 있는 지면에 포털을 만든다.<br><br><b>뒤집힌 세계 횡단<\/b><br><br>포탈을 하나 지정한 후, 설치된 포탈에 서서 <i>능력 활성화 버튼<\/i>을 한번 더 누르면 뒤집힌 세계를 통해 지정한 포털로 갈 수 있다. 포털에서 나오면, 감지 불가능 효과가 부여된다.<br><br><b>활성화된 포털<\/b><br><br>처음으로 포털을 횡단하면 출발지와 도착지의 포털이 활성화된다. 생존자는 활성화된 포털만을 봉인할 수 있다. 활성화된 포털 오라는 노란색으로 강조 표시가 된다."}},{"id":"Oni","ko":"악귀","en":"The Oni","d":"적을 부상입혀서 피의 에너지를 흡수하고, 그 에너지를 사용하면 잔혹한 악마로 변신할 수 있는 끔찍한 살인마. <b>야마오카의 분노<\/b> 능력을 사용하면 엄청난 속도로 생존자를 쓰러트릴 수 있으며, 금쇄봉으로 엄청난 타격을 입힌다.<br><br>개인 기술인 <b>잔심 전술<\/b>, <b>피의 메아리<\/b>, <b>천벌<\/b>을 사용하면 적의 위치 정보를 알려주거나, 부상당한 생존자를 처단하고, 방해물을 유리하게 이용할 수 있다.","story":"카잔 야마오카는 자신의 가문의 명예를 존경하는 것만으로는 부족하다고 항상 생각했다. 자신의 아버지가 쌓은 명성을 뛰어넘길 원했고, 사무라이인 양 행세하는 농부들 때문에 사무라이 문화가 사라지는 것을 막고자 했다. 아버지는 그가 귀족으로서의 삶을 살 것을 권유했지만, 이에 수긍하지 않고 카잔은 아버지의 도검을 가져갔다. 그러고는 자신의 가치를 입증하고 일본에 거짓된 자들을 모조리 제거하기 위해 어둠의 순례길에 올랐다. 그동안 교육받았던 신조를 무시한 채, 카잔은 전국을 돌아다니며 거짓된 자들을 처단했다. 처단 방식은 잔혹하고 잔인할 뿐만 아니라 소름 끼칠 정도였다. 그는 농부와 전사들의 상투를 풀어헤친다거나 그들의 갑옷을 벗겨 크게 면박을 주었다. 카잔의 분노, 충동, 명예에 대한 비뚤어진 인식은 사그라들지 않았다. 수도승들은 다른 세계의 사악한 무언가가 카잔을 조종하고 있다면서 그를 비난했다. 한 영주는 카잔을 분노에 불타는 사무라이, ‘악귀 야마오카’라고 부르기 시작했는데, 이는 카잔과 그 가문 모두를 모욕하는 말이었다.<br><br>이에 카잔은 가문의 오명을 씻어내기로 결심했고, 이제 자신을 감히 악귀 야마오카라고 부르는 자는 누구든 도살하게 된다. 카잔은 자신에게 붙은 모욕적인 별명 때문에 혼란을 겪게 된다. 자신은 가장 강력한 자를 무찔렀으며, 이 땅 위에 존재하던 거짓된 자들을 모두 제거하여 사무라이 집단을 정화시켰다. 그런 그를 어떻게 감히 악귀이라 할 수 있는가? 전장에 나가서 누구보다 맹렬한 전사들의 목을 베어버렸기 때문에? 도깨비방망이 같은 금쇄봉으로 수백 개의 머리통을 날려버렸기 때문에? 아니면 그가 무찌른 자에게서 ‘전리품’을 챙기려 했기 때문일까? 그 이유는 중요하지 않았다. 자신을 악귀라고 부르는 걸 더 이상 참을 수 없었던 카잔은, 머릿속에서 들리는 정체불명의 목소리에 이끌려 자신의 이름을 모욕한 영주를 죽이러 영주의 마을로 향했다.<br><br>카잔이 영주의 마을로 가던 중에, 흙길에서 길을 막고 서있는 사무라이 한 명과 마주했다. 카잔은 금쇄봉을 꺼낼 준비를 했다. 단 한 마디의 말도 없이 사무라이는 공격을 시작했고, 빠르게 기세를 제압했다. 하지만 사무라이는 망설이고 있었다. 카잔은 그 틈을 놓치지 않고 무시무시한 일격으로 사무라이의 머리를 가격했고, 투구를 부숴버렸다. 일격으로 쓰러진 사무라이의 얼굴을 자세히 보니 자신의 아버지였다. 카잔은 충격에 뒤로 주춤했다. 아버지는 수치스러움과 후회가 뒤섞인 표정으로 카잔을 바라보더니, 이윽고 숨을 거뒀다. 카잔은 괴로움에 몸부림치며 목소리가 나오지 않을 때까지 소리 질렀고, 정신을 잃었다. 카잔이 다시 눈을 떴을 때는... 이미 아버지의 시체가 사라진 뒤였다. 카잔은 자신의 아버지를 죽였을 뿐만 아니라, 도적들이 아버지의 시체를 훔쳐 가게 놔두기까지 한 것이다.<br><br>쓰라린 고통과 상실감, 환멸감에 짓눌린 카잔은 정처 없이 전국을 떠돌아다녔다. 머릿속에서는 계속해서 아버지의 목소리가 카잔을 괴롭히고, 그때의 일이 잊히지 않았다. 걷잡을 수없이 극심한 분노의 구덩이에 빠지게 된 것이다. 그러던 어느 날, 카잔은 숲속을 지나가다가 '악귀' 조각상을 발견하게 되었다. 이어서 조각상 앞에 멈춰 서더니 오랫동안 가만히 서있었다. 잡초로 무성하고 낡은 조각상이 꼭 카잔을 조롱하고 있는 것 같았고, 카잔이야말로 자신이 그동안 필사적으로 잡으러 다녔던 거짓된 사무라이라며 비난하는 것 같았다. 카잔은 고개를 휘저으며 웃었고, 곧이어 자신을 ‘악귀 야마오카’라고 조롱했던 영주를 희미하게 떠올리게 된다.<br><br>다시 한번 분노에 휩싸인 카잔은 그 영주가 살고 있는 설산 꼭대기의 마을로 떠났다. 사무라이 십여 명은 마을 입구를 지키고 서있었지만 모두 카잔의 금쇄봉에 쓰러졌다. 더 이상 카잔의 속도와 위력을 당해낼 자가 없었던 것이다. 카잔의 분노는 누구도 쉽게 이해할 수 없었다. 피투성이가 된 카잔은 마을에서 전투를 이어갔고, 얼마 안 지나서 한 저택에 숨어있던 영주를 발견하게 되었다. 카잔은 영주를 옷장에서 끌어내어, 힘줄을 잘라내서 그가 도망치지 못하도록 했다. 이어서 영주가 목숨을 구걸하며 개처럼 몸부림치는 모습을 지켜봤다. 카잔은 이윽고 영주의 입안에 주먹을 찔러 넣은 다음, 자신의 이름을 더럽히던 간악한 혀를 뽑아냈다.<br><br>카잔은 만족스러움을 느끼며 주택을 빠져나왔지만, 수십 명의 농부들이 녹슨 낫과 날카로운 쇠스랑, 단단한 곤봉으로 무장해서 카잔을 에워쌌다. 처음에는 잘 버텼지만 사방에서 들이닥치는 공격을 모두 상대하기엔 역부족이었다. 짧은 찰나 동안 카잔은 바닥에 누워 자신에게 무관심한 차가운 저녁 하늘을 바라보았고 농부들은 자신들의 영주를 도살한 ‘악귀’를 돌아가면서 찌르고 고문했다. 광분한 무리들은 카잔을 작은 방앗간으로 끌고 가서 계속 고문했다. 결국 카잔은 천천히 고통스럽게 죽어갔다. 농부들이 다시 방앗간으로 돌아왔을 때에는 기묘한 검은색 안개가 가득했고, 카잔의 시체와 금쇄봉은 사라지고 없었다. 이로써 마을을 떠돌아다니는 분노에 불타는 악귀의 비밀스러운 전설이 시작된 것이다.","perks":["BloodEcho","Nemesis","ZanshinTactics"],"dlc":"Sweden","power":{"ko":"야마오카의 분노","en":"Yamaoka's Wrath","d":"나약한 핏줄을 끊어버리려는 열망이 힘으로 실현되었다.<br><br><b>야마오카의 분노<\/b><br><br>부상당한 적이 남긴 핏빛 구체를 흡수할 수 있다. 이때, <i>능력 버튼<\/i>을 길게 눌러 핏빛 구체를 흡수 할 수 있으며 능력 게이지를 채운다. 능력 게이지가 가득 차면 <i>능력 활성화 버튼<\/i>을 길게 눌러 <b>핏빛 분노<\/b>를 발동할 수 있다.<br><br><b>핏빛 분노:<\/b> <b>핏빛 분노<\/b>가 활성화된 동안, <b>악귀<\/b>는 치명적인 피해를 입힐 수 있게 되며, <b>악마의 돌진<\/b>과 <b>악마의 일격<\/b> 능력을 추가로 얻게 된다.<br><br><b>특수 능력: 악마의 돌진<\/b><br><br><b>핏빛 분노<\/b>가 활성화된 동안 <i>능력 버튼<\/i>을 길게 눌러 <b>악마의 돌진<\/b>을 발동할 수 있다. 해당 능력을 사용하면 <b>악귀<\/b>는 먼 거리를 빠른 속도록 이동할 수 있게 된다.<br><br><b>특수 공격: 악마의 일격<\/b><br><br><b>핏빛 분노<\/b>가 활성화된 동안, <i>공격 버튼<\/i>을 길게 눌러 <b>악마의 일격<\/b>을 바라보고 있는 방향으로 발동할 수 있다. <b>악마의 일격<\/b>의 돌진 사정거리는 더 확장되며, 일격을 맞은 건강한 생존자는 즉시 빈사 상태에 빠진다. 떨어진 판자 또는 부서지기 쉬운 문을 타격하면, 특수 파괴가 적용된다."}},{"id":"Gunslinger","ko":"데스슬링거","en":"The Deathslinger","d":"복수심에 불타는 살인마는 먼 거리에서 생존자들을 창으로 찌르고 자신의 능력인 <b>구속자<\/b>를 이용해서 그들을 감을 수 있습니다.<br><br>그의 개인 기술인 <b>기어 헤드<\/b>, <b>차단 스위치<\/b>, 그리고 <b>주술: 응징<\/b>을 통해 생존자 목표를 찾아내어 방해하고 토템을 파괴한 생존자들을 처단할 수 있습니다.","story":"미국 중서부의 먼지 날리는 황무지에서 태어난 케일럽 퀸은 생존 사투를 벌이고 있던 아일랜드 이민자의 아들이었다. 정착의 끝에는 질병, 기근, 그리고 죽음이 흔한 광경이었으며, 그곳의 거물들이 잔치를 벌이는 동안 개척자들은 자신들이 어떻게 하면 나머지를 챙길 수 있는지 다투었다. 한때 엔지니어였던 케일럽의 아버지는 거래처가 '아일랜드인은 받지 않는다'라는 문구를 걸었을 때부터 일을 거의 할 수 없게 되었고, 같은 일에 관심을 보이던 아들에게 오래된 렌치를 선물한다.<br><br>아버지의 도움으로 케일럽이 만들었던 장비는 조금 진기했지만, 아버지가 떠난 후에는 빛을 잃고 말았다. 그는 작살의 날카로운 바늘을 인간의 눈에 관통 시켜 찢어 놓는 계획을 숨겼는데, 그를 괴롭히는 사람들에게 완벽한 계획이었다.<br><br>케일럽은 나이가 들면서 능력을 인정받기 시작했고, 그의 고용주들은 점점 차별을 버리며 마침내 서부 철도 회사의 사장인 헨리 베이쇼어가 그를 고용했다.<br><br>케일럽은 처음으로 땅에 철길을 위한 못을 박는 기계를 발명했고, 다음으로는 증기 동력 터널 드릴을 만들었다. 그러나 케일럽으로부터 특허를 훔쳐 판매된 장비들은 다른 회사들에서 가동되기 시작했으며, 사장인 베이쇼어는 시치미를 땠다.<br><br>익숙한 감각이 혈관을 관통해 케일럽의 가슴에 날카로운 고통을 안겨주었다. 부유한 자들이 그의 지적 노동으로 혜택을 누리는 동안 그는 계속해서 나머지 몫이라도 챙기기 위한 사투를 벌였다. 마침내 분노를 참지 못한 케일럽은 베이쇼어의 사무실에 찾아갔지만 묵사발이 났다. 사무실에서 끌려가는 동안 결국 자신이 만든 총을 사장의 배를 향해 발사했고 철길용 못이 피부와 내장을 관통하여 베이쇼어를 책상에 박히게 하였다.<br><br>다행히 예상치 못한 베이쇼어의 생존 덕분에 그는 교수형은 피할 수 있었다. 케일럽은 그 죄로 국가의 첫 사립 교도소인 헬셔 교도소에 15년 동안 갇혀 있었지만, 문맹이 유죄인 요새에서 그는 운이 좋게 학식 있는 교도소장과 친구가 되었다. 케일럽은 그를 위해 고문 기계를 설계해 주었고 대가로 식량을 더 받기도 하였다. 얼마 후 교도소장은 그의 판결에 대한 감형을 도와주었다. 그는 금전적 부, 정치적 자본보다 더 큰 무언가를 얘기했고, 그의 연줄을 이용하면 베이쇼어가 평생 감옥에 갇혀 썩게 할 수 있다고 했다. 단 한 가지 조건을 걸고 말이다. 천재성을 이용해 무법자들을 산 채로 잡아와 수감시켜 자신의 배를 부르게 해달라는 것.<br><br>케일럽은 작업장에 돌아와 몇 번의 수정을 거쳐 새로운 작살 총을 제작하였다. 첫 번째 테스트는 중국인의 세탁물을 훔친 도둑에게 이루어졌다. 금속 연결 부위가 끼익 소리를 내었으며 작살은 앞으로 쏠려 발사되었고 대상의 복부를 관통하였다. 작살이 당겨지면서 도둑의 내장도 같이 잡아당겼고, 비명과 함께 그들을 먼지투성이 길바닥에 내동댕이쳤다.<br><br>여러 번의 테스트 끝에 내장을 끄집어내는 일이 줄었다. 교도소장은 계속 자신의 연줄을 이용하며 마침내 아일랜드인들을 석방해주고 그의 무리까지 지어주었다. 헬셔 갱단이 탄생한 것이다.<br><br>그들은 6년 동안 나라 이곳저곳을 돌며 무법자들을 생포해 가두었고, 교도소장과의 협상에 대한 책임을 다했다. 어느 날 글렌베일에서 피의 전투가 펼쳐진 후 케일럽은 '헨리 베이쇼어, 헬셔 교도소의 새로운 소유주'라는 뉴스 기사를 발견했고, 사진 속에서는 조금 늙은 베이쇼어가 교도소장과 자랑스럽게 악수를 하고 있었다. 케일럽은 분노와 함께 심장이 요동쳤고, 혈관을 통해 피가 폭발하는 것 같았다. 그는 마침내 게임을 시작하기로 다짐했다.<br><br>헬셔 갱단의 멤버들은 케일럽에게 충성을 맹세하고 교도소장의 머리를 갈망했다. 우레와 같은 분노는 교도소 출입구를 박살 내었고, 피에 굶주린 살인마처럼 울부짖었다. 경비원이 총을 들고 주저했지만 곧 작살이 가슴에 날아와 꽂혔고, 케일럽은 남자의 머리를 잡아 터질 때까지 교도소 철창에 부딪혔다.<br><br>소장실에 다다른 케일럽은 문을 박차고 들어갔는데 운 좋은 광경을 목격하게 되었다. 교도소장뿐만 아니라 헨리 베이쇼어도 거기에 있었던 것이다. 분노에 완전히 지배된 케일럽은 베이쇼어에게 달려들어 그를 완전히 박살 냈고, 얼굴에서 떨어진 피가 바닥에 흥건했다. 헬셔 갱단 멤버들도 교도소장에게 달려들어 그의 뼈를 모두 부러트렸다.<br><br>죽어가던 두 사람이 목숨을 애원했지만, 무리는 그들을 붐비는 죄수들의 앞으로 던져버렸다.<br><br>그 둘의 피와 땀으로 물든 케일럽은 그의 옛 감방을 응시하며 추억에 잠겨있었기에 베이쇼어의 비명을 거의 듣지 못했다. 그의 손가락 끝에서 떨어진 한 방울의 피가 침대의 가장자리에 떨어졌고, 창으로 둘러진 창문 너머로 두껍고 부자연스러운 안개가 흘렀다. 그는 초점을 잃은 눈을 살며시 뜨며 깨지고 녹슨 오래된 렌치를 꺼내어 렌치의 조임 장치를 엄지로 어루만졌다. 그는 그것을 자신이 언제부터 가지게 되었는지 기억하지 못했지만, 신경 쓰지 않았다. 그는 발밑으로 먼지 묻은 길을 보았고, 그 길에 끝에서 그동안 당한 수모들이 떠올렸다. 자신을 괴롭힌 자들, 그를 이용한 자들 그리고... 헨리 베이쇼어. 안갯속에서 느껴지는 무언가가 그들을 없애기 위해 존재한다는 것을 느꼈다. 자비란 없는 강철 고리, 단순함 속에서 피어나는 화려함과 아름다움. 서 있는 동안 다리의 고통이 심했지만 그는 고통을 견디며 먼지 쌓인 길을 걸어 흐르는 피의 흔적을 뒤로 남긴 채 그곳을 떠났다.","perks":["DeadMansSwitch","Gearhead","HexRetribution"],"dlc":"Ukraine","power":{"ko":"구속자","en":"The Redeemer","d":"데스슬링거는 자신의 천재성을 활용, 기존 탄약을 체인이 부착된 날카로운 작살로 교체하여 개조한 혁신적인 발명품으로 현상수배범을 사냥한다.<br><br><b>구속자<\/b><br><br><i>능력 버튼<\/i>을 길게 눌러 시야를 조준할 수 있다. <i>공격 버튼<\/i>을 길게 눌러 생존자에게 박히도록 창을 쏘면 생존자들은 <b>데스슬링거<\/b> 쪽으로 감긴다.<br><br><b>감기:<\/b><br><br>생존자가 <b>구속자<\/b>에 의해 찔리면 <i>능력 버튼<\/i>을 길게 눌러 생존자를 살인마 쪽으로 당길 수 있다. 생존자는 체인에 저항하거나 주변 환경을 이용하여 체인으로부터 자신을 해방시킬 수 있다. 저항과 해방은 <b>데스슬링거<\/b>를 짧은 시간 동안 기절시킬 수 있지만, 생존자를 부상 상태에 빠트리고 <b>심각한 부상<\/b> 상태 이상 효과에 빠트린다. 생존자가 창에 찔린 동안 <i>기본 공격<\/i>을 사용하면 <b>데스슬링거<\/b> 및 생존자에 페널티 적용 없이 체인을 부실 수 있다. <i>기본 공격<\/i>으로 창에 찔린 생존자를 성공적으로 가격하면 건강한 상태에 <b>심각한 부상<\/b> 상태 이상 효과에 빠트린다.<br><br><b>재장전:<\/b><br><br><b>구속자<\/b>는 발사 시 즉시 재장전되도록 해야 한다. <i>능력 활성화 버튼<\/i>을 길게 눌러 <b>구속자<\/b>를 재장전할 수 있다."}},{"id":"K20","ko":"처형자","en":"The Executioner","d":"처형자, 지도를 조작하는 살인마. 그가 만든 위험 요소로 생존자들에게 고통을 안겨주는 능력이 있다. 영향을 받은 생존자는 그의 특수 갈고리인 <b>속죄의 우리<\/b>와 그의 고유 상징인 <b>최종 판결<\/b>에 취약하다.<br><br>그의 개인 기술, <b>강압 받은 속죄<\/b>, <b>고통의 흔적<\/b>, 그리고 <b>죽음 결속<\/b>으로 생존자를 속이고 쫓는 동안 그의 먹잇감을 적극적으로 뒤쫓을 수 있다.","story":"가학적이고 무자비한 처형자 삼각두는 고통을 주는 처벌에 집착한다. 강철로 된 틀이 머리를 조이고 거대한 대검을 찬 그는 사일런트 힘의 지옥 같은 복도를 활보했다. 그에게는 아무도 이해하지 못할 임무가 있었다. 그가 지나간 곳은 괴물들까지 그림자를 찾아 달아났고, 그의 길을 지나친 사람들은 공격의 희생양이 되었다. 임무를 마치고 그의 존재가 더 이상 필요 없음을 느낀 그는 오랜 휴식을 준비했다. 그럼에도 불구하고, 또 다른 곳에서 그를 부르고 있었다. 그를 감싸 안은 안개는 사일런트 힐에서의 안개와는 조금 달랐다. 마치 자신을 찾아 헤매는 의식이 있는 생명체 같았다. 그리고 그와 안개 사이에 무언의 동의가 있는 듯했다. 휘날리는 구름은 그의 임무와 가학증에 대해 속삭였다. 그렇게 삼각두는 안갯속으로 한 걸음 더 들어가며 자신의 임무를 다시 한번 받아들였다.","perks":["Deathbound","ForcedPenance","TrailofTorment"],"dlc":"Wales","power":{"ko":"판결 의식","en":"Rites of Judgment","d":"고통의 문을 열고 심판을 받아라! 대검은 땅을 갈라 지옥 같은 마음을 일으키며 다가오는 모든 이들에게 고통을 퍼뜨린다.<br><br><b>판결 의식<\/b><br><br><i>능력 버튼<\/i>을 길게 눌러 활성화시킬 수 있으며, 그 후에는 어떤 방향으로든 이동하여 지면에 흔적을 남긴다.<br><br>흔적 위를 걷거나 뛰는 생존자는 <i>살인마의 본능<\/i>을 발동시키며 <i>고통<\/i>에 걸린다. <i>고통<\/i>에 걸린 생존자가 빈사 상태에 있는 동안 <b>속죄의 우리<\/b>로 보내질 수 있다.<br><br><b>특수 공격: 지옥의 처벌<\/b><br><br><b>판결 의식<\/b>이 활성화된 동안 <i>공격 버튼<\/i>을 눌러 <b>지옥의 처벌<\/b>을 발동할 수 있다. 이 능력은 힘의 파장을 발산하며, 길 위에 아무 생존자를 타격할 수 있다.<br><br><b>특수 능력: 속죄의 우리<\/b><br><br><i>고통<\/i>에 빠져 죽어가는 생존자 위에 서서 <i>능력 활성화 버튼<\/i>을 누르면 생존자를 <b>속죄의 우리<\/b>로 보낼 수 있다. <b>속죄의 우리<\/b>에 있는 생존자는 갈고리에 걸린 것과 동일하게 희생될 수 있다. 엔티티에게서 벗어나기 위해서는 두 번째 소환 의식 단계가 진행되는 동안, 스킬 체크를 완료해야 한다.<br><br><b>속죄의 우리<\/b>에서 구조되거나 다른 생존자를 구조한 생존자의 <i>고통<\/i>은 제거된다.<br><br><b>특수 능력: 최종 판결<\/b><br><br>갈고리 또는 우리에서 이미 저항 단계에 도달하여 <i>고통<\/i>에 빠져 죽어가는 생존자 위에 서서 <i>능력 활성화 버튼<\/i>을 눌러 처형할 수 있다."}},{"id":"K21","ko":"블라이트","en":"The Blight","d":"예측 불허의 살인마는 그의 기술인 <b>황폐화된 부패<\/b>를 사용하여 빠른 속도로 돌진 후 장애물을 제거하여 생존자에게 부상을 입힐 수 있다.<br><br>그의 개인 기술, <b>드래곤의 손아귀<\/b>, <b>주술: 불멸<\/b> 및 <b>주술: 피의 호의<\/b>로 발전기, 토템 그리고 판자에 강력한 효과를 발동시킬 수 있습니다","story":"‘인간의 조건을 이해하려면 인간을 초월해야 한다.’ 이는 스코틀랜드의 화학자 탤벗 그라임스의 신조였는데, 그의 억제되지 않은 야망이 그를 우뚝 솟은 높은 곳까지 데려다주었다. 어린 시절부터 그는 인기가 많은 소년이었다. 똑똑하고, 카리스마가 있었으며, 권한에 도전하는 데 두려움이 없었다. 하지만 사회적인 태도에도 불구하고 매우 독립적이었고, 그는 마을 근처의 무성한 들판을 혼자 탐험하는 데 많은 시간을 보냈다. 어린 시절의 호기심으로 독성이 강한 디기탈리스의 한 부분을 가지고 실험하다 거의 죽을 뻔한 적도 있다. 수일 동안, 그는 땀으로 흠뻑 젖은 침대에 누워 그는 배 속에 있는 모든 음식을 게워냈다. 하지만 죽을 고비를 넘기고 회복한 그의 머릿속에는 두려움보다 어떻게 작은 꽃 한 송이가 그에게 그렇게 큰 영향을 끼칠 수 있는가에 대한 환상이 자리 잡았다.<br><br>성인이 되면서 그의 야망은 그의 의심쩍은 방법만큼이나 빠르게 성장했다. 그는 런던 의과대학에 진학했다. 여러 번의 질책에도 불구하고 뛰어난 실력을 발휘했다. 한계까지 밀어붙이는 그의 성격 덕에 그는 동인도 회사에서 자리를 하나 맡게 되었고 7년도 안 되는 시간 만에 그는 수석 화학자가 되어 있었다. 이윽고, 그는 자신의 가장 큰 업적 중 하나인 노동자의 생산성을 높이는 동시에 휴식의 필요성을 줄일 수 있는 화학 물질을 완성했다. 그리고 그는 다이어 섬의 수용소 아래에 있는 비밀 실험실로 보상을 받았다.<br><br>인도 앞바다에서, 아편 전쟁으로 끌려온 죄수들은 본의 아니게 그의 피실험체가 되었고, 그는 그들을 이용하여 믿을 수 없을 정도의 고통을 견딜 수 있게 해주는 약을 군인들을 위해 개발하게 되었다. 대부분의 부작용은 경미했지만, 몇몇 군인들은 약 복용으로 인해 정신이 나갔다는 소문이 돌았다. 마을을 떠돌아다니며 사람들을 총검으로 찔러 학살하고 나무에 매달기도 했다는 소문이었다. 그들에 대한 공식적인 보고는 없었지만, 탤벗은 과장한 전쟁 이야기라며 자신을 탓하지 않았다.<br><br>비록 그의 냉담한 총명함은 동요하지 않은 듯 보였지만, 그의 의심쩍은 업적이 만들어낸 적들에 대해서는 매우 무지했다. 이에 대한 깨달음은 생각보다 무식하게 다가왔다. 망갈로르로 여행하는 중 누군가 그의 뒤통수를 가격했고, 그는 포박당한 채 마차에 실렸다. 그의 눈을 덮고 있던 눈가리개가 벗겨졌을 때, 병든 한 남자가 그에게 수백 구의 시체로 가득 찬 무덤들을 보여주었다. 탤벗이 알지 못한 사이에, 생산성을 높여준다는 그의 약이 공장에 있는 모든 사람들을 죽음으로 몰고 간 것이다. 그는 납치범들의 분노와 비난으로부터 자신을 지킬 수 없다는 걸 알고 있었다. 납치범들이 쇠 파이프로 그를 구타하자, 그는 그저 몸을 웅크릴 수밖에 없었다. 납치범들은 탤벗의 몸뚱어리를 시체 더미에 던져, 그가 시체들 사이에서 죽음을 맞이하도록 방치했다. 그의 손가락이 썩은 시체를 파고들었지만, 그는 마다하지 않고 탈출을 위해 깜깜해지는 의식을 붙잡으며 기어갔다. 흑파리가 그의 벗겨진 살을 파먹자, 수백 개의 바늘이 찌르는 듯한 고통이 느껴졌다. 다시 쓰러진 그는 죽은 여인의 눈부신 녹갈색의 눈을 마주하고, 그렇게 평생의 업적을 목격하게 되었다.<br><br>그는 죽음의 끝자락에서 다시 되살아났다. 눈을 떠보니 그는 작은 침대에 뉘어져 있었고, 그 옆엔 주름진 한 사람이 그를 간호하고 있었다. 수도원으로 가장한 신비로운 학교, 고통스러운 숨을 들이마실 때마다 그의 건강이 돌아왔다. 높지만 겸손한 벽 뒤로 신록의 정원이 펼쳐져 있었고, 그곳에서 수도사들은 금지된 문자를 연구했으며, 인간의 정신세계를 이해하기 위해 다른 차원을 찾으려 애썼다. 다른 차원도 우리를 찾으려 한다는 믿음을 가진 채 말이다.<br><br>탤벗의 지식은 그곳에서 없어선 안될 존재였고, 그의 정신착란 화합 물질은 신경 팽창 이론과 아주 매끄럽게 통합되었다. 그러자 그는 그의 부활은 우연이 아닌, 학교의 지식수준을 높이기 위해 시체 더미에서 구원받았다고 생각했다. 그는 치료가 끝날 때까지 학교에 남아, 송과샘에서 추출하여 만든 화합물로, 소위 영혼의 화학 물질로 불리는 심안을 뜨게 할 물질에 대한 연구를 돕기로 했다. 그를 구해준 이의 부탁으로 시작한 연구는 점점 집착으로 변해갔다. 학교의 잃어버린 문헌 기록 보관소를 자세히 살펴보던 그는 이전에는 생각할 수 없었던 아이디어를 확증하는 과학적 공식들을 찾아냈다. 인류를 새로운 계몽으로 이끌어나갈 꿈을 꿨다. 아마도, 그때쯤 일까, 눈부신 녹갈색 눈과 죽은 수백 명의 공장 인부들이 그의 머릿속에서 사라지기 시작한 것이…<br><br>그가 돌파구의 끝에 다다르자, 수도사들의 태도가 변하기 시작했다. 그들이 내민 온화한 미소는 곧 불안한 눈빛으로 변했고, 그와 나누던 공손한 대화는 숨죽인 중얼거림으로 변해갔다. 침대 위 석고 천장에 신경세포처럼 간 금이 그가 마지막으로 본 학교의 모습이었다.<br><br>그 후, 그의 마지막 기억은 산산조각 난 이미지와 감정이 흐릿하게 섞여 있었다. 얼룩진 불빛, 자갈돌 위에 말발굽 소리, 볼을 긁는 거친 삼베, 팔에 날카로운 상처. 누더기를 걸친 채 아편굴의 매트리스에 누워 있던 탤벗이 생각할 수 있던 거라곤, 그의 획기적인 발견을 기록한 기록물뿐이었다. 그는 우중충한 지하실을 헤집고 다니며 큰소리로 도움을 간청했다. 하지만 돌아온 것은 주변에 그와 함께 아편에 취한 사람들의 무관심한 시선이었다. 로브를 쓴 사람들이 그의 주변을 둘러싼 것을 알아차리기도 전에 그의 팔에 주삿바늘이 꽂혔고 그의 세상은 다시 한번 사라졌다.<br><br>다시. 깨어났다. 기억은 지난 번보다 더 흐릿해졌다. 그는 텅빈 치아사이로 혀를 내민다. ‘얼마나 시간이 흐른 걸까.’ 흐릿한 기억이 다시 돌아왔다. 영혼의 화학 물질. 그의 노트. 돌파구에 가장가리. 멀리서 들리는 속삭임이 그의 뇌리를 스쳤다.<br><br>그는 떨리는 손으로 돌맹이를 만지작거리며 돌을 날카롭게 갈았다. 소굴의 희미한 불빛 속에서, 격변하는 아편쟁이들 사이에서, 그는 기억 속에 남은 자신의 연구를 벽에 써 내려갔다. 그는 손가락으로 피가 날 때까지 몇 시간 동안 기록들을, 벽에, 그리고 바닥에 써 내려갔고, 알아듣지 못하면서도 목소리가 속삭이는 모든 것을 받아 들었다. 더 이상 쓸 곳이 남아 있지 않자 그는 돌멩이를 움켜쥐고 메시지를 가슴에 새겼다. 피로 물든 그의 앞에 푸르스름하고 주황색 꽃이 핀 장엄한 들판이 나타났다. 기적이었다, 적어도 그에게는… 속삭임은 들판으로 들어와 인간들이 이해할 수 없는 세계와 차원을 발견하라고 그에게 말했다. 그 순간, 탤벗은 어린 시절 느꼈던 경이로움을 느꼈다.<br><br>아편굴의 사람들은 침묵에 잠겼고, 건조한 연기 향기는 아직도 공중에 남아 있었다. 약물로 흐릿해진 안개를 털어낸 그들은 돌바닥이 피로 젖어 있는 것을 발견했고, 작은 개울들이 갈라진 틈 사이로 구불구불 흐르고 있었다. 어두컴컴한 방에 적응한 그들은 작은 개울을 따라 들쭉날쭉 휘갈긴 글씨를 발견했다. 끊임없이 써 내려간 그 글의 끝에는 단, 한 문장이 써져있었다: <i>죽음은 단지 시작일 뿐이다<\/i>.","perks":["DragonsGrip","HexBloodFavor","HexUndying"],"dlc":"Yemen","power":{"ko":"황폐화된 부패","en":"Blighted Corruption","d":"고름집 세럼이 그의 혈관 속을 흐르며, 그의 심신을 손상시키지만, 비정상적인 신체적 능력을 부여한다.<br><br><b>특수 능력: 질주<\/b><br><br><i>능력 버튼<\/i>을 눌러 빠르게 앞으로 <b>질주<\/b>한다. 질주 시, <b>질주<\/b> 토큰을 소모한다. <b>질주<\/b>가 발동되는 동안, 블라이트는 공격을 개시할 수 없다.<br><br>주변에 있는 벽이나 장애물을 향해 <b>질주<\/b>해 <b>충돌<\/b>할 수 있다. <b>질주<\/b>하여 벽이나 장애물에 다다를 수 없거나 블라이트의 <b>질주<\/b> 토큰이 부족한 경우, 짧은 탈진 상태에 빠지며 토큰은 충전된다.<br><br><b>특수 공격: 치명적인 질주<\/b><br><br><b>충돌<\/b> 후, <i>능력 버튼<\/i>을 눌러 <b>치명적인 질주<\/b>를 발동할 수 있다. 질주 시, <b>질주<\/b> 토큰을 소모한다. <b>치명적인 질주<\/b>는 블라이트가 <i>공격 버튼<\/i>을 눌러 공격을 개시하는 것을 제외하면 <b>질주<\/b>와 동일하다. 떨어진 판자 또는 부서지기 쉬운 문을 타격하면, 특수 파괴가 적용된다.<br><br>떨어진 판자를 부수면, <b>질주<\/b> 토큰을 최대 2개 소모한다."}},{"id":"K22","ko":"쌍둥이","en":"The Twins","d":"협력적인 살인마 짝꿍으로 <b>피의 유대<\/b> 능력을 사용하여 자신들을 나누고 함께 사냥할 수 있습니다.<br><br>쌍둥이의 개인 기술인 <b>호더<\/b>, <b>억압<\/b>, 그리고 <b>최후의 일격<\/b>으로 생존자의 행동을 감시할 수 있으며, 진행 상황을 방해하고 더욱 효과적으로 사냥할 수 있습니다.","story":"샴쌍둥이 샬롯과 빅터 데헤이스는 남다른 감정적 유대감을 형성하고 있다. 17세기에 그들이 성공적으로 이 세상에 나왔다는 것이 기적이라고 말할 수 있겠지만, 그들은 곧 핍박의 삶을 살게 된다. 빅터의 하체는 여자 형제의 가슴에 붙은 채, 그리고 그 여자 형제의 근육과 장기를 중심으로 다리가 뒤틀린 채 태어난다. 그는 샬롯보다 조금 작았는데, 시간이 흐르고 그는 하나의 완전한 형태가 아닌 마치 샬롯의 부속물처럼 자라났다. 신생아들이 꽥 하는 날카로운 소리를 지르자, 그들의 출산을 도운 산파도 마녀가 악마를 낳았다며 비명을 지르며 산모의 집에서 도망쳤다. 그렇게 샬롯, 빅터, 그들의 어머니 마들렌을 향한 사냥이 시작되었다.<br><br>쌍둥이에게 그 후의 시간은 깜짝할 새 지나간 추억이었다. 그들은 어머니와의 여행이 모든 아이들이 겪는 보통의 일이라고 믿었고 프랑스 시골 마을을 통해 숨바꼭질을 하는 듯한 게임이 평범한 일상이라고 생각했다. 그들에게 그것은 가장 정상적인 삶에 가까운 것이었다. 5살이 되던 해, 새로운 도전이 그들에게 찾아왔다. 어머니의 병이었다. 창백해진 얼굴과 힘없는 몸… 마들렌은 샬롯에게 식량 수집을 맡겨야 했다. 튀어나온 빅터의 몸을 감출 수 있도록 여벌의 옷을 겹겹이 입은 어린 소녀는 부담감을 느끼며 숲속의 움막을 나와 가까운 마을로 향했다. 이상한 광경이었지만, 그녀는 시장이 열릴 때를 기다려 연습한 대로 손에 집히는 음식들을 슬쩍했다. 성공적이었지만, 그리 오래가지 않았다.<br><br>자정이 지나고 시뻘건 불길들이 어둠 속을 휙휙 지나며 가족의 움막을 에워쌌다. 위엄 있는 외침 소리는 밤의 정적을 깨뜨렸고 마녀 사냥꾼의 무리가 몰려들었다. 추잡한 손이 쌍둥이들을 침대에서 떼어내려 다가왔고 샬롯은 그런 손을 향해 미친 듯이 발길질했다. 마들렌은 자식들을 살려달라며 부르짖었다. 하지만 두개골이 깨지는 둔탁한 소리와 함께 다시 조용해졌다. 덫에 걸린 쥐처럼, 빅터는 비명을 질렀다.<br><br>사냥꾼들은 일을 재빠르게 처리해나갔다. 판사는 마들렌이 마법을 행했으며 이는 악마를 낳은 것으로 증명되었다고 선언했다. 판결이 내려진 지 몇 분도 되지 않아, 그들은 마른 나뭇가지와 이끼로 그녀의 발을 죄었고 의식이 없는 그녀의 몸을 나무에 묶었다. 잠시 후 정신을 차린 마들렌은 저항하지 않았다. 단지, 자식들에게 고개를 돌리라며 애원할 뿐이었다. 하지만 형제에게는 선택권이 없었다. 횃불에 불이 붙어졌고 그 불이 어머니의 치마에, 그리고 그 위로 솟구쳐 올라 어머니의 살을 휩싸는 것을… 지글지글 타오르는 것을 강제로 지켜볼 수밖에 없었다. 어머니의 몸에서 떨어져 나오는 지방, 거품이 일며 일그러지는 어머니의 얼굴. 그들은 불길이 그녀의 성대를 찢어 비명이 더 이상 들리지 않을 때까지 모든 것을 지켜봤다. 그곳에 남은 것은 불씨가 타닥이는 소리와 메스꺼운 악취뿐이었다.<br><br>그들 안에 있던 기쁨과 선함은 어머니와 함께 죽음을 맞이했다. 우리에 갇힌 채 오래된 목조 사원으로 옮겨진 그들은 검은 망토를 입은 비밀스러운 집단에게 팔렸다. 빅터는 다가오는 모두를 할퀴고 물어뜯으며 흉포하고 폭력적인 짐승처럼 반응했다. 그를 진정시킬 수 있던 건 샬롯의 포옹뿐이었다. 동생을 제외한 모든 이에게 쓰라린 증오심을 품은 그녀는 삶의 목적을 동생을 지키는 데 쓰기로 했다.<br><br>그들은 사원에서 몇 년동안 특이한 실험을 당했다. 어떤 실험은 잔인했지만, 대부분은 이해할 수 없는 실험들이 많았다. 어느 날은 작은 회색빛 새의 목을 꺾으라는 명령을 받았고, 그다음에는 손가락에 피를 흘리며 장미 꽃병을 만들어야 했다. 또한, 7일마다 축축한 참나무 가지를 베개 밑에 깔고 자야 했으며, 일정한 시간마다 망토를 입은 사람들의 끝없는 노랫소리를 들어야 했다. 이윽고, 마지막 실험이 계획되었다. 예복을 입은 두 명이 쌍둥이를 사원의 중앙으로 데려갔다. 그리고 샬롯을 나무 촛대가 있는 방의 제단 위에 올려놓았다. 주름진 얼굴의 남자는 자신의 후드 밑으로 쌍둥이를 응시하며 두 손으로 쌍둥이의 두개골을 조심스럽게 검사했다. ‘죽음을 기억하라.’ 그는 반짝이는 검을 빼 들며 속삭였다.<br><br>샬롯은 빅터를 제단 밖으로 밀치며 옆쪽으로 뒹굴었다. 남자는 으악 소리를 내며 팔을 최대한 뻗었고 나무 촛대는 바닥으로 떨어졌다. 불길은 삽시간에 마른 나무에 옮겨붙었고 이윽고 온 바닥에 불길이 닿았다. 그리고 그곳에 서 있던 남자의 망토에까지… 고통의 비명이 혼돈을 뚫고 샬롯에게 활력을 불어넣었다. 그녀는 불길, 검은 연기, 그리고 이글거리는 불꽃 사이를 뚫고 달렸다. 그녀의 폐 안으로 검은 연기가 들었고 타는 듯한 연기의 무거움이 느껴졌다. 출구는 찾을 수 없었고 내딛는 한발 한발에 그들을 집어삼킬듯한 열기만이 존재할 뿐이었다. 그녀는 무릎을 꿇었다. 숨이 막혔다. 그리고 그녀 앞에 햇빛과 나무들이 보였다. 그녀는 비틀거리며 이슬이 맺힌 수풀 속으로 걸음을 옮기기 시작했다. 그녀는 뒤도 돌아보지 않고 숲속으로 뛰어 들어갔다. 그리곤 정신을 잃었다.<br><br>샬롯은 눈을 뜨자마자 동생 빅터의 손을 잡으려고 했지만, 그는 꿈쩍도 하지 않았다. 빅터의 몸은 샬롯의 몸통에 힘없이 매달려 있었다. 그녀는 그의 얼굴을 꼭 껴안고 아직 슬프고 고요한 눈을 바라봤다. 지난 몇 년간 함께였기에 익숙하던 동작들, 즉 그의 몸이 그녀의 피부를 잡아당기고, 다리가 그녀의 흉부에 있는 구멍을 찌르던 감각들… 아무것도 느껴지지 않았다. 빅터가 죽었다.<br><br>슬픔에 잠긴 샬롯은 검은 망토를 입은 자들과 마녀 사냥꾼이 근처를 배회할까 두려워 계속해서 이동했다. 죽은 동생의 시신을 옷 속에 감추고 인근 도시의 하수구로 향했다. 그곳에서 그녀는 텐트를 지었다. 음식을 최대한 많이 훔치기 위해서만 모습을 드러냈고 절망감이 느껴질 때쯤엔 돼지들이 먹는 음식 찌꺼기에 의지하였다. 시간이 흐르자 빅터의 시신은 사지가 흘러내려 검고 그을리며 썩어갔지만 샬롯의 피가 동생의 몸에 흐르는 듯이 완전히 부패되진 않았다. 빅터의 죽은 몸을 보호하는 것은 샬롯의 유일한 존재 이유가 되었다. 그녀는 남겨진 유일한 가족과의 이별하기 위해 필사적이었다.<br><br>샬롯의 십대 시절은 여전히 생존 게임과 같았다. 인간에 대한 증오는 날이 갈수록 커져갔고 그녀는 그 증오가 절대 사라지지 않을 것이라는 것을 깨달음을 얻게 되었다. 그녀가 실패한 도둑질과 필사적이었던 탈출 시도 중 얼마나 많은 사람이 죽었든 간에 상관없이 그녀를 쫓고 그녀를 향해 던져진 비난의 말들이 더 많았다. 괴물, 악마, 마녀. 그중, 검은 망토를 입은 자들이 가장 나쁜 자들이었다. 그녀를 향한 그들의 사냥은 끝날 줄 몰랐기에 그녀는 쉴 새 없이 피난처를 버리고 도망칠 수밖에 없었다.<br><br>샬롯은 몇 년 간 필요에 따라 피를 뽑았고 밤에는 죽은 그녀의 동생을 안고 도망쳤다. 몹시 추운 겨울이 찾아오면 샬롯의 몸은 아주 안 좋아졌다. 음식은 부족했고 아무렇게나 지은 판잣집도 혹한 겨울에는 아무런 소용이 없었다. 그녀는 숲속의 캠프파이어 근처로 몸을 숨겼다. 검은 망토를 입은 자들이 그녀를 먼저 데려갈지, 이 겨울의 추위가 그녀를 데려갈지 알 수 없었다. 샬롯의 콧구멍에 서리가 서렸고 입술은 은은한 푸른빛이 돌기 시작했다. 그녀는 한 번도 경험하지 못한 것을 느꼈다. 그녀는 눈을 감았다. 죽음의 평온함을 받아들이는 듯… 하지만 그때 날카롭고 악랄한 소리가 그녀의 귀를 찔렀다. 그녀가 미처 반응하기도 전에, 빅터는 핏덩이의 몸으로 샬롯의 몸에서 빠져나와 눈 위에 착지했다. 그리고 도망쳤다.<br><br>샬롯은 죽음의 문턱에서 빠져나와 추격하기 시작했다. 그녀는 동생의 이름을 부르며 숲속을 헤맸다. 다리에 힘이 빠질 때까지, 그리고 그녀의 시야에 빅터, 자신의 동생이 보일 때까지. 빅터는 진한 안개의 끝에 앉아 있었다. 이윽고 안갯속에서 후드를 뒤집어쓴 어두운 형제가 그의 팔을 붙잡고 그를 속박하자 뒤틀리고 야만적인 그의 얼굴은 비명을 질렀다. 샬롯의 삶에 조금씩 찾아오던 평온은 그녀가 그토록 오랫동안 의지해 온 들끓는 증오와 분노로 대체되어 소멸되었다. 낫을 꽉 움켜쥔 채, 그녀는 안갯속으로 돌진했다. 동생에게 다가오는 자들의 내장을 꺼낼 준비가 되어있던 그녀였다.","perks":["K22P01","K22P02","K22P03"],"dlc":"Aurora","power":{"ko":"피의 유대","en":"Blood Bond","d":"피와 트라우마로 영원히 결속됐지만 공유된 몸을 분리할 수 있는 능력이 주어졌다. 남매로서 함께 사냥하고 생존자에게 가하는 위협을 두 배로 증가시킨다.<br><br><b>특수 능력: 피의 유대<\/b><br><br><i>능력 버튼<\/i>을 길게 눌러 <b>빅터<\/b>를 방출할 수 있다. <i>어빌리티 버튼<\/i>을 탭하여 <b>샬롯<\/b>과 <b>빅터<\/b>간 교차 조작할 수 있다.<br><br>빅터가 혼자 남겨지는 동안, <b>빅터<\/b>는 <b>살인마의 본능<\/b>을 발동시켜 주변에서 걷거나 뛰는 생존자들의 윤곽선이 <b>샬롯<\/b>에게 드러난다. <b>빅터의<\/b> 비명을 들을 수 있는 생존자는 예민하게 반응한다. 살인마 역할의 플레이어가 <b>샬롯<\/b>을 조작하는 동안 <b>빅터<\/b>는 생존자에 의해 으스러질 수 있다.<br><br>으스러지면 약간의 시간이 지난 후 <b>빅터<\/b>는 <b>샬롯<\/b>의 몸에서 다시 자라난다.<br><br><b>특수 공격: 덮치기<\/b><br><br><b>빅터<\/b>를 조작하는 동안, <i>어빌리티 버튼<\/i>을 길게 눌러 <b>덮치기<\/b>를 차지할 수 있으며 <i>공격 버튼<\/i>을 탭하여 방출할 수 있다.<br><br><b>덮치기<\/b> 공격에 성공하면 생존자에게 피해를 줄 수 있다. 만약 생존자가 건강한 상태라면, <b>빅터<\/b>는 생존자에게 달라붙어, <b>살인마의 본능<\/b>을 발동하여 주변에 있는 모든 생존자의 위치를 드러낼 수 있다. 생존자에게 달라붙은 상태에서 생존자는 <b>치료 불능<\/b>, <b>인지 불가능<\/b>, 그리고 <b>불구화<\/b> 상태 효과에 빠진다. 이러한 상태 효과에 빠진 생존자들은 캐비닛에 들어가거나 출구를 통해 나갈 수 없다. <b>빅터<\/b>가 생존자들에게 달라붙은 상태에서 생존자는 <b>제거<\/b> 행동을 완료하여 그를 으스러뜨릴 수 있다.<br><br>만약 <b>빅터<\/b>의 <b>덮치기<\/b>가 실패할 경우, 그는 순간적으로 취약해져 생존자에게 으스러질 수 있다. 만약 빅터가 자신보다 큰 방해물에 착지하면 그는 파괴된다."}},{"id":"K23","ko":"트릭스터","en":"The Trickster","d":"자신의 능력인 <b>명연주<\/b>로 칼의 질풍을 방출할 수 있는 사거리 살인마.<br><br>그의 개인 기술, <b>덕통사고<\/b>, <b>주술: 군중 통제<\/b> 및 <b>출구 없음<\/b>으로 구출자가 될 가능성이 높은 생존자들을 빠르게 쓰러뜨리고 자신에게 유리하게 쪽으로 희생제 내 지역들을 차단한다.","story":"학지운, 그는 자신을 바라보는 모든 이들의 눈과 자신의 이름을 외치는 자들로부터 힘을 얻었다. 그 위신 속에서 그는 단 한 가지의 욕망으로 채워져있었다. 바로 더 많은 것을 갈구하는 욕망. 그는 어린 시절부터 사람들을 끌어모으는 끄는 재주가 있었다. 그는 가족들이 운영하는 식당에서 칼을 던지는 공연을 했다. 그의 재주 덕분에 식당은 장사진을 이뤘다. 특히 이것이 한국 전통 공연이라고 단단히 오해한 허술한 여행자들은 이 공연을 보기 위해 기꺼이 돈을 냈다. 지운의 아버지는 식당에서 번 돈을 아들의 춤과 보컬 레슨에 사용했다. 지운이 결코 얻을 수 없는 명성을 위해 아들을 몰아붙였다.<br><br>지운은 실망하지 않았다. 하지만 오디션에 도전한지 몇 년이 지난 지금, 그는 노래로 스타덤에 올랐다. 이윤진, Mightee One 엔터테인먼트의 프로듀서가 지운을 그녀의 트레이닝 프로그램에 합류시킨 것이다. 지운은 서울의 한 기숙사로 옮긴 뒤 하루 14시간 동안의 트레이닝을 통해 스타로 거듭나고 있었다. 그녀는 지운에게 춤과 노래를 가르쳤으며 자신감과 겸손 사이에서 균형 있게 행동하는 법을 가르쳤다.<br><br>지운은 물 흐르는 듯이 그 과정을 따랐고 효과가 있었다. 윤진은 지운을 NO SPIN 밴드의 새 멤버로 선택했다. 밴드에는 날것의 에너지가 필요했다. 명성은 곧바로 그들을 뒤따랐다. 지운의 하루는 수많은 인터뷰와 팬들의 찬양으로 가득했다. 다른 밴드 멤버들에겐 죽음의 스케줄이었던 반면, 지운에게는 힘이 되었다. 그에겐 하루하루가 자신이 어느 중산층의 사람들보다 위대한 존재라는 것을 증명해주는 것이기 때문이다.<br><br>하지만 시간이 흐르고, 인기는 시들어갔다. 그의 눈에는 팬들의 사랑이 다섯 갈래로 갈라져 각 밴드 멤버들 사이로 희미해지는 것으로 보였다. 자신을 통해 터져 나왔던 검증은 그로 하여금 더 많은 것을 갈망하게 만들었다.<br><br>지운은 오랫동안 혐오 속에 묻혀 있던 매력을 흉내 내면서도 윤진이 꾸며놓은 이미지를 유지해갔다. 그는 밴드 멤버들과 함께 NO SPIN의 신규 앨범을 녹음했고, 단 한 음도 놓치지 않았다. 긴 점심을 즐기고 스튜디오로 다시 돌아온 지운은 뜻밖의 행운을 맞이하게 된다. 스튜디오는 전선 타는 냄새로 가득했다. 그는 재빨리 조정실로 달려갔지만 그곳엔 천장에서 떨어진 스피커가 문을 막고 있었다. 조정실의 반대편에는 밴드 멤버들이 불 옆에서 울부짖으며 문을 두드리고 있었다.<br><br>지운은 멤버들의 이름을 부르며 스피커 쪽으로 돌진했다. 그는 스피커를 옮기기 위해 힘을… 아니, 그는 그대로 멈춰있었다. 그대로 얼어붙었다. 그가 내쉬는 호흡 하나하나는 그의 주의를 집중시키기 위한 의도적이었으며 고의적인 과정이었다. 그는 울음소리가 거의 들리지 않을 때까지 천천히 뒤로 물러났다. 그리고 그의 귀에 마지막으로 담긴 멤버들의 비명... 그들의 불타는 순간까지 지운의 이름을 불렀다. 살려달라고… \"지운아! 학지운!\" 그가 들어본 소리 중 가장 아름다운 소리였다. 소방대원들이 도착했을 때 그가 보인 눈물은 진실이었다.<br><br>지운은 동료들을 구하기 위해 모든 것을 시도한 비극적인 영웅으로 칭송받았다. 사고 후 윤진은 지운에게 새로운 이미지가 자리 잡힐 수 있도록 수많은 인터뷰를 준비했다. 지운은 거친 겉모습 아래 상냥한 마음을 지닌 솔로 싱어송라이터, 트릭스터로 다시 태어났다. 그러나 콘서트 무대와 TV 무대에서 멀어지면 그의 마음속에 어두운 무언가가 자라났다.<br><br>그는 혼자 사는 사람을 목표로 삼아, 한밤중 그들을 찾아갔다. 첫 번째 희생자는 매혹적인 음색을 가진 음대 학생이었다. 지운은 야구방망이로 그의 두개골을 내리쳐 그의 잠을 깨우고 헝겊으로 팔과 다리를 묶고 입을 막았다. 그는 그를 산 채로 해부하면서 몇 시간 동안이나 그를 고문하였다. 하지만 무언가가 빠져있었다. 지운은 화재 사고에서 울려 퍼졌던 비명소리, 그리고 사건과의 연관성을 원했다. 그가 남자의 배를 가를 때 애원하는 희생자의 기분 좋은 목소리가 듣고 싶었다. 하지만 입을 막은 헝겊 너머로 들러오는 것은 숨죽인 채 흐느끼는 그의 울음소리뿐이었다.<br><br>지운은 학습했고 잘못된 점은 바로잡았다.<br><br>지운은 희생자들을 납치해 폐건물로 데려갔다. 그 건물에서 그들의 목소리가 아무런 제약도 받지 않고 감정을 담아낼 수 있도록 말이다. 그는 다른 종류의 비명과 울부짖음을 만들기 위해 적절한 장소로 가 그들의 목소리로 음악을 만들었다. 허리 부근의 근육인 요방형근을 찌르면 길고 목 뒷부분에서 나오는 듯한 울부짖음을 만들었고 경동맥을 끊으면 교살당하는 고양이의 울음소리처럼 들였다. 그들의 고통에는 정직함이 있었다. 지운은 각 세션을 녹음하며 자신의 곡에 삽입해 멜로디 뒤에 감췄다.<br><br>그는 대담했다. 최근 화보 촬영 중 착용했던 밍크 보아 스카프를 자신이 베여버린 희생자의 목에 감아놓았다. 그다음에는 자신의 뮤직비디오에 권투선수로 출연한 남자의 치아를 뽑고 살해했다. 그는 VIP 팬미팅에 온 팬의 살해한 뒤 그녀의 눈알을 뽑고 그 자리에 자신의 커프링크를 꽂아두었다. 그리곤, 그녀의 가슴팍에 그녀의 피로 ‘신을 보았다’라는 글귀를 써놓았다. 이는 모두 사람들의 이목을 집중시키기 위한 살인이었다. 모든 장면 하나하나가 눈부셨다.<br><br>음악과 살인 사이에서 지운의 작품은 전 세계 사람들의 입에 오르내렸다. 그러나 폭력이 그가 선호하는 예술 스타일이 되면서 그의 음악적 커리어는 땅에 떨어지고 말았다. 수익은 하락했고 Mightee One 경영진들은 그를 향해 손가락질했다. 윤진은 자신의 가수를 지키기 위해 경영진을 향해 분노를 쏟아부었지만, 역부족이었다. 하여 그녀는 지운이 더 이상 혼자서 제작을 할 수 없도록 하였다.<br><br>결정은 충격적이었다. 지운은 자신의 곡들이 진정한 인류를 음악으로 융합시켰다고 주장했지만, 경영진은 평범하지 않거나 자신들의 기대와 다른 곡은 모두 퇴짜를 놓았다. 그렇다면… 그들이 지운의 예술을 이해하지 못한다면 그들이 이해할 때까지 인간의 소리를 첨가시킬 것이다.<br><br>3개월… 지운이 Mightee One 엔터테인먼트의 경영진을 위해 비공개 공연을 준비한 시간이었다. 그의 걸작을 보여주기 위한 3개월이었다. 그는 수의사에게 어마어마한 돈을 송금하고 아산화질소가 담긴 통을 손에 넣었다. 그 후, Mightee One의 무대 기술자에게 뇌물을 먹여 자신이 비공개 공연이 진행될 홀을 미리 이용할 수 있도록 부탁하였다. 보통 사람이었다면 사람들의 의심을 살 것이 뻔했지만, 그의 유명세 때문일까, 아무도 그를 의심하지 않았다. 공연시간이 다가오자 예정보다 조금 늦은 지운을 기다리며 경영진들과 무대 담당자들이 각자의 자리에 착석했다.<br><br>그가 도착했을 때쯤 반쯤 의식을 읽은 사람들이 좌석 뒤에 널브러져 있었고 몇몇은 바닥을 기어 다니고 있었다. 지운은 재빨리 작업을 시작했다. 사람들을 모두 묶기 시작했다. 그러나 윤진, 자신을 진흙탕에서 구해내고 지운이 마땅히 받아야 할 사랑의 존재를 일켜줘준 여자 앞에서는 잠시 멈춰 섰다. 지운은 아주 특별한 방법으로 그들에게 다가올 경의로움을 경험할 수 있도록 그녀에게 보상을 내리기로 했다. 진정제를 투약한 후에도 그녀는 미친 듯이 몰아치는 폭풍처럼, 저항했다. 다른 사람들보다 더 강한 상대였다. 지운은 윤진을 단 한 명의 외로운 청중으로 받쳐 들고 그녀의 눈을 똑바로 쳐다봤다. 그리고 눈물을 흘리며 흐느끼는 나머지 사람들을 무대 위로 끌고 온 뒤 그들의 마지막 공연을 준비했다. 경멸을 담은 비웃음으로 사람들의 얼굴에 화장을 칠하고 무대 조명을 비췄다. 그들은 그의 도구가 되었다.<br><br>지운은 자신이 직접 만든 멜로디에 맞춰 무대에 오른 사람들을 고문했다. 우아한 몸짓으로 사람들 사이를 뛰어다니고 그들의 울부짖음을 지휘했다. 그들은 소리치고 비명을 지르며 사랑하는 사람들의 이름을, 어머니의 이름을 부르짖었다. 희생자들은 지운에게 시선을 고정시킨 채 엄청난 감정들이 쏟아내었다. 인간이라는 증거였다.<br><br>지운이 던진 칼에 끝까지 명줄을 잡고 있던 마지막 인간 악기가 조용해지고 음악이 멈출 때까지 무대 위에서 내장이 쏟아져 내렸다. 땀과 피로 범벅이 된 지운은 조금 지친 듯 윤진을 바라보며 목례하였다. 커튼 콜. 그는 완벽을 이뤄냈다. 그리고 지운은 손에 칼을 쥔 채 크레딧이 올라가기 전 느슨해진 끈을 다시 묶기 위해 윤진에게 한 걸음 한 걸음 다가갔다. 하지만 그가 다가가자…<br><br>안개...<br><br>어디선가에서 밀려온 안개를 그들을 감쌌다. 축축하고 시원하지만… 안락한 안개였다. 지운의 눈에 웅장한 무대가 들어왔다. 병원, 사원, 숲, 도축장… 그를 지켜보고, 그에게서 도망치고, <i>그를 경험하는<\/i> 백만 개의 눈들로 지탱되고 녹슨 갈고리로 장식된 평지까지. 그는 그저 그곳에 서서 안개를 받아들이고 안개의 실행자가 되어 희생자들의 비명소리로 공간을 채우기만 하면 되었다.<br><br>앵콜! 그는 그저 그곳에 서서 안개를 받아들이고 안개의 실행자가 되어 희생자들의 비명소리로 공간을 채우기만 하면 되었다.<br><br>앵콜!","perks":["K23P01","K23P02","K23P03"],"dlc":"Comet","power":{"ko":"명연주","en":"Showstopper","d":"<b>특수 능력: 블레이드 투척<\/b><br><br>능력 버튼을 길게 눌러 투척 상태로 들어갈 수 있다. 공격 버튼을 탭하여 칼을 한 개 투척할 수 있으며, 또는 길게 눌러 일진의 칼을 투척할 수 있다. 칼은 캐비닛에서 보충할 수 있다.<br><br><b>특수 효과: 열상<\/b><br><br>칼로 타격을 받을 때마다 생존자의 열상 미터기가 증가한다. 미터기가 가득 차면, 건강 상태 한 단계를 잃는다. 생존자가 칼로 타격을 받지 않으면, 잠시 지체된 후 열상 미터기는 감소한다. 기본 공격으로 생존자를 타격하면 열상 미터기가 줄어든다.<br><br><b>특수 능력: 스타일 포인트 & 스타일 랭크<\/b><br><br>칼을 투척해 생존자에게 부상을 입히고 뚜렷한 연속 행동을 수행하면, 트릭스터가 스타일 포인트를 획득한다. 규칙적인 행동으로 스타일 포인트를 조금 얻을 수 있으나, 숙려된 행동은 더 많은 포인트를 부여한다.<br><br>스타일 포인트를 얻으면, 트릭스터는 스타일 랭크에 올라간다. 각 스타일 랭크는 캐릭터의 칼 투척 스킬과 칼 보충 속도를 향상시킨다. 스타일 포인트를 얻으면, 현재 스타일 랭크 타이머가 새로 고침된다.<br><br><b>특수 조건/능력: S-랭크 & 메인 이벤트<\/b><br><br>S-랭크에서 트릭스터는 <b>44미터<\/b>의 공포 범위를 가지며, 자장가는 해제되고, 열상 미터기는 감소가 차단된다. 또한, 칼 투척 및 보충 속도가 향후 증가하고, 트릭스터는 메인 이벤트를 발동할 수 있다.<br><br>메인 이벤트는 능력 버튼을 눌러 활성화되면, 트릭스터는 고속으로 칼을 무제한 투척할 수 있게 된다. 생존자를 타격한 각 칼의 수마다, 보너스 스타일 포인트가 부여된다. 능력 버튼을 눌러 메인 이벤트를 일찍 종료할 수 있다. 메인 이벤트가 종료되면 점멸이 발동된다.<br><br>메인 이벤트는 갈고리에 걸린 생존자 근처에서 활성화할 수 없다."}},{"id":"K24","ko":"네메시스","en":"The Nemesis","d":"자신의 촉수를 사용하여 중거리의 공격이 가능한 동시에 영역을 배회하는 좀비의 지원도 받는 가차없는 살인마.<br><br>네미시스의 개인 기술인 <b>치명적인 추적자<\/b>, <b>히스테리<\/b>, 그리고 <b>폭발<\/b>로 생존자들을 빠르게 급습하는 동시에 부상을 입혀 갈고리에 걸때 그들에게 혼란과 공포를 선사한다.","story":"엄브렐러 코퍼레이션에 의해 설계된 네메시스는 거의 무적의 생체병기로, 목표물을 추적하고 제거하는 데 집착한다. 타이런트 T-103 시리즈의 일부인 해당 표본에 Ne-알파 기생체를 이식하여 표본의 지능과 인식을 높였다. 네메시스의 첫 번째 임무, ‘라쿤 시티의 S.T.A.R.S. 멤버를 모두 몰살하라.’ 도시를 헤집고 다니며 네메시스는 질 발렌타인과 여러 번 마주쳤고 그때마다 질은 그를 피해 도망에 성공하지만 네메시스도 그녀의 실력에 뒤지지 않는다. 목표물이 시야에 다시 들어오는 그때 기이한 안개가 혼돈에 빠진 도시의 연기와 섞여 그들을 덮쳤다. 기이한 현상은 그에게 아무런 해를 가하지 못했다. 혹독한 추위와 산소 감소는 결코 그를 죽일 수 없다. 그에게 중요한 것은 안갯속으로 계속 나아가 임무를 계속 진행하는 것이다. S.T.A.R.S.를 찾아 S.T.A.R.S.를 몰살하고 자신을 방해하는 자를 모두 죽이는 것.","perks":["K24P01","K24P02","K24P03"],"dlc":"Eclipse","power":{"ko":"T-바이러스","en":"T-VIRUS","d":"변이를 일으키는 바이러스는 다른 이에게 전파될 수 있다. 네메시스의 공격성과 힘을 고조시킨다.<br><br><b>특수 공격: 촉수 일격<\/b><br><br><i>능력 버튼<\/i>을 길게 눌러 공격을 차지할 수 있다. 차지가 완료되면 <i>공격 버튼<\/i>을 탭하여 공격한다. <b>촉수 일격<\/b>으로 생존자를 타격하면 생존자는 <b>오염<\/b> 상태 효과에 빠지며 <b>변이율<\/b>을 증가시킨다. 만약 생존자가 이미 <b>오염<\/b> 상태에 빠져있다면 <b>촉수 일격<\/b>은 생존자의 건강에 피해를 입히며 <b>변이율<\/b>을 증가시킨다.<br><br><b>서플라이 상자<\/b>에서 찾은 <b>백신<\/b>은 <b>오염<\/b>을 치료한다. 하지만 <b>백신<\/b>의 입수 가능성은 제한적이다. 백신 사용 후, 생존자의 위치는 살인마의 본능에 의해 드러난다.<br><br><b>변이율: 능력은 변이율이 증가함에 따라 확대된다. 변이율 레벨 2 도달 시, 떨어진 판자 또는 부서지기 쉬운 문을 타격하면 특수 파괴가 적용된다. 변이율 레벨 3 도달 시, 촉수 일격이 완충되면 촉수 일격의 범위 및 이동 속도가 증가한다. T-바이러스 아이콘은 현재 변이율을 표시한다.<br><br>특수 적: 좀비<br><br>만약 좀비가 생존자를 타격하면, 좀비는 생존자들에게 오염 효과를 가한다. 만약 이미 오염 상태에 빠져있다면 생존자의 건강에 피해를 입힌다.<br><br>좀비는 촉수 일격으로 말살될 수 있으며, 변이율을 증가시키고 생존자들은 좀비를 판자로 말살할 수 있다. 말살된 좀비는 결국 리스폰된다.<\/b>"}},{"id":"K25","ko":"수도사","en":"The Cenobite","d":"체인 발사체를 소유하고 비탄의 배열 장치를 사용하여 모든 생존자를 한 번에 고문할 수 있는 소환 살인마.<br><br>그의 개인 기술인, <b>교착 상태<\/b>, <b>주술: 노리개<\/b>, 그리고<b>재앙의 갈고리: 고통의 선물<\/b>은 발전기의 진행도를 느리게 하고 그의 달콤한 고통을 경험한 생존자들에게 계속해서 고통을 안겨준다.","story":"어떤 이에게는 악마, 다른 이에게는 천사로 불린다. 핀헤드는 쾌락과 고통의 무한한 스릴을 탐닉하며, 경험의 더 큰 영역을 탐험하는 탐험가이다. 다른 차원을 여는 열쇠이자, 비탄의 배열 장치로 알려진 퍼즐 상자가 엔티티의 영역에서 발견되었다. 이제 그의 손에 들어가는 건 시간문제다. 장치가 열리자 그가 도착했다. 그리고 그의 등장 다음에는 영역에 쏟아진 달콤한 고통이었다.","perks":["K25P01","K25P02","K25P03"],"dlc":"Gemini","power":{"ko":"고통의 소환","en":"Summons of Pain","d":"쾌락과 고통으로 이어지는 다른 차원으로 향하는 관문이 당신의 영혼을 찢어버릴 것이다.<br><br><i>능력 버튼<\/i>을 눌러 관문을 생성하고 버튼을 놓아 관문을 연다. 문이 열리면 <i>능력 상호작용 버튼<\/i>을 탭하여 지배하에 있는 악령의 원거리 체인을 소환할 수 있다. 체인을 생존자로 향하게 하여 그들을 속박할 수 있다.<br><br>속박된 생존자는 질주할 수 없게 된다. 또한 두 번째, 세 번째 체인에 속박되면 생존자의 이동 속도는 점점 더 느려진다. 생존자는 탈출 액션을 수행하여 탈출할 수 있다.<br><br><b>비탄의 배열 장치:<\/b> 그대로 두면 비탈의 배열 장치가 생존자를 쫓기 위해 체인 사냥을 활성화한다.<br><br>비탄의 배열 장치를 소지한 생존자는 인지 불가능 상태 이상에 빠지면 가끔씩 체인이 소환되어 생존자를 공격할 수도 있다. 체인 사냥을 종료하고 퍼즐 상자를 그들의 손에서 빼앗으려면 비탄의 배열 장치를 풀어야 한다. 배열 장치를 해결하는 동안 수도자는 생존자의 위치를 알 수 있고 그쪽으로 순간 이동이 가능하다.<br><br>수도사가 비탄의 배열 장치 주우면 체인 사냥이 활성화된다. 또한, 모든 생존자들은 즉시 체인에 얽매여 비명을 지르며 위치를 드러낸다.<br><br>수도사 또는 생존자가 비탄의 배열 장치를 사용하고 나면 새로운 위치에서 생성된다."}},{"id":"K26","ko":"예술가","en":"The Artist","d":"정찰 기술을 사용하는 살인마로, 절망의 까마귀를 지도 전체에 있는 보내고 생존자의 위치를 찾아내 공격한다.<br><br>그녀는 개인 기술인, <b>암울한 수용<\/b>, <b>재앙의 갈고리: 고통의 울림<\/b>, <b>주술: 펜티멘토<\/b>로 생존자의 목표를 방해하고, 갈고리에 걸린 생존자를 고문하며, 파괴된 토템을 사용하여 그녀에게 유리한 방향으로 게임을 이끌어나갈 수 있다.","story":"까르미나 모라는 남동생의 죽음에 대한 죄책감을 짊어진 재능 있는 예술가였다. 칠레 남부의 험준한 해안 마을에서 자란 그녀는 파타고니아의 장엄한 풍경을 스케치했다. 야외에 앉아, 그녀는 집 옆 나무에 둥지를 튼 까마귀들에게 먹이를 주며 드라마틱한 피오르를 그렸다.<br><br>그녀는 어머니가 갑자기 떠나신 것에 대한 죄책감을 안고 자랐다. 그녀의 아버지는 아내가 떠난 이유가 까르미나의 탓이라 생각하며 그녀를 비난했고 아버지의 비난은 그녀를 더 슬프게 만들었다. 그녀는 아직 어린아이임에도 불구하고 그녀의 남동생인 마티아스를 보살피는 데 하루를 보냈다.<br><br>1년의 시간이 흐르고, 조용한 집안에 전화벨이 울렸다. 그때, 까르미나는 마티아스와 밖에서 그림을 그리고 있었고 그녀의 아버지는 마당에 남아 맥주를 마시고 있었다. 까르미나는 전화를 받기 위해 집으로 달려갔고 짧게 통화 후 전화를 끊었다. 그녀가 다시 밖으로 돌아왔을 때, 마티아스는 어디에서도 보이지 않았다. 아버지에게 물어보았지만 그는 아들에게 전혀 관심이 없어 보였다. 그녀는 동생의 이름을 부르며 사방에서 마티아스를 찾아 헤맸다. 잠시 후, 그녀는 집 옆 좁은 개울에 선홍색 재킷이 떠있는 것을 발견했다. 마티아스의 재킷이었다. 흐르는 개울 위로 동생 마티아스가 멍한 눈을 한 채 둥둥 떠다니고 있었다. 넘어져 익사하고만 것이다.<br><br>그녀의 비명소리가 하늘을 찢는 듯했다. 아버지는 까마귀 무리에 둘러싸여 동생의 시체를 부둥켜 앉고 흐느끼고 있는 까르미나를 발견했다. 그는 그녀의 품에서 아들을 잡아챘고, 그녀는 목소리가 갈라질 때까지 울음을 멈추지 못했다.<br><br>다음날, 세상은 어둠으로 덮였다. 아버지는 아무 말도 하지 않았다. 그럴 필요가 없었기 때문이다. 까르미나는 동생의 죽음이 자신의 잘못이 아니라는 것을 알고 있었다. 그렇게 몇 달이 지났다. 하지만 동생을 잃은 슬픔은 여전히 선명했다. 자기혐오에 빠진 까르미나는 더 이상 그림을 그릴 수 없었다. 마티아스가 없는 그녀의 인생은 의미가 없었다.<br><br>마티아스가 죽은 후 맞이한 첫 생일날의 스산한 새벽녘, 까르미나는 집에서 몇 블록 떨어진 좁은 다리로 향했다. 그녀는 그 어느 것도 자신의 상처를 치유할 수 없을 것이라고 생각했다. 그녀의 어머니는 자신을 버렸고, 동생은 죽었다. 그리고 아버지는 그 모든 것을 그녀의 탓으로 돌렸다. 그녀에겐 삶을 이어나갈 이유가 하나도 남지 않았다.<br><br>까르미나는 다리 난간
