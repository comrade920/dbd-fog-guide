10","ko":"날카로운 탈것","en":"Sharpened Mount","d":"용병 기사단의 군기 앞에 서는 것은 삶과 죽음 사이의 문턱에 서는 것이었다.<br><br>군기가 생성되는 시간이 <b>15%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K30"},{"id":"Addon_K30_11","ko":"죽음의 철 가면","en":"Grim Iron Mask","d":"용병 기사단에게는 어떤 고문 방법도 비열하지 않았다. 고통과 굴욕은 함께 찾아오므로.<br><br>경비대가 생존자를 탐지하면 생존자는 <b>75초<\/b> 동안 <b>실명<\/b>에 빠진다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.","r":2,"c":"ka","o":"K30"},{"id":"Addon_K30_12","ko":"깨진 검자루","en":"Broken Hilt","d":"얼마 안 된 상처는 깔끔했다. 마치 수술이라도 받은 것처럼. 부러진 것을 이용한 공격은 악의가 있고 필사적이다.<br><br>생존자에게 피해를 가할 때, 경비대는 <b>70초<\/b> 동안 <b>출혈<\/b> 및 <b>깊은 상흔<\/b> 상태 이상을 입힌다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"K30"},{"id":"Addon_K30_13","ko":"철공의 집게","en":"Ironworker’s Tongs","d":"무시무시하고 맹렬한 즉흥적으로 만든 무기로 중간 중간에 수리가 필수적이다.<br><br>생존자가 성공적으로 경비대 사냥에서 탈출하며 <b>60초<\/b> 동안 <b>인지 불가능<\/b> 상태 효과에 빠진다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":2,"c":"ka","o":"K30"},{"id":"Addon_K30_14","ko":"방범대원의 횃불","en":"Town Watch’s Torch","d":"마을을 침입했을 때, 그들이 가장 먼저 마을 사람들의 희망과 함께 횃불을 꺼뜨렸다.<br><br>경비대가 활동적으로 생존자를 사냥할 때, <b>감지 불가능<\/b> 상태 이상을 얻는다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":2,"c":"ka","o":"K30"},{"id":"Addon_K30_15","ko":"대장장이의 망치","en":"Blacksmith’s Hammer","d":"그들의 손에 들어가면, 모든 것이 무기가 된다.<br><br>생존자에게 피해를 가할 때, 경비대는 <b>60초<\/b> 동안 <b>치료 불능<\/b> 상태 이상을 입힌다.<br><br>치료 불능 상태의 생존자는 치료를 할 수 없다.","r":3,"c":"ka","o":"K30"},{"id":"Addon_K30_16","ko":"부싯돌과 강철","en":"Flint and Steel","d":"한밤중의 공격은 흔치 않다. 두려움은 자주 그들이 가진 최고의 아군이었다.<br><br>사형집행자를 소환하면, 기사는 무너뜨린 판자에서 근처 <b>24미터<\/b> 이내 생존자들의 오라를 <b>8초<\/b> 동안 볼 수 있다.","r":3,"c":"ka","o":"K30"},{"id":"Addon_K30_17","ko":"치료용 찜질","en":"Healing Poultice","d":"그들의 명성은 너무나 자자했고, 끔찍했기에, 단지 그들이 오고 있다는 정보만으로도 사람들을 무릎꿇게 만들 수 있었다.<br><br>암살자를 소환한 후에, 경비대의 초기 위치로부터 <b>8미터<\/b> 내 모든 생존자의 오라가 <b>8초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K30"},{"id":"Addon_K30_18","ko":"교도소장의 차임","en":"Jailer's Chimes","d":"많은 포로들이 그의 손아귀를 벗어나려고 시도했고 소름끼치는 최후를 맞았다.<br><br>교도소장을 소환한 후, 그의 순찰 경로를 지난 생존자들의 오라가 <b>8초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K30"},{"id":"Addon_K30_19","ko":"기사의 계약서","en":"Knight’s Contract","d":"타르호스를 비토리오의 고용인으로 계약한 원본 문서. 그러나 인간의 규율은 자연법칙에 맞설 수 없었다.<br><br>명령을 내린 후, 경비대는 <b>8초<\/b> 동안 더 남아 생존자를 발견하면 사냥이 발생된다.","r":4,"c":"ka","o":"K30"},{"id":"Addon_K30_20","ko":"핏빛 단체 배너","en":"Iridescent Company Banner","d":"이 배너가 하늘을 향해 솟아오르면, 자신을 \"문명인\"이라 불렸던 모든 이들은 곧바로 도망쳐 몸을 숨긴다. 왜냐하면 그들의 모든 규칙과 법에도 불구하고, 그들은 실제 힘과 닮아 있는 것이 없었기 때문이다.<br><br>경비대에 의해 생존자가 사냥을 당하면, 사냥 당한 생존자는 못들로 인해 출구로 나갈 수 없다. 생존자가 뛰어넘기를 하면 뛰어넘은 곳은 사냥이 진행되는 동안 모든 생존자들에게 차단된다.순찰 경로를 생성하는 동안 뛰어넘을 수 있는 장소를 지나면, 그 곳은 경비대 소환 후 <b>25초<\/b> 동안 차단된다.","r":4,"c":"ka","o":"K30"},{"id":"Addon_K31_01","ko":"아디 발렌테 1권","en":"Adi Valente #1","d":"아드리아나가 어렸을 때 그녀의 아버지가 만든 만화인 아디 발렌테 창간호의 원본.<br><br>집게덫을 보유한 생존자는 <b>20% 작아진<\/b> 스킬 체크를 경험한다. 효과는 집게덫이 제거될 때까지 계속된다.","r":0,"c":"ka","o":"K31"},{"id":"Addon_K31_02","ko":"고성능의 투광 조명등","en":"High-Power Floodlight","d":"갑작스럽고 압도적인 빛이 접근할 만큼 어리석은 사람들을 불편하게 한다.<br><br>집게덫을 보유한 생존자는 <b>실명<\/b> 상태 효과에 걸린다. 효과는 집게덫이 제거될 때까지 계속된다. 실명된 생존자는 오라를 볼 수 없게 된다.","r":0,"c":"ka","o":"K31"},{"id":"Addon_K31_03","ko":"지리적 판독","en":"Geographical Readout","d":"드론은 지형의 상세한 3차원 지도를 생성하고 전달하여 이동을 더 쉽게 만든다.드론을 배치할 때마다, <b>8초<\/b> 동안, 기본 창문 뛰어넘기, 판자 또는 부서지기 쉬운 문 기본 파괴, 그리고 발전기 손상을 <b>20%<\/b> 더 빠르게 수행한다.","r":3,"c":"ka","o":"K31"},{"id":"Addon_K31_04","ko":"대전류 업그레이드","en":"High Current Upgrade","d":"배터리를 더 빨리 재충전할 수 있는 저저항의 넓은 케이블.<br><br>생존자가 레이더에 감지되어 표시되는 시간이 <b>1초<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K31"},{"id":"Addon_K31_05","ko":"적응형 조명","en":"Adaptive Lighting","d":"드론은 주변을 고려해 움직임을 흐리게 하는 상대의 혼을 쏙 빼놓는 방식으로 빛을 쏜다.<br><br><b>감지 불가능<\/b> 상태 이상의 지속 시간이 <b>20%<\/b> <b>증가한다<\/b>. 감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":1,"c":"ka","o":"K31"},{"id":"Addon_K31_06","ko":"스테레오 원격 마이크","en":"Stereo Remote Mic","d":"업그레이드를 통해 향상된 3차원 오디오 추적을 할 수 있게 되었다.<br><br>드론 해제 지속 시간이 <b>15%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K31"},{"id":"Addon_K31_07","ko":"슈퍼차지","en":"Supercharge","d":"배터리는 약간 뜨거울 수 있지만, 셀에서 안전 프로토콜을 제거하면 배터리가 좀 더 오래 지속할 수 있다.<br><br>집게덫의 배터리 수명이 <b>15%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K31"},{"id":"Addon_K31_08","ko":"샷건 스피커","en":"Shotgun Speakers","d":"고주파 소음을 먼 거리에 걸쳐 단일 방향으로 유도할 수 있는 드론은 한 개인에게 집중할 수 있고 한동안 위험으로부터 그들의 주의를 분산시킬 수 있다.<br><br>집게덫을 보유한 생존자는 스킬 체크 알림을 받을 수 없다. 효과는 집게덫이 제거될 때까지 계속된다.","r":1,"c":"ka","o":"K31"},{"id":"Addon_K31_09","ko":"저전력 모드","en":"Low-Power Mode","d":"중요하지 않은 부품의 전원을 간헐적으로 껐다가 켜서 드론은 더 오래 유지할 수 있다.<br><br>드론 회전 속도가 <b>100%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K31"},{"id":"Addon_K31_10","ko":"유리 가루","en":"Powdered Glass","d":"한때 연싸움에 사용하는 줄에 사용된 이 유리 가루는 그녀의 칼날에 훨씬 더 사악한 용도로 사용되었다.<br><br>집게덫에 걸린 생존자를 타격하면 생존자가 <b>70초<\/b> 동안 <b>출혈<\/b> 및 <b>깊은 상흔<\/b> 상태 이상에 빠진다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"K31"},{"id":"Addon_K31_11","ko":"중요 타겟팅 프로세서","en":"Vital Targeting Processor","d":"추가된 드론 프로그래밍은 잠재적 먹잇감의 약점을 더 정확하게 예측한다.<br><br>드론 탐지 시, 집게덫에 걸린 생존자들로 얻은 <b>근육 손상<\/b> 상태 이상이 <b>2%<\/b> <b>증가한다<\/b>. 근육 손상은 생존자의 이동 속도를 감소시킨다.","r":2,"c":"ka","o":"K31"},{"id":"Addon_K31_12","ko":"갈색 잡음 발생기","en":"Brown Noise Generator","d":"드론에서 불길한 웅웅거림이 퍼지면서 사운드스케이프를 뒤덮고 다른 소리를 듣기 어렵게 만든다.<br><br>집게덫을 보유한 생존자는 <b>인지 불가능<\/b> 상태 이상에 빠진다. 효과는 집게덫이 제거될 때까지 계속된다. 인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":2,"c":"ka","o":"K31"},{"id":"Addon_K31_13","ko":"느슨한 나사","en":"Loose Screw","d":"드론에서 뼈를 오싹하게 하는 덜컹거리는 소리가 나오는데, 금방이라도 추락하는 것처럼 보여 생존자들이 복잡한 작업에서 주의를 딴 데로 돌리게 한다.<br><br>집게덫을 보유한 생존자는 <b>6초<\/b> 동안 <b>탈진<\/b> 상태에 걸린다. 생존자는 탈진으로 탈진에 영향받는 기술을 발동할 수 없다.","r":2,"c":"ka","o":"K31"},{"id":"Addon_K31_14","ko":"적외선 업그레이드","en":"Infrared Upgrade","d":"열 감지 카메라는 높은 정확도로 스트레스를 많이 받는 사람들에게 초점을 맞춘다.<br><br><b>집게덫<\/b>이 제거될 때마다, 생존자의 오라가 <b>4초<\/b> 동안 드러난다.","r":2,"c":"ka","o":"K31"},{"id":"Addon_K31_15","ko":"무작위 섬광등","en":"Randomized Strobes","d":"땅 위에서 불빛이 무작위로 깜박여 울퉁불퉁한 지형에서는 손을 디딜 곳을 찾기가 더 어려워진다.<br><br>드론 탐지 시, 집게덫에 걸린 생존자들로 얻은 <b>근육 손상<\/b> 상태 이상 지속 시간이 <b>1초<\/b> <b>증가한다<\/b>.<br><br>근육 손상은 생존자의 이동 속도를 감소시킨다.","r":3,"c":"ka","o":"K31"},{"id":"Addon_K31_16","ko":"고기능 움직임 예측기","en":"Advanced Movement Prediction","d":"그들이 영향권을 떠난 후에도, 세련된 인공지능 프로그램은 사람이 다음에 어디로 갈지 높은 정확도로 예측한다.<br><br>드론 활성화 구역에 들어온 생존자들의 오라가 <b>6초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K31"},{"id":"Addon_K31_17","ko":"초음파 스피커","en":"Ultrasonic Speaker","d":"혼란스러운 소리로 소닉 스펙트럼을 채우는 고주파 소음 블래스터가 중요한 소리를 골라내는 작업을 방해한다.<br><br>생존자의 주사선 한계 지속 기간이 <b>10%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K31"},{"id":"Addon_K31_18","ko":"방전된 배터리","en":"Expired Batteries","d":"집게덫의 배터리는 오래된 알칼리성 배터리와 교체되었다. 재충전은 권장하지 않는다.<br><br>모든 생존자들은 집게덫을 보유한 채 희생제를 시작한다. 이 집게덫들은 오직 <b>50%<\/b> 적은 배터리 수명을 가진다.집게덫 배터리 수명은 집게덫 1개를 받을 때마다 <b>10%<\/b> 증가하여 최대 <b>150%<\/b>까지 증가한다.","r":4,"c":"ka","o":"K31"},{"id":"Addon_K31_19","ko":"프로토타입 회전자","en":"Prototype Rotor","d":"최첨단 설계 덕분에 드론의 이동이 극도로 정확하다.<br><br>드론의 회전 속도가 <b>10%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"K31"},{"id":"Addon_K31_20","ko":"핏빛 미발행 원고","en":"Iridescent Unpublished Manuscript","d":"아버지가 사라지기 전, 아드리아나의 아버지는 조금 더 어두운 분위기의 만화인 <i>다크 드리머<\/i>를 그리기 시작했다.<br><br>드론이 비활성화되면, <b>15초<\/b> 동안 <b>32미터<\/b>의 공포 범위가 생성된다. 이 효과가 활성화된 동안, <b>감지 불가능<\/b> 상태 이상을 얻는다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":4,"c":"ka","o":"K31"},{"id":"Addon_K32_01","ko":"부숴진 보안 열쇠","en":"Broken Security Key","d":"선박 장비 전반에 걸쳐 수십 건의 보안 조치가 이뤄졌고, 상당수는 수리가 불가능한 상태였다.<br><br>EMP가 바이오포드에 영향을 미치면, 재부팅 타이머가 <b>15%<\/b> 감소한다.","r":0,"c":"ka","o":"K32"},{"id":"Addon_K32_02","ko":"중수","en":"Heavy Water","d":"극저온과 생명 유지 장치에 동력을 공급하는 미세 핵분열 원자로의 부산물. 작은 누출이라도 있다면 탑승 센서에는 재앙이 될 것이다.<br><br>공급 상자의 오라 길이가 <b>8미터<\/b> 감소한다.","r":0,"c":"ka","o":"K32"},{"id":"Addon_K32_03","ko":"어린아이의 야구 글러브","en":"Kid’s Ball Glove","d":"식민지 개척자 중 한 명이 소유한 어린이용 야구 글러브. 어린 시절 캐치볼을 하던 그의 기억이 고스란히 녹아 있었다.<br><br>오버클록 모드 기간이 <b>8%<\/b> 증가한다.","r":1,"c":"ka","o":"K32"},{"id":"Addon_K32_04","ko":"영양 가득한 슬러리","en":"Nutritional Slurry","d":"유기물을 위해 만들어진 이 역겨운 혼합물은 어떤 유기물에도 영양을 공급하는 데 효과가 있다.<br><br>바이오포드 <b>2<\/b>개를 추가로 획득한다.","r":0,"c":"ka","o":"K32"},{"id":"Addon_K32_05","ko":"진단 도구(건설용)","en":"Diagnostic Tool (Construction)","d":"지형에 대한 매우 정확한 정보를 제공하는 장치.<br><br>EMP를 줍는 생존자의 오라가 <b>8초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K32"},{"id":"Addon_K32_06","ko":"진단 도구(수리용)","en":"Diagnostic Tool (Repair)","d":"생성된 객체의 결함을 찾을 수 있는 장치. 수리를 돕기 위한 것이다.<br><br>바이오포드에 있는 동안 목표 범위가 <b>4미터<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K32"},{"id":"Addon_K32_07","ko":"안드로이드 팔","en":"Android Arm","d":"다른 헉스 유닛들을 파괴하는 것은 그의 인간 몰살을 더 쉽게 만들었을 뿐만 아니라, 설계에 더할 재료를 더 많이 제공해주었다.<br><br>생존자 간 슬립 스트림 감염 범위가 <b>2미터<\/b> <b>증가HUX하며 25% 더 빠르게 펴진다.<\/b>","r":1,"c":"ka","o":"K32"},{"id":"Addon_K32_08","ko":"화장된 유골","en":"Cremated Remains","d":"다른 식민지 개척자들의 DNA를 추출한 후, 그는 그들의 유해를 불태웠다.<br><br>임시적 슬립 스트림에 걸린 생존자들은 <b>실명<\/b> 상태에 걸린다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.","r":1,"c":"ka","o":"K32"},{"id":"Addon_K32_09","ko":"외계 식물 섬유","en":"Foreign Plant Fibers","d":"지노 식물학자들은 이 이상한 식물 표본들과 함께 즐거운 시간을 보낼 것이다.<br><br>오버클록 모드 동안 판자에 의해 기절한 후 걸리는 <b>근육 손상<\/b> 상태 효과의 지속 기간이 <b>20%<\/b> <b>감소한다<\/b>.<br><br>이동 속도 증가는 살인마의 이동 속도를 감소시킨다.","r":3,"c":"ka","o":"K32"},{"id":"Addon_K32_10","ko":"활선","en":"Live Wires","d":"전류에 연결되어 있지 않은 전선은 갑작스러운 충격을 전달하는 경향이 있다.<br><br>슬립 스트림을 정화한 생존자는 비명을 지르고, 생존자의 행동은 방해받는다.","r":2,"c":"ka","o":"K32"},{"id":"Addon_K32_11","ko":"크리오젤","en":"Cryo Gel","d":"깊은 냉동 수면에 들어가기 전에 승무원에게 바르는 마찰 방지용 젤.<br><br>슬림 스트립된 생존자가 기본 공격으로 타격을 받으면 <b>60초<\/b> 동안 <b>출혈<\/b> 상태 이상에 걸린다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다.","r":1,"c":"ka","o":"K32"},{"id":"Addon_K32_12","ko":"거부된 요청 양식","en":"Denied Requisition Form","d":"광속 기술의 출현에도 불구하고, 관료주의를 더 빠르게 만들 수 있는 것은 아무것도 없어 보였다.<br><br>희생제를 시작할 때, EMP를 만드는 데 <b>30초<\/b>가 더 걸린다.모든 생존자들은 슬립 스트림에 걸리 채 희생제를 시작한다.","r":4,"c":"ka","o":"K32"},{"id":"Addon_K32_13","ko":"핏빛 크리스탈 파편","en":"Iridescent Crystal Shard","d":"외계인 구조물에서 나온 크리스탈이 그에게 직각을 주었다.<br><br>바이오포드가 생성되면, 바이오포드로부터 <b>10미터<\/b> 내에 있는 모든 생존자의 오라가 <b>6초<\/b> 동안 드러난다.","r":4,"c":"ka","o":"K32"},{"id":"Addon_K32_14","ko":"초음파 센서","en":"Ultrasonic Sensor","d":"유기체의 청력의 한계는 제한된 청각 스펙트럼이다. 그 범위를 확장하는 것은 완전히 새로운 감각을 얻는 것과 같다.<br><br>슬립 스트림 <b>2초<\/b> 내에 바이오포드에서 나가면 공포 범위가 <b>12초<\/b> 동안 <b>12미터<\/b> 감소한다.","r":1,"c":"ka","o":"K32"},{"id":"Addon_K32_15","ko":"텅빈 산소 탱크","en":"Spent Oxygen Tank","d":"공기가 없으면, 유기체는 오랫동안 살아남을 수 없다.<br><br>생존자가 슬립 스트림하면, 생존자는 <b>6초<\/b> 동안 <b>탈진<\/b> 상태에 빠진다.<br><br>탈진 상태의 생존자는 탈진 기술을 활성화할 수 없다.","r":2,"c":"ka","o":"K32"},{"id":"Addon_K32_16","ko":"나노 기기 젤","en":"Nanomachine Gel","d":"상처를 아주 빠르게 치료할 수 있는 젤다. 하지만, 그 안에 있는 기계들은 사람들을 해치기 위해 해킹을 당한 전력이 있다.<br><br>생존자를 슬립 스트림하면 바이오포드의 재사용 대기 시간이 <b>15%<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"K32"},{"id":"Addon_K32_17","ko":"초자각 스프레이","en":"Hyperawareness Spray","d":"긴 교대 근무 중에 승조원이 경초점에서 벗어나지 않도록 사용한다. 과다 사용의 부작용으로는 편집증, 극단적인 경우 환각이 포함된다.<br><br>생존자가 슬립 스트림하는 동안, 주변에서 공포 범위의 소리를 들을 수 있다.","r":2,"c":"ka","o":"K32"},{"id":"Addon_K32_18","ko":"홀로그램 발전기","en":"Hologram Generator","d":"원래는 소통과 오락을 위해 사용되었지만, 난독화를 위해 다시 사용하게 되었다.<br><br>바이오포트에서 성공적으로 슬립 스트림 순간 이동에 성공하면, 타깃 생존자는 <b>60초<\/b> 동안 <b>인지 불가능<\/b>에 빠진다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":2,"c":"ka","o":"K32"},{"id":"Addon_K32_19","ko":"소마의 가족 사진","en":"Soma Family Photo","d":"누군가에게 상상 속의 과거를 보여주는 감상적인 물체.<br><br>바이오포드를 사용하는 생존자가 슬립 스트림되면 <b>6초<\/b> 동안 <b>3%의 근육 손상<\/b>에 걸린다.<br><br>근육 손상은 생존자의 이동 속도를 감소시킨다.","r":3,"c":"ka","o":"K32"},{"id":"Addon_K32_20","ko":"승조원 명단","en":"Crew Manifest","d":"드바라카로 보내진 모든 승조원들의 신상 자료.<br><br>슬립 스트림된 생존자가 다른 생존자를 감염시키면 오라가 <b>8초<\/b> 드러난다.생존자 간 슬립 스트림 감염 범위가 <b>2미터<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"K32"},{"id":"Addon_K33_01","ko":"램버트의 별자리표","en":"Lambert’s Star Map","d":"행성간 여행에 필수적이지만 더 작은 규모에서는 유용하지 않다.<br><br><b>센트리 건<\/b>의 화염 사거리가 <b>2미터<\/b> 감소한다.","r":1,"c":"ka","o":"K33"},{"id":"Addon_K33_02","ko":"시리얼 배급량","en":"Cereal Rations","d":"비타민 A 하루 권장 섭취량의 100%를 함유하고 있다. 맛은 없다.<br><br>터널에 있는 동안, <b>센트리 건<\/b> 오라가 드러나며, 또한 그리고 통풍구에서 나올 때, <b>3초<\/b> 동안 오라가 드러난다.","r":0,"c":"ka","o":"K33"},{"id":"Addon_K33_03","ko":"리플리의 시계","en":"Ripley's Watch","d":"노스트로모 호처럼 거대한 우주선에서 작업 스케줄을 혼동하지 않으려면 시계를 동기화하는 작업은 매우 중요하다.<br><br><b>센트리 건<\/b>이 <b>크롤러 모드<\/b>를 해제하면, 센트리 건은 자동으로 <b>파괴된다<\/b>.","r":0,"c":"ka","o":"K33"},{"id":"Addon_K33_04","ko":"오보모프","en":"Ovomorph","d":"곁으로 보기엔 해로워 보이지 않지만, 그 안에 숨겨진 공포는 헤아릴 수 없다.<br><br>터널 밖에 있는 동안, <b>크롤러 모드<\/b>의 재사용 대기 시간이 <b>25%<\/b> 빨라진다.","r":0,"c":"ka","o":"K33"},{"id":"Addon_K33_05","ko":"물 먹는 새","en":"Drinking Bird","d":"노스트로모의 거주지에 버려지는 많은 조그만 장난감들 중 하나. 살균된 환경에서 약간 변덕스럽다.<br><br>터널에서 나온 후, 살인마의 본능 지속 시간이 <b>3초<\/b> 증가한다.<br><br>살인마의 본능은 간헐적으로 생존자의 위치를 드러낸다.","r":0,"c":"ka","o":"K33"},{"id":"Addon_K33_06","ko":"승무원 수신기","en":"Crew Headset","d":"그들이 팀의 의사소통을 용이하게 하는 반면, 끊임없는 수다는 승무원들을 더 쉽게 추적할 수 있게 만든다.<br><br>터널에 있는 동안, 발걸음 추적이 <b>6미터<\/b> 증가한다.","r":1,"c":"ka","o":"K33"},{"id":"Addon_K33_07","ko":"비상용 헬멧","en":"Emergency Helmet","d":"함교에 있는 여분의 헬멧으로 비상시에만 사용할 수 있다.<br><br><b>센트리 건<\/b>으로 인한 비틀거림 저항력이 <b>15%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K33"},{"id":"Addon_K33_08","ko":"애쉬의 내부","en":"Ash’s Innards","d":"보통 매우 단단하지만, 기계들도 충분한 힘이 가해지면 부서진다.<br><br><b>센트리 건<\/b>은 파괴된 후, 리스폰 시간이 <b>15초<\/b> 더 길어진다.","r":1,"c":"ka","o":"K33"},{"id":"Addon_K33_09","ko":"야광봉","en":"Light Wand","d":"침습성 생명체를 수색할 때, 애쉬와 댈러스가 사용하는 휴대용 야광봉. 넓은 공간을 조명하는 데는 효과적이지 않음.<br><br><b>터널에서 나온 후, 센트리 건<\/b>이 작동하지 않는 시간이 <b>3초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K33"},{"id":"Addon_K33_10","ko":"케인의 헬멧","en":"Kane’s Helmet","d":"얇은 유리 층은 작은 불편함과 노스트로모의 승무원들의 비극적인 파괴의 차이였다.<br><br><b>꼬리 공격<\/b>을 받은 생존자는 <b>70초<\/b> 동안 <b>깊은 상흔<\/b>을 입는다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"K33"},{"id":"Addon_K33_11","ko":"다용도 손도끼","en":"Multipurpose Hatchet","d":"무언가를 파괴하거나 수리할 때 모두 유용하다.<br><br><b>꼬리 공격<\/b>을 받은 생존자는 <b>출혈<\/b> 상태에 걸린다.<br><br>출혈은 부상당한 생존자가 핏자국을 남길 확률을 증가시킨출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"K33"},{"id":"Addon_K33_12","ko":"파커의 머리띠","en":"Parker’s Headband","d":"과감한 패션 선택이자, 땀이 눈에 들어가지 않아 일석이조.<br><br>터널에서 나온 후, <b>3초<\/b> 동안 <b>5%의 이동 속도 증가<\/b>가 발동된다.<br><br>이동 속도 증가 효과가 살인마의 이동 속도를 높인다.","r":2,"c":"ka","o":"K33"},{"id":"Addon_K33_13","ko":"녹은 피부","en":"Molted Skin","d":"제노모프는 노스트로모 호에서 빠르게 성장했고, 그 과정에서 여러 번 탈피했다. 제노모프의 허물은 끊임없이 이 존재를 상기시켰다.<br><br><b>센트리 건<\/b>을 배치한 후, 센트리 건을 배치한 생존자는 <b>30초<\/b> 동안 <b>탈진<\/b>에 걸린다.<br><br>생존자는 탈진으로 특정 기술을 발동할 수 없다.","r":2,"c":"ka","o":"K33"},{"id":"Addon_K33_14","ko":"브렛의 모자","en":"Brett’s Cap","d":"이 노스트로모 볼캡은 멋스럽지만, 그의 수직 시야를 심각하게 제한했다.<br><br><b>센트리 건<\/b>을 파괴하면 <b>16미터<\/b> 내 모든 생존자는 <b>25초<\/b> 동안 <b>실명<\/b> 상태가 된다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.","r":1,"c":"ka","o":"K33"},{"id":"Addon_K33_15","ko":"기호학적 키보드","en":"Semiotic Keyboard","d":"그것의 상징들은 보편적으로 인식할 수 있도록 고안되었지만, 익숙해지는데 약간의 시간이 걸린다.<br><br><b>센트리 건<\/b>으로부터 <b>16미터<\/b> 내에 있는 발전기의 수리 진행도는 오라의 강도에 따라 달라진다.","r":3,"c":"ka","o":"K33"},{"id":"Addon_K33_16","ko":"작살 발사포","en":"Harpoon Gun","d":"무기라고 하기엔 다소 그렇지만, 다른 옵션이 전혀 없을 때 쓸만하다.<br><br>터널에서 나온 후, <b>30초<\/b> 내에 생존자를 타격하면, 살인마로부터 <b>16미터<\/b> 이상 떨어진 생존자들은 비명을 지르며 자신들의 위치를 드러낸다.","r":3,"c":"ka","o":"K33"},{"id":"Addon_K33_17","ko":"고양이 이동장","en":"Cat Carrier","d":"고양이를 구하는 것은 고귀한 목표다. 심지어 산만하다.<br><br><b>센트리 건 공격<\/b>으로 <b>크롤러 모드<\/b>가 해제되면, <b>30초<\/b> 동안 <b>감지 불가능<\/b> 상태가 된다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":3,"c":"ka","o":"K33"},{"id":"Addon_K33_18","ko":"자폭 장치 볼트","en":"Self-Destruct Bolt","d":"자폭 시스템을 시작하려면, 이 볼트를 제거해야 한다. 그리고 자폭을 멈추려면 교체해야 한다. 이걸 보는 것만으로도 긴박감이 느껴진다.<br><br><b>크롤러 모드<\/b>에서 창문 기본 뛰어넘기를 <b>30%<\/b> 더 빠르게 수행한다.","r":3,"c":"ka","o":"K33"},{"id":"Addon_K33_19","ko":"막 만든 소몰이 막대","en":"Improvised Cattle Prod","d":"소에게 더 효과적이었을지도 모르는 잔인하고 시끄러운 무기.<br><br>발전기가 완성될 때마다, <b>15초<\/b> 타이머가 시작된다. 타이머가 켜진 동안 제어실로부터 10미터 범위 내에 들어오는 생존자들의 오라가 드러난다.","r":4,"c":"ka","o":"K33"},{"id":"Addon_K33_20","ko":"산성피","en":"Acidic Blood","d":"손상되었을 때, 제노모프의 독특한 생리학은 그 어느 때보다 치명적이었다.<br><br><b>크롤러 모드<\/b>에서 터널을 나오는 동안, 판자로 살인마를 기절시킨 생존자는 <b>20초<\/b> 후 타격을 입는다. 만약 해당 생존자가 이미 부상을 당한 상태라면 <b>심각한 부상<\/b>에 빠진다.<br><br>제한 시간 안에 심각한 부상을 치료하지 않으면 생존자는 빈사 상태에 빠진다.","r":4,"c":"ka","o":"K33"},{"id":"Addon_K34_01","ko":"섬광등","en":"Strobing Light","d":"적절한 교육과 함께 사용되면 사람들을 암시에 걸리기 쉽게 할 수 있다.<br><br><b>만나서 반가워 모드<\/b>가 재사용 대기 시간에 들어가면 공포 범위가 <b>8미터<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K34"},{"id":"Addon_K34_02","ko":"인형의 눈","en":"Doll Eyes","d":"양산형 인형을 소유하는 장점 중 하나는 교체 부품을 쉽게 구할 수 있다는 것이다.<br><br><b>만나서 반가워 모드<\/b> 동안, 20미터 범위 내에 모든 창문과 쓰러진 판자의 오라가 <b>드러난다<\/b>.","r":0,"c":"ka","o":"K34"},{"id":"Addon_K34_03","ko":"작은 메스","en":"Tiny Scalpel","d":"때때로, 정밀한 절단은 아름다운 출혈로 이어질 수 있다.<br><br><b>만나서 반가워 모드<\/b> 동안, 핏자국이 더 밝게 표시된다.","r":0,"c":"ka","o":"K34"},{"id":"Addon_K34_04","ko":"착한 아이 인형 상자","en":"Good Guy Box","d":"처키를 다시 상점으로 데려가야 할 경우를 대비해, 누군가 포장 상자를 버리지 않고 보관해뒀다.<br><br><b>쓱싹쓱싹<\/b>의 타격 재사용 대기 시간이 <b>7% 감소한다<\/b>.","r":0,"c":"ka","o":"K34"},{"id":"Addon_K34_05","ko":"전동 드릴","en":"Power Drill","d":"12개의 편리한 드릴 팁이 함께 제공된다. 사람에게 적용하면 모두 엉망이 된다.<br><br><b>쓱싹쓱싹<\/b>으로 생존자를 타격하면 <b>만나서 반가워 모드<\/b> 재사용 대기 시간이 <b>10% 감소한다<\/b>.","r":1,"c":"ka","o":"K34"},{"id":"Addon_K34_06","ko":"조각용 전기 나이프","en":"Electric Carving Knife","d":"웅웅거리는 소리는 살점을 조각할 준비가 되었다는 뜻이다.<br><br><b>쓱싹쓱싹<\/b> 실패 재사용 대기 시간이 <b>5% 감소한다<\/b>.","r":1,"c":"ka","o":"K34"},{"id":"Addon_K34_07","ko":"줄넘기","en":"Jump Rope","d":"간단한 운동을 하거나 상대를 묶는 데 좋다.<br><br><b>쓱싹쓱싹<\/b>의 지속 시간이 <b>8%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K34"},{"id":"Addon_K34_08","ko":"헤어스프레이와 양초","en":"Hair Spray & Candle","d":"에어로졸화된 지옥에서 헤어스타일이 멋지지 않다는 게 아무런 상관이 없다.<br><br><b>만나서 반가워 모드<\/b>에서 기본 공격이 제거되는 시간이 <b>20%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K34"},{"id":"Addon_K34_09","ko":"자동 드라이버","en":"Automatic Screwdriver","d":"즉석에서 기계를 조정을 할 수 있는 좋은 방법.<br><br><b>쓱싹쓱싹을 놓치면 만나서 반가워 모드<\/b> 재사용 대기 시간이 <b>8% 감소한다<\/b>.","r":1,"c":"ka","o":"K34"},{"id":"Addon_K34_10","ko":"휴대용 TV","en":"Portable TV","d":"어느 방에나 다 들어갈 만큼 작다. 단, 욕조에는 넣지 않길.<br><br>출구에 전력이 공급되면 <b>쓱싹쓱싹<\/b> 지속 시간이 <b>70%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K34"},{"id":"Addon_K34_11","ko":"실크 베개","en":"Silk Pillow","d":"매끄러운 부드러움으로 상대를 질식시키고 싶을 때를 위해.<br><br>공포 범위는 <b>6 미터<\/b> <b>감소<\/b>하지만, <b>쓱싹쓱싹<\/b> 차지 시간은 <b>50%<\/b> <b>늘어난다<\/b>.","r":2,"c":"ka","o":"K34"},{"id":"Addon_K34_12","ko":"무지개빛 부적","en":"Iridescent Amulet","d":"영역에서 재구현된 강력한 펜던트.<br><br><b>만나서 반가워 모드<\/b> 지속 시간이 <b>50%<\/b> <b>증가한다<\/b>. 기본 공격 시, <b>만나서 반가워 모드<\/b>가 즉시 <b>종료된다<\/b>.","r":4,"c":"ka","o":"K34"},{"id":"Addon_K34_13","ko":"비닐 봉지","en":"Plastic Bag","d":"살인은 매초 산소를 들이마시는 것과 같이 절대 지겨울 수 없다.<br><br>만약 생존자가 환영 발소리 사이로 들어오면, <b>15초<\/b> 동안 <b>탈진<\/b>에 걸린다.<br><br>탈진 상태의 생존자는 탈진을 유발하는 다른 기술을 활성화할 수 없다.","r":3,"c":"ka","o":"K34"},{"id":"Addon_K34_14","ko":"못 더미","en":"Pile of Nails","d":"목표물가 그들의 머리 위로 날아오는 못들에 대해 걱정할 때, 은신하기 더 쉽다.<br><br>수동적으로 <b>만나서 반가워 모드<\/b>에서 나가면, 착한 아이는 <b>3초<\/b> 동안 <b>감지 불가능<\/b>에 걸린다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":3,"c":"ka","o":"K34"},{"id":"Addon_K34_15","ko":"야드 자","en":"Yardstick","d":"거리를 재는 데 좋다. 특히 매를 맞기에는 더 좋다.<br><br><b>날쌔기<\/b>는 <b>16미터<\/b> 거리 내 생존자들의 오라를 <b>3 초<\/b> 동안 드러낸다.","r":2,"c":"ka","o":"K34"},{"id":"Addon_K34_16","ko":"러닝화","en":"Running Shoes","d":"고성능 살인 인형 운동 기술의 최신 기술.<br><br><b>날쌔기<\/b> 후 <b>5초<\/b> 동안 이동 속도가 <b>2%<\/b> 빨라진다.","r":2,"c":"ka","o":"K34"},{"id":"Addon_K34_17","ko":"쥐약","en":"Rat Poison","d":"살인마 칠리의 비밀 재료.<br><br><b>쓱싹쓱싹<\/b>을 수행하는 동안, <b>6미터<\/b> 범위 내에 생존자들의 오라가 <b>2.5초<\/b> 동안 드러난다.","r":2,"c":"ka","o":"K34"},{"id":"Addon_K34_18","ko":"면도칼","en":"Straight Razor","d":"아슬아슬한 위험이 매우 가까워야할 때.<br><br><b>쓱싹쓱싹<\/b> 공격은 <b>80초<\/b> 동안 <b>출혈<\/b>과 <b>깊은 상흔<\/b> 상태 이상에 빠진다.<br><br>출혈은 부상당한 생존자가 핏자국을 남길 확률을 증가시킨 출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 완전히 치료될 때까지 계속 지속된다.","r":3,"c":"ka","o":"K34"},{"id":"Addon_K34_19","ko":"안전모","en":"Hard Hat","d":"격렬한 활동을 수행하는 동안 돔을 그대로 유지한다.<br><br>판자 아래에서 <b>날쌔기<\/b>를 수행할 때마다, 즉시 특수 파괴가 적용된다.","r":4,"c":"ka","o":"K34"},{"id":"Addon_K34_20","ko":"거울 조각","en":"Mirror Shards","d":"빛과 그림자를 반사하는 산산조각 난 거울 조각들은 이미 방향을 잃은 사람들을 더욱 혼란스럽게 한다.<br><br>착한 아이는 생존자들 주변에 환영 발소리를 볼 수 있다.","r":3,"c":"ka","o":"K34"},{"id":"Addon_K35_01","ko":"토끼의 발","en":"Rabbit's Foot","d":"불운한 생물체의 유해는 나무에 의해 발견되었고, 창자는 이빨 사이에 끼어 있었다.<br><br><b>UVX<\/b> 차지 중에는 핏자국이 더 밝게 표시된다.<br><br><b>UVX<\/b>에 의해 부상을 당한 생존자는 <b>45초<\/b> 동안 <b>출혈<\/b> 상태 이상에 걸린다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다.","r":0,"c":"ka","o":"K35"},{"id":"Addon_K35_02","ko":"발자국 주물","en":"Footprint Cast","d":"주물은 플로리다주 사라소타에 있는 '기이한 현상들의 박물관'에 있으며 오래 전부터 공개되지 않고 있다.<br><br>생존자가 <b>약화<\/b>되면 다음 <b>환영<\/b> 스폰까지 시간이 <b>15초<\/b> <b>감소한다<\/b>.<br><br>약화된 생존자들이 UVX의 발파 구역에 의해 타격을 받으면 건강 상태를 한 단계 잃는다.","r":2,"c":"ka","o":"K35"},{"id":"Addon_K35_03","ko":"흐릿한 사진","en":"Blurry Photo","d":"버려진 캠핑장에서 사진 한 장이 발견됐다. 그러나 그곳에서 지낸 캠핑객들은 실종되었다.<br><br>순간 이동 후, 이동 속도가 <b>7%<\/b> 빠르게 완충된다.","r":0,"c":"ka","o":"K35"},{"id":"Addon_K35_04","ko":"길게 그인 백팩","en":"Slashed Backpack","d":"등산객이 산 고갯길에서 구조되었을 때, 그녀는 그녀의 동반자가 절대 혼자 헤매지 않을 것이라고 주장했다.<br><br><b>환영<\/b>과 닿는 순간, <b>UVX<\/b>는 발파 구역을 발동한다.<b>환영<\/b>은 <b>UVX<\/b>에 의해 파괴될 수 있다. 이를 파괴하면 다음 <b>환영<\/b> 스폰까지 걸리는 시간이 <b>65%<\/b> <b>줄어든다<\/b>.","r":1,"c":"ka","o":"K35"},{"id":"Addon_K35_05","ko":"구멍 뚫린 안구","en":"Punctured Eyeball","d":"그곳은 광기의 현장이었다. 그들은 서로에게 등을 돌린 것 같았다.<br><br><b>약화<\/b>되고 부상당한 생존자들은 그들이 <b>환영<\/b>을 무력화했을 때 <b>심각한 부상<\/b>에 걸린다.<br><br>제한 시간 안에 심각한 부상을 치료하지 않으면 생존자는 빈사 상태에 빠진다.<br><br>약화된 생존자들이 UVX의 발파 구역에 의해 타격을 받으면 건강 상태를 한 단계 잃는다.","r":0,"c":"ka","o":"K35"},{"id":"Addon_K35_06","ko":"이론 노트","en":"Notebook of Theories","d":"그의 원룸에는 아무도 없었고, 냄새 나는 검은 곰팡이가 피어있었다. 그곳에 남아있는 것이라곤 책 뿐이었다.<br><br>비행 중인 상태에서 <b>UVX<\/b>에 의해 타격을 입은 생존자들은 추가 <b>2초<\/b> 동안 <b>근육 손상<\/b> 상태 이상에 걸린다.<br><br>근육 손상은 생존자의 이동 속도를 감소시킨다.","r":1,"c":"ka","o":"K35"},{"id":"Addon_K35_07","ko":"마지막으로 알려진 녹음 파일","en":"Last Known Recording","d":"그녀는 사라지기 전에 구체 음악을 공부했다. 그리고 이 테이프에 그녀의 마지막 비명이 담겨 있다.<br><br>생존자에게 드러난 <b>환영<\/b>의 오라 범위가 <b>35%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K35"},{"id":"Addon_K35_08","ko":"스케치 시도","en":"Sketch Attempt","d":"피해자의 아이는 아버지가 데리러 오기를 기다리는 동안 역에서 종이와 크레파스를 받았다.<br><br><b>UVX의<\/b> 발파 구역에 타격을 입은 생존자들은 <b>20초<\/b> 동안 <b>인지 불가능<\/b>상태 이상에 걸린다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":0,"c":"ka","o":"K35"},{"id":"Addon_K35_09","ko":"피해자의 지도","en":"Victim’s Map","d":"그는 미스터리를 푸는 열쇠가 숲 너머에 있다고 생각한 동시에, 다시 돌아오지 못할 가능성에 두려워했다.<br><br>생존자가 미지의 존재와의 눈싸움에 성공하면, 미지의 존재는 <b>3초<\/b>의 <b>살인마의 본능<\/b>을 획득한다.","r":1,"c":"ka","o":"K35"},{"id":"Addon_K35_10","ko":"사라지는 상자","en":"Vanishing Box","d":"어린이들의 파티에서 인기가 있었던 마술사는 순식간에 유력한 용의자가 되었다.<br><br>발전기 수리를 완료한 생존자들은 <b>UVX<\/b> 상대로 <b>약화<\/b>된다.환영 스폰 시간이 <b>120%<\/b> <b>증가한다<\/b>.<br><br>UVX의 발파 구역에 타격을 입은 약화된 생존자들은 건강 상태를 잃는다.","r":2,"c":"ka","o":"K35"},{"id":"Addon_K35_11","ko":"신문 1면","en":"Front-Page Article","d":"습격자는 객실 벽에 난 구멍을 찢고 가족을 숲 속으로 몰아넣었다.<br><br>판자 또는 부서지기 쉬운 문에 손상 상호 작용을 수행하면 다음 <b>환영<\/b> 스폰까지 시간이 <b>50%<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"K35"},{"id":"Addon_K35_12","ko":"최면술사의 시계","en":"Hypnotist’s Watch","d":"억압된 기억을 복원하기 위해 최면 치료가 권해졌다. 그의 마음에서 떠오르는 것은 그의 잘못뿐이었다.<br><br>비행 중인 상태에서 <b>UVX<\/b>에 의해 타격을 입은 생존자들은 <b>15초<\/b> 동안 <b>탈진<\/b> 상태 이상에 걸린다.<br><br>생존자는 탈진으로 특정 기술을 발동할 수 없다.","r":2,"c":"ka","o":"K35"},{"id":"Addon_K35_13","ko":"B급 영화 포스터","en":"B-Movie Poster","d":"이 영화는 애플파이 프로젝트라는 것을 위해 특별히 만들어졌다. 국가가 지원하는 선전물로 소문이 났다.<br><br><b>UVX의<\/b> 발파 구역에 타격을 입은 생존자들은 <b>30초<\/b> 동안 <b>치료 불능<\/b> 상태 이상에 걸린다.<br><br>치료 불능 상태의 생존자는 치료를 할 수 없다.","r":2,"c":"ka","o":"K35"},{"id":"Addon_K35_14","ko":"출처 불명의 기기","en":"Device of Undisclosed Origin","d":"그것은 지구에서 만들어졌을까? 아니면 완전히 다른 곳에서 만들어졌을까?<br><br>생존자가 <b>환영<\/b>의 오라 범위에 들면 <b>인지 불가능<\/b>상태 이상에 걸린다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":1,"c":"ka","o":"K35"},{"id":"Addon_K35_15","ko":"수제 가면","en":"Homemade Mask","d":"살인마는 해가 지면 다른 사람들을 데려오는 뒤뜰 헛간에서 가면을 만들었다.<br><br><b>환영<\/b> 효과를 무력화한 생존자들은 <b>60초<\/b> 동안 <b>실명<\/b> 상태 효과에 걸린다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.","r":3,"c":"ka","o":"K35"},{"id":"Addon_K35_16","ko":"모호한 게임 카트리지","en":"Obscure Game Cartridge","d":"일부는 프로젝트 애플파이가 시간이 지남에 따라 진화하여 결과를 얻기 위해 새로운 형태의 미디어로 눈을 돌렸다.<br><br>순간 이동 후 <b>20초<\/b> 동안 발동된다.쓰러진 판자나 부서지기 쉬운 문을 부수기, 발전기 손상, 창틀 뛰어넘기의 행동 속도가 <b>30%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"K35"},{"id":"Addon_K35_17","ko":"버려진 우유 상자","en":"Discarded Milk Carton","d":"그녀는 집을 향해 먼 길을 가기로 결심하고, 헤어지기 전에 친구들에게 작별인사를 했다.<br><br><b>UVX<\/b> 발사체의 반동력이 두 배가 된다.","r":3,"c":"ka","o":"K35"},{"id":"Addon_K35_18","ko":"세럼 바이알","en":"Serum Vial","d":"실험실에서 물질의 분자 구조는 합성되었지만, 그 효과는 결코 재현될 수 없었다.<br><br><b>환영의<\/b> 오라 범위 내에 생존자들은 <b>15초<\/b> 동안 <b>탈진<\/b> 상태 이상에 걸린다.<br><br>생존자는 탈진으로 특정 기술을 발동할 수 없다.","r":3,"c":"ka","o":"K35"},{"id":"Addon_K35_19","ko":"어둠에 사로잡히다","en":"Captured by the Dark","d":"다큐멘터리는 실종이 소도시에 영화관과 연관이 있다고 주장했다. 관객들은 불안함을 느끼며 극장을 떠났다.<br><br>생존자들은 <b>약화<\/b>된 상태로 희생제를 시작한다.스폰 가능한 <b>환영<\/b>의 최대 수가 1 <b>감소한다<\/b>.<br><br>약화된 생존자들이 UVX의 발파 구역에 의해 타격을 받으면 건강 상태를 한 단계 잃는다.","r":4,"c":"ka","o":"K35"},{"id":"Addon_K35_20","ko":"핏빛 OSS 보고서","en":"Iridescent OSS Report","d":"보고서는 보고가 무의미할 정도로 편집되었다. 그러나 여전히 이론가들은 그것으로부터 의미를 추출하려고 노력했다.<br><br>순간 이동 재사용 대기 시간이 <b>5초<\/b> <b>감소한다<\/b>.미지의 존재가 순간 이동된 <b>10초<\/b> 후 미끼가 사라진다.생성되면, 미끼는 미지의 존재와 같이 공포 범위와 붉은 불빛을 갖는다.","r":4,"c":"ka","o":"K35"},{"id":"Addon_K36_01","ko":"너덜너덜한 머리띠","en":"Tattered Headband","d":"한때 강력한 소환사가 소유했던 마법의 장신구. 여전히 이전 마법의 속삭임을 담고 있다.<br><br>지옥의 비행에 의해 만들어진 스펙트럼 엔티티의 거리가 <b>4미터<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K36"},{"id":"Addon_K36_02","ko":"까마귀의 깃털","en":"Raven's Feather","d":"비행 주문에 가장 일반적으로 사용되는 재료 구성 요소.<br><br>비행 주문의 지속 시간이 <b>0.5초<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K36"},{"id":"Addon_K36_03","ko":"트릭스터의 장갑","en":"Trickster's Glove","d":"한때 마법사의 손 숙달이 섬유에 달라붙는 아르케인 트릭스터가 보유한 장갑.<br><br>마법사의 손이 판자를 들고 있는 시간이 <b>0.3초<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K36"},{"id":"Addon_K36_04","ko":"수정 구슬","en":"Crystal Ball","d":"수 세기 동안 마법사들이 아군과 적에 상관없이 모두에게서 비명을 자아내기 위해 사용했다.<br><br>구체를 무력화하여 생존자가 드러나면 살인마의 본능 효과가 추가로 <b>1초<\/b> 증가한다.","r":0,"c":"ka","o":"K36"},{"id":"Addon_K36_05","ko":"드러남의 등불","en":"Lantern of Revealing","d":"당신의 공격을 피하는 사람들도 당신의 시선을 피할 수 없다.<br><br>죽음의 비행을 아슬아슬하게 피한 생존자들의 오라가 <b>3초<\/b> 동안 드러난다.","r":1,"c":"ka","o":"K36"},{"id":"Addon_K36_06","ko":"속도의 묘약","en":"Potion of Speed","d":"물리 법칙을 단순한 제안으로 격하시킨 기묘한 조합.<br><br>비행 주문을 수행한 후 공격할 수 없는 시간이 <b>0.1초<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K36"},{"id":"Addon_K36_07","ko":"염력 반지","en":"Ring of Telekinesis","d":"사용자가 멀리서 물체를 조작하면 신비한 에너지가 살아난다.<br><br>똑바로 세워진 판자에 마법사의 손 주문을 수행할 때마다, <b>10초<\/b> 동안, <b>10%<\/b> 더 빠르게 기본 창문 뛰어넘기를 수행한다.","r":1,"c":"ka","o":"K36"},{"id":"Addon_K36_08","ko":"유리 눈","en":"Glass Eye","d":"추적 주문을 수행하는 데 사용되는 재료 구성 요소.<br><br>구체 무력화 크기가 <b>2미터<\/b> <b>증가<\/b>하며 속도가 <b>10%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K36"},{"id":"Addon_K36_09","ko":"주문 저장 반지","en":"Ring of Spell Storing","d":"준비가 잘 된 사람에게 보상을 주는 마법의 반지.<br><br>준비가 잘 된 사람에게 보상을 주는 마법의 반지. 모든 주문의 재사용 대기 시간이 <b>1초<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K36"},{"id":"Addon_K36_10","ko":"화려한 뿔","en":"Ornate Horn","d":"한때 군대를 모으는 데 사용되었고 거대한 군대의 무게를 견뎌야 했다.<br><br>지옥의 비행으로 생성된 엔티티의 수가 <b>1<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K36"},{"id":"Addon_K36_11","ko":"요정의 망토","en":"Cloak of Elvenkind","d":"색상이 지속적으로 변화하기 때문에 멀리서도 탐지하기가 더 어렵다.<br><br>비행 주문이 활성화된 동안 공포 범위가 <b>22미터<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"K36"},{"id":"Addon_K36_12","ko":"속도의 부츠","en":"Boots of Speed","d":"한 번의 딸깍 거리는 소리에도 착용자는 놀라운 속도를 얻을 수 있다.<br><br>마법사의 손을 수행하면 <b>2초<\/b> 동안 <b>3%의 이동 속도 증가<\/b> 효과가 제공된다.<br><br>이동 속도 증가 효과가 살인마의 이동 속도를 높인다.","r":2,"c":"ka","o":"K36"},{"id":"Addon_K36_13","ko":"시든 지팡이","en":"Staff of Withering","d":"괴사력은 목표물을 죽음에 가깝게 만든다.<br><br>구체 무력화 주문은 범위 내에 들어온 생존자들을 <b>30초<\/b> 동안 <b>탈진<\/b> 상태로 만든다.<br><br>탈진 상태의 생존자는 탈진 기술을 활성화할 수 없다.","r":2,"c":"ka","o":"K36"},{"id":"Addon_K36_14","ko":"능력의 진주","en":"Pearl of Power","d":"빛나는 얼굴은 주문을 외고 있는 마법사에게 힘을 주어 더 많은 주문을 수행할 수 있게 만든다.<br><br>기본 공격을 획득할 때마다 주문의 남은 재사용 대기 시간이 <b>2초<\/b> <b>감소한다<\/b>.","r":2,"c":"ka","o":"K36"},{"id":"Addon_K36_15","ko":"두 눈의 로브","en":"Robe of Eyes","d":"착용하면 누구도 진주를 가진 자의 시선을 피할 수 없다.<br><br>주문을 수행할 때마다 보물 상자로부터 <b>6미터<\/b> 내에 있는 생존자들의 오라가 <b>4초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K36"},{"id":"Addon_K36_16","ko":"용의 이빨로 만든 단검","en":"Dragontooth Dagger","d":"드래곤의 진짜 이빨로 만들어, 끝부분이 매우 삐죽삐죽하며 지독하다.<br><br>생존자가 마법의 아이템을 보유하는 동안 기본 공격에 당하면 <b>60초<\/b> 동안 <b>출혈<\/b>과 <b>깊은 상흔<\/b>에 걸린다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":3,"c":"ka","o":"K36"},{"id":"Addon_K36_17","ko":"투명 망토","en":"Cloak of Invisibility","d":"강력한 마법 아이템으로, 로그들뿐만 아니라 갈등을 싫어하는 사람들이 모두 부러워하는 아이템이다.<br><br>플레이어의 모든 주문이 동시에 재사용 대기 시간을 가지면 동시에 <b>20초<\/b> 동안 <b>감지 불가능<\/b>을 얻는다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":3,"c":"ka","o":"K36"},{"id":"Addon_K36_18","ko":"보따리","en":"Bag of Holding","d":"영역 자체가 놀라운 수용력에 의해 변해갔고 더 많은 희생제를 담을 수 있게 되었다.<br><br>보물 상자 2개로 <b>1회<\/b>의 주사위 던지기를 수행할 수 있다.보석 상자를 열면 생존자들에게 <b>15초<\/b> 동안 <b>인지 불가능<\/b> 상태 효과를 부여된다.<br><br>인지 불가능은 생존자가 듣고 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":3,"c":"ka","o":"K36"},{"id":"Addon_K36_19","ko":"날카로운 검","en":"Vorpal Sword","d":"몸에 붙은 수많은 머리를 잘라낸 강력한 마법의 유물.<br><br>구체 무력화 사정거리에 들어간 부상을 입은 생존자들은 비명을 지르며 <b>30초<\/b> 동안 <b>치료 불능<\/b>을 부여받는다.떨어진 판자에 마법사의 손 주문을 걸 때마다, <b>4초<\/b> 후 판자에 특수 파괴가 적용된다.<br><br>치료 불능 상태의 생존자는 치료를 할 수 없다.","r":4,"c":"ka","o":"K36"},{"id":"Addon_K36_20","ko":"무지갯빛 비열한 어둠의 책","en":"Iridescent Book of Vile Darkness","d":"잔인함, 사악함, 타락의 궁극적인 집합체.<br><br>비행 주문을 사용하면 <b>45초<\/b> 동안 생존자는 막혀 있는 모든 뛰어넘기 구역을 통과할 수 있다.죽음의 비행으로 생성된 유령 같은 엔티티의 수가 <b>3개<\/b> 감소하며 비행 고도가 <b>낮아진다<\/b>.","r":4,"c":"ka","o":"K36"},{"id":"Addon_K37_01","ko":"요정의 깃털","en":"Sylph Feather","d":"깃털을 보유한 자에게 엄청난 명민함을 부여하는 마법의 깃털.<br><br>판자를 부서뜨릴 때마다, 토큰 1개를 획득하며, 최대 5개를 획득할 수 있다. 토큰 1개마다, <b>지옥불<\/b>의 재사용 대기 시간이 <b>5%<\/b> 짧아진다.","r":2,"c":"ka","o":"K37"},{"id":"Addon_K37_02","ko":"루비색 화관","en":"Ruby Circlet","d":"가장 강력한 화염도 불사르는 머리에 쓰는 마법의 관.<br><br>지옥불의 재사용 대기 시간이 <b>5%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K37"},{"id":"Addon_K37_03","ko":"케르베로스의 발톱","en":"Cerberus Talon","d":"드라큘라의 가장 무서운 호위 중 한 명의 날카로운 기념품.<br><br>향기 구체의 노출 거리가 <b>100%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K37"},{"id":"Addon_K37_04","ko":"시계탑 장비","en":"Clock Tower Gear","d":"거대한 시계탑의 한 조각으로, 시간 자체의 불가피성을 상기시켜준다.<br><br>변신 능력의 재사용 대기 시간이 <b>5%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K37"},{"id":"Addon_K37_05","ko":"마법의 티켓","en":"Magical Ticket","d":"한때 드라큘라의 성을 가로지르는 데 사용되던 이상한 유물.<br><br>순간 이동의 최대 속도가 <b>10%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K37"},{"id":"Addon_K37_06","ko":"문스톤 목걸이","en":"Moonstone Necklace","d":"낮에는 단순한 목걸이지만, 어둠 속에서는 그 힘이 살아난다.<br><br>뱀파이어와 늑대 형태일 때 공포 범위 크기가 <b>8미터<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K37"},{"id":"Addon_K37_07","ko":"피가 고인 고블릿","en":"Blood-Filled Goblet","d":"그의 희생자들의 피가 그를 계속 살아가게 하며, 그를 위대한 사냥꾼으로 만든다.<br><br>향기 구체의 지속 시간이 <b>60%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K37"},{"id":"Addon_K37_08","ko":"여행자의 모자","en":"Traveler’s Hat","d":"여행을 잘 다니는 남자의 것이었던 챙 넓은 모자.<br><br>형태 전환의 속도가 <b>5%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K37"},{"id":"Addon_K37_09","ko":"날개 달린 부츠","en":"Winged Boots","d":"착용자가 빠르게 움직이기 위해 오랫동안 사용했다.<br><br>순간 이동 최대 거리가 <b>20%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K37"},{"id":"Addon_K37_10","ko":"하얀 늑대 메달","en":"White Wolf Medallion","d":"한때 위대한 혼의 안내자를 불러내기 위해 쓰였던 장신구.<br><br>생존자가 빠른 행동을 완료한 후, 늑대 형태로 있는 동안 살인마의 본능 지속 시간이 <b>1초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K37"},{"id":"Addon_K37_11","ko":"살인마 인형","en":"Killer Doll","d":"드라큘라의 부하 중 하나로, 모든 것이 그의 놀잇감에 불과하다는 사실을 상기시킨다.<br><br>향기 구체의 덮치기 공격 기술의 재사용 대기 시간 감소 효과가 <b>30%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K37"},{"id":"Addon_K37_12","ko":"선글라스","en":"Sunglasses","d":"그것은 멋져 보일 뿐만 아니라 밝은 빛으로부터 당신을 보호한다.<br><br>지옥불은 <b>추가 기둥 1개<\/b>를 보유한다. 지옥불 차징 시간이 <b>25%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K37"},{"id":"Addon_K37_13","ko":"메아리의 힘","en":"Force of Echo","d":"어둠 속에서 박쥐에게 더 큰 감각을 부여하는 유물.<br><br>향기 구체의 생성률이 <b>10%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K37"},{"id":"Addon_K37_14","ko":"회중시계","en":"Pocket Watch","d":"시간의 규칙 자체를 악용하는 도구.<br><br>판자 또는 부서지기 쉬운 문을 부술 때마다, <b>순간 이동<\/b>의 내구도가 즉시 재충전된다.","r":2,"c":"ka","o":"K37"},{"id":"Addon_K37_15","ko":"메두사의 머리카락","en":"Medusa’s Hair","d":"드라큘라의 가장 오래되고 무시무시한 부하 하나에서 나온 뱀과 같은 기념품.<br><br>순간 이동 중 생존자로부터 <b>8미터<\/b> 이내를 통과하면 그들은 <b>4초<\/b> 동안 <b>8%의 근육 손상<\/b>에 걸린다.<br><br>근육 손상은 생존자의 이동 속도를 감소시킨다.","r":3,"c":"ka","o":"K37"},{"id":"Addon_K37_16","ko":"와르그의 이빨","en":"Warg’s Fang","d":"드라큘라의 가장 위험한 동맹국 중 하나로부터 빼앗은 강력한 파괴 도구.<br><br><b>5초<\/b> 동안 덮치기 공격이 가능해질 때마다 수집한 향기 구체를 떨어뜨린 모든 생존자의 오라가 <b>드러난다<\/b>.","r":3,"c":"ka","o":"K37"},{"id":"Addon_K37_17","ko":"조의 큐브","en":"Cube of Zoe","d":"존재가 무에서 유를 창조하는 이상한 상자.<br><br>발전기 수리가 완료되면, <b>10초<\/b> 동안 어둠의 군주 주변에 무작위로 지옥불 기둥을 <b>생성한다<\/b>.","r":3,"c":"ka","o":"K37"},{"id":"Addon_K37_18","ko":"라피스 라즐리","en":"Lapis Lazuli","d":"돌을 가진 자에게 행운을 가져다주거나 적으로부터 행운을 빼앗는 돌로 알려져 있다.<br><br>뛰어넘을 창문으로 순간 이동하면 엔티티는 <b>8초<\/b> 동안 생존자들로부터 창문을 <b>차단한다<\/b>.","r":3,"c":"ka","o":"K37"},{"id":"Addon_K37_19","ko":"알루카드의 방패","en":"Alucard’s Shield","d":"사방에서 다가오는 전달자의 적을 차단하는 가보.<br><br>출구가 열리면, 출구 문 안에 지옥불 기둥이 <b>계속해서 스폰된다<\/b>.","r":4,"c":"ka","o":"K37"},{"id":"Addon_K37_20","ko":"핏빛 블라드의 반지","en":"Iridescent Ring of Vlad","d":"드라큘라의 소유물인 독특한 유품. 그것 없이는 아무도 어둠의 군주에게 접근할 수 없다고 한다.<br><br>지옥불 기둥이 주변 생존자들에게 <b>곧장 나아간다<\/b>.","r":4,"c":"ka","o":"K37"},{"id":"Addon_K38_01","ko":"덜 익은 코코넛","en":"Young Coconut","d":"난파선에서 처음으로 먹은 식사. 충성스러운 동료와 함께 나눴다.<br><br>개의 추격 속도가 <b>5%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K38"},{"id":"Addon_K38_02","ko":"끈적한 방수제","en":"Sticky Pitch","d":"선박을 최상의 상태로 유지하는 데 필수적인 상품.<br><br>탐색 경로가 실행되는 동안, 조련사의 보너스 이동 속도가 <b>2%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K38"},{"id":"Addon_K38_03","ko":"어느 생명체의 뼈","en":"Creature's Bone","d":"그것은 그녀가 난생처음 보는 것이었다. 골수에서 아주 좋은 냄새가 났다.<br><br>개의 기절 지속 시간이 <b>50%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K38"},{"id":"Addon_K38_04","ko":"트레이너의 책","en":"Trainer's Book","d":"그 안에 담긴 조언 중 일부는 그들의 유대감을 더 강하게 만들었다.<br><br>사냥개의 감각 지속 기간이 <b>35%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K38"},{"id":"Addon_K38_05","ko":"보릿가루","en":"Barley Meal","d":"싱겁지만 활력을 되찾아주는 오트밀의 중요 재료.<br><br>개의 시작 추격 거리가 <b>20%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K38"},{"id":"Addon_K38_06","ko":"빌레이 핀","en":"Belaying Pins","d":"로프를 잡고, 매듭을 고정하고, 돛을 조작하는 데 이상적이다.<br><br>생존자들이 사냥개의 감각 범위에 들어가면 살인마의 본능에게 드러나며, 생존자들은 <b>20초<\/b> 동안 <b>인지 불가능<\/b> 상태가 된다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":1,"c":"ka","o":"K38"},{"id":"Addon_K38_07","ko":"훈제 도미","en":"Smoked Snapper","d":"장기간의 탐험에도 품질이 유지되도록 보존 처리한 단백질이 풍부한 식품.<br><br>능력 재사용 대기 시간이 <b>5%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K38"},{"id":"Addon_K38_08","ko":"울퉁불퉁한 밧줄","en":"Knotted Rope","d":"개의 턱이 즉석 해서 만든 장난감을 꽉 물고 앞뒤로 흔들었다.<br><br>개의 입질 동안 생존자들을 향한 기본 공격의 재사용 대기 시간이 <b>2%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K38"},{"id":"Addon_K38_09","ko":"작은 망원경","en":"Spyglass","d":"아무리 멀리 떨어져 있는 것이라도, 찾고 있는 것을 찾아내는 데 사용된다.<br><br>사냥개의 감각 지속 기간이 끝나면, 생존자의 오라가 <b>3초<\/b> 동안 <b>드러난다<\/b>.","r":1,"c":"ka","o":"K38"},{"id":"Addon_K38_10","ko":"물 주머니","en":"Waterskin","d":"그녀는 개에게 마지막 남은 그녀의 물을 주었다. 사냥하는 데 힘이 들 것을 알았기 때문이다.<br><br>개의 추격 재탐색 거리가 <b>20%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K38"},{"id":"Addon_K38_11","ko":"미완성 지도","en":"Unfinished Map","d":"버뮤다 삼각 지대라고 알려지게 된 지역에 대한 자세한 정보가 있다.<br><br>생존자들이 사냥개의 감각 범위에 들어가면 살인마의 본능에게 드러나며, 생존자들은 <b>15초<\/b> 동안 <b>탈진<\/b> 상태가 된다.<br><br>생존자는 탈진으로 특정 기술을 발동할 수 없다.","r":2,"c":"ka","o":"K38"},{"id":"Addon_K38_12","ko":"훈련용 종","en":"Training Bell","d":"아주 먼 거리에서도 개에게 주인이 어디에 있는지 정확히 알려준다.<br><br>개가 기절하면, 개를 기절시킨 생존자의 오라가 <b>8초<\/b> 동안 드러난다.","r":2,"c":"ka","o":"K38"},{"id":"Addon_K38_13","ko":"징 박힌 목줄","en":"Spiked Collar","d":"전투에 투입된 개가 착용하는 위험한 액세서리.<br><br>개의 입질 동안 부상을 당하는 생존자는 <b>60초<\/b> 동안 <b>깊은 상흔<\/b> 및 <b>출혈<\/b>에 걸린다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 완전히 치료될 때까지 계속 지속된다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"K38"},{"id":"Addon_K38_14","ko":"지방 가득한 고기","en":"Fatty Meat","d":"개과 친구를 위한 이상하지만 거부할 수 없는 간식.<br><br>사냥개의 감각으로 영향을 받은 생존자는 <b>15초<\/b>마다 조련사에게 드러나지 않고 주기적으로 비명을 지른다.","r":2,"c":"ka","o":"K38"},{"id":"Addon_K38_15","ko":"가죽 하네스","en":"Leather Harness","d":"개의 모든 움직임을 더 잘 제어할 수 있다.<br><br><b>발전기 수리가 완료되면, 개의 추격 속도가 30초<\/b> 동안 <b>20%<\/b> <b>증가한다<\/b>.모든 발전기의 수리가 완료되면, 해당 보너스가 영구적으로 적용된다.","r":3,"c":"ka","o":"K38"},{"id":"Addon_K38_16","ko":"화약통","en":"Gunpowder Tin","d":"모든 종료에 폭발에 유용하다.<br><br>사냥개의 감각에 영향을 받은 생존자가 최소 1명 발생할 때마다, <b>20초<\/b> 동안, 판자 또는 부서지기 쉬운 문 기본 파괴, 그리고 발전기 손상을 <b>30%<\/b> 더 빠르게 수행한다.","r":3,"c":"ka","o":"K38"},{"id":"Addon_K38_17","ko":"밧줄 스파이크","en":"Marlinspike","d":"로프를 풀 때와 마찬가지로 심각한 신체적 상해를 입히는 데 유용하다.<br><br>개에게 입질을 당하는 생존자로부터 <b>20미터<\/b> 내에 있는 생존자는 사냥개의 감각에 의해 영향을 받는다.","r":3,"c":"ka","o":"K38"},{"id":"Addon_K38_18","ko":"선수상","en":"Ship Figurehead","d":"다른 배의 뱃머리에서 뜯어낸 전리품.<br><br>개가 조련사를 따라다니는 동안, 공포 범위가 <b>8미터<\/b> <b>증가한다<\/b>.조련사로부터 개가 멀어지면, 공포 범위가 <b>8미터<\/b> <b>감소한다<\/b>.","r":3,"c":"ka","o":"K38"},{"id":"Addon_K38_19","ko":"찢어진 소설책","en":"Torn Novel","d":"아버지가 그녀에게 준 책. 습격 후 거의 다 망가졌다.<br><br>추격 재탐색을 조준하는 동안, 개로부터 <b>10미터<\/b> 내 생존자들의 오라가 드러난다.조련자의 통제가 다시 시작되면, 이런 방식으로 드러난 생존자의 오라는 <b>2초<\/b> 더 드러난다.","r":4,"c":"ka","o":"K38"},{"id":"Addon_K38_20","ko":"핏빛 선박 키","en":"Iridescent Wheel Handle","d":"한때 넓은 바다를 가로질러 큰 배를 안내하는 데 사용되었던 것으로, 그 잔해는 이제 과거의 기억으로 사용된다.<br><br><b>개의 목적지 탐색 능력이 20%<\/b> <b>더 지속된다<\/b>.개가 탐색 목적지에서 탐색을 수행하는 동안, 조련자는 <b>감지 불가능<\/b> 상태 효과에 걸린다.경로 탐색에서 서 있으면, <b>감지 불가능<\/b> 상태 효과가 제거된다.<br><br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":4,"c":"ka","o":"K38"},{"id":"Addon_K39_01","ko":"카네키의 지갑","en":"Kaneki’s Wallet","d":"길에서 우연히 마주친 이상한 소년에게 패배했다.<br><br>연속 카구네 도약을 수행할 수 있는 시간이 <b>3초<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K39"},{"id":"Addon_K39_02","ko":"검은 산양의 알","en":"The Black Goat’s Egg","d":"중요한 여성과 유대감을 형성하기 위해 그가 사용했던 책.<br><br>붙잡기 공격을 완벽한 타이밍에 맞게 수행하면 <b>100%<\/b> 블러드포인트 보너스가 제공된다.","r":0,"c":"ka","o":"K39"},{"id":"Addon_K39_03","ko":"안테이크 앞치마","en":"Anteiku Apron","d":"아주 사랑스러운 작은 커피숍의 표준 유니폼.<br><br>카구네 도약 후 슬라이드가 <b>50%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K39"},{"id":"Addon_K39_04","ko":"신선한 커피","en":"Fresh Coffee","d":"모든 구울의 최애 음료. 그들이 먹을 수 있는 유일한 인간의 진미.<br><br>카구네 도약 속도가 <b>14%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"K39"},{"id":"Addon_K39_05","ko":"브로큰 체인","en":"Broken Chain","d":"그가 마침내 자신의 잠재력을 완전히 받아들인 후에는 아무것도 그를 제지할 수 없었다.<br><br>분노 모드가 아닐 때, 카구네 도약 재사용 대기 시간이 <b>35%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K39"},{"id":"Addon_K39_06","ko":"카네키의 배낭","en":"Kaneki's Satchel","d":"학업을 따라잡으려는 모든 학생에게 필수적인 장비.<br><br>연속 세 번째 카구네 도약의 속도가 <b>30%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K39"},{"id":"Addon_K39_07","ko":"히데의 헤드폰","en":"Hide’s Headphones","d":"그것들은 어떤 대가를 치르더라도 안전을 지키려고 노력한 그의 가장 친한 친구의 소유였다.<br><br>카구네 표식에 영향을 받은 생존자들은 <b>인지 불가능<\/b> 상태 이상에 걸린다.<br><br>인지 불가능은 생존자가 듣고 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":1,"c":"ka","o":"K39"},{"id":"Addon_K39_08","ko":"붕어빵","en":"Taiyaki","d":"구울은 인간의 음식을 먹을 순 없지만, 흉내는 낼 수 있는 방법을 찾았다.<br><br>분노 모드 초읽기가 <b>5초<\/b> 증가한다.","r":0,"c":"ka","o":"K39"},{"id":"Addon_K39_09","ko":"피로 얼룩진 손수건","en":"Blood-Stained Handkerchief","d":"단 한 방울의 피도 모든 미식가의 감각을 자극할 수 있다.<br><br>카구네의 사거리가 <b>1미터<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K39"},{"id":"Addon_K39_10","ko" /b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K40"},{"id":"Addon_K40_09","ko":"사무실 전화","en":"Office Phone","d":"그는 경고의 의미로 메시지를 남기려 했으나, 그는 또한 오래가지 못했다.<br><br>도끼가 박힌 생존자로부터 <b>24미터<\/b> 반경에 있는 생존자들은 <b>인지 불가능<\/b>에 걸리며, 만약 생존자가 부상 상태라면, <b>치료 불능<\/b> 상태 이상에 걸린다. 해당 범위 내 생존자들에게 도끼의 오라가 드러난다.<br><br>다른 생존자에게서 도끼를 제거하는 데 필요한 시간이 <b>50%<\/b> <b>감소한다<\/b>.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.<br><br>치료 불능 상태의 생존자는 치료를 할 수 없다.","r":1,"c":"ka","o":"K40"},{"id":"Addon_K40_10","ko":"치카의 턱받이","en":"Chica’s Bib","d":"미스터 컵케이크가 엉망이 되는 것을 막는 좋은 방법이다.<br><br>도끼의 효과 범위에 있는 생존자들은 <b>5초<\/b> 동안 <b>탈진<\/b>에 걸린다.<br><br>탈진 상태의 생존자는 탈진 기술을 활성화할 수 없다.","r":2,"c":"ka","o":"K40"},{"id":"Addon_K40_11","ko":"보니의 기타줄","en":"Bonnie’s Guitar Strings","d":"조율이 맞지 않고 끊어지기 쉬운 낡은 줄.<br><br>생존자의 오라를 읽을 수 있는 능력을 얻게 된다.<br><br>경비실 문 사이를 이동하는 동안, 발전기 수리 상태를 오라의 진한 정도로 구분할 수 있게 된다.<br><br>경비실 문을 나가면, <b>감지 불가능<\/b> 지속 기간이 <b>100%<\/b> <b>감소한다<\/b>.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":2,"c":"ka","o":"K40"},{"id":"Addon_K40_12","ko":"폭시의 갈고리","en":"Foxy’s Hook","d":"장난치는 용도보다 위협적인 듯한 해적의 갈고리.<br><br>도끼의 효과 범위 내 플레이어들은 <b>6초<\/b> 동안 <b>7%의 이동 속도 증가<\/b> 효과를 얻는다.<br><br>이동 속도 증가 효과가 살인마의 이동 속도를 높인다.","r":2,"c":"ka","o":"K40"},{"id":"Addon_K40_13","ko":"퍼플가이의 그림","en":"Purple Guy Drawing","d":"그는 단 10초 만에 그림을 그릴 수 있다!<br><br>생존자에게 도끼가 박혀있는 동안, 해당 생존자가 빠르게 상호작용할 경우 <b>3초<\/b> 동안 생존자의 오라가 드러난다.<br><br>생존자가 도끼를 제거하면 살인마에게 <b>6초<\/b> 동안 오라가 드러난다.","r":2,"c":"ka","o":"K40"},{"id":"Addon_K40_14","ko":"프레디의 모자","en":"Freddy’s Hat","d":"가브리엘은 잘못된 어른에게 믿음을 가졌다. 이제 그는 이 쇼의 스타가 되었다.<br><br>투척하는 도끼의 무게가 <b>100%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"K40"},{"id":"Addon_K40_15","ko":"전리품 가방","en":"Loot Bag","d":"가방을 열어서 안에 어떤 물건이 들어 있는지 살펴보아라.<br><br>도끼가 생존자의 몸에 박혀있는 동안: 해당 생존자들과 <b>12미터<\/b> 내에 있는 생존자들 모두 출구가 차단되어 탈출할 수 없다.","r":3,"c":"ka","o":"K40"},{"id":"Addon_K40_16","ko":"컨트롤패널 접근","en":"Access Panel","d":"경비실 문에 대한 통제권을 얻는 것은 임무를 달성하는 데 가장 중요하다.<br><br>당신의 도끼는 경비실 문을 통과할 수 있는 능력을 부여하며, 연결된 경비실 문으로 바로 나갈 수 있다.<br><br>도끼를 조준할 때:경비실로부터 <b>6미터<\/b> 내에 생존자에 대한 살인마의 본능을 획득한다.모든 경비실 번호의 오라가 드러난다.","r":3,"c":"ka","o":"K40"},{"id":"Addon_K40_17","ko":"축제! 포스터","en":"Celebrate! Poster","d":"축제는 밤 늦게까지 계속된다. 아무도 남지 않을 때까지.<br><br>생존자에게 도끼가 박힌 동안, <b>32미터<\/b> 내에 모든 플레이어들은 <b>12%의 이동 속도 증가<\/b> 효과를 얻으며 <b>20%<\/b> 빠르게 창틀을 뛰어넘는다.<br><br>이동 속도 증가 효과는 살인마의 이동 속도를 증가시킨다.","r":3,"c":"ka","o":"K40"},{"id":"Addon_K40_18","ko":"파즈코인","en":"Faz-Coin","d":"토큰 수집에는 대가가 따른다.<br><br>도끼를 투척하면, <b>24미터<\/b>의 공포 범위를 얻으며, 다시 도끼가 회수하기 전까지 지속된다. <b>10초<\/b> 동안 <b>감지 불가능<\/b> 상태 이상을 얻는다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":4,"c":"ka","o":"K40"},{"id":"Addon_K40_19","ko":"내장 CPU","en":"Endo CPU","d":"연산 능력이 높을수록 효율은 높아진다.<br><br>도끼의 효과 범위 내에서, 판자 또는 부서지기 쉬운 문 기본 파괴, 그리고 발전기 손상을 <b>40%<\/b> 더 빠르게 수행한다. 해당 효과는 효과 범위를 벗어난 후 <b>5초<\/b> 동안 지속된다.","r":3,"c":"ka","o":"K40"},{"id":"Addon_K40_20","ko":"핏빛 잔류물","en":"Iridescent Remnant","d":"용해된 금속. 올바른 자의 손에 들어가면, 이는 영생의 열쇠가 된다.<br><br>경비원 문으로 이동하기 시작하면, 연결된 반대편 문으로부터 <b>32미터<\/b> 내에 있는 똑바로 세워진 판자는 <b>12초<\/b> 동안 차단된다.","r":4,"c":"ka","o":"K40"},{"id":"Addon_K41_01","ko":"끈적한 목캔디","en":"Sticky Lozenge","d":"오디션 전에 흔히 복용하는, 건조한 목을 촉촉하게 해주는 간단한 약.<br><br><b>역류<\/b>를 장전할 때, 충돌 지역을 미리볼 수 있다.","r":0,"c":"ka","o":"K41"},{"id":"Addon_K41_02","ko":"부서진 티아라","en":"Broken Tiara","d":"파라오의 딸이 착용한 눈부신 무대 소품은 가짜였지만, 여전히 눈길을 사로잡는다.<br><br>생존자들은 <b>발광 곰팡이<\/b> 효과로 <b>인지 불가능<\/b>이 된다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":0,"c":"ka","o":"K41"},{"id":"Addon_K41_03","ko":"재수 옴 붙은 쥐","en":"Luckless Mouse","d":"고양이와 쥐의 놀이는 언제나 사람들의 피를 끓게 만든다.<br><br><b>황급한 도주<\/b>의 내구도가 <b>2<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K41"},{"id":"Addon_K41_04","ko":"첫 번째 오페라의 대본","en":"First Libretto","d":"그녀는 첫 오페라에서 역할을 맡은 후 마치 공중을 걷는 듯한 기분을 느꼈다.<br><br><b>거머리에 물린 생존자가 갈고리에 걸리면 황급한 도주<\/b>의 소모율이 <b>15초<\/b> 동안 <b>30%<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K41"},{"id":"Addon_K41_05","ko":"꿈틀거리는 기생충","en":"Wriggling Parasite","d":"숙주에게 특이한 영향을 미치는 연약한 유기체.<br><br><b>거머리 II<\/b>의 패시브 성장 속도가 <b>16%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K41"},{"id":"Addon_K41_06","ko":"말라이의 덩어리","en":"Chunk of Malai","d":"다양한 단백질 공급원은 장 건강에 도움이 된다.<br><br><b>거머리<\/b>에 물린 생존자 한 명당 <b>발광 곰팡이<\/b>의 정화 속도가 <b>8%<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"K41"},{"id":"Addon_K41_07","ko":"구겨진 악보","en":"Crumpled Sheet Music","d":"그녀는 모든 것을 포기하기 전에, 계속 연습하면 성공할 수 있을 거라고 희망했다.<br><br>생존자가 <b>거머리샘<\/b>에 의해 타격을 입으면 <b>황급한 도주<\/b>에 <b>내구도 12<\/b>를 획득한다.","r":1,"c":"ka","o":"K41"},{"id":"Addon_K41_08","ko":"결함 있는 메트로놈","en":"Defective Metronome","d":"메트로놈이 열광적인 속도로 움직이면서 불꽃이 튀었다.<br><br><b>발광 곰팡이<\/b>의 효과에 걸린 생존자들은 <b>탈진<\/b>에 걸린다.<br><br>생존자는 탈진으로 특정 기술을 발동할 수 없다.","r":1,"c":"ka","o":"K41"},{"id":"Addon_K41_09","ko":"돼지의 눈","en":"Pig's Eye","d":"아직도 침으로 반짝인다.<br><br>생존자가 <b>40미터<\/b> 이상 떨어진 거리에서 <b>발광 곰팡이<\/b>를 먹으면, 생존자들의 오라가 <b>6초<\/b> 동안 살인마에게 드러난다.","r":1,"c":"ka","o":"K41"},{"id":"Addon_K41_10","ko":"닭 머리","en":"Chicken Head","d":"어떤 사람들은 이 샘플이 신비로운 성질을 가지고 있다고 믿었는데, 끄라스가 먹이를 먹은 후 이 샘플이 목구멍에 걸려 내려가지 않았다.<br><br>모든 생존자에게 <b>거머리 I<\/b> 효과가 발동되기 시작한다.추가 <b>발광 곰팡이<\/b> <b>2<\/b>개가 희생제 시작에 스폰된다.","r":4,"c":"ka","o":"K41"},{"id":"Addon_K41_11","ko":"잔지라의 손","en":"Janjira's Hand","d":"그녀의 친구에게 남은 몇 안 되는 구별 가능한 신체 부위 중 하나.<br><br>발전기가 수리될 때마다 <b>황급한 도주<\/b> 내구도를 2 <b>획득한다<\/b>. <b>황급한 도주<\/b>의 내구도 충전 속도가 <b>15초<\/b> 동안 <b>25%<\/b> 증가한다.<b>발전기 5대<\/b>가 수리되면, <b>황급한 도주<\/b>가 완전히 충전되고 재충전 속도가 영구적으로 <b>25%<\/b> 증가한다.","r":2,"c":"ka","o":"K41"},{"id":"Addon_K41_12","ko":"무딘 칼","en":"Dulled Knife","d":"사형수인 연인을 구하기 위해 노력하는 한 여성의 모험을 상징하는 무대 장치.<br><br><b>황급한 도주<\/b>의 내구도 소모량이 <b>25%<\/b> <b>감소한다<\/b>.<b>발광 곰팡이<\/b>는 <b>5초<\/b> 동안 생존자들에게 <b>10%의 이동 속도 증가<\/b> 효과를 부여하며, 발자국, 핏자국, 부상으로 인한 신음, 그리고 오라 드러남이 방지한다.<br><br>이동 속도 증가 효과로 생존자의 이동 속도가 증가한다.","r":2,"c":"ka","o":"K41"},{"id":"Addon_K41_13","ko":"얼룩진 손수건","en":"Spattered Handkerchief","d":"뭔가 매우 잘못되었다는 징조가 나타났지만 그녀는 그것을 무시하기로 했다.<br><br>출구에 전원이 공급되면, 모든 생존자들은 <b>거머리 I<\/b>에 걸린다. <b>발광 곰팡이<\/b>는 부패하기 시작하며 <b>살결의 직조<\/b>가 활성화되어 더 이상 새로운 <b>발광 곰팡이<\/b>를 생성하지 않는다.","r":2,"c":"ka","o":"K41"},{"id":"Addon_K41_14","ko":"액자에 걸린 신문","en":"Framed Newspaper","d":"그녀는 한때 도시 신문의 연예 섹션에 실린 적이 있었지만 그녀는 더 많은 것을 원했다.<br><br><b>황급한 도주<\/b> 내구도가 <b>6<\/b>, 재충전 속도가 <b>15%<\/b> <b>증가한다<\/b>.<b>황급한 도주<\/b>를 활성화하려면 내구도 전체에 절반이 채워져야 한다.","r":2,"c":"ka","o":"K41"},{"id":"Addon_K41_15","ko":"로렌자의 유골","en":"Lorenza's Remains","d":"그녀의 애완 새조차도 끄라스의 피를 향한 갈증의 희생자가 되고 말 것이다.<br><br><b>거머리 I<\/b>은 <b>실명<\/b>을 입힌다.<b>거머리 II<\/b>는 <b>4%의 근육 손상<\/b>을 입힌다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.<br><br>근육 손상은 생존자의 이동 속도를 감소시킨다.","r":3,"c":"ka","o":"K41"},{"id":"Addon_K41_16","ko":"잘게 조각난 가운","en":"Shredded Gown","d":"그녀의 몸이 타오르자 그녀는 옷과 살을 찢었다.<br><br><b>살결의 직조<\/b>가 <b>발광 곰팡이<\/b>로부터 <b>8미터<\/b> 내에 있거나 각자의 <b>발광 곰팡이<\/b>를 보유한 모든 생존자의 오라를 <b>5초<\/b> 동안 드러낸다.","r":4,"c":"ka","o":"K41"},{"id":"Addon_K41_17","ko":"썩은 돼지","en":"Rotten Swine","d":"그녀가 깨어났을 때 혐오감을 느끼게 만든 역겨운 식사.<br><br><b>거머리샘<\/b>이 있는 발전기, 떨어진 판자, 또는 부서지기 쉬운 문을 타격할 때마다, 표식이 남는다.표식이 남은 물체에 <b>15%<\/b> 더 빠르게 기본 파괴를 수행하고, 수행 후 표식은 지워진다.한 번에 하나의 물체에만 표식을 남길 수 있다.","r":3,"c":"ka","o":"K41"},{"id":"Addon_K41_18","ko":"오페라 글라스","en":"Theater Binoculars","d":"수많은 비극을 지켜본 안경.<br><br><b>거머리<\/b>에 물리지 않은 생존자를 <b>창자 채찍<\/b>으로 타격하면 <b>24미터<\/b> 반경에 있는 다른 생존자들의 오라가 <b>5초<\/b> 동안 드러난다.","r":2,"c":"ka","o":"K41"},{"id":"Addon_K41_19","ko":"여왕의 홀","en":"Queen's Scepter","d":"피를 요구하는 복수심에 불타는 여왕의 무대 소품.<br><br>성공적으로 <b>창자 채찍<\/b> 타격을 수행하면, 생존자 근처에 <b>거머리샘<\/b>이 튀어나온다.","r":3,"c":"ka","o":"K41"},{"id":"Addon_K41_20","ko":"알 수 없는 묘약","en":"Mysterious Elixir","d":"안개 자체를 주형으로 만든 액체. 그녀가 마셨던 것과 비슷하지만, 약간의 변형이 있는 듯하다.<br><br><b>거머리 샘<\/b>으로 창문을 타격하면, 표식이 남는다.표식이 있는 창문을 뛰어넘을 때마다 창문은 <b>10초<\/b> 동안 차단되며, 표식은 지워진다.한 번에 하나의 창문에만 표식을 남길 수 있다.","r":3,"c":"ka","o":"K41"},{"id":"Addon_K42_01","ko":"잡역부 ID","en":"Orderly ID","d":"헨리 크릴은 다른 차원에 의해 변화되기 전의 모습을 하고 있다.<br><br>세계 파괴자 모드에서 벗어난 동안, 촉수 공격의 조준 범위가 <b>2미터<\/b> 증가한다.","r":0,"c":"ka","o":"K42"},{"id":"Addon_K42_02","ko":"구슬 미로","en":"Bead Maze","d":"포로가 된 아이들의 마음을 풍요롭게 하는 발달 장난감.<br><br>세계 파괴자 타이머가 두 번째 단계가 살아있는 생존자 한 명당 <b>2.5초<\/b> 증가한다.","r":0,"c":"ka","o":"K42"},{"id":"Addon_K42_03","ko":"산산조각난 손목 로켓","en":"Shattered Wrist Rocket","d":"한때 강력했던 새총이 이제는 잔해가 되었다.<br><br>언더게이트 공격을 수행할 때마다, 떨어진 판자와 발전기에 특수 파괴 행동이 수행되어 폭발한다.","r":1,"c":"ka","o":"K42"},{"id":"Addon_K42_04","ko":"스테인드글라스 벽화","en":"Stained Glass Mural","d":"한때 크릴 가족의 집 문에서 발견된 디자인 하나. 이제는 다른 차원의 문을 어둡게 한다.<br><br>뒤집힌 세계 횡단이 재사용 대기 시간을 가질 때, 판자나 부서지기 쉬운 문에 기본 파괴 공격을 수행하면 재사용 대기 시간이 <b>12초<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"K42"},{"id":"Addon_K42_05","ko":"부서진 카세트 플레이어","en":"Smashed Cassette Deck","d":"그들은 한때 헨리의 손아귀에서 벗어나기 위해 음악을 사용했다. 음악이 없으면, 맥도 못 축일 것이다.<br><br>희생제 시작 시, 모든 생존자가 비명을 지른다.<br><br>모든 생존자는 세계 파괴자 토큰을 한 개 보유한 채 시작한다. 세계 파괴자가 처음으로 활성화되면, 모든 생존자들은 그들의 세계 파괴자 토큰을 잃는다. <br><br><b>지도 전역에 괘종시계가 1개 적게<\/b> 나타난다.","r":1,"c":"ka","o":"K42"},{"id":"Addon_K42_06","ko":"피투성이 롤러스케이트","en":"Bloody Roller Skate","d":"일레븐이 행할 수 있는 분노의 기념비.<br><br>언더게이트 공격을 활성화하면, 탈출하자마자 살인마는 <b>1.5초<\/b> 동안 <b>20%의 이동 속도 증가<\/b> 효과를 가진다.<br><br>이동 속도 증가 효과는 살인마의 이동 속도를 증가시킨다.","r":1,"c":"ka","o":"K42"},{"id":"Addon_K42_07","ko":"처참한 슈퍼컴","en":"Gutted Supercom","d":"고장난 통신 장치가 가장 무서운 순간에 생명을 불어넣는다.<br><br>세계 파괴자 모드에서 벗어나면, 촉수 공격을 받은 생존자들은 <b>1.5초<\/b> 동안 오라를 드러낸다.","r":1,"c":"ka","o":"K42"},{"id":"Addon_K42_08","ko":"미드센츄리 라디오","en":"Mid-Century Radio","d":"학살이 시작될 때까지 고요함이 크릴의 식탁에 내려앉았다.<br><br>세계 파괴자 모드 동안, <b>32미터<\/b> 밖에서 생존자가 작동시킨 괘종시계의 오라가 드러난다.","r":0,"c":"ka","o":"K42"},{"id":"Addon_K42_09","ko":"시계 바늘","en":"Clock Hands","d":"크릴 가족의 괘종시계의 바늘, 헨리의 어둠의 힘에 의해 타락한 것.<br><br>괘종시계와 상호 작용하고 그 후 <b>12초<\/b> 동안 생존자는 <b>인지 불가능<\/b> 상태 이상에 걸린다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":1,"c":"ka","o":"K42"},{"id":"Addon_K42_10","ko":"뇌파 캡","en":"Electrode Cap","d":"뇌파 활동을 측정하는 데 사용된다. 실험실에서는 모든 것이 감시되고 기록된다.<br><br>세계 파괴자 모드의 두 번째 단계 시작 시(또는 생존자가 괘종시계와 상호 작용을 완료하면), 살인마로부터 <b>26미터<\/b> 떨어진 곳에 있는 생존자의 오라가 <b>6초<\/b> 동안 드러난다.","r":2,"c":"ka","o":"K42"},{"id":"Addon_K42_11","ko":"위조된 사망증명서","en":"Forged Death Certificate","d":"사실 살아있었던 강한 사람의 죽음을 증명하는 데 사용되는 종이 한 장.<br><br>촉수 공격을 통해 성공적으로 세계 파괴자 토큰을 생존자에게 둘 때마다, 다음 세계 파괴자 모드가 활성화될 때까지 당신은 <b>감지 불가능 효과<\/b>를 얻는다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 숨긴다.","r":2,"c":"ka","o":"K42"},{"id":"Addon_K42_12","ko":"토끼 유골","en":"Rabbit Remains","d":"헨리는 가족을 학살하기 전에 작은 규모로 살인 행위를 시작했다. 그는 토끼를 죽이고 토끼의 시체를 마을 곳곳에 흩뿌렸다.<br><br>언더게이트 공격 범위에 서 있거나 범위에 들어가고 그 후 <b>10초<\/b> 동안 생존자는 <b>탈진<\/b> 상태 이상에 걸린다.<br><br>뒤집힌 세계 횡단의 재사용 대기 시간이 <b>5초<\/b> 증가한다.<br><br>생존자는 탈진으로 특정 기술을 발동할 수 없다.","r":3,"c":"ka","o":"K42"},{"id":"Addon_K42_13","ko":"목 덩굴","en":"Neck Tendril","d":"맥스가 정신 세계에서 빠져나가며 목의 덩굴이 찢겨 나가자, 그는 분노했다.<br><br>세계 파괴자 모드 동안, 촉수 공격에 생존자가 타격을 받으면 <b>70초<\/b> 동안 <b>출혈<\/b> 및 <b>깊은 상흔<\/b> 상태 이상에 빠진다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상 당한 생존자가 더 많은 핏자국을 남기게 한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"K42"},{"id":"Addon_K42_14","ko":"빅터의 면도날","en":"Victor's Razor Blade","d":"슬픔 속에서 헨리의 아버지는 숨겨진 칼날을 사용하여 자신의 눈을 도려냈다.<br><br>세계 파괴자 모드가 종료되면, 부상을 입은 생존자는 다음 <b>20초<\/b> 동안 <b>치료 불능<\/b> 상태 이상에 걸린다.<br><br>치료 불능 상태의 생존자는 치료를 할 수 없다.","r":2,"c":"ka","o":"K42"},{"id":"Addon_K42_15","ko":"부서진 스케이트보드","en":"Broken Skateboard","d":"멋지게 돌아다닐 수 있는 방법이었지만, 분노한 형제에 의해 부서져 통제의 수단이 되었다.<br><br>세계 파괴자 모드가 시작되면, 당신은 기본 창문 뛰어넘기 행동을 <b>30%<\/b> 더 빠르게 수행하고, 32미터 내에 있는 판자와 창문의 오라가 다음 <b>65초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K42"},{"id":"Addon_K42_16","ko":"블랙 위도우 거미","en":"Black Widow Spider","d":"더 이상 단순한 환각이 아닌 무서운 거미.<br><br>세계 파괴자 모드에서 뒤집힌 세계로 들어가면 <b>36미터<\/b> 밖에서 가장 멀리 있는 생존자의 위치가 <b>3초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K42"},{"id":"Addon_K42_17","ko":"피자 고글","en":"Pizza Goggles","d":"일레븐이 감각 차단 탱크에 들어갈 때 사용되며, 그것들은 사용자의 산만함을 없애고 마음을 집중하게 한다.<br><br>언더게이트 공격의 효과 범위가 <b>90%<\/b> 감소하고, 효과의 재사용 대기 시간이 <b>25초<\/b> 짧아진다.<br><br>언더게이트 공격 수행 후, 후딜레이 재사용 대기 시간이 <b>80%<\/b> 감소한다.","r":2,"c":"ka","o":"K42"},{"id":"Addon_K42_18","ko":"전기 충격 목줄","en":"Electroshock Collar","d":"시설의 수감자들을 훈련하고 처벌하는 잔인할 정도로 효율적인 방법.<br><br>뒤집힌 세계에서 나올 때, <b>32미터<\/b> 범위 내 모든 창문이 <b>12초<\/b> 동안 차단된다.","r":3,"c":"ka","o":"K42"},{"id":"Addon_K42_19","ko":"체스말","en":"Chess Piece","d":"시설에 있는 동안 몇 안 되는 오락 형태 중 하나로, 학생들이 논리와 전술을 배우는 데 도움이 되었다.<br><br>촉수 공격에는 두 가지 내구도가 있다. 해당 공격 범위는 <b>40%<\/b> 감소된다.","r":4,"c":"ka","o":"K42"},{"id":"Addon_K42_20","ko":"핏빛 소테리아 칩","en":"Iridescent Soteria Chip","d":"한때 그의 능력을 제한했던 칩이 이제는 더욱 강력한 힘의 원천이 되었다.<br><br>세계 파괴자가 활성화되면, 살인마는 <b>감지 불가능<\/b>을 얻고, 세계 파괴자 토큰 1개 이상을 보유한 생존자는 살인마로부터 <b>12미터<\/b>까지 다가오면, 생존자의 오라가 드러난다.<br><br>해당 효과는 살인마가 촉수 공격을 수행하거나, 뒤집힌 세계로 들어가거나, 세계 파괴자가 종료될 때까지 유지된다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 숨긴다.","r":4,"c":"ka","o":"K42"},{"id":"Addon_K43_01","ko":"정원용 발톱","en":"Garden Claw","d":"잡초를 뽑는 데도 좋고, 사람의 살점을 파헤치는 데도 좋다.<br><br><b>깜짝 폴짝<\/b> 후 <b>살인마의 본능<\/b> 지속 시간이 <b>2초<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K43"},{"id":"Addon_K43_02","ko":"휘어진 바퀴","en":"Bent Wheel","d":"치명적인 타격 후 피해자의 휠체어에 남은 것은 그것뿐이었다.<br><br><b>깜짝 폴짝<\/b>을 발동할 수 있는 범위가 <b>4미터<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K43"},{"id":"Addon_K43_03","ko":"뜨개질바늘","en":"Knitting Needle","d":"이게 어떤 일들을, 그리고 어떤 사람들을 겪었는지 믿기 어려울 것이다.<br><br>관통상을 입은 생존자가 스스로 <b>못<\/b>을 빼는 데 걸리는 시간이 <b>20%<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"K43"},{"id":"Addon_K43_04","ko":"잡역부의 신발","en":"Orderly's Shoe","d":"칼이 그녀의 배에 꽂히는 순간, 그녀는 경련하는 발을 붙잡았다.<br><br><b>깜짝 폴짝<\/b> 후 <b>이동 속도 증가<\/b> 효과의 지속 시간이 <b>5초<\/b> <b>증가한다<\/b>.<br><br>이동 속도 증가 효과는 살인마의 이동 속도를 증가시킨다.","r":0,"c":"ka","o":"K43"},{"id":"Addon_K43_05","ko":"침낭","en":"Sleeping Bag","d":"살인마로부터 숨기에는 정말 최악의 장소다.<br><br><b>편재한 악<\/b> 모드에서 <b>갈고리 못<\/b>을 집으면, 갈고리로부터 <b>8미터<\/b> 내에 있는 생존자들의 위치를 볼 수 있다.","r":1,"c":"ka","o":"K43"},{"id":"Addon_K43_06","ko":"피투성이 미소","en":"Bloody Smile","d":"그는 얼굴이 나무에 부딪혀 심하게 다친 후로 기분이 좋지 않았다.<br><br><b>깜짝 폴짝<\/b>과 <b>편재한 악<\/b>의 생존자 탐지 범위가 <b>4미터<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K43"},{"id":"Addon_K43_07","ko":"유독성 폐기물","en":"Toxic Waste","d":"이 독이 든 액체를 마시면, 그 누구도 살아남을 수 없다.<br><br><b>깜짝 폴짝<\/b> 후, 갈고리 또는 <b>고철 더미<\/b>로부터 <b>8미터<\/b> 내에 생존자는 <b>13초<\/b> 동안 <b>인지 불가능<\/b>에 걸린다.<br><br>인지 불가능은 생존자가 듣거나 살인마의 공포 범위에 의해 영향을 받지 않도록 한다.","r":1,"c":"ka","o":"K43"},{"id":"Addon_K43_08","ko":"파티 소음 발생기","en":"Party Noisemaker","d":"파티용 도구가 여성의 눈알을 찢고 뇌를 파헤쳤다.<br><br><b>깜짝 폴짝<\/b>으로 판자 또는 부서지기 쉬운 문을 부수면, <b>6초<\/b> 동안 <b>32미터<\/b> 범위 밖에 있는 생존자의 오라가 드러난다.","r":1,"c":"ka","o":"K43"},{"id":"Addon_K43_09","ko":"검시관의 커피","en":"Coroner's Coffee","d":"마시다 만 커피 한 잔.<br><br><b>못<\/b>에 찔려 밀려나는 생존자의 거리가 <b>25%<\/b> <b>증가한다<\/b>.<br><br><b>못<\/b>으로 생존자에게 부상을 입힌 후, 해당 생존자가 환경과 충돌하지 않는 경우, <b>3초<\/b> 동안 <b>13%<\/b>의 <b>이동 속도 증가<\/b> 효과를 얻는다.<br><br>이동 속도 증가 효과는 살인마의 이동 속도를 증가시킨다.","r":1,"c":"ka","o":"K43"},{"id":"Addon_K43_10","ko":"사우나 스톤","en":"Sauna Rock","d":"무게감이 적당해서 갈비뼈를 부수는 데 사용할 수 있을 것 같다.<br><br><b>깜짝 폴짝<\/b> 후, <b>살인마의 본능<\/b> 탐지 범위 내 모든 생존자들은 <b>13초<\/b> 동안 <b>탈진<\/b>에 걸린다.<br><br>탈진 상태의 생존자는 탈진 기술을 활성화할 수 없다.","r":2,"c":"ka","o":"K43"},{"id":"Addon_K43_11","ko":"거울 조각","en":"Mirror Shards","d":"단순한 불운 이상의 것을 안겨주는 무기.<br><br><b>관통상<\/b>을 당한 생존자는 <b>못<\/b>을 뽑아낸 후, <b>30초<\/b> 동안 <b>치료 불능<\/b>에 걸린다.<br><br>치료 불능 상태의 생존자는 치료될 수 없다.","r":2,"c":"ka","o":"K43"},{"id":"Addon_K43_12","ko":"각인된 알루미늄","en":"Imprinted Aluminum","d":"전위 예술 작품이거나, 아니면 얼굴이 그 위에 짓눌린 여성의 공포에 질린 흔적일 것이다.<br><br>건강한 상태의 생존자를 <b>못<\/b>으로 부상을 입히면, <b>70초<\/b> 동안 <b>깊은 상흔<\/b> 및 <b>출혈<\/b> 상태 이상에 걸린다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 완전히 치료될 때까지 계속 지속된다.<br><br>출혈은 치료 중이 아닐 때 치료 진행도가 줄어들게 만들며, 부상을 당했을 때는 생존자가 핏자국을 남길 확률이 증가한다. 효과는 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"K43"},{"id":"Addon_K43_13","ko":"못 두 개","en":"Two Nails","d":"시체의 손목을 제자리에 고정하는 확실한 방법.<br><br>생존자가 <b>못<\/b>에서 <b>1미터<\/b> 내로 다가가면 못의 오라가 <b>6초<\/b> 동안 드러난다.","r":2,"c":"ka","o":"K43"},{"id":"Addon_K43_14","ko":"눈꼽","en":"Eye Goop","d":"작살이 눈에 박히면 어떻게 될까?<br><br><b>갈고리 못<\/b>을 집으면, <b>13초<\/b> 동안 <b>감지 불가능<\/b>에 걸린다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":2,"c":"ka","o":"K43"},{"id":"Addon_K43_15","ko":"피투성이 잡지","en":"Bloody Magazine","d":"흩뿌려진 핏자국은 잔혹한 학살의 전말을 말해주고 있었다.<br><br><b>갈고리 못<\/b>이 빗나가면, 충격 지점으로부터 <b>8미터<\/b> 내에 모든 생존자들은 <b>3초<\/b> 동안 비명을 지르며, 자신의 오라를 드러낸다.","r":3,"c":"ka","o":"K43"},{"id":"Addon_K43_16","ko":"타버린 퓨즈","en":"Burnt Fuse","d":"순간적으로 솟구친 전기는 엄청난 충격을 주었다. 남자의 살점은 새까맣게 타버렸고, 고기 타는 냄새가 진동했다.<br><br>생존자가 <b>관통상<\/b>을 입고, <b>못<\/b>을 제거한 다음 <b>5초<\/b> 동안 해당 생존자와 <b>13미터<\/b> 내에 모든 생존자에게 <b>출구<\/b>가 차단된다.","r":3,"c":"ka","o":"K43"},{"id":"Addon_K43_17","ko":"잃어버린 코르크 마개뽑이","en":"Missing Corkscrew","d":"정작 필요할 때면 항상 없는 것 같다.<br><br><b>관통상<\/b>을 입은 생존자들은 <b>못<\/b>이 제거될 때까지 <b>32미터<\/b>의 공포 범위를 발산한다.<br><br>생존자가 <b>관통상<\/b>을 입은 시점부터 <b>못<\/b>을 제거한 후 <b>13초<\/b> 동안 <b>감지 불가능<\/b>에 걸린다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":3,"c":"ka","o":"K43"},{"id":"Addon_K43_18","ko":"보안관의 배지","en":"Deputy's Badge","d":"사건을 조사할 가치가 없다는 것을 깨달은 경찰관의 배지.<br><br>While in <b>편재한 악<\/b> 동안, 발전기로부터 <b>4미터<\/b> 이내로 접근하면, 발전기가 폭발하여 진행도 <b>5%<\/b>를 잃고 퇴복하기 시작한다. 만약 생존자가 발전기를 수리 중일 경우에는 폭발하지 않지만, 특수 스킬 체크를 수행해야 한다.","r":3,"c":"ka","o":"K43"},{"id":"Addon_K43_19","ko":"더러운 돈","en":"Dirty Money","d":"아무리 많은 돈으로도 그로부터 도망칠 수 없다.<br><br>발전기 수리가 완료될 때마다 <b>토큰 2개<\/b>를 획득한다.<br><br>창문을 뛰어넘거나 판자나 부서지기 쉬운 문을 부술 때, <b>못<\/b>을 쥐고 있지 않다면, 즉시 토큰은 소비되고 <b>못<\/b>을 획득한다.","r":4,"c":"ka","o":"K43"},{"id":"Addon_K43_20","ko":"핏빛 보트 모터","en":"Iridescent Boat Motor","d":"칼날은 마치 단단한 무언가를 자른 것처럼 흠집이 나고 금이 가 있다.<br><br><b>편재한 악<\/b> 모드에서 창문을 통과하면, <b>13초<\/b> 동안 표식이 남는다. <b>깜짝 폴짝<\/b>을 수행하면, 표식이 남은 모든 창문은 <b>13초<\/b> 동안 차단된다.","r":4,"c":"ka","o":"K43"},{"id":"Addon_K44_01","ko":"콘래드의 건틀릿","en":"Koenrad's Gauntlet","d":"“어둠이 그의 양떼를 삼키려 할 때, 그는 그들을 빛으로 인도했다.” (코엔라드의 증언, 1장)<br><br>신성한 빛을 시전하기 전에 제어할 수 있는 최대 시간이 <b>25%<\/b> 증가한다.<br><br>제어한 신성한 빛의 최대 속도가 <b>10%<\/b> 감소한다.","r":0,"c":"ka","o":"K44"},{"id":"Addon_K44_02","ko":"이단자의 표식","en":"Heretic's Mark","d":"“그 경로에서 벗어난 자들은 일단 표식을 받으면 결코 배척당하는 것을 피할 수 없을 것입니다.” (III 이단론, 3장)<br><br>시전한 신성한 빛이 <b>1미터<\/b> 이내의 생존자를 맞추지 않고 지나갈 경우, <b>2초<\/b> 동안 살인마의 본능으로 해당 생존자의 위치를 드러난다.","r":0,"c":"ka","o":"K44"},{"id":"Addon_K44_03","ko":"성스러운 날개 아이콘","en":"Holy Winged Icon","d":"“그것을 가슴에 꼭 안고 기도하십시오. 그렇지 않으면 당신의 마음이 그것에 불충실해 보일 것입니다.” (II 이단론, 14장)<br><br>신성한 빛을 제어하는 동안, 살인마 능력 버튼을 눌러 자신에게 다시 시전할 수 있는 능력을 얻는다.<br><br>이 방법으로 시전하면,치명적이기까지 최소 지연 시간은 <b>0.5초<\/b>로 설정된다.최대 속도가 <b>10%<\/b> 증가한다.이단자에게만 피해를 입힌다.","r":2,"c":"ka","o":"K44"},{"id":"Addon_K44_04","ko":"기도용 무릎의자","en":"Prayer Kneeler","d":"“기도의 고통을 감수하십시오. 불신자들의 고통은 훨씬 더 심하기 때문입니다.” (II 이단론, 8장)<br><br>장애물에 의해 느려진 신성한 빛을 제어할 때, 속도는 더 느려져 최대 <b>99%<\/b> 감소한다.시전 시, 최대 속도에 <b>25%<\/b> 더 빠르게 도달하며, 최대 속도가 <b>10%<\/b> 증가한다.","r":0,"c":"ka","o":"K44"},{"id":"Addon_K44_05","ko":"전기 횃불","en":"Electric Torch","d":"“신도들은 밤에 대규모로 나가 어둠 속에 숨어 있는 이단자들을 찾아낼 것이다.”(코엔라드의 증언, 40장)<br><br>신성한 빛의 범위가 <b>10%<\/b> 감소한다.<br><br>제어한 신성한 빛의 최대 속도가 <b>25%<\/b> 증가한다.<br><br>신성한 빛을 제어하는 동안 당신은 <b>10%<\/b> 더 빠르게 이동한다.","r":2,"c":"ka","o":"K44"},{"id":"Addon_K44_06","ko":"불멸의 불꽃","en":"Undying Flame","d":"“덴드 마을은 마지막 순간에 후회했지만, 그 잔해는 오늘날까지도 경고처럼 불타고 있습니다.” (II 야만인, 4장)<br><br>열정 모드 동안,신성한 빛을 비추는 시전의 최대 지속 시간이 <b>200%<\/b> 증가한다.신성한 빛의 범위가 <b>50%<\/b> 감소한다.생존자가 관찰할 수 있는 신성한 빛의 오라의 범위가 <b>200%<\/b> 확장한다.","r":1,"c":"ka","o":"K44"},{"id":"Addon_K44_07","ko":"오로라의 원격수용기","en":"Aurora's Telereceptor","d":"“이단자들이 만든 비참한 도구로 심연을 들여다보는 자는 아무도 없어야 합니다.” (III 이단론, 12장)<br><br>생존자가 이단에 빠질 때마다, 그들의 오라가 <b>4초<\/b> 동안 드러난다. 추가적으로, 당신의 오라는 그들에게 <b>4초<\/b> 동안 드러난다.","r":1,"c":"ka","o":"K44"},{"id":"Addon_K44_08","ko":"자석 수갑","en":"Magnetized Manacles","d":"“숨지 않는 자들은 별빛조차 닿지 못하는 깊은 땅속에 갇히게 될 것이다.” (게르하르트의 환상, 6장)<br><br>갈고리 상태가 가장 적은 생존자를 망명할 때마다 토큰을 1개 획득하며, 최대 <b>5<\/b>개를 획득한다.<br><br>열정 상태가 될 때마다, 토큰 개수당 <b>10%<\/b> 더 길게 당신의 상태가 유지된다.","r":1,"c":"ka","o":"K44"},{"id":"Addon_K44_09","ko":"종교재판단","en":"Order of Inquisition","d":"“그분의 영광을 믿는 모든 사람은 이단자를 색출할 책임을 지고 있다. 네 이웃조차도 믿지 말라.” (코엔라드의 증언, 16장)<br><br>신성한 빛을 시전할 때마다, 범위는 <b>50%<\/b> 작게 시작되지만, 그 후 <b>1초<\/b>안에 <b>100%<\/b>가 될 때까지 커진다.","r":2,"c":"ka","o":"K44"},{"id":"Addon_K44_10","ko":"헌신자의 눈가리개","en":"Blindfold of the Devoted","d":"“게르하르트의 길을 따르는 자들은 그의 예언을 위해 바친 희생을 기억하기 위해 눈가리개를 써야 할 것입니다.” (III 이단론, 61장)<br><br>갈고리 상태가 가장 낮은 생존자를 망명할 때마다, <b>32미터<\/b> 범위 밖에 있는 갈고리 상태가 가장 낮은 다른 모든 생존자들의 오라가 <b>5초<\/b> 동안 드러난다.","r":2,"c":"ka","o":"K44"},{"id":"Addon_K44_11","ko":"초고열 유리","en":"Superheated Glass","d":"“아레드 행성은 뉘우치지 않았다. 그들의 지도자가 망명된 후, 그 신성한 빛은 행성 표면을 유리처럼 변하게 했다.” (II 야만인, 12장)<br><br>열정 상태가 <b>50%<\/b> 짧게 유지된다.<br><br>열정 상태 동안, 신성한 빛을 시전하면, 빛이 통과하는 모든 부서지기 쉬운 문과 떨어진 판자가 부서진다.","r":2,"c":"ka","o":"K44"},{"id":"Addon_K44_12","ko":"복종자의 표식","en":"Mark of the Adherent","d":"“자신의 신앙을 자랑스럽게, 그리고 영원히 간직하십시오. 그것이 항상 우리 곁에 있음을 다른 사람들에게 상기시켜 주는 것이 되도록 하십시오.” (II 이단론, 1장)<br><br>열정 상태가 아닐 때, 신성한 빛의 범위가 <b>10%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"K44"},{"id":"Addon_K44_13","ko":"고해자의 전쟁 나팔","en":"Confessor's War Horn","d":"“나팔 소리는 불신자들의 마음에 두려움을 심어주고 신자들의 의지를 결집시킬 것이다.” (코엔라드의 증언, 33장)<br><br>이단에 빠진 생존자들은 추가 <b>10초<\/b> 동안 탈진에 걸린다.","r":1,"c":"ka","o":"K44"},{"id":"Addon_K44_14","ko":"수색자의 해골","en":"Searcher's Skull","d":"“이단자들의 해골은 깨끗이 씻어 빛에서 벗어나려는 자들에게 경고가 되도록 전시해야 한다.” (코엔라드의 증언, 33장)<br><br>생존자가 당신을 실명시킬 때마다,만약 그들이 이단자라면, 그들은 스스로를 실명시킨다.그런 다음, 그들은 이단에 빠진다.","r":0,"c":"ka","o":"K44"},{"id":"Addon_K44_15","ko":"이단자의 사슬","en":"Chains of the Heretic","d":"“가장 목소리가 크고 극단적인 배교자들은 본보기로 삼아야 한다. 그들은 사슬에 묶여 거리로 끌려다녀야 한다.” (코엔라드의 증언, 41장)<br><br>열정 상태 동안,신성한 빛이 치명적인 피해를 입히기까지의 최소 지연 시간은 <b>0.5초<\/b>로 설정되어 있다.제어한 신성한 빛의 최대 속도가 <b>100%<\/b> 증가한다.시전한 신성한 빛의 최대 속도가 <b>50%<\/b> 증가한다.시전한 신성한 빛은 항상 당신을 향해 비춰진다.","r":3,"c":"ka","o":"K44"},{"id":"Addon_K44_16","ko":"즉석 폭발 장치","en":"Improvised Detonators","d":"“겁쟁이처럼 그들은 밤에 폭탄을 터뜨린다. 낮의 빛이 그들의 검게 물든 영혼을 비추는 것을 두려워하기 때문이다.” (코엔라드의 증언, 35장)<br><br>갈고리 상태가 가장 적은 생존자를 망명할 때, 죽은 생존자가 없다면 토큰을 1개 획득한다.<br><br>그런 다음, 토큰 <b>4<\/b>개 이상을 보유하면,가장 높은 진행도를 가진 발전기는 폭발하며, 총 진행도의 <b>20%<\/b>가 즉시 퇴보한다.","r":3,"c":"ka","o":"K44"},{"id":"Addon_K44_17","ko":"게르하르트의 눈","en":"Eyes of Gerhardt","d":"“그는 미래에 대한 찬란한 환상을 본 후 황홀경에 빠져 자신의 눈알을 뽑아버렸다.” (II 야만인, 60장)<br><br>이단자가 발전기 수리를 완료하거나 출구를 열면, 모든 이단자의 오라가 당신에게 <b>5초<\/b> 동안 드러난다.","r":3,"c":"ka","o":"K44"},{"id":"Addon_K44_18","ko":"흑요석 깃털","en":"Obsidian Feather","d":"“일부 마을 사람들은 자신들의 신앙이 자신들을 보호해 줄 것이라는 희망을 품고 바위에서 깃털 모양을 새긴다.” (게르하르트의 환상, 3장)<br><br>이제 더 이상 수동적으로 제어한 신성한 빛을 시전하거나 취소할 수 없고, 그리고 타임아웃될 경우에도 자동으로 시전된다.<br><br>당신은 신성한 빛을 제어하는 동안 <b>100%<\/b> 더 빠르게 이동하고, 또한 이를 제어하는 데 소요될 수 있는 최대 시간이 <b>25%<\/b> <b>감소한다<\/b>.<br><br>당신은 신성한 빛을 시전하는 동안 <b>10%<\/b> 더 느리게 회복하고 <b>30%<\/b> 더 느리게 이동한다.<br><br>해당 애드온을 <b>성스러운 날개 아이콘<\/b>의 효과가 무효화된다.","r":4,"c":"ka","o":"K44"},{"id":"Addon_K44_19","ko":"파괴자의 왕관","en":"Crown of the Destroyer","d":"“창조주들은 이것을 보고 그것에 왕관을 씌워주며 말했다. 이를 사용하여 어둠에 빛을 가져오라.” (I 야만인, 6장)<br><br>생존자가 다른 생존자를 망명지에서 해방할 때마다, <b>20초<\/b> 동안,당신의 공포 범위가 <b>75%<\/b> 감소한다.당신의 공포 범위는 모든 심판의 신전에 복제된다.감지 불가능이 된다.","r":3,"c":"ka","o":"K44"},{"id":"Addon_K44_20","ko":"창조자의 거울","en":"Mirror of the Creators","d":"“그들이 거울에게 이르되 이 거울을 가져다가 그들의 잘못을 깨닫게 하여라.” (I 야만인, 6장)<br><br>시전된 신성한 빛은 이제 원래 통과했을 첫 번째 <b>2<\/b>개의 장애물에 반사된다.<br><br>반사될 때, 다시 시전되기 전에 <b>0.5초<\/b> 동안 일시 정지된다.","r":4,"c":"ka","o":"K44"},{"id":"Addon_Kanobo_AkitosCrutch","ko":"아키토의 목발","en":"Akito's Crutch","d":"카잔의 아들이 나무에서 떨어진 후 사용한 목발이다. 아키토의 친구와 그녀의 가족들은 그의 부상 때문에 벌을 받았다.<br><br><b>악마의 돌진<\/b> 이동 속도가 <b>13%<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_BlackenedToenail","ko":"검게 변한 발톱","en":"Blackened Toenail","d":"사원을 향한 카잔의 수많은 겨울 여정 중에 떨어진 발톱. 그의 순례에도 불구하고 다리는 결코 회복되지 않았다.<br><br>핏빛 구체를 흡수하면 이동 속도가 <b>0.4 m/s<\/b> <b>증가한다<\/b>.","r":0,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_BloodySash","ko":"피 묻은 띠","en":"Bloody Sash","d":"카잔이라 불리는 가짜 귀족 소년의 피 묻은 띠. 카잔의 아버지와의 싸움을 숨기고 비밀리에 종종 띠를 드러낸다.<br><br>핏빛 구체를 흡수하면 이동 속도가 <b>0.7 m/s<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_ChildsWoodenSword","ko":"어린이의 목검","en":"Child's Wooden Sword","d":"아키토의 연습용 목검이며, 아이는 부상 후 별로 사용하지 않았다.<br><br>핏빛 구체 오라 감지 거리를 <b>3미터<\/b> <b>증가시킨다<\/b>.","r":1,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_ChippedSaihai","ko":"닳아버린 지휘채","en":"Chipped Saihai","d":"렌지로의 지휘채이며, 카잔이 출발하자마자 도난 당했다.<br><br><b>핏빛 분노<\/b>의 지속 시간을 <b>6초 증가시킨다<\/b>.","r":1,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_CrackedSakazuki","ko":"깨진 술잔","en":"Cracked Sakazuki","d":"카잔의 결혼식에 사용된 술잔. 깨지기 전까지 밤새도록 만드는 일은 없었다.<br><br><b>핏빛 분노<\/b>의 비활성화 시간을 <b>0.5초 감소시킨다<\/b>.<b>핏빛 분노<\/b>의 재사용 대기 시간을 <b>0.5초 감소시킨다<\/b>.","r":0,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_InkLion","ko":"사자 수묵화","en":"Ink Lion","d":"한때 야마오카의 저택에 걸려 있던 사자 수묵화. 쥐 떼가 잡아먹는 이야기를 묘사하고 있다.<br><br><b>핏빛 분노<\/b>의 활성화 시간을 <b>0.5초 감소시킨다<\/b>.<b>핏빛 분노<\/b>의 재사용 대기 시간이 <b>0.5초<\/b> .생존자를 쓰러뜨렸을 때 <b>핏빛 분노<\/b>의 소모량을 <b>2초 감소시킨다<\/b>.","r":1,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_KanaianzenTalisman","ko":"가정 보호 부적","en":"Kanai-anzen Talisman","d":"카잔이 태어났을 때 주어진 장신구이며, 위험으로부터 그의 가족을 지켜준다고 전해진다.<b>악마의 돌진<\/b> 이동 속도가 <b>8%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_LionFang","ko":"사자의 이빨","en":"Lion Fang","d":"이국의 상인으로부터 팔린 이빨. 고귀함과 권력을 상징한다.<b>핏빛 분노<\/b>의 지속 속도가 <b>10초 증가한다<\/b>.","r":3,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_PaperLantern","ko":"종이 랜턴","en":"Paper Lantern","d":"분노가 그를 완전히 감싸기 전, 아마도 순수하던 시절의 메멘토일 것이다.<br><br>핏빛 구체의 흡수 속도를 <b>4 m/s<\/b> <b>증가시킨다<\/b>.","r":0,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_PolishedMaedate","ko":"빛나는 뿔 장식","en":"Polished Maedate","d":"악마와 비교한 후 카잔이 자신의 헬멧으로부터 떼어낸 뿔 모양의 장식.<br><br><b>야마오카의 분노<\/b>의 패시브 충전율이 <b>50% 증가한다<\/b>.","r":1,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_RenjirosBloodyGlove","ko":"렌지로의 피 묻은 장갑","en":"Renjiro’s Bloody Glove","d":"자신의 아들로부터 공격을 당한 후 흉골을 잡았던 렌지로의 장갑.<br><br>모든 생존자는 살인마와 같은 거리에서 핏빛 구체를 볼 수 있게 된다.생존자가 핏빛 구체에 접촉하면 그들의 오라가 <b>2초<\/b> 동안 드러난다.","r":4,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_RottingRope","ko":"썩은 밧줄","en":"Rotting Rope","d":"밧줄이 더 강했더라면 카잔을 놓치지 않았을 테지만 그는 결국 탈출하여 그를 납치한 자들을 살해했다.<br><br>핏빛 구체 오라 감지 거리를 <b>2미터<\/b> <b>증가시킨다<\/b>.","r":0,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_ScalpedTopknot","ko":"도려낸 상투","en":"Scalped Topknot","d":"카잔의 명예를 품은 사무라이의 상투이다. 뿌리에는 얇은 핏빛 두피가 붙어 있다.<br><br><b>악마의 돌진<\/b>을 활성화하는 데 걸리는 시간이 <b>0.5초<\/b> by <b>감소한다<\/b>.","r":2,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_ShatteredWakizashi","ko":"조각난 요도","en":"Shattered Wakizashi","d":"카잔의 분노에 의해 파괴된 옛 조상의 요도.<b>야마오카의 분노<\/b>의 패시브 충전율이 <b>100% 증가한다<\/b>.","r":2,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_SplinteredHull","ko":"조각난 선체","en":"Splintered Hull","d":"렌지로 야마오카가 탔던 배의 파편. 모든 역경 속에서도 전설의 사무라이는 버젓이 살아남았다.<br><br>생존자가 핏빛 구체를 떨어트리는 빈도를 <b>33%<\/b> <b>증가시킨다<\/b>.생존자가 창틀을 넘을 때나 판자를 던지거나 캐비닛에서 나갈 때 또는 웅크리거나 스킬 체크에 실패하면 핏빛 구체를 더 떨어뜨린다.","r":3,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_TearSoakedTenugui","ko":"눈물에 젖은 손수건","en":"Tear Soaked Tenugui","d":"카잔이 사무라이를 정화하기 위해 순례를 떠날 때 그의 어머니가 눈물을 훔쳤던 손수건.<br><br>생존자를 쓰러뜨렸을 때 <b>핏빛 분노<\/b>의 소모량을 <b>4초 감소시킨다<\/b>.","r":3,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_WoodenOniMask","ko":"나무 악귀 가면","en":"Wooden Oni Mask","d":"어린 카잔이 입춘 전날에 구매했던 마스크. 혐오스러운 이빨이 악몽으로 나타나기 시작했다.<br><br>생존자가 핏빛 구체를 떨어뜨리는 빈도를 <b>14%<\/b> <b>증가시킨다<\/b>.생존자가 창틀을 넘을 때나 판자를 던지거나 캐비닛에서 나갈 때 또는 웅크리거나 스킬 체크에 실패하면 핏빛 구체를 더 떨어뜨린다.","r":2,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_YamaokaFamilyCrest","ko":"핏빛 가문 문장","en":"Iridescent Family Crest","d":"소유자가 야마오카 일가라는 것을 증명하는 문장.<br><br><b>핏빛 분노<\/b> 동안 공격에 실패하면 땅을 박살 내고 충격파를 만든다. <b>24미터<\/b> 이내 모든 생존자는 비명을 지르고 <b>4초<\/b> 동안 생존자의 현재 위치를 드러낸다.","r":4,"c":"ka","o":"Oni"},{"id":"Addon_Kanobo_YamaokaSashimono","ko":"야먀오카의 깃발","en":"Yamaoka Sashimono","d":"야마오카 일가의 깃발. 카잔은 깃발로부터 강력한 자부심을 느꼈다.<br><br><b>핏빛 분노<\/b>의 지속 시간을 <b>8초 증가시킨다<\/b>.","r":2,"c":"ka","o":"Oni"},{"id":"Addon_Key_001","ko":"우정 부적","en":"Friendship Charm","d":"새겨진 이니셜이 누군가의 엄지손가락에 의해 닳아 없어졌다.<br><br>열쇠의 내구도가 <b>1<\/b> <b>증가한다<\/b>.","r":0,"c":"sa","it":"key"},{"id":"Addon_Key_002","ko":"묵주","en":"Prayer Beads","d":"다양한 크기의 어두운색의 구슬로 꿰어진 의식용 도구. 열쇠에 부착할 수 있다.<br><br>열쇠의 사용 시간을 <b>15초<\/b> 늘려 준다.","r":1,"c":"sa","it":"key"},{"id":"Addon_Key_003","ko":"날카로운 휘파람","en":"Shrill Whistle","d":"아주 높은 고음의 비명은 모든 것에 긴박감을 준다.<br><br>열쇠를 보내는 데 걸리는 시간이 <b>35%<\/b> <b>감소한다<\/b>.","r":1,"c":"sa","it":"key"},{"id":"Addon_Key_004","ko":"황금 토큰","en":"Gold Token","d":"밋밋하게 생긴 금화. 양쪽면 모두 특별한 글귀가 써있지 않고 매끄럽다. 열쇠에 부착하면 특별한 오라를 느낄 수 있다.<br><br><b>48미터<\/b> 내에 있는 <b>생존자의 오라<\/b>를 보여 준다.","r":2,"c":"sa","it":"key"},{"id":"Addon_Key_005","ko":"핏빛 호박","en":"Blood Amber","d":"피의 색을 닮아 붉고, 표면에 마치 혈관 같은 검은 줄무늬가 있다. 만지면 따뜻함이 느껴지는 호박옥.이 열쇠를 사용하면 살인마와 당신의 오라가 서로에게 드러난다.오라 감지 시간이 <b>6초<\/b> 감소한다.<b>내구도<\/b>가 <b>2<\/b> 감소한다.","r":4,"c":"sa","it":"key"},{"id":"Addon_Key_006","ko":"하얀 빛깔 유리","en":"Milky Glass","d":"미세하게 떨리는 불투명한 유리조각. 열쇠로 검은 자물쇠를 열 때, 유리 토큰은 열쇠가 부러지지 않도록 하여 안개를 유리 속으로 빨아들인다.<br><br>검은 자물쇠를 열 경우, 열쇠를 잃는 대신 이 애드온을 잃는다.","r":3,"c":"sa","it":"key"},{"id":"Addon_Key_007","ko":"열쇠고리","en":"Weaved Ring","d":"특이할 정도로 푸르스름하고 어두운 광택을 지녔지만 모양은 평범한 열쇠고리. 열쇠에 부착하면, 사용자는 어떤 최악의 상황에서도 열쇠를 잃어버리지 않는다.<br><br>당신이 사망했을 때, 열쇠를 잃는 대신 이 애드온을 잃는다.","r":3,"c":"sa","it":"key"},{"id":"Addon_Key_008","ko":"몰로 장식한 싸구려 보석","en":"Braided Bauble","d":"얇지만 튼튼한 네 개의 끈이 서로 완벽하게 감겨 있다.<br><br>열쇠로 인해 오라가 드러나는 시간이 <b>2초<\/b> <b>증가한다<\/b>.","r":2,"c":"sa","it":"key"},{"id":"Addon_Key_WeddingRing","ko":"특별한 웨딩 반지","en":"Unique Wedding Ring","d":"설명할 수 없고 이해도 할 수 없는 기운이 서린 결혼반지. 글자가 새겨져 있으며 안갯속에서 나왔다. 집착 대상과 당신은 언제나 서로의 오라를 볼 수 있다.살인마의 집착 대상이 될 확률이 <b>감소한다<\/b>.","r":3,"c":"sa","it":"key"},{"id":"Addon_Killer_Halloween2020","ko":"블라이트 점액","en":"Blight Serum","d":"소량의 화합물 34. 블라이트가 변형되기 전에 완성한 점액. 과다 복용 시 돌연변이가 된다.<br><br>소비할 때까지 살인마의 능력을 대체하는 <i>황폐화된 질주<\/i> 발동 <b>차지를 1회<\/b> 획득할 수 있다. <i>능력 버튼<\/i>을 눌러 <i>황폐화된 질주<\/i>를 발동할 수 있으며, 해당 능력으로 재빠르게 돌진할 수 있다.<i>황폐화된 질주<\/i>동안 공격을 할 수 없다.또한 생존자를 갈고리에 걸 때마다 <i>황폐화된 질주<\/i> 발동 <b>차지를 1회 추가<\/b> 획득한다. 단, 최대 <b>1회<\/b>.<i>이 애드온은 특정 살인마에게 알려지지 않은 영향을 미칠 수 있다.<\/i><i>데이라이트의 출몰 이벤트 기간에만 사용 가능하다.<\/i>","r":0,"c":"ka"},{"id":"ADDON_Lastbreath_AtaxicRespiration","ko":"운동실조증","en":"Ataxic Respiration","d":"긴장증 소년에게서 수집한 불규칙하고 악화되어가는 숨결. 평소에는 안정적이고 차분하지만 너스의 손길이 닿으면 심하게 흔들린다.<br><br>기본 점멸 후 탈진 시간이 <b>7%<\/b> <b>감소한다.<\/b>","r":2,"c":"ka","o":"Nurse"},{"id":"ADDON_Lastbreath_BadManLastBreath","ko":"\"배드맨\"의 마지막 숨결","en":"\"Bad Man's\" Last Breath","d":"크로투스 프렌 정신병원의 환자 '배드맨'에게서 낚아챈 강력한 마지막 숨결. 너스의 손 안에서 강하게 덜컥거린다.<br><br>점멸 공격으로 생존자 타격에 성공하면 너스의 <b>감지 불가능<\/b> <b>25초<\/b> 동안 지속된다. 이 효과는 <b>45초<\/b>에 한 번만 발동된다.<br><br>감지 불가능은 살인마의 오라, 공포 범위, 그리고 붉은 불빛을 볼 수 없게 만든다.","r":3,"c":"ka","o":"Nurse"},{"id":"ADDON_Lastbreath_DullBracelet","ko":"색이 바랜 팔찌","en":"Dull Bracelet","d":"불안증 소녀의 시체에서 주운 팔찌. 싸구려지만 누군가에게는 중요한 물건이었을 것이다.<br><br>점멸의 최대 이동 거리를 <b>20%<\/b> <b>감소시킨다<\/b>.정확한 점멸의 블러드포인트를 <b>100%<\/b> <b>증가시킨다<\/b>.","r":1,"c":"ka","o":"Nurse"},{"id":"ADDON_Lastbreath_HeavyPanting","ko":"무거운 헐떡임","en":"Heavy Panting","d":"잡역부에게서 훔친 부풀어 오르는 느린 숨결. 너스의 손길이 닿자 약하게 진동한다.<br><br>두 번째 점멸부터 돌진 지속 시간이 <b>10%<\/b> <b>연장된다<\/b>.","r":2,"c":"ka","o":"Nurse"},{"id":"ADDON_Lastbreath_JennerLastBreath","ko":"\"제너\"의 마지막 숨결","en":"Jenner's Last Breath","d":"크로투스 프렌 정신병원의 환자 '매리 제너'에게서 빼앗은 강력한 마지막 숨결. 너스의 손 안에서 강하게 떨린다.<br><br><b>너스<\/b>가 모든 점멸로 탈진된다면, <b>너스<\/b>는 <i>능력 활성화 버튼<\/i>을 눌러 점멸을 사용하기 이전 위치로 돌아간다.반드시 <b>너스<\/b>가 탈진으로 쓰러지기 전에 작동시켜야 한다.이전 위치로 돌아가면, <b>너스<\/b>에게는 한 번의 점멸 차지가 생긴다.","r":3,"c":"ka","o":"Nurse"},{"id":"ADDON_Lastbreath_KavanaghLastBreath","ko":"\"카바나\"의 마지막 숨결","en":"Kavanagh's Last Breath","d":"크로투스 프렌 정신병원의 잡역부 '하비 카바나'에게서 빼앗은 강력한 마지막 숨결. 너스의 손 안에서 강하게 흔들린다.<br><br>탈진으로 쓰러지면, <b>너스<\/b>의 <b>8미터<\/b> 범위 내에 있는 모든 생존자는 <b>60초<\/b> 동안 <b>실명<\/b> 상태 이상에 빠진다.<br><br>실명된 생존자는 오라를 볼 수 없게 된다.","r":3,"c":"ka","o":"Nurse"},{"id":"ADDON_Lastbreath_Matchbox","ko":"성냥갑","en":"Matchbox","d":"특이하게 짝이 맞지 않는 단추를 수집해놓은 성냥갑. 끔찍한 장소를 떠올리게 한다.<br><br>연속 점멸 최대 횟수가 <b>1<\/b>로 설정된다.너스의 기본 이동 속도를 <b>초당 4.4미터<\/b>로 증가시킨다.","r":4,"c":"ka","o":"Nurse"},{"id":"ADDON_Lastbreath_SpasmodicBreath","ko":"경련성 호흡","en":"Spasmodic Breath","d":"배드맨'에게서 빼앗은 불안하고 떨리는 숨결. 너스의 손길이 닿으면 공격적으로 고동치며 뛰어오른다.<br><br>생존자를 점멸 공격으로 타격하면 <b>너스의 점멸 능력이 무력화되고<\/b> 너스의 기본 이동 속도가 <b>60초<\/b> 동안 <b>4.6 m/s<\/b>로 증가한다.","r":2,"c":"ka","o":"Nurse"},{"id":"ADDON_LFChainsaw_AwardWinningChili","ko":"수상 경력을 자랑하는 칠리","en":"Award-Winning Chili","d":"최고급 고기를 갈아 만든 매콤한 칠리.<br><br>충전할 때마다 <b>전기톱 싹쓸이<\/b>의 최대 지속 시간이 <b>0.2초<\/b> <b>증가한다<\/b>.","r":3,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_BeastsMarks","ko":"야수의 흔적","en":"The Beast's Marks","d":"안개 속에 사는 악한 괴물에게 당해서 생긴 전기톱을 뒤덮은 삐죽한 흔적. 난폭한 패배의 기억이 사용자를 실패의 두려움에 빠트린다.<br><br><b>전기톱 싹쓸이<\/b> 이동 속도가 <b>2% 증가한다<\/b>.전기톱을 충전하는 데 걸리는 시간이 <b>12%<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_BegrimedChain","ko":"그을린 체인","en":"Begrimed Chains","d":"만지는 사람의 정신을 혼미하게 하는 더러운 무언가가 묻어있는 체인.<br><br>전기톱에 타격을 입은 생존자는 가지고 있던 아이템을 떨어뜨린다.","r":2,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_CarburatorGuide","ko":"카뷰레터 개조 설명서","en":"Carburetor Tuning Guide","d":"조잡한 설명서. 전기톱의 카뷰레터를 개조하고 이를 적절하게 조정하는 방법이 그려져 있다.<br><br><b>전기톱 싹쓸이<\/b>를 발동하면 자동으로 모든 공격을 소모한다.<b>전기톱 싹쓸이<\/b>의 지속 시간이 <b>0.5초 증가한다<\/b>.<b>전기톱 싹쓸이<\/b>의 이동 속도가 <b>2% 감소한다<\/b>.","r":4,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_ChainsawFile","ko":"전기톱 줄","en":"Chainsaw File","d":"전기톱의 체인을 날카롭도록 다듬는 줄칼.<br><br>울부짖음 지속 시간이 <b>0.25초<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_Chili","ko":"칠리","en":"Chili","d":"보기만 해도 힘이 나는 따뜻한 칠리.<br><br>충전할 때마다 <b>전기톱 싹쓸이<\/b>의 최대 지속 시간이 <b>0.15초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_DepthGaugeRake","ko":"심도계","en":"Depth Gauge Rake","d":"측심기의 각도를 조정하는 도구. 체인이 더 많은 \"나무\"를 썰 수 있게 한다.<br><br><b>1<\/b>개의 추가 전기톱 충전이 제공된다.전기톱을 충전하는 데 걸리는 시간이 <b>22%<\/b> <b>증가한다<\/b>.<b>전기톱 싹쓸이<\/b>의 이동 속도가 <b>2%<\/b> <b>감소한다<\/b>.","r":3,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_GrislyChains","ko":"소름끼치는 체인","en":"Grisly Chain","d":"거대한 톱날을 가진 체인, 이 톱날에 베인 희생자는 치료하더라도 후유증이 남게 된다.<br><br>전기톱에 타격을 입은 생존자는 <b>70초<\/b> 동안 <b>깊은 상흔<\/b>에 빠진다.<br><br>깊은 상흔은 치료에 걸리는 시간을 25% 증가시키며 설정된 기간 동안 또는 완전히 치료될 때까지 계속 지속된다.","r":2,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_HomemadeMuffler","ko":"수제 소음기","en":"Homemade Muffler","d":"검은색 가스 파이프로 만든 임시 배기 시스템.<br><br>울부짖음 지속 시간이 <b>0.5초<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_IridescentFlesh","ko":"핏빛 육체","en":"Iridescent Flesh","d":"매끈하고 젊은 육체가 얇게 잘려있다. 정맥은 여전히 생명이 붙어 있는 것처럼, 휘황찬란하게 빛난다.<br><br>전기톱으로 생존자를 때리면 재충전된다.최대 울부짖음 지속 시간이 <b>3초<\/b>로 제한된다.","r":4,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_KnifeScratches","ko":"칼날의 흔적","en":"Knife Scratches","d":"칼날에 의해 전기톱의 몸통이 긁힌 흔적. 패배의 기억이 사용자를 실패의 두려움에 빠트린다.<br><br><b>전기톱 싹쓸이<\/b>의 이동 속도가 <b>1.5% 증가한다<\/b>.전기톱을 충전하는 데 걸리는 시간이 <b>10%<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_LightChassis","ko":"경량 섀시","en":"Light Chassis","d":"짧은 가이드 바를 사용한 가볍고 내구성 좋은 전기톱 섀시. 전기톱을 다루기 쉽게 만든다.<br><br>회전 속도를 올리는 동안 <b>8 미터<\/b> 내에 있는 생존자들의 오라를 볼 수 있다.","r":3,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_LongGuideBar","ko":"긴 가이드 바","en":"Long Guide Bar","d":"긴 체인을 사용하기 위한 단단한 강철 봉.<br><br>울부짖음 발동 전 전기톱을 다시 사용하는 데 걸리는 시간이 <b>2초<\/b> <b>증가한다<\/b>.","r":1,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_PrimerBulb","ko":"뇌관 전구","en":"Primer Bulb","d":"빠르고 강하게 시동을 걸기 위해 점화 시스템에 더 많은 연료를 공급한다.<br><br>재충전하는 데 걸리는 시간이 <b>1초<\/b> <b>감소한다<\/b>.","r":1,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_RustedChain","ko":"녹슨 체인","en":"Rusted Chain","d":"녹슬고 더러워 부상을 치료하는 것을 더 어렵게 만드는 체인.<br><br>전기톱에 타격을 입으면 <b>90초<\/b> 동안 <b>치료 불능<\/b> 상태에 빠진다.<br><br>치료 불능 상태의 생존자는 치료를 할 수 없다.","r":3,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_ShopLubricant","ko":"평범한 윤활유","en":"Shop Lubricant","d":"전기톱에 사용하기 위해 특별히 배합된 오일. 특수 첨가물이 누액을 방지한다.<br><br>공포 범위 내에 다른 생존자가 없을 때, 전기톱으로 생존자를 쓰러뜨리면 <b>20초<\/b> 동안 생존자의 오라가 감춰진다.","r":2,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_SparkPlug","ko":"점화 플러그","en":"Spark Plug","d":"전기톱에 딱 맞게 설계된 점화 플러그.<br><br>재충전하는 데 걸리는 시간이 <b>0.5초<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_SpeedLimiter","ko":"속도 제어기","en":"Speed Limiter","d":"전기톱 엔진이 한번에 사용할수 있는 연료의 양을 제한하여 일정하고 안전한 속도를 내게 해주는 기계장치.<br><br>생존자들이 전기톱에 맞아도 빈사 상태가 되지 않는다.전기톱 타격을 사용하여 얻는 기만 항목의 블러드포인트가 <b>100%<\/b> 증가한다.","r":0,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_TheGrease","ko":"구리스","en":"The Grease","d":"소이어가 만든 찐득한 노란색 윤활유. 다목적 윤활제로 집안 곳곳에서 사용된다.<br><br>울부짖음 발동 전 전기톱을 다시 사용하는 데 걸리는 시간이 <b>3초<\/b> <b>증가한다<\/b>.","r":2,"c":"ka","o":"Cannibal"},{"id":"ADDON_LFChainsaw_VegetableOil","ko":"식물성 기름","en":"Vegetable Oil","d":"낮은 품질의 윤활유. 산패한 기름때문에 냄새가 고약하다.<br><br>전기톱의 재사용 대기 시간이 <b>0.3초<\/b> <b>감소한다<\/b>.","r":0,"c":"ka","o":"Cannibal"},{"id":"Addon_Map_001","ko":"빛나는 잉크","en":"Glowing Ink","d":"일부 이미지는 페이지에서 바로 튀어나오는 것처럼 보였다.<br><br>지도 내 오라가 드러나는 시간이 <b>2초<\/b> <b>증가한다<\/b>.","r":0,"c":"sa","it":"map"},{"id":"Addon_Map_002","ko":"지연성 젤리","en":"Retardant Jelly","d":"끈적하고 반투명한 젤리. 무엇으로 만들었는지는 알 수 없지만 열에 매우 강하고 어쩐지 섬뜩한 느낌의 라벤더 색이다.<br><br>지도가 소모되는 속도를 <b>20%<\/b> <b>늦춰 준다<\/b>.","r":1,"c":"sa","it":"map"},{"id":"Addon_Map_003","ko":"울퉁불퉁한 나침반","en":"Gnarled Compass","d":"항상 완벽한 거리를 유지하는 것 같다.<br><br>지도의 내구도가 <b>2<\/b> <b>증가한다<\/b>.","r":1,"c":"sa","it":"map"},{"id":"Addon_Map_004","ko":"진홍빛 도장","en":"Crimson Stamp","d":"절대적인 자신감을 가진 자들만이 지도에 자신의 인장을 찍을 용기를 가진다.<br><br>빛줄기로부터 <b>8미터<\/b> 반경에서 살인마의 오라가 드런난다.빛줄기 지속 시간이 <b>10초<\/b> 감소한다.내구도가 <b>2<\/b> 감소한다.","r":4,"c":"sa","it":"map"},{"id":"Addon_Map_005","ko":"이상한 도장","en":"Odd Stamp","d":"단단한 나무로 만들어진 도장. 하단에는 해석할 수 없는 글귀가 조각되어 있다: \"kw'zvre'od\\.\" 지도에 사용할 수 있다.<br><br>지도의 탐색 범위가 <b>12미터<\/b> <b>증가한다<\/b>.","r":2,"c":"sa","it":"map"},{"id":"Addon_Map_006","ko":"특이한 도장","en":"Unusual Stamp","d":"평행선의 음영 고무패드가 달려 있는 문서용 목제 도장. 어떤 용도로 누가 사용했는지는 알 수 없지만, 지도에 사용할 수 있다.<br><br>지도의 탐색 범위가 <b>8미터<\/b> <b>증가한다<\/b>.","r":1,"c":"sa","it":"map"},{"id":"Addon_Map_007","ko":"날카로운 부싯돌","en":"Sharpened Flint","d":"지도 근처에서 불꽃이 튀면 예상치 못한 위치에 새로운 문양이 나타난다.<br><br>지도를 사용할 때, 범위 내에 모든 토템들이 <b>드러난다<\/b>.","r":3,"c":"sa","it":"map"},{"id":"Addon_Map_008","ko":"부서진 테이프","en":"Battered Tape","d":"양피지 조각들이 지도에 느슨하게 매달려 있었고, 급하게 테이프로 붙여져 있다.<br><br>지도의 최대 범위가 <b>8미터<\/b> <b>증가한다<\/b>.","r":2,"c":"sa","it":"map"},{"id":"Addon_Map_009","ko":"노란색 전선","en":"Yellow Wire","d":"짧은 전선. 양쪽 끝을 힘으로 잡아 뜯은 것 처럼 심하게 훼손되어있다. 이 전선을 지도에 묶으면 오라를 느끼는 능력이 향상된다.<br><br><b>출구의 위치를 탐색<\/b>할 수 있는 능력이 활성화된다.","r":1,"c":"sa","it":"map"},{"id":"Addon_Medkit_001","ko":"붕대","en":"Bandages","d":"구급상자에서 흔히 찾을 수 있는 붕대.<br><br>구급상자에 <b>내구도 8<\/b>을 추가한다.","r":0,"c":"sa","it":"medkit"},{"id":"Addon_Medkit_002","ko":"젤 패드","en":"Gel Dressings","d":"심한 삼출성 부상에 사용하는 젤 패드.<br><br>구급상자에 <b>내구도 16<\/b>을 추가한다.","r":4,"c":"sa","it":"medkit"},{"id":"Addon_Medkit_003","ko":"의료용 가위","en":"Medical Scissors","d":"붕대를 쉽게 자를 수 있게 만든 가위.<br><br>치료 속도가 <b>10%<\/b> <b>빨라진다<\/b>.","r":1,"c":"sa","it":"medkit"},{"id":"Addon_Medkit_004","ko":"다공성 반창고","en":"Butterfly Tape","d":"작은 상처를 봉합하는데 사용하는 의료용 테이프.<br><br>치료 속도가 <b>5%<\/b> <b>상승한다<\/b>.","r":0,"c":"sa","it":"medkit"},{"id":"Addon_Medkit_005","ko":"스펀지","en":"Sponge","d":"평범한 스펀지. 주변의 피를 흡수하여 상처 부위를 잘 확인할 수 있다.<br><br>보너스 스킬 체크 크기가 <b>20%<\/b> <b>증가한다<\/b>.","r":1,"c":"sa","it":"medkit"},{"id":"Addon_Medkit_006","ko":"의료용 장갑","en":"Rubber Gloves","d":"교차 감염을 피하기 위한 일회용 의료 장갑.<br><br>보너스 스킬 체크 크기가 <b>10%<\/b> <b>증가한다<\/b>.","r":0,"c":"sa","it":"medkit"},{"id":"Addon_Medkit_007","ko":"항 출혈제","en":"Styptic Agent","d":"백색 분말 형태의 응고제. 상처에 뿌려서 출혈을 멈출 수 있다.<br><br>구급상자로 스스로를 치료하면 효율이 <b>15%<\/b> 증가한다.","r":3,"c":"sa","it":"medkit"},{"id":"Addon_Medkit_008","ko":"항 탈진 주사기","en":"Anti-Exhaustion Syringe","d":"몸과 마음을 활력화하는 신비한 액체.<br><br>치료받는 동안 <i>추가 상호작용<\/i> 버튼을 누르면, 항 탈진 주사기를 사용할 수 있는 구급상자를 사용할 수 있다.치료제를 맞은 생존자는 <b>탈진<\/b> 상태에서 회복한다.사용 중인 구급상자가 소비된다.<br><br>탈진 상태의 생존자는 탈진 기술을 활성화할 수 없다.","r":4,"c":"sa","it":"medkit"},{"id":"ADDON_medkit_abdominaldressing","ko":"압박 붕대","en":"Abdominal Dressing","d":"복부에 큰 상처가 생겼을 때, 체
